р мамиле кыл.", "problem": "Moral wording differs; second line is not in the story."}], "preview": "../../ky/wisdom-stories/illustrations/avoid-these-questions.webp"}, {"stem": "with-this-nation-the-world-can-be-conquered", "title": "Мындай эл менен дүйнөнү багындырууга болот", "category": "Адилеттүүлүк жана коом", "status": "Needs correction", "items": [{"kind": "title", "image": "Мындай эл менен дүйнөнү багындырууга болот.", "story": "Мындай эл менен дүйнөнү багындырууга болот", "problem": ""}, {"kind": "caption", "image": "Бир күнү падыша элдин жашоосун көрүү үчүн кийимин алмаштырып, шаарды жөнөкөй адам катары кыдырып чыкты.", "story": "Бир күнү падыша калкы кандай жашап жатканын көрүш үчүн кийимин алмаштырып, шаарга чыгат.", "problem": "Wording differs slightly from the story sentence."}, {"kind": "speech", "image": "Мага жарым батман май, жарым батман бал жана эки аз пендир берчи.", "story": "— Мага жарым батман май, жарым батман бал жана бир аз сыр бериңизчи, — дейт.", "problem": "«бир аз сыр» became «эки аз пендир»."}, {"kind": "speech", "image": "Урматтуу, сиздин балыңыз тартып жатат, майыңызда кошулма бар, ал эми бул эки пендир өтө көпкө жаткан — ал сатууга жараксыз. Алла бизге аманат берген нерселерди элдин ден соолугуна зыян келтирип саттык деген уят болот. Башкасын акысыз, ушуларын ала бериңиз.", "story": "— Мырзам, бал менен сырды да бере алам. Бирок сиздин аркаңыз менен бүгүнкү соодамдын башын ачтым. Калганын али соода кыла элек маңдайкы кошунамдан алсаңыз, ыраазы болмокмун.", "problem": "Shopkeeper warns that the goods are spoiled and gives them free, instead of sending the buyer to a neighbor."}, {"kind": "speech", "image": "Аллах ыраазы болсун, улум! Сени бүгүн көрүп таң калдым. Биз падышага кетирген нерсебизди өзүбүз да жеймебиз. Чыныгын айтпасаң, Алла алдында жооп бере албайбыз.", "story": "— Кудайга шүгүр, сиз бүгүнкү соодамдын башын ачтыңыз. Эми сырды тиги коңшу дүкөндөн алыңызчы.", "problem": "Second shopkeeper’s speech is a different meaning."}, {"kind": "speech", "image": "Мындай эл менен дүйнөнү багындырууга болот экен. Чыныгы байлык — ушундай адал эмгекте экен.", "story": "— Бул элде ушундай бийик адеп-ахлак барда бүт дүйнөнү багындырууга болот, — деп, бактылуу жана ыраазы маанайда базардан чыгып кетет.", "problem": "The king’s closing line is reworded and adds a wealth sentence."}, {"kind": "moral", "image": "Сабак: Чыныгы күч куралда эмес, элдин чынчылдыгы менен адал эмгегинде. Жерди эмес, көңүлдү багындыруу — чыныгы жеңиш.", "story": "Сабак: Өз ырыскысы менен кошо кошунасынын ырыскысын ойлогон элдин ынтымагы бекем болот. Чыныгы күч — адал эмгекте, кең пейилде.", "problem": "Moral wording and meaning differ."}], "preview": "../../ky/wisdom-stories/illustrations/with-this-nation-the-world-can-be-conquered.webp"}, {"stem": "he-would-not-have-given-so-little", "title": "Мынчалык аз бербейт эле", "category": "Адеп жана мүнөз", "status": "Needs correction", "items": [{"kind": "title", "image": "Мынчалык аз бермек эмес", "story": "Мынчалык аз бербейт эле", "problem": "бермек эмес instead of бербейт эле."}, {"kind": "caption", "image": "Бир падыша сүйүктүү шагабатына бир кызыл акча бергиси келип, бирок ал акчаны алып койбой койду.", "story": "Бир падыша жолуккан сүйкүмдүү балага бир алтын тыйын берет, бирок бала аны албайт.", "problem": "шагабатына and кызыл акча instead of the boy and a gold coin; the boy’s refusal is missing."}, {"kind": "speech", "image": "Ата, эгер сиз мага «бул акча эмгегимдин натыйжасы» десеңиз, анда гана алар элем.", "story": "Үйгө барганда апам менен атам: «Бул акчаны кайдан уурдадың?» — деп сурашат.", "problem": "Boy addresses the king as father and talks about wages, not about his parents suspecting theft."}, {"kind": "speech", "image": "Анда муну эмнеге бергим келип турат?", "story": "Сен болсо муну падыша берди деп айтасың", "problem": "Different question."}, {"kind": "speech", "image": "Анткени мында эмгек жок, ата. Бул акча алым-салык эмес, жөн эле белек. Ошондуктан мунча аз бермек эмес.", "story": "«Падыша бергенде, мынчалык аз бермек эмес»", "problem": "Talks about labor, tax, and a gift; мунча instead of мынчалык; the parents’ line is missing."}, {"kind": "moral", "image": "Улуу иштер үй-бүлөдөн, туура тарбиядан башталат. Чынчыл өскөн бала эртең чынчыл адам болот.", "story": "Орундуу, тапкыч жооп кээде каардуу адамдын да көңүлүн жибитет. Сөздүн жөнүн билүү — чоң өнөр.", "problem": "Moral is about upbringing, not a well-placed reply."}], "preview": "../../ky/wisdom-stories/illustrations/he-would-not-have-given-so-little.webp"}, {"stem": "bell-to-hang-on-the-cats-neck", "title": "Мышыктын мойнундагы коңгуроо", "category": "Адилеттүүлүк жана коом", "status": "Needs correction", "items": [{"kind": "title", "image": "Мышыктын мойнуна тагыла турган коңгуроо", "story": "Мышыктын мойнундагы коңгуроо", "problem": "Title wording differs."}, {"kind": "caption", "image": "Бир дасторкон тегерегине чогулган мышыктар мышыктын мойнуна коңгуроо тагууну пландаштырышты. Ошондо ал жакындап келе жатканын угуп, качып кутула алышмак.", "story": "Бир топ чычкан чогулуп, башына балээ болгон мышыктан кутулуунун жолун издей баштайт.", "problem": "Calls the mice «мышыктар» and compresses the plan."}, {"kind": "speech", "image": "Бирөө сунуштады: мышыктын мойнуна коңгуроо тагайлы — ал жакындап келе жатканда угуп, сактанабыз.", "story": "Акыры жаш чычкан мышыктын мойнуна коңгуроо тагууну сунуштайт.", "problem": "Proposal is reworded."}, {"kind": "caption", "image": "Сунуш абдан жакты да, баары макул болушту.", "story": "Бул сунушту чычкандардын баары чоң кубаныч жана кол чабуу менен кабыл алат.", "problem": "Acceptance line is shortened."}, {"kind": "speech", "image": "Бирок акылдуу чычкан мындай деп сурады: талап мына ушундай... Мени билсеңиздер, мына мышыктын мойнуна коңгуроону ким тагат?", "story": "— Бул абдан акылдуу сунуш, ишке ашса, ийгиликтүү болорунан шегим жок. Бирок бир суроо мени ойлондурат: айткылачы, коңгуроону мышыктын мойнуна ким тагат?", "problem": "The old mouse’s speech is shortened and altered."}, {"kind": "moral", "image": "План түзүү оңой, аны ишке ашыруу кыйын. Аткарылбаган эң мыкты ой да баасыз.", "story": "Сабак: Сунуш айтуу оңой, аны аткаруу кыйын. Кандай жакшы ой болбосун, аны ким, кантип ишке ашырарын да ойлонуу керек.", "problem": "Moral wording differs."}], "preview": "../../ky/wisdom-stories/illustrations/bell-to-hang-on-the-cats-neck.webp"}, {"stem": "beloved-is-one-who-gives-love-to-people", "title": "Мээрим төккөн мээрим табат", "category": "Сүйүү жана нике", "status": "Needs correction", "items": [{"kind": "title", "image": "Сүйүктүү адам — сүйүүсүн тартуулаган адам", "story": "Мээрим төккөн мээрим табат", "problem": "Title wording differs."}, {"kind": "caption", "image": "Чың булар: ал тез эле ачууланып, агрессивдүү болуп, башкаларды тез эле жек көрчү.", "story": "Бирок көп өтпөй эле кайненеси менен тил табышып жашоо абдан кыйын экенин түшүнөт.", "problem": "The mother-in-law conflict is rewritten."}, {"kind": "speech", "image": "Сен кайра кечигип келдиң!", "story": "", "problem": "This line is not in the story."}, {"kind": "speech", "image": "Мени иште да, үйдө да түшүнбөйт!", "story": "", "problem": "This line is not in the story."}, {"kind": "caption", "image": "Бир күнү Чың кыжалат болуп, Лу-Лу акылман агайдын жанына келди.", "story": "Бир чара көрүү керек деп чечкен келин атасынын эски досу болгон татымал сатуучуга чуркап барып, муңун айтат.", "problem": "Names differ: story is Ли-Ли, not Чың and Лу-Лу."}, {"kind": "speech", "image": "Агай, эмне үчүн мен ушунчалык тез жек көрөм? Кантип өзгөрсөм болот?", "story": "", "problem": "The request for poison is missing."}, {"kind": "speech", "image": "Агай жылмайып мындай деди: Сүйүү — жүрөктөн чыккан нерсе. Аны канчалык көбүрөөк берсең, ошончолук көбөйөт.", "story": "Кары киши ага чөптөрдөн дары даярдап берип, үч ай бою күн сайын кайненесине бышырган тамакка аз-аздан кошууну тапшырат.", "problem": "The herbal “poison” is missing."}, {"kind": "speech", "image": "Бул ачууну эритип, жүрөктү жылмымакканга айлантат. Сүйүү менен мамиле кылсаң, жек көрүү эрийт.", "story": "Чыныгы уу сенин көңүлүңдөгү кек болчу.", "problem": "Wording differs."}, {"kind": "speech", "image": "Ниятыңды сүйүүгө бур, Чың.", "story": "", "problem": "This line is not in the story."}, {"kind": "caption", "image": "Лу-Лу агайдын кеңешин эсинде сактап, Чың адамдарга жылуу мамиле кыла баштады жана сүйүүнү тартуулоого өйрөндү.", "story": "Үйүнө сүйүнүп кайткан Ли-Ли карыянын айтканын так аткара баштайт.", "problem": "Names and wording differ."}, {"kind": "speech", "image": "Жакшы мамиле жасасам, жүрөктөрү да жылмыйт экен.", "story": "Эч ким шектенбесин деп ага абдан жакшы мамиле кылчу.", "problem": "Wording differs."}, {"kind": "caption", "image": "Ар күнү сабырдуу жана жылуу мамиле кылып, Чыңдын жүрүм-туруму акырындан өзгөрө баштады, ал эми башкалар да ага жакшы мамиле кылышты.", "story": "Бир аз убакыттан кийин кайненеси аябай өзгөрүп, келинине өз кызындай мамиле кыла баштайт.", "problem": "Wording differs."}, {"kind": "speech", "image": "Чың, сен азыр мурдагыдан да жакшы болупсуң! Мен сени түшүнүп баштадым.", "story": "кайненеси ... келинине өз кызындай мамиле кыла баштайт.", "problem": "Wording differs."}, {"kind": "caption", "image": "Чың түшүндү: сүйүүнү башкаларга берсе, ал кайра өзүнө жылуулук болуп кайтып келет!", "story": "Сен ага жакшы мамиле кылган сайын, ал уу да эрип, ордун сүйүүгө бошотту.", "problem": "Wording differs."}, {"kind": "speech", "image": "Чоң ырахмат, агай! Мен сүйүүнү берсем, ал мага кайтып келерин түшүндүм. Мен андан ары көбүрөөк сүйүү таратам!", "story": "", "problem": "This speech is not in the story."}, {"kind": "speech", "image": "Агай Чыңга мындай деди:", "story": "Кары киши алдында турган Ли-Лини карап, каткырып күлөт да:", "problem": "Names differ."}, {"kind": "speech", "image": "Уланта бер! Сүйүү менен жашоо — эң чоң күч. Өзүң өзгөрсөң, сени айланаң да өзгөрөт.", "story": "«Кымбаттуу Ли-Ли, мен сага берген нерсе болгону витамин болчу. Чыныгы уу сенин көңүлүңдөгү кек болчу.»", "problem": "The vitamin reveal is missing."}, {"kind": "other", "image": "СҮЙҮҮ ВИТАМИНИ", "story": "мен сага берген нерсе болгону витамин болчу", "problem": "Label is only a fragment of the story line."}, {"kind": "caption", "image": "Чың эми түшүндү: сүйүү канчалык көп берилсе, жек көрүү ошончолук эрийт, ал эми душман доско айланат.", "story": "Ошентип, силер чыныгы эне-баладай болуп калдыңар", "problem": "Wording differs."}, {"kind": "speech", "image": "Бирөөгө сүйүү берсем, жүрөгү да жылмыйт экен. Мен эми бактылуумун!", "story": "", "problem": "This line is not in the story."}, {"kind": "moral", "image": "Каршыңдагы адамга сүйүү менен мамиле кылган сайын жек көрүү эрип, душман доско айланат.", "story": "Көңүлдөгү кек адамдын өзүн ууландырат. Жакшы мамиле кастыкты жумшартып, адамдарды жакындатат.", "problem": "Moral wording differs."}], "preview": "../../ky/wisdom-stories/illustrations/beloved-is-one-who-gives-love-to-people.webp"}, {"stem": "more-effective-way", "title": "Натыйжалуураак жол", "category": "Акылмандык жана өмүр сабактары", "status": "Needs correction", "items": [{"kind": "title", "image": "Натыйжалуураак жол", "story": "Натыйжалуураак жол", "problem": ""}, {"kind": "speech", "image": "Агай бир чоң даракты кеспекчи болду, бирок күңүрт балтасы анча жардам бербей жатты.", "story": "Бир отунчу кыйган дарагын көптөн бери аябай кыйналып балталап жатыптыр. Бетинен тер куюлуп, бүт денеси чыңалып турган экен.", "problem": "Сүйлөөчү жана сөздөр башка; «күңүрт балта» жомоктон жок."}, {"kind": "speech", "image": "Балтаңды бир аз курчутуп алсаң, көп күчүң кетпей, тезирээк бүтөт го?", "story": "— Эмне үчүн ишиңиз ушунчалык оор жана жай жүрүп жатат? Балтаңыз такыр мокоп калыптыр. Бир аз курчутуп албайсызбы?", "problem": "«Мокоп» жок; суроо башка."}, {"kind": "speech", "image": "Эми мени түшүнбөй жатасыңбы? Ушунча убакыттан бери кеспей келем. А эми курчутууга 20 мүнөт коротсом, артка калбаймбы.", "story": "— Эмне деп жатасыз? Балтаны курчутууга убакытты кайдан табам? Алдыда кыйыла турган дагы жыйырма дарак бар!", "problem": "Жыйырма дарак ордуна 20 мүнөт."}, {"kind": "caption", "image": "Курчутпай — көп күч кетет.", "story": "Кара күч менен эле иш бүтпөйт.", "problem": "Сөздөр башка."}, {"kind": "caption", "image": "Курчутсаң — тез жана натыйжалуу.", "story": "Бир аз токтоп, куралыңды курчутсаң, калган ишиң тезирээк, жеңилирээк бүтөт.", "problem": "«Жеңилирээк» жок."}, {"kind": "moral", "image": "Кээде куралды курчутууга кеткен кыска убакыт бүт ишти тездетет.", "story": "Сабак: Кара күч менен эле иш бүтпөйт. Бир аз токтоп, куралыңды курчутсаң, калган ишиң тезирээк, жеңилирээк бүтөт.", "problem": "Сабактын сөздөрү башка."}], "preview": "../../ky/wisdom-stories/illustrations/more-effective-way.webp"}, {"stem": "what-breaks-a-marriage", "title": "Никедеги өчүргүч", "category": "Сүйүү жана нике", "status": "Needs correction", "items": [{"kind": "title", "image": "Никедеги өчүргүч", "story": "Никедеги өчүргүч", "problem": ""}, {"kind": "speech", "image": "Ата, жаңы үйлөнгөн жигит кандай кылса, жубайы менен ынтымакта жашай алат?", "story": "Атасы уулунан ак кагаз, калем жана өчүргүч алып келүүнү суранат.", "problem": "The son asks a different question."}, {"kind": "speech", "image": "Кандай?", "story": "— Эмнеге?", "problem": "The short question differs."}, {"kind": "speech", "image": "Никедеги өчүргүчтү өчүрө бил.", "story": "— Сен алып келчи.", "problem": "Father’s line differs."}, {"kind": "speech", "image": "Ал эмне?", "story": "— Эмне жазайын?", "problem": "The question differs."}, {"kind": "speech", "image": "Кантип өчүрөм?", "story": "", "problem": "This line is not in the story."}, {"kind": "speech", "image": "Айтчы.", "story": "— Каалаганыңды жаз.", "problem": "Wording differs."}, {"kind": "speech", "image": "Инди өчүр.", "story": "— Эми өчүр.", "problem": "Инди is not the story word Эми."}, {"kind": "speech", "image": "Бул эмне үчүн?", "story": "— Кудай үчүн, ата, эмнени каалап жатасыз?", "problem": "Wording differs."}, {"kind": "speech", "image": "Аллахтын ыраазычылыгы үчүн, ата.", "story": "— Кудай үчүн, ата, эмнени каалап жатасыз?", "problem": "The son’s plea is put in the father’s mouth and the wording differs."}, {"kind": "speech", "image": "Биринчи кандай нерсени өчүрөм?", "story": "— Дагы бир сүйлөм жаз.", "problem": "Wording differs."}, {"kind": "speech", "image": "Каарды өчүр.", "story": "Атасы кайра жазганын өчүртөт.", "problem": "Wording differs."}, {"kind": "speech", "image": "Андан кийин чи? Аны кандай өчүрсөм болот?", "story": "— Кагаз али да акпы?", "problem": "The question differs."}, {"kind": "speech", "image": "Ооба, уулум, эки нерсени өчүр. Биринчи — өзүмчүлдүктү жана менменсиңүү. Экинчи — өткөн кемчиликтерди эстеп, кайра-кайра жарасып ачуу иштерди. Мунун үчүн никедеги өчүргүчтү таап, аны дайыма колдонсоң, үйүндө тынчтык болуп, сүйүүңүз бекам болот.", "story": "Ооба, уулум, нике деген өчүргүчсүз болбойт... Жубайыңдан көрүп, жактырбаган айрым нерселерди өчүрүш үчүн өзүң менен өчүргүч алып жүрүшүң керек.", "problem": "The explanation adds faults that are not in the story and changes the wording."}, {"kind": "speech", "image": "Эң маанилүүсү — бири-бирибизди түшүнүү жана урматтоо. Ошондо никеңер берекелүү болот. Өчүргүчтү унутпаңар!", "story": "Өчүргүчтү болсо эч качан унутпагыла!", "problem": "Extra sentences change the wording."}, {"kind": "moral", "image": "Сабак: Нике — кечире билүү өнөрү. Сүйүү менен урмат-сый улансын десеңер, эки тарап тең бири-биринин кемчилигин «өчүрө» билиши керек..", "story": "Үй-бүлөнүн ынтымагы кечиримден бекемделет. Бири-бириңердин майда кемчилигиңерди улам санай бербей, сыйлашып жашагыла.", "problem": "Moral wording differs."}], "preview": "../../ky/wisdom-stories/illustrations/what-breaks-a-marriage.webp"}, {"stem": "newtons-second-law", "title": "Ньютондун 2-мыйзамы", "category": "Акылмандык жана өмүр сабактары", "status": "Needs correction", "items": [{"kind": "title", "image": "«Ньютондун 2-мыйзамы»", "story": "Ньютондун 2-мыйзамы", "problem": ""}, {"kind": "caption", "image": "Физиканы мугалимдин чыгып түшүндүрүүсүнөн окуучулар пайда көрөт.", "story": "Физика мугалими сабактан чыгып, мугалимдер бөлмөсүнө кирет да, кесиптештерине даттанат", "problem": "Даттануу жок; маани башка."}, {"kind": "other", "image": "МУГАЛИМДЕР БӨЛМӨСҮ", "story": "мугалимдер бөлмөсүнө кирет", "problem": ""}, {"kind": "other", "image": "БИЛИМ КҮЧТҮҮ КУРАМ", "story": "", "problem": "Жомоктон жок."}, {"kind": "speech", "image": "Бул табиятта көп кездешет! Ньютондун 2-мыйзамы муну көрсөтөт: мен үйрөндүм, ошондо башкаларга да жеткиргим келди.", "story": "«Бул студенттер кандай гана акылсыз! Ньютондун 2-мыйзамын аларга үч жолу түшүндүрдүм. Акырында атүгүл өзүм да түшүндүм, бирок алар дагы эле түшүнгөн жок».", "problem": "Студенттер түшүнбөгөнү жана үч жолу түшүндүргөнү жок."}, {"kind": "other", "image": "БИЛИМ / ТҮШҮНҮК / ТАЖРЫЙБА / САБЫР", "story": "", "problem": "Жомоктон жок."}, {"kind": "moral", "image": "«Башкага үйрөткүсү келген адам адегенде өзү толук түшүнүшү керек.»", "story": "Сабак: Үйрөтүүдөн мурда өзүң түшүн. Анан угуучуга жеткидей жөнөкөй тил менен түшүндүрүүнүн жолун тап.", "problem": "«Жөнөкөй тил менен» жок."}], "preview": "../../ky/wisdom-stories/illustrations/newtons-second-law.webp"}, {"stem": "how-can-i-escape-my-thoughts", "title": "Ойлорумдан кантип кутулам", "category": "Адеп жана мүнөз", "status": "Needs correction", "items": [{"kind": "title", "image": "«Ойлорумдан кантип кутулам?»", "story": "Ойлорумдан кантип кутулам", "problem": ""}, {"kind": "caption", "image": "Бир адам бир күнү акылман кишиден ойлорунан кантип кутула аларын сурайт:", "story": "Күндөрдүн биринде бир адам өз доорунун аалымдарынын бирине келип сурайт:", "problem": "акылман кишиден instead of өз доорунун аалымдарынын бирине."}, {"kind": "speech", "image": "Устат, менин ойлорум мени эзет. Ойлорумдан кантип кутулам?", "story": "Мени туткундап алган азаптуу ойлордон кантип кутулам?", "problem": "Reworded; эзет is not in the story."}, {"kind": "speech", "image": "Бул мамыны кармап турчу, ажыратпай, канчалык мүмкүн болсо...", "story": "Мени бул мамыдан ажыраткыла, андан куткаргыла!", "problem": "The sage appears to ask to keep holding the pillar; the story has him cry to be separated from it."}, {"kind": "speech", "image": "Устат, менин колум ооруп жатат. Мен муну узак кармап тура албайм. Өтө оор болуп жатат, суранам, ажыратып койсом болобу?", "story": "Мамыны сиз өзүңүз кармап турасыз, ал сизди кармаган жок. Коё бериңиз, ошондо кутуласыз!", "problem": "Visitor complains his arm hurts and asks permission to let go; story has him tell the sage to let go."}, {"kind": "speech", "image": "Мен өзүм эле туташ турам, ажыратпайм. Суранам устат, кайсы убакка чейин кармайм?", "story": "Коё бериңиз, ошондо кутуласыз!", "problem": "Different speech."}, {"kind": "speech", "image": "Азыр каалаган убагында ажырата бер. Устат сени болгону сынады. Мамы сени эзген жок, аны кармап турганың – өзүң.", "story": "Ойлор сени эмес, сен аларды кармап турасың! Аларды коё бер, ошондо өзүң да кутуласың.", "problem": "Says the master was only testing him; the pillar image is not tied back to thoughts in these words."}, {"kind": "moral", "image": "Сени эзген ойлорду өзүң кармап турасың; аларды коё берүү да өз колуңда.", "story": "Ойлор сени эмес, сен аларды кармап турасың! Аларды коё бер, ошондо өзүң да кутуласың.", "problem": "эзген and өз колуңда are not the story wording; the lesson sentence is also different."}], "preview": "../../ky/wisdom-stories/illustrations/how-can-i-escape-my-thoughts.webp"}, {"stem": "o-god-give-first-to-the-mountains-and-stones", "title": "Оо, Кудайым, адегенде тоо-ташка бер", "category": "Иман жана руханият", "status": "Needs correction", "items": [{"kind": "title", "image": "«Оо, Кудайым, адегенде тоо-ташка бер»", "story": "Оо, Кудайым, адегенде тоо-ташка бер", "problem": ""}, {"kind": "speech", "image": "Байыркы түрктөрдүн арасында бир жоомарттык тууралуу баян бар.", "story": "Байыркы түрк элдеринде мындай дуба болгон экен:", "problem": "A tale of generosity instead of a prayer."}, {"kind": "speech", "image": "Оо, Кудайым, адегенде тоо-ташка бер, мал-жандыкка, суусакка бер.", "story": "— Оо, Теңирим, адегенде тоо-ташка, токойго, жаныбарларга, сууга бер.", "problem": "«Кудайым» for «Теңирим»; «мал-жандыкка, суусакка» instead of forest, animals, and water."}, {"kind": "speech", "image": "Андан кийин адамдарга, кедей-кепшикке бер. Эгер ашык калса, анда өзүңө бер!", "story": "Андан кийин адамдарга, каалгалаш кошунама, муктаждарга бер. Эгер андан артса, эң акырында мага бер!", "problem": "«кедей-кепшикке» and «өзүңө бер» instead of the neighbor, the needy, and «мага бер»."}, {"kind": "moral", "image": "Чыныгы жоомарттык — адегенде башкаларды, анан өзүңдү ойлоо.", "story": "Сабак: Кең пейил адам өзүнөн мурда өзгөнүн камын ойлойт. Ырыскыны бөлүшө билүүдө элдин ынтымагы, табиятка болгон урматы көрүнөт.", "problem": "Different lesson."}], "preview": "../../ky/wisdom-stories/illustrations/o-god-give-first-to-the-mountains-and-stones.webp"}, {"stem": "o-god-heal-our-sorrows", "title": "Оо, Кудайым, дарттарыбызга даба бер", "category": "Иман жана руханият", "status": "Needs correction", "items": [{"kind": "title", "image": "«Оо, Кудайым, дарттарыбызга даба бер»", "story": "Оо, Кудайым, дарттарыбызга даба бер", "problem": ""}, {"kind": "moral", "image": "Адам чын дилден дуба кылганда жүрөгү тынчтык табат. Дуба — үмүттүн тили.", "story": "Чын жүрөктөн кылган дуба көңүлгө тынчтык, жанга үмүт берет.", "problem": "Wording differs: чын дилден / жүрөгү тынчтык табат / Дуба — үмүттүн тили versus чын жүрөктөн / көңүлгө тынчтык, жанга үмүт берет."}], "preview": "../../ky/wisdom-stories/illustrations/o-god-heal-our-sorrows.webp"}, {"stem": "dont-open-your-mouth", "title": "Оозуңду ачпа", "category": "Адеп жана мүнөз", "status": "Needs correction", "items": [{"kind": "title", "image": "Оозуңду ачпа", "story": "Оозуңду ачпа", "problem": ""}, {"kind": "speech", "image": "«Эгер оозунда сөз бар болсо, айтуу үчүн ачылат, эгер сөзүң жок болсо, ачпа.»", "story": "Оозуңду жакшы сөз айтуу үчүн ачпасаң, такыр ачпа.", "problem": "Condition is “if there is a word,” not “if you will not say a good word.”"}, {"kind": "caption", "image": "Сөздү тандоо натыйжаны өзгөртөт.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Жакшы сөз жараны айыктырат, кайгыны азайтат, жүрөктү жылытат.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Катуу сөз жүрөктү жаралайит, ириштират, пикирди сынат.", "story": "", "problem": "Not in the story; жаралайит is misspelled."}, {"kind": "other", "image": "НАСААТ", "story": "Сабак", "problem": "Label is not the story word."}, {"kind": "moral", "image": "«Сөздүн күчү — аны орундуу жана жакшылыкка колдонууда. Айтаар сөзүң жок болсо, унчукпоо катуураак сүйлөйт.»", "story": "Орундуу сөздүн баркы бийик. Жакшы сөз айта албасаң, унчукпай койгон оң.", "problem": "Different moral; катуураак сүйлөйт is not in the story."}], "preview": "../../ky/wisdom-stories/illustrations/dont-open-your-mouth.webp"}, {"stem": "to-be-fasting", "title": "Орозо кармоо", "category": "Иман жана руханият", "status": "Needs correction", "items": [{"kind": "title", "image": "Орозо кармоо", "story": "Орозо кармоо", "problem": ""}, {"kind": "caption", "image": "Рамазан айында бир адамдын жашын көрүп, ал орозо кармайт деп ойлодум.", "story": "Рамазан айында бир нече жигит карыянын четте отуруп тамак жеп жатканын көрөт.", "problem": "Different scene: one man guessing by age versus several young men seeing an elder eating."}, {"kind": "speech", "image": "Ата, ачуусун жеп, ичүүсүн токтотуп, ошону эле орозо дейсизби?", "story": "Эмне болду, аксакал, тамак жеп жатасыз, орозо эмессизби?", "problem": "Different question and wording."}, {"kind": "speech", "image": "Балдарым, оозду гана эмес, жүрөктү да орозо кармоо керек.", "story": "Албетте, орозомун, болгону суу ичип, тамак жеп жатам.", "problem": "Different reply; story has the elder say he is fasting but still eating and drinking."}, {"kind": "speech", "image": "Демек, орозо кармоо оозду гана кармоо эмеспи?", "story": "Бул кандай орозо?", "problem": "Different question."}, {"kind": "speech", "image": "Балдарым, калп айтуу, ушактоо, кемсинтүү, бирөөнү жаман көрүү, көңүлүгүн калтыруу, ачуулануу, нааразы болуу, башканы жаман сөз менен сөөктөө – мунун баары орозонун жарыгын өчүрөт. Орозо ичегин гана эмес, жүрөктү, тилди жана кулакты да тазалоо үчүн.", "story": "Албетте, орозомун. Калп айтпайм, эч кимге жаман көз менен карабайм, эч кимди шылдыңдабайм, ысырап кылбайм, эч кимди кемсинтпейм, ушак айтпайм, бирөөнүн мал-мүлкүнө көз артпайм.", "problem": "Paraphrase with extra sins and missing the illness that keeps him from fasting with his stomach."}, {"kind": "speech", "image": "Эгер ушулардан сактанбасак, орозубуз толук болобу?", "story": "А силер орозосуңарбы?", "problem": "Different question."}, {"kind": "speech", "image": "Ооба, ата, орозо жалаң тамактан тыйылуу эмес, жүрөктү жана жакшы жүрүм-турумду тазалоо.", "story": "Жок, орозо эмеспиз, болгону тамак жебейбиз.", "problem": "Meaning reversed: the young men agree, but in the story they admit they are not fasting."}, {"kind": "moral", "image": "Сабак: Адам тамактан тыйылып, бирок калптан, ушактан, кемсинтүүдөн жана жаман иштен тыйылбаса, орозонун руханий маңызын толук жашабайт.", "story": "Орозонун маңызы тамактан тыйылуу менен эле бүтпөйт. Тилди калптан, көңүлдү жамандыктан, колду кыянаттыктан да тый.", "problem": "Different wording; story also names the hand and injustice."}], "preview": "../../ky/wisdom-stories/illustrations/to-be-fasting.webp"}, {"stem": "weeds-must-be-pulled-from-the-root", "title": "Отоо чөптү тамыры менен жулуш керек", "category": "Үй-бүлө жана тарбия", "status": "Needs correction", "items": [{"kind": "title", "image": "Отоо чөптү тамыры менен жулуш керек.", "story": "Отоо чөптү тамыры менен жулуш керек", "problem": ""}, {"kind": "caption", "image": "Жай мезгилинде ата балдарына жашылча бакчасын сугарууга, отоо чөптү жулууга тапшырма берди.", "story": "Мектепте окуп жүргөндө жайкы каникулду үй-бүлөбүз менен бакчабызда өткөрчүбүз. Жашылча эгип койгон, аны сугаруу биздин милдет эле.", "problem": "Shortened; the well, the neighbor, and the shovel method are missing."}, {"kind": "caption", "image": "Балдар отоо чөптү жулуп, азгы гана мулярды калтырып коюшту.", "story": "күрөк менен жердин астын үстүнө оодарып, отоо чөптөрдү жанчып-сындырар элек.", "problem": "Different method; мулярды is not a clear story word."}, {"kind": "speech", "image": "Ата балдарына мындай деди: «Отоо чөптү жөн эле жулсаң, көп өтпөй кайра чыгат; тамыры менен жулуш керек.»", "story": "Отоо чөптү жок кылгыңар келсе, күрөктү терең сайгыла; тамырын жулмайынча иш бүтпөйт", "problem": "Missing the deep shovel; different wording."}, {"kind": "caption", "image": "Балдар атасынын айткандарын уклушуп, отоо чөптү тамыры менен жулушту.", "story": "", "problem": "The story ends with the father's explanation; this result is not told."}, {"kind": "moral", "image": "Сабак: Көйгөйдү да, жаман адатты да тамыры менен жулбасаң, үстүртөн тазалык алдамчы — бир аздан кийин кайра баш көтөрөт.", "story": "Көйгөйдүн сырткы белгисин гана жойбо, себебин тап. Тамыры калган отоо кайра өнгөндөй, чечилбеген маселе да кайтып келет.", "problem": "Different moral wording; adds жаман адат."}], "preview": "../../ky/wisdom-stories/illustrations/weeds-must-be-pulled-from-the-root.webp"}, {"stem": "baklava", "title": "Пахлава", "category": "Эмгек, ырыскы жана байлык", "status": "Requires manual review", "items": [{"kind": "title", "image": "Пахлава", "story": "Пахлава", "problem": ""}, {"kind": "speech", "image": "Биздин байлыгыбыз аз, бирок эч кимден кем эмеспиз...", "story": "Балалык жылдарымда үй-бүлөбүз жупуну турмушта жашачу.", "problem": "Сөздөрү башка."}, {"kind": "caption", "image": "Бүгүн да апас н кызматым чоң болду. Бирок өз үйүмө суу да жеңил келбейт экен.", "story": "Бул дүйнөдө үйүбүзгө суу берилбегени үчүн кайгырбайбыз.", "problem": "He regrets the missing water instead of refusing to grieve."}, {"kind": "speech", "image": "Синан досторун жана шакирттерин чогултуп, аларга мындай деди: «Даңкка ашыкпаңар. Чыныгы кызмат — элге пайда берүү. Ният таза болсо, Аллах ыраазы болот.»", "story": "", "problem": "This gathering speech is not in the story."}, {"kind": "caption", "image": "Синан 100 жашка жакындап, өз үйүндө, суу жок абалда дүйнөдөн өттү.", "story": "Өмүрүнүн акыркы жылдарында Синан ооруп, төшөккө жатып калды.", "problem": "Age 100 and the death scene are added."}, {"kind": "speech", "image": "Мен өз өмүрүмдү элге арнадым. Эгер бул кызмат Аллах үчүн болсо, мен бактылуумун. Даңк өткөнчө, чыныгы кызмат калат.", "story": "— Биз кызматыбызды пайда үчүн эмес, Кудайдын ыраазылыгы үчүн кылдык. Сыйлыгын да акыреттен күтөбүз.", "problem": "Last words differ."}, {"kind": "other", "image": "Суунун сакталышы — өмүрдүн сакталышы.", "story": "", "problem": "This line is not in the story."}, {"kind": "moral", "image": "Дүйнөгө жана атак-даңкка ашыкча ишенбе. Чыныгы кызмат пайда үчүн эмес, акыйкат үчүн жасалат.", "story": "Сабак: Дүнүйөгө, атак-даңкка, адамдардын убадасына ашыкча таянба. Элге кызмат кылсаң, жеке пайдаңды көздөбөй, ак ниетиң менен кыл.", "problem": "Moral replaces «ак ниет» with «акыйкат» and drops the promises."}], "preview": "../../ky/wisdom-stories/illustrations/architect-sinan-dies-in-a-house-without-water.webp"}, {"stem": "from-the-memoirs-of-a-lady-from-istanbul", "title": "Стамбулдук бир айымдын эскерүүлөрүнөн", "category": "Акылмандык жана өмүр сабактары", "status": "Needs correction", "items": [{"kind": "title", "image": "«Стамбулдук бир айымдын эскерүүлөрүнөн»", "story": "Стамбулдук бир айымдын эскерүүлөрүнөн", "problem": ""}, {"kind": "caption", "image": "1919-жылы эле. Стамбул үчүн оор, кыйын мезгил эле. Базарлар кыймылсыз, элдин көпчүлүгү жакырчылык менен киреше көрүп жаткан. Ошол күндөгү мен, бир айым, колумдагы бир нече сайма менен үй-бүлөмдү багыш үчүн тинишисиз эмгектенчүмүн.", "story": "1919-жыл эле. Стамбул толугу менен англиялыктардын баскынчылыгы алдында болчу. Орто мектепти жаңы эле бүткөм.", "problem": "Баскынчылык жана мектеп жок; базар, сайма кошулган."}, {"kind": "caption", "image": "Бир күнү базарга кийим-кече сатууга чыктым. Айрымдары менин жөнөкөй кийимиме жана эскилиги жеткен көрүнүшүмө карап, ырыскыма шек келтиришти.", "story": "Бир күнү аймакка ушак тарады. «Айшенин сүйлөшкөн жигити адвокат эмес экен, мечиттин алдында табыт көтөрүп жан багат турбайбы»", "problem": "Адвокат жана табыт ушагы жок."}, {"kind": "caption", "image": "Жогорку жакта турчумун. Атам мешитке намазга барды. Ал адамдардын мени кандай баалаганын көрдү. Жүрөгү ооруп, кайнарды.", "story": "Атам экөөбүз мечитке барып, алыстан байкадык. Анын чынында эле табыт көтөрүп жүргөнүн көрдүк.", "problem": "Табыт көргөнү жок."}, {"kind": "caption", "image": "Ал баарын көрдү. Менин көңүлүм сынардын, үмүтүм өчөрүн түшүндү. Ошол эле күнү тиги соодагердин жанына барып: «Уулум, бул айымдын саймаларына чымындай жаман сөз айтпа. Бул анын эмгеги, үй-бүлөсү үчүн жалгыз таянычы», — деди.", "story": "Катуу селт эттим. Сөйкөнү кайтарып, ажыраштык.", "problem": "Ажырашуу жок; соодагерге коргоо кошулган."}, {"kind": "other", "image": "АХМЕТ ВЕЙ ЮРИДИКАЛЫК КЕҢСЕСИ", "story": "Бул юридикалык фирма экен; эшиктеги тактайчада анын аты жазылып туруптур.", "problem": "«Ахмет Вей» жомоктон жок."}, {"kind": "speech", "image": "Карзың кандай?", "story": "— Чын эле адвокатсыңбы?", "problem": "Суроо башка."}, {"kind": "speech", "image": "Жакшы.", "story": "— Ооба, — деди.", "problem": "Жооп башка."}, {"kind": "speech", "image": "Эгер уруксат берсеңиз, кийинки жолу бир нече нерсени алдырып коём.", "story": "«Мени кечир»", "problem": "Кечирим жана табыт жок."}, {"kind": "speech", "image": "Албетте, жөнөтөм.", "story": "", "problem": "Жомоктон жок."}, {  “Coca-Cola ичсем, оңой өтөт экен”, – деди. Анан бир аз ичип, жутуп койду.»", "story": "Гамбургерди экиге бөлүп, жарымын аялынын алдына коёт, картошканы да бирден санап, тең жарымын ага берет.", "problem": "Different actions."}, {"kind": "speech", "image": "«Артта отурган жигит кызга: “Эмне үчүн алардын тамагын туура чайнабай, суюлтуп жутуп жатышат?” – деп сурады.»", "story": "Айланасындагылар аларды «бир кишиге жетчү тамакты экөө бөлүшүп жатышат, бечаралар» дегендей карап турушат.", "problem": "Different onlooker and question."}, {"kind": "speech", "image": "«Бир убакта жигит ой толгоду: “Бир күнү мен да карып, тиштерим түшүп калат. Анан тамак туура чайналбай, жумшартылып бериши керек болот. Балдарым мага да ушундай кылат окшойт. Ошондо эмне болот экен?”»", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "«Кызуу, уруксат болсо, сиздерден сурайын: бул тиштериңиз эмне үчүн мындай болуп калды? Кантип дагы ушундай болбой сактаса болот, айтып берсеңиздер.»", "story": "Ата, кечиресиз, силерди бир топтон бери карап турам: сиз жеп жатасыз, аялыңыз болсо тамакка кол тийгизген жок.", "problem": "Asks how their teeth got that way, not why she is not eating."}, {"kind": "speech", "image": "«Уулум, жаш кезде тиштерибизди туура караган эмесек. Эми түшүнүп жатабыз. Сен жашсың, тиштериңди жакшы кара, биздей болбо.»", "story": "Рахмат, жигит, бирок бизге ушунун өзү жетет... Алтымыш жылдан бери бирге жашап, бардык нерсебизди ушинтип бөлүшөбүз", "problem": "Dental advice replaces sixty years of sharing."}, {"kind": "speech", "image": "«Окей апа, мен сөз берем: тамагымды жакшы чайнайм, тиштеримди дайыма тазалап, жакшы карайм.»", "story": "Апа, сиз эмне үчүн гамбургериңиз менен картошкаңызды жебей жатасыз, эмнени күтүп отурасыз?", "problem": "Different reply."}, {"kind": "speech", "image": "«Тиштерди күтүп жатам, бала.»", "story": "Тиштерди...! Тиштерди күтүп жатам, балам.", "problem": "бала versus балам; the shared-teeth meaning is not set up by the previous lines."}, {"kind": "moral", "image": "Эч ким сүйгөн адамына көз каранды болуп калбасын.", "story": "Жакының менен барыңды бөлүш, бирок эч ким айласыз муктаждыкка кабылбасын. Жараткан ар кимге жетиштүү ырыскы, өз алдынча жашоого күч берсин.", "problem": "Different moral."}], "preview": "../../ky/wisdom-stories/illustrations/i-am-waiting-for-the-teeth.webp"}, {"stem": "to-be-full-or-to-be-gone", "title": "Ток болуу же жок болуу", "category": "Акылмандык жана өмүр сабактары", "status": "Needs correction", "items": [{"kind": "title", "image": "Ток болуу же жок болуу", "story": "Ток болуу же жок болуу", "problem": ""}, {"kind": "moral", "image": "Сабак: Бөлүшкөндө күчтөнөбүз, бөлүнгөндө жок болобуз. Биримдикти сактоо үчүн билимибиз менен руханий дүйнөбүздү бекем кармашыбыз керек.", "story": "Бөлүшсөк — ток болобуз, бөлүнсөк — жок болобуз. Сабак: Бөлүшкөндүн берекеси артат, бөлүнгөндүн күчү кетет. Ынтымакты, билимибизди, руханий байлыгыбызды чогуу сактайлы.", "problem": "«Ток болобуз» ордуна «күчтөнөбүз»; «берекеси артат» жок; Юнус Эмре жок."}], "preview": "../../ky/wisdom-stories/illustrations/to-be-full-or-to-be-gone.webp"}, {"stem": "life-lesson", "title": "Турмуш сабагы", "category": "Акылмандык жана өмүр сабактары", "status": "Needs correction", "items": [{"kind": "title", "image": "«Турмуш сабагы»", "story": "Турмуш сабагы", "problem": ""}, {"kind": "speech", "image": "Карачы, бул кой. Пайдалуу жан. Ал бизге пайда берет, ошондуктан аны сактайбыз.", "story": "— Карачы, алардын эти даамдуу болот.", "problem": "«Эти даамдуу» ордуна «пайдалуу жан, сактайбыз»."}, {"kind": "speech", "image": "Ата, бул бизге окшош экен.", "story": "— Ата, карачы, тигил бизге окшош экен!", "problem": "«Карачы, тигил» жок."}, {"kind": "speech", "image": "Сырткы көрүнүшү окшош болсо да, ниети башка болушу мүмкүн. Бизге пайда бербесе, атугул зыян келтирсе, сак бололу.", "story": "— Аны көргөндө эле кач, балам. Бизге эң көп зыян келтиргендер — бизге окшошуп туруп, бизден болбогондор.", "problem": "«Кач» жана койчунун таягы жок."}, {"kind": "other", "image": "Жакшы сөзү бар, иши башка. / Сырты жылмаю, ичи арам. / Окшош «жырткычтан» этият бол. / Сырты ак кардай, ичи кара.", "story": "Сырткы окшоштук ниеттин бир экенин билдирбейт.", "problem": "Бул жазуулар жомоктон жок."}, {"kind": "moral", "image": "Адам кээде эң чоң зыянды өзүнө окшош, бирок ниети башка адамдардан көрөт.", "story": "Сабак: Сырткы окшоштук ниеттин бир экенин билдирбейт. Адамдын ким экенин ишинен, сага кылган мамилесинен тааны.", "problem": "«Ишинен, мамилесинен тааны» жок."}], "preview": "../../ky/wisdom-stories/illustrations/life-lesson.webp"}, {"stem": "not-leaving-the-right-path", "title": "Туура жолдон тайбоо", "category": "Иман жана руханият", "status": "Needs correction", "items": [{"kind": "title", "image": "«Туура жолдон тайбоо»", "story": "Туура жолдон тайбоо", "problem": ""}, {"kind": "speech", "image": "«Гүннүн биринде ишсиз жүргөн, акылман, алрымдуу жигит медресеге келип, өз жолун табуу жана маанилүү жашоо өткөрүү үчүн акыл-насаат сурады. Ага акылман туура жолду көрсөтүүнү чечти.»", "story": "жумушсуздуктан, бекерчиликтен жана мурасын жеп, убактысын текке өткөрүүдөн тажаган бир адам туура жолдон тайбай, адал өмүр сүрүү үчүн кеңеш алууну көздөп, падышанын алдына келет", "problem": "Sage and madrasa replace the king; opening wording differs. One word in this bubble is uncertain."}, {"kind": "speech", "image": "«Бул кумурага зайтун майын толтуруп, шаардын аркы башындагы базардан кайра ушул жерге бир тамчы да төкпөй алып кел. Бирок бир шарт бар: жолдо эч ким менен сүйлөшпөйсүң.»", "story": "Оозуна чейин зайтун майы толтурулган бул кумураны ал да, бир тамчысын да төкпөй, шаардын бир четинен экинчи четине жеткир. Бир эле тамчы жерге түшсө, башың алынарын бил.", "problem": "Extra rule not to speak to anyone; missing the death threat. Task is to bring the jug back, not only across the city."}, {"kind": "caption", "image": "Акылман ага кумураны берип, тапшырманы аткаруусу үчүн жиберди.", "story": "Көзөмөлдөө үчүн жанына эки жоокерди кошуп берет.", "problem": "Omits the two soldiers; calls the king a sage."}, {"kind": "speech", "image": "«Жигит бүткүл көңүлүн топтоп, базарда да, көчөдө да эч кимге көңүл бурбай, кумураны бир тамчы да төкпөй кайра акылманга алып келди.»", "story": "Адам болгон күчүн жыйнап, акылын иштетип, бир тамчы да төкпөстөн кумураны шаардын аркы четине жеткирет.", "problem": "He returns the jug to the sage; story has him deliver it to the far side, then come back."}, {"kind": "speech", "image": "«Рахмат, акылман! Эми шаар канчалык кооз экенин байкадым.»", "story": "Падышам, жан соогалап, кумурадагы майды жерге төкпөйүн деп ушунчалык сак болдум, көзүмдү кумурадан бир саамга да алып, айланама карай алган жокмун.", "problem": "Meaning reversed: he says he noticed how beautiful the city is; in the story he saw nothing."}, {"kind": "speech", "image": "Акылман: Шаардын эки башындагы адамдарды көрдүңбү?", "story": "Шаардан эмнелерди көрдүң, кандай окуяларга күбө болдуң?", "problem": "Different question."}, {"kind": "speech", "image": "«Рахмат, акылман, бирок жолдо эч нерсени көргөн жокмун. Көзүм кумурадагы майга, бир тамчы да төгүлбөсүн деп, гана болду. Ошондуктан башка эч нерсени байкаган жокмун.»", "story": "Ошондуктан бир да адамды көргөн жокмун, бир да окуяга күбө болгон жокмун.", "problem": "Close in this bubble, but it contradicts the earlier line that he noticed the city, and the address is акылман, not Падышам."}, {"kind": "caption", "image": "Жигит: Ушул тапшырма мага абдан чоң сабак болду.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "«Эгер ар бир ишиңе толук көңүл бурсаң, сага берилген ар бир милдетти мыкты аткарасың, Аллах берген өмүрүңдүн убактынды өзүн маанисиз нерселерге коротпостон, туура жолдон тайбайсың.»", "story": "Эгер жасаган ар бир ишиңе, сага берилген ар бир милдетке ушундай кылдат мамиле кылып, бүт дитиңди ишиңе бурсаң жана Кудайдын көзү дайыма сенде экенин эсиңден чыгарбасаң, эч качан туура жолдон тайбайсың.", "problem": "Drops that God is always watching; adds not wasting life on meaningless things."}, {"kind": "moral", "image": "«Ар бир ишине бүт көңүлүн бурган адам туура жолдон адашпайт.»", "story": "Милдетиңе бүт дитиңди коюп, абийириңди таза сакта. Ар бир ишиң үчүн жооп берериңди унутпа.", "problem": "Different moral; адашпайт versus тайбайсың, and conscience is missing."}], "preview": "../../ky/wisdom-stories/illustrations/not-leaving-the-right-path.webp"}, {"stem": "no-one-listens-to-constant-complainers", "title": "Тынымсыз даттанган адамды эч ким укпайт", "category": "Адеп жана мүнөз", "status": "Needs correction", "items": [{"kind": "title", "image": "Тынымсыз даттанган адамды эч ким укпайт", "story": "Тынымсыз даттанган адамды эч ким укпайт", "problem": ""}, {"kind": "caption", "image": "Бир кылыч устаканада тынымсыз даттанган киши бар экен.", "story": "Көптү көргөн бир адам ошол эле көйгөйлөрүнө кайра-кайра даттанган бир топ кишиге мындай сабак берет.", "problem": "A complainer in a sword workshop replaces the experienced man teaching a group with a repeated joke."}, {"kind": "caption", "image": "Ал күн сайын ошол эле нерселерге нааразы болуп, даттанып жүрчү.", "story": "Чечим издегендин ордуна улам эле ошол көйгөйлөргө даттана берүү да ушуга окшош.", "problem": "Different sentence."}, {"kind": "caption", "image": "Акыры анын даттануусу кээ бирөөлөрдү тажатты.", "story": "Үчүнчү жолу айтканда болсо, эч кимдин эрди да кыймылдабайт.", "problem": "Says some people got bored; story says nobody even moves their lips."}, {"kind": "caption", "image": "Анын даттануусу башкалардын кулагына кирбей калды.", "story": "Тынымсыз даттанган адамды эч ким укпайт.", "problem": "Reworded."}, {"kind": "caption", "image": "Ошентип, тынымсыз даттануу эч кимди кызыктырбай калды.", "story": "Тынымсыз даттанган адамды эч ким укпайт.", "problem": "кызыктырбай instead of укпайт."}, {"kind": "moral", "image": "Кайталана берген даттануу тез тажатат. Көйгөйүңө чара изде.", "story": "Бир эле муңду кайталай бергенден маселе чечилбейт. Даттанууга кеткен күчтү айла табууга жумша.", "problem": "Different moral."}], "preview": "../../ky/wisdom-stories/illustrations/no-one-listens-to-constant-complainers.webp"}, {"stem": "fallen-teeth", "title": "Түштө түшкөн тиштер", "category": "Үй-бүлө жана тарбия", "status": "Needs correction", "items": [{"kind": "title", "image": "«Түшкөн тиштер»", "story": "Түштө түшкөн тиштер", "problem": "Missing Түштө."}, {"kind": "speech", "image": "Түшүмдө тиштерим түшүп жатты. Жоругумду айтчы!", "story": "Бир падыша түшүндө тиштеринин баары түшүп калганын көрөт да, түш жоруучуну чакыртып, маанисин сурайт.", "problem": "Shortened; missing that all the teeth fell."}, {"kind": "speech", "image": "Арың аман болсун, улуу падыша, бул жаман жышаан эмес, тескерисинче, узак өмүрүңүзгө ишара.", "story": "Падышам, бул бардык тууган-туушкандарыңыз каза болуп, эң акырында сиз дүйнөдөн кайтасыз дегенди билдирет", "problem": "First interpreter gives the pleasant reading; in the story he says the relatives die and the king dies last."}, {"kind": "speech", "image": "Тескери айттың! Дароо орой мааниде айтып бер!", "story": "Падыша каарданып, аны кууп чыгат", "problem": "He demands the harsh meaning; the story drives the first interpreter out after the harsh reading."}, {"kind": "speech", "image": "Башка жоругучуну алып келгиле!", "story": "башка бирөөнү чакыртып", "problem": ""}, {"kind": "speech", "image": "Арын аман болсун, үй-бүлөңүз узакка аманчылыкта болосуз.", "story": "Падышам, үй-бүлөңүздө эң узак өмүр сүргөн адам сиз болосуз", "problem": "The family stays well versus the king living the longest."}, {"kind": "speech", "image": "Сөзүң мага жагымдуу болду, көңүлүмө жай кетти. Белегимди ал!", "story": "Падыша бул жоопко абдан ыраазы болуп, ал кишиге сыйлык берип узатат.", "problem": "Close in meaning; different wording."}, {"kind": "moral", "image": "Бир эле чындыкты орой да, сылык да айтууга болот. Сөз жаралай да, айыктыра да алат.", "story": "Чындыкты айтканда да сөздүн ыңгайын тап. Бир эле ой көңүлдү оорутушу да, жубатышы да мүмкүн.", "problem": "Different moral wording."}], "preview": "../../ky/wisdom-stories/illustrations/fallen-teeth.webp"}, {"stem": "bedouin-whose-camel-was-stolen", "title": "Төөсү уурдалган бедуиндин окуясы", "category": "Адилеттүүлүк жана коом", "status": "Needs correction", "items": [{"kind": "title", "image": "«Төөсү уурдалган бедуин»", "story": "Төөсү уурдалган бедуиндин окуясы", "problem": "Title drops «дин окуясы»."}, {"kind": "caption", "image": "Бир күнү бедуиндин төөсү уурдалып кетиптир, ал өтө кайгылуу болуптур.", "story": "Төөсү менен чөлдө бараткан бир бедуин бутуна араң турган, суусуздуктан эриндери кургаган адамга жолугат.", "problem": "The theft is stated first; the water-giving scene is omitted here."}, {"kind": "caption", "image": "Бедуин өзү айтты: жашоодо адал бол; андан соң адамдарга болгон ишенимиң бекем болот.", "story": "", "problem": "This sentence is not in the story."}, {"kind": "speech", "image": "Олсун, төөмдү алса да олсун. Бирок бул сөздөр адамдардын жүрөгүндөгү ишенимди солкулдатпасын.", "story": "— Мейли, төөнү алып кете бер, сеники болсун. Бирок бул окуяны эч кимге айтпа.", "problem": "The request not to tell the story is replaced."}, {"kind": "caption", "image": "Жолдо ошону ойлоп: сабыр кылып жөнөдү.", "story": "", "problem": "This line is not in the story."}, {"kind": "speech", "image": "Чын жүрөктөн айтсак, ар бир жерде мээримдүү адамдар бар, жана мен ишенимди жоготуп, аларга жардам бербей коюуга болбойт.", "story": "— Эгер айтып берсең, бул окуя бардык жерге тарайт да, мындан ары эч ким жолуккан муктаж адамга жардам бербей калат, — деп жооп берет бедуин.", "problem": "The reason is reworded into a different claim."}, {"kind": "moral", "image": "Кээде өзүң тарткан зыянды жашыруу — башкалардын жакшылыкка болгон ишенимин сактоо үчүн керек.", "story": "Сабак: Бирөөнүн кыянаттыгы үчүн жакшылыктан түңүлбө. Адамдардын бири-бирине болгон ишенимин сактоо да чоң адамгерчилик.", "problem": "Moral wording differs."}], "preview": "../../ky/wisdom-stories/illustrations/bedouin-whose-camel-was-stolen.webp"}, {"stem": "spend-your-time-with-people", "title": "Убактыңды адамдар менен өткөр", "category": "Достук жана адамдык мамилелер", "status": "Needs correction", "items": [{"kind": "title", "image": "«Убактыңды адамдар менен өткөр»", "story": "Убактыңды адамдар менен өткөр", "problem": ""}, {"kind": "caption", "image": "Ата, пул которуш үчүн банкка баруума бир саат убакыт кетет экен. Акыркы жолу сабыр түтүп, өзүңүз айткан элеңиз:", "story": "Атам акча которушу керек болгондуктан, аны менен банкта бир саат отурууга туура келди.", "problem": "Wording differs: image says going to the bank to transfer money takes an hour and recalls the father's earlier advice."}, {"kind": "speech", "image": "— Ата, эмне үчүн иштерди өзүбүз чечкендин ордуна банка кергезбүз?", "story": "— Ата, банктагы иштериңизди интернет аркылуу эле бүтүрөлү. Кандай дейсиз?", "problem": "Different question: image asks why show things to the bank instead of deciding ourselves."}, {"kind": "speech", "image": "— Бул, ата, эмне үчүн керек?", "story": "— Мунун мага кандай пайдасы бар, уулум?", "problem": "Father's question is shortened and different."}, {"kind": "speech", "image": "— Пул которуш үчүн банкка бир саат убакыт кетет, ал эми интернет аркылуу бир нече секунда эле бүтөт. Натыйжалуулукту убакыт деп билем.", "story": "— Акча которуш үчүн банкта бир саат убактыңызды коротпойсуз. Атүгүл керектүү буюмуңузду да интернеттен сатып ала аласыз.", "problem": "Adds seconds and 'efficiency is time'; drops buying goods online."}, {"kind": "speech", "image": "— Эгер сен муну түшүнсөң, андан сырткары эмне үчүн маанай алганымды да аңдайсың. Түшүндүңбү, уулум?", "story": "— Эгер сен айткандай кылсам, анда үйдөн сыртка чыгуунун да кереги болбой калабы?", "problem": "Father's line is a different question about mood, not about never leaving the house."}, {"kind": "speech", "image": "— Түшүндүм, ата, түшүндүм.", "story": "— Ооба, дал ошондой, ата.", "problem": "Son's reply differs."}, {"kind": "caption", "image": "Биз бир топ нерсени кыйла жеңил кылдык, ошондуктан убакытын баалай албаган адамдар адамдык баалуулуктарды жоготуп коюшту.", "story": "Эгер баары онлайн болуп калса, мен ушундай адамдык сезимдерден ажырап калбаймынбы?", "problem": "Meaning shifts from the father's question to a claim that people who do not value time lose human values."}, {"kind": "speech", "image": "— Уулум, мен банктан өткөрүүгө бир саат кезегинде төрт колдошум менен сүйлөшөм, күнүмдү сурашам, ооруңуздарды айтамыз. Биригип бир нерсе чечебиз... Ушунун эле өзү мага кубаныч, жан дүйнөгө тынстык берет. Банкка баруу — жөн эле иш эмес, жылуу мамилеге, тирүү сүйлөшүүгө жол ачат.", "story": "— Уулум, банкта өткөргөн бир сааттын ичинде төрт досумду көрдүм, мени көптөн бери жакшы тааныган банк кызматкерлери менен сүйлөштүм.", "problem": "Rewrites the bank hour: queue, four friends, asking about the day, and solving things together; omits known bank staff and later examples."}, {"kind": "caption", "image": "Биз муну ооруканада, базарда, мечитте да көрөбүз. Баарыбыз чарчаган күнде да жылмайып кайрылып, тил табышабыз. Издеп жаткан адамыбызды табабыз же бирге проблемабызды чечебиз.", "story": "Эки жыл мурун ооруп калганымда, дайыма мөмө-жемиш сатып алган жакынкы дүкөндүн сатуучусу мени көргөнү келди.", "problem": "Replaces the shopkeeper and neighbor stories with a general hospital, market, and mosque scene."}, {"kind": "speech", "image": "Эгер бүгүн баарын онлайн кылсак, адамдардын жүзүн көрбөйбүз, жылуулукту сезбебиз. Жөн эле иш бүтөт, бирок жан токойтобойт. Адам — тирүү мамиле үчүн жараткан болот, машине яки тиркөмөлөр үчүн эмес. Муну түшүнө аласыңбы, уулум? Мен сени ойлонууга чакырам.", "story": "Баарын үйүмө чейин жеткирип беришсин деп, эмне үчүн компьютер менен гана байланышта болушум керек?", "problem": "Different speech; 'яки' ы же кечирим сурообу?»", "story": "Уруксатпы же кечирим сурообу", "problem": ""}, {"kind": "caption", "image": "Күчтүү контр-адмирал Курманбек буга чейин уруксат суроонун айынан көп жакшы мүмкүнчүлүктөрдү жоготкон эле.", "story": "Авторлугу контр-адмирал Грейс Хопперге таандык деп эсептелген «уруксат сурагандан көрө кечирим сураган жакшы» деген сөз бар.", "problem": "Names Курманбек and says he lost chances by asking permission; story credits Grace Hopper with the saying."}, {"kind": "other", "image": "УРУКСАТПЫ ЖЕ КЕЧИРИМ СУРООБУ?", "story": "Уруксатпы же кечирим сурообу", "problem": ""}, {"kind": "other", "image": "КУРМАНБЕК", "story": "", "problem": "Nameplate is not in the story."}, {"kind": "caption", "image": "Бир жолу ал оңой чечилүүчү маселе үчүн уруксат күтүп, көп убакытты жоготот — ошондо атаандаш мүмкүнчүлүктү пайдаланып кетет. Жыйынтыгында ал артта калат.", "story": "Кээде уруксат күтүп отуруп, мүмкүнчүлүктү колдон чыгарып жибересиң.", "problem": "Adds a competitor and falling behind."}, {"kind": "other", "image": "БҮГҮН ЭМЕС", "story": "", "problem": "Sticky note is not in the story."}, {"kind": "other", "image": "УРУКСАТ КҮТҮЛӨТ", "story": "", "problem": "Sticky note is not in the story."}, {"kind": "caption", "image": "Ошондон кийин ал ишти баштаардан мурда ар бир кадамын текшерип, майда деталдар боюнча да уруксат сурай баштайт. Натыйжада иш жайлап, мүмкүнчүлүк жагайн колунан учуп кетет.", "story": "Эгер ал адегенде узакка созулган уруксат алуу жолуна түшсө, маселе бир жетекчиден экинчисине өтүп, жоопту жумалап күтүп, мүмкүнчүлүк колдон чыгып кетиши мүмкүн.", "problem": "Different sequence; the word 'жагайн' is not in the story."}, {"kind": "other", "image": "АР КАДАМГА УРУКСАТ КЕРЕК", "story": "", "problem": "Sticky note is not in the story."}, {"kind": "caption", "image": "Бир күнү ал тобуна тобокелдикти баалоону, зарыл маалыматты чогултууну жана процессти автоматташтырууну жүктөйт.", "story": "Бирок кызматкер коркунуч аз экенин көрүп, учурдагы маалыматтарга зыян келтирбеген өзүнчө сыноо тутумун түзөт, ишти автоматташтырып, натыйжасын көрсөтөт.", "problem": "Image assigns the work to a team; story has the employee build a separate test system."}, {"kind": "speech", "image": "Процесстерди тартипке салып, түшүнүктүү маалымат менен камсыз болгон соң, команда иштөөгө күчөлөнөт.", "story": "Тутум ийгиликтүү болсо, анын пайдасын баары көрөт.", "problem": "Different claim about the team getting stronger."}, {"kind": "speech", "image": "Бул жерде негизги ой \"ардактар макал ооба\" эмес. Натыйжаны алып келген маалыматка таянып, тобокелдикти туура баалап, чечимди өз убагында кабыл алуу маанилүү.", "story": "Кызматкер: «Ишти тездетүү үчүн сынап көрдүм. Эгер эрежени бузган болсом, кечирим сурайм», — дей алат.", "problem": "Opening phrase is garbled and the apology line is missing."}, {"kind": "other", "image": "АГЫЛА ИШТЕП, ЫЛДАМ ЖЕТКИР!", "story": "", "problem": "Sticky note is not in the story."}, {"kind": "moral", "image": "Коркунучу аз, пайдасы айкын учурда ашыкча уруксат күтүү демилгени өлтүрүшү мүмкүн.", "story": "Сабак: Демилгелүү болуу эрежени тоготпоо деген эмес. Зыяны аз, кайра оңдоого боло турган иште жоопкерчиликти алып, пайдалуу чечимди сынап көрүүгө болот.", "problem": "Moral drops that initiative is not ignoring the rules."}], "preview": "../../ky/wisdom-stories/illustrations/permission-or-apology.webp"}, {"stem": "gossip", "title": "Ушак", "category": "Достук жана адамдык мамилелер", "status": "Needs correction", "items": [{"kind": "title", "image": "Ушак", "story": "Ушак", "problem": ""}, {"kind": "caption", "image": "Бир адам ушакты угуп, аны башка адамдарга жеткире баштады.", "story": "Ачуу тилдүү, адепсиз бир адам ушак таратты деп айыпталып, айыл аксакалынын алдына чакырылды.", "problem": "Image starts with someone passing on gossip, not being summoned to the elder."}, {"kind": "speech", "image": "Бул жөн гана угулуп калган сөз, мен аны башкаларга жеткирсем деле жаман болбойт!", "story": "— Бул жөн гана тамаша болчу, болгону тамаша, — деп ал айыбын четке какты.", "problem": "He calls it an overheard word, not a joke, and says passing it on is fine."}, {"kind": "speech", "image": "Тазалыгыңды сакта, мындай сөздү айтпа.", "story": "— Таза атыма көө жаптың. Адилеттик талап кылам.", "problem": "Different rebuke."}, {"kind": "speech", "image": "Бардык дедиктеримди кечирип коюңуз, эми мындай кылайын деп жатпейм.", "story": "— Айткандарымдын баарын кайра алам, мени кечирүүнү сурайм.", "problem": "Wording of the apology differs."}, {"kind": "speech", "image": "Бар, базардын ортосуна бир үч жүң алып барып, аба ыргагына чач. Андан кийин ошол жүндөрдү кайра чогултуп көрчү. Мүмкүн болсо, мени менен бөлүш.", "story": "— Базар аянтына куштун жүнү салынган бир жаздык алып бар. Аны жарып, ичиндеги жүндөрдү тегерекке чач. Андан кийин ошол жүндөрдүн баарын бирден терип, мага алып кел. Муну аткара албасаң, кечирим жок.", "problem": "Pillow, tearing it, and 'no forgiveness if you fail' are missing; 'үч жүң' and 'бөлүш' differ."}, {"kind": "speech", "image": "Чачкан жүндөрдү кайра чогулта албай жатам.", "story": "— Калганын чогулта албадым.", "problem": "Wording differs."}, {"kind": "speech", "image": "Ошентип эле угуп угуп айтылган сөздөр кимдир биреөгө келип тийет. Алардын баарын кайра жыйноо мүмкүн эмес.", "story": "— Өзүм тараткан сөздөр сыяктуу экен. Аларды да эми кайра жыйнай албайм, — деди.", "problem": "He does not say the words are like the ones he spread."}, {"kind": "moral", "image": "Тараган сөз — шамалга сапырылган жүн сыяктуу: аны кайра жыйноо мүмкүн эмес.", "story": "Сабак: Ушак — желге учкан жүн: чачкандан кийин кайра жыйнай албайсың. Сөздү ооздон чыгарардан мурун ойлон.", "problem": "Moral wording differs and the 'think before you speak' line is missing."}], "preview": "../../ky/wisdom-stories/illustrations/gossip.webp"}, {"stem": "try-to-think-this-way", "title": "Ушинтип ойлонууга аракет кылыңыз", "category": "Адеп жана мүнөз", "status": "Needs correction", "items": [{"kind": "title", "image": "Ушинтип ойлонууга аракет кылыңыз.", "story": "Ушинтип ойлонууга аракет кылыңыз", "problem": ""}, {"kind": "speech", "image": "«Мен бул ишти жакшы окуй албайм» демейин.", "story": "«Бул ишти жакшы билбейм» дебеңиз.", "problem": "окуй албайм and демейин instead of билбейм and дебеңиз."}, {"kind": "speech", "image": "«Балким, азырынча бир нерсени түшүнө элекмин, бирок аракет кылсам, үйрөнө алам» дейин.", "story": "«Балким, мен билбеген бир нерсе бардыр? Билимимди жаңылап, үстүндө иштесем, сөзсүз колуман келет», — деңиз.", "problem": "Reworded replacement."}, {"kind": "other", "image": "ЧЫГУУ ЖОК", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "«Мен бул иштен колум келет деп ойлобойм» демейин.", "story": "«Бул иштен баш тарттым» дебеңиз.", "problem": "Different negative sentence."}, {"kind": "speech", "image": "«Балким, башка жол бардыр? Табам, көрөм, башкача аракеттенем» дейин.", "story": "«Балким, муну башка жол менен чечүүгө болоттур? Аракет кылып көрөйүн, балким, ишке ашар», — деңиз.", "problem": "Reworded."}, {"kind": "speech", "image": "«Бул иш өтө кыйын» демейин.", "story": "«Бул иш өтө кыйын» деп токтоп калбаңыз.", "problem": "демейин instead of деп токтоп калбаңыз."}, {"kind": "speech", "image": "«Кыйын болсо да, мунун үстүнөн чыгам, кичинеден баштап жасап көрөм» дейин.", "story": "«Кыйын болсо да, аткарууга болот. Көбүрөөк убакыт, эмгек жумшайын», — деңиз.", "problem": "Different positive sentence."}, {"kind": "speech", "image": "«Мен жаманмын, бул ишти жасай албайм, менден эч нерсе чыкпайт» демейин.", "story": "«Жасаганым мени канааттандырат, мындан жакшы кыла албайм» дебеңиз.", "problem": "Different negative sentence."}, {"kind": "speech", "image": "«Мен өнүгүп жатам, көнүгүп, жакшыраак болуп бара жатам» дейин.", "story": "«Өзүмдүн үстүмдө иштеп, өсүп, мындан да жакшы натыйжага жете алам», — деңиз.", "problem": "Reworded."}, {"kind": "speech", "image": "«Мен аракет кылдым, бирок боло алган жок» демейин.", "story": "«Ката кетирдим, аттиң, кылбашым керек эле» дебеңиз.", "problem": "Different negative sentence."}, {"kind": "speech", "image": "«Азырынча жыйынтык жок, бирок мен үйрөнүп жатам, кайра аракет кылам» дейин.", "story": "«Бул дүйнөнүн акыры эмес; каталар мага үйрөнүүгө жардам берет», — деңиз.", "problem": "Reworded."}, {"kind": "speech", "image": "«Менин эч кандай талантым жок, мен эч ким боло албайм» демейин.", "story": "«Ал өтө акылдуу, мен ага окшош боло албайм» дебеңиз.", "problem": "Different negative sentence."}, {"kind": "speech", "image": "«Менин өзгөчөлүктөрүм бар, үйрөнсөм, өнүгсөм, мен да көп нерсеге жете алам» дейин.", "story": "«Ал буга кантип жеткенин үйрөнүп, мен да ошондой ийгиликке жете алам», — деңиз.", "problem": "Reworded."}, {"kind": "moral", "image": "Сабак: Ой жүгүртүүңдү өзгөртүү — жашооңду өзгөртүүнүн биринчи кадамы. «Колуман келбейт» деген сөз жолду жабат, «үйрөнөм» деген сөз жаңы мүмкүнчүлүктөрдү ачат. Ийгиликсиздик — аягы эмес, өсүү мүмкүнчүлүгү..", "story": "«Билбейм» дегенди «үйрөнөм» дегенге алмаштыр. Катаңдан сабак алып, башка жолун издеп көр. Аракет мүмкүнчүлүк ачат.", "problem": "Moral is a different text; “Колуман келбейт” is not the story’s “Билбейм.”"}], "preview": "../../ky/wisdom-stories/illustrations/try-to-think-this-way.webp"}, {"stem": "builder-of-the-nest", "title": "Уя курган куш", "category": "Үй-бүлө жана тарбия", "status": "Needs correction", "items": [{"kind": "title", "image": "Уянын куруучусу", "story": "Уя курган куш", "problem": "Different title."}, {"kind": "caption", "image": "Аял уяны курат.", "story": "Уяны ургаачы куш курат.", "problem": "Аял versus ургаачы куш."}, {"kind": "caption", "image": "Аял үй-бүлөнү бекем кармаган аял.", "story": "Үйдүн кутун сактап, үй-бүлөнүн ынтымагына уютку болгон аял", "problem": "Different wording; the sentence repeats аял."}, {"kind": "moral", "image": "Уяны куруп, үй-бүлөнү бекем кармаган – аял. Анын эмгегин көрүп, баалай бил.", "story": "Үйдүн кутун сактап, үй-бүлө и чайды үйлөп-үйлөп ичет.", "problem": "He spills the second tea; in the story he blows on it and drinks it."}, {"kind": "speech", "image": "Энем, кантип түшүнсөм, мага толук түшүндүрүп бересиңби?", "story": "Апа, кандай, мугалимдигим жактыбы?", "problem": "Different question; the school scene is missing."}, {"kind": "speech", "image": "Ооба уулум, угуп жатам.", "story": "Ээ, эмне дейин, уулум, жаман эмес экен", "problem": "Different reply."}, {"kind": "speech", "image": "Энем, мага баарыңды айтып берчи. Мен эми болжолдобой жатпай, какшы түшүнгүм келет. Эми эмне дейсиң?", "story": "Апа, инспекторлор келип, жактырып, жакшы баа беришет. Сиз болсо «жаман эмес» дейсиз.", "problem": "Different speech."}, {"kind": "speech", "image": "Энеси ага мындай деп кеңеш берет. Ал сөзүн нык, акылман, мээримдүү кеңеш менен түшүндүрөт. Мен сага чакан стакан сууну берсем, эгер аны ачууланып төгүп салсаң, ичиңде кандай асаланып, өкүнүү жаралымак эле? Ошондуктан мен сага мөйлөмдү эмес, насаатты бердим. Катаңды түшүнүп, аны оңдоп, өзүң өзү тартипке салууну үйрөн.", "story": "Эгер чайды төккөн күнү сага ачуулансам, ичиңдеги арстан таарынмак. Сени урсам, ал арстан өлмөк!", "problem": "A glass of water and self-discipline replace the lion inside the child."}, {"kind": "moral", "image": "Сабак: Баланын ичиндеги «арстанды» — өзүнө болгон ишенимин — уруп өлтүрбө. Чыныгы тарбия коркуу менен эмес, сабыр жана сүйүү менен берилет.", "story": "Баланын өзүнө болгон ишенимин коркутуп, уруп өчүрбө. Сабыр менен мээрим анын ичиндеги күчтү ойготот.", "problem": "өлтүрбө versus өчүрбө; сүйүү versus мээрим; the last clause differs."}], "preview": "../../ky/wisdom-stories/illustrations/mothers-advice-fakir-baykurt-never-forgot.webp"}, {"stem": "fly-in-the-china-shop", "title": "Фарфор дүкөнүндөгү чымын", "category": "Тамсилдер жана жомоктор", "status": "Needs correction", "items": [{"kind": "title", "image": "Фарфор дүкөнүндөгү чымын", "story": "Фарфор дүкөнүндөгү чымын", "problem": ""}, {"kind": "caption", шталышы жок."}, {"kind": "thought", "image": "Эмне үчүн, Хаят, мен сени түшүнбөйт экен...?", "story": "«Хаят, сулуу кызым, мен сени абдан жакшы көрөм».", "problem": "Кыялдагы уланды башка."}, {"kind": "caption", "image": "Беш жашында Хасан агасы менен ооюн курчагынан ажырап, Хаят чоң кишинин жашоосуна кирди.", "story": "Мен он беш жашта элем. Хасан байкенин аялы болдум.", "problem": "Он беш эмес беш жаш."}, {"kind": "other", "image": "Накыл сөздөр", "story": "", "problem": "Китеп аталышы жомоктон жок."}, {"kind": "caption", "image": "Кырк жашка чыга электе... уулу Самини доктор, кызы Элиф мугалим, кичүү кызы Назым кыялын ишке ашырды. Хаяттын дүйнөсү балдары болду.", "story": "Сами дарыгер болуп, башка шаарга дайындалып, үйүбүздөн көчүп кеткен эле. Элиф мугалим болуп, турмушка чыккан. Кичүү кызым Зехра ветеринар болду.", "problem": "Зехра ордуна Назым; ветеринар жок; «кырк жашка чыга электе» жаңылыш."}, {"kind": "caption", "image": "Намыс эрте коюлуп, көңүл калса да, Хаят кез жашын жутуп жашоону улантты.", "story": "Сабак: «Эл эмне дейт?» деген сокур түшүнүк үчүн аял менен баланын тагдырын тебелөөгө болбойт.", "problem": "Сөздөр башка."}, {"kind": "moral", "image": "Сокур салт менен туура эмес намыс аялдын да, баланын да өмүрүн талкалашы мүмкүн.", "story": "Сабак: «Эл эмне дейт?» деген сокур түшүнүк үчүн аял менен баланын тагдырын тебелөөгө болбойт. Эрте никеге, зомбулукка кайдыгер караган адам да адилетсиздикке жол ачат.", "problem": "Эрте нике жана зомбулукка кайдыгерлик жок."}], "preview": "../../ky/wisdom-stories/illustrations/hayats-life-story.webp"}, {"stem": "i-am-tired-mother", "title": "Чарчадым, апа", "category": "Үй-бүлө жана тарбия", "status": "Needs correction", "items": [{"kind": "title", "image": "Чарчадым, апа", "story": "Чарчадым, апа", "problem": ""}, {"kind": "speech", "image": "Чарчадым, апа.", "story": "Чарчадым, апа...", "problem": ""}, {"kind": "speech", "image": "Эмне болду, уулум?", "story": "Эмнеден, уулум?", "problem": "болду versus Эмнеден  канализация шаардын, мончо дененин, китепкана болсо рухтун кирин тазалайт.", "problem": "«кирин» is missing and the case endings differ."}, {"kind": "other", "image": "Мончо", "story": "мончо", "problem": ""}, {"kind": "other", "image": "Китепкана", "story": "китепкана", "problem": ""}, {"kind": "moral", "image": "Сабак: Шаар денени да, рухту да таза сактоого тийиш. Китепкана рухтун, мончо дененин, канализация шаардын кирин кетирет.", "story": "Сабак: Дененин тазалыгы кандай керек болсо, жан дүйнөнүн тазалыгы да ошондой керек. Китепке да күнүмдүк тиричиликтей маани бер.", "problem": "Moral wording differs, and the Fatih attribution is missing."}], "preview": "../../ky/wisdom-stories/illustrations/three-essential-things-for-a-city.webp"}, {"stem": "stoning-the-devil", "title": "Шайтанга таш ыргытуу", "category": "Иман жана руханият", "status": "Needs correction", "items": [{"kind": "title", "image": "«Шайтанга таш ыргытуу»", "story": "Шайтанга таш ыргытуу", "problem": ""}, {"kind": "caption", "image": "Зыяратта жүргөн бир адам шайтанга таш ыргытма убактысында ташты өзүнө өзү ыргыта баштайт.", "story": "Ажылыкка барган бир адам шайтанга таш ыргыта турган маал келгенде, ташты ыргыткандын ордуна аны менен өзүн ургулай баштайт.", "problem": "Зыяратта versus Ажылыкка; wording of striking himself differs."}, {"kind": "speech", "image": "Ата, эмне үчүн ташты өзүңө өзүң ыргытасың?", "story": "Байке, эмнеге өзүңүздү таш менен уруп жатасыз?", "problem": "Ата versus Байке; different wording."}, {"kind": "speech", "image": "Уулум, бизди бул жерде чын эле шайтан эмес, өз напсибиз алдайт. Биз аны таштабасак, ал биздин жүрөгүбүздү басып алат.", "story": "Уулум, айтчы, биздин бул жердеги шайтан менен эмне ишибиз бар? Биз өзүбүздүн ичибиздеги шайтанды таш бараңга алып, напсибизди тарбиялап, өзүбүздү тазалашыбыз керек.", "problem": "Different explanation: nafs deceives and seizes the heart, versus stoning the inner devil and disciplining the nafs."}, {"kind": "moral", "image": "Чыныгы күрөш сырттагы шайтан менен эмес, өз напсиң менен жүрөт.", "story": "Жамандыкты өзгөдөн издей бербей, өз напсиңди да тый. Өзүңдү оңдоо оор болсо да, ошондон башта.", "problem": "Different moral wording."}], "preview": "../../ky/wisdom-stories/illustrations/stoning-the-devil.webp"}, {"stem": "windmill-turning-in-still-air", "title": "Шамалсыз абада айланган жел тегирмен", "category": "Акылмандык жана өмүр сабактары", "status": "Needs correction", "items": [{"kind": "title", "image": "Шамалсыз абада айланган жел тегирмен", "story": "Шамалсыз абада айланган жел тегирмен", "problem": ""}, {"kind": "speech", "image": "Шамалсыз абада айланган жел тегирмендин артында бир себеп бар.", "story": "Шамалсыз абада айланган жел тегирменди сөзсүз бирөө үйлөп турат.", "problem": "«Бирөө үйлөп турат» ордуна «бир себеп бар»."}, {"kind": "caption", "image": "Эскимостордун накылы — көрүнбөгөн күчтүн күчү бар.", "story": "Эскимос макалы", "problem": "«Макалы» ордуна «накылы»; «көрүнбөгөн күчтүн күчү бар» жомоктон жок."}, {"kind": "moral", "image": "Эч бир натыйжа себепсиз жаралбайт. Күч көрүнбөсө да, таасири билинет.", "story": "Сабак: Көзгө көрүнгөн ар бир натыйжанын артында себеп бар. Аны дароо байкабасаң да, издеп, түшүнүүгө аракет кыл.", "problem": "«Издеп, түшүнүүгө аракет кыл» жок."}], "preview": "../../ky/wisdom-stories/illustrations/windmill-turning-in-still-air.webp"}, {"stem": "candles-conversation", "title": "Шамдардын маеги", "category": "Сөз, унчукпоо жана баарлашуу", "status": "Needs correction", "items": [{"kind": "title", "image": "«Шамдардын маеги»", "story": "Шамдардын маеги", "problem": ""}, {"kind": "caption", "image": "Бир убакта төрт шам жанаша жанды. Алардын ортосунда өздөрү, ишеним, берилгендик жана сүйүү жөнүндө сүйлөшүү болуп жатты.", "story": "Бир бөлмөдө төрт шам үлбүрөп күйүп турган. Айлана ушунчалык тынч болгондуктан, шамдардын өз ара сүйлөшкөнү угулуп турду.", "problem": "Different wording."}, {"kind": "speech", "image": "Мен ИШЕНИМ! Адам мага ишенүүсү токтосо, күчүм азаят. Ошондо мен жанбаганга айланам.", "story": "«Мен — ИШЕНИММИН! Бирок жарыгымды сактоого эч ким аракет кылбайт. Жакында өчөм окшойт»", "problem": "ИШЕНИМ instead of ИШЕНИММИН; different speech."}, {"kind": "caption", "image": "ИШЕНИМ өчтү.", "story": "акыры ИШЕНИМ толук өчтү", "problem": "Drops толук."}, {"kind": "speech", "image": "Мен БЕРИЛГЕНДИК! Эми мен керексизмин, анткени мага берилгендик табуу кыйынга түштү. Ошентип, мен да өчкөнгө айланам.", "story": "«Мен — БЕРИЛГЕНДИКМИН! Тилекке каршы, эми эч кимге керегим жок. Ошондуктан мындан ары күйүп туруумдун да мааниси калбады»", "problem": "БЕРИЛГЕНДИК instead of БЕРИЛГЕНДИКМИН; different speech."}, {"kind": "caption", "image": "БЕРИЛГЕНДИК өчтү.", "story": "БЕРИЛГЕНДИКТИ да таптакыр өчүрдү", "problem": "Shortened; different wording."}, {"kind": "speech", "image": "Мен СҮЙҮҮМҮН! Күчүм азайды, анткени адамдар бир-бирин унутту, ойлору жана иштери өз кызыкчылыгы үчүн болду. Мен да өчөмүн.", "story": "«Мен — СҮЙҮҮМҮН! Мындан ары күйүүгө күчүм калбады. Адамдар мени унутуп, баркыма жетпей калышты. Атүгүл эң жакындарым да сүйгөндү унутту»", "problem": "Different speech."}, {"kind": "caption", "image": "СҮЙҮҮ өчтү.", "story": "СҮЙҮҮ да чыдай албай, өчүп калды.", "problem": "Shortened."}, {"kind": "speech", "image": "Эмне үчүн өчүп жатасыңар? Силердин жарыгыңар эмне үчүн керек эмес?", "story": "«Эмнеге күйбөй калдыңар? Силер түбөлүк күйүп турушуңар керек эмес беле?»", "problem": "Different question."}, {"kind": "speech", "image": "Капа болбогула, мен силерге жардам берем! Мен — үмүт! Мен силерди кайра жандыра алам!", "story": "«Коркпо, мен күйүп турганда башка шамдарды кайра жандыра алабыз. Мен — ҮМҮТМҮН!»", "problem": "үмүт instead of ҮМҮТМҮН; different speech."}, {"kind": "moral", "image": "Ишеним, берилгендик жана сүйүү өчкөндө, аларды кайра жандырган — үмүт.", "story": "Сабак: Үмүт бар жерде өчкөн ишенимди да, сүйүүнү да кайра жандырууга болот. Үмүтүңдү өчүрбө.", "problem": "Different moral; берилгендик is added and Үмүтүңдү өчүрбө is missing."}], "preview": "../../ky/wisdom-stories/illustrations/candles-conversation.webp"}, {"stem": "drinking-the-sherbet-of-martyrdom", "title": "Шейиттик шербетин ичүү", "category": "Иман жана руханият", "status": "Requires manual review", "items": [{"kind": "title", "image": "«Шейиттик шербетин ичүү»", "story": "Шейиттик шербетин ичүү", "problem": ""}, {"kind": "caption", "image": "Осмон ... шербет ичиришкен", "story": "Осмон доорунда согушта оор жараланып, жан берип жаткан жоокерлер шейит болор алдында оозу таттуу болсун деп, дарыгерлер өздөрү алып жүргөн чакан челектердеги замзам суусунан жасалган шербеттен ичиришчү экен.", "problem": "The rest of this caption is too small to read confidently."}, {"kind": "caption", "image": "«Шейиттик шербетин ичүү» деген түшүнүк ушундан калган.", "story": "«Шейиттик шербетин ичүү» деген сөз айкашы ушундан келип чыккан.", "problem": "түшүнүк / калган versus сөз айкашы / келип чыккан."}, {"kind": "moral", "image": "Ар бир сөз айкашынын артында тарых жана жан аябастык турат.", "story": "Айрым сөздөрдө бүтүндөй бир доордун изи сакталат. Алардын төркүнүн билүү өткөндү түшүнүүгө жардам берет.", "problem": "Different moral; adds жан аябастык."}], "preview": "../../ky/wisdom-stories/illustrations/drinking-the-sherbet-of-martyrdom.webp"}, {"stem": "spinach", "title": "Шпинат", "category": "Үй-бүлө жана тарбия", "status": "Needs correction", "items": [{"kind": "title", "image": "«Шпинат»", "story": "Шпинат", "problem": ""}, {"kind": "caption", "image": "Бир кезде биз абдан жокчубуз. Апам шпинатты биз үчүн бышыра берчү.", "story": "Биз алыскы бир айылда жашачубуз. Каттап жүрүүгө жарытылуу жолубуз да жок эле. Апам шпинатты аябай жакшы көрчү.", "problem": "Opening wording and meaning differ."}, {"kind": "speech", "image": "Жол гана шпинат, балдарым, пайдалуу.", "story": "«Муну көп жеш керек, денеге күч берет», — дечү апам.", "problem": "Mother’s line differs."}, {"kind": "speech", "image": "Эмне үчүн дайым шпинат бышырасың, апа? Башка тамак жокпу?", "story": "«Чоңоюп, иштеп, үй-бүлө курганда үйгө эч качан шпинат сатып албайм. Үйүмдө шпинаттан тамак бышпайт»", "problem": "Child’s complaint is not the story line."}, {"kind": "speech", "image": "Колумдан келген ушу, уулум. Силер ден соолук болгула.", "story": "Балдарым ач калбасын деп улам ошол тамакты бышырып берчүмүн.", "problem": "Mother’s reply is not in the story dialogue."}, {"kind": "speech", "image": "Билим алып, апыңа чык. Сенин келечегиң жарқын болсун. Менин максатым – сенин жакшы адам болуп өскөң.", "story": "Ал болсо ошол күндөрдү чыдамсыздык менен күтүп жатканын айтып, канча жашта болсо да үйлөнүү тоюмда бийлей турганына сөз берди.", "problem": "Mother’s speech differs from the wedding promise."}, {"kind": "speech", "image": "Тынчсызданба, апа, мен шпинатты билем.", "story": "", "problem": "This line is not in the story."}, {"kind": "caption", "image": "Үйлөнгөнүмдө апам жалгыз жетиң кийип, тойго келди. Бай кийим кийген жок, бирок жүрөгү толо сүйүү менен келди.", "story": "Үйлөнчү кызымды ээрчитип айылга келип той бергенде, карыган апам ыйлады да, көп жыл мурун убада кылгандай тоюмда бийледи.", "problem": "Wedding scene wording and details differ."}, {"kind": "caption", "image": "Көп жылдар өткөндөн кийин апамдын жазган бир дептерин таптым.", "story": "Бир күнү апамдын эски сандыгынан ал кезде жазып жүргөн эскерүү дептерин таптым.", "problem": "Wording differs."}, {"kind": "caption", "image": "Ал дептерде мындай деп жазылган эле...", "story": "Дептердин бир бетине апам мындай деп жазыптыр:", "problem": "Wording differs."}, {"kind": "caption", "image": "«Шпинатты тандап бышырып, силерге берчү элем. Анткени ал арзан, бирок пайдалуу болчу жана силер соолук болуп өскөңөрду кааладым... Шпинатты сүйбөңдөр, менин сүйүүмдү сезиңисиң. Силер үчүн баарын кылгам, мен силерди чексиз сүйөм.»", "story": "«Колумда шпинаттын үрөнү гана калган эле. Дайыма шпинат, бир аз жүгөрү эгип өстүрчүмүн. Колдо бар, оозго алар эч нер
