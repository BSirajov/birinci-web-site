: "Different question."}, {"kind": "speech", "image": "«Бүгүн-эртең кылбасам, дүйнө урап калбайт да».", "story": "«Бүгүн-эртең кылбасам, дүйнө урап калбайт да…»", "problem": ""}, {"kind": "thought", "image": "Ишенимди жоготсом да, чарчап эле койбойм да?", "story": "Ооба, дүйнө урабайт. Бирок ортобуздагы ишенимчи? Ал да урабайбы?", "problem": "Different question."}, {"kind": "caption", "image": "Маселе кечиккенде эмес, байланыш үзүлүп калганда жана максат тек бузулганда башталат.", "story": "Кеп тапшырманын бир нече күнгө кечиккенинде эмес эле. Кеп адамдын өзүнө алган милдетине жасаган мамилесинде болчу.", "problem": "Different wording."}, {"kind": "caption", "image": "Жоопсуздук күч алат; сапат түшөт; командадагы ынтымак акырындык менен бузулат.", "story": "", "problem": "Not this story sentence."}, {"kind": "caption", "image": "Кийин кеч өкүнөбүз, бирок убакыт, мүмкүнчүлүк жана аброй жоголуп болот.", "story": "Ишенимге ээ болуу үчүн жылдар талап кылынышы мүмкүн, ал эми аны кээде бир эле сүйлөм менен жоготуп коюуга болот.", "problem": "Different wording."}, {"kind": "caption", "image": "Андан баалуу ресурс жок; аны топтоо жылдар, жоготуу бир сүйлөм.", "story": "Эң баалуу ресурс — адамдардын бири-бирине болгон ишеними.", "problem": "Drops that the resource is trust."}, {"kind": "other", "image": "ИШЕНИМ", "story": "ишеним", "problem": ""}, {"kind": "other", "image": "ТОПТОО ЖЫЛДАР", "story": "Ишенимге ээ болуу үчүн жылдар талап кылынышы мүмкүн", "problem": "Shortened."}, {"kind": "other", "image": "ЖОГОТУУ БИР СҮЙЛӨМ", "story": "аны кээде бир эле сүйлөм менен жоготуп коюуга болот", "problem": "Shortened."}, {"kind": "moral", "image": "«Ишеним — уюмдардын эң баалуу байлыгы. Аны табууга жылдар, жоготууга бир сүйлөм жетет.»", "story": "Сабак: Бирге иштешүүнүн таянычы — ишеним. Аны жылдап топтоп, бир ооз кайдыгер сөз менен жоготуп алышың мүмкүн. Убадаңа бек бол.", "problem": "Different moral; Убадаңа бек бол is missing."}], "preview": "../../ky/wisdom-stories/illustrations/if-i-dont-do-it-these-days-the-world-wont-collapse.webp"}, {"stem": "henry-fords-choice", "title": "Генри Форддун тандоосу", "category": "Эмгек, ырыскы жана байлык", "status": "Needs correction", "items": [{"kind": "title", "image": "«Генри Форддун тандоосу»", "story": "Генри Форддун тандоосу", "problem": ""}, {"kind": "other", "image": "РЕСТОРАН", "story": "Ресторандан чыгып баратканда", "problem": ""}, {"kind": "caption", "image": "Бүгүнкүдөй «Форд Мотор» компаниясынын негиздөөчүсү Генри Форд эки жаш жигитти ишке алууну пландап, аларды бир эле күн бою университетте байкоону чечти, бирок жашыруун түрдө.", "story": "Генри Форд анын компаниясында иштегиси келген эки жаш досту кечки тамакка чакырат.", "problem": "Университетте жашыруун байкоо аңгемеде жок."}, {"kind": "caption", "image": "Ал жакшы маанайда, күлүп жиберген адам эле. Ресторандан чыкканда Генри Форд жаш жигиттердин бирине жумушка аларын билдирди, экинчисине болсо алсыздарга болгон мамилесин кайра ойлонуп көрүүнү айтты.", "story": "Форд жигиттердин бирине аны жумушка алганын айтат, экинчисине болсо ийгилик каалап, жумуш бере албай турганын билдирет.", "problem": "Себеп алдын ала айтылат; туз жана сылыктык жок."}, {"kind": "speech", "image": "Биздин оюмча, сиз бүткүл жашыңызды автомобилдерге арноого болбойт. Биздин доордо мунун ордуна кошумча көз караштарга, башка тажрыйбаларга ээ болуу маанилүү. Бирок сиз жакшы түшүндүрдүңүз, мен бул ойлоруңузду эске алам.", "story": "Форд мырза, биз кеч бою автомобиль да, инженердик жөндөм жөнүндө да сүйлөшкөн жокпуз", "problem": "Жигиттин суроосу башка."}, {"kind": "speech", "image": "Туура айтасың, эки себеп бар. Биринчиси: бүтүн өмүрүн машина курууга арнаган кишинин дүйнө таанымы тар болуп калат деп корком. Экинчиси: бир аз мурда сен дасторкондун жанында турган алсыз жардыга көңүл бурбай койдуң. Адам канчалык бийик тепкичке чыкпасын, алсыздарды сыйлай билүүсү зарыл.", "story": "Досуңуз адегенде тамактын даамын татып, андан кийин туз септи; сиз болсо алгач туз сээп, анан гана даамын таттыңыз.", "problem": "Туз сыноосу жок; себептер башка."}, {"kind": "speech", "image": "Экинчи себеп мындай: алсыздарга кылган жакшы мамиле көп учурда тоскоол көрүнгөнү менен, чындыгында узак мөөнөттүү келечекте чоң мүмкүнчүлүккө айланат. Адам башка бирөөнүн муктаждыгын чындап түшүнбөй турса, чоң жетишкендиктерге жете албайт.", "story": "досуңуз тейлөөчүлөргө абдан сылык мамиле кылды, сиз болсо аларды көрмөксөнгө салып, мага гана сылыктык көрсөттүңүз.", "problem": "Тейлөөчүгө сылыктык так айтылбайт."}, {"kind": "moral", "image": "Адамдын мүнөзү майда иштеринен жана алсыздарга жасаган мамилесинен көрүнөт.", "story": "Сабак: Адамдын ким экени күнүмдүк мамилесинен билинет. Ишти баамдап жаса, кызмат көрсөткөн адамды да өзүңө тең көрүп сыйла.", "problem": "Сабактын экинчи бөлүгү башка."}], "preview": "../../ky/wisdom-stories/illustrations/henry-fords-choice.webp"}, {"stem": "from-a-wise-fathers-advice-to-his-son", "title": "Даанышман атанын уулуна айткан насааттарынан", "category": "Үй-бүлө жана тарбия", "status": "Needs correction", "items": [{"kind": "title", "image": "Даанышман атанын насааттары", "story": "Даанышман атанын уулуна айткан насааттарынан", "problem": "Missing уулуна айткан and the ending -нан."}, {"kind": "speech", "image": "Ата облуна: дүйнөдө эң баалуу нерсе — акыл; бакыттын түпкү булагы ошол.", "story": "Адамдар менен тил табыша билүү үчүн акыл керек, уулум. Ошол акыл ынтымакка, бакубат жашоого жол ачат.", "problem": "Different advice; облуна is not the story wording."}, {"kind": "speech", "image": "Жаштык күндөрү өткөн соң, ар бир жолу акылга салып, туура жолду танда.", "story": "Жаш кезинде туура, жакшы жолдо жүргөндөр карылыгында анын акыбети катары урмат-сый көрүшөт.", "problem": "Different advice."}, {"kind": "speech", "image": "Күчтүү болуу жакшы, бирок акыл менен коштолсо гана чыныгы күч болот.", "story": "Күчтүү, кубаттуу болуу жакшы. Бирок күч акылдын буйругуна баш ийүүгө тийиш.", "problem": "коштолсо versus акылдын буйругуна баш ийүүгө тийиш."}, {"kind": "speech", "image": "Ата өзү азыктанууду, тазалыкты жана тартипти жакшы көр.", "story": "тамакты ченеп жеп, андан кийин басып-сейилдеп жүргөнүм көмөк болду", "problem": "Cleanliness and order replace measured eating and walking."}, {"kind": "caption", "image": "Ата облуна үч нерсени дайыма эске салат: 1. Оку, ойлон, план түз. 2. Уктаардан мурун эсеп чыгып көр. 3. Ар бир нерсени билүүгө умтул.", "story": "бул дүйнөдө адамдардын үч түрү бар", "problem": "The three kinds of people are replaced by study, accounting, and curiosity."}, {"kind": "caption", "image": "Окуу акылды ачат, план ийгиликтүү жетелейт.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Күнүңдү талдап көрсөң, катаңды оңдойсуз, өсөсүз.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Билим адамды бийиктетет, сый-урмат алып келет.", "story": "Эл андай кишинин сөзүн баалайт.", "problem": "Different wording."}, {"kind": "thought", "image": "Билген сайын менин түсүнүк тереңдейт.", "story": "", "problem": "Not in the story; түсүнүк is uncertain."}, {"kind": "speech", "image": "Ата облуна дейт: «Насаатка кулак салгандан жолу жарык болот.»", "story": "Экинчилерден болсоң, сага айтылган насааттарга кулак сал деп кеңеш берем.", "problem": "Different wording."}, {"kind": "moral", "image": "Акыл — бакыттын булагы. Насаатка кулак салган адам бийиктейт.", "story": "Күчүңдү акылыңа баш ийдир. Өзүң билбегенди билгенден сурап, жакшы кеңешке кулак сал. «Баарын билем» деген адам үйрөнүүдөн куру калат.", "problem": "Different moral; the warning against «Баарын билем» is missing."}], "preview": "../../ky/wisdom-stories/illustrations/from-a-wise-fathers-advice-to-his-son.webp"}, {"stem": "doctors-appointment", "title": "Дарыгердин кабыл алуусунда", "category": "Акылмандык жана өмүр сабактары", "status": "Needs correction", "items": [{"kind": "title", "image": "«Дарыгердин кабыл алуусунда»", "story": "Дарыгердин кабыл алуусунда", "problem": ""}, {"kind": "caption", "image": "Бүгүн дарыгердин кабыл алуусуна келдим. Күтүү бөлмөсүндө бир бала бутерброд жеп, алма ширесин ичип отурду. Ал дени сак жана бактылуу көрүнгөн. Бир аздан кийин аты-жөнүн чакырышып, ал кабинетке кирди.", "story": "Дарыгерге кирүү үчүн кезегимди күтүп отургам. Үйдөн эртең мененки тамакты ичүүгө үлгүрбөгөндүктөн, буфеттен бир сэндвич менен алма ширесин сатып алып жей баштадым.", "problem": "The boy is already eating; in the story the narrator is eating."}, {"kind": "caption", "image": "Анын көз алдында мен «ал жакшы көрүнөт, демек ал дени сак» деп ойлодум. Үмүт кылдым. Ал бутербродду жеп, бир аз алма ширесин ичти. Узакка созулбай, ал кабинеттен чыкты. «Жакшы эле көрүнгөн, анда ал ден соолук болчу» деп ойлодум.", "story": "Анын көз карашы «Мен да ачкамын» деп жаткандай сезилди. Боорум ооруп, буфетке кайра барып, ага да сэндвич менен алма ширесин сатып бердим.", "problem": "He judges the boy healthy instead of buying him food."}, {"kind": "speech", "image": "Сиз эмне дедиңиз? Жок, андай эмес! Ал көрүнгөндөй эмес экен. Анын ашказаны ооруп, тамак оорудан дарылоого келген. Кээде адамдар сыртын жаман көрүнбөй, ичинен кыйналышат.", "story": "— Эмне кылдыңыз? Дарыгер баланы кароого ачкарын алып келүүнү тапшырган. Жумуштан уруксат алып, алыс жолдон келдик. Эми эртең баарын кайра баштоого туура келет.", "problem": "Different speech and meaning."}, {"kind": "caption", "image": "Андан кийин жүзүнөрдү карап, сурашканыбызды билдим.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Үйгө кайтып, ойлонуп калдым. Мен чындыгында ал тууралуу эч нерсе билген эмесмин. Жакшы көрүнгөнүнө гана таянып, ишеним жасап, туура эмес жыйынтык чыгарган го экенмин.", "story": "Жакшылык кылдым деп ойлоп, бир үй-бүлөнүн мээнетин текке кетириптирмин.", "problem": "Different conclusion."}, {"kind": "moral", "image": "Сезим менен божомолго гана таянган ой жаңылыш чечимге алып келиши мүмкүн.", "story": "Сабак: Жакшы ниеттин өзү жетишсиз. Жардам берерден мурун жагдайды билип ал, антпесе жакшылык кылам деп түйшүк жаратышың мүмкүн.", "problem": "Different moral."}], "preview": "../../ky/wisdom-stories/illustrations/doctors-appointment.webp"}, {"stem": "dervishs-spoons", "title": "Дербиштин кашыктары", "category": "Иман жана руханият", "status": "Needs correction", "items": [{"kind": "title", "image": "«Дервиштин кашыктары»", "story": "Дербиштин кашыктары", "problem": "«Дервиш» instead of «Дербиш»."}, {"kind": "speech", "image": "Дервиш ата, эмне үчүн бирөөлөр дасторкондо отуруп алып да ач калышат?", "story": "— Чындап сүйгөндөр менен сүйүү тууралуу сөз гана кылгандардын айырмасы эмнеде?", "problem": "Different question, and «Дервиш» instead of «дербиш»."}, {"kind": "caption", "image": "Дервиш бир нече адамды чакырып, дасторкон жайды.", "story": "Ал сүйүүнү ооз учунда гана айткан бир нече адамды чакырып, аларга дасторкон жайды.", "problem": "Drops that these people only talk about love."}, {"kind": "speech", "image": "Кашыктарыңыздын учун байлап берем.", "story": "— Шорпону ушул кашыктардын учунан кармап жейсиңер.", "problem": "«байлап берем» is not in the story."}, {"kind": "caption", "image": "Кашыктарды ооздоруна жеткирүүгө аракет кылышты, бирок өздөрү жей алышкан жок, ашары ошол бойдон калды.", "story": "Бирок кашыктар ушунчалык узун болгондуктан, шорпону оозго жеткирүү мүмкүн эмес эле: ар бир аракетте шорпо үстүлөрүнө төгүлүп, денелерин күйгүзүп жатты.", "problem": "Omits the spilled soup and burns."}, {"kind": "caption", "image": "Андан кийин дервиш сүйүүнүн сырын түшүндүрдү.", "story": "Андан кийин дербиш чыныгы сүйүү эмне экенин билген адамдарды чакырды.", "problem": "Says he explained love; the story says he invited people who know love. «дервиш» again."}, {"kind": "caption", "image": "Ар бир кашыгын маңдайындагынын оозуна жеткиришет деп айтты.", "story": "ар ким кашыгын толтуруп, маңдайындагы адамга сунду, бири-бирин тамактандырышты.", "problem": "Worded as an instruction rather than what they did."}, {"kind": "speech", "image": "Түшүндүңөрбү? Жашоонун сыры ушул — өзүңдү эмес, башканы ойлосоң, Кудай да сени унутпайт. Маңдайыңдагыны тойгузсаң, өзүң да тоёсуң.", "story": "— Көрдүңөрбү? Жашоо дасторконунда өзүн гана көргөн адам ач калат. Бир тууганын, досун ойлоп, ага кол сунган адам өзү да тоёт.", "problem": "Adds «Кудай да сени унутпайт» and changes the wording."}, {"kind": "moral", "image": "Жашоо дасторконунда өзүн гана ойлогон адам ач калат, маңдайындагыны тойгузган адам өзү да тоёт.", "story": "Сабак: Өзүн гана ойлогон адам ач калат. Башканы тойгузган өзү да тоёт.", "problem": "«маңдайындагыны» instead of «Башканы»."}], "preview": "../../ky/wisdom-stories/illustrations/dervishs-spoons.webp"}, {"stem": "dervishs-clothes", "title": "Дербиштин кийим-кечеси", "category": "Иман жана руханият", "status": "Needs correction", "items": [{"kind": "title", "image": "«Дервиштин кийим-кечеси»", "story": "Дербиштин кийим-кечеси", "problem": "«Дервиш» instead of «Дербиш»."}, {"kind": "caption", "image": "Элдер дервиштен сурашты:", "story": "Дербиштен сурашты:", "problem": "«Элдер» added, and «дервиш» instead of «дербиш»."}, {"kind": "speech", "image": "Дервиштин кийим-кечесинин сыры эмнеде?", "story": "— Кийим-кечең эмнеге мынчалык тыкан эмес?", "problem": "Different question."}, {"kind": "speech", "image": "Мен сырткы кийимдин сулуусу эмес, ички сулуулукка маани берем.", "story": "— Дайыма ички дүйнөмдү оңдоо менен алек болгондуктан, сырткы көрүнүшүмдү түзөөгө убактым жетпейт.", "problem": "Different answer."}, {"kind": "moral", "image": "Адамды кийими эмес, жүрөгүнүн тазалыгы сулуу кылат.", "story": "Сабак: Адамдын көркү кийиминде эле эмес, пейилинде. Ички дүйнөсү таза адамдын жүзүнөн да жарык көрүнөт.", "problem": "«жүрөгүнүн тазалыгы» instead of «пейилинде», and the second sentence is missing."}], "preview": "../../ky/wisdom-stories/illustrations/dervishs-clothes.webp"}, {"stem": "dervishs-robe", "title": "Дербиштин чапаны", "category": "Иман жана руханият", "status": "Needs correction", "items": [{"kind": "title", "image": "«Дервиштин чапаны»", "story": "Дербиштин чапаны", "problem": "«Дервиш» instead of «Дербиш»."}, {"kind": "caption", "image": "Бир күндө аккөнүл бир чымчык сарайыма келип, дервиштин чапанын кийген бирөөнү көрүптүр.", "story": "Бир күнү канаты жараланган куш падышанын алдына келип, бир дербиш анын канатын сындырып койгонуна даттанат.", "problem": "The bird does not report a broken wing."}, {"kind": "speech", "image": "Анын жанына барып сураптыр. Эмне үчүн дервиштин чапанын кийдиң?", "story": "— Бул куш сенин үстүңдөн арызданууда. Эмне үчүн анын канатын сындырдың?", "problem": "Asks why he wore the robe, not why he broke the wing."}, {"kind": "speech", "image": "Мен жакшы болайын деп кийген жокмун, муну адамчылык деп эсептебе. Бул чапанды мен ыйык адамдарды көрүп, алардай болууга умтулуп, өзүмдү эскертип туруу үчүн кийдим.", "story": "— Падышам, мен бул кушту кармагым келди.", "problem": "Different defense."}, {"kind": "speech", "image": "Бул адам туура айтып жатат окшойт. Бирок, анын чыныгы абалын билүү үчүн дубадан кайтып көрөйүн.", "story": "— Бул киши туура айтып жатат. Сен эмнеге качкан жоксуң?", "problem": "The king turns to prayer instead of asking the bird why it did not flee."}, {"kind": "speech", "image": "Ошон үчүн дуба үчүн өзүмдү чымчык кылып, дарбаңдан жанына кондум. Мен аны намазга турганда көрдүм. Намазда анын кадагасы узун, ойлору башка жакта жүргөнүн сездим.", "story": "— Аны дербиштин кейпинде көргөнүм үчүн качкан жокмун. Мергенчи болгондо, дароо учуп кетмекмин. Бирок «дербиштен зыян келбейт, алар Кудайдан коркот» деп ойлодум.", "problem": "Namaz and a long stitch replace the bird’s reason for not fleeing."}, {"kind": "speech", "image": "Эй, адам! Дервиштин чапанын чеч да кой!", "story": "— Куштуку туура. Дербиштин колун сындыргыла!", "problem": "The bird orders the robe removed; in the story the king orders the hand broken."}, {"kind": "speech", "image": "Хаким, мени укуула, мен айтып койуун!", "story": "— Суранам, андай кылбаңыз!", "problem": "Different plea; «койуун» is misspelled."}, {"kind": "speech", "image": "Эмне дейсиң?", "story": "— Эмне үчүн? — деп сурайт падыша.", "problem": "Shortened, but the question is the same idea."}, {"kind": "speech", "image": "Чапанын катаал болгону жүрөгүңдү жумшартпайт, ниетиңди ондоо менен сооп табасың. Сыртын эмес, ички дүйнөң маанилүү экенин унутпа.", "story": "— Колун сындырсаңыз, айыккандан кийин кайра эле ушундай кылат. Андан көрө үстүндөгү дербиштин чапанын чечтирип салыңыз, мага окшогон куштар экинчи алданбасын.", "problem": "Different reason for removing the robe."}, {"kind": "moral", "image": "Сыртынан ыйык көрүнүү адамды чыныгы такыба кылбайт. Чапан адамды дервиш кылбайт.", "story": "Сабак: Чапан кийгендин баары эле дербиш эмес. Адамдын ким экенин сырткы кейпинен эмес, кылган ишинен тааны.", "problem": "«дервиш» spelling, and the second sentence of the lesson is missing."}], "preview": "../../ky/wisdom-stories/illustrations/dervishs-robe.webp"}, {"stem": "diderot-effect", "title": "Дидро эффекти", "category": "Акылмандык жана өмүр сабактары", "status": "Needs correction", "items": [{"kind": "title", "image": "«Дидро эффекти»", "story": "Дидро эффекти", "problem": ""}, {"kind": "caption", "image": "Он сегизинчи кылымдын акырында Дени Дидро жалгыз жашаган жана чоң жеке китепканасы болгон.", "story": "XVIII кылымдагы француз жазуучуларынын бири, агартуучу Дени Дидро чоң карызга батат.", "problem": "Omits the debt; says he lived alone with a library."}, {"kind": "caption", "image": "Кимдир бирөөдөн сонун халат белек алды — болжол менен 25 сайынга маанилүү эмес нерсе. Жаңы халат баарын өзгөрттү.", "story": "ошол китепканада иштесин деп Дидрого 25 жылдык айлыгын да алдын ала төлөп берет.", "problem": "The 25-year salary is called an unimportant robe gift."}, {"kind": "speech", "image": "Бул жакшы. Аны менин Францияма да тагын. Ага татат.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Бийик каттуу адамдар менин жаңы халатымды суктанып жатышат. Дидро мындан артык болушу керек.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Сиз туура айтасыз! Бардыгы алмашсын!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Албетте! Башкасына да ушундай тийиш.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Дидро биринчи эски столун алмаштырды. Андан кийин жаңысына ылайык дагы үй эмеректерин өзгөрттү.", "story": "дароо жаңы үстөл сатып алганы жөнөйт.", "problem": "Different sequence and wording."}, {"kind": "thought", "image": "Бул эмерек менин жаңы халатыма жарашпайт.", "story": "бул кооз баркыт халат менен үстөл бири-бирине төп келбей турганын ойлойт", "problem": "Different wording."}, {"kind": "caption", "image": "Кийин полго карап: жарашпайт экен. Жаңы килем алышым керек.", "story": "жердеги эски килем халатына да, үстөлүнө да жарашпай калганын көрөт.", "problem": "Shortened."}, {"kind": "speech", "image": "Мына ушу тепличке да ылайык келбейт го...", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Кресло, пардалар, сүрөттөр — баары жаңы болушу керек! Алар бир-бирине ылайык келсин! Бүгүн тазартса ишенишим керек!", "story": "Үйдөгү креслолор, шкафтар, отургучтар, дубалдагы сүрөттөр жана бөлмөнүн жасалгалары эми бири-бирине төп келбей", "problem": "Different wording."}, {"kind": "speech", "image": "Дидро кийин терезе жана перделерди да алмаштырды. Даяр болбосо, бул чексиз.", "story": "Дидро үйүндөгү буюмдардын баарын майда-чүйдөсүнө чейин алмаштырат.", "problem": "Different wording."}, {"kind": "speech", "image": "Эми баракелде менин полум, агашым, эмерегим жана перделерим бир тартипке келди экен.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Ошондон кийин ал муну түшүндү: ач-сезим десең, бир жаңы нерсе калганын да өзгөрткүң келет.", "story": "Кайра баштапкы чекитине келип калышына өзүнүн тойбогон ач көздүгү себеп ерилген. Убактыбызды туура пайдалансак, бул жашоодо каалаган нерсебиздин баарына жете алабыз.", "problem": "Сөздөр жана маани башка: өмүр бир гана берилгени жана убакыт туура пайдаланылса баарына жетери жок."}, {"kind": "speech", "image": "Алгач, эмне эң маанилүү?", "story": "гольф топтору — жашоодо эң жогору баалаган нерселериңердин", "problem": "Гольф топтору жана суроо «банка толдубу?» жок."}, {"kind": "speech", "image": "Албетте!", "story": "— Толду, — деп баары бир ооздон жооп берет.", "problem": "Жооп «Толду» эмес."}, {"kind": "speech", "image": "Андан кийин, эмнелер киргизебиз?", "story": "— Эмичи, банка толдубу?", "problem": "Суроо башка."}, {"kind": "speech", "image": "Ооба!", "story": "— Ооба, — деп жооп беришет окуучулар.", "problem": ""}, {"kind": "speech", "image": "Ал эми майда-барачылар чычыбы?", "story": "— Банка толдубу?", "problem": "Кум суроосу башка сөз менен берилген."}, {"kind": "speech", "image": "Эгер банкага адегенде майда-барастарды салсак — кумду, таштарды, анан мына бул топторду, кылычылдактарды салсак, эңдиз аларга эң баалуу нерселер батпайт.", "story": "Эгер мен банканы адегенде кумга толтурсам, гольф топторуна да, шагылдарга да орун калмак эмес.", "problem": "Кум, шагыл, гольф топторунун тартиби жана аталыштары башка; «кылычылдактар» жомоктон жок."}, {"kind": "speech", "image": "Эгер мен банкага алгач кумду толтурсам, анда топторго, таштарга жана кылычылдактарга орун калбайт. Өмүр банкамызды акылдуу толтурайлы.", "story": "Эгер мен банканы адегенде кумга толтурсам, гольф топторуна да, шагылдарга да орун калмак эмес. Жашоо да ушундай.", "problem": "«Кылычылдактар» жана «акылдуу толтурайлы» жомоктон жок."}, {"kind": "caption", "image": "Ошондуктан эң кичинекей нерселерди — убакытты, игиликтерди, көңүл ачууларды — сүйүүгө, үй-бүлөгө, ден соолукка жана чыныгы маанилүү нерселерге арнашбыз керек.", "story": "Эгер аны майда, маанисиз нерселерге толтуруп, бүт убактыбыз менен күчүбүздү ошолорго сарптасак, эң маанилүү нерселерге убакыт калбайт." огултат.", "problem": "He pays 200 bowls of gold instead of collecting 200 sacks."}, {"kind": "speech", "image": "Падышанын бергени 50 эмес, 200 кесе алтын болду экен!", "story": "Паша: «Салык салбасам да, элүү эмес, эки жүз кап меджидие алтынын чогулттум», — дейт.", "problem": "Gold is given away, not collected; unit is bowls, not sacks."}, {"kind": "speech", "image": "Бул эмне деген акылдуу маселе, ээ?", "story": "— Муну кантип кылдыңыз, паша?", "problem": "The question is different."}, {"kind": "speech", "image": "Карылар жакшы сунушташты, падышанын жүктү оортуу дагы азайтты.", "story": "", "problem": "The lamb-skin proverb is missing."}, {"kind": "moral", "image": "Сабак: Кедейди тонобой, мүмкүнчүлүгү барлардын арам кирешесин алуу адилеттүүрөөк. Жүктү жакырдын эмес, күчтүүнүн мойнуна салуу керек.", "story": "Сабак: Ансыз да араң жан баккан элдин жүгүн оорлотпо. Жоопкерчилик менен түйшүктү мүмкүнчүлүгүнө жараша бөлүштүр.", "problem": "Moral wording differs, and the proverb is absent."}], "preview": "../../ky/wisdom-stories/illustrations/skins-of-the-lambs.webp"}, {"stem": "shepherd-must-be-called", "title": "Койчуну чакыруу керек", "category": "Сөз, унчукпоо жана баарлашуу", "status": "Needs correction", "items": [{"kind": "title", "image": "Койчуну чакыруу керек", "story": "Койчуну чакыруу керек", "problem": ""}, {"kind": "speech", "image": "Күчүк илеп жатат, ата. Алар койлоруңузга барып калган окшойт. Эмне кылабыз?", "story": "Көп жылдык окуусун аяктагысы келген бир шакирт устатынан бата алуу үчүн кайрылат.", "problem": "Different scene and wording."}, {"kind": "speech", "image": "Барып кууп чыгайынбы, же колума таяк алып, коркутайынбы? Же таш ыргытайынбы? Кабатырланып кетип жатам, не кылсам жакшы болот?", "story": "— Эңкейип, жерден бир нече таш алам да, иттерге ыргытып, кууп жиберем.", "problem": "Question instead of the story answer; different wording."}, {"kind": "speech", "image": "Тынчта, уулум, алды менен ойлон.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Карачы, бул көчөткө. Канча күчүк чогулуптур. Сен жалгыз барсаң, алар сени коркутуп, кол сала коюшат. Мындай учурда эмне кылат элең?", "story": "— Балам, элестетчи: айылыңа баратып, жолдо бир койчунун кутурган иттеринин бүтүндөй тобу сага кол салды дейли.", "problem": "Different situation and wording."}, {"kind": "speech", "image": "Жакын жерден жардам сурайм. Кошуналарды чакырам же койчуну чакырам.", "story": "койчуну чакырып, иттерин токтотушун сурашың керек", "problem": "Adds calling neighbors; not the story answer."}, {"kind": "speech", "image": "Туура айтасың, уулум. Күч менен эмес, акыл менен иш кылыш керек. Бир өзүң барсаң, коркунуч көбөйөт. Башкача жардам изде.", "story": "Баарына жалгыз күчүң менен туруштук берүүгө аракеттенбе.", "problem": "Different wording."}, {"kind": "speech", "image": "Ал эми койлорго эмне болот? Качып кетпейби?", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Эң негизгиси, алды менен өзүңдүн коопсуздугуңду ойло. Сен аман болсоң, койлорду да сактап калып аласың. Ошондо кантип кылуу керек?", "story": "Иттер койчунун үнүн угары менен турган жеринде катып калышат.", "problem": "Different advice and meaning."}, {"kind": "speech", "image": "Туура айтасыз, жалгыз күчүм жок. Мен койчуну чакырам же адамдарды чогултам. Жакшы ойлонуп, акыл менен иш жүргүзөм. Сабыр кылуу мен үчүн эң туура болот экен.", "story": "койчуну чакырып, иттерин токтотушун сурашың керек", "problem": "Adds gathering people and patience; not the story line."}, {"kind": "moral", "image": "Сабак: Ар бир маселе күч менен чечилбейт. Кээде бир кадам артка чегинип, башкача кароо — эң кыска чыгуу жолу.", "story": "Сабак: Баарына жалгыз күчүң менен туруштук берүүгө аракеттенбе. Кээде маселени чече ала турган адамга кайрылуу — эң туура жол.", "problem": "Different moral; stepping back is not in the story."}], "preview": "../../ky/wisdom-stories/illustrations/shepherd-must-be-called.webp"}, {"stem": "shepherds-word", "title": "Койчунун сөзү", "category": "Сөз, унчукпоо жана баарлашуу", "status": "Needs correction", "items": [{"kind": "title", "image": "Койчунун сөзү", "story": "Койчунун сөзү", "problem": ""}, {"kind": "caption", "image": "Бир замандар бир айылда Хасан деген койчу жашаптыр. Ал адамга дайыма чынчыл айтуучу койчу экен.", "story": "Илгери бир айылда Хасан аттуу кедей, бирок чынчыл койчу жашаптыр.", "problem": "Drops кедей; adds чынчыл айтуучу."}, {"kind": "speech", "image": "Эй Хасан, эгер менин сөзүмдү элге жакшы жеткирсең, сага көп кой берем. Ал эми жаман жеткирсең, сага эч кандай сыйлык бербейм.", "story": "Эй, Хасан, сен тоодогу жайыттарды жакшы билет экенсиң деп уктум. Ушул жайда малымды сага тапшырам. Күзүндө малым аман-соо, семиз болуп кайтса, сага бир уй берем.", "problem": "Different bargain: words and many sheep, not herding for one cow."}, {"kind": "caption", "image": "Хасан макул болду. Ал жамгыр-жашын тийбей, тоо-таштан коркпой, кыя-жай аркылуу өтүп, ар бир сөздү сөзмө-сөз элге жеткирди.", "story": "Хасан макул болот. Жай бою жаанга да, күнгө да карабай малды жайып, түнкүсүн кирпик какпай кайтарат.", "problem": "He carries words, not livestock."}, {"kind": "speech", "image": "Сага мал берейин деп ойлогонум жок эле, мен сени гана сынагым келген. Сен тапшырманы чын жүрөктөн аткардың. Эми сага эмне кеңеш берем?", "story": "Менин сага уй берейин деген оюм жок болчу. Ал сөздү сени ишке шыктандырыш үчүн эле айткам.", "problem": "Test instead of a false promise; different wording."}, {"kind": "speech", "image": "Туура дейсиз, ага. Мен эч нерсе үчүн эмес, чындык бар дегенде жана өзүмдүн абийиримдин тынчтыгы үчүн эле айттым. Санын көп кой эмес, сөздүн чынчылдыгы чоң экенин түшүндүм.", "story": "Туура айтасыз, байым, мен кедеймин. Бирок абийирим бар, айткан сөзүмө өзүм кожоюнмун. Сиз бай болушуңуз мүмкүн, бирок берген сөзүңүздүн баркы жок болсо, чыныгы кедей — сизсиз.", "problem": "Different reply; the rich man is not called the real poor one."}, {"kind": "caption", "image": "Бул сөздөр айылда баштан-аяк тарады. Адамдар койчунун чынчылдыгына ыраазы болуп, аны сыйлашты. Ошондон тартып ал элдин ишенимдүү адамына айланды. Ал сөздүн күчү малдан эмес, абийирден жана ишенимдүүлүктөн болорун түшүндү.", "story": "Бул сөз айылга ооздон-оозго тарайт. Байдын кадыр-баркы кетип, эл аны менен иш кылуудан тартына баштайт.", "problem": "The rich man is not shamed; meaning differs."}, {"kind": "moral", "image": "Адамдын чыныгы байлыгы — мал-мүлкү эмес, сөзү, абийири жана ишенимдүүлүгү.", "story": "Сабак: Мал-мүлк адамдын баркын аныктабайт. Убадага бектик, таза абийир, ишеним — чыныгы байлык.", "problem": "Related idea, different wording; убадага бектик is missing."}], "preview": "../../ky/wisdom-stories/illustrations/shepherds-word.webp"}, {"stem": "expressions-you-should-stay-away-from", "title": "Колдонбоо керек болгон сөздөр", "category": "Адеп жана мүнөз", "status": "Needs correction", "items": [{"kind": "title", "image": "Колдонбоо керек болгон сөздөр", "story": "Колдонбоо керек болгон сөздөр", "problem": ""}, {"kind": "caption", "image": "Төмөнкү сөздөрдү узак убакыт колдонуу, сүйүктүүңүзгө каршы терс таасирин тийгизиши мүмкүн:", "story": "Бул сөздөрдөн алыс болуңуз, айрыкча үй-бүлөдө жубайыңызга карата аларды эч качан колдонбоңуз:", "problem": "Intro wording differs."}, {"kind": "caption", "image": "«Бардыгы сенден!» Бул сөз өнөктөшүңүздүн жашоосундагы жана эмоциясындагы бардык кыйынчылыктар үчүн аны күнөөлүү сезет. Бир аз өткөндө анын өзүнө болгон ишенимин жоготуп, өзүн алсыз сезүү жана сизге карата ачуусу пайда болушу мүмкүн.", "story": "«Болбогонду сүйлөбө!»", "problem": "The forbidden phrase and its explanation are different."}, {"kind": "caption", "image": "«Ар дайым!» Бул калет нерселерди жалпы эле туура эмес деп искароо кылат, адам өзүн түшүнүлбөгөн жана бааланбайт деп сезет. Бул өзүн жемсөө сезимин күчөтүп, ачык сүйлөшүүгө тоскоол болот.", "story": "«Апыртпа!»", "problem": "The forbidden phrase and its explanation are different."}, {"kind": "caption", "image": "«Сенин ордунда (эгерде мен болсоң) мен башкача кылмакмын!» Бул сөз маселе үчүн сизди күнөөлөп, өзүңүзчүн жогору койдугу көрсөтөт. Чындыгында, бул сиздин аракеттериңизди жокко чыгарып, өзүн түшүнүлбөгөн жана кабыл алынбайт деп сезүүгө алып келет.", "story": "«Тигинин күйөөсүн (аялын) карачы! Ал тигинтип-мынтип жүрөт, а сенчи?»", "problem": "The forbidden phrase and its explanation are different."}, {"kind": "caption", "image": "«Сен эч качан түшүнбөйсүң!» Бул сөз сиздин жашооңузду кабыл алууну жана сиздин пикириңизди бөлүшүүнү токтотот. Натижада аралык өсүп, маанилүү нерселерди ачык сүйлөшүү азаят жана бири-бирин түшүнүү жоголот.", "story": "«Сен түшүнбөйсүң!»", "problem": "Adds 'эч качан' and the explanation differs."}, {"kind": "caption", "image": "«Сага эмне, кыл, каалаганыңды кыл, мени угуп, билбегинче!» Бул сөз кызыксыздыкты жана кайдыгерликти көрсөтөт. Өнөктөшүңүздү баалабаганыңызды жана анын сөзү маанилүү эмес экенин билдирет. Эмоциялык жакындыкты бузуп, ишенимдин жоголушуна алып келет.", "story": "«Ал жакка барба, аны менен сүйлөшпө, муну кылба, муну кийбе, антип сүйлөбө, муну алып кел, тигини ал!»", "problem": "The forbidden phrase and its explanation are different."}, {"kind": "moral", "image": "Сөздөр эң жакшы көргөн адамды жаралашы мүмкүн. Үй-бүлөдө сый-урматтын тили керек.", "story": "Сабак: Жакыныңдын көңүлүн сөз менен жаралап алба. Үй-бүлөнүн ынтымагы буйруктан эмес, сыйлашып сүйлөшүүдөн бекемделет.", "problem": "Moral wording differs."}], "preview": "../../ky/wisdom-stories/illustrations/expressions-you-should-stay-away-from.webp"}, {"stem": "generous-man", "title": "Колу ачык адам", "category": "Адеп жана мүнөз", "status": "Needs correction", "items": [{"kind": "title", "image": "«Колу ачык адам»", "story": "Колу ачык адам", "problem": ""}, {"kind": "caption", "image": "Колу ачык адам суроо берет:", "story": "Колу ачык бир адамдан сурашат:", "problem": "Image says the generous man asks a question; the story says people ask him."}, {"kind": "speech", "image": "«Касиеттүүлөргө пайда келтирсем, муну кимден алганымдан деп жатасыз?»", "story": "Жарды-жалчыга бөлүшкөн ырыскың үчүн ыраазычылык күтөсүңбү?", "problem": "Different question: virtues and where the benefit came from, not thanks for sharing with the poor."}, {"kind": "speech", "image": "«Мен өзүм жөн гана Аллахтын берүүчүсү — кабарчысы болом.»", "story": "Мен өзүмдү ашпозчунун колундагы чөмүчкө окшотом.", "problem": "Missing the cook-and-spoon comparison; wording and meaning differ."}, {"kind": "speech", "image": "«Кашык болгону колумда, чыныгы берүүчү — Аллах.»", "story": "Тамак чөмүч менен бөлүштүрүлгөнү менен, аны берген чөмүч эмес, ашпозчу.", "problem": "Spoon is attributed to the speaker’s hand and the giver is named Allah, not the cook."}, {"kind": "moral", "image": "Жакшылык кылган адам берген нематтын ээси өзүм дебесин. Чыныгы Берүүчү — Аллах.", "story": "Жакшылык кылсаң, аны милдет кылба. Берген ырыскыңдын түпкү ээси Жараткан экенин эстеп, өзүңдү аны жеткирген себепчи деп бил.", "problem": "Moral is reworded and drops not treating the good deed as a favor."}], "preview": "../../ky/wisdom-stories/illustrations/generous-man.webp"}, {"stem": "his-hand-is-at-work", "title": "Колу иште", "category": "Эмгек, ырыскы жана байлык", "status": "Needs correction", "items": [{"kind": "title", "image": "Колу иште", "story": "Колу иште", "problem": ""}, {"kind": "speech", "image": "Бир киши жумуртанын онын 10 сомуна алып 9 сомуна сатыр.", "story": "Бир киши он жумуртканы он тыйынга сатып алып, тогуз тыйынга сатчу экен.", "problem": "«тыйын» ордуна «сом»; «он жумуртка» так эмес."}, {"kind": "other", "image": "САТУУ 9 сом", "story": "тогуз тыйынга сатчу", "problem": "Акча бирдиги башка."}, {"kind": "other", "image": "САТЫП АЛУУ 9 сом", "story": "он тыйынга сатып алып", "problem": "Сатып алуу баасы 10 эмес, 9 деп жазылган."}, {"kind": "speech", "image": "Бул карыба алвердин максаты эмне?", "story": "Тааныштары мындай таң калыштуу сооданын максатын сураганда", "problem": "Сөздөрү башка."}, {"kind": "speech", "image": "Зыянга учурабайм; алвер маңдайыма мунууну көрүп мени жакшы соодагер деп ойлосун, ошону каалайм.", "story": "Зыян тартып жатканыма карабагыла; соода кылып жүргөнүмдү көрүп, баары мени соодагер деп эсептейт, колум иште экенин көрүшөт.", "problem": "«колум иште» жок; «зыянга учурабайм» маанини бурат."}, {"kind": "other", "image": "САТЫП АЛУУ 10 сом", "story": "он тыйынга сатып алып", "problem": "«тыйын» ордуна «сом»."}, {"kind": "moral", "image": "Эл көрсүн деп маанисиз ишке убакыт коротуу — өзү эле зыян.", "story": "Сабак: Элге иштеп жаткандай көрүнүү башка, иштен майнап чыгаруу башка. Куру көрүнүш үчүн убактыңды, каражатыңды текке кетирбе.", "problem": "Сабак башкача кыскартылган."}], "preview": "../../ky/wisdom-stories/illustrations/his-hand-is-at-work.webp"}, {"stem": "hold-my-hand", "title": "Колумдан карма", "category": "Үй-бүлө жана тарбия", "status": "Needs correction", "items": [{"kind": "title", "image": "Колумдан карма", "story": "Колумдан карма", "problem": ""}, {"kind": "speech", "image": "Кызым, колумдан бекем карма, сууга жакындаба.", "story": "Таттуу кызым, сууга түшүп кетпеш үчүн колумдан бекем карма.", "problem": "Missing Таттуу; сууга жакындаба versus сууга түшүп кетпеш үчүн."}, {"kind": "speech", "image": "Жок, ата, мен сага бекем кармайм.", "story": "Жок, ата, сен менин колумдан карма.", "problem": "She says she will hold him; the story says he should hold her hand."}, {"kind": "speech", "image": "Эмне үчүн?", "story": "Анын эмне айырмасы бар?", "problem": "Different question."}, {"kind": "speech", "image": "Армтың чоң таянычым бар. Сен мени колуңдан кармаганың жана мага канчалык кам көрсөң, мен дагы сени коё бербейм. Мен сени колумдан кармайм, ошондо биз эч качан ажырабайбыз.", "story": "Эгер мен сенин колуңдан кармап, мага бир нерсе болсо, колуңду коё беришим мүмкүн. Ал эми сен менин колумдан кармасаң, эмне болсо да колумду коё бербей турганыңа ишенем.", "problem": "The point is reversed and the wording differs."}, {"kind": "moral", "image": "Сүйүүнүн күчү — коё бербегенинде. Сүйгөндөрдүн колун өзүң бекем карма.", "story": "Сүйгөн адамыңдын колун кыйын учурда коё бербе. Ага ишенимдүү таяныч бол.", "problem": "Different moral wording."}], "preview": "../../ky/wisdom-stories/illustrations/hold-my-hand.webp"}, {"stem": "your-hand-at-work-your-hope-in-god", "title": "Колуң иште, үмүтүң Кудайда болсун", "category": "Иман жана руханият", "status": "Requires manual review", "items": [{"kind": "title", "image": "Колуң иште, үмүтүң Кудайда болсун", "story": "Колуң иште, үмүтүң Кудайда болсун", "problem": ""}, {"kind": "caption", "image": "Дервиш эрте менен намаз окуп, колу уста экендиги менен иштеп жүрчү. Ал өмүрүн чынчыл өткөрүп, муктаждарга эч качан кайтарып жибербечү. Керегине жетерлик рискасын нан менен тапчу.", "story": "Күндөрүнүн көбүн жалгыздыкка берилип, ибадат кылуу менен өткөрчү экен. Бирок элге көз каранды болууну да жактырчу эмес, ошондуктан күнүнүн бир бөлүгүн ишке арначу", "problem": "Different details; «дервиш» instead of «дербиш»."}, {"kind": "caption", "image": "Бир күнү ал бир айылдан алыс чөлдө бараткан, ачка түлкүнү жолукпайт. Ал экоонун ортосунда минтип ой жүгүртөт.", "story": "Бир күнү ал дагы эле талаада ибадат кылып отуруп, бир түлкүнү көрүп калат.", "problem": "He is walking in a desert, not sitting in worship in a field."}, {"kind": "thought", "image": "Бечара түлкү, өзүн тамак таба албай экенсиң. Кудайым анын ризыгын бербеседей. Бирок Ааламдын Рабби анын да муктаждыгын эске алат го.", "story": "«Бул түлкү эмне менен күн көрөт болду экен?»", "problem": "Different thought."}, {"kind": "caption", "image": "Ошол учурда арстан келип, түлкүнү эле эмес, газедди да кармап жейт. Андан соң калган сүйгүн да тазалап, этин да калтырыбай жейт.", "story": "Арстан олжосун жерге коюп, бөлүп жеп, тойгондон кийин калганын ошол жерге таштап кетет.", "problem": "The lion eats everything, including the fox; in the story he leaves meat for the fox."}, {"kind": "thought", "image": "Бул дервиш өзү жөнүндө мындай ой жүргүзөт: Эгер түлкүгө да Кудай ризык берет экен, анда мени эмне үчүн багармыз эмес? Эртеңтен тартып мен иштебей жайынам да, намаз жана сыйынуу менен гана алектенем.", "story": "«Бул түлкү эч нерсе кылбай туруп ырыскысын тапса, Алла Таала менин ырыскымды эмнеге жеткирбесин?»", "problem": "Similar idea, different words; «багармыз» and «жайынам» are not story wording."}, {"kind": "caption", "image": "Ал иштөөдөн токтоп, башкаларга берүүнү да токтотту. Күндөр өтүп, ачкачылык аны кыйнай баштады. Ал жардам сурап ошол дервишке келди. Бирок дервиш кеч болгонун жана ал чоң ката кетиргенин айтты.", "story": "Ошол күндөн тартып дербиш ишти биротоло таштап, күнү-түнү ибадатка берилет. Бирок канча күтсө да, ырыскы келбейт.", "problem": "A second dervish and a visitor are not in the story."}, {"kind": "speech", "image": "Ал намаз окуп, мындай деди:", "story": "Акыры алдан-күчтөн тайган бир күнү кайыптан үн угулат:", "problem": "The spoken prayer itself was not read confidently."}, {"kind": "caption", "image": "Ал кайрадан ишке киришти. Күн сайын эмгектенип, тапканын бөлүштү. Ал иштеп жүрүп, кайрадан муктаждарга жардам берип баштады.", "story": "Дербиш кылган ишинен уялып, тообо кылат да, мурдагы жашоосуна кайтат.", "problem": "Close in outcome, different wording."}, {"kind": "caption", "image": "Анын жүрөгү ыраазычылыкка жана тынчтыкка толду. Ал Кудайга шүгүр кылып, колу иштеп жүрүп, намаз жана сыйынуу менен алектенди.", "story": "Кайрадан өз кол эмгеги менен ырыскы таап, башкаларга жүк болуу оюнан биротоло баш тартат.", "problem": "Different closing."}, {"kind": "moral", "image": "Сабак: Күчү жетип туруп муктаж адамдын ырыскысына көз арткан киши Кудайга таянган болбойт — болгону жалккоолугун ишеним менен жаап-жашырат.", "story": "Сабак: Күчүң барда эмгектенип, адал ырыскыңды тап. Кудайга таянуу аракетсиз отуруу эмес. Өзүңө да, муктажга да пайдаң тийсин.", "problem": "Different lesson; «жалккоолугун» is misspelled."}], "preview": "../../ky/wisdom-stories/illustrations/your-hand-at-work-your-hope-in-god.webp"}, {"stem": "welcome-my-bey", "title": "Кош келдиңиз, мырзам", "category": "Достук жана адамдык мамилелер", "status": "Needs correction", "items": [{"kind": "title", "image": "Кош келдиңиз, мырзам.", "story": "Кош келдиңиз, мырзам", "problem": ""}, {"kind": "caption", "image": "Рахматтык эне Хафиза эже Чанаккала шаарында жашаган. Бир уулу болгон, жылдызындай эркелеп өстүргөн. Атам деп сыйлаганым, даарым деп жалбарганым, бир тыйын сурабаганым сен үчүн эле, уулум. Сафарбарлыкка бардың, исимди ыйыктап, жашаууңду тилеп...", "story": "Маркум атам Хафыз Али Чанаккалада жүргөндө мен али энемдин курсагында, жети айлык элем.", "problem": "Names and facts differ: Хафиза эже and an already born son instead of Hafiz Ali and an unborn child. Several words are garbled."}, {"kind": "speech", "image": "— Уулум, мен базарга чыгып келем, отун, нан алып келем.", "story": "— Уулум, мен базарга барам. Атаң келсе, дароо мага кабар бер!", "problem": "The repeated request to report the father's arrival is missing."}, {"kind": "speech", "image": "— Кабатыр болбоңуз эне, отун алып келем, нан алып келем!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "— Сак бол, уулум. Отун алып келем, нан алып келем!", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Эр жеттиң, бизге таянып, бир эрдин кадымин кармадың. Энемдин көңүлү жай тапсын деп кайткен да эрдей болосуң дедим... Ант бергендин эрдиги, камат жайын угуп кеткен, журтум үчүн, энем үчүн деген балам болду.", "story": "Мен чоңоюп, кесиптүү болуп, дүкөн ачтым.", "problem": "Different life story."}, {"kind": "caption", "image": "Жылдар өттү. Аман келген жок. Бир кат келди. Израатты кагазга сыйланган сөздөр гана калды. Кыйындан кыйын ишин кылып, камат жайын угуп кеткен, журтум үчүн, энем үчүн деген балам болду.", "story": "Апам көзү жолдо болуп, атамды күтүп жүрдү.", "problem": "A letter and a different loss replace the mother's waiting."}, {"kind": "speech", "image": "Бир күнү түшүмө кирди, жүзү жарык. Койнумда жатканда берип жиберчүм: «Ыйлагың, күшүң, ыйла. Не жамандык кылган элең сен?» «Жок, энем, ыйлаба. Атам сыйктуу, эл үчүн, жер үчүн шахит болгондон уят эмес» деп.", "story": "Өлүм алдында биз менен коштошуп: «Мени жакшы бактыңар, акыңарды адал кылгыла», — деди.", "problem": "A dream speech replaces the deathbed words."}, {"kind": "speech", "image": "Бирок ал өлсө дагы, анын жыты, жылы сөз, ак ниет жүрөгүмдө жашайт.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "«Кош келдиңиз, мырзам»", "story": "«Кош келдиңиз, мырзам, кош келдиңиз!»", "problem": "The repeated кош келдиңиз is missing."}, {"kind": "caption", "image": "деп, рухуңду күтөм.", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Чанаккала эстелиги", "story": "18-март — Чанаккаладагы жеңиш күнү.", "problem": "Different label."}, {"kind": "caption", "image": "Жердин Чанаккаласы шахит болгон жаштардын азалтыгы менен, көзү жолдо калган энелердин, жүрөгүнүн ыйык бакылтыгы болсун! Мен да баламдын жолун ыйык деп күтөмүн!", "story": "Чанаккалада шейит болгон азербайжан жоокерлерибиз менен кошо бардык шейиттердин арбагы ыраазы болсун! Эч бир эненин көзү жолдо калбасын!", "problem": "Different memorial wording; азалтыгы and бакылтыгы are not story words."}, {"kind": "moral", "image": "Сабак: Эненин өмүр бою сактаган берилгендиги менен күтүүсү — сүйүүнүн эң таза көрүнүшү. Мекен үчүн шейит болгондордун жана көзү жолдо калган энелердин элеси ыйык.", "story": "Сабак: Өмүр бою үзүлбөгөн үмүт менен берилгендик сүйүүнүн күчүн көрсөтөт. Мекен үчүн курман болгондорду да, алардын жолун күткөндөрдү да унутпайлы.", "problem": "The moral is rewritten."}], "preview": "../../ky/wisdom-stories/illustrations/welcome-my-bey.webp"}, {"stem": "sacrificial-meat", "title": "Курмандык эти", "category": "Иман жана руханият", "status": "Needs correction", "items": [{"kind": "title", "image": "Курмандык эти", "story": "Курмандык эти", "problem": ""}, {"kind": "caption", "image": "Мектептин 5-классынын окуучусу Мансур ойлонуп отурду.", "story": "Мектептин 5-классында окучумун.", "problem": "Adds the name Мансур, which is not in the story."}, {"kind": "speech", "image": "«Курмандык эти да белушпөй, өзүм гана жесем болобу экен?»", "story": "", "problem": "Not in the story; «белушпөй» is misspelled."}, {"kind": "caption", "image": "Ошондо ал атасына кайрылды. Атасы Мансурга курмандык этинин маанисин түшүндүрдү.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Эртеси атасы Мансур жана сестрасы менен базарга барып, курмандык мал тандашты.", "story": "", "problem": "The family does not go to market to choose a sacrificial animal; «сестрасы» is not Kyrgyz story wording."}, {"kind": "speech", "image": "«Эң жакшысына алалы».", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "«Ооба, ошондойкулу».", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Атасы ооруканада жаткан чукул муктаж болгон адамды эстеди.", "story": "Ооруканага жеткенибизде атамдын жүзү кубарып кетиптир.", "problem": "The father remembers a patient; in the story the father himself is the patient."}, {"kind": "speech", "image": "«Балким, бул мырзага да эт керек болсо керек…»", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "«Ал абалы начар экен, сервп да алып баралы».", "story": "«Эмнеге тирүү калдым, силерге дагы жүк болдум»", "problem": "Different line; «сервп» was not read as a clear word."}, {"kind": "caption", "image": "Курмандык күнү келди. Мансур таң атай туратып, атасы менен мал союуга көмөк берди. Сүйлөшүп, этти бөлүштүрүштү.", "story": "Бирок, тилекке каршы, бизге бир кесим эт алып келген жан болгон жок.", "problem": "They share meat; in the story no neighbor brings them any."}, {"kind": "speech", "image": "«Кошуналарга да курмандык этинен жеткирейли».", "story": "«Кошуналар бизге курмандык этинен беришкен жок».", "problem": "Opposite meaning."}, {"kind": "caption", "image": "Андан соң алар майып жана муктаж үй-бүлөлөргө да эт алып барышты.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "«Балдарым, силер чын эле жакшы иш кылдыңар».", "story": "«Козуларым, ай, козуларым, силерге көп эт алып келдим»", "problem": "The grandmother brings meat because neighbors gave none; this praise is different."}, {"kind": "speech", "image": "«Аа, ата, биз чын эле жакшы иш кылдык экенбиз!»", "story": "— Эх, апа, эх! Ал уйду эмнеге сойдуң?", "problem": "The boy is proud; in the story he is sickened that the cow was slaughtered."}, {"kind": "speech", "image": "«Алиси!»", "story": "", "problem": "Not read as a story word."}, {"kind": "speech", "image": "«Абдан даамдуу болду!»", "story": "— Тишим-м-м!… — дедим. — Тишим аябай ооруп жатат.", "problem": "He enjoys the meat; in the story he pretends his tooth hurts because he cannot swallow it."}, {"kind": "caption", "image": "Ошентип, алар үй-бүлө жана кошуналары менен бирге майрамдык дасторконду бөлүшүштү.", "story": "", "problem": "A shared feast is not the ending."}, {"kind": "moral", "image": "Майрам баарынын майрамы болгондо гана чыныгы майрам болот. Муктаждарды унутпайлы.", "story": "Сабак: Майрамдын берекеси бөлүшкөндө билинет. Өз дасторконуң толуп турганда, кошунаңдын казаны бош калбасын.", "problem": "Different lesson."}], "preview": "../../ky/wisdom-stories/illustrations/sacrificial-meat.webp"}, {"stem": "purple-jacket", "title": "Кызгылт көк чепкен", "category": "Сүйүү жана нике", "status": "Needs correction", "items": [{"kind": "title", "image": "Кызгылт көк чепкен", "story": "Кызгылт көк чепкен", "problem": ""}, {"kind": "caption", "image": "Кадим замандарда түрк урууларынын арасында абдан баалуу кызгылт көк чепкен абийирдин жана урматтын белгиси болгон.", "story": "Байыркы замандарда түрк журттарында мындай салт болуптур: турмушка чыккан кыздардын себине башка буюмдар менен кошо кызгылт көк түстөгү чепкен да салыныптыр.", "problem": "The jacket is called a sign of honor; the story says it was a distress signal."}, {"kind": "caption", "image": "Чепкен киймек «эрим сен үчүн, эрим менин үмүтүм» дегендей, эрине көмөк болом деп маанисин айтчу.", "story": "«Күйөөмдү сүйбөйм, ал мени кыйнайт, өз каалоомсуз турмушка чыккам, ажырашкым келет, оор абалдамын, мага жардам бергиле»", "problem": "The jacket’s meaning is the opposite of the story."}, {"kind": "caption", "image": "Эр менен келин бири-бирин урматтап, сүйүү жана боорукерлик менен жашашкан.", "story": "Ошондуктан эркектер жубайлары менен болгон көйгөйлөрүн күч колдонбой, сүйүү жана урмат-сый менен чечүүгө аракет кылышчу экен.", "problem": "Wording differs and the reason is missing."}, {"kind": "caption", "image": "Уруу аксакалдары чепкенди ыйык деп санашкан. Аялга кол көтөрүү уят иш эле.", "story": "Мындайда айыл эли аялга жардам берип, күйөөсүн айыптачу. Бул эркек үчүн чоң уят саналчу экен.", "problem": "Wording differs."}, {"kind": "caption", "image": "Кыйын учурда аялдарды айылдаштары колдоп, биригип, укугун коргоп чыгышкан.", "story": "Эгер бир аял кызгылт көк чепкенин кийсе, ... улгайган энелер менен чоң энелер ... ошол чепкенди кийүүгө аргасыз болгон аялды коргоого чыгышчу экен.", "problem": "The purple jacket trigger is missing and the wording differs."}, {"kind": "caption", "image": "Той-думанда силер күү, сурнай чертилип, эл кубанган.", "story": "Ошол учурда тегеректе той-топур, сурнай-керней же башка оюн-зоок болсо, баары тынчып калчу экен.", "problem": "The story says celebration stops; the caption says people rejoice."}, {"kind": "caption", "image": "Бело киши үйүндө жалгыз отуруп, өзүнүн катасын түшүнүп өкүнгөн.", "story": "Кызгылт көк чепкен кийген аялдын күйөөсү үйдөн сыртка чыга албай, чайканага бара албай калчу, эч ким да анын жүзүнө карачу эмес.", "problem": "Wording differs."}, {"kind": "moral", "image": "Сабак: Аялга карата зомбулукка жол берилбейт. Коом аялды коргоону абийирдин милдети деп билгенде, зулумдукка орун калбайт.", "story": "Зомбулук көргөн аялды жалгыз калтырба. Анын кадырын, коопсуздугун коргоо — коомдун да милдети.", "problem": "Moral wording differs."}], "preview": "../../ky/wisdom-stories/illustrations/purple-jacket.webp"}, {"stem": "red-dress", "title": "Кызыл көйнөк", "category": "Сүйүү жана нике", "status": "Needs correction", "items": [{"kind": "title", "image": "Кызыл көйнөк", "story": "Кызыл көйнөк", "problem": ""}, {"kind": "caption", "image": "Кызыл көйнөк апасынын шкафында асынып турчу.", "story": "Кызыл көйнөк апамдын кийим шкафында илинип тура берчү.", "problem": "апамдын is replaced by апасынын, and илинип by асынып."}, {"kind": "speech", "image": "Апа, на өзгөчө күнүңүз! Эч качан эс алгыңыз келбейт?", "story": "— Апа, кандай сонун көйнөк! Муну сиздин үстүңүздөн эч качан көрбөптүрмүн.", "problem": "Daughter’s line differs."}, {"kind": "speech", "image": "Жок, керегим жок.", "story": "— Кийген да жокмун.", "problem": "Mother’s reply differs."}, {"kind": "speech", "image": "Сиз ар дайым биз үчүн жашап келдиңиз. Эми өзүңүз үчүн жашаганыңыз келсе болот.", "story": "— Ооба, апа, сиз эне колунан келгендин баарын жасадыңыз.", "problem": "Daughter’s line differs."}, {"kind": "speech", "image": "Балдарым үчүн жашадым, өзүмдү унутуп кеттим.", "story": "Мен өзүм үчүн эч качан эч нерсе каалаган эмесмин!", "problem": "Wording differs."}, {"kind": "speech", "image": "Апа, сиз көп нерсеге арзыйсыз. Азыр өзүңүз үчүн жашоонун убактысы келди.", "story": "— Кызым, — деди ал, — менин жолум менен кетпе. Мага сөз бер.", "problem": "This is the daughter speaking, not the mother’s last words."}, {"kind": "speech", "image": "Өзүңдү өлбөгөнчө, эмне каалайт элең? Чын эле өнөрүң жок белен?", "story": "— Бул көйнөктү каякка киймек элең? Операга барасыңбы?", "problem": "Husband’s line differs."}, {"kind": "speech", "image": "Бул көйнөктү кийейин десең, эмне болду? Өзүңө эсен барбы?", "story": "— Бу sorrow", "title": "Күч жана кайгы", "category": "Адеп жана мүнөз", "status": "Needs correction", "items": [{"kind": "title", "image": "«Күч жана кайгы»", "story": "Күч жана кайгы", "problem": ""}, {"kind": "speech", "image": "«Аллахым! Мага кайгыма туруштук бере турган күч бер, же күчүмө ылайык кайгы бер.»", "story": "Кудайым! Мага же тарткан кайгыма жараша күч бер, же күчүм жеткидей кайгы бер.", "problem": "Аллахым instead of Кудайым; “strength to withstand sorrow” and “sorrow fitting my strength” replace “strength matching the sorrow I bear” and “sorrow my strength can carry.”"}, {"kind": "caption", "image": "Я же күч бер, же күчүмө ылайык кайгы бер.", "story": "Мага же тарткан кайгыма жараша күч бер, же күчүм жеткидей кайгы бер.", "problem": "Shortened and reworded; ылайык is not жеткидей."}, {"kind": "moral", "image": "Адам же кайгысына туруштук бере турган күчтү, же күчүнө ылайык кайгыны тилеши керек.", "story": "Оор күндө адамга кайгысын көтөрө турган кайрат керек. Жараткан эч кимге алы жетпес жүк артпасын.", "problem": "Moral tells the person what to wish for and omits that the Creator should not load an unbearable burden."}], "preview": "../../ky/wisdom-stories/illustrations/strength-and-sorrow.webp"}, {"stem": "puppies-for-sale", "title": "Күчүктөр сатылат", "category": "Үй-бүлө жана тарбия", "status": "Needs correction", "items": [{"kind": "title", "image": "«Кучуктер сатылат»", "story": "Күчүктөр сатылат", "problem": "Spelling: Кучуктер versus Күчүктөр."}, {"kind": "caption", "image": "Кучуктер сатылат", "story": "күчүктөр сатылат", "problem": "Spelling: Кучуктер versus күчүктөр."}, {"kind": "speech", "image": "Кучуктерүңүз канча турат?", "story": "Күчүктөрдү канчадан сатасыз?", "problem": "Spelling and different wording."}, {"kind": "speech", "image": "Ар башка баада. Ар биринин баасы ар башка.", "story": "Отуздан элүү долларга чейин. Ар биринин өз баасы бар", "problem": "Missing the thirty-to-fifty dollar range."}, {"kind": "speech", "image": "Менин бүт  ата! Мен аны абдан жакшы карарам.", "story": "Байке, мен да чуркап ойной албайм. Бул күчүккө да, мага да бизди түшүнүп, колдой турган достор керек.", "problem": "Different ending; the boy does not show his own braced leg."}, {"kind": "speech", "image": "Мен сени жакшы көрөм, досум. Сен башкача болсоң да, мен үчүн абалуусуң. Биз чогуу бактылуу болобуз, кандай болсок да.", "story": "", "problem": "Not in the story; абалуусуң is uncertain."}, {"kind": "moral", "image": "Ар бир жандыкка аны түшүнүп, колдой турган дос керек. Өзгөчө болгон жан да баалуу.", "story": "Басышы же келбети башка болгону үчүн эч бир жанды кем көрбө. Ар кимге түшүнүү, колдоо, дос керек.", "problem": "Different moral wording."}], "preview": "../../ky/wisdom-stories/illustrations/puppies-for-sale.webp"}, {"stem": "blind-who-have-eyes", "title": "Көзү бар сокурлар", "category": "Акылмандык жана өмүр сабактары", "status": "Needs correction", "items": [{"kind": "title", "image": "«Көзү бар сокурлар»", "story": "Көзү бар сокурлар", "problem": ""}, {"kind": "caption", "image": "Адам көргөн нерселерин гана эмес, көргөнүн жүрөгүндө түшүнгөн адам гана чыныгы көрө алат.", "story": "Көзүм бар деп эле баарын көрүп турам дегендер көп. Бирок көзгө көрүнгөндүн маңызын аңдай билүү башка.", "problem": "Сөздөр башка."}, {"kind": "caption", "image": "Көрүү көз менен эмес, аң-сезим менен болот.", "story": "Көз менен кароо аздык кылат, көкүрөк менен туюу да керек.", "problem": "«Көкүрөк менен туюу» ордуна «аң-сезим»."}, {"kind": "caption", "image": "Карап туруп, түшүнгөн адам чыныгы көрө алат.", "story": "Көргөнүңө ой жүгүртүп, укканыңдын маанисин түшүн.", "problem": "Сөздөр башка."}, {"kind": "caption", "image": "Аң-сезими ачык адам дүйнөнү жакшыраак көрөт, өзүн жана башкаларды түшүнөт.", "story": "Көз менен кароо аздык кылат, көкүрөк менен туюу да керек.", "problem": "Жомок мындай дебейт."}, {"kind": "other", "image": "Дүйнөгө кара / Өзүңдү таан / Жакшыны көр / Боорукер бол / Аң-сезимдүү адам — чыныгы көрө алат.", "story": "", "problem": "Жомоктон жок тизме."}, {"kind": "other", "image": "ЖҮРӨК СӨЗ", "story": "", "problem": "Жомоктон жок."}, {"kind": "moral", "image": "Көрүү көз менен эмес, аң-сезим менен болот. Карап туруп көрбөгөн адам — чыныгы сокур.", "story": "Сабак: Көз менен кароо аздык кылат, көкүрөк менен туюу да керек. Көргөнүңө ой жүгүртүп, укканыңдын маанисин түшүн.", "problem": "Сабактын сөздөрү башка."}], "preview": "../../ky/wisdom-stories/illustrations/blind-who-have-eyes.webp"}, {"stem": "i-kiss-your-eyes", "title": "Көзүңдөн өбөм", "category": "Сүйүү жана нике", "status": "Needs correction", "items": [{"kind": "title", "image": "«Көзүңдөн өбөм»", "story": "Көзүңдөн өбөм", "problem": ""}, {"kind": "caption", "image": "Сени эң көп ким сагынса, ошонуки жолугуштуу эң таттуу болот эмес беле?", "story": "Эмне үчүн «көзүңдөн өбөм» деп айтыларын билесизби?", "problem": "The question is rewritten."}, {"kind": "caption", "image": "Жүрөк көзүңдү эң көп сагынган адам; сүрөтүңдү эң көп элестеткен адам болот.", "story": "Сагынычтын азабын баарынан көп көздөр тартат", "problem": "Wording and meaning differ."}, {"kind": "caption", "image": "Сагынычты эң көп тарткан адам жолугушууга да эң татыктуу.", "story": "ошондуктан жолугушуунун кубанычына да эң оболу көздөр татыктуу.", "problem": "The subject is a person, not the eyes, and the wording differs."}], "preview": "../../ky/wisdom-stories/illustrations/i-kiss-your-eyes.webp"}, {"stem": "attitude-toward-a-problem", "title": "Көйгөйгө мамиле", "category": "Адеп жана мүнөз", "status": "Needs correction", "items": [{"kind": "title", "image": "Көйгөйгө мамиле", "story": "Көйгөйгө мамиле", "problem": ""}, {"kind": "speech", "image": "Жашооңдо көйгөй барбы?", "story": "Жашооңдо көйгөй барбы?", "problem": ""}, {"kind": "speech", "image": "Жок.", "story": "Жок болсо, тынчсыздануунун кереги жок.", "problem": "Only “Жок” is shown; the story’s “if not” clause is missing from this reply."}, {"kind": "speech", "image": "Анда тынчсыздануунун кажети жок.", "story": "тынчсыздануунун кереги жок", "problem": "кажети instead of кереги."}, {"kind": "speech", "image": "Бул көйгөйдүн чечими бар деп ойлойсуңбу?", "story": "Көйгөй бар болсо, аны чече аласыңбы?", "problem": "Asks whether you think the problem has a solution, not whether you can solve it."}, {"kind": "speech", "image": "Ээ.", "story": "", "problem": "Reply is not in the story."}, {"kind": "moral", "image": "Же көйгөй жок, же анын чечими бар. Тынымсыз тынчсыздануу пайдасыз.", "story": "Чече албасаң да, тынчсыздануунун кереги жок.", "problem": "Says every problem has a solution; the story says there is no need to worry even if you cannot solve it."}], "preview": "../../ky/wisdom-stories/illustrations/attitude-toward-a-problem.webp"}, {"stem": "lecturer-and-the-groom", "title": "Лектор жана ат багуучу", "category": "Акылмандык жана өмүр сабактары", "status": "Needs correction", "items": [{"kind": "title", "image": "Лектор жана ат багуучу", "story": "Лектор жана ат багуучу", "problem": ""}, {"kind": "speech", "image": "Сизден башка ким түшүнбөйт. Мен ойлоруңузду, акыл-насаатыңызды угайын деп келдим, эмеспи?", "story": "«Сизден башка эч ким келген жок. Кандай дейсиз, лекцияны өткөрөлүбү же жокпу?»", "problem": "Суроонун мааниси башка."}, {"kind": "speech", "image": "Мен көп нерсени билем, уулум. Аттын кайсысы эмнени сүйөрүн, күнүнө канча жем берүүнү, ысыкта эмне кылууну, кышта эмне кылууну баарын билемин.", "story": "— Агай, мен ат багуучумун, жыйырма атым бар. Аттарымдын баары качып кетип, бирөө эле калса да, аны багып, суусун, жемин берем.", "problem": "Жыйырма ат жана бирөө калса да багуу жок."}, {"kind": "caption", "image": "Лектор ат багуучунун кимге, кантип көч сүйлөгөнүн байкап турат.", "story": "Лектор сөзүн баштап, узактан-узак сүйлөйт.", "problem": "Сөздөр башка."}, {"kind": "speech", "image": "Эмнени айтып жатасыз, түшүнгөнүмүн билесизби?", "story": "— Кандай, лекциям жактыбы?", "problem": "Суроо башка."}, {"kind": "speech", "image": "Ат багамын, биз баарын билебиз деп ойлойсуңбу? Ат өзү айтат да! Кимге канча берүүнү, кантип багууну өзүбүздүн тажрыйбабыздан билип келебиз да.", "story": "«Мен ат багам, сиздин айткандарыңыздан эч нерсе түшүнгөн жокмун. Бирок бир нерсени так айта алам: жыйырма аттын суусу менен жемин бир атка берип, аны жарылып кеткенче тойгузбайм».", "problem": "Тойгузуу салыштырмасы жок; маани башка."}, {"kind": "moral", "image": "Сабак: Жакшы сүйлөө — көп сүйлөө эмес; ойду угуучу түшүнүп, кабыл ала турган өлчөмдө айта билүү.", "story": "Сабак: Сөздү көптүгүнө эмес, угуучунун муктаждыгына жараша айт. Түшүнүктүү, ченемдүү кептин таасири күчтүү.", "problem": "«Муктаждыгына жараша» жана «таасири күчтүү» жок."}], "preview": "../../ky/wisdom-stories/illustrations/lecturer-and-the-groom.webp"}, {"stem": "meaningless-question", "title": "Маанисиз суроо", "category": "Адеп жана мүнөз", "status": "Needs correction", "items": [{"kind": "title", "image": "«Маанисиз суроо»", "story": "Маанисиз суроо", "problem": ""}, {"kind": "caption", "image": "Бир жолу Беркли университетинин бүтүрүүчүсү Нью-Йорк шаарындагы бири раввинден Талмудду үйрөтүүсүн өтүнөт.", "story": "Бир күнү Беркли университетинин бүтүрүүчүсү Нью-Йоркто жашаган раввинге келип, Талмудду үйрөнүүгө жардам сурайт.", "problem": "Extra “бири”, үйрөтүүсүн instead of үйрөнүүгө жардам сурайт, and the sentence is ungrammatical."}, {"kind": "speech", "image": "Бул суроолордун мааниси жок экенин сага далилдеп берейин.", "story": "Суроонун өзү маанисиз экенин көрбөй турасыңбы?", "problem": "Rabbi offers to prove the questions are meaningless at the start; story reaches that point only after the chimney riddle."}, {"kind": "speech", "image": "— Мен Талмуддагы мааниси жок маселелердин пайдасы жок экенин көрсөткөн мисалдарды уккам. Сураныч, мага түшүндүрүп бериңиз.", "story": "Бирок мен Сократтын логикасы боюнча диссертация жактагам! Талмудду үйрөнүп, билимимдеги айрым боштуктарды толтургум келет.", "problem": "Student’s request is a different speech."}, {"kind": "speech", "image": "— Эгер адамдын максаты эмнени моюнтайын билбесе. Ал алгач казат... Бирок кандай кирпичти алат, кайсынысын калтырат — билбейт. Натыйжада, кирпичтин үйү мамиле күрүзбайт.", "story": "", "problem": "Brick parable is not in the story. Several words are unclear, so this bubble may also need a closer look."}, {"kind": "speech", "image": "— Эгер сындыргычты тест кылсаңчы? Табигый, ал эч нерсени кеспейт. Пайдасы жок!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "— Эгер сен таамак идишти тесик кылсаңчы, ичине суу коюлса агып кетет. Ач болсоң, каныктабайт, суусаганда суусатпайт.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "— Эгер күкүмдү алтын деп айтсаңчы. Ал эмне үчүн алтын боло албайт?", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "— Себеби күкүм алтын эмес. Ал алтын боло албайт.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "— Демек, пайдасы жок өсөт да, эч нерсени каныктыра албайт турбайбы!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "— Туура айтасың. Пайдасы жок өсөт эч нерсени каныктыра албайт.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "— Анда ким пайдасы жок суроону бермек эле!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "— Туура.... Адам акылсыз суроо берсе, анда акылсыз жооп алат. Бири өзүнкү тилден түшүнбөсөң? Тушунбой туруп суроо берсең пайдасы жок болот. Бирок маанисиз суроо акылсыз жоого алып келет, ал эми акылсыз жооп адамды жашоодо пайдасыз кылат...", "story": "Өмүрүңдү маанисиз суроолорго жооп издөөгө коротсоң, жоопторуң да, өмүрүң да маани таппайт.", "problem": "Closing speech is a different argument and contains unclear words."}, {"kind": "moral", "image": "Маанисиз суроонун жообу да чындыкка жеткирбейт. Туура суроо — туура жооптун жарымы.", "story": "Жооп издегенден мурда суроонун өзүн текшер. Туура коюлган суроо чындыкка жакындатат.", "problem": "Moral is reworded; “half of the right answer” is not in the story."}], "preview": "../../ky/wisdom-stories/illustrations/meaningless-question.webp"}, {"stem": "what-do-i-need-it-for", "title": "Мага эмне", "category": "Акылмандык жана өмүр сабактары", "status": "Needs correction", "items": [{"kind": "title", "image": "Мага эмне кереги бар?", "story": "Мага эмне", "problem": "«Кереги бар?» ашыкча."}, {"kind": "caption", "image": "Султан Сулейман Осмон мамлекетин күчтүү кылды, бирок ойлонду:", "story": "Кануни Султан Сулейман (1494–1566; 1520-жылы такка отуруп, өмүрүнүн акырына чейин бийлик жүргүзгөн) Осмон мамлекетин өз доорунда мүмкүн болгон эң бийик деңгээлге жеткирет.", "problem": "Жылдар жана «эң бийик деңгээл» жок."}, {"kind": "speech", "image": "«Көрсөм, мамлекет ичинде зулумдук да бар экен. Эмне кылсам экен?»", "story": "«Күндөрдүн биринде Осмон урпактары да төмөндөп, мамлекети кыйрап калабы?»", "problem": "Суроонун мааниси башка."}, {"kind": "caption", "image": "Султан Яхьясын Уланга кат жазды:", "story": "белгилүү аалым Яхья Эфендиге айтууну чечет", "problem": "Аты «Яхья Эфенди» эмес «Яхьясын Улан»."}, {"kind": "speech", "image": "«Бир мамлекеттик адам элди эзсе, Осмон ууландарнын акыбалы эмне болот?»", "story": "Мамлекет кандай учурда кыйрайт? Осмон урпактарынын тагдыры эмне болот?", "problem": "«Ууландар» жазылышы жана «элди эзсе» жомоктон жок."}, {"kind": "caption", "image": "Яхья Улан кыска жооп катын жөнөттү:", "story": "Доорунун кудуреттүү султаны Улуу Сулеймандан келген катты окуган Яхья Эфендинин жообу өтө кыска болот: «Мага эмне, султаным!»", "problem": "Аты башка."}, {"kind": "speech", "image": "«Мага эмне кереги бар, Султаным!»", "story": "«Мага эмне, султаным!»", "problem": "«Кереги бар» ашыкча."}, {"kind": "caption", "image": "Султан Сулейман Бешикташ дарвишинин жайына барды.", "story": "Яхья Эфендинин Бешикташтагы дербишканасына жөнөйт.", "problem": "«Дербишкана» ордуна «дарвишинин жайы»."}, {"kind": "speech", "image": "«Атабай, бул эмне, мындай жоопту жөнөттү экен. Мааниси кандай?»", "story": "«Агай, катыма жооп берсең боло. Бул маселеге олуттуу кара»", "problem": "Сөздөр башка."}, {"kind": "speech", "image": "«Султаным, сенин жоопкариңди албай, мен түшүндүрөйүнбү? Ким зулумдуктун үстүнөн көз жумса, анын күнөөсү кичине көрүнгөнү менен, аратынан кетпейт.»", "story": "«Султаным, сиздин сурооңузга олуттуу карабай коюу мүмкүнбү? Мен сурооңузду жакшылап ойлонуп, бүтүмүмдү ачык эле билдирген элем».", "problem": "Жооп башка мааниде."}, {"kind": "speech", "image": "«Султаным! Мамлекетте зулумдук жайылса, адилетсиздик көбөйсө жана ушул нерселерге “мага эмне кереги бар” деп кайдыгер каралса... ошондо мамлекеттин соңу төмөндөй баштайт.»", "story": "«Султаным! Эгер бир мамлекетте зулумдук жайылып, адилетсиздик чегине жетсе, аны уккандар да “мага эмне” деп четке чыга берсе", "problem": "Койчу, чындыкты жашыруу, жетим-жесир жок; «кереги бар» ашыкча."}, {"kind": "caption", "image": "Күң султан ойлонуп, Аллага шүгүр кылды.", "story": "Бул сөздөрдү угуп отуруп ыйлап жиберген кары султан башын жерге салып, алардын туура экенин мойнуна алат. Анан өз өлкөсүндө ага ушундай насаат айта ала турган аалым бар экенине Кудайга шүгүр кылып", "problem": "«Күң султан» жана ыйлап моюнга алуу башка."}, {"kind": "moral", "image": "Сабак: Зулумдукту көрүп туруп «мага эмне кереги бар» деген коом төмөндөйт. Адилетсиздикке көз жумуу — ага шерик болуу.", "story": "Сабак: Адилетсиздикти көрүп туруп «мага эмне» деп четке чыкпа. Кайдыгерлик зулумдуктун күч алышына жол берет.", "problem": "«Кереги бар» жана «шерик болуу» жомоктон жок."}], "preview": "../../ky/wisdom-stories/illustrations/what-do-i-need-it-for.webp"}, {"stem": "weight-of-the-oil", "title": "Майдын салмагы", "category": "Эмгек, ырыскы жана байлык", "status": "Needs correction", "items": [{"kind": "title", "image": "«Майдын салмагы»", "story": "Майдын салмагы", "problem": ""}, {"kind": "other", "image": "1-чи күн 5-чи күн 10-чу күн", "story": "майдын салмагы күн өткөн сайын азайып баратканын байкайт", "problem": "Күндөрдүн саны аңгемеде жок."}, {"kind": "caption", "image": "Соодагер майды таразага салып, ар күнү азайтып жатат.", "story": "Бир наабайчы дыйкандан такай белгилүү өлчөмдө сары май сатып алчу экен.", "problem": "Наабайчы менен дыйкандын орду чаташкан; ким азайтып жатканы башка."}, {"kind": "caption", "image": "Соодагер нааразы болуп мындай дейт: «Кечээ майымды толук алгам, азыр азайды!»", "story": "Дыйканды алдап жатат деп айыптап, казыга даттанат.", "problem": "Казыга даттануу жок."}, {"kind": "speech", "image": "Эгер, менин тарткан майым азайган болсо, анда сенин наның да күн санап азайтып жатам... аны да ойлонуп көр.", "story": "Менин тараза ташым жок. Ошондуктан таразанын бир табагына майды, экинчисине күн сайын ушул наабайчыдан алган бир килограммдык нанды коём.", "problem": "Нанды атайын азайтуу деп айтылат; тараза таш жоктугу жок."}, {"kind": "caption", "image": "Карыя башын чайкайт: соодагердин туура эмес аракеттинен экөөнүн тең пайдасы азайган.", "story": "Майды ошол нанга теңеп тартам.", "problem": "Мааниси башкача жыйынтыкталган."}, {"kind": "caption", "image": "Туура өлчөм — экөөгө тең пайда алып келет. Өлчөмүңдү тап, ар күнү ыраазы бол.", "story": "", "problem": "Аңгемеде жок."}, {"kind": "moral", "image": "САБАК: Адам башкага кандай мамиле кылса, көбүнчө өзүнө да ошол эле өлчөм менен жооп кайтып келет. Берген наның сага май болуп кайтат.", "story": "Сабак: Бирөөгө кандай өлчөм колдонсоң, өзүңө да ошондой өлчөм кайтышы мүмкүн. Өз ишиңди текшербей туруп башканы айыптаба.", "problem": "«айыптаба» жок; «мамиле» жазылган."}], "preview": "../../ky/wisdom-stories/illustrations/weight-of-the-oil.webp"}, {"stem": "festive-gift", "title": "Майрамдык белек", "category": "Үй-бүлө жана тарбия", "status": "Needs correction", "items": [{"kind": "title", "image": "«Майрамдык белек»", "story": "Майрамдык белек", "problem": ""}, {"kind": "speech", "image": "Майрамга эмне белек алсам болот?", "story": "Аксакал, майрамга эмне алайын?", "problem": "Extra белек and болсот form; missing Аксакал."}, {"kind": "speech", "image": "Жүрөктөрдү көтөргөн иш кыл... Балдардын жүзүн жарк эттир... Жана кедей-кембаттын батаасын ал...", "story": "Бир нече адамдын көңүлүн көтөр. Бир нече баланы кубантып, жүзүнө жылмаюу тартуула. Колуңдан келсе, бир нече жардынын батасын ал.", "problem": "Different wording; кедей-кембаттын versus жардынын."}, {"kind": "moral", "image": "Эң баалуу белек жүрөк жана көңүл менен өлчөнөт. Майрамды бергениң майрам кылат.", "story": "Майрамдын көркү алган белегиңде эле эмес, кубанткан адамыңда. Бирөөнүн батасын алып, баланын күлкүсүнө себепчи бол.", "problem": "Different moral wording."}], "preview": "../../ky/wisdom-stories/illustrations/festive-gift.webp"}, {"stem": "be-sure-of-your-purpose", "title": "Максатыңыз анык болсун", "category": "Адеп жана мүнөз", "status": "Needs correction", "items": [{"kind": "title", "image": "«Максатыңыз анык болсун»", "story": "Максатыңыз анык болсун", "problem": ""}, {"kind": "caption", "image": "Бир нече күндөн бери оор сандыкты ачууга аракет кылып жатышат.", "story": "Эки киши оор сандыкты эшиктен өткөрүүгө аракет кылып жатышты.", "problem": "They are trying to open the chest for several days, not to carry it through a door."}, {"kind": "speech", "image": "Бир да жолу ичин карап көрө албай келдик.", "story": "Кандай оор сандык! Эч эле ичкери киргизе албай койдук.", "problem": "Complains they cannot look inside, not that they cannot bring it in."}, {"kind": "speech", "image": "Мүмкүн, сандык башка жактан ачылат!", "story": "Биз сандыкты сыртка чыгарышыбыз керек эмес беле?", "problem": "Suggests the chest opens from the other side; story says they should be taking it outside."}, {"kind": "moral", "image": "Ишке киришерден мурда максатты тактап ал. Болбосо күчүң туура эмес багытка кетет.", "story": "Ишке киришерден мурун эмне кыларыңды тактап ал. Болбосо, кара күчүңдү коротуп, көздөгөнүңө жетпей каласың.", "problem": "мурда and максатты instead of мурун and эмне кыларыңды; second sentence differs."}], "preview": "../../ky/wisdom-stories/illustrations/be-sure-of-your-purpose.webp"}, {"stem": "homeland-and-land", "title": "Мекен жана топурак", "category": "Адилеттүүлүк жана коом", "status": "Needs correction", "items": [{"kind": "title", "image": "«Мекен жана топурак»", "story": "Мекен жана топурак", "problem": ""}, {"kind": "caption", "image": "Топуракка суу куйсаң, ал бүчүр берет...", "story": "Топуракка суу кошсоң — ылай, кан кошсоң — Мекен болот.", "problem": "Water makes sprouts instead of mud."}, {"kind": "caption", "image": "...кан төккөн Мекен болот.", "story": "Топуракка суу кошсоң — ылай, кан кошсоң — Мекен болот.", "problem": "Second half is shortened and reworded."}, {"kind": "moral", "image": "Топуракты Мекенге айланткан — ал үчүн төгүлгөн кан. Мекен жөн гана жер эмес.", "story": "Сабак: Мекендин ар бир карыш жеринде аны коргогондордун мээнети, төккөн каны бар. Ошол аманатты ыйык сакта.", "problem": "Moral wording differs."}], "preview": "../../ky/wisdom-stories/illustrations/homeland-and-land.webp"}, {"stem": "i-love-you", "title": "Мен сени сүйөм", "category": "Сүйүү жана нике", "status": "Needs correction", "items": [{"kind": "title", "image": "«Мен сени сүйөм»", "story": "Мен сени сүйөм", "problem": ""}, {"kind": "caption", "image": "Жоктуктар, бир күн булгул бир ак гүлгө ашык болуптур.... Ар күнү ага келип, жанында калып, жүрөгүндөгү сезимин ыр менен жеткирчү.", "story": "Айтылып жүргөндөй, бир булбул ак розага ашык болуптур... Ал ар түнү учуп келип, жанына конуп, сүйүүсүн билдирчү экен.", "problem": "булбул is written булгул, and night becomes day."}, {"kind": "speech", "image": "Мен сени сүйөм!", "story": "Ошол күндөн бери кызыл розалар «МЕН СЕНИ СҮЙӨМ» деген маанини да билдирет.", "problem": ""}, {"kind": "caption", "image": "Бир күн булгул ак гүлдүн бардык сулуулугун чогултуп ага берди жана сүйүүсүн мойнуна алды: «Мен сени сүйөм!» — деди. Булгул ар күнү mage": "ЛИДЕРЛИК ЖАНА ТАЖРЫЙБА СЕМИНАРЫ", "story": "Мурдагы бир министрди семинарга чакырышат.", "problem": "Семинардын так аталышы аңгемеде жок."}, {"kind": "caption", "image": "Мурдагы бир министр семинарга чакырылды. Ал сөз сүйлөгөндө эл көңүл коюп, урмат көрсөтүп, сөзүн бөлбөй угушту.", "story": "Мурдагы бир министрди семинарга чакырышат. Кезеги келгенде колуна желим стакан кармап, трибунага чыгып сөзүн баштайт.", "problem": "Желим стакан жана өткөн жыл салыштырылбайт."}, {"kind": "caption", "image": "Ал келди... ошондо урмат болду. Бизнеске көңүл бурушту... сөзүнө маани беришти...", "story": "Өткөн жылы ушул эле трибунада сөз сүйлөгөм. Бир гана айырмасы — анда министр болчумун.", "problem": "Лимузин, фарфор чыны, бизнес-класс жок."}, {"kind": "other", "image": "МЕЙМАНКАНА", "story": "Мени мейманканага жеткиришти.", "problem": ""}, {"kind": "other", "image": "СУУСУНДУК АВТОМАТЫ", "story": "мага коридордогу кофе автоматын көрсөтүштү.", "problem": "«кофе» ордуна «суусундук»."}, {"kind": "other", "image": "БИЗДИН МУРУНКУ МИНИСТРИБИЗ КЕЛДИ", "story": "", "problem": "Аңгемеде жок."}, {"kind": "caption", "image": "Бул күн... мен билет алганда... Мейманкана такси берди... кофе автоматы бесплатный койду. Мен ушуну ойлодум: пластик стаканга эмне болду экен?", "story": "Кечээ бул жакка өз акчама сатып алган билет менен учуп келдим. Мен да чыгып, өзүңөр көрүп турган ушул желим стаканга кофе куюп алдым.", "problem": "«бесплатный» орусча; желим стакан так эмес."}, {"kind": "speech", "image": "Ойлонуп көрсем, менин илгери болгон кызматым мене эмес, кызматыма урмат болгон экен.", "story": "өткөн жылы кымбат чыныдагы кофе мага эмес, менин кызмат ордума сунушталган экен.", "problem": "«мене эмес» жазылышы; чыны айтылбайт."}, {"kind": "speech", "image": "Ушуну түшүндүм: ушул кызматта турганда мен көптөгөн артыкчылыктарды, жакшы мамилени көрдүм. Бул менин адамдык сапатым үчүн эмес, ээлеген ордумдун аркасында болду. Ошондуктан настоящий урмат — орунга көрсөтүлөт.", "story": "бардык
