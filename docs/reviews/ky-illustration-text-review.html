ырбайт, себеби бири-биринин жүрөгүн угушат. Үндү эмес, түшүнүүнү тандайт, жүрөктөрдүн аралыгы жакындайт.", "story": "— Ал эми адамдар бири-бирин сүйгөндө эмне болот? Алар кыйкырышпайт, тескерисинче, акырын сүйлөшөт.", "problem": "Says loving people do argue, and omits whispering and understanding without words."}, {"kind": "speech", "image": "— Ошентип, эгер талаш чыкса, арадагы аралыкты кыскартууга аракет кылыңыздар, үнүңөрдү көтөрбөгүлө. Түшүнүүгө, угууга тандагыла. Ошондо гана чакырымдар эмес, жүрөктөр жакындайт.", "story": "Урматтуу студенттерим, силер да талашканда жүрөгүңөрдүн бири-биринен алысташына жол бербегиле, ортодогу аралыкты чоңойто турган сөздөрдү айтпагыла.", "problem": "Wording differs."}, {"kind": "moral", "image": "Сабак: Кыйкырык — жүрөктөрдүн бири-биринен алыстаганынын үнү. Сүйүүдө шыбыр да жетиштүү — ортоңордогу аралыкты чоңойтпогула..", "story": "Сабак: Ачуу сөз жүрөктөрдү алыстатат. Талашсаң да сыйды сактап, кайра жараша турган жолду жаппа.", "problem": "Moral wording differs."}], "preview": "../../ky/wisdom-stories/illustrations/why-people-shout-when-they-argue.webp"}, {"stem": "why-are-you-waiting-for-the-last-day-of-the-world", "title": "Эмне үчүн дүйнөнүн акыркы күнүн күтүп жатасыңар", "category": "Иман жана руханият", "status": "Needs correction", "items": [{"kind": "title", "image": "Эмне үчүн дүйнөнүн акыркы күнүн күтүп жатасыңар?", "story": "Эмне үчүн дүйнөнүн акыркы күнүн күтүп жатасыңар", "problem": ""}, {"kind": "speech", "image": "Бир нерсени түшүнүп алгыла, бүгүн – дүйнөнүн акыркы күнү. Эгер бүгүн өлүп калсаңар, ал кезде кылган иштериңерден кандай жооп бересиңер?", "story": "Бир саамга бүгүн дүйнөнүн акыркы күнү деп элестеткиле. Эртең ушул убакта баары бүтөт. Кутулууга да эч мүмкүнчүлүк жок. Андай болсо, эмне кылат элеңер?", "problem": "Asks what answer they would give for their deeds, not what they would do; says today they die, not that everything ends tomorrow."}, {"kind": "thought", "image": "Ата-энеме, жакындарымды багуулай.", "story": "Апамды же атамды көрүп келмекмин.", "problem": "Different wish; one word is uncertain."}, {"kind": "thought", "image": "Бүгүн сүйгөнүмө сүйүүмдү билдирем.", "story": "", "problem": "Not in the story."}, {"kind": "thought", "image": "Убактымды пайдабай өткөрөм.", "story": "", "problem": "Not in the story."}, {"kind": "thought", "image": "Апам менен атамды баалайм.", "story": "Апамды же атамды көрүп келмекмин.", "problem": "баалайм versus көрүп келмекмин."}, {"kind": "thought", "image": "Кыйынчылыкта жүргөндөргө жардам берем.", "story": "", "problem": "Not in the story."}, {"kind": "thought", "image": "Башкаларды кечирем.", "story": "Көңүлүн ооруткан адамдарымды издеп таап, мени кечиришсин деп алардан кечирим сурамакмын", "problem": "Meaning reversed: forgiving others versus asking them for forgiveness."}, {"kind": "thought", "image": "Кечирим сурайм, ошолор менен татулашам.", "story": "алардан кечирим сурамакмын", "problem": "Adds making peace; drops seeking out the people whose feelings were hurt."}, {"kind": "thought", "image": "Башкалар үчүн жакшылык кылууга аракет кылам.", "story": "", "problem": "Not in the story."}, {"kind": "thought", "image": "Китеп окуп, өзүмдү өнүктүрөм.", "story": "", "problem": "Not in the story."}, {"kind": "thought", "image": "Жакшы адаттарды калыптандырам, жаман адаттардан алыс болом.", "story": "", "problem": "Not in the story."}, {"kind": "thought", "image": "Коомго пайдам тийген иштерди кылам.", "story": "", "problem": "Not in the story."}, {"kind": "thought", "image": "Кыялдарымды ишке ашырам жана ыраазы болуп жашайм.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Ата-энеге баш ийүү; Сүйгөндөрүм менен убагымды өткөрүү; Туура тамактануу; Апам менен атамды баалоо; Жакшы адаттарды калыптандыруу; Башкаларды кечирүү; Китеп окуу; Билим алуу; Убактымды пайдалуу иштерге жумшоо; Өзүмдү өнүктүрүү; Кыйынчылыкта жүргөндөргө жардам берүү; Кыялдарымды ишке ашыруу; Коомго пайда тийген иштерди кылуу", "story": "Ибадат кылып, Кудайдан күнөөлөрүмдү кечиришин сурамакмын.", "problem": "Board list replaces the students' answers; worship, farewell, family time, favorite food, sleep, forest, sunrise, stars, and the wished-for place are missing."}, {"kind": "speech", "image": "Ушулар, балдар, баарыбызга дүйнөнүн акыркы күнү – бүгүн экенин элестетип, ошого жараша жашоого жардам берет.", "story": "Балдар, мунун баарын жасаш үчүн эмнеге дүйнөнүн акыркы күнүн күтүп жатасыңар?", "problem": "Different closing line."}, {"kind": "moral", "image": "Сабак: Жакшы иштерди кылыш үчүн акыркы күндү күтпө. Сүйүүнү, кечирүүнү, баалоону дал бүгүн, азыр жаса.", "story": "Жакшылыкка акыркы күндү күтпө. Жакыныңды көрүп, көңүлүн алып, кечирим сурай турган убакыт — бүгүн.", "problem": "Жакшы иштерди кылыш үчүн versus Жакшылыкка; second sentence differs."}], "preview": "../../ky/wisdom-stories/illustrations/why-are-you-waiting-for-the-last-day-of-the-world.webp"}, {"stem": "mother-and-son", "title": "Эне жана уул", "category": "Үй-бүлө жана тарбия", "status": "Needs correction", "items": [{"kind": "title", "image": "«Эне жана уул»", "story": "Эне жана уул", "problem": ""}, {"kind": "speech", "image": "Эне, мен шаарга окууга кетем. Кийин бош убактымда келе жатам.", "story": "«Апа, бул жер абдан жакшы экен»", "problem": "Son’s line is not in the story."}, {"kind": "speech", "image": "Бар жаным, ийгиликтүү бол.", "story": "«Албетте, жакшы, уулум»", "problem": "Mother’s reply differs."}, {"kind": "speech", "image": "Бар жаным, ийгиликтүү бол.", "story": "«Албетте, жакшы, уулум»", "problem": "Repeated reply still differs from the story."}, {"kind": "caption", "image": "Бир нече күндөн кийин уулу чемоданын көтөрүп, шаарга жөнөдү.", "story": "Киши колундагы чемодандарды дубалдын түбүнө койду.", "problem": "Action and wording differ."}, {"kind": "caption", "image": "Бир нече жылдан кийин уулу окуусун бүтүрүп, жумушка орношту. Ири шаарда жашап, жаны чөйрөгө көнүп кетти. Бир аз убакыттан кийин байланышы сейрек болуп, апасына келиши азайды.", "story": "", "problem": "This passage is not in the story."}, {"kind": "caption", "image": "Уулунун айланасында жумуш, жолугушуулар көбөйдү. Апасына барүүнү ойдосо да, ар кандай шылтоолорду таап, кийинкиге калтырып жүрду.", "story": "", "problem": "This passage is not in the story."}, {"kind": "speech", "image": "Апама барсамбы, жокпу экен?", "story": "", "problem": "This line is not in the story."}, {"kind": "caption", "image": "Бир күнү энеси ооруп калды. Өзү жакшы көргөн баласынын көзүн сагынып, «Качан келет болду экен?» деп күтүп жатты. Бирок күндөр өттү, уулунан кабар болбоду.", "story": "Кары аял ойго батып кеткендиктен, уулунун сөзүн уккан да жок.", "problem": "Scene and wording differ from the story."}, {"kind": "caption", "image": "Уулунун өз баласы мектепке кирди. Апасы болсо алыстан көрүп, жүрөгү толкунданып турду. Ал: «Мен да ошондой күнү сени колуңдан кармап мектепке жетелеген элем» деп эскерди.", "story": "Бир күн мурун мектептин кандай сонун жер экенин сааттап түшүндүрсө да, уулун класска араң киргизген.", "problem": "School memory is rewritten."}, {"kind": "other", "image": "1-СЕНТЯБРЬ БИЛИМ КҮНҮ!", "story": "", "problem": "Banner is not in the story."}, {"kind": "caption", "image": "Анын көз жашы жашыруун агып, баласы үчүн дуба кылып турду.", "story": "", "problem": "This line is not in the story."}, {"kind": "speech", "image": "Уулум өссө, мени түшүнөт го...", "story": "", "problem": "This line is not in the story."}, {"kind": "caption", "image": "Көп жылдар өттү. Уулу энесинин алсыздыгын көрүп, анык барып, жанында отурду.", "story": "", "problem": "This passage is not in the story."}, {"kind": "speech", "image": "Эне, мен сага убакыт бөлө албай, кечир мени.", "story": "«Мени таштап кетпе, уулум, аябай коркуп жатам»", "problem": "The spoken line is the son’s apology, not the mother’s whisper."}, {"kind": "speech", "image": "Уулум, оорусун, чарчооңду эмес, сенин алыс жүргөнүң оор болду.", "story": "", "problem": "This line is not in the story."}, {"kind": "caption", "image": "Уулунун көзүндө өкүнүч бар эле. Бирок убакыт өтүп кеткен экен.", "story": "", "problem": "This line is not in the story."}, {"kind": "caption", "image": "Өткөн күндөр кайрылбайт.", "story": "", "problem": "This line is not in the story."}, {"kind": "caption", "image": "Андан бери уулу энесини ар дайым эстеп калды. Ал апасынын колун кармаган кичинекей кезин, анын кылган жакшылыктарын, түнкүсүн уктабай жанында отурган күндөрүн эскерди. Бирок кеч түшүнүнүн акыйкаттыгына өкүнүп, жан дүйнөсү ооруу башады.", "story": "«Мен ушул жерде болом, уулум, сени күтүп турам»", "problem": "Memory is rewritten; several words look misspelled."}, {"kind": "caption", "image": "Апасынын дүйнөдөн кайткан күнү, уулу терең кайгыга батты. Апасынын жылуу колу, ак батасы, мээрими эми эскерүү болуп калды.", "story": "", "problem": "The mother’s death is not in the story."}, {"kind": "speech", "image": "Эне, кечир мени, сагындым...", "story": "«Мени таштап кетпе, уулум, аябай коркуп жатам», — деп шыбырады.", "problem": "The whisper is assigned to the son and the words differ."}, {"kind": "caption", "image": "Анын мезгилинде барктап, жанында болуп, көңүлүн көтөрсөм экен...", "story": "", "problem": "This line is not in the story."}, {"kind": "caption", "image": "Убакыт баарын ордуна коёт. Уул түшүндү: энесин карабаган адам — өзүнүн келечегин жок кылат. Анткени бир күнү ал да жалгыз калып, ошол тагдырына туш болот.", "story": "Ошол түнү кары аял менен бир кабатта жашагандар өксүп ыйлаган үндү угушту.", "problem": "Closing caption changes the story’s meaning."}, {"kind": "moral", "image": "Жашоо — айлампа: энесинин колун кармаган бала эртең ошол энесин таштап кетиши мүмкүн.", "story": "Ата-энеге башпаанек менен тамак эле эмес, мээрим, көңүл да керек. Бала кезде өзүң издеген жылуулукту алардан аяба.", "problem": "Moral wording and meaning differ."}], "preview": "../../ky/wisdom-stories/illustrations/mother-and-son.webp"}, {"stem": "mothers-love", "title": "Эне мээрими", "category": "Үй-бүлө жана тарбия", "status": "Needs correction", "items": [{"kind": "title", "image": "«Эне мээрими»", "story": "Эне мээрими", "problem": ""}, {"kind": "caption", "image": "Эрих Фромм", "story": "Эрих Фромм", "problem": ""}, {"kind": "caption", "image": "1 жашымда — жүрөгүмдүн сокусу менин коопсуздугум болду.", "story": "Бир жаштамын — абдан бактылуумун; апам ар дайым жанымда.", "problem": "Age line wording differs."}, {"kind": "caption", "image": "2 жашымда — ооматып жатканымды түшүндү (сүйүүм, эмне?)", "story": "Эки жаштамын — апам кээде гана жанымда. Эмне болуп жатат?", "problem": "Age line wording differs."}, {"kind": "caption", "image": "3 жашымда — мени жанымда болду, менин дүйнөм болду.", "story": "Үч жаштамын — апам жумушта, бала багуучум жанымда.", "problem": "Age line meaning differs."}, {"kind": "caption", "image": "5 жашымда — менин ишеничим болду, мени таянуум болду.", "story": "Беш жаштамын — апам жыйында, таенем жанымда.", "problem": "Age line wording differs."}, {"kind": "other", "image": "МЕКТЕП", "story": "", "problem": "School sign is not in the story."}, {"kind": "caption", "image": "7 жашымда — менин келечегимди ойлоду, мени колдоду, менин канатым болду.", "story": "Жети жаштамын — апам семинарда, мен болсо мектептемин; мугалимим жанымда.", "problem": "Age line meaning differs."}, {"kind": "caption", "image": "13 жашымда — жеткиликтим, сырдашым болду да, достормду түшүндү.", "story": "Он үч жаштамын — өспүрүм куракка келдим. Апам дагы эле иштөөгө аргасыз, досторум жанымда.", "problem": "Age line wording differs."}, {"kind": "caption", "image": "17 жашымда — мени максатымды колдоду. Өнөнгүп үйрөттү, мактады, кулап калсам көтөрдү.", "story": "Он жети жаштамын — апам жумуштан чарчап келет. Мен класста, мектепте же кафеде жүрөм; досторум жанымда.", "problem": "Age line meaning differs."}, {"kind": "caption", "image": "20 жашымда — бир чоң тааныйым болду — менин энем болду. Досторум да болду.", "story": "Жыйырма жаштамын — жашмын. Апам үйдө эмес, досторум жанымда.", "problem": "Age line wording differs."}, {"kind": "caption", "image": "23 жашымда — мени кирешем болду, бирок эне менден акырабайт. Мен аны сүйөм.", "story": "Жыйырма үч жаштамын — иштей баштадым. Апам эми үйдө, мен болсо жумуштамын.", "problem": "Age line meaning differs."}, {"kind": "thought", "image": "30 жашымда — түшүндүм... эне мен үчүн канча нерсени жасады, сөзсүз сүйүүсү менен. Бул сүйүү түбөлүктүү!", "story": "Отуз жаштамын — ойлонуп калам: апам экөөбүз акыркы жолу качан чогуу сонун убакыт өткөрдүк эле? Мында бир кызык нерсе бар.", "problem": "Age line meaning differs."}, {"kind": "caption", "image": "35+ жашымда, үй-бүлөлүүм — менин энем дагы эле менин жанымда.", "story": "Отуз беш жаштамын — үй-бүлөлүүмүн. Апам өз үйүндө, мен өз үйүмдө.", "problem": "Age line meaning differs."}, {"kind": "caption", "image": "40 жашымда — мен жолумду улантып, энеме унаам жана аны ар дайым колдой берем...", "story": "Кырк жаштамын — апам жолумду карайт; мен бала кезде анын жолун карагандай.", "problem": "Age line meaning differs."}, {"kind": "caption", "image": "50+ жашымда — билим алсам да, тэрбиялүүсам да, энем бир нерсеге эч жетет экен: анын мээрими үч качан алмаша албайт, каалганымды берип, мен үчүн бардык кылоо...", "story": "Элүү жаштамын — өзүм да карыдым, бирок эч качан карыбаган бир тилегим калды: жүрөгүмдү анын жүрөгүнө жакындатып, аны кучактап, башымды чарчаган тизесине коюу.", "problem": "Age line is partly unclear and does not match the story."}, {"kind": "caption", "image": "55 жашымда — энемди эскерсем, көзүмө жаш келет. Анан түшүнөм... анын тааныттыгына, сөзсүз сүйүүсүнө ыраазымын.", "story": "Элүү беш жаштамын — эми дайыма бир эненин, балдарымдын энесинин жанындамын. Өз апам болсо дүйнөдөн өттү; аны сагынып жашайм.", "problem": "Age line meaning differs."}, {"kind": "caption", "image": "Мен алган тарбиям, мээрими — бүгүн өз балдарыма берем. Бул чынжыр туташып турат.", "story": "Балдар — көз алдыбызда тездик менен алмашкан кереметтүү өмүр тасмасынын эң кымбат каармандары.", "problem": "Wording differs."}, {"kind": "caption", "image": "Убакыт өтөт, адам өзгөрөт, бирок эненин мээрими — абдан, суудан да керектүү. Ал биздин жашообузду чагылдырат жана жаркыраттырат.", "story": "Турмуштун күнүмдүк агымында кетирген эң олуттуу кайдыгерлигибиз — кээде балдарыбызга жана жакындарыбызга жетиштүү убакыт бөлбөгөнүбүз.", "problem": "Wording and meaning differ."}, {"kind": "caption", "image": "Жашоо өтүп жатат — азыр токтоп, ойлонуп, чалып, кучактап, “рахмат” деп, “сүйөм” деп айтуунун убагы. Анткени мээримдин мезгили узарып алуу оңой.", "story": "Жашоодо өткөн көрүнүштөрдү кайра көрсөтө турган «токтот», «башта», «алдыга» жана «артка» баскычтары жок.", "problem": "Film-control idea is reworded and the meaning shifts."}, {"kind": "other", "image": "ТОКТО", "story": "«токтот»", "problem": "Button label differs from токтот."}, {"kind": "other", "image": "ОЙЛОН", "story": "", "problem": "Button is not in the story."}, {"kind": "other", "image": "ЧАКЫР", "story": "", "problem": "Button is not in the story."}, {"kind": "other", "image": "БАШТА", "story": "«башта»", "problem": ""}, {"kind": "caption", "image": "Бүгүн энеңе убакыт бөл, кайра келбеген күн кайра келбейт. “Эне мээрими” — аксыздыу жана теңдешсиз белек. Баала, сез, айт, бул дүйнөдөгү эң баалуу нерсе экенин унутпа...", "story": "Балаңды бүгүн кучактап, колунан кармап, жанында бол. Анын бүгүнкү күнүн өткөрүп жибербе.", "problem": "Closing text differs; аксыздыу is not the story word акысыз."}, {"kind": "moral", "image": "Эне мээрими акысыз жана теңдешсиз. Жакындарыңа бүгүн убакыт бөл.", "story": "Эненин мээрими акы күтпөйт. Жакындарыңа убакытты бүгүн бөл: өткөн күндү кийин сатып ала албайсың.", "problem": "Moral is shortened and the wording differs."}], "preview": "../../ky/wisdom-stories/illustrations/mothers-love.webp"}, {"stem": "early-marriage", "title": "Эрте нике", "category": "Сүйүү жана нике", "status": "N rent question about a girl's dream."}, {"kind": "speech", "image": "Мен кантип туура кадам жасай алам?", "story": "", "problem": "This question is not in the story."}, {"kind": "speech", "image": "Эч жөнекөйү – кыздын жанында бол, ал сени уугуга даяр болсун. Ага ишеним берип, колдоо көрсөт. Ал жалгыз эместигин сезсин.", "story": "Ошол убакыт ичинде эң жалкоо окуучу да сабактан сөзсүз бир нерсе үйрөнөт", "problem": "Different advice, plus unreadable-looking spellings жөнекөйү and уугуга."}, {"kind": "speech", "image": "Эскерем.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Сенин кичинекей камкордугуң бир кыздын жолун ачык кылышы мүмкүн. Ага билим алууга улантуу үчүн күч бериш керек.", "story": "Анткени силерде акылман жаш мугалим бар экен. Ага менин ыраазычылыгымды жеткирип коюңуз", "problem": "The inspector's thanks is replaced by different advice."}, {"kind": "moral", "image": "Мугалимдин кичинекей камкордугу бир кыздын тагдырын өзгөртө алат. Эрте нике балдарды билимден ажыратат.", "story": "Сабак: Мугалимдин камкордугу баланын тагдырына жол ачат. Кыздардын окуусун улантып, балалыгын балалык бойдон өткөрүшүнө шарт түзөлү.", "problem": "Second sentence is not the story moral."}], "preview": "../../ky/wisdom-stories/illustrations/early-marriage.webp"}, {"stem": "i-would-not-trade-it-for-anything", "title": "Эч нерсеге алмашпайм", "category": "Адеп жана мүнөз", "status": "Needs correction", "items": [{"kind": "title", "image": "«Эч нерсеге алмашпайм»", "story": "Эч нерсеге алмашпайм", "problem": ""}, {"kind": "caption", "image": "«Бир күнү, көңүлдүү бир күнү, күнөстүү бир күнү эч нерсеге алмашпайм.»", "story": "Бир күндү, кооз бир күндү, күнөстүү бир күндү эч нерсеге алмашпайм.", "problem": "көңүлдүү instead of кооз; күнү instead of күндү."}, {"kind": "caption", "image": "«Анын үчүн урушту, зулумду жана жалганды сүйбөйм.»", "story": "Ошон үчүн согушту сүйбөйм, ошон үчүн зулумдукту сүйбөйм, ошон үчүн жалганды сүйбөйм.", "problem": "Анын үчүн, урушту, and зулумду instead of ошон үчүн, согушту, and зулумдукту."}, {"kind": "other", "image": "ЖАЛГАН", "story": "жалганды", "problem": ""}, {"kind": "caption", "image": "«Билим, достукту, жардамдашуу, ак ниеттүүлүк, түшүнүү жана береншендик...»", "story": "адилетсиздик да, коркунуч да, ачарчылык да...", "problem": "Lists different goods; береншендик is not in the poem."}, {"kind": "caption", "image": "«Кооз, күнөстүү күндө урушка жана жалганга орун жок.»", "story": "Бейпил күндүн баркын бил. Сүйүү менен тынчтык өкүм сүргөн дүйнөдө зулумдукка, жалганга, ачарчылыкка орун болбосун.", "problem": "Different closing; drops зулумдук and ачарчылык."}], "preview": "../../ky/wisdom-stories/illustrations/i-would-not-trade-it-for-anything.webp"}, {"stem": "donkeys-law", "title": "Эшектин мыйзамы", "category": "Тамсилдер жана жомоктор", "status": "Needs correction", "items": [{"kind": "title", "image": "«Эшектин мыйзамы»", "story": "Эшектин мыйзамы", "problem": ""}, {"kind": "speech", "image": "Бир күнү эшек жыйын чакырып, мындай деди: Эми менин мыйзамым күчүнө кирди: күн сайын эртең менен бир саат жатып, түштө бир саат отуруп, кичинде бир саат турасыңар. Ким айтылгандай аткарса — аман болот.", "story": "баары кечки саат алтыда уктап, таңкы саат алтыда ойгонууга тийиш.", "problem": "The law’s hours are different."}, {"kind": "caption", "image": "Жаныбарлар коркконунан мыйзамды эч талкуулабай, айтылгандай аткара баштады.", "story": "Ошентип, бир топ убакыт бою токойдо үн-сөз чыкпай калат.", "problem": "Wording differs."}, {"kind": "caption", "image": "Күндөр өтүп, жаныбарлар бул мыйзамга көнүп калышты. Эч ким каршы сөз айткан жок.", "story": "Ошол күндөн кийин падышадан корккон эч ким мыйзамга каршы чыкпайт.", "problem": "The rooster’s execution is omitted."}, {"kind": "speech", "image": "Бир күнү арстан эшектен сурады: Элди эртең менен жата айттың, түштө отур дегениң — эмнеге?", "story": "кечки саат алтыда уктап, таңкы саат алтыда турууну буйруган мыйзамыңдын сыры эмнед ": "дом is not үй."}, {"kind": "moral", "image": "Сабак: Эң даамдуу тамак ачка кезде, эң жакшы уйку эмгектен кийин, эң жакшы үй болсо адамдардын жүрөгүнөн табылат. Бакыт мүмкүнчүлүктө эмес, көз карашта.", "story": "Ырахаттын баары кымбат буюмда эмес. Адал эмгек, токчулук, адамдардын мээрими — бакыттын жөнөкөй тиректери.", "problem": "Moral repeats the father’s explanation and adds a sentence not in the story."}], "preview": "../../ky/wisdom-stories/illustrations/three-best-things.webp"}, {"stem": "strongest-shield", "title": "Эң күчтүү калкан", "category": "Адеп жана мүнөз", "status": "Needs correction", "items": [{"kind": "title", "image": "Эң күчтүү калкан", "story": "Эң күчтүү калкан", "problem": ""}, {"kind": "caption", "image": "Наяттагы эң күчтүү калкан — аралык.", "story": "Жашоодогу эң күчтүү калкан — аралык.", "problem": "Наяттагы instead of Жашоодогу."}, {"kind": "caption", "image": "Өзүңдү коргоонун эң ишенимдүү жолу — ортого туура аралык коюу.", "story": "Кээде көңүлүңдү сакташ үчүн бир аз алыстоо керек.", "problem": "Different sentence."}, {"kind": "other", "image": "Тынчтык", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Урматтоо", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Өзүн-өзү баалоо", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Ички гармония", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Сабак: Кээде өзүңдү коргоонун эң ишенимдүү жолу — ортого туура аралык коюу. Ар бир нерсеге, ар бир адамга ашыкча жакындык адамды күйгүзөт.", "story": "Кээде көңүлүңдү сакташ үчүн бир аз алыстоо керек. Өзүңө зыян келтирген мамиленин чегин бил.", "problem": "Different moral; күйгүзөт is not in the story."}, {"kind": "other", "image": "СЕРДЕТЕРДИН САК БОЛУҢУЗ. ӨЗҮҢӨ КАМИК БОЛ.", "story": "", "problem": "Small card is not story wording; СЕРДЕТЕРДИН and КАМИК are not readable as story words."}], "preview": "../../ky/wisdom-stories/illustrations/strong  «сатып алсам болобу?» — деп сурап, эртең жумуштан эрте кайтып, өзү менен чогуу тамактануусун өтүндү.", "problem": "The lesson is reversed: the parent lectures the child."}, {"kind": "caption", "image": "Ата баласын кучагына алды. Ал түшүндү: уулунун эң чоң муктаждыгы — акча эмес, ата-энесинин кечилиги.", "story": "Ал кичинекей уулун кучактап, андан кечирим сурады.", "problem": "Wording differs, and the father’s apology is missing."}, {"kind": "moral", "image": "Сабак: Балдардын эң чоң муктаждыгы — ата-энесинин көңүлү, сүйүүсү жана алар менен чогуу өткөргөн убактысы.", "story": "Балага сатып берген буюмуңдан да, өзүңдүн жанында болгонуң кымбат. Ага убакытыңды, көңүлүңдү, мээримиңди бөл.", "problem": "Moral wording differs."}], "preview": "../../ky/wisdom-stories/illustrations/value-of-your-family.webp"}, {"stem": "advice-for-those-who-marry", "title": "Үйлөнгөндөргө кеңеш", "category": "Сүйүү жана нике", "status": "Needs correction", "items": [{"kind": "title", "image": "«Үйлөнгөндөргө кеңеш»", "story": "Үйлөнгөндөргө кеңеш", "problem": ""}, {"kind": "caption", "image": "Үйлөнгөндөргө бир өмүрлүк дүйнөсүн кандай бактылуу кылуу боюнча кеңештер:", "story": "Жаңы үй-бүлө курган жаш жубайларга турмушту көп көргөн улуулар мындай насаат айтышат:", "problem": "Different introductory sentence."}, {"kind": "caption", "image": "Үйлөнгөндө башкалардын никеси менен салыштырбаңыз, анткени, балким, алардын сырты башкача көрүнөт, бирок ичине ким билет. Ар кимдин өз жолу бар.", "story": "Өз турмушуңарды башкалардын турмушуна салыштырбагыла.", "problem": "Different wording; салыштырбаңыз instead of салыштырбагыла, and extra sentences."}, {"kind": "caption", "image": "Салыштыруу ыраазылыкты жок кылат. Ар бир нике уникалдуу. Башкалардын жолун эмес, өзүңөрдүн жолуңарды тандагыла; жогору карап эмес, алдыга карагыла.", "story": "“Тигинин күйөөсү мындай” же “мунун аялы тигиндей” дебегиле.", "problem": "The story's quoted examples are replaced by different advice."}, {"kind": "caption", "image": "Чек араны аныктагыла жана сыйлагыла. Баары башкалар билиши шарт эмес. Ар бир үй-бүлөнүн өзүнүн жеке дүйнөсү бар. Урматтоо — чек араны сактоодон башталат.", "story": "Чогуу жашасаңар да, ар бириңердин өз кызыкчылыгыңар, өз дүйнөңөр бар экенин унутпагыла.", "problem": "Extra and different sentences about boundaries."}, {"kind": "caption", "image": "Кирпи өзүнчө жашаса, ар бири өз дүйнөсүн сактайт жана бири-бирине тийбейт. Бэлише, жакын болушат; бирок өтө жакындаса, сайлары тиет, оорутат. Сиздер да ушундай болгула: өз дүйнөңөрдү сактагыла, бирок бири-бириңерге жакындашып, жылуулук тартуулагыла.", "story": "Кирпилер да бири-бирин тикени менен сайып албагыдай аралыкта турушат. Силер да бири-бириңерге эркиндик берип, жеке мейкиндикти сыйлагыла.", "problem": "The hedgehog image is rewritten and the closing advice differs."}, {"kind": "caption", "image": "Никиңизде бири-бириңиздин жакшы жактарын көрүп, кемчиликтерди эмес, сапаттарды эске алып иштегиле.", "story": "Кемчиликсиз адам издебегиле: эч кимибиз кынтыксыз эмеспиз.", "problem": "Different sentence, and Никиңизде is a misspelling of никеңизде."}, {"kind": "caption", "image": "«Ар бир сөз жүрөктүн күзгүсү». Айтуудан мурун ойлоңгула — сөзүңүз сырткы иштен бетер таасир этет. Ачууланганда эмес, тушунгөндө сүйлөгүлө.", "story": "Эмне каалап, эмнеге тынчсызданып жатканыңарды ачык айткыла.", "problem": "Different saying; тушунгөндө is missing ү."}, {"kind": "caption", "image": "Күн аягында ушак эмес, бири-бириңизге жакын болгула. Кечирим сурап, кечирим бергиле. Кичинекей нерселерди урушка айлантпагыла. Махабатты деп сактагыла, сагыл сандырбагыла.", "story": "Күндүз таарынышып калсаңар да, уктаар алдында бири-бириңерге “Кайырлуу түн” дегенди унутпагыла.", "problem": "Good-night line is missing; last words сагыл сандырбагыла are not in the story."}, {"kind": "moral", "image": "Бактылуу нике салыштырууда эмес, ачык баарлашууда жана өз ара урматта.", "story": "Сабак: Үй-бүлөнүн бактысы башкаларга теңелүүдө эмес. Ачык сүйлөшүп, бири-бириңерди сыйлап, ар кимиңердин өз дүйнөсү бар экенин түшүнө билгиле.", "problem": "Shortened and reworded moral."}], "preview": "../../ky/wisdom-stories/illustrations/advice-for-those-who-marry.webp"}, {"stem": "woman-whose-house-was-robbed", "title": "Үйү тонолгон аял", "category": "Адилеттүүлүк жана коом", "status": "Needs correction", "items": [{"kind": "title", "image": "Үйү тонолгон аял", "story": "Үйү тонолгон аял", "problem": ""}, {"kind": "caption", "image": "Байыркы заманда бир шаарда жашаган кары аялдын үйү тонолот.", "story": "Байыркы заманда бир шаарда жашаган кемпирдин үйүн ууру тоноп кетет.", "problem": "Wording differs slightly."}, {"kind": "caption", "image": "Аял падышага барып, кайгысын айтып, жардам сурайт.", "story": "Кемпир кайгырып, падышага даттанганы барат.", "problem": "She asks for help instead of complaining."}, {"kind": "speech", "image": "Сен түнкүсүн эми эмне кыласың, үйүңдүн эшиги бекемби, күзөтчүң барбы?", "story": "«Үйүңө ууру киргенин да сезбей калгыдай эмнеге мынчалык катуу уктадың?»", "problem": "The king’s question is different."}, {"kind": "speech", "image": "Падышам, түнү тынч укташым үчүн баарын көрдүм: эшигимди бекемдеп, күзөтчү койдум, өзүм да дуба кылып, уктаганмын.", "story": "Кемпир: «Падышам, биз сиз ойгоо жүрөт деп ойлоп, үйүбүздө бейкапар уктап жатканбыз», — деп жооп берет.", "problem": "Her answer lists locks and a guard instead of trusting the king."}, {"kind": "moral", "image": "Сабак: Элдин тынчтыгы мамлекетке болгон ишенимден жаралат. Адамдар башчысын ойгоо деп билсе, өз үйүндө бейкапар уктайт.", "story": "Сабак: Эл бийликке таянып, бейпил жашоону күтөт. Ошол ишенимди актоо — жетекчинин жоопкерчилиги.", "problem": "Moral wording differs."}], "preview": "../../ky/wisdom-stories/illustrations/woman-whose-house-was-robbed.webp"}, {"stem": "three-statues", "title": "Үч айкел", "category": "Акылмандык жана өмүр сабактары", "status": "Needs correction", "items": [{"kind": "title", "image": "Үч айкел", "story": "Үч айкел", "problem": ""}, {"kind": "caption", "image": "Эки дос падышанын өкүмдарлары ортосундагы сырлуу сүйлөшүүнү угуп, чогуу болуп кетишти.", "story": "Коңшулаш эки өлкөнүн өкүмдарлары жакшы дос эле. Бир күнү алардын бири экинчисине туулган күнүнө белек жөнөтүүнү чечет.", "problem": "Туулган күн белеги жок; сүйлөмдүн мааниси башка."}, {"kind": "caption", "image": "Падыша үч айкелди жасатып, эртеси күнү үч досту чакыртты. Биринчи айкелди кармагычка илип, колуна ийне жана жип берди. Айкелдин ичиндеги биринчи досунан баштап, билген сырын айт деп буйруду.", "story": "Өлкөсүнүн эң мыкты айкелчисин алдына чакырып, ага алтындан бир карыш бийиктиктеги, бири-бирине куюп койгондой окшош үч айкел жасоону тапшырат.", "problem": "Үч дос, кармагыч, ийне жомоктон жок."}, {"kind": "caption", "image": "Өкүмдарлар таң калышты да, экинчи доско ошондой эле тапшырма беришти. Ал эми ал да молчулук сактады.", "story": "Белекти алган өкүмдар адегенде айкелдерди таразага тарттырат. Алардын салмагы граммына чейин бирдей экени аныкталат.", "problem": "Тараза жок; маани башка."}, {"kind": "speech", "image": "Андан соң мудрец акыркы досун чакырып, ушундай деди: «Сен бул үч айкелди бирден бирине сырын айтып бер».", "story": "Ал айкелдерди кылдат карап чыгып, ичке зым алып келүүнү суранат.", "problem": "Зым сыноосу башкача баяндалган."}, {"kind": "caption", "image": "Биринчи айкелдин кулагына экинчи айкел бир сырын айтып чыкты.", "story": "Зымды биринчи айкелдин кулагына салса, экинчи кулагынан чыгат.", "problem": "Экинчи кулактан чыкканы жок."}, {"kind": "caption", "image": "Экинчи айкел ал сырды үчүнчү айкелдин кулагына жашырчын айтып берди. Үчүнчү айкел болсо тыңч укты.", "story": "Экинчи айкелдин кулагына салса, оозунан чыгат. Акыры үчүнчү айкелдин кулагына салганда, зым ичинде туруп калат.", "problem": "Экинчиси оозунан чыгарат, үчүнчүсү ичинде калат — сүрөттө бул башкача."}, {"kind": "caption", "image": "Акырында мудрец мындай деп жазды. Бул үч айкел үч башка адамдарды билдирет. Биринчиси: уккан сырын башкага айтканы — кулагынан тигилген. Экинчиси: ал сырды угуп, башкага жеткирген — тилине тигилген. Үчүнчүсү: сырды угуп, сактаганы — жүрөгүндө бекемделген.", "story": "«Бул үч айкел үч башка адамдын түрүн туюнтат. Укканын: — бир кулагынан киргизип, экинчисинен чыгарган; — ошол замат оозунан чыгарып жиберген; — жүрөгүндө сактай билген.", "problem": "Биринчиси «башкага айтканы», экинчиси «тилине тигилген» — жомоктогу үч түр башкача."}, {"kind": "caption", "image": "Мудрец мактубун улантты. Эң акылман адам — уккан сырын өз жүрөгүндө сактап, чыныгы убакта гана туура жерде айтып койгон адам.", "story": "Эң баалуу адам — укканын жүрөгүндө сырдай сактап, зарыл жерде, өз убагында гана айта билген адам.", "problem": "«Эң баалуу» ордуна «эң акылман»; «сырдай» жок."}, {"kind": "moral", "image": "Сабак: Эң баалуу адам — укканын жүрөгүндө сырдай сактап, сөздү өз ордунда гана айткан адам. Сыр сактоо да — акылмандык.", "story": "Сабак: Укканыңды туш келди чача бербе. Сырды сактап, керектүү сөздү керектүү жерде айткан адамдын баркы бийик.", "problem": "«Туш келди чача бербе» жана «баркы бийик» жок."}], "preview": "../../ky/wisdom-stories/illustrations/three-statues.webp"}, {"stem": "three-landscapes", "title": "Үч көрүнүш", "category": "Акылмандык жана өмүр сабактары", "status": "Needs correction", "items": [{"kind": "title", "image": "Үч көрүнүш", "story": "Үч көрүнүш", "problem": ""}, {"kind": "caption", "image": "Биринчи көрүнүш: бир жигит узак жолго чыкты.", "story": "Сапарга чыккан бир жигит жолдон үч таң калычтуу көрүнүшкө туш болот.", "problem": "Башка сөздөр: сапар жана үч көрүнүш айтылбайт."}, {"kind": "caption", "image": "Биринчи көрүнүш: акылсыздык менен жакшылык кылды, бирок аны элге айтып баркын кетирди.", "story": "Алар — адегенде жакшылык кылып, анан кылганын элге айтып, анын баркын жок кылгандар.", "problem": "«акылсыздык менен» кошулган; буудай, өрттөө жок."}, {"kind": "caption", "image": "Экинчи көрүнүш: бир адамга жардам берди, анын даңкы чыгып кетти, кийин өзүн уят сезип, тообосуз күнөө кылды.", "story": "Экинчи көрүнүштө бир киши чоң ташты жерден көтөрүүгө аракет кылат, бирок колунан келбейт.", "problem": "Таш жана күнөө оорлошунун ордуна жардам, даңк, уят жазылган."}, {"kind": "caption", "image": "Үчүнчү көрүнүш: ак ниет жигиттин үстүнөн элдер өтүп кетти. Башкалар аны аркасына алып, жолун жеңилдетти.", "story": "бир киши койдун белине минип алган, дагы бир нече киши анын ийнине жармашкан.", "problem": "Койдун ордуна жигит; мааниси башка."}, {"kind": "caption", "image": "Жигит шаарга келип, акылман карыяга жолугуп, башынан өткөндөрүн айтып берди.", "story": "бир шаарга жетет. Кире бериш дарбазанын жанынан нур жүздүү карыяны көрүп салам берет.", "problem": "Башкача кыскартылган."}, {"kind": "speech", "image": "«Жакшылык кылып, кийин аны элге айтсаң, даңкың кетет; жардам берсең, даңкың чыгып кетсе, тообосуз күнөө болот.»", "story": "Алар — адегенде жакшылык кылып, анан кылганын элге айтып, анын баркын жок кылгандар.", "problem": "Даңк жана тообосуз күнөө кошулган; барк жок кылуу так айтылбайт."}, {"kind": "thought", "image": "«Элге жакшы иштериңди айтсаң, ал сенин баркыңды кетирет. Ал эми эч кимге айтпай, жашыруун кылсаң — өчпөс сауап жыйнала берет.»", "story": "Алар — адегенде жакшылык кылып, анан кылганын элге айтып, анын баркын жок кылгандар.", "problem": "Жашыруун сауап кошулган; аңгемеде жок."}, {"kind": "speech", "image": "«Туура жол башчынын артынан ээрген жан саламат чыгып, жоголбойт. Алардын артынан баргандар да аман-эсен, максатына жетет.»", "story": "Койго биринчи мингендер — аалымдар. Аалымдардын ийнине жармашкандар — ар түрдүү катмардагы ыймандуулар.", "problem": "Аалым, ыйман, кой, ишенбегендер жок."}, {"kind": "moral", "image": "Сабак: Элге айтып баркы кетирилген жакшылык, тообосуз күнөө жана туура жол башчынын артынан ээрчүү — ар бири жашоонун жашыруун сабагы.", "story": "Сабак: Жакшылыкты милдет кылба, катаңды адатка айлантпа, туура жол көрсөткөндөн үлгү ал.", "problem": "Сабактын сөздөрү башка."}], "preview": "../../ky/wisdom-stories/illustrations/three-landscapes.webp"}, {"stem": "three-questions", "title": "Үч суроо", "category": "Акылмандык жана өмүр сабактары", "status": "Needs correction", "items": [{"kind": "title", "image": "Үч суроо", "story": "Үч суроо", "problem": ""}, {"kind": "speech", "image": "Мен сага үч суроо берем. Эгер эртең жообун билбей калсаң, башыңды алайм. Биринчиси: Адам кудайдан эмнени эң көп жашырат? Экинчиси: Адам эмне жөнүндө өтө тез унутат? Үчүнчүсү: Эмне адамды акылман кылат жана бийлик берет?", "story": "Сага үч суроо берем. Эртеңге чейин жообун таппасаң, сарайдан куулуп чыгасың. Биринчиси: Кудай кимдин камын жейт? Экинчиси: Кудай эмнени жабат? Үчүнчүсү: Кудай эмне иш кылат?", "problem": "Жаза жана үч суроонун мааниси башка."}, {"kind": "speech", "image": "Эгер визир үч суроонун жообун билбесе, мен эртең дворецти таштап кетем.", "story": "Эртеңге чейин жообун таппасаң, сарайдан куулуп чыгасың.", "problem": "Вазир өзүн кууп чыгарат деп айтылбайт; дворецти таштоо башка."}, {"kind": "speech", "image": "Устат, эмне үчүн капаа болуп жатасыз? Эс алыңыз да, дана болуңуз.", "story": "Кызматчы кожоюнунун кабагы салыңкы экенин көрүп, себебин сурайт.", "problem": "Кызматчынын сөзү аңгемеде жок."}, {"kind": "speech", "image": "Падыша мага үч суроо берди. Эгер эртең жообун билбей калсам, дворецти таштап кетем.", "story": "Вазир башынан өткөндөрдү айтып берет.", "problem": "Коркунучтун сөздөрү башка."}, {"kind": "speech", "image": "Мен үчөөнө тең жоопту билем. Эртең падышанын алдында кулуңуздун кемчиликтерин жашырып, азыр уктаңыз.", "story": "Үч суроонун тең жообун билем. Экөөнү азыр айтайын, үчүнчүсүн эртең көрөсүз. Кудай пенделеринин камын жейт, айыбын жабат.", "problem": "Жооптор жана кеңеш башка."}, {"kind": "speech", "image": "Бүгүн мен үч суроонун жообун айтам. Кудай кумунун кемчиликтерин жашыратат жана аны ачык кылбайт.", "story": "Кудай пенделеринин камын жейт, айыбын жабат.", "problem": "«кумунун кемчиликтерин» деген сөз аңгемеде жок."}, {"kind": "speech", "image": "Бул чындык. Эми экинчисин айтчы. Адам эмне жөнүндө өтө тез унутат?", "story": "Туура. Бул жоопторду өзүң таптыңбы же сага бирөө үйрөттүбү?", "problem": "Падышанын суроосу башка."}, {"kind": "speech", "image": "Акылдуу кул мага үйрөттү.", "story": "Акылдуу, зирек кызматчым үйрөттү.", "problem": "«кул» деген сөз «кызматчынын» ордуна."}, {"kind": "speech", "image": "Бул кийимимди чечип, кулуңдун кийимин кий!", "story": "вазир вазирлик чепкенин чечип кызматчысына кийгизет, өзү болсо анын эски кийимин киет.", "problem": "Чепкендин ордуна жалпы кийим; «кул»."}, {"kind": "speech", "image": "Ал эми үчүнчү суроо? Эмне адамды акылман кылат жана бийлик берет?", "story": "Үчүнчү суроонун жообу кандай? Кудай эмне иш кылат?", "problem": "Үчүнчү суроо башка."}, {"kind": "speech", "image": "Билбейсизби? Кудай вазирди кул кылат, ал эми кулду дароо вазир кылат!", "story": "Кудай бир көз ирмемде вазирди кызматчы, кызматчыны болсо вазир кылат!", "problem": "«кызматчы» ордуна «кул»."}, {"kind": "moral", "image": "Сабак: Бүгүн вазир болгон киши эртэң кызматчы болушу мүмкүн. Ошондуктан эч ким өзүнүн бийлик ордуна ишенип, бой көтөрбөсүн!", "story": "Сабак: Мансап түбөлүк эмес. Бүгүн буйрук берген эртең өзү кызмат кылышы мүмкүн. Бой көтөрбөй, калыс бол.", "problem": "Сабактын сөздөрү башка."}], "preview": "../../ky/wisdom-stories/illustrations/three-questions.webp"}, {"stem": "to-be-self-confident", "title": "Өзүнө ишенүү", "category": "Адеп жана мүнөз", "status": "Needs correction", "items": [{"kind": "title", "image": "Өзүнө ишенүү", "story": "Өзүнө ишенүү", "problem": ""}, {"kind": "speech", "image": "Өзүмө даярмын!", "story": "Өзүңдү баала!", "problem": "Different slogan."}, {"kind": "speech", "image": "Жол ачууга даярмын!", "story": "Чечкиндүү бол!", "problem": "Different slogan."}, {"kind": "speech", "image": "Күчүм бар, мен жасай алам!", "story": "Күчүңө күч кош!", "problem": "Different slogan."}, {"kind": "speech", "image": "Үмүтүмдү итирбе!", "story": "Үмүтүңдү үзбө!", "problem": "итирбе instead of үзбө."}, {"kind": "speech", "image": "Ваз кечпе!", "story": "Алсыздыкка жол бербе!", "problem": "Ваз кечпе is not the story line."}, {"kind": "speech", "image": "Өзүмдү коркпой алга!", "story": "Сергек бол!", "problem": "Different slogan."}, {"kind": "speech", "image": "Ийгиликте болом!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Максатымды коргойм!", "story": "Ниетиң таза болсун!", "problem": "Different slogan."}, {"kind": "speech", "image": "Ишенем! Аны сөзсүз ишке ашырам!", "story": "Ыймандуу бол!", "problem": "Different slogan."}, {"kind": "moral", "image": "Сабак: Өзүңдү баала, үмүтүңдү үзбө, кадыр-баркыңды сакта. Өзүнө ишенүү — адамдын эң күчтүү тиреги..", "story": "Өз күчүңө ишен, бирок ниетиңди таза карма. Үмүт, аракет, ар-намыс сени алдыга жетелесин.", "problem": "Uses three story slogans but the lesson sentence is different and drops clean intention, effort, and honor."}], "preview": "../../ky/wisdom-stories/illustrations/to-be-self-confident.webp"}, {"stem": "help-yourself-o-exalted-god", "title": "Өзүң жардам бере көр, улуу Аллахым", "category": "Иман жана руханият", "status": "Needs correction", "items": [{"kind": "title", "image": "Өзүң жардам бере көр, улуу Аллахым!", "story": "Өзүң жардам бере көр, улуу Аллахым!", "problem": ""}, {"kind": "caption", "image": "Тынчы кеткенге, үйсүз калганга, Жетим болгонго, жалгыз калганга, Муктаж болгонго, ач-сусуз калганга...", "story": "Тынчы кеткенге, үйсүз калганга, Жетим болгонго, жалгыз калганга, Муктаж болгонго, ач-сусуз калганга,", "problem": ""}, {"kind": "caption", "image": "Өзүң жардам бере көр, улуу Аллахым!", "story": "Өзүң жардам бере көр, улуу Аллахым!", "problem": ""}, {"kind": "caption", "image": "Ооруган жанга, колу кыска калганга, Көңүлү жарда, көзү жолдо калганга, Үмүтү өчкөнгө, чарасыз калганга...", "story": "Ооруган жанга, колу кыска калганга, Көңүлү сынып, көзү жолдо калганга, Үмүтү өчкөнгө, чарасыз калганга,", "problem": "Көңүлү жарда versus Көңүлү сынып."}, {"kind": "caption", "image": "Капарсыз болгонго, нурдан кур калганга, Тилеги барга, кыялдар курганга, Ыймансыз болгонго, Сенсиз калганга — Өзүң жардам бере көр, улуу Аллахым!", "story": "Капарсыз болгонго, нурдан кур калганга, Тилеги барга, кыялдар курганга, Ыймансыз болгонго, Сенсиз калганга — Өзүң жардам бере көр, улуу Аллахым!", "problem": ""}, {"kind": "moral", "image": "Сабак: Чарасыздардын, жалгыздардын, үмүтсүздөрдүн эң акыркы башпаанеги — Жаратуучу. Дуба — эң терең муктаждыктын тили.", "story": "Айласы түгөнгөн адам Жаратканга жалбарат. Дубада анын муңу да, үмүтү да айтылат.", "problem": "Different moral wording."}], "preview": "../../ky/wisdom-stories/illustrations/help-yourself-o-exalted-god.webp"}, {"stem": "life-is-short", "title": "Өмүр кыска", "category": "Акылмандык жана өмүр сабактары", "status": "Needs correction", "items": [{"kind": "title", "image": "Өмүр кыска", "story": "Өмүр кыска", "problem": ""}, {"kind": "caption", "image": "Өмүр кыска.", "story": "Өмүр кыска.", "problem": ""}, {"kind": "caption", "image": "Аны сени кубанткан адамдар менен өткөр.", "story": "Аны сени кубанткан жана сүйүктүү экениңди сездирген адамдар менен өткөр.", "problem": "«жана сүйүктүү экениңди сездирген» түшүп калган."}, {"kind": "other", "image": "ТУУРА ЭМЕС АДАМДАРГА УБАКТЫҢДЫ КОРОТПО", "story": "", "problem": "Аңгемеде мындай такта жок."}, {"kind": "other", "image": "СЕНИ КУБАНТКАН АДАМДАР МЕНЕН ӨТКӨР", "story": "Аны сени кубанткан жана сүйүктүү экениңди сездирген адамдар менен өткөр.", "problem": "«сүйүктүү экениңди сездирген» жок."}, {"kind": "caption", "image": "Өмүр кыска; аны сени кубанткан адамдар менен өткөр. Туура эмес адамдарга убактыңды коротпо.", "story": "Өмүр кыска. Аны сени кубанткан жана сүйүктүү экениңди сездирген адамдар менен өткөр.", "problem": "Сөз түшүп калган жана аңгемеде жок эскертүү кошулган. Сабак тактасы башка."}], "preview": "../../ky/wisdom-stories/illustrations/life-is-sho <script>
const rows = JSON.parse(document.getElementById("data").textContent);
const counts = {all: rows.length, "Needs correction": 0, "Requires manual review": 0, Matches: 0};
rows.forEach(r => { counts[r.status] = (counts[r.status] || 0) + 1; });
const summary = document.getElementById("summary");
summary.innerHTML = Object.entries(counts).map(([k, n]) =>
  `<button type="button" data-status="${k}" aria-pressed="${k === "all"}">${k === "all" ? "All illustrations" : k}: ${n}</button>`
).join("");
let status = "all";
const q = document.getElementById("q");
function esc(s) {
  return String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function badge(st) {
  const cls = st === "Matches" ? "match" : st === "Needs correction" ? "fix" : "review";
  return `<span class="badge ${cls}">${esc(st)}</span>`;
}
function render() {
  const query = q.value.trim().toLowerCase();
  const shown = rows.filter(r => (status === "all" || r.status === status) &&
    (!query || (r.title + " " + r.stem + " " + r.category).toLowerCase().includes(query)));
  document.querySelectorAll("[data-status]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.status === status)));
  const list = document.getElementById("list");
  if (!shown.length) { list.innerHTML = '<p class="empty">No illustrations in this view.</p>'; return; }
  list.innerHTML = shown.map(r => {
    const items = (r.items || []).map(it => {
      const bad = String(it.problem || "").trim();
      return `<tr class="${bad ? "bad" : ""}">
        <td class="kind">${esc(it.kind)}</td>
        <td>${esc(it.image)}</td>
        <td>${esc(it.story)}</td>
        <td class="problem">${bad ? esc(it.problem) + (it.story ? "<br><strong>Use: </strong>" + esc(it.story) : "") : ""}</td>
      </tr>`;
    }).join("");
    return `<article>
      <div class="head">
        <div><h2>${esc(r.title || "(no story title)")}</h2><div class="stem">${esc(r.stem)}${r.category ? " · " + esc(r.category) : ""}</div></div>
        ${badge(r.status)}
      </div>
      <div class="layout">
        <img class="preview" src="${esc(r.preview)}" alt="" />
        <table>
          <thead><tr><th>Where</th><th>On the image</th><th>Story text</th><th>Discrepancy and correction</th></tr></thead>
          <tbody>${items || "<tr><td colspan='4'>No readable text was recorded.</td></tr>"}</tbody>
        </table>
      </div>
    </article>`;
  }).join("");
}
document.body.addEventListener("click", (e) => {
  const b = e.target.closest("[data-status]");
  if (!b) return;
  status = b.dataset.status;
  render();
});
q.addEventListener("input", render);
render();
</script>
