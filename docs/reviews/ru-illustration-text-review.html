беззащитным, даже в собственной семье.", "problem": ""}], "preview": "../../ru/wisdom-stories/illustrations/i-am-waiting-for-the-teeth.webp"}, {"stem": "fish-shop", "title": "В рыбной лавке", "category": "Труд, удел и богатство", "status": "Needs correction", "items": [{"kind": "title", "image": "В рыбной лавке", "story": "В рыбной лавке", "problem": ""}, {"kind": "caption", "image": "Один мужчина шёл и думал о том, как тяжело сейчас жить. О, если бы хотя бы была автобусная остановка здесь! Как было бы хорошо для людей покупать рыбу в рыбной лавке. — сказал он себе.", "story": "После работы мужчина направлялся к автобусной остановке и проходил мимо рыбной лавки.", "problem": "Другая сцена: он уже идёт к остановке, а не жалеет, что её нет."}, {"kind": "thought", "image": "Если бы здесь была автобусная остановка, это бы было так удобно для людей — они просто зашли бы сюда и купили рыбу.", "story": "", "problem": "Этой мысли в рассказе нет."}, {"kind": "other", "image": "РЫБНАЯ ЛАВКА", "story": "рыбной лавки", "problem": ""}, {"kind": "caption", "image": "Он подошёл к лавке и спросил у продавца, сколько стоит рыба. Тот назвал цену.", "story": "Он попросил продавца взвесить сначала килограмм, а затем два килограмма рыбы.", "problem": "В рассказе он просит взвесить, а не спрашивает цену."}, {"kind": "speech", "image": "Сибас, лобан, кефаль, хек и ставрида.", "story": "", "problem": "Этих названий рыб в рассказе нет."}, {"kind": "speech", "image": "Дайте мне кефаль.", "story": "", "problem": "Этой реплики в рассказе нет."}, {"kind": "speech", "image": "Сынок, ты не мог бы купить немного рыбы и для меня?", "story": "— Сынок, не купишь ли и мне рыбы?", "problem": "Лишние слова «ты не мог бы» и «немного»."}, {"kind": "speech", "image": "Конечно, мам.", "story": "Мужчина без колебаний сказал продавцу", "problem": "Он отвечает продавцу, не «мам»."}, {"kind": "speech", "image": "Четыре кило: два для моей семьи и два для вас.", "story": "— Взвесь четыре килограмма: два мне и два атил за рыбу для своей семьи и ушёл.", "story": "Направляясь к остановке, мужчина вспомнил, что не заплатил за рыбу. Денег у него уже не было.", "problem": "В рассказе он не платит за рыбу."}, {"kind": "speech", "image": "Да благословит тебя Аллах за твою доброту.", "story": "— Иди, брат, это от чистого сердца.", "problem": "Другая реплика продавца."}, {"kind": "caption", "image": "Когда он шёл домой под дождём, он подумал: Добрые дела — это не только помощь близким. Они могут исходить из доброго сердца и для других людей, которые в этом нуждаются.", "story": "Шагая под дождём, он благодарил Аллаха за возможность помочь", "problem": "Другая мысль."}, {"kind": "speech", "image": "Как счастлива он будет. Как будет доволен Аллах и его семья и как эта рыба принесёт им пользу и людям, которые в ней нуждаются.", "story": "Он позвонил дочери, сказал, что купил рыбу и скоро будет.", "problem": "Другой разговор; грамматика «счастлива он»."}, {"kind": "speech", "image": "Благодарю Аллаха за то, что Он дал мне возможность творить добро и подарил мне эту улыбку.", "story": "он благодарил Аллаха за возможность помочь; слёзы на его щеках смешивались с дождевой водой.", "problem": "Нет слёз; добавлена улыбка."}, {"kind": "moral", "image": "Мораль: Не жди больших возможностей, чтобы творить добро: оно зависит не от богатства, а от широты сердца. Богатый душой найдёт способ помочь даже тогда, когда сам небогат.", "story": "Не жди больших возможностей, чтобы творить добро: оно зависит не от богатства, а от широты сердца. Богатый душой найдёт способ помочь даже тогда, когда сам небогат.", "problem": ""}], "preview": "../../ru/wisdom-stories/illustrations/fish-shop.webp"}, {"stem": "magnificent-lesson", "title": "Великолепный урок", "category": "История и известные личности", "status": "Needs correction", "items": [{"kind": "title", "image": "Великолепный урок", "story": "Великолепный урок", "problem": ""}, {"kind": "speech", "image": "Я умею говорить столько слов, что никто не сможет ро ясное объяснение."}], "preview": "../../ru/wisdom-stories/illustrations/newtons-second-law.webp"}, {"stem": "henry-fords-choice", "title": "Выбор Генри Форда", "category": "Труд, удел и богатство", "status": "Needs correction", "items": [{"kind": "title", "image": "«Выбор Генри Форда»", "story": "Выбор Генри Форда", "problem": ""}, {"kind": "speech", "image": "Сегодня я пригласил двух выпускников университета обсудить с ними вакансии в компании «Ford Motor». Я внимательно наблюдаю за обоими молодыми людьми, так как хочу понять не только их знания, но и характер.", "story": "Говорят, однажды Генри Форд, основатель компании Ford Motor Company, пригласил на ужин двух молодых друзей, желавших работать в его компании.", "problem": "«Ford Motor» вместо «Ford Motor Company»; другой повод и другая речь."}, {"kind": "other", "image": "РЕСТОРАН", "story": "у выхода из ресторана", "problem": ""}, {"kind": "speech", "image": "Сам молодец, это ясно. Я уже решил: приглашу на работу того из вас, кто сегодня продемонстрирует настоящие человеческие качества, когда никто этого не ожидает.", "story": "Форд предложил одному из молодых людей работу, а второму пожелал удачи.", "problem": "Другая речь Форда."}, {"kind": "speech", "image": "Мистер Форд, мы всю жизнь мечтали работать в автомобильной компании. Но есть кое-что, что гораздо важнее знаний и навыков — человеческие качества. Но мы, к сожалению, иногда забываем об этом. И именно поэтому мы здесь сегодня? Чтобы вы это оценили?", "story": "— Мистер Форд, мы весь вечер не говорили об автомобилях или инженерных навыках, мы лишь затронули общие темы. Но вы предложили работу моему другу и лишили меня этой возможности. Почему вы приняли такое решение?", "problem": "Другой вопрос."}, {"kind": "speech", "image": "Конечно, у каждого из вас есть две причины. Первая: вы оба стремитесь к успеху, хотите показать себя в любом деле, в котором участвуете. Вторая: вы надеетесь быть принятыми на работу. Я вижу, вы оба заботитесь о своем будущем, y": "Государь, это значит, что все ваши родственники уйдут из жизни раньше вас, а вы останетесь последним.", "problem": "Missing that he will be the last one left."}, {"kind": "speech", "image": "Негодяй! Убирайся отсюда! Приведите сюда другого толкователя!", "story": "Царь разгневался и прогнал его. Затем он позвал другого толкователя", "problem": "Harsher wording than the story."}, {"kind": "speech", "image": "О, правитель, если вам приснилось, что у вас выпали все зубы, это означает, что вы переживёте всех своих родственников.", "story": "Государь, этот сон означает, что вы проживёте дольше всех в своей семье.", "problem": "Close meaning, different words: «переживёте всех своих родственников»."}, {"kind": "speech", "image": "Какие мудрые тебя слова! Ты по-настоящему понимаешь сердце правителя!", "story": "Царь остался доволен ответом и щедро наградил толкователя.", "problem": "Word order «мудрые тебя слова» and extra praise; the reward is shown but not stated as in the story."}, {"kind": "moral", "image": "Одну и ту же истину можно выразить и резко, и деликатно.", "story": "Одну и ту же правду можно высказать грубо или бережно. Слова способны и ранить, и утешить. Мудрость — в умении подобрать их.", "problem": "«истину/резко/деликатно» for «правду/грубо/бережно»; last two sentences missing."}], "preview": "../../ru/wisdom-stories/illustrations/fallen-teeth.webp"}, {"stem": "chief-accountant-and-the-ceo", "title": "Главный бухгалтер и генеральный директор", "category": "Труд, удел и богатство", "status": "Needs correction", "items": [{"kind": "title", "image": "«Главный бухгалтер и генеральный директор»", "story": "Главный бухгалтер и генеральный директор", "problem": ""}, {"kind": "caption", "image": "Главный бухгалтер говорит:", "story": "Главный бухгалтер говорит генеральному директору:", "problem": ""}, {"kind": "speech", "image": "— А что, если обученные сотрудники уйдут? Мы вложим средства, а они уйдут к конкурентам. Разве это не риск?", "story": "— А что, ес d": "other", "image": "ДЕТСКИЙ ПРИЮТ", "story": "детский дом", "problem": "Different word for the institution."}, {"kind": "caption", "image": "Годы проходят.", "story": "Прошли годы.", "problem": "Tense differs."}, {"kind": "speech", "image": "— Мой сын, я слышал, ты стал сильным и успешным человеком. Неужели это правда? В приюте, где звучали жестокие слова?", "story": "Я не верил, что ты окрепнешь. А ты вырос таким сильным! Как тебе удалось справиться с болезнями?", "problem": "Asks about success despite cruel words, not about overcoming illness."}, {"kind": "other", "image": "ШКОЛА", "story": "перед школой", "problem": ""}, {"kind": "speech", "image": "— Да, в приюте меня окружали жестокие слова, но затем я встретил добрую женщину, которая любила меня и сеяла во мне добрые слова. Они стали моей силой.", "story": "Ты говорил: «Гнилое семя не прорастёт». А она приняла меня как родного и окружила заботой. Она всегда повторяла: «Любое семя прорастёт, если поливать его любовью».", "problem": "The two seed sentences are missing."}, {"kind": "moral", "image": "Слова либо созидают, либо разрушают.", "story": "Слова либо созидают, либо разрушают. Одним словом можно возвысить или погубить человека — каждое семя, политое любовью, прорастет.", "problem": "Rest of the moral is missing."}], "preview": "../../ru/wisdom-stories/illustrations/rotten-seed.webp"}, {"stem": "handful-of-roasted-chickpeas", "title": "Горсть жареного нута", "category": "Дружба и человеческие отношения", "status": "Needs correction", "items": [{"kind": "title", "image": "«Горсть жареного нута»", "story": "Горсть жареного нута", "problem": ""}, {"kind": "caption", "image": "Однажды мама с сыном вошли в маленькую лавку. Мальчик, увидев жареный нут, захотел его, но знал, что у них нет денег. Поэтому он попросил маму купить ему немного.", "story": "Мальчик вместе с матерью зашёл в лавку орехов и сухофруктов. Он без конца повторял: «Хочу жареного нута».", "problem": "В рассказе нет ни отсутствия денег, ни пр и, поэтому не осмеливается просить хлеб для своего внука. Он стоит в тишине, не жалуясь, и надеется, что наступит новый день.", "story": "Старик подошел к пекарю. Ему нужно было купить горячий хлеб для внука. Люди стояли в очереди за хлебом.", "problem": "Другая сцена: он не «каждый день» молчит в очереди."}, {"kind": "other", "image": "ПЕКАРНЯ", "story": "пекарни", "problem": ""}, {"kind": "other", "image": "Горячий хлеб, ежедневно выпекается с любовью", "story": "Запах горячего свежего хлеба", "problem": "Другая надпись."}, {"kind": "speech", "image": "Сэр, будьте здоровы.", "story": "— Возьмите, дядюшка, на здоровье.", "problem": "«Сэр» вместо «дядюшка»."}, {"kind": "speech", "image": "Да благословит вас Аллах за ваши добрые дела.", "story": "— Да будет доволен тобой Аллах, сын мой.", "problem": "Другая благодарность."}, {"kind": "speech", "image": "Я надеюсь, что мой внук тоже будет сыт. Я покупаю горячий хлеб для своего внука. Да благословит вас Аллах.", "story": "Ребенок просил свежий хлеб уже несколько дней.", "problem": "Другая речь."}, {"kind": "speech", "image": "Да благословит вас Аллах. Аминь!", "story": "— Аминь!", "problem": "Добавлено благословение пекаря."}, {"kind": "speech", "image": "Возьмите это, дедушка. Это от Бога для вас. Да благословит вас Аллах.", "story": "— Дядя, это закят моей матери; я буду очень рад, если вы его примете.", "problem": "Нет закята матери."}, {"kind": "speech", "image": "Да благословит вас тоже. Да будет вам награда от Аллаха.", "story": "— Да примет его Аллах, сын мой.", "problem": "Другая благодарность."}, {"kind": "speech", "image": "Сэр, это от вас для дедушки. Да будете вы здоровы. Берите это. Да благословит вас Аллах.", "story": "— В Рамадан мы раздаём продукты. Примите, пожалуйста, эти пакеты.", "problem": "Другая речь; даритель в рассказе — молодая женщина."}, {"kind": "speech", "image": "Да благословит вас тоже, мой ребенок! Аминь, мой ребенок!", "story": "— Да примет это Аллах, дочь моя. — Аминь, дядя!", "problem": "«мой ребенок» вместо «дочь моя» и «дядя»."}, {"kind": "speech", "image": "Вот, сэр. Вот ваш хлеб, садитесь. Это для вашего внука. Да будете вы здоровы. Да благословит вас Аллах, мой ребенок. Да будет вам награда от Аллаха. Пусть Аллах вознаградит вас, мой ребенок. Благодарю вас очень сильно. Это все для моего внука.", "story": "— Берите все три. Что останется, съедите потом. Сегодня пятница. По пятницам мы дарим нуждающимся по три буханки горячего хлеба.", "problem": "Нет пятницы и трёх буханок; обращение «сэр»."}, {"kind": "speech", "image": "Да вознаградит Аллах всех, кто был добрым к нам. Да примет Аллах их добрые дела. Да благословит Он их дома и семьи.", "story": "— Да, было очень вкусно, слава Аллаху. Пусть Аллах примет это.", "problem": "Другая застольная речь."}, {"kind": "speech", "image": "Аминь, Господи наш. Да благословит нас всех Аллах. Аминь.", "story": "", "problem": "Этой реплики в рассказе нет."}, {"kind": "speech", "image": "Дедушка, вы знали, что у нас теперь есть? Они не знали, мой мальчик. Но это от Аллаха.", "story": "— Дедушка, ты купил горячий хлеб?", "problem": "Другой разговор с внуком."}, {"kind": "speech", "image": "Я очень переживал о зубах. Но благодаря добрым людям у нас есть еда. Да благословит Аллах их.", "story": "Зубы у тебя испортились, и ты ими очень тяжело жуёшь.", "problem": "Говорит дед, а в рассказе — внук о зубах деда."}, {"kind": "speech", "image": "Дедушка, я молю Аллаха, чтобы Он благословил их. Да, мой сынок. Благодарим Аллаха. Он помогает добрым людям. Аминь.", "story": "Теперь пойду помолюсь, чтобы Он послал деньги на лечение твоих зубов.", "problem": "Молитва не про лечение зубов."}, {"kind": "speech", "image": "Смотри, моя дорогая. Аллах ответил на наши молитвы.", "story": "— Всё, о чём просил наш внук, Аллах нам послал.", "problem": "Пересказ."}, {"kind": "speech", "image": "Никогда не переставай благодарить Аллаха. Он помогает нам в трудностях. Надейся на Него всецело и всегда доверяйте Аллаху.", "story": "Сла  the story the king asks it."}, {"kind": "speech", "image": "Царь: — Его смысл — для тех, кто понимает.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Мудрец: — Скажи нам, старец, объясни.", "story": "", "problem": "Speaker label and request do not match the story."}, {"kind": "speech", "image": "Царь: — Кто понимает, тот пусть поймёт.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Царь: — Разве ты не понимаешь наш вопрос?", "story": "— Вы понимаете, о чём мы говорим?", "problem": "The king asks the sage, not the vizier."}, {"kind": "speech", "image": "Визирь (встревоженно): — Возможно, он принимает нас за глупцов.", "story": "— Нет, мой король, — с тревогой отвечает главный визирь.", "problem": "Different reply."}, {"kind": "speech", "image": "Мудрец: — Я не принимаю вас за глупцов. Я говорю лишь о том, что вижу.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Визирь: — Пожалуйста, объясни нам.", "story": "— О чём вы говорили с королём?", "problem": "Different request."}, {"kind": "speech", "image": "Мудрец: — Муха садится на мёд, пчела — на яд. Твой вкус — твоё понимание.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Царь: — Многое человек видит глазами, но смысл остаётся за пределами его понимания.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Мудрец объясняет после того, как получает много золота: — Гуся, которого предстоит ощипать, сначала нужно поймать, затем удержать, принести, зарезать, ощипать, приготовить и съесть — всё это делает тот, кто понимает. Видеть — одно, понимать смысл — другое.", "story": "— Догадайся сам, — говорит он.", "problem": "The sage explains the goose for gold; in the story he refuses and says to guess."}, {"kind": "speech", "image": "Мудрец: — Сын мой, у слов много слоёв, и у каждого — своё значение. Не каждый способен постичь самую суть изречения.", "story": "", "problem": "Not in the , {"kind": "speech", "image": "«Подумай, если бы после этого ты потерял все богатства и был бы вынужден выживать только с этой водой. Какова была бы их ценность для тебя тогда?»", "story": "«А если жажда вернётся, отдашь оставшуюся половину за вторую чашку?»", "problem": "Другой вопрос мудреца."}, {"kind": "speech", "image": "«Тогда они бы стали бесценными для меня.»", "story": "«Отдам, лишь бы не умереть».", "problem": "Другой ответ правителя."}, {"kind": "speech", "image": "«Ценность богатства зависит от обстоятельств. В пустыне всё состояние стоит двух чашек воды.»", "story": "«Тогда не стоит так хвастаться, — улыбнулся мудрец. — Всё твоё богатство стоит всего двух чашек воды».", "problem": "Нет «не стоит так хвастаться» и «всего»."}, {"kind": "moral", "image": "Ценность богатства зависит от обстоятельств. В пустыне всё состояние стоит двух чашек воды.", "story": "Ценность богатства зависит от обстоятельств. Перед жаждой и необходимостью выжить золото уступает простой воде.", "problem": "Вторая фраза морали заменена ценой двух чашек."}], "preview": "../../ru/wisdom-stories/illustrations/two-bowls-of-water.webp"}, {"stem": "grandfather-and-grandson-at-the-market", "title": "Дедушка и внук в магазине", "category": "Семья и воспитание", "status": "Needs correction", "items": [{"kind": "title", "image": "«Дедушка и внук на рынке»", "story": "Дедушка и внук в магазине", "problem": "«на рынке» instead of «в магазине»."}, {"kind": "caption", "image": "Дедушка повёл Рафика в супермаркет. Они взяли тележку и пошли между полками. Внезапно внук начал капризничать и громко просить: «Хочу вот это, дедушка!»", "story": "Дедушка приходит в супермаркет с внуком. Тем временем внук то и дело кричит: «Купи мне это, купи мне то!»", "problem": "Child's cry differs. Story does not name the grandson until the end."}, {"kind": "speech", "image": "Внезапно он начал топать ногами и кричать ещё громче: «Купи прямо сейчас эту шоколадку, иначе я упаду на пол и буду плакать!» Дедушка спокойно м, но почему ты сам всегда голоден?", "story": "Чем отличаются те, кто по-настоящему любит, от тех, кто лишь говорит о любви?", "problem": "другой вопрос"}, {"kind": "speech", "image": "Посмотрите, и я вам покажу.", "story": "Подождите, сейчас я вам покажу.", "problem": "«Посмотрите» вместо «Подождите, сейчас»"}, {"kind": "caption", "image": "Он взял несколько человек и повёл их на один ужин.", "story": "Дервиш пригласил людей, любивших рассуждать о любви, и накрыл для них стол.", "problem": "сокращённый пересказ"}, {"kind": "speech", "image": "Попробуйте поесть из этой ложки.", "story": "Есть можно только этими ложками, держа их за самый конец.", "problem": "нет условия держать ложку за конец"}, {"kind": "caption", "image": "Люди старались изо всех сил, но из-за длинных ложек не могли поднести еду ко рту и ушли с того ужина голодными.", "story": "Суп проливался, люди обжигались и в конце концов ушли голодными и смущёнными.", "problem": "нет «обжигались» и «смущёнными»"}, {"kind": "caption", "image": "Затем дервиш снова пригласил их на другой ужин.", "story": "Затем дервиш пригласил тех, кто знал, что такое настоящая любовь.", "problem": "это другие люди, не те же гости"}, {"kind": "caption", "image": "Каждый кормил из своей длинной ложки того, кто сидел перед ним.", "story": "каждый набирал суп и кормил сидящего напротив.", "problem": "«перед ним» вместо «сидящего напротив»; нет «суп»"}, {"kind": "speech", "image": "Понимаете? В этой жизни живут только те, кто думает о других, а не только о себе. Кто кормит человека перед собой — тот сам тоже насыщается. Вот таков закон жизни.", "story": "Кто за столом жизни думает только о себе, может остаться голодным. Кто заботится о другом, сам получает заботу в ответ.", "problem": "другие слова; «закон жизни» нет в рассказе"}, {"kind": "moral", "image": "Кто кормит человека перед собой, тот тоже насыщается.", "story": "Заботясь о других, человек и сам получает добро. Тот, кто отдаёт, тоже приобретает.", "problem": "мораль сокращена и пересказана"}], "preview": "../../ru/wisdom-stories/illustrations/dervishs-spoons.webp"}, {"stem": "welcome-my-bey", "title": "Добро пожаловать, мой бей", "category": "Дружба и человеческие отношения", "status": "Needs correction", "items": [{"kind": "title", "image": "«Добро пожаловать, сэр»", "story": "Добро пожаловать, мой бей", "problem": "«сэр» вместо «мой бей»."}, {"kind": "caption", "image": "Разведчик Атам Хафиз Али служил охранником в Чанаккале. Однажды, уходя на работу, он сказал мне: «Если со мной случится что-то плохое, не плачь слишком. Будь сильной. Воспитывай сына как достойного человека... Гордыней моей жизни будет то, что останется после меня...»", "story": "Когда мой отец Хафиз Али погиб при Чанаккале, мама была на седьмом месяце беременности.", "problem": "Отец назван разведчиком и охранником и прощается перед уходом; в рассказе он уже погиб, фотографии не осталось."}, {"kind": "caption", "image": "Атам ушёл на службу, улыбаясь на прощание.", "story": "", "problem": "Этой сцены в рассказе нет."}, {"kind": "speech", "image": "— Сынок, жизнь может быть трудной. Учись, будь сильным и добрым. — Всегда помни: знания — это сила, а доброта — настоящее богатство! — Вырастешь — стань честным человеком. Вот моё последнее напутствие тебе!", "story": "— Сынок, я иду на рынок. Если твой отец придёт, дай мне знать немедленно!", "problem": "Напутствие отца вместо просьбы матери сообщить, если отец придёт."}, {"kind": "caption", "image": "Я вырос, стал юношей. Но не было ни дня, чтобы я не вспоминал отца. Каждый раз, как видел маму, всё глубже понимал её боль... «Сколько она пережила ради нас...»", "story": "Я вырос, стал владельцем бизнеса и открыл магазин.", "problem": "Нет магазина; добавлено ежедневное воспоминание об отце."}, {"kind": "caption", "image": "Годы летели. Мама старела. Но каждое утро она вставала с одной надеждой — возможно, в этот день придёт весть от отца... И она шептала молитвы за его душу.", "story": "Моя мать состарилась. Несмотря на это, она все еще приходила ко мне... «Если твой отец придет, позови меня, а!»", "problem": "Молитвы о вести от отца вместо просьбы позвать её, если отец придёт."}, {"kind": "speech", "image": "«Мой сын, не печалься. Я ни о чём не жалею. Я горжусь тобой. Помни своего отца — он герой. Он ушёл ради вас, ради этой земли...»", "story": "«Вы хорошо обо мне заботились. Простите, если была вам в тягость». «Если отец вернётся, скажи: мама ждала тебя всю жизнь».", "problem": "Другие предсмертные слова."}, {"kind": "speech", "image": "«Добро пожаловать, сэр...»", "story": "«Добро пожаловать, мой бей!»", "problem": "«сэр» вместо «мой бей»."}, {"kind": "caption", "image": "Сказав это, она закрыла глаза и тихо ушла в мир вечного покоя.", "story": "Это были её последние слова.", "problem": "Добавлено «мир вечного покоя»."}, {"kind": "caption", "image": "прошептал я сквозь слёзы.", "story": "прошептала", "problem": "Шепчет сын, а в рассказе — мать."}, {"kind": "caption", "image": "В Чанаккале стоит могила отца — свидетель его чести и преданности.", "story": "18 марта – день победы при Чанаккале.", "problem": "Могила отца в рассказе не названа."}, {"kind": "caption", "image": "В Чанаккале есть память Герой, отдавший жизнь за родину, вечно живёт в наших сердцах. Душа его — свет, а слава его бессмертна. И мать ждала его всю жизнь на этой дороге надежды!", "story": "Пусть покоятся с миром все павшие при Чанаккале, в том числе азербайджанские солдаты.", "problem": "Другой текст о памяти; «есть память Герой» не совпадает с рассказом."}, {"kind": "moral", "image": "Преданность и тоска матери — чистейшая любовь. Память о павших и о матерях священна.", "story": "Верность и ожидание могут длиться целую жизнь. Храните память о погибших за родину и о близких, которые их ждали.", "problem": "Другая формулировка морали."}], "preview": "../../ru/wisdom-stories/illustrations/welcome-my-bey.webp"}, {"stem": "credit-ledger", "title": "Долговая тетрадь", "category": "Труд, удел и богатство", "status": "Needs correction", "items": [{"kind": "title", "image": "«Пробирная книжка»", "story": "Долговая тетрадь", "problem": "Другой заголовок."}, {"kind": "other", "image": "Добрые дела приносят благословение", "story": "", "problem": "Этой надписи в рассказе нет."}, {"kind": "speech", "image": "Брат, можешь ли ты в долг дать мне хлеб, чай и сахар?", "story": "— Брат, если я попрошу хлеба, чая или яиц в долг, ты дашь?", "problem": "«сахар» вместо «яиц»; утвердительная просьба вместо вопроса."}, {"kind": "speech", "image": "Конечно, брат мой. Бери, сколько нужно. Мы все здесь проходим непростые времена. Давай поможем друг другу во имя Аллаха. Если сегодня нужно тебе, завтра, возможно, понадобится мне. Да благословит тебя Аллах.", "story": "— Один человек уже три месяца берёт у меня хлеб в долг. Честно говоря, не думаю, что он сможет расплатиться. Но на его попечении трое сирот. Не оставлять же детей голодными! Аллах велик, позаботится и о нас. А за хлеб с тебя денег не возьму. Бери на здоровье.", "problem": "Другой ответ лавочника."}, {"kind": "thought", "image": "Альхамдулилях, он понял.", "story": "Незнакомец улыбнулся и подумал: «Кажется, я нашёл то, что искал».", "problem": "Другая мысль."}, {"kind": "speech", "image": "Ты ведёшь записи таких долгов?", "story": "— А на какую сумму записано долгов в твоей тетради?", "problem": "Другой вопрос."}, {"kind": "speech", "image": "Зачем это?", "story": "— Зачем тебе это?", "problem": "Пропущено «тебе»."}, {"kind": "speech", "image": "Да, брат, я пользуюсь этим в свою пользу и никогда не прошу возврата... Вот почему я веду эту книгу. Когда кто-то в состоянии, он может вернуть.", "story": "— Прошу тебя, брат, не сердись. Я пришёл не для того, чтобы отнимать у тебя время. Хочу выкупить эту тетрадь.", "problem": "Говорит не тот и не то: выкупает тетрадь незнакомец."}, {"kind": "speech", "image": "Брат, пусть Аллах воздаст тебе! Я иду через трудности... Я потерял работу, а я и моя мама сироты. Я бы хотел дать что-нибудь поесть. Помоги мне в этом. Пусть Аллах защитит тебя. И пусть люди любят тебя ради Него.", "story": "— Да будет доволен тобой Аллах, брат. Ты доверяешь людям и ради Аллаха не оставляешь сирот голодными.", "problem": "Другая речь; незнакомец сам назван сиротой."}, {"kind": "speech", "image": "Дорогой дядя, вот, возьми хлеб, яйца и чай. Скажи матери, что тот дядя приходил и уходил... Пусть Аллах обеспечит тебя и твою семью.", "story": "— Подойди, дочка. Возьми хлеб, яйца и масло. И передай маме: дядя уже заходил…", "problem": "«чай» вместо «масло»; другая концовка."}, {"kind": "speech", "image": "Спасибо тебе, сэр. Да вознаградит тебя Аллах. Аминь.", "story": "— Дядя Ахмед, мама просит дать нам буханку хлеба и три яйца на ифтар.", "problem": "Девочка благодарит, а в рассказе она просит в долг."}, {"kind": "moral", "image": "Мораль: Доброта, совершённая молча, — это высшая доброта. Прощение долга и то, что сирота не голодает, — это истинное богатство сердца.", "story": "Тихая, бескорыстная помощь дороже громких слов. Простить долг и накормить сироту — вот подлинное богатство сердца.", "problem": "Другая первая фраза; «сирота не голодает» вместо «накормить сироту»."}], "preview": "../../ru/wisdom-stories/illustrations/credit-ledger.webp"}, {"stem": "road-to-the-cotton-field", "title": "Дорога на хлопковое поле", "category": "Мудрость и уроки жизни", "status": "Needs correction", "items": [{"kind": "title", "image": "Дорога на хлопковое поле", "story": "Дорога на хлопковое поле", "problem": ""}, {"kind": "speech", "image": "Дорогие дети, знание — это самый верный путь к светлому будущему. Знания делают человека сильным.", "story": "Увидев бедную школу и узнав, что нас ждёт лишь работа на хлопковых полях, он не смог сдержать слёз.", "problem": "Речь учителя не из рассказа."}, {"kind": "other", "image": "СЕЛЬСКАЯ ШКОЛА", "story": "", "problem": ""}, {"kind": "speech", "image": "В жизни у вас будет много дорог. Выбирайте тот путь, который приведет вас к вашим мечтам.", "story": "мы думали, что перед нами всегда только один путь — путь к хлопковому полю", "problem": "Учитель говорит о многих дорогах иначе, чем в рассказе."}, {"kind": "speech", "image": "Какой из этих путей приведет нас к знаниям?", "story": "Мы ответили, что эта дорога ведёт на хлопковое поле.", "problem": "Вопрос детей другой."}, {"kind": "other", "image": "ХЛОПКОВОЕ ПОЛЕ", "story": "эта дорога ведёт на хлопковое поле", "problem": ""}, {"kind": "speech", "image": "Никто из вас не рождается знающим, но труд и упорство дают знания. Тот, кто не устает, побеждает невежество.", "story": "", "problem": "Этой речи в рассказе нет."}, {"kind": "caption", "image": "Учиться — значит открывать новые горизонты.", "story": "Учитель быстро научил нас грамоте.", "problem": "Другая формулировка."}, {"kind": "caption", "image": "Однажды Айдын-муаллим сказал: «Ваше будущее зависит от вас. Учитесь, развивайтесь и будьте полезны своему народу.»", "story": "«Мои дети… Всегда мечтайте. Мечты приведут вас туда, куда вы хотите.»", "problem": "Письмо учителя заменено другой речью; «Айдын-муаллим» вместо «учитель Айдын»."}, {"kind": "speech", "image": "Ваше стремление к знаниям откроет вам новые пути. Один из этих путей приведет к вашим самым заветным мечтам.", "story": "Для человека, который может мечтать, мир больше не состоит только из одного пути.", "problem": "Другая формулировка."}, {"kind": "other", "image": "«Дорогие дети... Знания – это свет. Они освещают место, где ты стойшь. Учитесь, стремитесь, не останавливайтесь и однажды вы увидите плоды своего труда.» Ваш учитель Айдын-муаллим.", "story": "«Мои дети… Всегда мечтайте. Мечты приведут вас туда, куда вы хотите. Всё, что вам нужно сделать, это приложить усилия, усердно работать и быть целеустремлёнными в достижении своих целей. От всего сердца поздравляю вас всех. Я знал, что вы добьётесь успеха. Ваш друг по переписке, учитель Айдын».", "problem": "Текст письма другой; «стойшь» вместо «стоишь»; подпись «Айдын-муаллим», а не «друг по переписке, учитель Айдын»."}, {"kind": "moral", "image": "Учитель не только показал путь, но и проложил новые дороги. Для того, кто умеет мечтать, мир больше одного пути.", "story": "Учитель не только показал детям путь, но и проложил для них новые дороги. Для человека, который может мечтать, мир больше не состоит только из одного пути.", "problem": "Пропущены «детям» и «для них»; «мир больше одного пути» вместо «больше не состоит только из одного пути»."}], "preview": "../../ru/wisdom-stories/illustrations/road-to-the-cotton-field.webp"}, {"stem": "friend-of-god", "title": "Друг Аллаха", "category": "Вера и духовность", "status": "Needs correction", "items": [{"kind": "title", "image": "Друг Аллаха", "story": "Друг Аллаха", "problem": ""}, {"kind": "caption", "image": "Старик видит босоногого ребёнка, жалеет его и покупает ему пару туфель.", "story": "Однажды пожилой мужчина заметил ребёнка без обуви. Ему стало жаль мальчика, и он купил ему пару ботинок.", "problem": "«туфель» вместо «ботинок»; пересказ"}, {"kind": "speech", "image": "Ты Аллах?", "story": "Вы Аллах?", "problem": "«Ты» вместо «Вы»"}, {"kind": "speech", "image": "Нет, дитя моё, я простой человек.", "story": "Нет, сынок. Я всего лишь обычный человек.", "problem": "«дитя моё» и «простой» вместо «сынок» и «всего лишь обычный»"}, {"kind": "speech", "image": "Тогда ты друг Аллаха. Прошлой ночью, плача, я сказал Аллаху, что у меня нет туфель.", "story": "Тогда вы друг Аллаха. Вчера ночью я плакал и говорил Аллаху, что у меня нет обуви.", "problem": "«ты», «Прошлой ночью», «туфель» вместо «вы», «Вчера ночью», «обуви»"}, {"kind": "moral", "image": "Мораль: Иногда добро приходит не с небес, а через руки добрых людей. Возможно, в твоих руках быть ответом на чью-то молитву.", "story": "Мораль: Иногда помощь приходит в ответ на молитву через добрые руки людей. Быть может, сегодня именно ты можешь стать для кого-то такой помощью.", "problem": "добавлено «не с небес»; мораль пересказана"}], "preview": "../../ru/wisdom-s bp"}, {"stem": "friendship-and-love", "title": "Дружба и любовь", "category": "Любовь и брак", "status": "Needs correction", "items": [{"kind": "title", "image": "«Дружба и любовь»", "story": "Дружба и любовь", "problem": ""}, {"kind": "caption", "image": "Напишите ссору на листе, чтобы она упала с дерева и исчезла, словно ветер унес её вдаль.", "story": "Напишите ссору на листьях дерева, чтобы, когда придёт осень, листья высохли и опали, и ссора исчезла.", "problem": "Один лист и ветер вместо осенних листьев, которые высохли и опали."}, {"kind": "other", "image": "ссора", "story": "ссору", "problem": ""}, {"kind": "caption", "image": "Напишите гнев на облаке, чтобы дождь его смыл, и облако рассеялось, как тьма.", "story": "Напишите гнев на облаках, чтобы пошёл дождь, облака рассеялись, и гнев исчез.", "problem": "«смыл» и «как тьма» вместо «пошёл дождь» и «гнев исчез»."}, {"kind": "other", "image": "гнев", "story": "гнев", "problem": ""}, {"kind": "caption", "image": "Напишите ненависть на снегу, чтобы солнце растопило её, и она исчезла навсегда.", "story": "Напишите ненависть на снегу, чтобы взошло солнце, снег растаял, и ненависть исчезла.", "problem": "«растопило её» и «навсегда» вместо «снег растаял, и ненависть исчезла»."}, {"kind": "other", "image": "ненависть", "story": "ненависть", "problem": ""}, {"kind": "caption", "image": "Когда дружбу и любовь рождают добрые сердца, дружба и любовь пусть навсегда останутся в мире.", "story": "Напишите дружбу и любовь на сердцах новорожденных, чтобы они выросли, и дружба и любовь распространились по всему миру.", "problem": "Нет новорождённых и распространения по миру."}, {"kind": "other", "image": "дружба", "story": "дружбу", "problem": ""}, {"kind": "other", "image": "любовь", "story": "любовь", "problem": ""}, {"kind": "moral", "image": "Напишите дружбу и любовь на сердцах, чтобы они остались навсегда.", "story": "Напишите дружбу и любовь на сердцах новорожденных, чтобы они выросли, и дружба и любовь распространились азе нет."}, {"kind": "moral", "image": "«Когда нам нужна помощь, она приходит через руки другого.»", "story": "когда нам нужна помощь, Он посылает ее через руки человека. Иногда нам самим приходится быть этим помощником.", "problem": "Нет «Господь» и «Иногда нам самим приходится быть этим помощником»; «другого» вместо «человека»."}], "preview": "../../ru/wisdom-stories/illustrations/friendship-of-horses.webp"}, {"stem": "think-speak-and-act-positively", "title": "Думайте, говорите, действуйте позитивно.", "category": "Нравственность и характер", "status": "Needs correction", "items": [{"kind": "title", "image": "Думайте, говорите, действуйте позитивно", "story": "Думайте, говорите, действуйте позитивно.", "problem": ""}, {"kind": "caption", "image": "Думайте позитивно, потому что ваши мысли становятся словами.", "story": "Думайте позитивно, потому что ваши мысли становятся вашими словами.", "problem": "Missing «вашими»."}, {"kind": "speech", "image": "Я могу это сделать!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Каждый день прекрасен!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Я полезен!", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Говорите позитивно, потому что ваши слова становятся вашими действиями.", "story": "Говорите позитивно, потому что ваши слова становятся вашими действиями.", "problem": ""}, {"kind": "speech", "image": "У тебя всё получится!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Я рад тебя видеть!", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Действуйте позитивно, потому что ваши действия становятся вашими привычками.", "story": "Действуйте позитивно, потому что ваши действия становятся вашими привычками.", "problem": ""}, {"kind": "other", "image": "Помогать другим", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Заботиться о природе", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Вырабатывать хорошие привычки", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Быть добрым", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Учиться", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Эти привычки станут вашей судьбой!", "story": "Развивайте позитивные привычки, потому что ваши привычки становятся вашими ценностями.", "problem": "Skips values and says habits become fate."}, {"kind": "caption", "image": "Привычки становятся вашей судьбой, потому что ваша судьба зависит от ваших действий.", "story": "Развивайте позитивные ценности, потому что ваши ценности становятся вашей судьбой.", "problem": "Habits become fate because of actions; the story says values become fate."}, {"kind": "other", "image": "Здоровье", "story": "", "problem": ""}, {"kind": "other", "image": "Дружба", "story": "", "problem": ""}, {"kind": "other", "image": "Успех", "story": "", "problem": ""}, {"kind": "other", "image": "Знания", "story": "", "problem": ""}, {"kind": "other", "image": "Уважение", "story": "", "problem": ""}, {"kind": "caption", "image": "Позитивные привычки создают вашу светлую судьбу и прекрасное будущее!", "story": "Развивайте позитивные ценности, потому что ваши ценности становятся вашей судьбой.", "problem": "Different sentence."}, {"kind": "caption", "image": "Прекрасное будущее зависит от моего выбора!", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Мысли становятся словами, слова — действиями, действия — привычками, привычки — судьбой.", "story": "Мораль: Мысль рождает слово, слово — поступок, поступок — привычку. Так постепенно складывается судьба.", "problem": "Drops the last line «Начинай с того, что взращиваешь в мыслях» and changes the chain wording."}], "preview": "../../ru/wisdom-stories/illustrations/think-speak-and-act-positively.webp"}, {"stem": "if-the-door-before-you-wont-open-it-is-not-your-door", "title": "Если дверь перед тобой не открывается, значит, это не твоя дверь.", "category": "Мудрость и уроки жизни", "status": "Needs correction", "items": [{"kind": "title", "image": "Если дверь перед тобой не открывается, значит, это не твоя дверь", "story": "Если дверь перед тобой не открывается, значит, это не твоя дверь.", "problem": ""}, {"kind": "speech", "image": "Я пришёл поговорить о повышении и признании моих заслуг. Я много работаю и верю, что заслуживаю большего. Я предан этой компании и искренне хочу её роста.", "story": "Джамал приходит к своему боссу, Салиму-бею, и говорит, что слышал о повышении на работе и что у него есть свои ожидания.", "problem": "Нет имён Джамал и Салим-бей; речь про заслуги и рост компании."}, {"kind": "other", "image": "ГЕНЕРАЛЬНЫЙ ДИРЕКТОР", "story": "", "problem": "Этой таблички в рассказе нет."}, {"kind": "speech", "image": "Салим, к сожалению, в ближайшее время мы не сможем повысить тебе зарллату. Это не отразится на твоей ценности как сотрудника. Ты — важная часть нашей компании.", "story": "он увольняет его, говоря: «Ты нам не подходишь».", "problem": "Орфография «зарллату»; отказ в зарплате вместо увольнения «ты нам не подходишь»."}, {"kind": "speech", "image": "Понимаю. Спасибо за честность.", "story": "Джамал вынужден уйти из компании в разочаровании.", "problem": "Другая реакция."}, {"kind": "caption", "image": "Через два месяца ко мне вернулись с новым предложением. Конкуренты оценили мой потенциал и предложили более высокую должность с отличными условиями. Возможно, тогда время уходить ещё не пришло.", "story": "Два года спустя они встречаются снова. ... он основал новую компанию и что дела идут хорошо.", "problem": "Два месяца и предложение конкурентов вместо двух лет и своей компании."}, {"kind": "speech", "image": "Честно говоря, когда я уходил, мне было очень тяжело. Я не знал, что будет дальше. Но именно тогда я решил начать своё дело. С большим трудом, многими бессонными ночами и верой в себя я пр  ли эти две судьбы друг о друге, могут ли они договориться между собой и помочь нам встретиться?", "problem": "другой смысл: речь о судьбах, а не о новостях"}, {"kind": "caption", "image": "Многие расстаются, даже не сделав ни шага навстречу, просто говоря «если судьба позволит». Но я не любил «если». Я любил «встретиться».", "story": "Мне никогда не нравилось это выражение «если судьба позволит».", "problem": "мужской род «не любил» при женском рассказчике; другие слова"}, {"kind": "caption", "image": "Давайте не будем откладывать встречу. «Если судьба позволит» – скажите лучше: «Встретимся сегодня».", "story": "Вместо обещания «встретимся, если судьба позволит» найдите время для встречи сами.", "problem": "«Встретимся сегодня» нет в рассказе"}, {"kind": "moral", "image": "Не откладывайте встречу, говоря если судьба позволит.", "story": "Не давайте близким людям отдалиться. Вместо обещания «встретимся, если судьба позволит» найдите время для встречи сами.", "problem": "мораль сокращена и пересказана"}], "preview": "../../ru/wisdom-stories/illustrations/if-fate-allows-we-will-meet.webp"}, {"stem": "do-you-have-spending-money", "title": "Есть ли у вас деньги?", "category": "Труд, удел и богатство", "status": "Needs correction", "items": [{"kind": "title", "image": "«Есть ли у вас деньги?»", "story": "Есть ли у вас деньги?", "problem": ""}, {"kind": "caption", "image": "Заботьтесь о родителях, когда они здоровы.", "story": "Цените родителей, пока они рядом.", "problem": "Другая формулировка: «когда они здоровы»."}, {"kind": "caption", "image": "Ухаживайте за родителями, когда они стареют.", "story": "заботьтесь о том, в чём они нуждаются.", "problem": "Пересказ."}, {"kind": "caption", "image": "Будьте рядом с родителями, когда им нужна поддержка.", "story": "Помогайте им по мере сил", "problem": "Пересказ."}, {"kind": "other", "image": "МОРАЛЬ", "story": "Мораль:", "problem": ""}, {"kind": "moral", "image": "Цените своих родителей, пока они живы.", "story": "Цените своих родителей, пока они живы, удовлетворяйте их потребности делами, а не словами. Никто и ничто не сможет занять их место.", "problem": "Оборвана мораль."}], "preview": "../../ru/wisdom-stories/illustrations/do-you-have-spending-money.webp"}, {"stem": "woman-and-the-mirror", "title": "Женщина и зеркало", "category": "Любовь и брак", "status": "Needs correction", "items": [{"kind": "title", "image": "Женщина и зеркало", "story": "Женщина и зеркало", "problem": ""}, {"kind": "speech", "image": "Хмм... Сегодня я такая неуклюжая...", "story": "Хм… Сегодня заплету косу…", "problem": "Речь о неуклюжести, а не о косе из трёх волосков."}, {"kind": "speech", "image": "Хмм... Сегодня у меня такой серый вид...", "story": "Хм… Сегодня разделю на две части…", "problem": "Другие слова; нет двух волосков."}, {"kind": "speech", "image": "Если так совсем плохо... Значит, я выгляжу ужасно...", "story": "Ничего, ладно… Сегодня сделаю хвостик…", "problem": "Другой смысл."}, {"kind": "speech", "image": "Ну и ладно! Мне всё равно, я люблю себя!", "story": "Ой!… Как хорошо: сегодня никаких забот о волосах!", "problem": "Нет радости, что нет забот о волосах."}, {"kind": "caption", "image": "Каждый взгляд формирует восприятие; а восприятие формирует выбор.", "story": "", "problem": "Этой фразы в рассказе нет."}, {"kind": "other", "image": "ТЫ ЦЕННА", "story": "", "problem": "Этой надписи в рассказе нет."}, {"kind": "other", "image": "ЛЮБИ СЕБЯ КАЖДЫЙ ДЕНЬ", "story": "", "problem": "Этой надписи в рассказе нет."}, {"kind": "other", "image": "Напоминание: Я счастлива. Я благодарна. Я выбираю себя.", "story": "", "problem": "Этого текста в рассказе нет."}, {"kind": "other", "image": "Жизнь прекрасна, когда ты счастлива!", "story": "", "problem": "Этой фразы в рассказе нет."}, {"kind": "moral", "image": "Всё зависит от точки зрения. Кто не создаёт счастье внутри себя, не найдёт его у других.", "story": "Умение радоваться зависит и от нашего взгляда на жизнь. Ищите повод для улыбки даже тогда, к , "image": "Тонкие знаки учат проявлять уважение без лишних слов. Чтобы предупредить, не всегда нужно повышать голос.", "story": "Деликатность не требует громкого голоса. Уважение и заботу можно выразить даже простым знаком.", "problem": "Смысл близкий, слова другие; нет «заботу» и «простым знаком»."}], "preview": "../../ru/wisdom-stories/illustrations/yellow-and-red-flowers.webp"}, {"stem": "donkeys-law", "title": "Закон осла", "category": "Притчи и басни", "status": "Needs correction", "items": [{"kind": "title", "image": "«Закон осла»", "story": "Закон осла", "problem": ""}, {"kind": "caption", "image": "Однажды осёл-король издал глупый закон: с этого дня всем животным ложиться спать ровно в полночь, а петь, кричать и шуметь до утра строго запрещается. Кто нарушит — будет наказан.", "story": "Однажды осёл становится царём леса. Через несколько дней он издаёт закон: все должны ложиться спать в шесть вечера и просыпаться в шесть утра. В течение двенадцати часов в лесу должна царить полная тишина, и любой, кто нарушит закон, будет наказан.", "problem": "Bedtime is midnight instead of six in the evening, and waking at six in the morning is omitted."}, {"kind": "caption", "image": "Испуганные животные подчинились. С тех пор в лесу воцарилась тишина.", "story": "Таким образом, на некоторое время в лесу воцаряется тишина.", "problem": "Adds that the animals were frightened."}, {"kind": "caption", "image": "Однажды утром петух по привычке пропел на рассвете. Его привели в суд. Осёл-король и придворные решили, что он нарушил закон. Петуха пожурили и велели впредь молчать до полуночи.", "story": "Однажды петух просыпается в пять утра и начинает кукарекать, нарушая тишину. Его тут же отдают под суд и по приговору осла казнят.", "problem": "The rooster is scolded and told to stay silent; in the story he is executed. Five in the morning is omitted."}, {"kind": "speech", "image": "Лев сказал ослу-королю: «Этот закон несправедлив. Животные боятся говорить правду. Петух пел на рассвете не со зла. Если мы будем молчать, глупые законы никогда не исчезнут». Но никто его не поддержал. Все промолчали — и закон остался в силе.", "story": "Ты уже живёшь свои последние дни. Мы хотим знать: в чём заключалась мудрость того закона, который предписывал ложиться спать в шесть вечера и вставать в шесть утра?", "problem": "The lion protests an unjust law. In the story, years later, the lion asks the dying donkey what wisdom the law had."}, {"kind": "speech", "image": "Довольный осёл сказал: «Раз никто не возражает, значит, всем мой закон нравится». И глупый закон продолжал править лесом.", "story": "Я и сам все эти годы удивлялся: почему лесные звери так покорно подчиняются закону, который я придумал по своей ослиной глупости?", "problem": "The donkey claims silence means approval. In the story he admits he was surprised they obeyed a law he invented out of donkey foolishness."}, {"kind": "moral", "image": "Мораль: Бессмысленный закон действует не потому, что он силён, а потому, что люди боятся говорить правду. Когда все молчат, несправедливость становится правилом. Но стоит одному произнести слово — и изменения возможны.", "story": "Бессмысленный закон держится на молчании тех, кто ему подчиняется. За приказом не всегда стоит мудрость. Не бойтесь задавать вопросы и проверять, есть ли смысл в привычных правилах.", "problem": "Different wording and an extra claim that one spoken word makes change possible."}, {"kind": "moral", "image": "Бессмысленный закон держится молчанием тех, кто ему подчиняется.", "story": "Бессмысленный закон держится на молчании тех, кто ему подчиняется.", "problem": "Missing the preposition «на»."}], "preview": "../../ru/wisdom-stories/illustrations/donkeys-law.webp"}, {"stem": "why-injustice-when-there-is-justice", "title": "Зачем несправедливость, когда есть справедливость?", "category": "Справедливость и общество", "status": "Needs correction", "items": [{"kind": "title", "image": "«Зачем несправедливость, когда есть справедливость?»", "story": "Зачем несправедливость, когда есть справедливость?", "problem": ""}, {"kind": "speech", "image": "Зачем ненависть, когда есть любовь; зачем война, когда есть мир; зачем вражда, когда есть дружба?", "story": "Зачем ненависть, когда есть любовь? Зачем война, когда есть мир? Зачем вражда, когда есть дружба?", "problem": "Omits «Зачем ссоры, когда есть братство?», «Зачем нетерпимость, когда есть терпимость?» and «Зачем плен, когда есть свобода?»."}, {"kind": "speech", "image": "Зачем несправедливость, когда есть справедливость; зачем беззаконие, когда есть закон; зачем жестокость, когда есть доброта?", "story": "Зачем несправедливость, когда есть справедливость?", "problem": "Adds pairs «беззаконие / закон» and «жестокость / доброта», which are not in the story."}, {"kind": "speech", "image": "Зачем несправедливость, когда есть справедливость?", "story": "Зачем несправедливость, когда есть справедливость?", "problem": ""}, {"kind": "other", "image": "СПРАВЕДЛИВОСТЬ", "story": "Зачем несправедливость, когда есть справедливость?", "problem": ""}, {"kind": "other", "image": "НЕСПРАВЕДЛИВОСТЬ", "story": "Зачем несправедливость, когда есть справедливость?", "problem": ""}, {"kind": "other", "image": "Хаджи Бекташ Вели", "story": "Хаджи Бекташ Вели:", "problem": ""}, {"kind": "moral", "image": "Вина человека — выбирать ненависть и несправедливость, когда возможны любовь, мир и справедливость.", "story": "Когда есть возможность выбрать мир, любовь и справедливость, за выбор вражды и ненависти отвечает сам человек.", "problem": "Wording differs: image says choosing hatred and injustice is the person's fault; the story says the person answers for choosing enmity and hatred when peace, love, and justice are possible."}], "preview": "../../ru/wisdom-stories/illustrations/why-injustice-when-there-is-justice.webp"}, {"stem": "sound-of-the-doorbell", "title": "Звук дверного звонка…", "category": "Дружба и человеческие отношения", "status": "Needs correction", "items": [{"kind": "title", "image": "Звук дверного звонка", "story": "Звук дверного звонка…", "problem": ""}, {"kind": "speech", "image": "Сегодня я развозил газеты. Доставляя их, я приносил людям новости.", "story": "Чтобы свести концы с концами, мне пришлось временно работать разносчиком газет.", "problem": "Нет увольнения и запечатанного ящика; «приносил людям новости» лишнее."}, {"kind": "other", "image": "НОВОСТИ", "story": "", "problem": "Этой надписи в рассказе нет."}, {"kind": "speech", "image": "Дедушка, вам принести газету?", "story": "— Дядя, зачем вы запечатали почтовый ящик?", "problem": "Другой вопрос."}, {"kind": "speech", "image": "Конечно, принеси, мой мальчик.", "story": "", "problem": "Этой реплики в рассказе нет."}, {"kind": "speech", "image": "Я был бы очень рад, если бы ты заходил почаще, просто так, чтобы я услышал звонок.", "story": "Прошу вас, каждый день, когда вы приносите газету, пожалуйста, стучитесь в дверь или звоните в звонок и передавайте её мне лично.", "problem": "«почаще, просто так» вместо ежедневной передачи газеты лично."}, {"kind": "speech", "image": "Ох, сынок, нам обоим не помешает немного общения.", "story": "", "problem": "Этой реплики в рассказе нет."}, {"kind": "speech", "image": "Нет проблем, я каждый день сюда прихожу. Тоску я прогоню, дедушка будет рад, а для меня это несложно. Кто знает, сколько жизни у нас осталось?", "story": "— Нет проблем, я каждый день дома", "problem": "Фразу старика говорит мальчик и добавляет чужие слова."}, {"kind": "speech", "image": "Я приношу газету, чтобы вы были в курсе новостей. Хорошо?", "story": "— Газеты я не читаю. Я жду звонка в дверь.", "problem": "Противоречит рассказу: старик газет не читает."}, {"kind": "speech", "image": "Да, мой мальчик, мне нужны новости... Ведь я ведь тоже хочу быть в курсе событий.", "story": "— Газеты я не читаю. Я жду звонка в дверь.", "problem": "Смысл противоположный."}, {"kind": "speech", "image": "В этом мире, сынок, будь человеком! Ибо то добро, что ты делаешь, не пропадёт даром. Один звонок в дверь может дать человеку надежду и с радостью продолжать жить.", "story": "— Молодой человек, вот телефон моего сына. Если однажды вы позвоните, а я не открою, пожалуйста, свяжитесь с ним.", "problem": "Нет телефона сына; другая речь."}, {"kind": "moral", "image": "Для некоторых один звонок в дверь стоит целого мира. Не забудем постучать к одиноким.", "story": "Для некоторых людей один звонок в дверь, одно приветствие, стоит целого мира. Давайте не забудем постучать в дверь одиноких.", "problem": "Нет «людей» и «одно приветствие»; «к одиноким» вместо «в дверь одиноких»."}], "preview": "../../ru/wisdom-stories/illustrations/sound-of-the-doorbell.webp"}, {"stem": "one-who-knows-and-the-one-who-does-not", "title": "Знающий и незнающий", "category": "Слово, молчание и общение", "status": "Needs correction", "items": [{"kind": "title", "image": "Знающий и незнающий", "story": "Знающий и незнающий", "problem": ""}, {"kind": "caption", "image": "Есть четыре типа людей: знающие и незнающие.", "story": "", "problem": "Этого вступления в рассказе нет."}, {"kind": "caption", "image": "Знающий и желающий знать пребывает близко, наставление можно дать ему.", "story": "Тот, кто не знает и знает, что не знает, — жаждет знаний. Научите его!", "problem": "Смешаны «знающий» и «желающий знать»; в рассказе первый тип — тот, кто не знает и знает, что не знает."}, {"kind": "caption", "image": "Знающего, но не желающего знать — пробудите его, наставление ему дайте.", "story": "Тот, кто знает и не знает, что знает, — спит. Разбудите его!", "problem": "«не желающего знать» вместо «не знает, что знает»; добавлено «наставление ему дайте»."}, {"kind": "caption", "image": "Незнающий и не желающий знать — держитесь от него подальше.", "story": "Тот, кто не знает и не знает, что не знает, — невежественен. Держитесь от него подальше!", "problem": "«не желающий знать» вместо «не знает, что не знает»."}, {"kind": "caption", "image": "Знайте и следуйте за тем, кто мудр и знает.", "story": "Тот, кто знает и знает, что знает, — лидер. Следуйте за ним!", "problem": "Нет «лидер» и «знает, что знает»."}, {"kind": "moral", "image": "Научите жаждущего знаний, пробудите беспечного, держитесь подальше от невежды, следуйте за мудрым.", "story": "Помоги тому, кто готов учиться, пробуди забывшего о своих способностях и остерегайся самоуверенного невежества. Следуй за подлинным знанием.", "problem": "«беспечного» и «невежды» вместо «забывшего о своих способностях» и «самоуверенного невежества»."}], "preview": "../../ru/wisdom-stories/illustrations/one-who-knows-and-the-one-who-does-not.webp"}, {"stem": "mature-person", "title": "Зрелый человек", "category": "Нравственность и характер", "status": "Needs correction", "items": [{"kind": "title", "image": "Зрелый человек", "story": "Зрелый человек", "problem": ""}, {"kind": "caption", "image": "Не у всех старых друзей стоит сохранять связь. Некоторые отношения могут тянуть вас вниз...", "story": "Наступает время, когда ты начинаешь больше ценить искренность старых друзей, перестаёшь стремиться к бессмысленным знакомствам", "problem": "Says not every old friendship should be kept; the story says old friends’ sincerity is valued more."}, {"kind": "caption", "image": "...от людей, которые постоянно критикуют, манипулируют и приносят больше боли, чем пользы...", "story": "и стараешься держаться подальше от невежества и отношений, причиняющих душевный вред.", "problem": "Criticism and manipulation replace ignorance and spiritual harm."}, {"kind": "other", "image": "ПОКОЙ", "story": "", "problem": ""}, {"kind": "other", "image": "ГАРМОНИЯ", "story": "", "problem": ""}, {"kind": "other", "image": "БЛАГОДАРНОСТЬ", "story": "", "problem": "Sign is small; these three words are the ones that read clearly."}, {"kind": "other", "image": "СВОБОДА", "story": "", "problem": ""}, {"kind": "caption", "image": "...и окружать себя теми, кто ценит вас по-настоящему и поддерживает ваш рост и покой.", "story": "Именно тогда ты понимаешь, что обрёл внутреннюю зрелость.", "problem": "Different conclusion."}, {"kind": "moral", "image": "Зрелость — это умение отдаляться от болезненных отношений и сохранять внутренний покой.", "story": "Мораль: Зрелость помогает выбирать отношения, в которых есть искренность и уважение, и отказываться от тех, что разрушают душевный покой.", "problem": "Different moral."}], "preview": "../../ru/wisdom-stories/illustrations/mature-person.webp"}, {"stem": "blind-who-have-eyes", "title": "Зрячие слепцы", "category": "Мудрость и уроки жизни", "status": "Needs correction", "items": [{"kind": "title", "image": "«Слепые люди с глазами»", "story": "Зрячие слепцы", "problem": "Different title."}, {"kind": "caption", "image": "У людей есть глаза, но они видят только то, к чему привыкли.", "story": "Мир полон слепых людей, которые думают, что видят, потому что у них есть глаза.", "problem": "Habit instead of thinking they see because they have eyes."}, {"kind": "caption", "image": "Видеть глазами – мало, нужен ещё и внутренний свет.", "story": "Мало смотреть — нужно ещё и понимать увиденное.", "problem": "«внутренний свет» instead of understanding what you see."}, {"kind": "caption", "image": "Истинное зрение — это понимание и доброта.", "story": "Мало смотреть — нужно ещё и понимать увиденное.", "problem": "Adds «доброта», which is not in the story."}, {"kind": "caption", "image": "Открой глаза на мир, и ты увидишь смысл и красоту жизни.", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Смотри глубже. Слушай сердцем. Делай добро. Люби людей.", "story": "", "problem": "Book list is not in the story."}, {"kind": "other", "image": "Каждый человек значим — и мир станет лучше.", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Зрение происходит не глазами, а пониманием.", "story": "Тот, кто смотрит, но не замечает, слушает, но не слышит, остаётся слеп к происходящему.", "problem": "Different sentence."}], "preview": "../../ru/wisdom-stories/illustrations/blind-who-have-eyes.webp"}, {"stem": "from-the-memoirs-of-a-lady-from-istanbul", "title": "Из воспоминаний женщины из Стамбула", "category": "Мудрость и уроки жизни", "status": "Needs correction", "items": [{"kind": "title", "image": "«Из воспоминаний женщины из Стамбула»", "story": "Из воспоминаний женщины из Стамбула", "problem": ""}, {"kind": "caption", "image": "Это было в 1919 году в Стамбуле. С тех пор как враги оккупировали наш прекрасный город, жить стало очень тяжело. В эти трудные дни меня обручили с молодым человеком, которого считали достойным и благородным. Его звали Нисанлы бей. Нисанлы казался образованным, достойным и скромным. Его семья были уважаемыми людьми, и я с радостью приняла это решение.", "story": "Это был 1919 год. Стамбул был полностью под британской оккупацией. ... Однажды вместе с ними появился высокий юноша, представившийся адвокатом.", "problem": "Жених назван Нисанлы беем, а не адвокатом; «враги» вместо британской оккупации."}, {"kind": "caption", "image": "Однажды на рынке я услышала разговор двух женщин. Они говорили тихо, но слова их поразили меня до глубины души.", "story": "Говорили: «Жених Айши вовсе не адвокат, он весь день плакал, неся гроб перед мечетью».", "problem": "Нет слуха про адвоката и гроб."}, {"kind": "caption", "image": "Я поднялась на верхний этаж. Оттуда я увидела, как солдаты-оккупанты несли гроб одного нашего соотечественника. Сердце моё сжалось. Он был мёртв. Его звали Сарсилм. Никто не знал, за что его казнили.", "story": "Мы с отцом пошли в мечеть, наблюдали издалека и увидели, что он действительно нес гроб.", "problem": "Гроб несёт жених в рассказе; на рисунке оккупанты несут казнённого Сарсилма."}, {"kind": "caption", "image": "Я решила выяснить правду. Я начала встречаться с Нисанлы беем чаще и узнала то, что перевернуло моё сердце. Он оказался не тем, кем казался. Он тайно работал на оккупантов. Его целью было сломить наш народ и выдать лидеров движения за свободу. Командовал этим предательским формированием и жестоко подавлял наш народ.", "story": "«А мы отправляли гробы с оружием в Анатолию, чтобы помочь Национальным силам, под видом похорон.»", "problem": "Противоположный смысл: жених служит оккупантам, а не Национальным силам."}, {"kind": "other", "image": "АХМЕД БЕЙ. ЮРИДИЧЕСКАЯ КОНТОРА.", "story": "Это была юридическая фирма; его имя было написано на вывеске на двери.", "problem": "Имя на вывеске «Ахмед бей», в рассказе имени на вывеске нет."}, {"kind": "speech", "image": "Ты поддерживаешь сопротивление?", "story": "", "problem": "Этого вопроса в рассказе нет."}, {"kind": "speech", "image": "Да.", "story": "— Да, — ответил он.", "problem": ""}, {"kind": "speech", "image": "Тогда знай, что такой человек, как ты, в своё время заплатит цену. Поверь мне.", "story": "", "problem": "Этой угрозы в рассказе нет."}, {"kind": "caption", "image": "Сегодня я узнала истину. Ради любви к этой земле он пожертвовал своей жизнью, никому об этом не сказав. Его звали Нандолуя. Он был молчаливым героем. Он отправлял сообщения патриотам и спасал многих наших соотечественников. Теперь уже ничего не имеет значения. Но одно я знаю точно: мир его душе.", "story": "«Стамбул был оккупирован. ... А мы отправляли гробы с оружием в Анатолию ... Я не мог вам этого рассказать…»", "problem": "Герой «Нандолуя» и сообщения патриотам вместо гробов с оружием."}, {"kind": "moral", "image": "Не судите по внешности; за каждым поступком может скрываться истина.", "story": "Не спешите судить по тому, что видите. За поступком может стоять правда, которой вы не знаете.", "problem": "«по внешности» и «истина» вместо «по тому, что видите» и «правда, которой вы не знаете»."}], "preview": "../../ru/wisdom-stories/illustrations/from-the-memoirs-of-a-lady-from-istanbul.webp"}, {"stem": "from-a-wise-fathers-advice-to-his-son", "title": "Из наставлений мудрого отца сыну:", "category": "Семья и воспитание", "status": "Needs correction", "items": [{"kind": "tit , "items": [{"kind": "title", "image": "«Мы богаты»", "story": "Мы богаты", "problem": ""}, {"kind": "caption", "image": "Император Нинтоку взошёл на башню Японии сразу после вступления на престол, чтобы посмотреть на страну. Он был опечален тем, что народ живёт бедно и тяжело, и задумался о том, как сделать их жизнь лучше.", "story": "В конце IV века император Нинтоку, занимавший трон Японии, однажды поднялся на высокую башню и осмотрел свою страну. Не увидев ни единого клубка дыма, поднимающегося в небо, он понял, что его народ живет в нищете", "problem": "Нет дыма; «сразу после вступления» не из рассказа."}, {"kind": "caption", "image": "Он приказал фермерам наладить орошение и усердно трудиться, ремесленникам — развивать свои ремёсла и делать хорошие изделия, торговцам — честно торговать, накапливая богатство в стране.", "story": "Он немедленно издал указ, предписывающий его народу работать только на себя в течение трех лет.", "problem": "Другой указ: нет трёх лет без налогов."}, {"kind": "caption", "image": "Ответом народа было усердие и единство.", "story": "Люди, работавшие на себя и не платившие налоги, через три года разбогатели.", "problem": "Пересказ."}, {"kind": "caption", "image": "Прошло несколько лет, и под заботливым правлением Нинтоку страна наполнилась богатством. Народ жил в изобилии и мире.", "story": "Через три года Нинтоку снова поднялся на башню и увидел дым", "problem": "«несколько лет» вместо «три года»; нет дыма."}, {"kind": "speech", "image": "Мы действительно богаты!", "story": "— Теперь мы богаты!", "problem": "«действительно» вместо «Теперь»."}, {"kind": "caption", "image": "Императрица, увидев отсутствие дыма из труб и унылые лица людей, спросила:", "story": "А императрица указала на дворец, обветшавший за три года запустения, с протекающей крышей и увядшими цветами", "problem": "На рисунке нет дыма у народа, хотя в рассказе дым как раз есть; смотрит не на дворец."}, {"kind": "speech", "image": "Неужели мы по-настоящему богаты?", "stor ems": [{"kind": "title", "image": "Не отклоняться от праведного пути", "story": "Не сходить с праведного пути", "problem": "«отклоняться» вместо «сходить»"}, {"kind": "speech", "image": "«Ваше Величество, в эти отвлекающие дни люди отворачиваются от праведного пути и живут ради мирской выгоды. Смиренно прошу Вас подсказать, как человек может следовать праведным путем в жизни, не отвлекаясь миром».", "story": "Он захотел жить честно и не сходить с праведного пути, поэтому пришёл к царю за советом.", "problem": "этой речи нет в рассказе"}, {"kind": "speech", "image": "«Очень хорошо. Возьми этот кувшин с оливковым маслом, наполненный до краев, и пройди по городу, не пролив ни единой капли. Если ты прольешь хоть каплю, будешь наказан смертью».", "story": "Отнеси этот кувшин с одного конца города на другой и не пролей ни капли. Если хоть одна капля упадёт на землю, поплатишься головой.", "problem": "нет «с одного конца города на другой»; «наказан смертью» вместо «поплатишься головой»"}, {"kind": "caption", "image": "Царь дал ему кувшин для этого задания и подчеркнул свой приказ.", "story": "Царь немного подумал, протянул ему кувшин, до краёв наполненный оливковым маслом", "problem": "пересказ, не точная фраза"}, {"kind": "speech", "image": "«Помни: исследуй каждый угол города, но не пролей ни единой капли масла. Одна капля, пролитая, равна смерти».", "story": "не пролей ни капли. Если хоть одна капля упадёт на землю, поплатишься головой.", "problem": "«исследуй каждый угол города» нет в рассказе"}, {"kind": "speech", "image": "«Ваше Величество, я обошел весь город, как Вы и приказали».", "story": "Государь, я выполнил ваш приказ в точности.", "problem": "«Ваше Величество» и «обошел весь город» вместо «Государь» и «выполнил ваш приказ»"}, {"kind": "speech", "image": "«Царь: Ты видел ли дворцовые ворота или кого-нибудь кроме стражи?»", "story": "А что ты видел по дороге?", "problem": "другой вопрос"}, {"kind": "speech", "image": "«Ваше Величество, пока я шел, я боялся пролить даже каплю масла. Я ничего не видел и никого не слышал, кроме того, что было в моих руках».", "story": "Государь, я так боялся пролить масло и лишиться жизни, что ни на миг не отводил глаз от кувшина. Поэтому я не видел ни людей, ни того, что происходило вокруг.", "problem": "нет «кувшина» и «лишиться жизни»; добавлено «не слышал»"}, {"kind": "caption", "image": "Царь был доволен и сказал, что он усвоил урок.", "story": "Запомни этот урок.", "problem": "пересказ"}, {"kind": "speech", "image": "«Где бы ты ни был, какую бы задачу тебе ни поручили, ты должен помнить, что Аллах наблюдает за тобой. Тогда ни при каких обстоятельствах ты не отклонишься от праведного пути».", "story": "Если к каждому делу и каждой обязанности будешь относиться с такой же сосредоточенностью, полностью отдаваясь своему делу и помня, что Аллах всегда видит тебя, ты не собьёшься с праведного пути.", "problem": "другие слова: «отклонишься» вместо «не собьёшься»; нет «сосредоточенностью»"}, {"kind": "moral", "image": "Мораль: Человек, который подходит ко всему, что делает, с полной сосредоточенностью и не забывает, что Аллах наблюдает за ним, никогда не собьется с праведного пути.", "story": "Мораль: Внимание к собственным поступкам и память об ответственности перед Аллахом помогают не сбиться с праведного пути.", "problem": "мораль пересказана; ближе к речи царя, чем к морали"}], "preview": "../../ru/wisdom-stories/illustrations/not-leaving-the-right-path.webp"}, {"stem": "turtles-wrong-calculation", "title": "Неверный расчет черепахи", "category": "Притчи и басни", "status": "Needs correction", "items": [{"kind": "title", "image": "Неверный расчет черепахи", "story": "Неверный расчет черепахи", "problem": ""}, {"kind": "speech", "image": "Сколько времени тебе понадобится, чтобы добраться до этой ближайшей деревни?", "story": "Сколько времени тебе понадобится, чтобы добраться до этой ближайшей деревни?", "problem": ""}, {"kind": "speech", "image": "С учетом дождя, грязи, ветра и подъемов и с ekmece, Beşiktaş, dams, and aqueducts."}, {"kind": "speech", "image": "Повелитель, я изучил высоты, источники и земли. Сколько это будет стоить? И когда будет готово?", "story": "Воду провести можно, но это обойдётся очень дорого: придётся выстроить в ряд мешки с золотом.", "problem": "Sinan asks the cost and the date. In the story he tells the sultan the cost will be a row of bags of gold."}, {"kind": "speech", "image": "Если Аллах позволит, будет сделано наилучшим образом.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Да даст Аллах успех. Это дело для людей и для будущих поколений.", "story": "Скажи лишь, что это возможно. Если понадобится, я поставлю мешки не в ряд, а бок о бок.", "problem": "Different reply; the sultan's line about placing bags of gold side by side is missing."}, {"kind": "caption", "image": "Синан построил фонтаны, провел воду в дома и сделал Стамбул городом с водой. Люди с радостью пили чистую воду, фонтанами был полон каждый уголок.", "story": "Синан взялся за дело и построил грандиозную систему водоснабжения, по которой вода поступала к сорока фонтанам на городских площадях. Чтобы она не расходовалась напрасно, на фонтанах установили краны.", "problem": "Says water was led into houses. The story says forty public fountains with taps, and private lines were forbidden except an oral permission for Sinan's house."}, {"kind": "caption", "image": "Прошло много лет. Народ благословлял Синана за его служение.", "story": "Шли годы. Умерли Сулейман и люди, помнившие заслуги зодчего.", "problem": "The people bless him. In the story Suleiman and those who remembered his service have died."}, {"kind": "speech", "image": "Благодаря трудам Синана вода дошла до каждого дома. Пусть Аллах будет доволен им в обоих мирах.", "story": "Султан объявил общественные фонтаны достоянием народа и запретил тайно проводить воду в частные дома.", "problem": "Contradicts the ban on private house connections."}, {"kind": "speech", "image": "Его дело будет помниться поколениями.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Но со временем люди забыли Синана. Новые архитекторы воздвигали другие здания. О Синане стали вспоминать лишь в редких беседах.", "story": "Шли годы. Умерли Сулейман и люди, помнившие заслуги зодчего. Однажды престарелого Синана вызвали во дворец: диван рассматривал жалобу на то, что в его дом вода поступает по отдельному водопроводу.", "problem": "Omits the divan complaint about the private water line."}, {"kind": "caption", "image": "Синан состарился и жил в скромном доме. — Мои трубы пересохли, а вода не доходит до моего дома, — сказал он своему соседу.", "story": "В конце жизни Синан тяжело заболел. Когда близкие захотели смочить ему губы, кран оказался сух.", "problem": "He tells a neighbor the pipes dried up. In the story he is gravely ill and the tap is dry when his family tries to moisten his lips."}, {"kind": "speech", "image": "К сожалению, Синан-эфенди, новые власти не заботятся о старых водопроводах.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Не виню их. Мир — как глаз человека: то видит, то забывает. Главное — служить людям.", "story": "Мы служили не ради выгоды, а ради довольства Всевышнего.", "problem": "Different speech."}, {"kind": "caption", "image": "Однажды соседи собрались и решили восстановить каналы Синана. — Имя Синана живо в наших сердцах, — сказали они. — Его труд — это вода, текущая в нашей жизни.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Вода Синана — это благословение для всех нас.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Синан умер в старом доме без воды.", "story": "Синан дал Стамбулу воду, но умер в доме без воды", "problem": "Adds «в старом доме»."}, {"kind": "speech", "image": "Я построил воду для тысяч, но не для своего дома. Пусть моя работа будет принята, а мои ошибки — прощены.", "story": "Мы служили не ради выгоды, а ради довольства Всевышнего. Награду за свой труд мы ожидаем в вечности и не скорбим о том, что в этом мире в нашем доме нет воды.", "problem": "Different dying words; he says he did not build water for his own house, which contradicts the oral permission in the story."}, {"kind": "moral", "image": "Не полагайся чрезмерно на славу и человеческую память.", "story": "Не полагайся чрезмерно на славу, мирские блага и человеческую память.", "problem": "Omits «мирские блага» and the second sentence of the moral."}], "preview": "../../ru/wisdom-stories/illustrations/architect-sinan-dies-in-a-house-without-water.webp"}, {"stem": "what-women-have-endured-in-this-world", "title": "Сколько же выстрадала женщина…", "category": "Любовь и брак", "status": "Needs correction", "items": [{"kind": "title", "image": "«Что же страдала женщина в этом мире»", "story": "Сколько же выстрадала женщина…", "problem": "Другой заголовок: «Что же страдала» вместо «Сколько же выстрадала»; фраза неверная."}, {"kind": "caption", "image": "В сказках всегда она ждет чуда, но чуда не происходит... Никто не знал её боли.", "story": "Даже в сказках её изображали либо ведьмой, либо мачехой…", "problem": "Нет ведьмы и мачехи; добавлено ожидание чуда."}, {"kind": "speech", "image": "Её труд невиден, её усталость не слышна.", "story": "Немногие знали твою ценность.", "problem": "Другие слова."}, {"kind": "other", "image": "МУКА", "story": "твои руки в муке", "problem": "Одно слово на мешке; фраза рассказа другая."}, {"kind": "speech", "image": "Её доброту принимают как должное.", "story": "Твою любовь порой принимали как должное.", "problem": "«доброту» вместо «любовь»."}, {"kind": "caption", "image": "Её молчание считают слабостью, её жертвы — естественными. Её сердце отдают другим.", "story": "Когда ты просила о своих правах, тебя считали злой, но когда ты молчала, ты была чистой.", "problem": "Другой смысл."}, {"kind": "other", "image": "Спасибо за твою любовь и заботу!", "story": "", "problem": " а, но отступают лицом к лицу.", "story": "Человека узнают не по его притворству, а по его поведению в момент испытания. Многие люди «ищут льва» издалека, но когда сталкиваются лицом к лицу, большинство из них отступают.", "problem": "Omits «не по его притворству» and that most people retreat when they meet the lion face to face."}], "preview": "../../ru/wisdom-stories/illustrations/lions-footprint.webp"}, {"stem": "word-and-silence", "title": "Слова и молчание", "category": "Слово, молчание и общение", "status": "Needs correction", "items": [{"kind": "title", "image": "«Слова и молчание»", "story": "Слова и молчание", "problem": ""}, {"kind": "other", "image": "Честный. Добрый. Злой. Тёплый. Грубый. Обидный.", "story": "", "problem": "Этих подписей в рассказе нет."}, {"kind": "other", "image": "Слово отражает личность.", "story": "слова — это не просто звуки, это зеркало намерения", "problem": "«Личность» вместо «зеркало намерения»."}, {"kind": "caption", "image": "Человек думает, прежде чем сказать, потому что слово — это отражение личности.", "story": "Иногда человек говорит больше, когда молчит. Потому что слова — это не просто звуки, это зеркало намерения.", "problem": "Другой смысл: «думает, прежде чем сказать» вместо молчания и зеркала намерения."}, {"kind": "caption", "image": "Если слово сказано в гневе, оно ранит, как стрела. Слова, сказанные с умом, исцеляют душу, как тёплое прикосновение.", "story": "Если слово разобьет сердце, если предложение погасит надежду — его не стоит произносить.", "problem": "Другие образы: стрела и исцеление вместо разбитого сердца и погасшей надежды."}, {"kind": "caption", "image": "Не каждое слово расцветает; некоторые ранят, как шипы.", "story": "Не каждое слово расцветает; некоторые ранят, как шипы.", "problem": ""}, {"kind": "other", "image": "Доброе слово — это богатство. Сказанное в гневе слово — рана на всю жизнь.", "story": "Если слово рождается из сердца, оно превращается в мудрость; если оно выходит из уст бездумно, о e": "Он спросил дрессировщика, почему слон просто не уходит, если верёвка такая тонкая.", "story": "Мужчина подходит к дрессировщику и спрашивает, почему эти великолепные животные покорно стоят на месте и не хотят убежать.", "problem": "Paraphrase."}, {"kind": "caption", "image": "Дрессировщик объяснил: когда слону был маленьким, его привязывали к этому колышку той же тонкой верёвкой, и он не мог вырваться.", "story": "Когда слоны малы, короткой верёвки достаточно, чтобы привязать их и удержать.", "problem": "Grammar: «когда слону был маленьким». The story says a short rope was enough to hold them when they were small."}, {"kind": "caption", "image": "Путешественник понял: слон верит, что не может уйти, хотя теперь верёвка уже не может его удержать.", "story": "Слоны могли освободиться в любую минуту, но оставались на месте, уверенные, что это невозможно.", "problem": "Paraphrase."}, {"kind": "thought", "image": "Я НЕ СПРАВЛЮСЬ", "story": "", "problem": "Not in the story."}, {"kind": "thought", "image": "Я НЕДОСТАТОЧНО ХОРОШ", "story": "", "problem": "Not in the story."}, {"kind": "thought", "image": "У МЕНЯ НЕ ПОЛУЧИТСЯ", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Наши прошлые неудачи рождают невидимую верёвку — мы не видим её, но она держит нас.", "story": "Часто нас связывает не верёвка, а недоверие, рождённое прошлыми неудачами.", "problem": "Paraphrase; an invisible rope instead of distrust born of past failures."}, {"kind": "moral", "image": "Часто нас связывает не верёвка, а недоверие, вызванное прошлыми неудачами.", "story": "Часто нас связывает не верёвка, а недоверие, рождённое прошлыми неудачами.", "problem": "«вызванное» instead of «рождённое». Omits that freedom is impossible without overcoming fear of what people will say."}], "preview": "../../ru/wisdom-stories/illustrations/elephant-and-the-rope.webp"}, {"stem": "can-a-broken-heart-love-again", "title": "Сможет ли разбитое сердце снова полюбить?", "category": "Любовь
