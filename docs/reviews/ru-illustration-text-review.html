om-stories/illustrations/gossip.webp"}, {"stem": "just-verdict-of-the-frankfurt-judge", "title": "Справедливый вердикт франкфуртского судьи", "category": "Справедливость и общество", "status": "Needs correction", "items": [{"kind": "title", "image": "«Справедливый вердикт франкфуртского судьи»", "story": "Справедливый вердикт франкфуртского судьи", "problem": ""}, {"kind": "caption", "image": "1506 год, Франкфурт; портной 800 золотых дал в долг плотнику; потом потребовал обратно.", "story": "Этот случай был зафиксирован в городе Франкфурте в 1506 году. Купец потерял в дороге сумку с 800 гульденами. Случайно проходивший мимо плотник нашел сумку.", "problem": "Plot differs: a tailor lending 800 gold coins, not a merchant losing a bag of 800 gulden that a carpenter found."}, {"kind": "speech", "image": "Клянётесь говорить правду; под страхом 100 гульденов штрафа.", "story": "После службы монах объявил прихожанам, что купец, приехавший во Франкфурт, потерял свои 800 гульденов, и пообещал награду в 100 гульденов тому, кто их найдет.", "problem": "Turns the 100-gulden reward into a fine for a false oath."}, {"kind": "speech", "image": "Верни деньги, или я отведу тебя в суд и заплачу за это 5 гульденов.", "story": "Он забрал сумку, но вместо обещанных ста гульденов предложил плотнику пять.", "problem": "The merchant offers five gulden instead of one hundred; the image has a threat to sue and pay five gulden."}, {"kind": "speech", "image": "Он клянётся; есть 900 гульденов; клянусь, вернул; обманул меня и скрыл их.", "story": "Когда тот напомнил об уговоре, купец заявил, что потерял девятьсот гульденов: значит, сотню нашедший уже присвоил.", "problem": "Wording differs and adds that the money was returned and hidden."}, {"kind": "speech", "image": "Клянётесь честью и совестью, что это 900 гульденов портного, и что вы взяли и спрятали их?", "story": "Судья просит купца поклясться, положив руку на Библию, что он потерял свои 900 гульденов. Судья также требует от плотника поклясться, что он нашел 800 гульденов.", "problem": "The oath is about a tailor's 900 gulden being taken and hidden, not about the merchant losing 900 and the carpenter finding 800."}, {"kind": "caption", "image": "Пусть решение будет мудрым.", "story": "", "problem": "This line is not in the story."}, {"kind": "speech", "image": "Он взял 800 гульденов, а вернул 900 гульденов. Значит, взял нарочно, чтобы их скрыть. Он виновен.", "story": "Плотник нашел 800 гульденов, а купец потерял 900 гульденов. Следовательно, деньги, которые нашел плотник, не принадлежат купцу.", "problem": "The image finds the carpenter guilty of hiding money; the judge rules the 800 gulden are not the merchant's and awards them to the carpenter."}, {"kind": "speech", "image": "Итак, он должен вернуть 800 гульденов портному. Портной получит свои 900 гульденов обратно. Так пусть и будет.", "story": "Поэтому, поскольку владелец не найден, эти 800 гульденов отдаются плотнику. Купец может продолжать поиски потерянных им 900 гульденов.", "problem": "Opposite verdict: the image orders 800 gulden returned to the tailor."}, {"kind": "moral", "image": "Жадность заманивает в ловушку. Справедливость на стороне праведника.", "story": "Жадность заманивает человека в ловушку. Скупой человек, отрицающий правду, в конце концов становится жертвой собственной лжи; справедливость на стороне праведника.", "problem": "Drops «человека» and the sentence about the miser becoming the victim of his own lie."}], "preview": "../../ru/wisdom-stories/illustrations/just-verdict-of-the-frankfurt-judge.webp"}, {"stem": "glass-of-milk", "title": "Стакан молока", "category": "Дружба и человеческие отношения", "status": "Needs correction", "items": [{"kind": "title", "image": "«Стакан молока»", "story": "Стакан молока", "problem": ""}, {"kind": "caption", "image": "В жаркий летний день бедный мальчик шёл от дома к дому и просил немного воды, чтобы утолить жажду и голод. Он был смелым и стучался в каждую дверь. В одном доме женщина дала ему стакан молока. Мальчик улыбнулся и искренне поблагодарил её.", "story": "Бедный мальчик, который ходил от двери к двери и продавал мелкие товары, чтобы оплачивать учёбу, однажды обнаружил, что у него совсем не осталось денег, а сам он очень голоден. Он решил постучать в следующую дверь и попросить еды.", "problem": "Retells a different opening: the boy asks for water to quench thirst, not food after selling goods."}, {"kind": "speech", "image": "Ты, наверное, очень голоден, но сначала выпей этот стакан молока. Оно придаст тебе сил.", "story": "Женщина заметила, что он голоден, и вместо воды принесла большой стакан молока.", "problem": "Woman’s words are not in the story."}, {"kind": "speech", "image": "Ваша доброта будет жить вечно.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Однажды, если у меня будет возможность, я отплачу вам всем сердцем.", "story": "— Благодарю вас от всего сердца.", "problem": "Boy promises future repayment; the story has only thanks."}, {"kind": "caption", "image": "Этот мальчик ушёл с полной благодарностью, унося её глубоко в сердце.", "story": "Отходя от дома, мальчик почувствовал прилив сил.", "problem": "Different closing of the childhood scene."}, {"kind": "caption", "image": "Годы шли. Мальчик рос и учился усердно, став добрым и трудолюбивым. Он посвятил себя помощи людям, никогда не забывая тот стакан молока и доброту той женщины, которая в жаркий день подарила ему жизнь.", "story": "Прошли годы. Однажды та женщина тяжело заболела.", "problem": "Omits Dr. Howard Kelly and invents a life of helping people."}, {"kind": "caption", "image": "Однажды эта женщина, уже постаревшая и больная, попала в ту самую больницу, где теперь работал он. Когда он увидел её, то глубоко растрогался и не раздумывая решил сам позаботиться о ней.", "story": "Увидев женщину, доктор тотчас узнал её: много лет назад именно она дала ему стакан молока и вновь зажгла в его душе свет надежды.", "problem": "Does not say he recognized her as the woman who gave him milk."}, {"kind": "caption", "image": "Каждый день он проверял её здоровье, ухаживал за ней и делал всё возможное, чтобы она скорее поправилась. Он относился к ней с уважением и добротой, не говоря ни слова о том, кто она для него. Она никогда не знала, что именно он изменил её жизнь много лет назад.", "story": "Доктор Келли лично взял лечение женщины под контроль и решил сделать всё возможное для её спасения.", "problem": "Says she never knew who he was; the story has him mark the bill so she understands."}, {"kind": "caption", "image": "После выздоровления женщина собралась уехать и попросила счёт за лечение, чтобы отблагодарить его. Он улыбнулся и передал ей письмо. В письме было написано, что всё, что с ней произошло, — это плата за тот стакан молока и доброту, которые она когда-то подарила ему.", "story": "Когда пришло время выписки, доктор Келли попросил принести ему счёт за лечение. Он написал несколько слов на полях и распорядился передать документ пациентке.", "problem": "A letter replaces the annotated bill, and she asks for the bill to thank him."}, {"kind": "caption", "image": "Полностью оплачено одним стаканом молока.", "story": "«Полностью оплачено одним стаканом молока».", "problem": ""}, {"kind": "caption", "image": "Подпись: доктор Говард Келли", "story": "Подпись: доктор Говард Келли.", "problem": ""}, {"kind": "moral", "image": "Мораль: Бескорыстное добро не исчезает. Оно записывается на невидимом счёте и однажды возвращается — порой тогда, когда мы меньше всего этого ожидаем.", "story": "Мораль: Бескорыстное добро не исчезает. Оно записывается на невидимом счёте и однажды возвращается — порой тогда, когда мы меньше всего этого ожидаем.", "problem": ""}], "preview": "../../ru/wisdom-stories/illustrations/glass-of-milk.webp"}, {"stem": "aging", "title": "Старость", "category": "Старение и время", "status": "Needs correction", "items": [{"kind": "title", "image": "Старение", "story": "Старость", "problem": "Title word differs: «Старение» instead of «Старость»."}, {"kind": "caption", "image": "Старение похоже на восхождение в гору...", "story": "Старение похоже на восхождение в гору: чем выше поднимаешься, тем сильнее усталость и тяжелее дыхание, зато шире становится взгляд на мир.", "problem": "Stops after the comparison and omits the fatigue, heavier breathing, and wider view in this caption."}, {"kind": "caption", "image": "...чем выше поднимаешься, тем шире взгляд на мир.", "story": "чем выше поднимаешься, тем сильнее усталость и тяжелее дыхание, зато шире становится взгляд на мир.", "problem": "Omits «тем сильнее усталость и тяжелее дыхание, зато»."}, {"kind": "moral", "image": "Возраст — это не только убывание сил, но и мудрость видеть более широкую картину.", "story": "С возрастом силы убывают, зато опыт и мудрость помогают шире смотреть на жизнь.", "problem": "Wording differs; omits experience."}], "preview": "../../ru/wisdom-stories/illustrations/aging.webp"}, {"stem": "builder-of-the-nest", "title": "Строительница гнезда", "category": "Семья и воспитание", "status": "Needs correction", "items": [{"kind": "title", "image": "Строительница гнезда", "story": "Строительница гнезда", "problem": ""}, {"kind": "caption", "image": "Самка птицы строит гнездо.", "story": "Самка птицы строит гнездо.", "problem": ""}, {"kind": "caption", "image": "Женщина строит дом и обеспечивает семью.", "story": "Женщина создаёт семейный очаг и заботится о благополучии семьи.", "problem": "Другие слова: дом и обеспечивает вместо семейного очага и заботы."}, {"kind": "moral", "image": "Именно женщина строит гнездо и обеспечивает существование семьи.", "story": "Женщина создаёт семейный очаг и заботится о благополучии семьи. Важно замечать её труд и ценить его.", "problem": "Другая формулировка; нет фразы о том, что труд нужно замечать и ценить."}], "preview": "../../ru/wisdom-stories/illustrations/builder-of-the-nest.webp"}, {"stem": "your-friends", "title": "Твои друзья", "category": "Дружба и человеческие отношения", "status": "Needs correction", "items": [{"kind": "title", "image": "Твои друзья", "story": "Твои друзья", "problem": ""}, {"kind": "caption", "image": "Однажды молодой человек готовился к важному экзамену. Чтобы купить учебники, он решил продать свою любимую игрушку. Отец одобрил его решение и сказал: «Сынок, настоящие друзья те, кто остаются с тобой не ради выгоды, а от чистого сердца».", "story": "Готовясь к свадьбе, юноша попросил отца: «Папа, я совсем не успеваю. Позвони, пожалуйста, моим друзьям по этому списку и пригласи их».", "problem": "Exam and a toy replace the wedding and the father’s phone calls."}, {"kind": "caption", "image": "В день экзамена юноша увидел, что почти никто из тех, кого он считал друзьями, не пришёл. «Похоже, многие рядом только в своё время», — подумал он, но не расстроился, решив положиться на себя.", "story": "В день свадьбы юноша сердито подходит к отцу: «Папа, я просил тебя позвонить всем моим друзьям!»", "problem": "Exam day and self-reliance replace the wedding complaint."}, {"kind": "speech", "image": "Мой сын, — сказал отец, — 50 друзей рядом в праздник — это легко, но лишь 15 останутся, когда тебе трудно. Цени тех, кто поддерживает и помогает тебе стать лучше.", "story": "— У меня в списке было пятьдесят человек, но я вижу здесь только пятнадцать, — сказал юноша, снова выражая своё беспокойство.", "problem": "The father, not the son, speaks the 50 and 15 line, and adds advice that is not in the story."}, {"kind": "speech", "image": "Сынок, пусть сегодня тебя поддерживают лишь 2–3 человека, но если они рядом в трудную минуту, считай себя богатым человеком. Запомни: настоящие друзья не рядом всегда, но они рядом навсегда!", "story": "Не волнуйся, сынок. Твои настоящие друзья сегодня с тобой!", "problem": "Changes fifteen friends to two or three and adds a different proverb."}, {"kind": "moral", "image": "Настоящий друг рядом, когда ты в беде. Ценны не многочисленные знакомства, а те, кто выдерживает время.", "story": "Мораль: Настоящий друг — это тот, кто рядом, когда ты в беде. Ценны не многочисленные знакомства, а те немногие друзья, которые выдерживают испытание временем.", "problem": "Drops «это тот, кто», «немногие друзья» and «испытание»."}], "preview": "../../ru/wisdom-stories/illustrations/your-friends.webp"}, {"stem": "those-you-should-not-befriend", "title": "Те, с кем не стоит дружить:", "category": "Дружба и человеческие отношения", "status": "Needs correction", "items": [{"kind": "title", "image": "«Те, с кем не стоит дружить»", "story": "Те, с кем не стоит дружить:", "problem": ""}, {"kind": "speech", "image": "Не дружи с высокомерным! Ты не знаешь, может быть, он завтра обесценит тебя; пожалеешь.", "story": "Не дружи с высокомерным: он не считается с чужими чувствами и легко обидит.", "problem": "Different warning: he may devalue you tomorrow."}, {"kind": "speech", "image": "Не дружи с самодовольным! Он много говорит, но мало делает; похваляется, но пуст внутри.", "story": "Остерегайся того, кто считает себя умнее всех: слов у него много, а слушать других он не умеет.", "problem": "Self-satisfied and empty replaces someone who thinks he is smarter and will not listen."}, {"kind": "speech", "image": "Не дружи с трусливым! Он не защитит, не поможет, не разделит с тобой трудности; пожалеешь.", "story": "Не полагайся на труса: в трудную минуту ему может не хватить смелости поддержать друга.", "problem": "Different wording and a stronger claim that he will not help."}, {"kind": "moral", "image": "От дружбы с высокомерным, самодовольным и трусливым останется только сожаление. Выбирайте друга по сердцу.", "story": "Мораль: От дружбы с высокомерным, самодовольным и трусливым человеком останется только сожаление. Выбирайте друга по зову сердца.", "problem": "Drops «человеком» and «зову»."}], "preview": "../../ru/wisdom-stories/illustrations/those-you-should-not-befriend.webp"}, {"stem": "shepherd-must-be-called", "title": "Тебе нужно позвать пастуха.", "category": "Слово, молчание и общение", "status": "Needs correction", "items": [{"kind": "title", "image": "Нужно позвать пастуха", "story": "Тебе нужно позвать пастуха.", "problem": "Пропущено «Тебе»."}, {"kind": "caption", "image": "Однажды молодой человек рассказал мудрецу о своей проблеме и спросил у него совет.", "story": "Студент, желающий завершить свое образование после многих лет, обращается к своему учителю за благословением.", "problem": "Студент и благословение заменены молодым человеком и советом."}, {"kind": "speech", "image": "— Есть одна проблема. Я обошёл все округи, но не смог увидеть то, что искал. Мне кажется, они спрятаны так хкрошо, что я уже и сомневаюсь, что вообще найду. Не подскажете ли вы, что делать?", "story": "Сын мой, представь, что ты идешь в свою деревню, и по дороге на тебя нападает стая бешеных собак", "problem": "Орфография «хкрошо»; сюжет про поиски, а не про бешеных собак."}, {"kind": "speech", "image": "— Сходи, позови пастуха.", "story": "ты должен позвать пастуха и попросить его остановить собак", "problem": "Нет просьбы остановить собак."}, {"kind": "speech", "image": "— Хорошо, но скажи, где мне его искать? Далеко ли он отсюда? В какую сторону мне идти? Сколько у него овец? Как мне с ним связаться?", "story": "", "problem": "Этих вопросов в рассказе нет."}, {"kind": "speech", "image": "— Во многих местах спрашивал — никто точно не знает, где он, когда он придёт и придёт ли вообще.", "story": "", "problem": "Этой реплики в рассказе нет."}, {"kind": "speech", "image": "— Тогда иди к нему, сядь где-нибудь поближе и внимательно наблюдай. Со временем увидишь. Через него и найдёшь то, что ищешь.", "story": "Собаки застынут на месте, как только услышат голос пастуха.", "problem": "Совет наблюдать вместо того, чтобы позвать пастуха остановить собак."}, {"kind": "speech", "image": "— А вдруг я не смогу его найти?", "story": "", "problem": "Этой реплики в рассказе нет."}, {"kind": "speech", "image": "— Если не ты, то другой человек найдёт его обязательно. Всё в своё время. Тебе нужно лишь терпение.", "story": "", "problem": "Этой реплики в рассказе нет."}, {"kind": "speech", "image": "— Хорошо, но что мне делать, пока я жду пастуха? Как мне решать свою проблему и найти то, что потерял или что ищу? Я не умею так долго ждать и не могу просто сидеть сложа руки.", "story": "— Я наклонюсь, подниму несколько камней с земли и брошу их в собак, и я прогоню их.", "problem": "Вместо камней и бегства — ожидание пастуха и поиски."}, {"kind": "moral", "image": "Не каждую проблему решают силой. Иногда самый короткий путь — шаг назад и новый взгляд.", "story": "Не каждую проблему можно решить силой. Иногда самый короткий путь — сделать шаг назад и взглянуть на ситуацию по-другому.", "problem": "«решают» вместо «можно решить»; «новый взгляд» вместо «взглянуть на ситуацию по-другому»."}], "preview": "../../ru/wisdom-stories/illustrations/shepherd-must-be-called.webp"}, {"stem": "for-those-who-have-reached-sixty", "title": "Тем, кому исполнилось шестьдесят…", "category": "Старение и время", "status": "Needs correction", "items": [{"kind": "title", "image": "Тем, кому исполнилось шестьдесят...", "story": "Тем, кому исполнилось шестьдесят…", "problem": ""}, {"kind": "caption", "image": "Наслаждайтесь своими накоплениями. Путешествуйте, дарите себе маленькие радости. Вы заслужили это.", "story": "Пришла пора воспользоваться сбережениями, которые вы накопили. Позвольте себе радоваться жизни. Не стоит во всём себе отказывать ради тех, кто не понимает, каких трудов стоили вам эти деньги. Теперь можно пожить спокойно.", "problem": "Paraphrase; omits not denying yourself for people who do not understand what the money cost."}, {"kind": "other", "image": "ЗДОРОВОЕ СЕРДЦЕ", "story": "", "problem": "Poster label is not in the story."}, {"kind": "caption", "image": "Берегите здоровье каждый день: сбалансированное питание, ежедневная прогулка, регулярные осмотры.", "story": "Теперь ведите здоровый образ жизни без чрезмерных физических нагрузок. Умеренно занимайтесь спортом, гуляйте каждый день, хорошо питайтесь и хорошо высыпайтесь.", "problem": "Paraphrase; omits avoiding excessive exertion and sleeping well, and adds checkups here rather than in the next story paragraph."}, {"kind": "caption", "image": "Любите то, что приносит радость. Читайте, осваивайте новое, оставайтесь на связи с технологиями, но не сравнивайте свою жизнь с жизнью других. Качество важнее количества.", "story": "В любом возрасте живите с любовью: к спутнику жизни, семье и самому миру.", "problem": "Meaning differs. The story says live with love for one's partner, family, and the world, and separately says keep up with books, newspapers, news, and the internet."}, {"kind": "speech", "image": "Мы разберёмся...", "story": "", "problem": "This line is not in the story."}, {"kind": "caption", "image": "Позвольте детям идти своим путём. Каждое «мы разберёмся...» — это проявление доверия. Дайте им свободу и уважайте их выбор. Мудрость — в умении отпускать.", "story": "Уважайте молодых и их взгляды. Они не обязаны во всём соглашаться с вами: им самим предстоит строить своё будущее. Вместо упрёков делитесь опытом и показывайте, чем мудрость прошлого может быть полезна сегодня.", "problem": "Wording differs; the story also says not to worry about children's and grandchildren's finances because earning is now their duty."}, {"kind": "speech", "image": "Мы благодарны за каждый прожитый день!", "story": "", "problem": "This line is not in the story."}, {"kind": "caption", "image": "Будьте благодарны за малое, цените каждый день. Музыка, природа, старые друзья, смех... Благодарное сердце делает обычный день особенным. Сегодня — хороший день, чтобы быть счастливым.", "story": "Смейтесь, будьте счастливы. Наслаждайтесь мирной жизнью в этом возрасте... Будьте счастливы!", "problem": "Paraphrase with extra details not in the story."}, {"kind": "moral", "image": "Осенью вашей жизни дайте себе право жить.", "story": "Осень жизни — тоже время для радости. Позвольте себе жить, а не только жертвовать собой ради других. Счастливому человеку легче делиться счастьем.", "problem": "Shortened and reworded; omits joy, not only sacrificing for others, and sharing happiness."}], "preview": "../../ru/wisdom-stories/illustrations/for-those-who-have-reached-sixty.webp"}, {"stem": "i-am-aware-now", "title": "Теперь я понимаю", "category": "Нравственность и характер", "status": "Needs correction", "items": [{"kind": "title", "image": "Теперь я осознаю...", "story": "Теперь я понимаю", "problem": "«осознаю» вместо «понимаю»."}, {"kind": "caption", "image": "Раньше я очень старалась нравиться всем; я думала, что это важно.", "story": "Я больше не пытаюсь заставить кого-либо полюбить меня.", "problem": "Другое время и другие слова."}, {"kind": "caption", "image": "Я угождала, оправдывалась, подстраивалась под других — и при этом теряла себя.", "story": "Теперь я знаю себе цену и понимаю, что мне не нужно никому ничего доказывать.", "problem": "Другой смысл."}, {"kind": "other", "image": "УГОДИ", "story": "", "problem": "Этой подписи в рассказе нет."}, {"kind": "other", "image": "ОПРАВДАЙСЯ", "story": "", "problem": "Этой подписи в рассказе нет."}, {"kind": "other", "image": "ПОДСТРОЙСЯ", "story": "", "problem": "Этой подписи в рассказе нет."}, {"kind": "other", "image": "СОГЛАСИСЬ", "story": "", "problem": "Этой подписи в рассказе нет."}, {"kind": "caption", "image": "Я не знала, как устанавливать границы; из-за этого уважала желания других, а не свои.", "story": "Я не хочу оставлять рядом с собой тех, кто лжёт, даёт пустые обещания и не держит слова.", "problem": "Другой смысл."}, {"kind": "other", "image": "УВАЖАЙ СЕБЯ", "story": "", "problem": "Этой подписи в рассказе нет."}, {"kind": "caption", "image": "Потом я поняла: «моя ценность не зависит от чужого мнения», и выбрала окружение осознанно.", "story": "Теперь я знаю себе цену и понимаю, что мне не нужно никому ничего доказывать.", "problem": "Добавлено «не за е совещание. Срочный отчёт. Отправлю комментарии позже. Очень занят. Нет времени. Поговорим позже.", "story": "", "problem": "Этого перечня отговорок в рассказе нет."}, {"kind": "caption", "image": "Команда обращается снова. Спонсор продолжает молчать.", "story": "Ни у кого не было чёткой информации.", "problem": "Другая формулировка молчания."}, {"kind": "speech", "image": "Может, он увидел. Может, одобрит... Может, сейчас неудобно...", "story": "", "problem": "Этих догадок в рассказе нет."}, {"kind": "other", "image": "УТВЕРЖДЕНИЕ СПОНСОРА", "story": "", "problem": "Этой надписи в рассказе нет."}, {"kind": "caption", "image": "Команда спрашивает:", "story": "", "problem": ""}, {"kind": "speech", "image": "Может, он не знает? Может, забыл? Может, потерялся?", "story": "«Да, документы пришли. Но мы их не приняли. Потому что форма заявки была неправильно заполнена, и не была соблюдена официальная процедура».", "problem": "Правда про неправильную форму заявки заменена догадками."}, {"kind": "caption", "image": "Команда возвращается к работе, теряет мотивацию и время. Лучшие идеи не реализуются — из-за отсутствия обратной связи.", "story": "Мы потратили время, силы и потеряли доверие — всё потому, что между нами царила тишина.", "problem": "Нет потери доверия; добавлены мотивация и нереализованные идеи."}, {"kind": "other", "image": "СТАТУС ПРОЕКТА. Активность. Вовлечённость. Ожидание. Молчание. Риск — Высокий.", "story": "", "problem": "Этого списка в рассказе нет."}, {"kind": "moral", "image": "Когда общение нечёткое, даже лучшая работа остаётся незамеченной. Враг сотрудничества — молчание.", "story": "Когда общение нечёткое, даже самая лучшая работа может остаться незамеченной. Когда нет последовательного контроля, даже самое крепкое партнёрство может пошатнуться. В сотрудничестве самым большим врагом часто является не неудача, а молчание.", "problem": "Пропущена фраза про контроль и партнёрство; «остаётся» вместо «может остаться»; «Враг сотрудничества — молчание» короче рассказа."}], "preview": "../../ru/wisdom-stories/illustrations/silent-corridor.webp"}, {"stem": "dead-remain-in-life", "title": "Тот, кто остался", "category": "Мудрость и уроки жизни", "status": "Needs correction", "items": [{"kind": "title", "image": "Мертвые — это выжившие", "story": "Тот, кто остался", "problem": "Different title."}, {"kind": "caption", "image": "Два любящих сердца когда-то были вместе...", "story": "Когда умирает один из двух любящих людей, тому, кто остался, кажется, будто жизнь оборвалась и для него.", "problem": "Says the hearts were once together; story is that life seems cut off for the one who remains."}, {"kind": "caption", "image": "...один ушел, но остался жить в сердце.", "story": "Когда умирает один из двух любящих людей, тому, кто остался, кажется, будто жизнь оборвалась и для него.", "problem": "Says the dead one lives on in the heart; story says life seems over for the survivor."}, {"kind": "moral", "image": "Любовь становится еще глубже в разлуке.", "story": "Разлука заставляет ещё острее ощутить силу любви.", "problem": "«еще глубже» instead of feeling the power of love more sharply; «тоска» is missing. «еще» lacks ё."}], "preview": "../../ru/wisdom-stories/illustrations/dead-remain-in-life.webp"}, {"stem": "three-essential-things-for-a-city", "title": "Три важных вещи для города", "category": "История и известные личности", "status": "Needs correction", "items": [{"kind": "title", "image": "Три важных вещи для города", "story": "Три важных вещи для города", "problem": ""}, {"kind": "caption", "image": "Для города есть три важных вещи: канализация, баня и библиотека.", "story": "Городу нужны три вещи: канализация, баня и библиотека.", "problem": "«Для города есть три важных вещи» instead of «Городу нужны три вещи»."}, {"kind": "caption", "image": "Очищайте в городе тело в банях, душу — в библиотеке, а сам город — в канализации.", "story": "Первая очищает улицы, вторая — тело, третья — душу.", "problem": "Imperative paraph ие!", "story": "— Разве ты ещё не понял? Аллах делает визиря слугой, а слугу визирем в одно мгновение!", "problem": "«Не знаете?» instead of «Разве ты ещё не понял?»."}, {"kind": "moral", "image": "Мораль: Визирь сегодня может стать слугой завтра, поэтому никто не должен быть самоуверенным на своём месте!", "story": "Мораль: Визирь сегодня может стать слугой завтра, поэтому никто не должен быть самоуверенным на своём месте!", "problem": ""}], "preview": "../../ru/wisdom-stories/illustrations/three-questions.webp"}, {"stem": "three-best-things", "title": "Три самых важных вещи", "category": "Нравственность и характер", "status": "Needs correction", "items": [{"kind": "title", "image": "Три самых важных вещи", "story": "Три самых важных вещи", "problem": ""}, {"kind": "speech", "image": "Сынок, в жизни есть три вещи, о которых стоит помнить: лучшая пища — в голоде, лучший сон — после труда, лучший дом — в сердцах.", "story": "— Сын, мы должны стремиться к этим трем вещам в жизни: есть самую лучшую пищу, спать в самой лучшей постели и жить в самом лучшем доме.", "problem": "На рисунке сразу даны ответы; в рассказе отец сначала говорит о лучшей пище, постели и доме."}, {"kind": "speech", "image": "Папа, а что это значит? Можете объяснить?", "story": "— Отец, но мы бедны, как же нам это сделать?", "problem": "Сын спрашивает не о бедности, а о смысле."}, {"kind": "speech", "image": "Лучшая пища — в голоде, потому что когда ты голоден, любая еда кажется вкуснее. Лучший сон — после труда, потому что уставший человек спит крепче.", "story": "— Если ты будешь есть, когда голоден, это будет твоя лучшая пища. Если ты будешь спать уставшим после тяжелой работы, это будет твой лучший сон.", "problem": "«любая еда кажется вкуснее» и «спит крепче» — другие слова."}, {"kind": "speech", "image": "Лучший дом — в сердцах, потому что дом — это не стены, а люди, которые ждут тебя.", "story": "Если ты будешь давать людям место в своем сердце, это будет твой лучший дом.", "problem": "«люди, которые ждут тебя» вместо «давать людям место в своем сердце»."}, {"kind": "moral", "image": "Лучшая пища — в голоде, лучший сон — после труда, лучший дом — в сердцах.", "story": "Голод делает вкуснее простую еду, труд — крепче сон, а любовь — уютнее дом.", "problem": "Другая формулировка морали."}], "preview": "../../ru/wisdom-stories/illustrations/three-best-things.webp"}, {"stem": "three-statues", "title": "Три статуи", "category": "Мудрость и уроки жизни", "status": "Needs correction", "items": [{"kind": "title", "image": "«Три статуи»", "story": "Три статуи", "problem": ""}, {"kind": "caption", "image": "Два царя однажды поспорили, чей министр — самый верный и преданный.", "story": "Между правителями двух соседних стран существовала крепкая дружба.", "problem": "Argument about ministers; story is a friendship and a birthday gift."}, {"kind": "caption", "image": "В день рождения оба царя приказали выковать три золотые статуи. Скульптор мастерски выполнил их. Однако цари не знали, какую статую кому подарить. Они позвали мудреца и спросили его совета.", "story": "Однажды один из правителей решил отправить другому подарок на день рождения.", "problem": "Both kings order the statues and do not know which to give; story difference is known to one ruler and the sculptor."}, {"kind": "caption", "image": "Мудрец внимательно выслушал обоих царей и их министров, не произнеся ни слова. Затем попросил показать ему статуи.", "story": "Этот человек внимательно осматривает статуи и просит тонкую проволоку.", "problem": "He asks to see the statues instead of asking for a wire."}, {"kind": "caption", "image": "Долго рассматривая статуи со всех сторон, мудрец достал особый инструмент и сделал на каждой из них по два отверстия: «Уши служат для слышания, а рот — для речи».", "story": "Он вставляет проволоку в ухо первой статуи — проволока выходит из другого уха.", "problem": "He makes holes. Story uses a wire through openings already there."}, {"kind": "caption", "image": "На пер е говори ерунду!»", "story": "«Не говори глупостей!»", "problem": "«ерунду» вместо «глупостей»."}, {"kind": "caption", "image": "Эта фраза заставляет человека чувствовать, что его мысли и чувства неважны и глупы. Она подавляет его уверенность в себе и может ранить его. Вместо этого лучше выслушайте его и постарайтесь понять, что он имеет в виду.", "story": "Такие слова обесценивают мысли и чувства близкого человека. Лучше сказать мягче: «Я вижу это иначе» или «В этом вопросе я с тобой не совсем согласен».", "problem": "Нет предложенных мягких фраз рассказа."}, {"kind": "speech", "image": "«Ты всегда ошибаешься!»", "story": "«Не преувеличивай!»", "problem": "Другая запретная фраза."}, {"kind": "caption", "image": "Эта фраза заставляет человека чувствовать себя неудачником. Она разрушает его самооценку и уверенность в себе. Вместо этого скажите: «У тебя есть право на ошибку, давай вместе подумаем, как можно исправить ситуацию».", "story": "Услышав это, близкий человек может решить, что его переживания для вас не важны. Попробуйте спросить: «Объясни, пожалуйста, что тебя тревожит и что ты сейчас чувствуешь».", "problem": "И фраза, и замена другие."}, {"kind": "speech", "image": "«Посмотри на него (на неё)! Почему ты не можешь быть таким же?»", "story": "«Посмотри, как другие мужья и жёны заботятся о семье! А ты?»", "problem": "Другое сравнение."}, {"kind": "caption", "image": "Эта фраза вызывает чувство неполноценности, потому что человека сравнивают с кем-то другим. У каждого есть свои сильные стороны и путь. Вместо этого оцените его уникальность и поддержите его усилия и достижения.", "story": "Сравнения с чужими супругами ранят и подрывают доверие. Близкий человек может почувствовать, что его не любят и не ценят. Вместо сравнений спокойно и ясно скажите, чего вам не хватает.", "problem": "Другая замена совета."}, {"kind": "speech", "image": "«Ты меня не слушаешь!»", "story": "«Ты не понимаешь!»", "problem": "Другая фраза."}, {"kind": "caption", "image": "Эта фраза заставляет человека защищаться и закрываться. Вместо того чтобы обвинять, постарайтесь спокойно объяснить свои чувства и мысли и попросите его выслушать вас и тоже поделиться своим мнением.", "story": "Если сейчас вы не готовы обсуждать вопрос, лучше сказать: «Давай пока поговорим о другом, я ещё не готов это обсуждать».", "problem": "Нет предложенной фразы рассказа."}, {"kind": "speech", "image": "«Я сделал(а) для тебя столько, а ты...»", "story": "«Не ходи туда, не разговаривай с ней, не делай этого, не носи это, не говори так, принеси это, возьми это!»", "problem": "Другая пятая фраза; в рассказе ряд приказов."}, {"kind": "caption", "image": "Эта фраза напоминает о прошлом и вызывает чувство долга. Она портит отношения и создаёт давление. Вместо этого выражайте свою любовь и поддержку без ожиданий и напоминаний.", "story": "Супруг — не подчинённый. Обсуждайте желания и разногласия уважительно. Вместо приказов обращайтесь с просьбами, не забывая простого слова «пожалуйста».", "problem": "Нет «пожалуйста» и просьб вместо приказов."}, {"kind": "moral", "image": "Слова могут ранить человека, которого мы любим больше всего.", "story": "Слова могут ранить человека, которого мы любим больше всего.", "problem": ""}], "preview": "../../ru/wisdom-stories/illustrations/expressions-you-should-stay-away-from.webp"}, {"stem": "lawful-morsel", "title": "Халяльная пища", "category": "Вера и духовность", "status": "Needs correction", "items": [{"kind": "title", "image": "«Халяльная пища»", "story": "Халяльная пища", "problem": ""}, {"kind": "speech", "image": "Свежая мука и чистая вода не могут сделать хороший хлеб из испорченной закваски.", "story": "Даже если мука свежая, а вода чистая, из испорченной закваски хорошего теста не получится; из такого теста не выйдет и доброго хлеба.", "problem": "Skips the dough and changes the wording."}, {"kind": "caption", "image": "Имам аль-Газали.", "story": "Имам аль-Газали", "problem": ""}, {"kind": "speech", "image": "Ребёнок должен питать ассказал жене эту историю.", "problem": ""}, {"kind": "speech", "image": "Может, это испытание, а может, наша удача.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Если это наше пропитание, давай оставим.", "story": "Добавь ещё немного сверху, пойдём в кино", "problem": "Wife's line is different; story is about going to the cinema."}, {"kind": "speech", "image": "", "story": "", "problem": "A lower bubble in panel 2 is too small to read. Sure words: none."}, {"kind": "speech", "image": "Я решил промолчать. Если найду владельца и верну, он может заподозрить меня или отказаться, а если нет найду, не знаю, что с ним случится. Это грех, но я подумал: «Лучше потратить на что-то полезное». И это успокоило мою совесть.", "story": "", "problem": "This monologue is not in the story. Reading of the long bubble is only partly sure."}, {"kind": "caption", "image": "На следующий день они пошли к родителям жены в гости. Они рассказали всё как есть, и те тоже сказали: «Оставьте это, должно быть, ваша удача».", "story": "Наступила суббота. Мы уже выходили из дома, когда на пороге появились тесть с тёщей.", "problem": "In-laws visit and bless the money; story has them appear as the couple is leaving for the cinema."}, {"kind": "caption", "image": "Они подумали: такси закажем, билеты в кино купим, с родителями отдохнём, поужинаем в ресторане, немного из вещей приобретём, вокруг посмотрим. В тот вечер они веселились, наслаждались временем и старались получить как можно больше удовольствия.", "story": "Тёща не любила общественный транспорт, поэтому пришлось вызвать такси.", "problem": "Adds a restaurant and shopping; the cinema is only part of a different evening."}, {"kind": "other", "image": "ТАКСИ", "story": "пришлось вызвать такси", "problem": ""}, {"kind": "other", "image": "БИЛЕТ В КИНО 1 ШТ.", "story": "", "problem": "Ticket stub wording is not a story sentence."}, {"kind": "other", "image": "ПОПКОРН", "story": "всем по коробке попкорна", "problem": ""}, {"kind": "caption", "image": "Но недолго музыка играла. Через несколько дней он сильно упал с лестницы. Рука сломалась, начались проблемы с работой. Расходы росли, доходы уменьшались. А счастье ушло от него.", "story": "К приезду полиции у меня был сломан нос, у него — рука.", "problem": "Fall down stairs instead of a fight; his arm breaks, not his nose and the father-in-law's arm."}, {"kind": "other", "image": "РЕГИСТРАТУРА", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "МЕДИЦИНСКОЕ ЗАКЛЮЧЕНИЕ", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "На вопросы друга по пути домой он признался: «Брат, это были харамные деньги. С тех пор как мы их потратили, в нашу жизнь не пришло ни блага».", "story": "Брат, если себя не жалко, пожалей хотя бы того, кто их найдёт!", "problem": "Different confession; the doner-change scene is missing."}, {"kind": "speech", "image": "Дружище, никому не советую даже думать о таком. Харамный кусок не приносит пользы в этом мире и в Последней жизни.", "story": "Нечестно полученные деньги не идут впрок.", "problem": "Extra speech, including the hereafter, which is not in the story."}, {"kind": "moral", "image": "Деньги, заработанные нечестно, не приносят пользы.", "story": "Нечестно полученные деньги не идут впрок. Присвоив чужое, можно потерять гораздо больше, чем приобрести.", "problem": "«заработанные» instead of found/taken money; second sentence missing."}], "preview": "../../ru/wisdom-stories/illustrations/forbidden-money.webp"}, {"stem": "mother-of-pearl-flower", "title": "Цветок перламутра", "category": "Любовь и брак", "status": "Needs correction", "items": [{"kind": "title", "image": "«Цветок перламутра»", "story": "Цветок перламутра", "problem": ""}, {"kind": "speech", "image": "Мы прожили вместе столько лет. Но он всегда ругал меня из-за одного цветка перламутра в горшке.", "story": "Пятьдесят лет прожила с ним, а он меня совсем извёл…", "problem": "Нет «пятьдесят лет»; причина — что он ругал из-за цветка."}, {"kind": "speech", "image": "Посмотри, сколько хлопот, никакой от него пользы!", "story": "", "problem": "Этой реплики мужа в рассказе нет."}, {"kind": "speech", "image": "Этот человек даже слова доброго не сказал. Хочу подать на развод.", "story": "Скажите, тётя, почему вы хотите развода?", "problem": "Она сама объявляет развод; нет вопроса судьи «тётя»."}, {"kind": "speech", "image": "Один цветок перламутра стал причиной всей моей боли... Он ни разу не позаботился о нём, лишь упрекал и говорил, что это бесполезная трата сил.", "story": "Пятьдесят лет этот человек ни разу не вставал ночью и не говорил: «Давай я полью этот цветок».", "problem": "Он упрекал цветок; в рассказе он будил её поливать и сливал лишнюю воду."}, {"kind": "caption", "image": "Но по ночам, когда я спала, он тихонько вставал. С любовью поливал цветок перламутра, чистил его листья и разговаривал с ним, как с живым.", "story": "Каждую ночь я будил её и смотрел, как она поливает любимый цветок. ... я вставал и сливал лишнюю воду.", "problem": "На картинке муж сам поливает, пока она спит; в рассказе поливает жена, а он сливает лишнюю воду."}, {"kind": "speech", "image": "Я была ослеплена обидой и гордыней, не видела его любви. Не знала, что за молчанием скрывается такая забота и преданность.", "story": "Уверяю вас, я могу жить лучше без него.", "problem": "Она признаёт его любовь; в суде она говорит, что может жить лучше без него."}, {"kind": "speech", "image": "Вы действительно хотите развода?", "story": "Вам есть что сказать, дед?", "problem": "Судья спрашивает её, а не деда."}, {"kind": "speech", "image": "Она была моей жизнью. Я заботился о ней и об этом цветке, чтобы она радовалась.", "story": "Будешь вставать ночью и поливать его — он оживёт.", "problem": "Другое объяснение мужа; нет больной шеи и ночных прогулок."}, {"kind": "caption", "image": "В тот день в зале суда истина растопила многолетнюю обиду. Молчание говорило больше слов. Любовь проявлялась не y": "Мать отговаривала её, но девушка стояла на своём.", "problem": "Другая реплика матери."}, {"kind": "speech", "image": "Я пойду, мама. Пусть будет, как будет.", "story": "Мать отговаривала её, но девушка стояла на своём.", "problem": "Другие слова."}, {"kind": "speech", "image": "Все вы принесли цветы и золото, но я хочу увидеть цветок честности. Покажет ли кто-то из вас его мне настоящего?", "story": "Принц дал каждой девушке семечко, велел посадить его в горшок и вернуться к нему через шесть месяцев.", "problem": "Нет семян, горшков и шести месяцев в этой реплике."}, {"kind": "caption", "image": "Дочь служанки принесла пустой горшок. Она ничего не украла и не солгала. Но сможет ли честность победить жадность и ложь?", "story": "Через шесть месяцев девушка пришла во дворец с пустым горшком.", "problem": "Добавлены «не украла», «жадность и ложь»."}, {"kind": "caption", "image": "С утра до вечера девушки крали цветы из чужих садов, лгали и обманывали, чтобы угодить принцу.", "story": "У остальных цвели прекрасные цветы.", "problem": "В рассказе не сказано, что девушки крали цветы."}, {"kind": "speech", "image": "Каждая из вас принесла красивый цветок. Но этот горшок показывает цветок, который вырос в сердце девушки.", "story": "— Она принесла мне самый ценный цветок — честность. Семена, которые я вам раздал, не могли прорасти.", "problem": "Нет слов о семенах, которые не могли прорасти."}, {"kind": "caption", "image": "Только дочь служанки пришла с пустыми руками, но с правдой и честностью.", "story": "Через шесть месяцев девушка пришла во дворец с пустым горшком.", "problem": "«с пустыми руками» вместо пустого горшка."}, {"kind": "speech", "image": "Я выбираю её. Именно её цветок — цветок честности. Пусть она станет моей женой. Богатство не в золоте, а в честности.", "story": "— Она принесла мне самый ценный цветок — честность.", "problem": "Добавлено «Богатство не в золоте»."}, {"kind": "moral", "image": "Самое ценное украшение — честность.", "story": "Самое це ry": "Здесь чудес не продают, девочка. Прости, ничем не могу помочь", "problem": "Rare medicine instead of a miracle."}, {"kind": "speech", "image": "Я слишком бедна, чтобы купить их. Пожалуйста, помогите нам, если сможете, хоть немного.", "story": "Смотри, у меня есть деньги. Если не хватит, найду остальное и принесу. Просто скажите мне цену чуда.", "problem": "Different plea."}, {"kind": "speech", "image": "Хорошо, я сделаю всё возможное. Постараюсь найти, что смогу, и помогу вам.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Что случилось с вашим лекарством?", "story": "Какое чудо нужно твоему брату?", "problem": "Doctor asks about medicine, not the miracle."}, {"kind": "speech", "image": "Боюсь... Мой сын болен, и лекарства, которые он принимает, очень дорогие и почти нигде не продаются. У нас нет денег купить их.", "story": "Не знаю. Ему нужна операция, а у родителей нет денег. Вот я и решила отдать свои.", "problem": "Operation replaced by medicine; speaker seems to be a parent, not Lisa."}, {"kind": "speech", "image": "Сколько стоит лекарство?", "story": "Сколько ты накопила?", "problem": "Different question."}, {"kind": "speech", "image": "Очень дорого... Мы настолько бедны, что не можем позволить себе такие лекарства.", "story": "Один доллар и одиннадцать центов", "problem": "The price punchline is missing."}, {"kind": "speech", "image": "Это лекарство крайне редкое... но я постараюсь его найти. Мы не оставим вашу семью без помощи.", "story": "Один доллар и одиннадцать центов? Какое совпадение! Именно столько стоит нужное твоему брату чудо.", "problem": "He offers to find rare medicine instead of naming the miracle's price."}, {"kind": "speech", "image": "Спасибо большое, доктор. Ваша доброта — наша надежда.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Благодаря доброте и стараниям доктора Карлтона Армстронга были найдены редкие лекарства, и Оливер начал принимать их вовремя.", "story": "Это бы <script>
const rows = JSON.parse(document.getElementById("data").textContent);
const counts = {all: rows.length, "Needs correction": 0, "Requires manual review": 0, Matches: 0};
rows.forEach(r => { counts[r.status] = (counts[r.status] || 0) + 1; });
const summary = document.getElementById("summary");
summary.innerHTML = Object.entries(counts).map(([k, n]) =>
  `<button type="button" data-status="${k}" aria-pressed="${k === "all"}">${k === "all" ? "All illustrations" : k}: ${n}</button>`
).join("");
let status = "all";
const q = document.getElementById("q");
function esc(s) {
  return String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function badge(st) {
  const cls = st === "Matches" ? "match" : st === "Needs correction" ? "fix" : "review";
  return `<span class="badge ${cls}">${esc(st)}</span>`;
}
function render() {
  const query = q.value.trim().toLowerCase();
  const shown = rows.filter(r => (status === "all" || r.status === status) &&
    (!query || (r.title + " " + r.stem + " " + r.category).toLowerCase().includes(query)));
  document.querySelectorAll("[data-status]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.status === status)));
  const list = document.getElementById("list");
  if (!shown.length) { list.innerHTML = '<p class="empty">No illustrations in this view.</p>'; return; }
  list.innerHTML = shown.map(r => {
    const items = (r.items || []).map(it => {
      const bad = String(it.problem || "").trim();
      return `<tr class="${bad ? "bad" : ""}">
        <td class="kind">${esc(it.kind)}</td>
        <td>${esc(it.image)}</td>
        <td>${esc(it.story)}</td>
        <td class="problem">${bad ? esc(it.problem) + (it.story ? "<br><strong>Use: </strong>" + esc(it.story) : "") : ""}</td>
      </tr>`;
    }).join("");
    return `<article>
      <div class="head">
        <div><h2>${esc(r.title || "(no story title)")}</h2><div class="stem">${esc(r.stem)}${r.category ? " · " + esc(r.category) : ""}</div></div>
        ${badge(r.status)}
      </div>
      <div class="layout">
        <img class="preview" src="${esc(r.preview)}" alt="" />
        <table>
          <thead><tr><th>Where</th><th>On the image</th><th>Story text</th><th>Discrepancy and correction</th></tr></thead>
          <tbody>${items || "<tr><td colspan='4'>No readable text was recorded.</td></tr>"}</tbody>
        </table>
      </div>
    </article>`;
  }).join("");
}
document.body.addEventListener("click", (e) => {
  const b = e.target.closest("[data-status]");
  if (!b) return;
  status = b.dataset.status;
  render();
});
q.addEventListener("input", render);
render();
</script>
