"'Communicate' and 'see' replace 'Spend time' and 'find'."}, {"kind": "caption", "image": "Communicate with children to see innocence.", "story": "Spend time with older people and children, and you will find experience in one and innocence in the other.", "problem": "'Communicate' and 'see' replace 'Spend time' and 'find'."}, {"kind": "moral", "image": "Experience is learned from the elderly, innocence from the child.", "story": "Moral: Older people offer the wisdom of experience, while children remind us of innocence. Every stage of life has something to teach us.", "problem": "Different wording, and the second sentence is missing."}], "preview": "../../en/wisdom-stories/illustrations/communication.webp"}, {"stem": "compassion", "title": "Compassion", "category": "Friendship and human relations", "status": "Needs correction", "items": [{"kind": "title", "image": "Mercy", "story": "Compassion", "problem": "Different title."}, {"kind": "caption", "image": "One freezing winter night. A man was walking home after losing his job. His pockets were empty.... He was hungry and exhausted. The cold wind pierced his body, and people around him mocked and laughed.", "story": "It was a cold winter night, and I was walking home from work. Ahead of me, a man was swaying and clinging weakly to a lamppost.", "problem": "Different person and situation."}, {"kind": "speech", "image": "Look at him, what a loser! Does he even have a coat?", "story": "Some passersby made loud remarks about the dangers of alcohol; others laughed at him.", "problem": "Different insults."}, {"kind": "speech", "image": "What a pathetic guy...", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Moved by his condition, he helped the man to a taxi stand... He paid the fare and said, \"Go home and get some rest. You'll be okay.\"", "story": "I put an arm around his waist to steady him and helped him to a taxi stand.", "problem": "Pays the fare and sends him home instead of taking him to the hospital."}, {"kind": "other", "image": "TAXI STAND", "story": "taxi stand", "problem": ""}, {"kind": "caption", "image": "Years passed. That man became a successful doctor. One day, a poor taxi driver was brought into the hospital. When the doctor saw him, he recognized the man who had once helped him on a cold night.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "The doctor insisted on treating him with the best care... and later paid off all his debts, furnished his home, and secured a stable job for his family.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "I didn't do anything special. That night, I just saw a man freezing on the street. Maybe someone once helped me like that when I was in need.", "story": "You owe me nothing, my friend. I'm the one who owes you. You let me share in something good.", "problem": "Different speech and reversed roles."}, {"kind": "speech", "image": "Kindness is never wasted. What you did that night came back to you in ways you never expected.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Compassion is not crying with the crying person, but finding a way to stop the tears.", "story": "It means more than sharing someone's tears; it means looking for a way to ease their suffering.", "problem": "stop the tears instead of ease their suffering."}], "preview": "../../en/wisdom-stories/illustrations/compassion.webp"}, {"stem": "faith-is-half-of-success", "title": "Confidence Is Half the Battle", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Confidence is half the battle!", "story": "Confidence Is Half the Battle", "problem": "Extra exclamation mark."}, {"kind": "speech", "image": "I am entrusting you with these selected students because I know you are capable teachers. I believe in your hard work and in their potential.", "story": "You are our most capable teachers, so we’re entrusting you with a group of our brightest students. Over the coming year, give them the best education you can and help them reach their potential. I wish you every success.", "problem": "Different speech; omits the brightest-students claim, the year’s task, and the wish for success."}, {"kind": "other", "image": "PRINCIPAL", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "We, the teachers, share ideas and select students with great potential. We inspire them with belief and give them our best.", "story": "", "problem": "Not in the story; the teachers do not say this."}, {"kind": "other", "image": "BELIEVE, YOU CAN ACHIEVE!", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "They work hard, stay motivated, and with our support they achieve amazing results that exceed everyone's expectations.", "story": "At the end of the year, their test results surpassed those of other students across the city.", "problem": "Different claim; the story is about test results surpassing other students."}, {"kind": "other", "image": "PERFECT ATTENDANCE", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "EXCELLENT EFFORT AWARD", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "OUTSTANDING PROGRESS AWARD", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "PERFECT BEHAVIOR AWARD", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "PERFECT ATTITUDE AWARD", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Today I am proud of you. You believed in these students and helped them believe in themselves — and look what they have achieved!", "story": "I have a confession to make. Those students we entrusted to you were not the most capable children at all - they were average. We chose them by chance.", "problem": "Replaces the confession that the students were average and chosen by chance."}, {"kind": "other", "image": "TEACHERS SHAPE THE FUTURE.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "I have another trust for you. Choose other students with potential. You know, every one of them can achieve great things with your guidance and belief.", "story": "But I have another confession. You weren’t selected as our best teachers either. I drew your names at random from a bag. You succeeded because you believed you could.", "problem": "Replaces the confession that the teachers were drawn at random."}, {"kind": "other", "image": "BELIEF CREATES POWER", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Belief awakens hidden power; high expectations are sometimes the first reason for high results.", "story": "Confidence can bring hidden abilities to life. High expectations may be the first step toward strong results.", "problem": "“Belief”/“hidden power”/“first reason for high results” instead of “Confidence”/“hidden abilities”/“first step toward strong results”."}], "preview": "../../en/wisdom-stories/illustrations/faith-is-half-of-success.webp"}, {"stem": "discussion-and-conflict", "title": "Discussion and Conflict", "category": "Friendship and human relations", "status": "Needs correction", "items": [{"kind": "title", "image": "Discussion and conflict", "story": "Discussion and Conflict", "problem": ""}, {"kind": "caption", "image": "Every day, something happens... Yesterday, the problem turned into a blame game. When Kamal spoke... the issue turned into a conflict.", "story": "As soon as he finished, Nadir accused him in front of everyone: \"You are to blame; because of you our work has stopped and we can do nothing.\"", "problem": "Different wording."}, {"kind": "speech", "image": "Günahkar, if you knew, you should have supported us too, so we could have known!", "story": "You are to blame; because of you our work has stopped and we can do nothing.", "problem": "Different accusation; Günahkar is not a story name."}, {"kind": "speech", "image": "If you start with accusations, we will think defensively, and the issue will turn into a pointless argument.", "story": "Let's stop here for today and return to this later", "problem": "Different words."}, {"kind": "speech", "image": "Guys, if we point fingers at Kamal, we won't fix anything. The issue isn't who's wrong or who's right. It's a team problem. If we stay calm and understand each other, we'll find the real reason. Remember, a problem can't be solved by accusing someone.", "story": "My son, the way you treated Kamal today was wrong. You accused him without understanding the situation, and you did it in front of everyone.", "problem": "Said to the group, not privately to Nadir."}, {"kind": "caption", "image": "Thanks to Nadir's calm approach... Later, everyone sincerely shared their thoughts. In the end... the cause was understood, and no one was blamed.", "story": "Javid Bey's counsel had worked; it was a good lesson for Nadir — he understood he had done wrong.", "problem": "Credits Nadir with the calm approach."}, {"kind": "moral", "image": "Conflict seeks who is right, and discussion seeks what is right.", "story": "Conflict asks who is right; discussion asks what is right.", "problem": "seeks instead of asks; second sentence is missing."}], "preview": "../../en/wisdom-stories/illustrations/discussion-and-conflict.webp"}, {"stem": "do-not-let-your-hearts-part", "title": "Do Not Let Your Hearts Drift Apart", "category": "Love and marriage", "status": "Needs correction", "items": [{"kind": "title", "image": "Don't let your hearts separate", "story": "Do Not Let Your Hearts Drift Apart", "problem": "“Separate” instead of “drift apart.”"}, {"kind": "caption", "image": "Why do people shout when they are upset? How can we understand each other?", "story": "Why do people shout when they argue?", "problem": "“Upset” and the second question are not that line."}, {"kind": "caption", "image": "When we argue, our hearts move away from each other; the words we say create a gap between us.", "story": "When people quarrel, their hearts seem to move farther apart. They raise their voices as though trying to bridge that distance.", "problem": "Says words create the gap; the story says they shout to bridge it."}, {"kind": "caption", "image": "Even when we are angry, hearts long for hearts near, not far.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "When love strengthens, harsh words soften; hearts understand each other.", "story": "Their voices drop to a whisper, and love draws them closer still. Eventually even whispers seem unnecessary: a look is enough for them to understand each other.", "problem": "Different wording."}, {"kind": "caption", "image": "Don't let hearts drift apart; instead, increase the words of affection—there is no turning back then.", "story": "So when you argue, do not let your hearts drift apart. Avoid words that widen the distance between you. One day, it may become so great that you cannot find your way back.", "problem": "“Increase the words of affection—there is no turning back” changes the warning."}, {"kind": "speech", "image": "Kind words bring hearts closer.", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Shouting pushes apart", "story": "Shouting reflects the distance between hearts.", "problem": "“Pushes apart” is not “reflects the distance.”"}, {"kind": "other", "image": "Kind words bring closer", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Thank you", "story": "", "problem": "Mug text is not in the story."}, {"kind": "other", "image": "I love you", "story": "", "problem": "Mug text is not in the story."}, {"kind": "moral", "image": "Screaming is the sound of the distance between hearts. Do not say words that increase that distance.", "story": "Shouting reflects the distance between hearts. Even in an argument, choose words that leave a way back to each other.", "problem": "“Screaming is the sound” and the second sentence differ."}], "preview": "../../en/wisdom-stories/illustrations/do-not-let-your-hearts-part.webp"}, {"stem": "do-you-have-spending-money", "title": "Do You Have Enough Money?", "category": "Work, livelihood, and wealth", "status": "Needs correction", "items": [{"kind": "title", "image": "Do you have money?", "story": "Do You Have Enough Money?", "problem": "Drops “Enough.”"}, {"kind": "caption", "image": "Value your parents while they are healthy and alive.", "story": "Value your parents while they are alive.", "problem": "Adds “healthy.”"}, {"kind": "speech", "image": "Do you have money?", "story": "Do you have enough money?", "problem": "Drops “enough.”"}, {"kind": "caption", "image": "Instead of asking “Do you have money?”, understand their needs and meet them.", "story": "Instead of merely asking, “Do you have enough money?” do what you can to meet their needs.", "problem": "Drops “merely,” “enough,” and “do what you can.”"}, {"kind": "moral", "image": "Value your parents while they are alive. Meet their needs with deeds, not words.", "story": "Show your parents that you value them through practical care. No one and nothing can replace them.", "problem": "Moral omits that no one can replace them and uses different wording."}], "preview": "../../en/wisdom-stories/illustrations/do-you-have-spending-money.webp"}, {"stem": "teacher-hello-do-you-remember-me", "title": "Do You Remember Me?", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "Teacher, hello, do you remember me?", "story": "Hello! Do you remember me? You taught me at school.", "problem": "Title adds \"Teacher\" and drops \"You taught me at school.\""}, {"kind": "speech", "image": "Teacher, hello! Do you remember me? You used to be my teacher in elementary school.", "story": "Hello! Do you remember me? You taught me at school.", "problem": "Says elementary school instead of school."}, {"kind": "speech", "image": "Those were wonderful days. I still remember them fondly.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Of course I remember you! How could I not?", "story": "Yes, in primary school. How good to see you after so many years. What do you do now?", "problem": "Different reply."}, {"kind": "caption", "image": "There was one day in class when, out of embarrassment, you couldn't pay the school fee. Teacher, you looked away so no one would notice.", "story": "One boy in our class had a beautiful watch. My parents couldn't afford one, and I wanted it badly. During a break, I stole it from his pocket.", "problem": "Changes the stolen watch into an unpaid school fee."}, {"kind": "caption", "image": "After class, you gave me the money quietly and told me not to worry and to keep my head up. That day, you protected my dignity so no one would feel ashamed.", "story": "After finding the watch in my pocket, you kept searching everyone else. Then you returned it without saying who had taken it.", "problem": "The teacher gives money instead of finding the watch with his eyes closed."}, {"kind": "speech", "image": "That day, you didn't lecture me or make me feel bad... instead, you protected my dignity. That's why I respected you so much and tried to be a good person.", "story": "That taught me what a teacher can be: someone who guides a child through a mistake while protecting their dignity. I decided to become that kind of teacher.", "problem": "Says he tried to be a good person, not that he became a teacher because of the watch."}, {"kind": "speech", "image": "Because of that experience, I became a teacher too! I try to treat my students the same way.", "story": "I'm a teacher, like you.", "problem": "The reason is the school-fee scene, not the watch."}, {"kind": "speech", "image": "That makes me so happy! You've grown into such a wonderful person.", "story": "I'm glad to hear that.", "problem": "Extra praise not in the story."}, {"kind": "speech", "image": "So, that day... You protected my dignity with your kindness?", "story": "Don't you remember finding the watch in my pocket?", "problem": "Asks about kindness, not the watch."}, {"kind": "speech", "image": "Yes, because every student's dignity should always be respected.", "story": "I had closed my eyes too.", "problem": "The story's closing line is missing."}, {"kind": "moral", "image": "To protect a person's dignity without shaming him is true teaching. Dignity preserved helps one learn and grow.", "story": "Moral: To protect a person's dignity without shaming them — by closing your eyes — is true teaching. A person whose dignity is kept learns from the mistake and rises.", "problem": "Drops \"by closing your eyes\" and changes the second sentence."}], "preview": "../../en/wisdom-stories/illustrations/teacher-hello-do-you-remember-me.webp"}, {"stem": "to-dream", "title": "Dreaming", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "Dreaming", "story": "Dreaming", "problem": ""}, {"kind": "caption", "image": "God places desires in our hearts.", "story": "Allah does not make you dream of something that He will not grant.", "problem": "“God” instead of “Allah,” and a different sentence."}, {"kind": "other", "image": "Every dream has a wisdom.", "story": "Trust that the dreams in your heart have meaning,", "problem": "Different wording."}, {"kind": "caption", "image": "Every dream that comes to your heart has a wisdom.", "story": "Trust that the dreams in your heart have meaning,", "problem": "Different wording."}, {"kind": "other", "image": "Faith", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Patience", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Prayer", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Gratitude", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Hope", "story": "do not lose hope.", "problem": "A sign label, not the moral sentence."}, {"kind": "caption", "image": "If the dream is in your heart, walk the path with faith.", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Every dream that comes to your heart has a wisdom. God does not put a desire in your heart that He will not grant — do not lose hope.", "story": "Allah does not make you dream of something that He will not grant. Trust that the dreams in your heart have meaning, and do not lose hope.", "problem": "“God”/“desire” instead of “Allah”/“dream”; different first sentence."}], "preview": "../../en/wisdom-stories/illustrations/to-dream.webp"}, {"stem": "early-marriage", "title": "Early Marriage", "category": "Love and marriage", "status": "Needs correction", "items": [{"kind": "title", "image": "Early Marriage", "story": "Early Marriage", "problem": ""}, {"kind": "caption", "image": "At the university, the teacher noticed that a bright girl's academic performance had suddenly declined. He learned that her family was planning her early marriage.", "story": "I had just graduated from university and begun teaching. One day, I was in the staff room marking exam papers.", "problem": "Different scene: a girl’s declining performance, not marking papers so girls can pass."}, {"kind": "caption", "image": "He carefully reviewed her exam answers and slightly adjusted her scores so she could stay in school longer.", "story": "I was correcting some of the girls’ wrong answers so that they could pass and move up to the next year.", "problem": "One girl’s scores, not the girls’ wrong answers."}, {"kind": "caption", "image": "He then called her father in and spoke with him.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "If we marry her off now, it will end her education. In a few years, when she is about 12–13, life becomes much more difficult for girls. An uneducated girl can neither protect herself nor contribute to society.", "story": "If these girls fail, their fathers will take them out of school and marry them off at twelve or thirteen. If they move up, they may be able to stay until they’re fifteen or sixteen.", "problem": "Says marrying now ends education at 12–13; the story says failing leads to marriage at twelve or thirteen, and passing may keep them until fifteen or sixteen."}, {"kind": "speech", "image": "Moved by the teacher's words, the father agreed: “I will not marry her off now.”", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Some time later, the man returned.", "story": "About half an hour later, the principal called me in", "problem": "A man returns; the story has the principal call the teacher in."}, {"kind": "speech", "image": "Thank you, sir! Because of you, my daughter is still in school and her future is full of possibilities.", "story": "He said, ‘You have a wise young teacher. Please pass on my thanks.’", "problem": "The father thanks the teacher; the story’s thanks come from the inspector through the principal."}, {"kind": "speech", "image": "How is she doing?", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "She is doing very well. She wants to become a doctor. She studies hard and dreams of building a better life.", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "A teacher’s small care can change a girl’s fate. Early marriage deprives children of education.", "story": "A teacher’s care can change a girl’s future. Early marriage can rob children of their education; we must not turn a blind eye to it.", "problem": "“Small care” and “fate”; the last clause is missing."}], "preview": "../../en/wisdom-stories/illustrations/early-marriage.webp"}, {"stem": "eat-less-and-stay-on-the-right-path", "title": "Eating Moderately and Living Honestly", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Eat Moderately and Live Honestly", "story": "Eating Moderately and Living Honestly", "problem": "“Eat”/“Live” instead of “Eating”/“Living.”"}, {"kind": "speech", "image": "Eating in moderation keeps the doctor away; honest living keeps the judge away.", "story": "Moderate eating keeps the doctor away; honest living keeps the judge away.", "problem": "“Eating in moderation” instead of “Moderate eating.”"}, {"kind": "caption", "image": "Eating in moderation helps protect your health, while honest living helps you avoid disputes and legal problems.", "story": "“Moderate eating keeps the doctor away” means that avoiding excess and practicing self-control can help protect your health. “Honest living keeps the judge away” means that acting fairly, obeying the law, and respecting others’ rights can help you avoid disputes and legal trouble.", "problem": "Combines and shortens both explanations; drops excess, self-control, acting fairly, obeying the law, and respecting others’ rights."}, {"kind": "other", "image": "EAT MODERATELY PROTECT YOUR HEALTH", "story": "", "problem": "Not a story sentence."}, {"kind": "other", "image": "CHOOSE THE RIGHT PATH ACT WITH INTEGRITY", "story": "", "problem": "Not a story sentence."}, {"kind": "other", "image": "CLEAR CONSCIENCE PEACEFUL LIFE", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Moral: Eat in moderation and act with integrity, so that you need neither a doctor nor a judge.", "story": "Eat in moderation and act with integrity, so that you need neither a doctor nor a judge.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/eat-less-and-stay-on-the-right-path.webp"}, {"stem": "everyone-has-work-to-do", "title": "Everyone Has Work to Do", "category": "Work, livelihood, and wealth", "status": "Needs correction", "items": [{"kind": "title", "image": "Everyone has work to do", "story": "Everyone Has Work to Do", "problem": ""}, {"kind": "caption", "image": "Baladadash teacher's advice—never say «I didn't have time»; this makes others feel they have no work.", "story": "He taught us never to leave a request or an assigned task unanswered, however small it might seem.", "problem": "Advice is rewritten around “I didn't have time.”"}, {"kind": "caption", "image": "everyone has work to do—people contact you because they need you.", "story": "When someone asks for help, it is usually because they need you, not because they have nothing better to do.", "problem": "Drops the second half of the sentence."}, {"kind": "thought", "image": "I have work to do.", "story": "Everyone has things to do.", "problem": "Not the story sentence."}, {"kind": "caption", "image": "if you cannot help, say so promptly.", "story": "If you cannot help, say so openly.", "problem": "“promptly” replaces “openly.”"}, {"kind": "speech", "image": "Hello! Sorry, I can't help right now. I have work to do. Maybe some other time.", "story": "If you cannot help, say so openly.", "problem": "Dialogue is not in the story."}, {"kind": "speech", "image": "I understand. Thank you for saying so honestly.", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "living known as unreliable is painful.", "story": "It is a very painful feeling to live knowing you are regarded as unreliable and untrustworthy.", "problem": "Drops “untrustworthy” and “very.”"}], "preview": "../../en/wisdom-stories/illustrations/everyone-has-work-to-do.webp"}, {"stem": "everyone-is-the-same-here", "title": "Everyone Is Equal Here", "category": "Friendship and human relations", "status": "Needs correction", "items": [{"kind": "title", "image": "Everyone is the same here", "story": "Everyone Is Equal Here", "problem": "the same instead of Equal."}, {"kind": "speech", "image": "I have been appointed as the district head of this region.", "story": "A young, newly appointed municipal leader decided to explore his district on foot.", "problem": "Different wording."}, {"kind": "speech", "image": "Now I have some authority.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Sir, would you like me to polish your shoes?", "story": "Uncle, may I polish your shoes?", "problem": "Sir instead of Uncle."}, {"kind": "speech", "image": "Of course, go ahead. You may polish my shoes if you wish.", "story": "All right. If you do a good job, I'll pay you double.", "problem": "Different reply."}, {"kind": "speech", "image": "I will be happy to do that, sir.", "story": "I do the same good job for everyone", "problem": "Different reply."}, {"kind": "speech", "image": "Polishing your shoes is an honor for me. I see no difference between a leader and any other person. If you allow me, may I say something? I dream of becoming a great person like you one day!", "story": "Our teacher told us to treat everyone equally, whatever we do. I'm earning money to buy medicine for my mother.", "problem": "Drops the medicine and the teacher's lesson."}, {"kind": "speech", "image": "You have a very kind heart. Remember, greatness comes from being a good person. Keep working hard and studying. You can achieve anything you dream of.", "story": "Deeply moved, the official gave the boy the largest banknote in his pocket and his business card.", "problem": "Different speech."}, {"kind": "speech", "image": "Sir, you have taught me a valuable lesson. I will never forget it!", "story": "He also visited the teacher to thank him for teaching the boy such honesty.", "problem": "The boy thanks the official; the story has the official thank the teacher."}, {"kind": "other", "image": "Respect everyone no matter their position or status.", "story": "Everyone is equal here", "problem": "Different words on the lesson."}, {"kind": "other", "image": "District Head", "story": "", "problem": "The nameplate in the story reads Everyone is equal here."}, {"kind": "moral", "image": "Treat people the same because they are people, not because of their position.", "story": "Treat a person the same because they are human, not because of their rank.", "problem": "people/position instead of a person/human/rank."}], "preview": "../../en/wisdom-stories/illustrations/everyone-is-the-same-here.webp"}, {"stem": "blind-who-have-eyes", "title": "Eyes That Do Not See", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "Blind people with eyes", "story": "Eyes That Do Not See", "problem": "Different title."}, {"kind": "caption", "image": "Many people have eyes, yet they only see the scenes around them.", "story": "The world is full of blind people who think they see because they have eyes.", "problem": "Different wording."}, {"kind": "caption", "image": "Eyes can be open, but hearts can be closed.", "story": "True sight requires understanding as well as eyes.", "problem": "Different wording."}, {"kind": "other", "image": "See without care", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Ignore, do not understand", "story": "We can look without seeing and listen without understanding.", "problem": "Different wording."}, {"kind": "caption", "image": "True sight is understanding.", "story": "True sight requires understanding as well as eyes.", "problem": "Shortened."}, {"kind": "caption", "image": "With open eyes, when we look with understanding and compassion, we see the essence of life.", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Look with understanding. Feel with heart. Think deeply. Live with love.", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "True human is one who sees beyond appearances.", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Seeing is done with understanding, not only with eyes. One who looks but does not see is truly blind.", "story": "True sight requires understanding as well as eyes. We can look without seeing and listen without understanding.", "problem": "Different wording; drops listening."}], "preview": "../../en/wisdom-stories/illustrations/blind-who-have-eyes.webp"}, {"stem": "to-be-fasting", "title": "Fasting", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Fasting", "story": "Fasting", "problem": ""}, {"kind": "caption", "image": "One day during Ramadan, four youths went to an old man and asked what fasting really means.", "story": "During Ramadan, several young men saw an older man eating and approached him with a teasing question.", "problem": "“four youths” and “asked what fasting really means” differ from several young men teasing a man who is eating."}, {"kind": "speech", "image": "Please tell us, sir, what does fasting really mean?", "story": "Aren’t you fasting, uncle?", "problem": "Different question."}, {"kind": "speech", "image": "My children, fasting is not just about abstaining from food and drink.", "story": "Of course I am. I’m only eating and drinking.", "problem": "Different reply."}, {"kind": "speech", "image": "Then what else is fasting?", "story": "What sort of fast is that?", "problem": "Different question."}, {"kind": "speech", "image": "My children, if a person tells lies, backbites, insults others, and commits evil deeds, then even if he does not eat or drink, his fast is not accepted. The fast is meaningless if the tongue and heart are not kept pure from such actions.", "story": "I refrain from lies, malice, mockery, waste, insults, gossip, and coveting what belongs to others. Illness prevents me from going without food.", "problem": "General sermon instead of the man’s list and the illness that prevents him from going without food."}, {"kind": "speech", "image": "So just not eating and drinking is not enough?", "story": "No. We’re only going without food.", "problem": "The youths ask a question; in the story they admit they are only going without food."}, {"kind": "speech", "image": "Exactly, fasting is also about controlling the tongue, guarding the heart, and staying away from evil deeds.", "story": "", "problem": "Not a story sentence."}, {"kind": "moral", "image": "Moral: If a person abstains from food and does not abstain from lying, backbiting, insulting, and evil deeds, he is not fully experiencing the spiritual spirit of fasting.", "story": "If a person abstains from food and does not abstain from lying, backbiting, insulting, and evil deeds, he is not fully experiencing the spiritual spirit of fasting.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/to-be-fasting.webp"}, {"stem": "father-and-son", "title": "Father and Son", "category": "Family and upbringing", "status": "Needs correction", "items": [{"kind": "title", "image": "Father and son", "story": "Father and Son", "problem": ""}, {"kind": "caption", "image": "After a harsh argument with his father, the son, upset and hurt, left home with his bag that same evening. His mother watched him go with tearful eyes. She longed for her son.", "story": "After a bitter argument with his father, a young man left home.", "problem": "Adds the same evening, a bag, and the mother watching him leave."}, {"kind": "speech", "image": "He's our only child. No matter what, let's bring him back.", "story": "I miss our son. Let’s find him and bring him home.", "problem": "Wording differs."}, {"kind": "caption", "image": "One day, the old man read a letter his son had left before going. It was full of pain and unspoken words.", "story": "One day, unable to bear seeing his wife in tears, the father took a slip of paper from his pocket and handed it to her.", "problem": "Story is an address the father already had, not a letter the son left."}, {"kind": "speech", "image": "It seems, without realizing, I hurt him.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Go, son. Pride won't bring him back. Go to him.", "story": "You’ll find him at this address. But don’t tell him I gave it to you.", "problem": "Different instruction."}, {"kind": "caption", "image": "The father went to where his son worked. He saw him at the garage. Without thinking of his pride, he embraced his son. The son's eyes filled with tears too. No words were needed, just a warm hug. Sometimes a step taken with love can melt years of cold distance.", "story": "The address led to a repair shop, where she found her son working in overalls.", "problem": "In the story the mother goes, and the father has been watching from a distance."}, {"kind": "other", "image": "AUTO REPAIR", "story": "", "problem": "Shop sign is not in the story."}, {"kind": "speech", "image": "Son, where you hurt, what upset you?", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Dad, I was angry. I thought you didn't understand me, that you didn't trust me.", "story": "How is that man? Is he still angry?", "problem": "Different dialogue."}, {"kind": "speech", "image": "No, son, I was wrong too. I got angry without knowing the truth. I pushed you away, but you were always in my heart.", "story": "He’s my own flesh and blood. My whole heart.", "problem": "Different confession."}, {"kind": "speech", "image": "I saw you working so hard. I was afraid, worried. I wanted to protect you from life's hardships. But I couldn't say it right. I was always proud of you.", "story": "Sometimes I went during my lunch break to watch from a distance and make sure he was eating properly.", "problem": "Different explanation."}, {"kind": "caption", "image": "The son listened quietly, his heart softening.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "A man's heart is also like a child's. He makes mistakes, he gets hurt, but he longs for his loved ones.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "I missed you so much, Dad. I missed you too, son.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "They hugged tightly. Forgiveness, understanding, and love filled their hearts. From that day on, they decided to face life together. Because love and respect could heal even the deepest wounds.", "story": "Their son stood there. He kissed their hands and embraced them.", "problem": "Ending narration is not the story."}, {"kind": "caption", "image": "With one sincere step, many years of sorrow turned into happiness. Love, understanding, and humility — these are the keys to any home. If these doors are open, no cold can enter.", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Don't hide your love, show it. Sometimes a timely step can prevent years of resentment.", "story": "Don't hide your love, show it. Sometimes a timely step can prevent years of resentment.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/father-and-son.webp"}, {"stem": "to-forgive", "title": "Forgiveness", "category": "Friendship and human relations", "status": "Needs correction", "items": [{"kind": "title", "image": "Forgiveness", "story": "Forgiveness", "problem": ""}, {"kind": "caption", "image": "To forgive means — not to love, approve, or accept what happened, and not to forget it.", "story": "Forgiving someone does not mean you must love them, speak to them, or continue the relationship. Nor does it mean declaring them innocent or right.", "problem": "Different list, and not to forget it conflicts with never forget."}, {"kind": "thought", "image": "Hatred Resentment Anger", "story": "resentment and hatred", "problem": "Adds Anger."}, {"kind": "caption", "image": "To forgive means releasing hatred, resentment, and pain that keep you imprisoned.", "story": "It means beginning to free yourself from resentment and hatred, so that the wound no longer governs your life.", "problem": "Different wording."}, {"kind": "caption", "image": "Forgiveness frees you from the burden of hurting, and helps you move forward.", "story": "It means beginning to free yourself from resentment and hatred, so that the wound no longer governs your life.", "problem": "Different wording."}, {"kind": "other", "image": "LESSON I CHOOSE TO LEARN", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Forgive and let go. Forgive, but never ignore, so you don't get hurt again.", "story": "Forgive and be free. Forgive, but never forget, otherwise you will be hurt again.", "problem": "let go instead of be free; never ignore instead of never forget."}, {"kind": "other", "image": "WISDOM AWAITS", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "LESSONS AWAIT", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "STRENGTH AWAITS", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Moral: Forgiving is not about justifying the other person - it is about freeing yourself from the prison of hatred and resentment. Forgive and be relieved, but do not forget the lesson.", "story": "Forgiving is not about justifying the other person - it is about freeing yourself from the prison of hatred and resentment. Forgive and be relieved, but do not forget the lesson.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/to-forgive.webp"}, {"stem": "hot-bread", "title": "Fresh Bread", "category": "Work, livelihood, and wealth", "status": "Needs correction", "items": [{"kind": "title", "image": "Hot bread", "story": "Fresh Bread", "problem": "Title says hot bread, not fresh bread."}, {"kind": "caption", "image": "Every day, an old man stood in line at the bakery. He wasn't the first in line. He waited patiently until his turn, so he could buy hot, fresh bread for his grandson. He stood in line without complaining, never pushing ahead.", "story": "The old man approached the baker. He needed to buy hot bread for his grandson. There weren't many people, and his turn came quickly.", "problem": "Says every day and a long patient wait; the story says his turn came quickly."}, {"kind": "other", "image": "BAKERY", "story": "the bakery", "problem": ""}, {"kind": "other", "image": "Hot bread, fresh every morning.", "story": "The smell of hot, fresh bread", "problem": "Sign wording is not in the story."}, {"kind": "speech", "image": "Sir, stay healthy. I hope my grandson gets well. May God grant you lots of good days. I hope my grandson gets better soon. Sir, may God bless you. You're buying hot bread for your grandson. May God reward you. May God accept it.", "story": "Take these, uncle, and enjoy them.", "problem": "These blessings are not the baker’s lines."}, {"kind": "speech", "image": "Amen!", "story": "Amen.", "problem": ""}, {"kind": "speech", "image": "Take this, grandfather. Fresh, hot bread. God bless you.", "story": "Please take them, uncle. It’s Friday, and every Friday we give away three fresh loaves.", "problem": "Drops Friday and the three loaves."}, {"kind": "speech", "image": "May God bless you too. May God reward you.", "story": "May Allah be pleased with you, my son.", "problem": "Different blessing."}, {"kind": "speech", "image": "Sir, this is for your grandson. May he get well soon. Take care. Have a good day.", "story": "This is my mother’s zakat. We would be grateful if you accepted it.", "problem": "The zakat line is missing and a sick grandson is added."}, {"kind": "speech", "image": "Come in, sir. Here you are, sit down. This is for your grandson. May he get well soon.", "story": "Welcome home, Father.", "problem": "Homecoming lines differ."}, {"kind": "speech", "image": "Thank you, my child. May God bless you. You're very kind. My child, may God reward you. May God reward you too, my child. Thank you all so much. It's all for my grandson.", "story": "May Allah accept your kindness, my daughter.", "problem": "Not the story’s exchange."}, {"kind": "speech", "image": "May God reward everyone who was kind to us. May He accept their good deeds. May He bless their homes and families.", "story": "Thank Allah for this meal. May He accept their kindness.", "problem": "Different thanks."}, {"kind": "speech", "image": "Amen, our Lord. May God bless you all. Amen.", "story": "Amen.", "problem": "Extra words."}, {"kind": "speech", "image": "Grandpa, did they know we had no money? They didn't know, my boy. But God knows.", "story": "But Dad, this morning you didn’t even have money for tea. Allah provided, my daughter.", "problem": "Speaker and words differ; the daughter’s line is missing."}, {"kind": "speech", "image": "I was so worried about you. But God sent good people to help us. This world is full of kind people. May God bless them all.", "story": "Where did all this come from? It’s a gift for us.", "problem": "Not the story dialogue."}, {"kind": "speech", "image": "Grandpa, I'll pray too that God blesses them. Yes, my son. Always thank God. He sends help through people. Amen.", "story": "I’m going to my room to pray again. Now I’ll ask Allah to send money for your teeth.", "problem": "The prayer for teeth is missing."}, {"kind": "speech", "image": "Look, my dear, God answered our prayers. Never stop thanking God. He sends help through His servants. Be grateful, be patient, and always trust in God.", "story": "The Lord has sent everything our grandson wished for. Look—there’s enough here for both of us to have our teeth fixed before the holiday. Praise be to Allah!", "problem": "The envelope and teeth are not in the visible speech."}, {"kind": "moral", "image": "A sincere child’s prayer and the kindness of a few can solve a family’s problems. In a society that is able to give, no one goes hungry.", "story": "A child’s sincere prayer and a few generous hearts can transform a family’s day. Where people are willing to share, no one need go hungry.", "problem": "“solve a family’s problems” and “able to give” differ from the story."}], "preview": "../../en/wisdom-stories/illustrations/hot-bread.webp"}, {"stem": "friend-of-god", "title": "Friend of Allah", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Friend of Allah", "story": "Friend of Allah", "problem": ""}, {"kind": "caption", "image": "An old man sees a child without shoes, feels sorry for him and buys a pair of shoes for the child.", "story": "An elderly man notices a barefoot child, is moved by compassion, and buys him a pair of shoes.", "problem": "“feels sorry” for “moved by compassion”; “without shoes” for “barefoot.”"}, {"kind": "speech", "image": "Are you Allah?", "story": "Are you Allah?", "problem": ""}, {"kind": "speech", "image": "No, my child, I am a simple person.", "story": "No, my child. I’m just an ordinary person.", "problem": "“a simple person” instead of “just an ordinary person.”"}, {"kind": "speech", "image": "Then you are a friend of Allah. Last night, while crying, I told Allah that I had no shoes.", "story": "Then you must be a friend of Allah. Last night I cried and told Him I had no shoes.", "problem": "Missing “must”; “while crying, I told Allah” instead of “I cried and told Him.”"}, {"kind": "moral", "image": "Moral: Sometimes goodness does not come from heaven, but through the hands of good people. Perhaps it is in your hands to be the answer to someone’s prayer.", "story": "Sometimes kindness does not descend from heaven by itself; it reaches us through good people. Perhaps you can be the answer to someone’s prayer.", "problem": "“goodness”/“come”/“through the hands of good people”/“it is in your hands” differ from “kindness”/“descend … by itself”/“reaches us through good people”/“you can be.”"}], "preview": "../../en/wisdom-stories/illustrations/friend-of-god.webp"}, {"stem": "friendship-and-love", "title": "Friendship and Love", "category": "Love and marriage", "status": "Needs correction", "items": [{"kind": "title", "image": "Friendship and love", "story": "Friendship and Love", "problem": ""}, {"kind": "caption", "image": "Write your quarrel on leaves so that the wind blows them away and there is no quarrel.", "story": "Write your quarrels on leaves, so that they fall and disappear when autumn comes.", "problem": "Singular “quarrel,” and wind instead of autumn."}, {"kind": "other", "image": "WRITING QUARREL", "story": "Write your quarrels on leaves", "problem": "Leaf label is not the story line."}, {"kind": "caption", "image": "Write your anger on clouds so that rain washes them away and there is no anger.", "story": "Write your anger on clouds, so that it passes with the rain.", "problem": "“Washes them away and there is no anger” is extra."}, {"kind": "other", "image": "ANGER", "story": "Write your anger on clouds", "problem": ""}, {"kind": "caption", "image": "Write your hatred on snow so that the sun melts it away and there is no hatred.", "story": "Write your hatred on snow, so that the sun melts it away.", "problem": "Extra “and there is no hatred.”"}, {"kind": "other", "image": "HATRED", "story": "Write your hatred on snow", "problem": ""}, {"kind": "caption", "image": "Write friendship and love on hearts so that they remain forever and spread all over the world.", "story": "Write friendship and love on the hearts of newborn children, so that as they grow, both spread throughout the world.", "problem": "Omits newborn children; adds “remain forever.”"}, {"kind": "other", "image": "FRIENDSHIP", "story": "Write friendship and love", "problem": ""}, {"kind": "other", "image": "LOVE", "story": "Write friendship and love", "problem": ""}, {"kind": "moral", "image": "Write quarrel and hatred on temporary things; write friendship and love on the heart forever.", "story": "Let quarrels, anger, and hatred pass. Give friendship and love a lasting home in the heart.", "problem": "Different wording; anger is missing from the moral."}], "preview": "../../en/wisdom-stories/illustrations/friendship-and-love.webp"}, {"stem": "gossip", "title": "Gossip", "category": "Friendship and human relations", "status": "Needs correction", "items": [{"kind": "title", "image": "Gossip", "story": "Gossip", "problem": ""}, {"kind": "caption", "image": "A man came to his elder accusing him of spreading gossip about him.", "story": "A rude, quarrelsome man was brought before the village elder for spreading gossip.", "problem": "Says the man accused the elder."}, {"kind": "speech", "image": "It was just a joke, my words were harmless! I didn't mean to hurt anyone!", "story": "It was only a joke! People misunderstood me. I did nothing wrong.", "problem": "Different wording."}, {"kind": "speech", "image": "A clean name is very valuable. Think carefully.", "story": "You've ruined my good name. I want justice.", "problem": "Different words."}, {"kind": "speech", "image": "Please forgive me! I didn't think my words would cause harm.", "story": "I take it all back. Please forgive me.", "problem": "Extra sentence."}, {"kind": "speech", "image": "Go to the market square and buy a handful of feathers. Then, throw them in the air. After that, gather every feather you can and bring them back to me. Do that.", "story": "Take a feather pillow to the market square, cut it open, and scatter the feathers. Then gather every one and bring them to me.", "problem": "Buy feathers and throw them, instead of cutting a pillow."}, {"kind": "speech", "image": "I tried, but I can't find them all.", "story": "I couldn't gather the rest", "problem": "Different wording."}, {"kind": "speech", "image": "That's how your words are, too. Once they are out, you can't take them back.", "story": "Just as I can't take back the words I spread.", "problem": "Spoken by the elder, not the man."}, {"kind": "moral", "image": "Moral: A word that is spread is like a feather thrown to the wind - it cannot be collected again. Therefore, stay away from gossip.", "story": "A word that is spread is like a feather thrown to the wind - it cannot be collected again. Therefore, stay away from gossip.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/gossip.webp"}, {"stem": "grandfather-and-grandson-at-the-market", "title": "Grandfather and Grandson at the Market", "category": "Family and upbringing", "status": "Needs correction", "items": [{"kind": "title", "image": "Grandfather and grandson at the market", "story": "Grandfather and Grandson at the Market", "problem": ""}, {"kind": "caption", "image": "Grandfather goes to the supermarket for shopping. His grandson wants some chocolate, so he is with him. But the grandson is very noisy. \"Look at this!\" \"Look at that!\" he keeps shouting.", "story": "the boy kept shouting, “Buy me this! Buy me that!”", "problem": "Shouts Look at this instead of Buy me this."}, {"kind": "caption", "image": "At the checkout, the grandson suddenly throws a tantrum. He wants a Kinder Surprise, shouts loudly, and when granted it, he starts jumping and stomping right there. \"Look what I got!\" he says, and crushes the chocolate egg on the floor.", "story": "Finally, the boy grabbed a Kinder Surprise egg from a shelf and crushed it underfoot.", "problem": "Says the egg was granted and he shouted Look what I got."}, {"kind": "caption", "image": "Luckily, at the checkout, the grandfather stays patient and calm. He doesn't shout or get angry. Instead, he gently talks to his grandson and explains what's right, showing him respect.", "story": "Stay calm, Arif. I’ll pay for that too.", "problem": "Omits the name Arif and the offer to pay."}, {"kind": "speech", "image": "Your calm behavior is truly admirable, Grandfather. Well done!", "story": "I admired how patient you were with Arif", "problem": "She praises Grandfather and does not say the name Arif."}, {"kind": "caption", "image": "Grandfather smiles kindly and says:", "story": "He smiled.", "problem": ""}, {"kind": "speech", "image": "Patience is my name, Arif.", "story": "The boy’s name is Rafiq. I’m Arif.", "problem": "Says his name is Patience, and does not say the boy is Rafiq."}, {"kind": "moral", "image": "True strength is knowing yourself with patience. Protect your calm, so your child grows with calm.", "story": "Being able to control yourself in a tense moment is a sign of true strength. Keeping calm sometimes means mastering yourself, not others.", "problem": "Moral is reworded."}], "preview": "../../en/wisdom-stories/illustrations/grandfather-and-grandson-at-the-market.webp"}, {"stem": "pray-while-washing-your-dishes", "title": "Gratitude at the Kitchen Sink", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Pray while washing dishes", "story": "Gratitude at the Kitchen Sink", "problem": "Different title."}, {"kind": "speech", "image": "Pray while washing dishes. Be grateful for having dishes to wash.", "story": "As you wash the dishes, offer a prayer of thanks.", "problem": "“Pray while washing dishes” and “Be grateful for having dishes to wash” are not “offer a prayer of thanks.”"}, {"kind": "other", "image": "Every blessing has a meaning. Be grateful.", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Thankfulness brings peace.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Because you have dishes to wash, it means you have food to eat, loved ones to share it with, and a table to gather around.", "story": "The dishes show that there was food to prepare, a table to set, and perhaps someone to care for and feed.", "problem": "“food to eat, loved ones to share it with, and a table to gather around” differ from food to prepare, a table to set, and someone to care for and feed."}, {"kind": "thought", "image": "In this moment, think: having dishes to wash is a blessing. It means I have a table and people I love.", "story": "Remember those who have neither food to serve nor anyone to share it with.", "problem": "A personal gratitude thought replaces remembering those who have neither food nor anyone to share it with."}, {"kind": "speech", "image": "Every blessing, no matter how small, is a gift from Allah.", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Be grateful for every blessing.", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Moral: Be grateful for the simple things you have: having dishes to wash means you have a table, you have loved ones.", "story": "Everyday chores can remind us of everyday blessings. Gratitude begins with noticing them.", "problem": "Different moral; the story’s moral about everyday chores and noticing blessings is not used."}], "preview": "../../en/wisdom-stories/illustrations/pray-while-washing-your-dishes.webp"}, {"stem": "hayats-life-story", "title": "Hayat’s Life Story", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "Hayat's Life Story", "story": "Hayat’s Life Story", "problem": ""}, {"kind": "caption", "image": "My mother and father argued often. One day, my mother left us this letter and took her own life.", "story": "When my mother left our home, my father, and us, I was six and my brother was eight.", "problem": "The letter and her death did not happen the day she left."}, {"kind": "caption", "image": "My mother's letter.", "story": "On it was written: “To be given to my daughter and my son.”", "problem": "Does not give the story’s inscription."}, {"kind": "other", "image": "I forgive you my children.", "story": "", "problem": "Not the letter in the story."}, {"kind": "caption", "image": "My aunt cut the letter in half so we couldn't read what she wrote.", "story": "my brother cut it in half with scissors.", "problem": "The aunt cuts the letter; in the story the brother does."}, {"kind": "caption", "image": "Instead of love: “You are a burden. You will work. That is how you will earn your food.” My aunt said and I became her servant.", "story": "My name became “Come-here”: “Come-here, fetch water… Come-here, wash these dishes…”", "problem": "Different words from the aunt."}, {"kind": "caption", "image": "Every night I read the sentences from the letters over and over. They were my mother's only comfort.", "story": "Every night in bed I tried to finish that sentence:", "problem": "Says the letters were the mother’s comfort, not Hayat’s unfinished sentences."}, {"kind": "thought", "image": "My life, my girls, forgive me.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "At fifteen, I was married to Uncle Hasan and sent to live in his house.", "story": "I was fifteen. I was Uncle Hasan’s wife.", "problem": "Adds that she was sent to live in his house."}, {"kind": "caption", "image": "Years passed... My son Sami became a doctor, my daughter Elif a teacher, and my daughter Zahra a nurse. They became my pride.", "story": "Sami had become a doctor and moved to another city. Elif had become a teacher and married. My youngest, Zahra, became a veterinarian.", "problem": "Calls them her son and daughters, and Zahra a nurse instead of a veterinarian."}, {"kind": "other", "image": "Nagil", "story": "So my granddaughter’s name was Nagil.", "problem": ""}, {"kind": "caption", "image": "My pain was early, my struggle long, but today I raise my voice for all girls.", "story": "These people I cannot forgive.", "problem": "Different closing."}, {"kind": "moral", "image": "Blind custom and a false idea of honor can destroy a woman's life, a child's life. Those who look away are partners in that oppression.", "story": "Blind custom and a false idea of “honor” can destroy a woman’s life, a child’s life. Those who look away from early marriage, violence, and neglect are partners in that oppression.", "problem": "Drops “from early marriage, violence, and neglect.”"}], "preview": "../../en/wisdom-stories/illustrations/hayats-life-story.webp"}, {"stem": "help-yourself-o-exalted-god", "title": "Help Them Yourself, O Exalted Allah!", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Help Them Yourself, O Exalted Allah!", "story": "Help Them Yourself, O Exalted Allah!", "problem": ""}, {"kind": "caption", "image": "To the restless, left without a home, to the orphan, left alone, to the needy, left hungry and thirsty... help them Yourself, O exalted Allah!", "story": "To the restless, left without a home, to the orphan, left alone, to the needy, left hungry and thirsty,", "problem": "Adds an ellipsis and repeats the refrain early; the story keeps the refrain until the end."}, {"kind": "caption", "image": "to the sick, left in hardship, to the one whose heart is wounded, whose eyes wait on the road, to the hopeless, left without a way... help them Yourself, O exalted Allah!", "story": "to the sick, left in hardship, to the wounded heart that waits and watches the road, to the hopeless who can see no way forward,", "problem": "“the one whose heart is wounded, whose eyes wait on the road” and “left without a way” differ from the story’s lines."}, {"kind": "caption", "image": "to the heedless, left without light, to the one who still has a wish, who still dreams, to the faithless, left without You — help them Yourself, O exalted Allah!", "story": "to the heedless, left without light, to the one who still has a wish, who still dreams, to the faithless, left without You — help them Yourself, O exalted Allah!", "problem": ""}, {"kind": "other", "image": "help them Yourself, O exalted Allah!", "story": "help them Yourself, O exalted Allah!", "problem": ""}, {"kind": "moral", "image": "Moral: The last refuge of the helpless, the lonely, and the hopeless is the Creator. Prayer is the language of deepest need.", "story": "The last refuge of the helpless, the lonely, and the hopeless is the Creator. Prayer is the language of deepest need.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/help-yourself-o-exalted-god.webp"}, {"stem": "henry-fords-choice", "title": "Henry Ford's Choice", "category": "Work, livelihood, and wealth", "status": "Needs correction", "items": [{"kind": "title", "image": "Henry Ford’s Choice", "story": "Henry Ford's Choice", "problem": ""}, {"kind": "caption", "image": "Every day, Henry Ford, the founder of Ford Motor Company, invited two young men from a nearby university to lunch. He wanted to hire one of them. Both were excellent, intelligent, and equally qualified.", "story": "Henry Ford once invited two young friends to dinner. Both hoped to work for his company, and both were talented graduates of the same university.", "problem": "Says every day and lunch, not once and dinner."}, {"kind": "other", "image": "RESTAURANT", "story": "dinner", "problem": ""}, {"kind": "caption", "image": "Henry was kind and fair. But before hiring, he decided to test them in a way they didn't know. He wanted to see how they treated those who had less power.", "story": "After the meal, Ford offered one a job and wished the other well.", "problem": "Adds a secret test the story presents as observation at dinner."}, {"kind": "speech", "image": "Mr. Ford, we all start somewhere. I believe I should use all the opportunities I get to help those who are less fortunate than me. It's not just kindness—it's my duty. If I can offer help, I will. No one chooses where they are born.", "story": "Mr. Ford, we haven’t discussed cars or engineering all evening. We only talked about everyday things. Why did you offer my friend a job and turn me down?", "problem": "The disappointed man’s question is replaced."}, {"kind": "speech", "image": "Of course, there are two reasons for that. First: some people were born into wealth, and others were not. I have seen many who reached the top and then looked down on those who stayed below. I don't like that. Second: people should overcome difficulties with their own effort, not by waiting for someone else's help. That kind of attitude only makes them weak.", "story": "First, I watched you both during dinner. Your friend tasted his food before adding salt. You added salt before tasting it.", "problem": "Both reasons are different from salt and courtesy to waiters."}, {"kind": "speech", "image": "The second reason is: helping others is a noble act, but it's not the only way. People can also grow through hard work, struggle, and self-reliance. I want someone who can create value, not just someone who gives out help without encouraging independence.", "story": "Second, your friend treated the waiters courteously. You ignored them and were polite only to me.", "problem": "The second reason is not the story’s."}, {"kind": "moral", "image": "A person’s character is shown in his small actions: in his impulsive decisions and in his attitude towards the weak.", "story": "Small actions reveal character, both in how we make decisions and in how we treat people with less power than ourselves.", "problem": "“impulsive decisions” and “the weak” are not the story’s words."}], "preview": "../../en/wisdom-stories/illustrations/henry-fords-choice.webp"}, {"stem": "hold-my-hand", "title": "Hold My Hand", "category": "Family and upbringing", "status": "Needs correction", "items": [{"kind": "title", "image": "Hold my hand", "story": "Hold My Hand", "problem": ""}, {"kind": "speech", "image": "Darling, I'll hold your hand so you don't fall.", "story": "Hold my hand tightly, sweetheart, so you don’t fall into the river.", "problem": "The father offers to hold her hand; in the story he asks her to hold his."}, {"kind": "speech", "image": "No, Dad, I'll hold your hand.", "story": "No, Dad. You hold mine.", "problem": "She offers to hold his hand; in the story she asks him to hold hers."}, {"kind": "speech", "image": "What's the difference?", "story": "What’s the difference?", "problem": ""}, {"kind": "speech", "image": "There's a big difference. If I hold your hand and something happens, I might let go. But if you hold my hand, no matter what happens, you'll always hold mine.", "story": "There’s a big difference. If something frightens me, I might let go of your hand. But if you hold mine, I know you won’t let go, whatever happens.", "problem": "The roles in the explanation are reversed."}, {"kind": "moral", "image": "The power of love is not letting go. Instead of waiting for the hand of those who love you, hold theirs tightly.", "story": "Love offers a steady hand. Do not simply wait for those you love to reach for you; reach out and hold on to them.", "problem": "Moral is reworded."}], "preview": "../../en/wisdom-stories/illustrations/hold-my-hand.webp"}, {"stem": "honey-or-dry-bread", "title": "Honey or Dry Bread?", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "Honey or dry bread", "story": "Honey or Dry Bread?", "problem": "Missing question mark."}, {"kind": "speech", "image": "If you must choose between eating with a scholar and eating with an ignorant man, choose the scholar.", "story": "It is better to sit with a scholar and eat dry bread than to sit with an ignorant man and eat honey.", "problem": "Drops dry bread and honey."}, {"kind": "caption", "image": "The ignorant man’s table", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "They talk a lot but say little of value. Laughter is loud, yet thoughts are empty.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "The scholar’s simple table", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "They talk less but say much of worth. Patience is practiced, and the right path is shown.", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Moral: The person you sit with will either elevate you or degrade you. The simple bread of a scholar is better than the sweetness of an ignorant man.", "story": "Your companions can lift you up or lead you astray. Plain bread shared with a wise person is worth more than honey shared with a fool.", "problem": "“degrade you,” “simple bread,” and “sweetness of an ignorant man” differ from the story."}], "preview": "../../en/wisdom-stories/illustrations/honey-or-dry-bread.webp"}, {"stem": "attitude-toward-a-problem", "title": "How to Face a Problem", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "Attitude Toward a Problem", "story": "How to Face a Problem", "problem": "Title does not match."}, {"kind": "speech", "image": "Do you have any problems?", "story": "Is there a problem in your life?", "problem": "Different wording."}, {"kind": "speech", "image": "Nope.", "story": "If not, there is no reason to worry.", "problem": "Different wording."}, {"kind": "speech", "image": "Then don’t worry about it.", "story": "If not, there is no reason to worry.", "problem": "Different wording."}, {"kind": "speech", "image": "Well.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Is this problem solvable?", "story": "If there is, can you solve it?", "problem": "Different wording."}, {"kind": "speech", "image": "Yes.", "story": "If you can, there is no reason to worry.", "problem": "Different wording."}, {"kind": "speech", "image": "No.", "story": "If you cannot, there is still no reason to worry.", "problem": "Different wording."}, {"kind": "moral", "image": "Either there is no problem, or there is a solution. Persistent worry is useless.", "story": "If a problem can be solved, work toward a solution. If it cannot, worrying will not change it.", "problem": "Drops working toward a solution and changes the unsolvable case."}], "preview": "../../en/wisdom-stories/illustrations/attitude-toward-a-problem.webp"}, {"stem": "explaining-ones-sorrow", "title": "How We Express Sorrow", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "Explaining a problem", "story": "How We Express Sorrow", "problem": "Title does not match."}, {"kind": "caption", "image": "Some people explain their problems simply... and it becomes easier for others to understand.", "story": "Someone who explains a problem plainly seeks a solution.", "problem": "Different meaning."}, {"kind": "speech", "image": "I felt sad because a friend hurt me with his words.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Thank you for sharing. I can see how that hurt you.", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "simple", "story": "", "problem": "Label is not a story sentence."}, {"kind": "caption", "image": "Some people express their problems beautifully... and turn someone else’s heart toward them.", "story": "Someone who describes it beautifully is a writer; someone who speaks of it with love is a lover.", "problem": "Drops writer and lover."}, {"kind": "speech", "image": "Sometimes the heart feels heavy, even without a reason.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "I understand, may Allah make it easy for you. You are not alone.", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "beautiful", "story": "", "problem": "Label is not a story sentence."}, {"kind": "other", "image": "elegant", "story": "", "problem": "“elegant” is not in the story."}, {"kind": "caption", "image": "Some people write, some draw, and some cover their problems with a smile...", "story": "Someone who conceals it behind a smile is a sage.", "problem": "Adds drawing and drops the sage."}, {"kind": "speech", "image": "When I talk about it, I feel relieved and at peace.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "When I write down my thoughts, they become clearer.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Sometimes I just smile and stay quiet. Silence heals too.", "story": "Someone who conceals it behind a smile is a sage.", "problem": "Adds “Silence heals too.”"}, {"kind": "moral", "image": "The deepest problems are often hidden in the deepest silence.", "story": "The deepest problems are often hidden in the deepest silence.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/explaining-ones-sorrow.webp"}, {"stem": "humanity", "title": "Humanity", "category": "Friendship and human relations", "status": "Needs correction", "items": [{"kind": "title", "image": "Humanity", "story": "Humanity", "problem": ""}, {"kind": "caption", "image": "Kamal was writing his final exam with full concentration. Suddenly, he saw something outside the window that disturbed him.", "story": "With half an hour left, he glanced toward the window. Something outside caught his attention.", "problem": "Calls it a final exam and says he was disturbed."}, {"kind": "speech", "image": "Kamal! Where are you going? The exam is not over yet.", "story": "Come back! If you leave, your exam will be invalid. You'll lose a whole year!", "problem": "Different warning."}, {"kind": "other", "image": "CLINIC", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "He saw an elderly woman about to faint on the street. Without thinking about the exam, Kamal rushed to help her.", "story": "A young man rushed over and helped me to the hospital. I was pregnant and terrified for my child.", "problem": "An elderly woman about to faint, not a pregnant woman in severe pain."}, {"kind": "caption", "image": "At home, her worried son thanked Kamal. He said, \"If you hadn't helped, my mother might have had a serious complication. Thank you from the bottom of my heart.\"", "story": "When Kazim came home a few hours later, he scolded his son and slapped him.", "problem": "A son thanks him; the story has his father scold him."}, {"kind": "caption", "image": "Years passed. Kamal became a doctor. One day, he visited a village for a medical camp.", "story": "he volunteered to work at a remote village hospital.", "problem": "A visit for a medical camp, not work at the hospital."}, {"kind": "speech", "image": "You saved my life that day, son. I prayed for you with all my heart. May God bless you always.", "story": "You came all this way in the cold, my son. What would the world be without people like you?", "problem": "Different speech."}, {"kind": "speech", "image": "If you hadn't helped us that day, I don't know what would have happened to my mother. You are a true blessing in our lives.", "story": "I named my son Kamal and raised him on that story.", "problem": "Different speech."}, {"kind": "speech", "image": "It was nothing, ma'am. It was my duty as a human being.", "story": "You owe me nothing, Mother. Be at peace.", "problem": "Different reply."}, {"kind": "speech", "image": "Kamal, I am so proud of you, son.", "story": "Kamal, my son", "problem": "Adds I am so proud of you; the story says he could say no more."}, {"kind": "moral", "image": "Moral: It's possible to have a profession, but the real challenge is to be a human being. A kindness becomes a blessing that lasts for generations.", "story": "A profession tells us what someone does; kindness shows who they are. One act of compassion can inspire generations.", "problem": "Different moral."}], "preview": "../../en/wisdom-stories/illustrations/humanity.webp"}, {"stem": "i-kiss-your-eyes", "title": "I Kiss Your Eyes", "category": "Love and marriage", "status": "Needs correction", "items": [{"kind": "title", "image": "I kiss your eyes", "story": "I Kiss Your Eyes", "problem": ""}, {"kind": "caption", "image": "Do you know why people say “I kiss your eyes”?", "story": "Do you know why it is said \"I kiss your eyes\"?", "problem": "“People say” instead of “it is said.”"}, {"kind": "caption", "image": "The eyes suffer the most from longing; that’s why they deserve the most farewell.", "story": "Because the eyes bear so much of our longing, they deserve our tenderest farewell.", "problem": "“Suffer the most” and “the most farewell” are not “bear so much” and “tenderest farewell.”"}, {"kind": "moral", "image": "Moral: The one who longs the most is the one who deserves the most farewell. Love repays the one who works hard.", "story": "Offer tenderness where longing has left its mark. Love recognizes what another person has endured.", "problem": "“Works hard” is not in the moral."}], "preview": "../../en/wisdom-stories/illustrations/i-kiss-your-eyes.webp"}, {"stem": "i-love-you", "title": "I Love You", "category": "Love and marriage", "status": "Needs correction", "items": [{"kind": "title", "image": "I love you", "story": "I Love You", "problem": ""}, {"kind": "caption", "image": "There lived a nightingale in a beautiful garden. Every night he sang beside a white rose. The rose listened to his song and said, “Oh nightingale, your song is so beautiful, but I wish I were as beautiful as you.”", "story": "They say a nightingale fell in love with a white rose… Every night he would go and perch beside her and declare his love. But the white rose ignored his feelings and paid no heed to his devotion.", "problem": "The rose praises his song and wishes to be beautiful; in the story she ignores him."}, {"kind": "speech", "image": "What do you want, my rose?", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "The rose replied, “I want to be red, the color of true love, so that the one I love will pick me up and hold me close and say, “I love you.”” The nightingale was deeply moved.", "story": "But the rose snapped: “Leave me alone — I don’t love you!”", "problem": "The rose asks to be turned red; in the story she rejects him."}, {"kind": "caption", "image": "Out of love, the nightingale flew to the thorny rose. He pressed his heart to a thorn and let his blood flow, so the white rose could turn red.", "story": "pulled a thorn from her, drove it into his own heart with all his strength, and dyed the pure white rose red with his blood!", "problem": "He presses his heart to a thorn so she can be loved by someone else."}, {"kind": "caption", "image": "The rose slowly turned red. Then she understood the nightingale’s love. But it was too late. The nightingale, who had given his life for her, lay silent forever.", "story": "Only then did the rose understand his love. But it was too late. Beneath her red flowers, the nightingale closed his eyes forever.", "problem": "“Slowly turned red” and “lay silent forever” differ."}, {"kind": "caption", "image": "From that day on, red roses have meant “I LOVE YOU.”", "story": "Since that day, red roses have meant “I LOVE YOU.”", "problem": "“From that day on” instead of “Since that day.”"}, {"kind": "moral", "image": "Moral: Since that day, red roses have meant I LOVE YOU. True love is sometimes understood too late. Appreciate the moment.", "story": "Affection may go unrecognized until it is too late. Appreciate the love in your life while there is still time.", "problem": "“Appreciate the moment” is not the moral’s second sentence."}], "preview": "../../en/wisdom-stories/illustrations/i-love-you.webp"}, {"stem": "i-want-a-friend", "title": "I Want a Friend", "category": "Friendship and human relations", "status": "Needs correction", "items": [{"kind": "title", "image": "I want a friend", "story": "I Want a Friend", "problem": ""}, {"kind": "caption", "image": "No, I do not want wealth, I want a true friend.", "story": "I want neither wealth nor possessions, I want a true friend.", "problem": "Drops possessions and changes neither to No, I do not."}, {"kind": "caption", "image": "Who will have mercy on me after I am gone?", "story": "What possession will mourn its owner after death?", "problem": "mercy instead of mourn."}, {"kind": "caption", "image": "I want a friend who will show mercy.", "story": "I want a friend who will remember me with love.", "problem": "show mercy instead of remember me with love."}, {"kind": "moral", "image": "Moral: Neither wealth nor possessions are the true wealth of a person, but a loyal friend.", "story": "A loyal friend is a greater treasure than any possession. Friendship can keep our memory alive after we are gone.", "problem": "Different moral."}], "preview": "../../en/wisdom-stories/illustrations/i-want-a-friend.webp"}, {"stem": "i-would-not-trade-it-for-anything", "title": "I Would Not Trade It for Anything", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "«I wouldn't trade a day for anything»", "story": "I Would Not Trade It for Anything", "problem": "'a day' replaces 'It'."}, {"kind": "caption", "image": "One day, a beautiful day, a sunny day, I wouldn't trade for anything.", "story": "A day, a beautiful day, a sunny day — I would not trade it for anything.", "problem": "'One day' and the missing 'it'."}, {"kind": "caption", "image": "For it, there is no war, no chains, no lies.", "story": "For its sake, I reject war; for its sake, I reject oppression; for its sake, I reject lies.", "problem": "'no chains' replaces rejecting oppression, and 'there is' replaces 'I reject'."}, {"kind": "other", "image": "LIES", "story": "for its sake, I reject lies.", "problem": ""}, {"kind": "caption", "image": "For on a beautiful, sunny day, there is no place for quarrel, no place for oppression, no place for hunger.", "story": "Moral: On a beautiful, sunny day there is no place for strife, oppression, or lies.", "problem": "'quarrel' replaces 'strife', and hunger replaces lies in this panel."}, {"kind": "other", "image": "QUARREL", "story": "On a beautiful, sunny day there is no place for strife, oppression, or lies.", "problem": "'Quarrel' is not the story's word 'strife'."}, {"kind": "other", "image": "OPPRESSION", "story": "for its sake, I reject oppression;", "problem": ""}, {"kind": "other", "image": "HUNGER", "story": "nor hunger…", "problem": ""}, {"kind": "moral", "image": "Moral: There is no place for quarrel, oppression and lies on a beautiful, sunny day. Injustice, fear and hunger cannot live in the light.", "story": "Moral: On a beautiful, sunny day there is no place for strife, oppression, or lies. In the light, injustice, fear, and hunger cannot live.", "problem": "'quarrel' replaces 'strife', and the second sentence is reordered."}], "preview": "../../en/wisdom-stories/illustrations/i-would-not-trade-it-f
