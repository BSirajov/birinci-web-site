 will devote my knowledge and experience to serve our noble state.", "story": "Sinan requested permission to survey the surrounding country.", "problem": "Different reply."}, {"kind": "caption", "image": "Sinan Agha surveys the waters, designs a master plan, and builds aqueducts, fountains, and reservoirs.", "story": "With his assistants, he examined wells, valleys, and streams from Çekmece to Beşiktaş and calculated where dams and aqueducts could be built.", "problem": "Different wording; Çekmece, Beşiktaş, wells, and dams are missing."}, {"kind": "speech", "image": "My Sultan, the routes are measured, the springs identified.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Excellent, Sinan. When will the water reach Istanbul?", "story": "Tell me only that it is possible. If necessary, I will place the sacks not end to end, but side by side.", "problem": "The gold-sacks exchange is missing."}, {"kind": "speech", "image": "With your permission, my Sultan, the work will be completed in a few years.", "story": "It can be done, but at a heavy price: sacks filled with gold would have to be placed end to end.", "problem": "Different reply."}, {"kind": "speech", "image": "May Allah reward you. This city will live because of your work.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Sinan builds countless fountains and waterworks in Istanbul. The people rejoice, offer prayers, and bless his name.", "story": "Sinan began work and created a magnificent system culminating in forty public fountains across the city.", "problem": "\"countless\" instead of forty."}, {"kind": "caption", "image": "Over time, Sinan grows old, and his strength begins to fade.", "story": "Near the end of his life, Sinan fell gravely ill.", "problem": "Different wording."}, {"kind": "speech", "image": "I have built mosques, schools, bridges, and waterworks. But now, it is time to rest from this worldly toil.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "May the works I leave behind be of benefit to generations yet unborn.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Whenever the people praise him, Sinan humbly replies: “All glory belongs to the Almighty. I am but a servant who did what was right.”", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "In his final years, he lives a simple life, far from the praises of the world.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Sinan, the people still speak of you with gratitude. Your name is remembered in every corner of Istanbul.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Man’s memory is fleeting. What remains is the pleasure of the Almighty. I have done what I believed was right.", "story": "We did not serve for profit, but for Allah’s pleasure.", "problem": "Different wording."}, {"kind": "caption", "image": "Sinan gathers his apprentices and says: “Do your work sincerely. Do not seek praise from people. Serve for the sake of what is right. For one day, you too will be forgotten.”", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Water remembers its source.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Sinan dies in a modest house without running water.", "story": "When those beside him tried to moisten his lips, the tap was dry.", "problem": "Related scene, different wording."}, {"kind": "speech", "image": "All my life, I brought water to this city, but I leave this world without it in my own home. So be it. What matters is to do what is right in one’s heart.", "story": "We did not serve for profit, but for Allah’s pleasure. We await our reward in the hereafter and do not grieve that this world has denied water to our home.", "problem": "Different dying words."}, {"kind": "moral", "image": "Do not place excessive trust in fame or human remembrance. True service is rendered for what one knows to be right.", "story": "Moral: Do not place excessive trust in fame, worldly privilege, or human remembrance. True service is rendered not for personal gain, but for what one knows to be right.", "problem": "Missing \"worldly privilege\" and \"not for personal gain, but\"."}], "preview": "../../en/wisdom-stories/illustrations/architect-sinan-dies-in-a-house-without-water.webp"}, {"stem": "dont-open-your-mouth", "title": "Speak Kindly or Remain Silent", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "Don’t open your mouth", "story": "Speak Kindly or Remain Silent", "problem": "Title does not match."}, {"kind": "speech", "image": "If you’re not going to say something nice, don’t open your mouth at all.", "story": "If you're not going to open your mouth to say something nice, don't open it at all.", "problem": "Word order differs: image says “say something nice, don’t open your mouth” instead of “open your mouth to say something nice, don’t open it.”"}, {"kind": "caption", "image": "Your choice of words changes the result.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Kind words heal, comfort, and lift someone up.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Harsh words hurt, wound, and leave scars that last.", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "WISDOM", "story": "", "problem": "Book label is not in the story."}, {"kind": "moral", "image": "If you don’t have anything worth saying, silence speaks louder.", "story": "If you have nothing worthwhile to say, silence may be the wiser choice.", "problem": "“silence speaks louder” instead of “silence may be the wiser choice.”"}], "preview": "../../en/wisdom-stories/illustrations/dont-open-your-mouth.webp"}, {"stem": "say-what-you-know", "title": "Speak What You Know", "category": "Word, silence, and communication", "status": "Needs correction", "items": [{"kind": "title", "image": "Tell what you know", "story": "Speak What You Know", "problem": "“Tell” instead of “Speak.”"}, {"kind": "caption", "image": "Speak what you know, but do not pretend wisdom. Say what is true, not what you think is right.", "story": "Share what you know without lecturing others.", "problem": "Different wording."}, {"kind": "caption", "image": "Listen carefully, but do not assume that everything you hear is true.", "story": "Listen carefully without assuming that everything you hear is true.", "problem": ""}, {"kind": "caption", "image": "Silence is not ignorance, and excess talk is not knowledge.", "story": "Silence does not prove ignorance, any more than endless talk proves wisdom.", "problem": "Drops “prove” and “wisdom.”"}, {"kind": "other", "image": "Know the measure, guard your tongue, respect others.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Speak correctly, listen correctly, and you can remain silent. See a person as he is.", "story": "Speak honestly, listen thoughtfully, and know when to be silent. See people as they are, without contempt or flattery.", "problem": "“correctly” instead of honestly/thoughtfully; drops contempt and flattery."}, {"kind": "other", "image": "SEE A PERSON AS HE IS. HONOR HIS DIGNITY IN PUBLIC.", "story": "See people as they are, without contempt or flattery.", "problem": "Different wording."}, {"kind": "moral", "image": "Speak correctly, listen correctly, and you can remain silent. See a person as he is.", "story": "Speak honestly, listen thoughtfully, and know when to be silent. See people as they are, without contempt or flattery.", "problem": "Different wording."}], "preview": "../../en/wisdom-stories/illustrations/say-what-you-know.webp"}, {"stem": "spend-your-time-with-people", "title": "Spend time with people", "category": "Friendship and human relations", "status": "Needs correction", "items": [{"kind": "title", "image": "Spend time with people", "story": "Spend time with people", "problem": ""}, {"kind": "speech", "image": "Dad, we've been waiting here in the bank for an hour for this small transaction. I'm so tired of waiting. So I thought...", "story": "My father needed to transfer money, and we spent an hour at the bank. Growing impatient, I said:", "problem": "Different wording."}, {"kind": "other", "image": "BANK", "story": "the bank", "problem": ""}, {"kind": "speech", "image": "Why don't we do our banking transactions online from now on? What do you think?", "story": "Dad, why don't we set up online banking for you?", "problem": "Different wording."}, {"kind": "speech", "image": "So, what would that give me, son?", "story": "What would that do for me?", "problem": "give me instead of do for me."}, {"kind": "speech", "image": "You could do transactions online from the bank in just a few minutes, anytime, anywhere. You wouldn't have to wait in line. You could save your time and your energy.", "story": "You wouldn't have to spend an hour here just to make a transfer. You could shop online too. It would be so much easier.", "problem": "Different benefits."}, {"kind": "speech", "image": "If I spend that saved time somewhere else, what will it give me? Will I really gain anything from it?", "story": "Then I wouldn't need to leave the house?", "problem": "Different question."}, {"kind": "speech", "image": "Of course, you will, Dad.", "story": "That's right.", "problem": "Different reply."}, {"kind": "caption", "image": "If I'm going to gain something, it must be something worth more than money — something that adds meaning to my life.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "You're right, son. When I come to the bank, I not only do my transaction, but I also meet old friends, chat with the staff, and exchange news. But most of all, on the way back I see familiar faces, greet people in the neighborhood, and say hello. I feel like I'm part of life. This makes me happy.", "story": "In this hour, I've seen four friends and talked to staff who have known me for years.", "problem": "Generalizes the four friends, fruit-shop visit, and grocer."}, {"kind": "caption", "image": "When I go to visit someone in the hospital or at home, I not only ask about their health, but I also see their mood, understand their needs better, and can support them at the right time. These things can't be fully understood or felt through a screen.", "story": "When I was ill two years ago, the man from the fruit shop came to visit. He sat beside my bed because he cared how I was.", "problem": "Different visits."}, {"kind": "speech", "image": "If I spend all that time just looking at a screen or browsing random things, will that really make my life better? Will it bring me closer to people? No. It will only make me more isolated and take me further away from what truly matters. In the end, what will I gain from that?", "story": "Wouldn't I lose those connections if I did everything online? Why should I trade them for a screen just to have things delivered?", "problem": "Different wording."}, {"kind": "speech", "image": "Technology is life, but spend time with people, Dad. Spend time with your loved ones.", "story": "Technology is useful, but it isn't life. Spend time with people, son.", "problem": "Says technology is life; the story says it isn't life. Speaker is reversed."}, {"kind": "moral", "image": "Technology brings convenience but does not replace life. Real value is in live communication and warmth between people.", "story": "Technology provides convenience, but it does not replace life. The real value is in live communication, in the warmth between people.", "problem": "brings instead of provides; Real value instead of The real value."}], "preview": "../../en/wisdom-stories/illustrations/spend-your-time-with-people.webp"}, {"stem": "spinach", "title": "Spinach", "category": "Family and upbringing", "status": "Needs correction", "items": [{"kind": "title", "image": "Spinach", "story": "Spinach", "problem": ""}, {"kind": "caption", "image": "After their father passed away, they became very poor in the village.", "story": "As a child, I sometimes wondered whether grief over my father’s death had unsettled her.", "problem": "Adds that they became very poor; the story does not say that here."}, {"kind": "speech", "image": "Spinach again today, my children. Eat it, it's good for you.", "story": "You need to eat a lot, it gives strength to the body", "problem": "Different wording from the mother’s line."}, {"kind": "caption", "image": "Day after day, week after week, they ate spinach because they had nothing else affordable.", "story": "All I had left were spinach seeds and a little corn to plant. There was no money.", "problem": "Paraphrase; not the notebook’s wording."}, {"kind": "speech", "image": "When I grow up, I swear I'll never cook spinach.", "story": "When I’m grown and have a job and a family, there’ll be no spinach in my house", "problem": "Says he will never cook spinach, not that there will be no spinach in his house."}, {"kind": "caption", "image": "He studied hard, left the village, built a good life. Years passed, and he kept his promise—he never cooked spinach.", "story": "The day came, I moved from our village to the city to study in high school.", "problem": "Adds that he never cooked spinach and that he built a good life."}, {"kind": "speech", "image": "I don't like it, and I won't cook it.", "story": "I didn't want to eat a spoonful of the spinach dish my mother put on the table.", "problem": "Not the story line; he refuses to eat it, not to cook it."}, {"kind": "caption", "image": "He got married, and at the wedding his mother said something that made his heart ache and his eyes fill with tears.", "story": "When I returned to the village to marry, she kept her promise and danced at my wedding, tears streaming down her face. I did not understand those tears then.", "problem": "Mother dances in tears; the image says she said something that made his eyes fill with tears."}, {"kind": "caption", "image": "One day, while sorting through his mother's belongings, he found an old notebook.", "story": "One day, I found an old notebook in a chest.", "problem": "Says he was sorting belongings rather than finding the notebook in a chest."}, {"kind": "caption", "image": "Inside was a note she had written...", "story": "In it, she had written:", "problem": "Calls it a note rather than writing in the notebook."}, {"kind": "other", "image": "I used to make spinach because it was the only thing we could afford. But the best parts—the eggs, the meat—I saved for you children... I wanted you to grow strong. I went hungry so you could eat well.", "story": "All I had left were spinach seeds and a little corn to plant. There was no money. I cooked what I could grow so my children would not go hungry. I told them I served spinach three times a day because it was good for them. Saying it broke my heart. This was all I could do, though I loved them with everything I had.", "problem": "Invented eggs, meat, and the mother going hungry; not the notebook text."}, {"kind": "caption", "image": "He realized, too late, his mother's silent sacrifices—the nights she went hungry so her children could have a better tomorrow...", "story": "At fifty, I learned to love spinach.", "problem": "Says he realized too late and that she went hungry at night."}, {"kind": "thought", "image": "?", "story": "", "problem": "Question mark is not in the story."}, {"kind": "moral", "image": "We often understand a mother’s sacrifice years later. Love is sometimes hidden in a plate of simple food.", "story": "We often understand a mother's sacrifice in the face of impossibility years later. Love is sometimes hidden in a plate of simple food.", "problem": "Missing “in the face of impossibility”."}], "preview": "../../en/wisdom-stories/illustrations/spinach.webp"}, {"stem": "not-leaving-the-right-path", "title": "Staying on the Right Path", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Not to deviate from the right path", "story": "Staying on the Right Path", "problem": "Different title."}, {"kind": "speech", "image": "Your Majesty, in these distracting busy days, people turn away from the right path and live for worldly gain. I humbly ask for an opportunity to show them how one can stay on the right path in life without being distracted by the world.", "story": "Once there was a man who had grown tired of wasting his days in idleness and living off his inheritance. Wanting to lead an honest life and stay on the right path, he went to the king for advice.", "problem": "He asks to show others the path; the story says he is tired of idleness and living off his inheritance and seeks advice."}, {"kind": "speech", "image": "Very well. Take this jar of olive oil filled to the brim and walk through the city without spilling even a single drop. If you spill even a drop, you will be punished with death.", "story": "Carry this jar across the city without spilling a drop. If you spill even one, you will pay with your life.", "problem": "“punished with death” for “pay with your life”; “filled to the brim” is extra."}, {"kind": "caption", "image": "The king gave the jar to him for this task and emphasized his order.", "story": "The king sent two soldiers with him to make sure the order was obeyed.", "problem": "Omits the two soldiers."}, {"kind": "speech", "image": "Remember, explore every corner of the city, but do not spill even a drop of the oil. One drop spilled is one step toward death.", "story": "", "problem": "Not in the story; “explore every corner” contradicts watching only the jar."}, {"kind": "speech", "image": "Your Majesty, I walked the whole city as you ordered.", "story": "Your Majesty, I have done exactly as you asked.", "problem": "Different wording."}, {"kind": "speech", "image": "King: Did you see the palace gate or anyone besides the guards?", "story": "What did you see on the way?", "problem": "Asks about the palace gate and guards; the story asks what he saw on the way."}, {"kind": "speech", "image": "Your Majesty, while I was walking, I was so afraid of spilling even a single drop of oil that I saw no one but what was right before me. I was focused only on the jar in my hands.", "story": "Nothing, Your Majesty. I was watching the oil so carefully that I never looked away from the jar.", "problem": "“afraid” and “saw no one but what was right before me” differ from seeing nothing and never looking away."}, {"kind": "caption", "image": "The king was pleased and said he had understood the lesson.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "If wherever you are, whatever task you are given, you do it with full attention, remembering that Allah is watching you, you will never stray from the right path. Then no matter what, you will never deviate from the right path.", "story": "Remember that. Give the same care to what is right, devote yourself to your duties, and remember that Allah sees you. Then you will not lose your way.", "problem": "Repeats “never stray/deviate”; the story says give the same care to what is right and you will not lose your way."}, {"kind": "moral", "image": "Moral: A person who approaches everything with full attention, remembering God is watching, will never stray from the right path.", "story": "A person who gives full attention to what is right and remembers that Allah sees his actions is far less likely to lose his way.", "problem": "“everything” and “God is watching” and “will never stray” differ from attention to what is right, Allah seeing his actions, and being far less likely to lose his way."}], "preview": "../../en/wisdom-stories/illustrations/not-leaving-the-right-path.webp"}, {"stem": "stoning-the-devil", "title": "Stoning the Devil", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Stoning the Devil", "story": "Stoning the Devil", "problem": ""}, {"kind": "caption", "image": "One of the symbolic rituals during Hajj is stoning the devil at a specific time and place to purify oneself.", "story": "During the Hajj, when it was time to cast stones at the devil, one pilgrim began striking himself with the stones instead.", "problem": "Caption explains the ritual; the story is about a pilgrim striking himself."}, {"kind": "speech", "image": "Grandfather, if we stone the devil, will he really be hurt?", "story": "Uncle, why are you hitting yourself with those stones?", "problem": "Different speaker and question."}, {"kind": "speech", "image": "No, my dear. The real devil is within us—our anger, arrogance, jealousy and selfish desires. The real stoning is to purify our own soul.", "story": "My son, why think only of the devil outside us? We must confront the devil within too—curb our selfish desires and purify our hearts.", "problem": "Meaning is related, but wording, address, and details differ."}, {"kind": "moral", "image": "The real struggle is not outside, but with one's own soul. Purifying oneself is more valuable than condemning others.", "story": "The real struggle is not only against evil outside us, but against the uncontrolled desires within. Purifying oneself is harder than condemning others, but far more valuable.", "problem": "Moral is shortened and reworded."}], "preview": "../../en/wisdom-stories/illustrations/stoning-the-devil.webp"}, {"stem": "strength-and-sorrow", "title": "Strength and Pain", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "«Strength and Pain»", "story": "Strength and Pain", "problem": ""}, {"kind": "speech", "image": "O Allah! Grant me strength to bear my pain, or pain according to my strength.", "story": "My God, give me strength enough for my sorrow, or sorrow no greater than I can bear.", "problem": "'Allah', 'pain', and 'according to my strength' replace 'My God', 'sorrow', and 'no greater than I can bear'."}, {"kind": "other", "image": "Muhammad Fuzuli", "story": "Muhammad Fuzuli", "problem": ""}, {"kind": "other", "image": "PAIN", "story": "Strength and Pain", "problem": ""}, {"kind": "caption", "image": "Ask for pain according to your strength,", "story": "or sorrow no greater than I can bear.", "problem": "Not the story's wording."}, {"kind": "other", "image": "STRENGTH", "story": "", "problem": ""}, {"kind": "other", "image": "JUST MEASURE", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "WISDOM", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Ask either for strength to bear your pain, or for pain according to your strength. Do not fall under a burden that exceeds it.", "story": "Moral: In suffering, we may pray for greater strength or a lighter burden.", "problem": "Different wording, and the second sentence is not in the story."}], "preview": "../../en/wisdom-stories/illustrations/strength-and-sorrow.webp"}, {"stem": "beware-of-those-you-love", "title": "Take Care of Those You Love", "category": "Love and marriage", "status": "Needs correction", "items": [{"kind": "title", "image": "Take Care of Those You Love", "story": "Take Care of Those You Love", "problem": ""}, {"kind": "speech", "image": "Sometimes in life we get so busy that we forget what truly matters.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "That's true. Time slips away faster than we realize.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "And one day, we wish we had more of it.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Jamil, do you know what really matters in life?", "story": "Jamil, it is time to go home.", "problem": "Different line to Jamil."}, {"kind": "speech", "image": "Spending time with you, Dad. That's what matters most.", "story": "Five more minutes, Dad, please!", "problem": "Jamil does not say this."}, {"kind": "speech", "image": "That's right, Jamil. Good answer.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Not toys, Dad, not games. Time with you is what matters most.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "No matter how busy we get.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "You're right, dear.", "story": "You are a very patient father.", "problem": "Different reply."}, {"kind": "speech", "image": "When little Jamil becomes older and life gets busy, he may have his own responsibilities and leave home. That time goes by faster than we think.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "And if one day he gets busy with his own life, we might long for these moments.", "story": "Last year my older son, Kamal, was hit nearby by a drunk driver. I had never given him enough of my time.", "problem": "Omits Kamal and the accident."}, {"kind": "speech", "image": "So, let's spend five more minutes together — five more minutes sharing, talking, or just being together. Those five extra minutes today will become precious memories tomorrow.", "story": "He thinks he’s getting five more minutes to play. But I’m the one receiving a gift: five more minutes of happiness watching him.", "problem": "Turns the five minutes into a shared plan for memories."}, {"kind": "moral", "image": "Every extra moment with those you love is a gift. Before it is too late, give them five more minutes today.", "story": "Every extra moment with those you love is a gift. Before it is too late, give them five more minutes today.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/beware-of-those-you-love.webp"}, {"stem": "mockery-is-unacceptable", "title": "Teach Children Not to Mock", "category": "Friendship and human relations", "status": "Needs correction", "items": [{"kind": "title", "image": "Ridicule is unacceptable", "story": "Teach Children Not to Mock", "problem": "Different title."}, {"kind": "caption", "image": "Let's not make fun of others for their differences or appearance.", "story": "it is unacceptable to ridicule or humiliate other people for their differences or appearance.", "problem": "make fun instead of ridicule or humiliate."}, {"kind": "caption", "image": "Everyone is unique in their own way and that's something to celebrate.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Let's choose kindness, it makes us stronger!", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Moral: It is humiliating to ridicule someone else's differences or appearance. We should teach this to our children from a young age.", "story": "We should teach our children from a young age that it is unacceptable to ridicule or humiliate other people for their differences or appearance.", "problem": "humiliating instead of unacceptable; drops humiliate other people."}], "preview": "../../en/wisdom-stories/illustrations/mockery-is-unacceptable.webp"}, {"stem": "mothers-advice-fakir-baykurt-never-forgot", "title": "The Advice Fakir Baykurt Never Forgot", "category": "Family and upbringing", "status": "Needs correction", "items": [{"kind": "title", "image": "Fakir Baykurt's mother's advice", "story": "The Advice Fakir Baykurt Never Forgot", "problem": "Title wording differs."}, {"kind": "caption", "image": "One day, Fakir Baykurt (a Turkish writer, 1929–1999) asked his mother for tea.", "story": "As a child, the Turkish writer Fakir Baykurt (1929–1999) once asked his mother for tea.", "problem": "Drops As a child and once."}, {"kind": "speech", "image": "Mom, can I have some tea?", "story": "", "problem": "The story does not quote this request."}, {"kind": "speech", "image": "Of course, my son, but be careful not to spill it.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Shortly after, in his excitement, Fakir Baykurt, who didn't yet understand the importance of caution, spilled the hot tea on the table.", "story": "Eager to drink, he took a large mouthful before realizing how hot it was. Startled by the pain, he dropped the cup.", "problem": "He drops the cup; he does not spill tea on the table from excitement."}, {"kind": "caption", "image": "Instead of getting angry, his mother understood him with patience. She didn't scold him. She protected his self-confidence with her love.", "story": "He expected his mother to slap him, but she simply asked for another cup.", "problem": "Paraphrase that adds an explanation the story withholds."}, {"kind": "caption", "image": "Baykurt wanted a second glass of tea and asked his mother again. So his mother, without getting upset, gave him another glass.", "story": "she simply asked for another cup.", "problem": "Says he asked again; the story says she asked for another cup."}, {"kind": "caption", "image": "Fakir Baykurt later asked his mother the meaning of her behavior and got a very meaningful answer.", "story": "For years afterward, he asked why she had not punished him. She never answered.", "problem": "The story says she never answered until years later at the school."}, {"kind": "speech", "image": "Mother, why did you treat me so patiently?", "story": "", "problem": "Not the question he asks in the classroom scene."}, {"kind": "speech", "image": "Well, my son, he's just a child.", "story": "It wasn’t bad, son.", "problem": "Different reply."}, {"kind": "speech", "image": "Mother, if he had been careless, did you not think I would be?", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "If I crushed his self-confidence from such a small thing, tomorrow, when he makes a bigger mistake, he might hide it from me. He would become afraid, withdraw into himself, and lose his confidence. And I want him to trust me, ask me, talk to me, and not be afraid to share his mistakes.", "story": "If I had shouted, the lion inside you would have roared back. If I had beaten you, I might have killed that lion.", "problem": "Omits the lion and the stick, and changes the speech."}, {"kind": "moral", "image": "Do not crush a child's self-confidence. True education is given with patience and love, not with fear.", "story": "Don't kill the \"lion\" inside a child — his self-confidence — by beating him. True education is not given with fear, but with patience and love.", "problem": "Drops the lion and beating; second sentence is reordered."}], "preview": "../../en/wisdom-stories/illustrations/mothers-advice-fakir-baykurt-never-forgot.webp"}, {"stem": "ant-that-carries-water", "title": "The Ant Carrying Water", "category": "Parables and fables", "status": "Needs correction", "items": [{"kind": "title", "image": "Water-carrying ant", "story": "The Ant Carrying Water", "problem": "Word order differs and \"The\" is missing."}, {"kind": "caption", "image": "King Namrud, seeing the great fire prepared to burn Prophet Abraham, commanded that it be made even bigger. He ordered more wood to be piled up and the fire to be ignited.", "story": "Nimrod, the biblical ruler of Shinar, wanted to punish the prophet Abraham for standing in the way of his cruelty. He ordered a huge fire to be built in the town square, intending to throw Abraham into it.", "problem": "\"Namrud\" instead of \"Nimrod\", and he orders the fire made bigger rather than built to throw Abraham in."}, {"kind": "caption", "image": "At that moment, a tiny ant picked up a drop of water and started running toward the blaze.", "story": "Meanwhile, an ant hurried toward the fire, carrying a drop of water in its mouth.", "problem": "\"picked up\" and \"running\" differ from carrying the drop in its mouth."}, {"kind": "speech", "image": "Where are you going?", "story": "Where are you going in such a hurry?", "problem": "Missing \"in such a hurry\"."}, {"kind": "speech", "image": "I’m going to put out the fire, by Allah’s will.", "story": "Haven’t you heard? Nimrod is going to throw the prophet Abraham into the fire!", "problem": "Different reply."}, {"kind": "speech", "image": "You, an ant, and that huge fire? What can you do with a drop of water? Are you trying to put out the fire?", "story": "You can’t have seen the size of that fire. There’s nothing to do but run. Do you really think you can put it out with a single drop of water?", "problem": "Different wording."}, {"kind": "speech", "image": "Perhaps I cannot, but I have to stand by the truth with what little I have.", "story": "Even if I can’t put it out, at least everyone will know whose side I’m on.", "problem": "Different wording."}, {"kind": "speech", "image": "Even if I cannot succeed, at least I will be there for Abraham, standing by the truth in his time of trial.", "story": "Even if I can’t put it out, at least everyone will know whose side I’m on.", "problem": "Different wording."}, {"kind": "moral", "image": "Even if you cannot succeed, at least stand by the truth. Being there for a loved one in trouble is a value in itself.", "story": "Moral: Even when you cannot change the outcome, you can stand up for what is right. Being there for someone you love in a time of trouble matters in itself.", "problem": "\"cannot succeed\" / \"stand by the truth\" / \"a value\" differ from \"cannot change the outcome\" / \"stand up for what is right\" / \"matters\"."}], "preview": "../../en/wisdom-stories/illustrations/ant-that-carries-water.webp"}, {"stem": "bedouin-whose-camel-was-stolen", "title": "The Bedouin and the Stolen Camel", "category": "Justice and society", "status": "Needs correction", "items": [{"kind": "title", "image": "The Bedouin whose camel was stolen", "story": "The Bedouin and the Stolen Camel", "problem": "Title wording differs."}, {"kind": "caption", "image": "A Bedouin saw a thirsty stranger in the desert and gave him water.", "story": "A Bedouin riding through the desert came across a man who could barely stand, his lips parched with thirst. The man begged for water. The Bedouin dismounted and gave him a drink.", "problem": "Shortened paraphrase."}, {"kind": "caption", "image": "The stranger drank the water; then, while the Bedouin was not looking, he stole his camel.", "story": "As soon as he had finished, the stranger shoved the Bedouin aside, climbed onto the camel, and rode away.", "problem": "Says the Bedouin was not looking; the story says the stranger shoved him aside."}, {"kind": "speech", "image": "Never tell anyone about this. Do it for me. But do it mostly to protect others’ faith in goodness.", "story": "Take the camel! It’s yours. But never tell anyone what happened here.", "problem": "Drops \"Take the camel! It’s yours\" and adds \"Do it for me.\""}, {"kind": "caption", "image": "The Bedouin was distressed but remained silent.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "If people knew, they might think twice about helping others. I must not take away their trust in human goodness.", "story": "Then people may stop helping strangers in need.", "problem": "Different wording."}, {"kind": "moral", "image": "Sometimes hiding your own harm protects others’ faith in goodness. One bad story can close the door to thousands of good deeds.", "story": "Moral: Sometimes a person bears a loss quietly to protect others’ faith in human kindness. One story of betrayal can discourage countless acts of generosity.", "problem": "\"hiding your own harm\" and \"faith in goodness\" differ from \"bears a loss quietly\" and \"faith in human kindness\"; the second sentence is reworded."}], "preview": "../../en/wisdom-stories/illustrations/bedouin-whose-camel-was-stolen.webp"}, {"stem": "chief-accountant-and-the-ceo", "title": "The Chief Accountant and the CEO", "category": "Work, livelihood, and wealth", "status": "Needs correction", "items": [{"kind": "title", "image": "Chief Accountant and CEO", "story": "The Chief Accountant and the CEO", "problem": "Drops “The” before both titles."}, {"kind": "caption", "image": "Chief accountant says:", "story": "The chief accountant asked the CEO:", "problem": ""}, {"kind": "speech", "image": "I'm afraid that if we invest in training our staff and they leave, that money and effort will go to waste. What do you think?", "story": "What if we spend time and money training our employees, and then they leave?", "problem": "Adds fear, waste, and “What do you think?”"}, {"kind": "caption", "image": "CEO replies:", "story": "The CEO replied:", "problem": ""}, {"kind": "speech", "image": "But what if we don't train them, and they stay? Wouldn't that mean we're failing to meet their expectations as well?", "story": "What if we don't train them, and they stay?", "problem": "Adds a second question about expectations."}, {"kind": "speech", "image": "Investing in people is not a loss. Not spending today can mean a bigger loss tomorrow.", "story": "Investing in people is not a waste. Saving a little on their development today can lead to a much greater loss tomorrow.", "problem": "“loss” and “Not spending” replace “waste” and “Saving a little on their development.”"}, {"kind": "other", "image": "INSIGHT KNOWLEDGE MOTIVATION GROWTH", "story": "", "problem": "Poster words are not in the story."}, {"kind": "moral", "image": "An investment in a person is not a loss. Choosing not to spend today can mean a bigger loss tomorrow.", "story": "Investing in people is not a waste. Saving a little on their development today can lead to a much greater loss tomorrow.", "problem": "Wording differs from the moral."}], "preview": "../../en/wisdom-stories/illustrations/chief-accountant-and-the-ceo.webp"}, {"stem": "church-bell", "title": "The Church Bell", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Church bell", "story": "The Church Bell", "problem": "Missing “The”; “bell” is not capitalized."}, {"kind": "caption", "image": "Commoner 1 ring", "story": "when a commoner died, the church bell rang once", "problem": "Shortened; “1 ring” is not the story’s “rang once”."}, {"kind": "caption", "image": "Noble 2 rings", "story": "for a nobleman, twice", "problem": "“Noble” for “nobleman”; “2 rings” for “twice”."}, {"kind": "caption", "image": "High noble 3 rings", "story": "for a relative of the king, three times", "problem": "“High noble” is not “a relative of the king”."}, {"kind": "caption", "image": "The king 4 rings", "story": "for the king himself, four times", "problem": "“4 rings” for “four times”; “himself” is missing."}, {"kind": "caption", "image": "An unjust verdict is pronounced; the church bell rings five times.", "story": "One day, a court that people trusted to uphold justice wrongfully convicted a citizen. The church bell rang five times.", "problem": "Paraphrase; the wrongful conviction of a trusted court is not stated."}, {"kind": "other", "image": "DING!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Is there any importance to commoners, or only to the king and the powerful?", "story": "Father, who could be more important than the king? Why did the bell ring five times?", "problem": "Different question; it does not ask who is more important than the king or why the bell rang five times."}, {"kind": "speech", "image": "Justice has died — greater than the king.", "story": "Justice. Today, justice has died.", "problem": "Drops “Today” and adds “greater than the king,” which the priest does not say."}, {"kind": "moral", "image": "When justice dies, something greater than the king dies. Stand by the truth so injustice is not ignored.", "story": "When justice dies, something greater than the king dies. Stand by the truth so that injustice does not go unpunished.", "problem": "“is not ignored” instead of “does not go unpunished”; missing “that”."}], "preview": "../../en/wisdom-stories/illustrations/church-bell.webp"}, {"stem": "credit-ledger", "title": "The Credit Ledger", "category": "Work, livelihood, and wealth", "status": "Needs correction", "items": [{"kind": "title", "image": "Loan book", "story": "The Credit Ledger", "problem": "Title does not match."}, {"kind": "speech", "image": "Brother, can you quietly lend me some bread, tea, and sugar?", "story": "Brother, would you let me have some bread, tea, or eggs on credit?", "problem": "Says sugar and “quietly lend,” not eggs on credit."}, {"kind": "other", "image": "Halal goods bring blessing.", "story": "", "problem": "Sign is not in the story."}, {"kind": "speech", "image": "Of course, my brother. Take whatever you need... We all go through hard times. Let's help one another for Allah's sake... If I saw you in need today, tomorrow I might be the one in need. May God bless you.", "story": "Take the bread you need. You don’t have to pay.", "problem": "The shopkeeper’s reason about three orphans is missing."}, {"kind": "thought", "image": "Alhamdulillah, he understood.", "story": "I’ve found what I was looking for", "problem": "Different thought."}, {"kind": "speech", "image": "Do you keep a record of such loans?", "story": "How much do people owe you altogether?", "problem": "He asks for the total, not whether a record exists."}, {"kind": "speech", "image": "Why wouldn't I?", "story": "Why do you want to know?", "problem": "Different question."}, {"kind": "speech", "image": "Yes, brother, many take advantage and never return... That's why I keep a record in this book. So when someone is able, they can pay back.", "story": "There’s a man who has been taking bread on credit for three months. To be honest, I doubt he can pay. But he’s caring for three orphans.", "problem": "The orphans and the ledger total are missing."}, {"kind": "speech", "image": "Brother, may Allah repay you. I am going through a difficult time... I lost my job, and I am a man with honor. I would rather die than beg. Helped me like this. May Allah reward you. May He keep people like you in His protection.", "story": "I want to buy that ledger. I’ve paid everyone’s debts.", "problem": "He pays the debts in the story; he does not beg because he lost a job."}, {"kind": "speech", "image": "Dear child, here, take this, get some bread, and tea. Give this to your mother. May Allah provide for you and your family.", "story": "Come, my child. Take the bread, the eggs, and some butter too. Tell your mother that uncle has already been here.", "problem": "Gives money for bread and tea instead of bread, eggs, and butter."}, {"kind": "speech", "image": "Thank you, sir. May Allah reward you too. Amen.", "story": "Mama asks for a loaf of bread and three eggs for iftar. We’ll pay you next month, when my uncle comes.", "problem": "The girl’s request is replaced by thanks."}, {"kind": "moral", "image": "A kindness done silently is the highest kindness. Forgiving debt and not leaving an orphan hungry is true richness of heart.", "story": "Kindness given quietly has a special worth. Relieving someone’s debt and keeping an orphan from hunger reveal a truly generous heart.", "problem": "“highest kindness” and “richness of heart” are stronger and different from the story."}], "preview": "../../en/wisdom-stories/illustrations/credit-ledger.webp"}, {"stem": "dervishs-clothes", "title": "The Dervish’s Appearance", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "The Dervish's Dress", "story": "The Dervish’s Appearance", "problem": "Title says Dress instead of Appearance."}, {"kind": "speech", "image": "Why is the dervish's dress so untidy?", "story": "Why are your clothes so untidy?", "problem": "Spoken about the dervish, not to him, and uses dress."}, {"kind": "speech", "image": "I focus on purifying my heart rather than keeping my clothes neat.", "story": "I spend so much time working on my inner self that I have little time left to worry about my appearance.", "problem": "Paraphrase, not the story sentence."}, {"kind": "moral", "image": "What makes a person beautiful is not clothes, but the purity of the heart and the light of the soul.", "story": "What truly makes a person beautiful is not clothing, but a pure heart and a luminous spirit.", "problem": "Close paraphrase; words differ (clothes/clothing, purity of the heart/a pure heart, light of the soul/luminous spirit)."}], "preview": "../../en/wisdom-stories/illustrations/dervishs-clothes.webp"}, {"stem": "dervishs-spoons", "title": "The Dervish’s Long Spoons", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Dervish Spoons", "story": "The Dervish’s Long Spoons", "problem": "Missing “The” and “Long,” and the possessive “Dervish’s”."}, {"kind": "speech", "image": "Esteemed dervish, why are these spoons so long?", "story": "What is the difference between people who truly love and those who merely talk about love?", "problem": "Asks about spoon length instead of the difference between true love and talk of love."}, {"kind": "speech", "image": "Let me show you.", "story": "Wait, and I’ll show you.", "problem": "Missing “Wait, and”."}, {"kind": "caption", "image": "At this feast, everyone is given a long spoon.", "story": "First came bowls of hot soup, then unusually long spoons.", "problem": "Omits the hot soup and “unusually.”"}, {"kind": "speech", "image": "You must try to feed the person across from you.", "story": "You must hold your spoons at the very end of the handle.", "problem": "States a different rule from holding the spoon at the end of the handle."}, {"kind": "caption", "image": "Those who try to eat for themselves cannot reach their mouths — and remain hungry.", "story": "They tried again and again, but the spoons were too long to bring to their own mouths. Soup spilled over them, they burned themselves, and at last they left the table hungry and embarrassed.", "problem": "Shortened; omits spilling, burns, and embarrassment."}, {"kind": "caption", "image": "Afterward, the dervish asks who is still hungry.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Those who fed the person across from them are satisfied — and so is the other.", "story": "This time, each person filled a spoon and held it out to someone across the table. They fed one another, laughed together, and rose from the table well fed and grateful.", "problem": "Shortened paraphrase; omits laughter and gratitude."}, {"kind": "speech", "image": "Do you see? In life, you can't live only for yourself — you will stay hungry. But if you think of others, life becomes full — and everyone is satisfied.", "story": "Now you see. At the table of life, those who think only of themselves may go hungry. Those who reach out to others are nourished in return. We gain from giving as well as receiving.", "problem": "Different wording; “life becomes full” and “everyone is satisfied” are not the story’s “nourished in return.”"}, {"kind": "moral", "image": "Whoever thinks only of himself stays hungry; whoever feeds the person in front is also satisfied. The giver wins.", "story": "Those who think only of themselves may remain hungry at life’s table. Those who care for others are nourished in return. Giving is its own reward.", "problem": "“feeds the person in front is also satisfied” and “The giver wins” differ from “nourished in return” and “Giving is its own reward.”"}], "preview": "../../en/wisdom-stories/illustrations/dervishs-spoons.webp"}, {"stem": "dervishs-robe", "title": "The Dervish’s Robe", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Dervish’s Robe", "story": "The Dervish’s Robe", "problem": "Missing “The”."}, {"kind": "speech", "image": "Your Majesty, I was wounded by a hunter yesterday. I came to you for justice and protection.", "story": "One day a wounded bird came before the king and complained that a dervish had broken its wing.", "problem": "Says a hunter wounded it yesterday; the story says a dervish broke its wing."}, {"kind": "speech", "image": "Go and bring me that dervish. I want to ask him something.", "story": "The king immediately summoned the dervish.", "problem": "Extra dialogue not in the story."}, {"kind": "speech", "image": "Your Majesty, look at a person's actions, not at his clothes. A dervish is not recognized by his robe. True dervishhood lies in the heart — not in what a person wears.", "story": "The appearance of holiness does not make a person righteous. Judge people by their actions, not their clothing; a robe alone does not make a dervish.", "problem": "This moral is spoken in the scene; the story’s dialogue is the dervish’s defense and the bird’s request to take the robe."}, {"kind": "speech", "image": "What a wise man! Bring him here. I want to test whether he is truly a dervish.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "For the sake of justice, Your Majesty, I beg you: If he really is a dervish, he will certainly help me. But if he is only wearing a robe, I will lose all hope of life.", "story": "When his arm heals, he may do the same thing again. Take away his dervish’s robe instead, so that other birds won’t be deceived as I was.", "problem": "Different plea; the bird asks that the robe be taken so other birds are not deceived."}, {"kind": "speech", "image": "Yes, bring the dervish here!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "I am waiting, Your Majesty!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Well?", "story": "Why not?", "problem": "Different question."}, {"kind": "speech", "image": "He didn't ignore me, Your Majesty. He listened to my pain, understood it, and came here thinking only of helping me.", "story": "Because he was dressed as a dervish. If he had looked like a hunter, I would have flown away at once. But I thought, ‘A dervish fears Allah. Surely he won’t hurt me.’", "problem": "Praises the dervish; the story says the bird stayed because it trusted the robe and was hurt."}, {"kind": "moral", "image": "Outward holiness does not make a person genuine. Look at actions, not clothes.", "story": "The appearance of holiness does not make a person righteous. Judge people by their actions, not their clothing; a robe alone does not make a dervish.", "problem": "“genuine” for “righteous”; the robe sentence is missing."}], "preview": "../../en/wisdom-stories/illustrations/dervishs-robe.webp"}, {"stem": "diderot-effect", "title": "The Diderot Effect", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "Diderot effect", "story": "The Diderot Effect", "problem": "Missing “The.”"}, {"kind": "caption", "image": "In the 18th century, Denis Diderot, the famous writer and philosopher, was in debt.", "story": "The eighteenth-century French writer and Enlightenment thinker Denis Diderot fell deeply into debt.", "problem": "Drops French and Enlightenment."}, {"kind": "other", "image": "BORROWED MONEY", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "A wealthy friend offered him a gift: a gorgeous red velvet robe. Diderot accepted gratefully.", "story": "Then one day, a friend gave him a luxurious red velvet robe.", "problem": "Adds “wealthy” and “gorgeous.”"}, {"kind": "speech", "image": "Your kindness, my dear friend, warms my heart.", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "A LUXURIOUS RED VELVET ROBE", "story": "a luxurious red velvet robe", "problem": ""}, {"kind": "speech", "image": "Wear it in good health, my dear Diderot.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "At first, he was delighted with his new robe and proud to wear it.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "What a beautiful robe! I look splendid!", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "But as he wore it, he noticed everything around him no longer matched it— his chair, his desk, even his old books.", "story": "Suddenly, he noticed how shabby his desk looked beside the fine velvet.", "problem": "Adds chair, books, and everything around him."}, {"kind": "thought", "image": "Everything seems mismatched, unworthy of this robe.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Soon he wanted to replace his rug, then his curtains, then his wallpaper...", "story": "But now the old carpet seemed out of place beside both the robe and the desk, so he bought a new one too.", "problem": "Adds curtains and wallpaper; the desk purchase is missing here."}, {"kind": "speech", "image": "This rug doesn't do justice to the robe.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Then the chair, the table, the clock, the paintings— everything had to be worthy of the robe.", "story": "The armchairs, cupboards, chairs, paintings, and ornaments all looked old and mismatched.", "problem": "Different list."}, {"kind": "caption", "image": "Diderot realized he was no longer in charge of his choices— the robe was.", "story": "Eventually he realized that his endless desire for more had brought him back to where he had started.", "problem": "Different realization."}, {"kind": "speech", "image": "The robe now governs what I think I need.", "story": "“I was the master of my old robe, but I became the slave of the new one.”", "problem": "Different sentence."}, {"kind": "caption", "image": "What began as a generous gift now leads him down a path of endless wants.", "story": "One purchase led to another.", "problem": "Different wording."}, {"kind": "other", "image": "Result: The robe has turned into a chain of desires.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "This is called the Diderot effect.", "story": "This is known as the Diderot effect.", "problem": ""}, {"kind": "moral", "image": "After a new thing, greed wants to change the rest— the Diderot effect. Better master of the old than slave of the new.", "story": "Buying something new can make us feel compelled to replace everything around it. This is known as the Diderot effect. Desire has no natural stopping point; it is better to own modest possessions than to be ruled by luxurious ones.", "problem": "Different wording."}], "preview": "../../en/wisdom-stories/illustrations/diderot-effect.webp"}, {"stem": "donkeys-law", "title": "The Donkey’s Law", "category": "Parables and fables", "status": "Needs correction", "items": [{"kind": "title", "image": "The donkey’s law", "story": "The Donkey’s Law", "problem": ""}, {"kind": "caption", "image": "One day, the animals of the forest were having a meeting. For no reason, they made the donkey the king: he was neither wise nor good, but they chose him because he amused them.", "story": "One day, a donkey became king of the forest.", "problem": "Adds a meeting and that they chose him because he amused them."}, {"kind": "caption", "image": "The new king set a silly law: everyone must go to bed at sunset.", "story": "he decreed that everyone must go to bed at six in the evening and rise at six in the morning.", "problem": "\"at sunset\" replaces six in the evening until six in the morning, and the silence rule is missing."}, {"kind": "caption", "image": "One morning, the rooster crowed at dawn and the king called a court. They asked the rooster why he broke the law. He replied that he cannot stop crowing. The court did nothing. And so the useless law lived on, because no one spoke against it.", "story": "Then one morning, a rooster began crowing at five. The forest erupted in uproar. A court was hastily convened, and the donkey sentenced the rooster to death.", "problem": "The rooster is not punished; the story sentences him to death."}, {"kind": "speech", "image": "O king, you are neither wise nor brave. You made the animals obey a silly law. Why? Some fear you, some hope for favors, and others are so used to it that they think it’s right. That’s why this law still stands, and our animals suffer because of it.", "story": "You have little time left, and there is something we want to know. What was the wisdom behind your law about sleeping from six until six?", "problem": "The lion’s speech is different."}, {"kind": "speech", "image": "You are right. If I had learned this earlier, I would not have made this law. But now that the animals have accepted it, who will dare break against it?", "story": "I’ve wondered about that myself for years. Why did all the wild animals follow like sheep a law born of nothing more than a donkey’s foolishness?", "problem": "The donkey’s reply is different."}, {"kind": "moral", "image": "Moral: What keeps a meaningless law standing is not the ruler’s power, but the silence of those who obey it. Many times in life, a wrong seems like the truth because nobody speaks against it. So dare to question: for silence is the breath that keeps a useless law alive.", "story": "Moral: A senseless law survives not only through a ruler’s power, but through the silence of those who obey it. An order is not necessarily wise. Do not be afraid to question it; nonsense left unchallenged can become an accepted rule.", "problem": "\"is not the ruler’s power\" drops \"not only\"; the rest of the moral is rewritten."}, {"kind": "moral", "image": "What keeps a meaningless law standing is not the ruler’s power, but the silence of those who obey it.", "story": "A senseless law survives not only through a ruler’s power, but through the silence of those who obey it.", "problem": "\"meaningless\" / \"standing is not\" differ from \"senseless\" / \"survives not only through\"."}], "preview": "../../en/wisdom-stories/illustrations/donkeys-law.webp"}, {"stem": "light-of-the-universe", "title": "The Door of the Heart", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Light of the Universe", "story": "The Door of the Heart", "problem": "Title is the painting’s name, not “The Door of the Heart.”"}, {"kind": "other", "image": "ROYAL ACADEMY", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Royal Academy of Arts London", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "The great British artist William Holman Hunt exhibited his painting “Light of the Universe” at the Royal Academy in London. At night, by the light of a lantern, a figure stands before a door. There is no handle on that door. Only someone inside can open it.", "story": "A story about the British painter William Holman Hunt describes a picture of a figure standing at a closed door at night, holding a lantern in one hand and knocking with the other.", "problem": "Adds an exhibition at the Royal Academy and the title “Light of the Universe”; the story does not name the painting that way."}, {"kind": "speech", "image": "Wonderful painting, but I don’t understand something. The door has no handle. How is anyone expected to open it? Perhaps no one can?", "story": "It’s a beautiful painting, but how can that door open? Have you forgotten to paint a handle?", "problem": "Different wording; “Perhaps no one can?” is not the critic’s question."}, {"kind": "speech", "image": "It is not a door of wood. It is the door of the human heart. It opens only from the inside. The handle is on the inside, and no one on the outside can turn it.", "story": "This is no ordinary door. It represents the human heart, and it opens only from within. There is no handle outside. Unless someone opens it for you, you cannot enter.", "problem": "“door of wood,” “handle is on the inside,” and “no one on the outside can turn it” differ from no handle outside and entering only if someone opens it."}, {"kind": "moral", "image": "The door of the heart opens only from the inside. Love and goodness do not force their way in — you must let them in.", "story": "The door of the heart opens only from the inside. Love and goodness do not force their way in - you must let them in yourself.", "problem": "Missing “yourself.”"}], "preview": "../../en/wisdom-stories/illustrations/light-of-the-universe.webp"}, {"stem": "blind-well", "title": "The Dry Well", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "Blind Well", "story": "The Dry Well", "problem": "Different title."}, {"kind": "caption", "image": "A donkey falls into a dry well.", "story": "One day, a villager’s donkey fell into a dry well.", "problem": "Drops “a villager’s.”"}, {"kind": "caption", "image": "The owners decide to bury him under the earth.", "story": "They saw no option but to fill the well with earth.", "problem": "“bury him” instead of filling the well."}, {"kind": "caption", "image": "The donkey shakes the earth under its feet and rises.", "story": "The donkey shook each shovelful of earth off its back and stepped onto it.", "problem": "Different action."}, {"kind": "caption", "image": "He shakes off the earth and gets out of the well.", "story": "Little by little, the rising ground carried it higher, until it reached the rim and climbed out.", "problem": "Shortened."}, {"kind": "moral", "image": "Shake off the earth that falls on you and rise. The way out of helplessness is not whining, but struggle.", "story": "Shake off the burdens that fall on you and use them to climb higher. When you feel helpless, action and perseverance can reveal a way out.", "problem": "“whining” and “struggle” are not the story moral."}], "preview": "../../en/wisdom-stories/illustrations/blind-well.webp"}, {"stem": "elephant-and-the-rope", "title": "The Elephant and the Rope", "category": "Parables and fables", "status": "Needs correction", "items": [{"kind": "title", "image": "Elephant and Rope", "story": "The Elephant and the Rope", "problem": "Missing \"The\" and \"the\"."}, {"kind": "caption", "image": "A traveler saw a giant elephant tied by a thin rope to a small stake — no chain, no cage.", "story": "A traveler passing an elephant enclosure was surprised to see the enormous animals tethered by one front leg with only a short rope. There were no chains or cages.", "problem": "Singular \"giant\" elephant, \"thin rope\", and \"small stake\" differ from the story."}, {"kind": "caption", "image": "He asked the trainer; the man smiled and explained.", "story": "He asked a nearby trainer why they stayed so obediently.", "problem": "Drops the question about why they stayed."}, {"kind": "thought", "image": "When young, elephants are tied with such a rope. They try to break free, but fail. Gradually they learn they cannot escape.", "story": "When they’re young, a rope like that is strong enough to hold them. As they grow, they keep believing they can’t break it.", "problem": "Different explanation of why they stay."}, {"kind": "caption", "image": "As they grow, the rope could be a thousand times weaker, yet they still believe they cannot break free.", "story": "They never realize they now have the strength to free themselves.", "problem": "\"a thousand times weaker\" is not in the story."}, {"kind": "thought", "image": "I CAN'T", "story": "", "problem": "Not in the story."}, {"kind": "thought", "image": "IT'S IMPOSSIBLE", "story": "", "problem": "Not in the story."}, {"kind": "thought", "image": "NOT FOR ME", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "They grow up with beliefs born frm failure — beliefs they no longer question and fail to see.", "story": "Often we are held back by beliefs formed through past failures.", "problem": "\"frm\" is a spelling error for \"from\", and the sentence is reworded."}, {"kind": "caption", "image": "Often it is not the rope that binds us, but distrust from past failures. Freedom needs overcoming old fear.", "story": "Often we are held back by beliefs formed through past failures. To become free, we must also overcome the fear of what others might say.", "problem": "\"distrust\" replaces \"beliefs\"; the fear of what others might say is missing."}], "preview": "../../en/wisdom-stories/illustrations/elephant-and-the-rope.webp"}, {"stem": "most-beautiful-portion", "title": "The Finest Blessing", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "The most beautiful blessing", "story": "The Finest Blessing", "problem": "Title wording differs."}, {"kind": "speech", "image": "What is the most beautiful blessing, Master?", "story": "What is the finest blessing a person can receive?", "problem": "Uses beautiful instead of finest, and adds Master."}, {"kind": "speech", "image": "A sincere listener who wants to hear you.", "story": "To meet someone who truly wants to listen.", "problem": "Wording differs."}, {"kind": "moral", "image": "The most beautiful blessing is a person who wants to listen to you sincerely. Being listened to is another name for being loved.", "story": "Being listened to with care is a form of being loved.", "problem": "First sentence is not the story moral; second sentence is reworded."}], "preview": "../../en/wisdom-stories/illustrations/most-beautiful-portion.webp"}, {"stem": "most-beautiful-gift", "title": "The Finest Gifts", "category": "Family and upbringing", "status": "Needs correction", "items": [{"kind": "title", "image": "The best gift", "story": "The Finest Gifts", "problem": "Title does not match."}, {"kind": "caption", "image": "For a father — honor; for a mother — respect; for a child — compassion.", "story": "For a father — honor, For a mother — respect, For a child — compassion,", "problem": ""}, {"kind": "caption", "image": "For a life partner — love; for a friend — loyalty; for society — service.", "story": "For a spouse — love, For a friend — loyalty, For society — service,", "problem": "“Life partner” instead of “spouse.”"}, {"kind": "caption", "image": "For faith — prayer; for the world — responsibility; for the hereafter — striving for a better tomorrow.", "story": "For the deceased — prayer, For the world — humanity, For the hereafter—good deeds in this life.", "problem": "Faith, responsibility, and striving for a better tomorrow replace the deceased, humanity, and good deeds."}, {"kind": "other", "image": "A BETTER WORLD TOMORROW", "story": "", "problem": "Sign text is not in the story."}, {"kind": "other", "image": "HONOR", "story": "For a father — honor", "problem": ""}, {"kind": "other", "image": "RESPECT", "story": "For a mother — respect", "problem": ""}, {"kind": "other", "image": "LOYALTY", "story": "For a friend — loyalty", "problem": ""}, {"kind": "other", "image": "SERVICE", "story": "For society — service", "problem": ""}, {"kind": "moral", "image": "Every relationship has its best gift: honor for a father, respect for a mother, loyalty for a friend, service for humanity.", "story": "Every relationship has its own best gift: honor for a father, respect for a mother, loyalty to a friend, service to humanity.", "problem": "Missing “own”; “loyalty for” instead of “loyalty to.”"}], "preview": "../../en/wisdom-stories/illustrations/most-beautiful-gift.webp"}, {"stem": "flower-of-honesty", "title": "The Flower of Honesty", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "The Flower of Honesty", "story": "The Flower of Honesty", "problem": ""}, {"kind": "speech", "image": "I must marry before I take the throne. The one who returns with honesty and a true flower shall be my queen.", "story": "Before a prince could take the throne, tradition required him to marry. He invited the most beautiful young women in the country to the palace to choose a bride.", "problem": "Replaces choosing a bride, and later a seed, with returning with a flower of honesty."}, {"kind": "speech", "image": "Mother, shall I go and try my luck?", "story": "The daughter of a palace servant loved the prince and wanted to attend.", "problem": "Different dialogue."}, {"kind": "speech", "image": "My dear, if you go, bring back what is true and real.", "story": "Her mother tried to dissuade her, but the young woman was determined.", "problem": "The mother encourages her; in the story the mother tries to dissuade her."}, {"kind": "speech", "image": "Go with a pure heart, my child.", "story": "Her mother tried to dissuade her, but the young woman was determined.", "problem": "Not in the story."}, {"kind": "speech", "image": "Go everywhere in the world and bring back a flower. The one who returns with honesty and a true flower shall be my chosen queen.", "story": "“Plant this and return in six months,” he said. “I will marry the woman who grows the most beautiful flower.”", "problem": "A search for a flower replaces planting a seed."}, {"kind": "speech", "image": "Everyone is searching far and wide, so the precious flower will be rare. Oh, kind people, please give me a hint of where I might find it.", "story": "The servant’s daughter planted her seed and tended it carefully, but nothing sprouted.", "problem": "She searches for a rare flower; in the story her seed does not sprout."}, {"kind": "caption", "image": "From morning till night, they looked in every place, but they could not find the flower of honesty.", "story": "Six months later, she returned with an empty pot. All the other women carried beautiful flowers.", "problem": "Says no one found a flower; in the story the others brought flowers and she brought an empty pot."}, {"kind": "speech", "image": "Princess, you have returned from everywhere. Tell me, did you find the flower of honesty?", "story": "The prince walked through the hall, examining every pot. Then he announced that he had chosen the servant’s daughter.", "problem": "Different scene and question."}, {"kind": "speech", "image": "Alas! We searched far and near, but could not find it anywhere.", "story": "All the other women carried beautiful flowers.", "problem": "The others say they found nothing; in the story they brought flowers."}, {"kind": "speech", "image": "I did not find the flower of honesty. But I brought back an honest heart. Honesty is a flower that grows within a person, and it cannot be picked.", "story": "“She has brought me the most precious flower of all: honesty. None of the seeds I gave you could grow.”", "problem": "She explains an honest heart; in the story the prince reveals that none of the seeds could grow."}, {"kind": "moral", "image": "The most valuable decoration is honesty. A person is exalted by a true word and a clear conscience.", "story": "Moral: Honesty is more valuable than any outward display. Truthfulness and a clear conscience reveal a person’s worth.", "problem": "'decoration' and 'exalted by a true word' replace 'outward display' and 'reveal a person’s worth'."}], "preview": "../../en/wisdom-stories/illustrations/flower-of-honesty.webp"}, {"stem": "former-minister-at-the-seminar", "title": "The Former Minister’s Cup", "category": "Work, livelihood, and wealth", "status": "Needs correction", "items": [{"kind": "title", "image": "Former Minister at Seminar", "story": "The Former Minister’s Cup", "problem": "Title omits the cup."}, {"kind": "other", "image": "LEADERSHIP AND INFLUENCE SEMINAR", "story": "speak at a seminar", "problem": "Seminar name is not in the story."}, {"kind": "caption", "image": "A former minister attended a seminar. The speaker held a plastic cup of water and began his talk.", "story": "He stepped up to the lectern holding a plastic cup", "problem": "Calls it a cup of water and splits the minister from the speaker."}, {"kind": "caption", "image": "He remembered... when he was in office. Businessmen... officials... always at his service.", "story": "I flew business class. A limousine and escort cars met me at the airport", "problem": "Not the story’s details."}, {"kind": "other", "image": "HOTEL", "story": "a luxury hotel suite", "problem": ""}, {"kind": "other", "image": "TAXI", "story": "I took a taxi to the hotel", "problem": ""}, {"kind": "other", "image": "ATM", "story": "", "problem": "The story has a coffee machine, not an ATM."}, {"kind": "other", "image": "SORRY, SIR. NO RESERVATION IN THE BOOKING SYSTEM", "story": "they checked my name on a list and let me in", "problem": "Sign contradicts the story, where he is let in."}, {"kind": "caption", "image": "But now... the ticket I bought at the counter... The hotel said no reservation... the ATM showed no balance. No one met him. Respect was for his position, not for him.", "story": "No one met me at the airport. I took a taxi to the hotel and found my own room.", "problem": "Adds a refused reservation and an empty ATM."}, {"kind": "speech", "image": "Think about it, when you hold a high position, people honor you, value you, and listen to you.", "story": "The praise, privileges, and special treatment that come with office belong to the position, not to the person holding it.", "problem": "Different wording."}, {"kind": "speech", "image": "When I held this important role, this cup of water was treated with great care, presented with respect. But now, for its true value — it's just an ordinary plastic cup of water. Today, I understand: respect was for the position I held, not for me as a person.", "story": "Last year’s porcelain cup wasn’t for me. It was for my position. Once you leave, the porcelain cup becomes a plastic one.", "problem": "Calls both cups water and changes the contrast."}, {"kind": "moral", "image": "Respect is often for your position, not for you. True value is seen when you leave the title.", "story": "The respect shown to you is often for your position, not for yourself. Therefore, do not brag about your position — your true value will be seen when you leave.", "problem": "Drops the warning not to brag and says “the title.”"}], "preview": "../../en/wisdom-stories/illustrations/former-minister-at-the-seminar.webp"}, {"stem": "fortieth-day-rite", "title": "The Fortieth Day", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Forty days", "story": "The Fortieth Day", "problem": "“Forty days” is not “The Fortieth Day.”"}, {"kind": "caption", "image": "In Turkish tradition, after a baby is born, the mother and baby stay at home for forty days. They rest and recover.", "story": "In some Turkic communities, tradition keeps a mother and newborn at home without visitors for forty days after the birth. The custom is said to date back to the Göktürks.", "problem": "“Turkish” for “Turkic”; “rest and recover” replaces “without visitors” and the Göktürk origin."}, {"kind": "other", "image": "40 DAYS", "story": "", "problem": "Label is not story wording."}, {"kind": "caption", "image": "On the fortieth day, the baby is introduced to relatives and loved ones. They visit with good wishes and bring gifts.", "story": "On the fortieth day, a close relative invites the mother and baby to visit and presents symbolic gifts", "problem": "The baby is introduced to visitors; the story has a relative invite the mother and baby and present symbolic gifts."}, {"kind": "other", "image": "Best wishes to the baby!", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Traditional gifts (symbolic items)", "story": "presents symbolic gifts", "problem": ""}, {"kind": "other", "image": "Money (wealth and abundance)", "story": "coins for prosperity", "problem": "“wealth and abundance” is broader than “prosperity.”"}, {"kind": "other", "image": "Sweets (joy and delight)", "story": "sugar for sweet words and a cheerful face", "problem": "“joy and delight” is not “sweet words and a cheerful face.”"}, {"kind": "other", "image": "Essential items (blessings)", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Rice (sustenance)", "story": "wheat for abundance at home", "problem": "Shows rice for sustenance; the story says wheat for abundance."}, {"kind": "other", "image": "Salt (purity)", "story": "salt for a life that never loses its flavor", "problem": "“purity” is not “a life that never loses its flavor.”"}, {"kind": "other", "image": "Eggs (new life, prosperity)", "story": "eggs for nourishment and strength", "problem": "“new life, prosperity” is not “nourishment and strength.”"}, {"kind": "moral", "image": "Blessing and love are hidden in our customs. Gifts for a baby are beautiful wishes for a whole life.", "story": "Customs can hold generations of love and blessings. A baby’s gifts express hopes for an entire lifetime.", "problem": "Different wording: “hidden in our customs” and “beautiful wishes” instead of “generations of love and blessings” and “hopes for an entire lifetime.”"}], "preview": "../../en/wisdom-stories/illustrations/fortieth-day-rite.webp"}, {"stem": "candles-conversation", "title": "The Four Candles", "category": "Word, silence, and communication", "status": "Needs correction", "items": [{"kind": "title", "image": "The Conversation of the Candles", "story": "The Four Candles", "problem": "Different title."}, {"kind": "caption", "image": "One evening, four candles burned side by side. They were called Faith, Loyalty, Love, and Hope.", "story": "Four candles burned in a room so quiet that their voices could be heard.", "problem": "Different opening."}, {"kind": "speech", "image": "I'm FAITH! People don't believe in me anymore. I think I'll fade away.", "story": "“I am FAITH. But no one helps me keep burning. I think I will soon go out.”", "problem": "Different speech."}, {"kind": "caption", "image": "FAITH went out.", "story": "Its flame dwindled until it went out altogether.", "problem": "Wording differs."}, {"kind": "speech", "image": "I'm LOYALTY! No one is loyal anymore. I think I'll go out now. Soon, no one will remember me.", "story": "“I am LOYALTY. Sadly, no one seems to need me anymore. There is no reason for me to keep burning.”", "problem": "Different speech."}, {"kind": "caption", "image": "LOYALTY went out.", "story": "As soon as it finished speaking, a gentle breeze put it out.", "problem": "Omits the breeze."}, {"kind": "speech", "image": "I'm LOVE! People don't care anymore. They are selfish, rude and heartless. I think I'll go out too.", "story": "“I am LOVE. I have no strength left to burn. People have forgotten my worth. They have even forgotten to love those closest to them.”", "problem": "Different speech."}, {"kind": "caption", "image": "LOVE went out.", "story": "And with that, LOVE went out too.", "problem": ""}, {"kind": "speech", "image": "Why are you burning out? Without you, the evening is dark!", "story": "“Why aren’t you burning? Weren’t you supposed to burn forever?”", "problem": "Different question."}, {"kind": "speech", "image": "Don't worry, I still have hope. With it, I'll light you again.", "story": "“Don’t be afraid. As long as I am burning, we can light the others again. I am HOPE.”", "problem": "Does not say “I am HOPE.”"}, {"kind": "moral", "image": "When faith, loyalty and love go out, hope lights them again. Keep hope alive and other values return.", "story": "When faith, loyalty, and love fade, hope can rekindle them. Keep hope alive, and the others can return.", "problem": "“go out”/“lights”/“other values” instead of fade/rekindle/the others."}], "preview": "../../en/wisdom-stories/illustrations/candles-conversation.webp"}, {"stem": "friendship-of-horses", "title": "The Friendship of Horses", "category": "Friendship and human relations", "status": "Needs correction", "items": [{"kind": "title", "image": "The Friendship of Horses", "story": "The Friendship of Horses", "problem": ""}, {"kind": "caption", "image": "On a farm, two horses lived together; one was healthy, the other was blind.", "story": "Two horses live on a farm near my house. From a distance, they look quite ordinary. Up close, you notice something unusual: one is blind.", "problem": "Wording and meaning differ: image says one was healthy; story says they look ordinary and one is b
