or-anything.webp"}, {"stem": "if-fate-allows-we-will-meet", "title": "If Fate Allows", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "If fate allows, we’ll meet", "story": "If Fate Allows", "problem": "Adds “we’ll meet.”"}, {"kind": "caption", "image": "A person says “if fate allows” instead of meeting his loved ones today. There’s a subtle coldness in that.", "story": "Someone who used to say, “We’ll meet soon,” now says, “We’ll meet if fate allows.” I find that strange.", "problem": "Different situation and feeling; “subtle coldness” is not “I find that strange.”"}, {"kind": "caption", "image": "I don’t change, yet he wants to meet someone else. There must be something bigger than me. “If fate allows” actually hides a kind of goodbye.", "story": "Yet those words seem to place a barrier between us.", "problem": "Adds that he wants to meet someone else and that the phrase hides a goodbye."}, {"kind": "caption", "image": "If it’s not his part, if I’m only one of many, if he has someone else in mind, should I even stay in his place trying to force a presence?", "story": "Do our two fates know each other? Can they arrange a meeting on our behalf?", "problem": "Different questions about being one of many and forcing a presence."}, {"kind": "caption", "image": "Perhaps there’s no place in his heart for me, and maybe distance is mercy. Isn’t this the essence of “if fate allows”? I’ve never loved in order to be “if fate allows.”", "story": "Perhaps fate has nothing to do with it. Perhaps this is simply another way of saying, “Out of sight, out of mind.” I have never liked the phrase “if fate allows.”", "problem": "“no place in his heart” and “distance is mercy” replace “Out of sight, out of mind” and “I have never liked the phrase.”"}, {"kind": "moral", "image": "Moral: Don’t let the coldness between you and your loved ones linger. Don’t postpone — meet today, take heart today.", "story": "Do not let distance grow between you and those you care about. Instead of leaving a meeting to fate, make time for one another.", "problem": "“coldness” and “meet today, take heart today” differ from letting distance grow and making time."}], "preview": "../../en/wisdom-stories/illustrations/if-fate-allows-we-will-meet.webp"}, {"stem": "forbidden-money", "title": "Ill-Gotten Money", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Haram money", "story": "Ill-Gotten Money", "problem": "“Haram money” is not the title “Ill-Gotten Money.”"}, {"kind": "caption", "image": "One day, on his way, he saw some money fall to the ground. He looked around. No one was there. He picked it up and put it in his pocket.", "story": "One day, I saw a man drop some money in the street. Usually I would have called out, “You’ve dropped your money!” This time, temptation got the better of me. I picked it up and slipped it into my pocket.", "problem": "Third person, and it omits the usual call and the temptation."}, {"kind": "speech", "image": "At home, he told his wife happily about what happened.", "story": "When I got home, I told my wife the story.", "problem": "Adds “happily.”"}, {"kind": "speech", "image": "I found some money on the street today. No one saw me.", "story": "", "problem": "Not the story’s wording."}, {"kind": "speech", "image": "May it bring us good luck. We can use it.", "story": "Add a little of our own and let’s go to the movies.", "problem": "The wife does not say this; she suggests adding their own money and going to the movies."}, {"kind": "caption", "image": "He said this, but deep down he knew it wasn’t right; his heart felt uneasy.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "I can’t focus on my work. I keep thinking about that money, wondering whose it might be and what condition that person is in. I can’t sleep at night. The more I think about it, the more anxious I feel. For this reason, I’ve decided to return the money.", "story": "", "problem": "He decides to return the money; in the story he keeps it, loses a job, and pays for the outing and medical bills."}, {"kind": "caption", "image": "The very next day, he went to the people in the neighborhood and said: “I found this money yesterday. It belongs to someone. I’m returning it.”", "story": "", "problem": "He returns the money; the story never has him return it."}, {"kind": "caption", "image": "They thanked him, bought movie tickets, popcorn, and drinks, and invited him to a movie. That day, they spent happy time together and thanked him again and again. His heart overflowed with joy.", "story": "At the cinema, I bought two more tickets and popcorn for everyone.", "problem": "They pay and thank him; in the story he pays and the outing costs him dearly."}, {"kind": "other", "image": "TAXI", "story": "", "problem": "Label only; the story’s taxi is one he pays for."}, {"kind": "other", "image": "CINEMA TICKET 4 TICKETS", "story": "", "problem": "Not the story’s ticket purchase."}, {"kind": "other", "image": "POPCORN", "story": "", "problem": "Label only."}, {"kind": "other", "image": "PAYMENT APPROVED", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Some time passed. The same young man had an accident and broke his arm and leg. The treatment was very expensive. He had no money. The man he had returned the money to came and helped him, covered his expenses, and took care of him.", "story": "By the time the police arrived, my nose and his arm were broken. We settled the dispute at the station, but I still had to pay both our medical bills.", "problem": "A grateful repayment after an accident replaces the fight, police, and medical bills he pays."}, {"kind": "other", "image": "SURGERY REPORT", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "That day, you returned the money on the street. You did a great thing. We should help each other.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "My friend, nothing in this world is forever. What remains in the end is a good name and good deeds. Always remember that.", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Money not earned by the sweat of your brow does not benefit a person. Do not touch what is not lawful.", "story": "Money taken dishonestly brings no true benefit and may cost far more than it seems to offer. Leave what is not rightfully yours.", "problem": "“sweat of your brow” and “Do not touch what is not lawful” differ from dishonest money that costs more than it offers."}], "preview": "../../en/wisdom-stories/illustrations/forbidden-money.webp"}, {"stem": "everything-is-in-our-own-hands", "title": "It Is in Our Hands", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "Everything is in our own hands", "story": "It Is in Our Hands", "problem": "Title does not match."}, {"kind": "speech", "image": "Master, I’ve caught a little bird with a thought in my mind. Tell me, is it alive or dead?", "story": "“Wise old man, is the bird I’m holding alive or dead?”", "problem": "Different wording."}, {"kind": "speech", "image": "Look closely, dear master, and tell me, is it alive or dead?", "story": "“Wise old man, is the bird I’m holding alive or dead?”", "problem": "Repeated with different wording."}, {"kind": "thought", "image": "If it’s alive, he’ll release it... If it’s dead...", "story": "“If he says it’s alive,” the boy thought, “I’ll squeeze it to death. If he says it’s dead, I’ll open my hands and let it fly away.", "problem": "Shortened and “he’ll release it” reverses who acts."}, {"kind": "speech", "image": "In your hands, my child, its life or death is in your hands.", "story": "“My son, the answer is in your hands.”", "problem": "Adds “its life or death.”"}, {"kind": "speech", "image": "That is true, my son. In every matter, whether good or evil, we hold the choice in our own hands.", "story": "“War and peace, punishment and forgiveness, good and evil—all lie in our hands.", "problem": "Drops war, peace, punishment, and forgiveness."}, {"kind": "speech", "image": "A person’s path in life is shaped by their choices. So the future is in our own hands.", "story": "Our intentions, not merely our cleverness, determine the course of our lives. There is always a choice, and that choice is ours.”", "problem": "Drops intentions versus cleverness."}, {"kind": "moral", "image": "Both good and evil are human choices. Our destiny is determined by our intentions.", "story": "Good and evil begin with choices. What shapes our lives is not simply how clever we are, but what we choose to do.", "problem": "“destiny” and “intentions” differ from the story moral."}], "preview": "../../en/wisdom-stories/illustrations/everything-is-in-our-own-hands.webp"}, {"stem": "it-wont-go-to-waste", "title": "It Won't Go to Waste", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "Never fades", "story": "never goes to waste", "problem": "Title says fades, not waste."}, {"kind": "caption", "image": "From a young age, I tried to be kind, speak kindly, and act sincerely.", "story": "A kindness done from the heart, an act shaped by love, a word spoken in sincerity", "problem": "Turns the list into a personal childhood story."}, {"kind": "speech", "image": "Hello!", "story": "", "problem": "Greeting is not in the story."}, {"kind": "other", "image": "FAIRNESS FOR ALL", "story": "a step taken for truth and justice", "problem": "Sign wording is not the story phrase."}, {"kind": "caption", "image": "Kindness from the heart lights the way and brightens life.", "story": "never goes to waste. It lights the way for others and makes your own life richer and brighter.", "problem": "Drops \"never goes to waste\" and \"for others.\""}, {"kind": "moral", "image": "Moral: Goodness, words, and deeds done from the hea ooked sad.", "story": "I visited an acquaintance and found him sitting quietly with his head bowed.", "problem": "Friend instead of acquaintance; adds that he looked sad."}, {"kind": "speech", "image": "Are you okay? I asked.", "story": "Are you sad?", "problem": "Different question."}, {"kind": "speech", "image": "I'm fine, buddy, he answered.", "story": "No. I'm lonely.", "problem": "He says he is fine instead of lonely."}, {"kind": "moral", "image": "Moral: The biggest pain is to feel lonely even among people. Seeing the loneliness of someone next to you is true sensitivity.", "story": "The biggest pain is to feel lonely even among people. Seeing the loneliness of someone next to you is true sensitivity.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/to-be-alone.webp"}, {"stem": "loving-from-afar", "title": "Loving from Afar", "category": "Love and marriage", "status": "Needs correction", "items": [{"kind": "title", "image": "Love from a distance", "story": "Loving from Afar", "problem": "Title does not match."}, {"kind": "caption", "image": "Two friends are talking. Around them is a nice view.", "story": "Two friends were talking.", "problem": "Extra “Around them is a nice view.”"}, {"kind": "speech", "image": "I like a girl, but I'm afraid to tell her.", "story": "I think I’ve fallen for someone.", "problem": "Different wording."}, {"kind": "speech", "image": "Why don't you? What's stopping you?", "story": "Why don’t you tell her?", "problem": "Extra “What’s stopping you?”"}, {"kind": "speech", "image": "What if she doesn't feel the same way?", "story": "I would, but I’m afraid of upsetting everything.", "problem": "Different fear."}, {"kind": "speech", "image": "I'm afraid that if I confess and she doesn't like me back, our friendship will change. She might start avoiding me. Our chats, our jokes, even our walks together could become awkward. I don't want to risk losing her. So I stay silent.", "story": "We’d start going to the movies and blem": "Not in the story."}, {"kind": "speech", "image": "So basically, you're lying to yourself?", "story": "Only to myself.", "problem": "Turned into a question the story does not ask."}, {"kind": "speech", "image": "Well, you could see it that way. But it's not an ordinary lie – it's a kind self-lie.", "story": "Only to myself. Every day I tell myself I'm stronger, more knowledgeable, and more capable than anyone else.", "problem": "Calls it a kind self-lie rather than the story's daily boast."}, {"kind": "speech", "image": "So what do you gain from that kind of lie?", "story": "Then why say it?", "problem": "Different question."}, {"kind": "speech", "image": "I tell myself that I can, that I will succeed, and that I won't give up. These words become my strength – they give me courage and keep me moving forward.", "story": "Because it motivates me. It makes me want to learn, grow stronger, and keep improving.", "problem": "Different reason: courage and not giving up, instead of learning and growing stronger."}, {"kind": "other", "image": "TODAY'S EFFORT TOMORROW'S VICTORY!", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Sometimes the kind words you tell yourself become the force that drives you forward. A person is as strong as he believes.", "story": "Moral: Sometimes the kind words you tell yourself — “you can do it” — become the force that drives you forward. A person is as strong as he believes in himself.", "problem": "Drops “you can do it” and “in himself.”"}], "preview": "../../en/wisdom-stories/illustrations/telling-lies.webp"}, {"stem": "spare-time", "title": "Making Time", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "Free time", "story": "Making Time", "problem": "Different title."}, {"kind": "caption", "image": "Some people only talk when they have free time.", "story": "Some people talk to you when they have time to spare.", "problem": "“only” and “free time” change the sentence."}, {"kind": "speech", "image": "Hey, what's up? I had some free time, so I thought I'd text.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Others make free time to talk and be with you.", "story": "Others make time to talk to you.", "problem": "Adds “free” and “be with you.”"}, {"kind": "speech", "image": "I wanted to see you and talk, so I cleared my plans and made time for you.", "story": "Others make time to talk to you.", "problem": "Extra dialogue."}, {"kind": "speech", "image": "That means a lot! Thank you so much.", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Thank you for your time", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Time is the only wealth that never returns. Appreciate the person who willingly spends it for you.", "story": "Time is the only wealth that never returns. Appreciate the person who willingly spends it for you.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/spare-time.webp"}, {"stem": "let-prayer-come-and-find-you", "title": "May the Prayer You Need Find You", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "May prayer come and find you", "story": "May the Prayer You Need Find You", "problem": "Missing “the” and “You Need.”"}, {"kind": "caption", "image": "Help someone in need without expecting anything in return.", "story": "Be the hand that helps someone out of poverty", "problem": "Different wording; adds “without expecting anything in return.”"}, {"kind": "caption", "image": "Caress the head of an orphan, expand their heart, and ease their hardship.", "story": "the kindness that comforts an orphan", "problem": "“Caress the head” and “expand their heart” are not the story’s wording."}, {"kind": "other", "image": "Dua", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "So that the prayer of one in need may come and find you  customers than a person who sells honey with a frown.", "problem": "Drops vinegar, honey, and customers; 'cheapest powerful charm' is not the story."}, {"kind": "other", "image": "HONEY", "story": "a person who sells honey with a frown", "problem": ""}, {"kind": "other", "image": "NATURAL HONEY 100% PURE HONEY", "story": "", "problem": ""}, {"kind": "moral", "image": "Moral: A smiling person is more loved than a frowning one. A smile is the cheapest but most powerful charm.", "story": "Moral: Warmth draws people to us. A smile costs nothing, yet can make all the difference.", "problem": "Different moral wording."}], "preview": "../../en/wisdom-stories/illustrations/may-your-face-always-smile.webp"}, {"stem": "sacrificial-meat", "title": "Meat for the Feast", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Sacrificial meat", "story": "Meat for the Feast", "problem": "Title does not match the story title."}, {"kind": "caption", "image": "Maktab used to live in a comfortable and happy neighborhood.", "story": "I was in fifth grade. We were managing well enough then.", "problem": "Names the boy Maktab and describes a comfortable neighborhood; the story is a first-person account of a family hoping to move into their own home."}, {"kind": "thought", "image": "I wish a holiday would come so I could rejoice like everyone else.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Then one day… Everything changed. An earthquake struck and their lives were turned upside down.", "story": "Thankfully, nothing bad had happened to us or to those around us.", "problem": "Story says the family was unhurt; the caption says their lives were turned upside down."}, {"kind": "caption", "image": "Their home was damaged. Life was hard. But one holiday came.", "story": "But although our house and our lives were safe", "problem": "Story says the house was safe, not damaged."}, {"kind": "speech", "image": "We came to share sacrificial meat. This will lift your spirits.", "story": "But unfortunately, no one brought us a piece of meat.", "problem": "Story says neighbors brought no meat."}, {"kind": "caption", "image": "Their father was injured in the earthquake and was unable to work.", "story": "A driver had run a red light and hit him.", "problem": "Injury is from a traffic accident after the earthquake, not from the earthquake itself."}, {"kind": "speech", "image": "I couldn't work, I couldn't earn. Everything became difficult.", "story": "Why did I survive? Now I've made things even harder for you.", "problem": "Different wording and meaning."}, {"kind": "speech", "image": "I wish I could get back on my feet.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "The holiday came. Maktab was sad. He knew that this year, they would not be able to sacrifice an animal like others.", "story": "The neighbors didn't give us sacrificial meat.", "problem": "Story is about neighbors not sharing meat, not the family failing to sacrifice."}, {"kind": "speech", "image": "Let's share sacrificial meat with those in need.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "We brought sacrificial meat for you. Please accept it.", "story": "My lambs, my lambs, I brought you a lot of meat", "problem": "Grandmother brings meat from her own cow; the bubble does not say that."}, {"kind": "speech", "image": "Oh, what a blessing! What a kindness! Thank you so much!", "story": "", "problem": "Not in the story. The boy cannot eat and says his tooth hurts."}, {"kind": "speech", "image": "Alhamdulillah! This is so delicious!", "story": "My tooth. It hurts.", "problem": "Opposite of the boy's reaction in the story."}, {"kind": "caption", "image": "They sat together and shared their meal.", "story": "", "problem": "The story's point is the grandmother slaughtered her cow, not a shared happy meal."}, {"kind": "moral", "image": "A holiday is real when ing to know and getting to know", "story": "Meeting and Knowing", "problem": "Repeated phrase; meeting is missing."}, {"kind": "speech", "image": "For acquaintance, we only need to say a few words...", "story": "For some, we can only say this:", "problem": "Different words."}, {"kind": "caption", "image": "We meet — we like each other...", "story": "We were happy to meet them", "problem": "Different wording."}, {"kind": "caption", "image": "...we get to know each other — we may be disappointed.", "story": "we were sad to discover who they were.", "problem": "Different wording."}, {"kind": "moral", "image": "Moral: Acquaintance is happy, but getting to know is not always pleasant. Seeing a person as they are sometimes brings disappointment.", "story": "First impressions do not always survive familiarity. Knowing someone better can bring disappointment.", "problem": "Different moral."}], "preview": "../../en/wisdom-stories/illustrations/to-meet-and-to-know.webp"}, {"stem": "mercedes", "title": "Mercedes", "category": "Work, livelihood, and wealth", "status": "Needs correction", "items": [{"kind": "title", "image": "Mercedes", "story": "Mercedes", "problem": ""}, {"kind": "caption", "image": "A man named Mercedes was a passionate car enthusiast; he had a beautiful daughter.", "story": "Mercedes was not its founder’s surname. The car took its name from the daughter of a man who loved automobiles.", "problem": "The picture says the man is named Mercedes; the story says the daughter is."}, {"kind": "caption", "image": "He was inspired by his daughter’s name and entered cars in races.", "story": "The car he named Mercedes went on to win race after race.", "problem": "Drops that he named the car Mercedes."}, {"kind": "other", "image": "Victory!", "story": "win race after race", "problem": "Banner is not the story sentence."}, {"kind": "caption", "image": "From 1902, a legacy begins", "story": "countless Mercedes cars have been produced since 1902", "problem": "“a legacy begins” is not the story sentence."}, {"kind": "caption", "image": "From 1902, Mercedes becomes a symbol of innovation and success worldwide.", "story": "A father’s affection helped turn his daughter’s name into one recognized around the world.", "problem": "Different claim."}, {"kind": "other", "image": "Vienna, Austria", "story": "lived in Vienna", "problem": "Adds Austria."}, {"kind": "caption", "image": "Mercedes’s pride and inspiration: Her name lives on through over a century of innovation 1929 to today.", "story": "In 1929, at the age of thirty-nine, she died of cancer and was buried in Vienna.", "problem": "1929 is her death in the story, not the start of a century of innovation."}, {"kind": "moral", "image": "A name given with love, a work done with love can change the world. A father’s love immortalized a name.", "story": "A name given with love, a work done with love can change the world. A father's love immortalized a name.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/mercedes.webp"}, {"stem": "mihrimah-sultan-and-architect-sinan", "title": "Mihrimah Sultan and Architect Sinan", "category": "History and notable figures", "status": "Needs correction", "items": [{"kind": "title", "image": "Architect Sinan and Mihrimah Sultan", "story": "Mihrimah Sultan and Architect Sinan", "problem": "Name order is reversed."}, {"kind": "other", "image": "The Legend of the Sun and the Moon", "story": "The legend’s most moving moment is the meeting of the Sun and the Moon.", "problem": "Subtitle wording differs."}, {"kind": "caption", "image": "Mihrimah Sultan was married to Rüstem Pasha.", "story": "Sultan Suleiman married his daughter to Rüstem Pasha.", "problem": "Drops Sultan Suleiman."}, {"kind": "caption", "image": "Sinan kept his love alive in his art.", "story": "Unable to share his life with Mihrimah, Sinan is said to have expressed his enduring love through his art.", "problem": "Shortened paraphrase."}, {"kind": "caption", "image": "The first mosque rose in Üsküdar.", "story": "Architect Sinan built the Mihrimah Sultan Mosque in Üsküdar", "problem": "Shortened; the mosque’s name is missing."}, {"kind": "caption", "image": "A second mosque was built at Edirnekapı.", "story": "Later Sinan raised a second mosque for Mihrimah Sultan at Edirnekapı", "problem": "Shortened paraphrase."}, {"kind": "caption", "image": "As the sun sets, the moon rises...", "story": "At the spring equinox, from that point, a crimson sun sets behind the minaret of the Edirnekapı mosque while, at the same moment, the moon rises behind the mosque in Üsküdar.", "problem": "Drops the spring equinox and the two mosques."}, {"kind": "moral", "image": "Moral: Sometimes a person turns love into a work that outlives the one who felt it.", "story": "Moral: Being united with the one you love is not always granted. Sometimes a person turns that love into a work that outlives the one who felt it.", "problem": "First sentence is missing, and \"that\" is missing before \"love\"."}], "preview": "../../en/wisdom-stories/illustrations/mihrimah-sultan-and-architect-sinan.webp"}, {"stem": "mother-and-son", "title": "Mother and Son", "category": "Family and upbringing", "status": "Needs correction", "items": [{"kind": "title", "image": "Mother and son", "story": "Mother and Son", "problem": ""}, {"kind": "caption", "image": "Adam brought his mother to a care home room said he would visit her from time to time.", "story": "The man set the suitcases against the wall", "problem": "Names him Adam and says he will visit from time to time."}, {"kind": "speech", "image": "Mom, take care of yourself.", "story": "It’s a lovely place, Mom.", "problem": "Different speech."}, {"kind": "speech", "image": "Don't worry, son.", "story": "Of course it is, son", "problem": "Different reply."}, {"kind": "caption", "image": "He squeezed her hand, put down the suitcase, and left the room.", "story": "The door closed. She was alone", "problem": "Condensed and different."}, {"kind": "caption", "image": "Later that night, she took out his childhood sweater, stroked it gently, and remembered those days. She remembered how she stayed up late when he was sick, how she held his hand as he learned to walk, and how she worried for him every time he left the house.", "story": "In the photograph, a small boy in school uniform stood stiffly", "problem": "Different memory."}, {"kind": "caption", "image": "Adam drove away from the care home. The rain fell outside. He told himself it was for her own good. But his heart felt heavy.", "story": "Below, her son was getting into his car.", "problem": "Different scene."}, {"kind": "speech", "image": "I hope she's going to be okay.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Days passed, and the emptiness in her heart grew. She would look at his photo, talking to it as if he were there. She missed his voice, his laughter, and even his scoldings. But most of all, she missed his presence.", "story": "That night, the other residents heard her crying.", "problem": "Different aftermath."}, {"kind": "caption", "image": "One day, he brought his son to visit her. The boy ran to his grandmother and hugged her tightly.", "story": "", "problem": "No grandson visit in the story."}, {"kind": "speech", "image": "Grandma, I drew this picture for you!", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "The grandmother kissed her grandson and thanked God for that moment.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Thank you, my dear. You look so much like your dad.", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "HAPPY NEW YEAR!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Mom, I was wrong. I should have spent more time with you.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "My son, I'm okay. I raised you with love so you could become a good man.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "He held her hands tightly. In that moment, he understood what truly matters.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "It's never too late.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Grandma, why do you live here?", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "She smiled and said, \"Because your dad had to work far away. But I'm happy here. People are kind, and I have friends.\" At night, she prayed that God would keep her son healthy and safe, wherever he was.", "story": "The old woman was afraid.", "problem": "She is afraid in the story, not happy."}, {"kind": "caption", "image": "One rainy evening, she looked out the window and saw his car park outside. Her eyes filled with tears.", "story": "His handprint still marked the glass.", "problem": "Different scene."}, {"kind": "speech", "image": "Mom, open the door. It's me.", "story": "Don't leave me, son, I'm so scared", "problem": "He returns; in the story she whispers that she is scared as he leaves."}, {"kind": "caption", "image": "Her heart trembled with joy and fear—wondering what he had come for.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Some bonds never break, no matter the distance or time. Love and respect can heal the wounds that silence leaves behind.", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Life is a circle: a child who holds onto his mother's hand one day may leave her the next. True loyalty is love and attention.", "story": "The child who once feared being left may one day leave a parent with the same fear. Caring for parents means attending to their need for love as well as their physical needs.", "problem": "Moral is reworded."}], "preview": "../../en/wisdom-stories/illustrations/mother-and-son.webp"}, {"stem": "my-alif-has-been-dotted", "title": "My Alif Has Been Dotted", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "My alif has been dotted", "story": "My Alif Has Been Dotted", "problem": ""}, {"kind": "caption", "image": "In the Turkish language, “my alif has been dotted” is a saying. It comes from the old Ottoman script (alif | ha → ah) and means: a tiny change can alter meaning.", "story": "There is an expression in Turkish: “elifim noktalandı.” It comes from writing the letters “alif” (ا) and “ha” (ه) side by side in the old Ottoman script (اه).", "problem": "Omits “elifim noktalandı” and the letter forms; “a tiny change can alter meaning” is not the given meaning."}, {"kind": "caption", "image": "After alif turned into ha with a dot, the meaning can shift completely. What once meant “joy” (alif) can become “sorrow” (ha with a dot).", "story": "Because the “ha” after “alif” resembles a dot, people say “alifim noktalandı,” and metaphorically it means “my joy turned to sorrow.”", "problem": "Says alif turned into ha; the story says ha after alif resembles a dot and the expression means joy turned to sorrow."}, {"kind": "other", "image": "alif", "story": "alif", "problem": ""}, {"kind": "other", "image": "ha", "story": "ha", "problem": ""}, {"kind": "other", "image": "ah (ha with a dot)", "story": "Together, the two letters form the sigh “ah.”", "problem": "Labels “ah” as “ha with a dot”; the story says the two letters form the sigh “ah.”"}, {"kind": "caption", "image": "Because of this tiny dot, a long line that once meant joy and beauty can suddenly become sorrow.", "story": "The letter “alif,” with its long, thin appearance, expresses freedom and beauty, while the letter “ha,” with its bent, almost crushed appearance, expresses distress and collapse.", "problem": "Attributes joy and beauty to the line and then sorrow to the dot; the story assigns freedom and beauty to alif and distress to ha."}, {"kind": "caption", "image": "A ha without a dot is beautiful, like a smile. But when a dot is added, it appears as ha with a dot — and sorrow comes out.", "story": "", "problem": "Not in the story; ha is described as bent and crushed, not as a smile."}, {"kind": "moral", "image": "Moral: Sometimes the change of a letter, a moment turns joy into sadness. Every expression carries the trace of an emotion.", "story": "A single letter—or a single moment—can turn joy into sorrow. Expressions preserve the feelings and stories behind them.", "problem": "“sadness” for “sorrow”; “the trace of an emotion” instead of “the feelings and stories behind them.”"}], "preview": "../../en/wisdom-stories/illustrations/my-alif-has-been-dotted.webp"}, {"stem": "nazim-hikmet-in-bursa-prison", "title": "", "category": "", "status": "Requires manual review", "items": [{"kind": "title", "image": "Nazim Hikmet in Bursa Prison", "story": "", "problem": ""}, {"kind": "caption", "image": "Turkish poet Nazim Hikmet was brought to Bursa Prison on a charge. One day, the inspector — indifferent to the poet — refused to offer him a seat. Nazim Hikmet noticed this.", "story": "", "problem": ""}, {"kind": "other", "image": "BURSA PRISON INSPECTOR", "story": "", "problem": ""}, {"kind": "caption", "image": "Nazim began a conversation. The inspector listened politely... During the conversation, Nazim elegantly brought up a subject. Then he asked: “Do you know Omar Khayyam?”", "story": "", "problem": ""}, {"kind": "other", "image": "PRISON INSPECTOR", "story": "", "problem": ""}, {"kind": "speech", "image": "Do you know Omar Khayyam?", "story": "", "problem": ""}, {"kind": "speech", "image": "Honestly, I have no idea who that is.", "story": "", "problem": ""}, {"kind": "speech", "image": "So Mr. Inspector, who do you think remains in the world beyond time?", "story": "", "problem": ""}, {"kind": "other", "image": "PRISON INSPECTOR OFFICE", "story": "", "problem": ""}, {"kind": "caption", "image": "The inspector fell silent. He had no answer and knew he was wrong.", "story": "", "problem": ""}, {"kind": "speech", "image": "Your title, your position, your medals and uniforms — they may last for a while. But Nazim Hikmet’s poems, his words, will live on. People remember those who create true value.", "story": "", "problem": ""}, {"kind": "caption", "image": "The inspector lowered his head in shame. He understood his mistake... and never repeated it.", "story": "", "problem": ""}, {"kind": "moral", "image": "Moral: As time passes, those in authority are forgotten, but those who create true value are remembered. Positions are temporary, deeds permanent.", "story": "", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/nazim-hikmet-in-bursa-prison.webp"}, {"stem": "dont-be-words-for-mouths-dust-for-feet", "title": "Neither Gossip nor Dust", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "Be neither a tale on every tongue nor dust beneath anyone's feet", "story": "Neither Gossip nor Dust", "problem": "Title is an imperative the story does not use."}, {"kind": "caption", "image": "A tale on every tongue", "story": "“A tale on every tongue” means being the subject of gossip, rumors, or constant public discussion.", "problem": ""}, {"kind": "caption", "image": "Becoming the subject of gossip, rumours, or constant public discussion.", "story": "being the subject of gossip, rumors, or constant public discussion.", "problem": "'Becoming' and the spelling 'rumours' differ from 'being' and 'rumors'."}, {"kind": "caption", "image": "Dust beneath anyone's feet", "story": "“Dust beneath anyone’s feet” means allowing others to humiliate, belittle, or treat you as worthless.", "problem": ""}, {"kind": "caption", "image": "Allowing others to humiliate, belittle, or treat you as worthless.", "story": "allowing others to humiliate, belittle, or treat you as worthless.", "problem": ""}, {"kind": "moral", "image": "Moral: Protect both your reputation and your dignity. Do not give people reason to gossip about you, and do not allow anyone to treat you without respect.", "story": "Moral: Protect both your reputation and your dignity. Do not give people reason to gossip about you, and do not allow anyone to treat you without respect.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/dont-be-words-for-mouths-dust-for-feet.webp"}, {"stem": "do-not-complain-about-any-day-you-have-lived", "title": "Never Regret a Day", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "«Never complain about any day you live»", "story": "Never regret a day you have lived:", "problem": "'complain' and 'you live' replace 'regret' and 'you have lived'."}, {"kind": "caption", "image": "Good days make you happy.", "story": "Good days make you happy,", "problem": ""}, {"kind": "caption", "image": "Bad days give experience.", "story": "Bad days give you experience,", "problem": "Missing 'you'."}, {"kind": "caption", "image": "Worst days give a lesson.", "story": "The worst days teach you a lesson,", "problem": "'give a lesson' replaces 'teach you a lesson', and 'The' is missing."}, {"kind": "caption", "image": "Every day has its own share. Accept it, learn from it.", "story": "Every day offers something: happiness, experience, a lesson, or a memory.", "problem": "Different wording; memories are missing."}, {"kind": "other", "image": "Sunny day", "story": "", "problem": "Not one of the story's day types."}, {"kind": "other", "image": "Rainy day", "story": "", "problem": "Not one of the story's day types."}, {"kind": "other", "image": "Bad day", "story": "Bad days give you experience,", "problem": ""}, {"kind": "other", "image": "Worst day", "story": "The worst days teach you a lesson,", "problem": ""}, {"kind": "moral", "image": "Never complain about any day. Good days make you happy; bad days give experience; worst days give a lesson.", "story": "Never regret a day you have lived: Good days make you happy, Bad days give you experience, The worst days teach you a lesson, The best days give you memories.", "problem": "'complain' replaces 'regret'; 'you' is missing after 'give'; 'give a lesson' replaces 'teach you a lesson'; the best days and memories are missing."}], "preview": "../../en/wisdom-stories/illustrations/do-not-complain-about-any-day-you-have-lived.webp"}, {"stem": "newtons-second-law", "title": "Newton's Second Law", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "Newton's 2nd Law", "story": "Newton's Second Law", "problem": "2nd instead of Second."}, {"kind": "caption", "image": "A physics teacher explains Newton's law to his students.", "story": "A physics teacher returned to the staff room after class.", "problem": "Shows him explaining, not complaining after class, and drops \"second.\""}, {"kind": "other", "image": "PHYSICS ROOM", "story": "", "problem": "Sign is not in the story."}, {"kind": "other", "image": "GALILEO KNEW. WHY NOT YOU?", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "I explained Newton's 2nd Law three times, I finally understood it myself, but the students still didn't get it.", "story": "I explained Newton's second law three times. By the third time, even I understood it—but they still didn't!", "problem": "\"2nd\" and \"didn't get it\" replace the story wording, and \"These students are hopeless\" is missing."}, {"kind": "other", "image": "KNOWLEDGE", "story": "", "problem": "Book label is not in the story."}, {"kind": "other", "image": "UNDERSTANDING", "story": "", "problem": "Book label is not in the story."}, {"kind": "other", "image": "PRACTICE", "story": "", "problem": "Book label is not in the story."}, {"kind": "other", "image": "WISDOM", "story": "", "problem": "Book label is not in the story."}, {"kind": "moral", "image": "Moral: He who wants to teach someone else must first fully understand it himself. Explaining without understanding helps neither.", "story": "Moral: Before teaching a subject, make sure you understand it yourself. Repetition alone cannot replace clarity.", "problem": "Second sentence is a different claim."}], "preview": "../../en/wisdom-stories/illustrations/newtons-second-law.webp"}, {"stem": "that-was-not-your-right", "title": "Not Mine to Give", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "«It was not your right»", "story": "Not Mine to Give", "problem": "Title wording differs. The story line is 'It was not mine to give you.'"}, {"kind": "caption", "image": "At Gallipoli, a wounded soldier asked for morphine for his pain.", "story": "A story from the Battle of Çanakkale tells of morphine being reserved for wounded soldiers who could survive.", "problem": "A soldier asking for pain relief replaces morphine reserved for those who could survive."}, {"kind": "other", "image": "FIELD HOSPITAL", "story": "", "problem": ""}, {"kind": "other", "image": "MORPHINE", "story": "morphine being reserved for wounded soldiers who could survive", "problem": ""}, {"kind": "caption", "image": "When he looked closely at the wounded, he realized — it was his own son.", "story": "Among those brought to Dr. Tarık Nusret was his own son. Seeing that the boy could not be saved, he withheld the injection.", "problem": "Omits that the boy could not be saved and that the injection was withheld."}, {"kind": "other", "image": "JUSTICE IS ABOVE EVERYTHING", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "I cannot, my son. It was not your right.", "story": "Forgive me, my son. It was not mine to give you.", "problem": "'I cannot' and 'not your right' replace 'Forgive me' and 'not mine to give you.'"}, {"kind": "moral", "image": "Sometimes the greatest justice is going against one's own interests. A father who knows the truth will not give an unfair share.", "story": "Moral: Impartiality can demand a terrible personal sacrifice. In this story, a father refuses to claim for his son what has been reserved for others.", "problem": "Different moral wording and meaning."}], "preview": "../../en/wisdom-stories/illustrations/that-was-not-your-right.webp"}, {"stem": "nothing-is-ever-truly-lost", "title": "Nothing Is Ever Truly Lost", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "Nothing Is Ever Truly Lost", "story": "Nothing Is Ever Truly Lost", "problem": ""}, {"kind": "other", "image": "OPPORTUNITIES", "story": "", "problem": "Sign is not in the story."}, {"kind": "caption", "image": "Every door is a new beginning.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "There is no such thing as losing.", "story": "A setback need not be a complete loss.", "problem": "Different claim."}, {"kind": "caption", "image": "Only successes and lessons learned from life exist.", "story": "Sometimes you succeed; sometimes you learn.", "problem": "Says only successes and lessons exist."}, {"kind": "other", "image": "Learn from mistakes. Try again with courage. It takes time and effort.", "story": "Sometimes you succeed; sometimes you learn.", "problem": "Extra advice not in the story."}, {"kind": "other", "image": "Every lesson builds our future.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "One day you'll look back and be proud!", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "DREAM LEARN SUCCEED", "story": "", "problem": "Signs are not in the story."}, {"kind": "moral", "image": "Moral: There is no such thing as losing — you either win or you learn. Every failure is actually a lesson.", "story": "Moral: Learn from failure, and the experience has not been wasted.", "problem": "Different moral."}, {"kind": "other", "image": "SUCCESS", "story": "Sometimes you succeed", "problem": ""}, {"kind": "other", "image": "FAILURE", "story": "Learn from failure", "problem": ""}, {"kind": "speech", "image": "Today I try, tomorrow I'll be stronger!", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "FAILURE LESSON SUCCESS", "story": "", "problem": "Chain of labels is not the story sentence."}], "preview": "../../en/wisdom-stories/illustrations/nothing-is-ever-truly-lost.webp"}, {"stem": "o-god-give-first-to-the-mountains-and-stones", "title": "O Allah, Give First to the Mountains and Stones", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "O God, first give to the mountains and stones", "story": "O Allah, Give First to the Mountains and Stones", "problem": "“God” instead of “Allah”; “first” is not capitalized as in the title."}, {"kind": "speech", "image": "O God, first give to the mountains and stones.", "story": "O Allah, give first to the mountains and stones, the forests, the animals, and the waters.", "problem": "“God” for “Allah”; the forests, animals, and waters are split into the next bubble."}, {"kind": "speech", "image": "Then give to the forest, the animals, and the water.", "story": "the forests, the animals, and the waters", "problem": "Singular “forest” and “water”; “Then give” is extra."}, {"kind": "speech", "image": "Then give to my neighbors, to those in need.", "story": "Then give to the people, to my neighbor, and to those in need. If anything remains, give to me last.", "problem": "“neighbors” for “my neighbor”; missing “the people” and “If anything remains, give to me last.”"}, {"kind": "moral", "image": "Moral: True generosity is to think of others first, then yourself. The culture of sharing lives in this prayer.", "story": "True generosity means thinking of others before oneself. This prayer carries within it an entire people’s tradition of sharing.", "problem": "“is to think”/“then yourself”/“The culture of sharing lives in this prayer” differ from “means thinking”/“before oneself”/“an entire people’s tradition of sharing.”"}], "preview": "../../en/wisdom-stories/illustrations/o-god-give-first-to-the-mountains-and-stones.webp"}, {"stem": "o-god-heal-our-sorrows", "title": "O Allah, Grant Relief from Our Troubles", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "O Allah, find a solution to our problems", "story": "O Allah, Grant Relief from Our Troubles", "problem": "“find a solution to our problems” is not “Grant Relief from Our Troubles.”"}, {"kind": "caption", "image": "O Allah, with Your mercy find solutions to our problems, forgive our sins, bless our sustenance, and accept our supplications.", "story": "By Your names Ar-Rahman and Ar-Rahim, grant relief from our troubles. By Your names Al-Ghaffar and At-Tawwab, forgive our sins and accept our repentance. By Your name Ar-Razzaq, bless the sustenance You provide.", "problem": "Drops the divine names and “accept our repentance”; “find solutions” and “accept our supplications” are not the story’s lines."}, {"kind": "caption", "image": "Grant us wholesome sustenance, bless our provisions, and fill our homes with barakah.", "story": "By Your name Ar-Razzaq, bless the sustenance You provide.", "problem": "Adds wholesome sustenance, provisions, and barakah; omits Ar-Razzaq."}, {"kind": "other", "image": "Allah", "story": "O Allah", "problem": ""}, {"kind": "caption", "image": "Open for us the doors of goodness, forgiveness, and ease.", "story": "By Your name Al-Fattah, open for us the doors of goodness.", "problem": "Adds forgiveness and ease; omits Al-Fattah. Ash-Shafi and healing the sick are missing."}, {"kind": "moral", "image": "Moral: When a person realizes his weakness and prays sincerely, his heart finds peace. Prayer is the language of hope and trust.", "story": "When we recognize our helplessness and pray sincerely, the heart finds peace. Prayer is the language of hope and trust in Allah.", "problem": "“a person realizes his weakness” for “we recognize our helplessness”; missing “in Allah.”"}], "preview": "../../en/wisdom-stories/illustrations/o-god-heal-our-sorrows.webp"}, {"stem": "only-my-mother-would-weep", "title": "Only My Mother’s Tears", "category": "Family and upbringing", "status": "Needs correction", "items": [{"kind": "title", "image": "Only my mother cries", "story": "Only My Mother’s Tears", "problem": "Title says cries instead of Tears."}, {"kind": "speech", "image": "Only my mother cries, the rest are lies", "story": "Only my mother’s tears are real; all the rest are pretense.", "problem": "Says cries and lies instead of tears are real and pretense."}, {"kind": "other", "image": "ONLY MY MOTHER CRIES", "story": "Only my mother’s tears are real", "problem": "Wording differs."}, {"kind": "other", "image": "THE REST ARE LIES", "story": "all the rest are pretense.", "problem": "Says lies instead of pretense."}, {"kind": "moral", "image": "You can see a lot of love in this world, but there is no other love as unconditional and sincere as a mother's love.", "story": "A mother’s love is cherished for its sincerity and its willingness to ask nothing in return.", "problem": "Moral is reworded."}], "preview": "../../en/wisdom-stories/illustrations/only-my-mother-would-weep.webp"}, {"stem": "other-peoples-opinions", "title": "Other People's Opinions", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "Other People's Opinions", "story": "Other People's Opinions", "problem": ""}, {"kind": "caption", "image": "A person lost his comma (,) — his short pauses disappeared.", "story": "One day, a person lost the comma, and every sentence ran together.", "problem": "'short pauses disappeared' replaces 'every sentence ran together'."}, {"kind": "caption", "image": "Then he lost his period (.) — his conclusions drifted away.", "story": "Then the period disappeared, and thoughts stretched on without an end.", "problem": "'conclusions drifted away' replaces 'thoughts stretched on without an end'."}, {"kind": "caption", "image": "Next he lost his exclamation (!) and question mark (?) — no more emotions or questions.", "story": "Next went the exclamation mark, taking joy, anger, and feeling with it. When the question mark vanished, the person stopped asking questions and accepted everything without challenge.", "problem": "Joins two losses and drops joy, anger, feeling, and accepting everything without challenge."}, {"kind": "caption", "image": "Then he lost his colon (:) — his ability to explain vanished.", "story": "Finally, the colon disappeared, along with the ability to explain.", "problem": "'Then' and 'vanished' replace 'Finally' and 'disappeared, along with'."}, {"kind": "caption", "image": "At the end, he was left with quotation marks (“ ”) — filled only with others' opinions.", "story": "At the end of life, only quotation marks remained, enclosing other people’s opinions.", "problem": "Drops 'of life'; 'filled only with' replaces 'enclosing'."}, {"kind": "moral", "image": "Moral: A person who loses his own values and roots is filled with foreign ideas. Protect your spiritual roots or cease to be yourself.", "story": "Moral: When we surrender our own voice and understanding, other people’s ideas take their place. Preserve the values and roots that help you remain yourself.", "problem": "'foreign ideas' and 'cease to be yourself' replace other people's ideas and remaining yourself."}], "preview": "../../en/wisdom-stories/illustrations/other-peoples-opinions.webp"}, {"stem": "raising-children", "title": "Parenting", "category": "Family and upbringing", "status": "Needs correction", "items": [{"kind": "title", "image": "Parenting", "story": "Parenting", "problem": ""}, {"kind": "caption", "image": "A boy was very disobedient, never listened to anyone. His parents were worried. Nothing they said worked.", "story": "A boy constantly defied his parents, neglected his schoolwork, and refused to do his homework.", "problem": "Omits schoolwork and says nothing they said worked; the story includes blows and punishments."}, {"kind": "speech", "image": "One day, the mother and son went into town and saw a bear trainer with his bear.", "story": "One day, on the way to school, his mother saw a crowd around a bear trainer.", "problem": "The son is with her in the caption; the story does not say that."}, {"kind": "speech", "image": "How do you get him to listen to you so well? Doesn't he ever disobey?", "story": "How do you make that wild animal obey? I can’t get my son to listen.", "problem": "Wording differs."}, {"kind": "speech", "image": "I never use fear. I raise him with love.", "story": "Everything has its method. I have mine.", "problem": "The trainer does not say this; the wise man later rejects fear."}, {"kind": "speech", "image": "What do you do when he misbehaves?", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "After a while, the mother and son returned home. The boy was doing something wrong again. His mother called him over.", "story": "Within days, the boy became quiet and compliant.", "problem": "The story's next problem is stealing and lying, not an immediate return home."}, {"kind": "speech", "image": "My dear son, come here. I want to talk to you.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "After a while, the mother told him everything she had seen in the town and what she had learned.", "story": "", "problem": "Not this scene."}, {"kind": "speech", "image": "That man doesn't use fear. He raises his bear with love and patience.", "story": "You want to help a child develop a conscience, not frighten him into obedience.", "problem": "Attributes the love method to the bear trainer."}, {"kind": "speech", "image": "When he misbehaves, I don't punish him. I understand him and show him love. When he does something wrong, I stay calm, understand him, and show him kindness.", "story": "Beating, punishment, and confinement can produce fear, but fear is not an education.", "problem": "Spoken as the trainer's method."}, {"kind": "caption", "image": "The boy thought about it. He realized his mother was right. He felt ashamed.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "I was wrong. My mother always loved me and tried to understand me.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Those who raise with love build obedient hearts. Fear only builds fear, not respect.", "story": "Reach his heart. Be close to him. Hug him, listen to him, and let him know he is loved.", "problem": "Different speech, and says obedient hearts."}, {"kind": "speech", "image": "From now on, I will listen to my parents, help them, and try to be a good son. I will honor their efforts and never disappoint them.", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "A child is educated not with fear, but with love. It is a loving parent who educates a child.", "story": "A child is educated not with fear, but with love. It is not a teacher or an outsider who educates a child—it is a loving parent.", "problem": "Second sentence drops the teacher or outsider contrast."}], "preview": "../../en/wisdom-stories/illustrations/raising-children.webp"}, {"stem": "people-who-need-something-from-you", "title": "People Who Need You", "category": "Friendship and human relations", "status": "Needs correction", "items": [{"kind": "title", "image": "People Who Need You", "story": "People Who Need You", "problem": ""}, {"kind": "caption", "image": "Instead of feeling offended by people who only seek you out when they need something, think that they may be in difficulty, may need your help, and that is why they seek you — and your heart will grow much calmer.", "story": "Instead of resenting people who contact you only when they need something, consider that they may be struggling and trust you enough to ask for help. That thought may bring you peace.", "problem": "Different wording."}, {"kind": "moral", "image": "Moral: Instead of resenting those who seek you only when they need something, think that they come because they trust you — and your heart will be at ease.", "story": "Instead of resenting those who seek you only when they need something, think that they come because they trust you — and your heart will be at ease.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/people-who-need-something-from-you.webp"}, {"stem": "permission-or-apology", "title": "Permission or Apology", "category": "Friendship and human relations", "status": "Needs correction", "items": [{"kind": "title", "image": "Permission or Apology", "story": "Permission or Apology", "problem": ""}, {"kind": "caption", "image": "Admiral Grace Hopper was known for saying that when risk is low and the benefit is clear, it's better to ask forgiveness than permission.", "story": "A saying attributed to Rear Admiral Grace Hopper suggests that it is easier to ask forgiveness than to get permission.", "problem": "better instead of easier; missing to get; missing Rear."}, {"kind": "other", "image": "IT'S BETTER TO ASK FORGIVENESS THAN PERMISSION.", "story": "it is easier to ask forgiveness than to get permission.", "problem": "better instead of easier; missing to get."}, {"kind": "other", "image": "GRACE HOPPER", "story": "Rear Admiral Grace Hopper", "problem": "Missing Rear Admiral."}, {"kind": "caption", "image": "In many cases, waiting for permission creates delays — or worse, missed opportunities. When the risk is low and the benefit is clear, it's smarter to act and learn.", "story": "Sometimes waiting for permission is a missed opportunity.", "problem": "Different wording."}, {"kind": "other", "image": "LOW RISK", "story": "low risk", "problem": ""}, {"kind": "other", "image": "CLEAR BENEFIT", "story": "clearly useful", "problem": "benefit instead of useful."}, {"kind": "caption", "image": "Remember, every business process has a hidden problem. If you wait for permission at every step, you'll never solve it.", "story": "An approval request might pass from one manager to another for weeks.", "problem": "Different wording."}, {"kind": "other", "image": "THERE IS A PROBLEM WE CAN SOLVE", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Risking a small mistake can help us avoid big losses. When the risk is low and the process is reversible, it's better to act and learn.", "story": "the employee recognizes that a limited test poses little risk", "problem": "Different wording."}, {"kind": "caption", "image": "Simplify the process, test a small step, measure the result, and adjust. It's better to act than to wait.", "story": "Do what you know is right, and apologize later if necessary.", "problem": "Different wording."}, {"kind": "caption", "image": "The core idea is \"goals over permission.\" Use data to go back and explain. When the risk is low and the benefit is clear, this approach builds value.", "story": "The idea is to take the initiative, then apologize if necessary, rather than allow endless requests for approval to prevent useful action.", "problem": "Different wording."}, {"kind": "moral", "image": "Moral: In situations where the outcome is reversible, the risk is low, and the benefit is clear, expecting too much permission can kill initiative.", "story": "When an action is low risk, reversible, and clearly useful, excessive approval processes can stifle initiative.", "problem": "kill instead of stifle; expecting too much permission instead of excessive approval processes."}], "preview": "../../en/wisdom-stories/illustrations/permission-or-apology.webp"}, {"stem": "weeds-must-be-pulled-from-the-root", "title": "Pull Out the Roots", "category": "Family and upbringing", "status": "Needs correction", "items": [{"kind": "title", "image": "Weeds need to be uprooted", "story": "Pull Out the Roots", "problem": "Title does not match."}, {"kind": "caption", "image": "Just like weeds in the garden, bad habits also spread if they are not removed.", "story": "During school holidays, we worked in our family garden.", "problem": "Not the story’s wording."}, {"kind": "caption", "image": "Weeds only above the surface may seem gone, but they grow back.", "story": "Clearing away only what shows above the surface does not stop it from returning.", "problem": "Close to the moral, but not that sentence."}, {"kind": "speech", "image": "Our teacher says: “If you only cut the top of a weed, it will grow again from the root.”", "story": "One day, Father explained, “You must work deeper. Until you remove the roots, the job isn’t finished.”", "problem": "A teacher speaks, and the line is not the father’s."}, {"kind": "caption", "image": "We must pull weeds out by the root so they do not grow back.", "story": "Until you remove the roots, the job isn’t finished.", "problem": "Different wording."}, {"kind": "moral", "image": "Moral: If you do not uproot both the problem and the bad habit, the appearance of cleanliness is deceptive – after a while it will reappear.", "story": "Deal with the roots of a problem or a bad habit. Clearing away only what shows above the surface does not stop it from returning.", "problem": "Different wording; “appearance of cleanliness is deceptive” is not in the moral."}], "preview": "../../en/wisdom-stories/illustrations/weeds-must-be-pulled-from-the-root.webp"}, {"stem": "puppies-for-sale", "title": "Puppies for Sale", "category": "Family and upbringing", "status": "Needs correction", "items": [{"kind": "title", "image": "Puppies for sale", "story": "Puppies for Sale", "problem": ""}, {"kind": "other", "image": "We have puppies for sale", "story": "We have puppies for sale.", "problem": ""}, {"kind": "speech", "image": "Do you have any puppies for sale?", "story": "How much do you sell puppies for?", "problem": "He asks whether they have puppies, not the price."}, {"kind": "speech", "image": "And you have don't is gist to only puppies?", "story": "", "problem": "Garbled line that is not in the story."}, {"kind": "speech", "image": "I have all my savings of ten dollars. Is that enough?", "story": "I only have thirteen dollars and twenty-seven cents", "problem": "Wrong amount."}, {"kind": "speech", "image": "Of course! You can choose whichever puppy you like.", "story": "Between thirty and fifty dollars. Each one has a different price", "problem": "Shopkeeper does not say he may choose any puppy."}, {"kind": "speech", "image": "Which one? I don't know. They're all so cute!", "story": "What’s wrong with him? Why can’t he walk?", "problem": "Different question."}, {"kind": "speech", "image": "Don't choose the prettiest one. Choose the one who needs you the most.", "story": "You don’t need to buy that one, son. You can have him for free.", "problem": "Different advice."}, {"kind": "speech", "image": "How do I know which one needs me most?", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Choose the one who has no one. Love it, care for it, and it will love you back.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "You're right. If I take the one everyone wants, it will already have a home. But if I take the one no one wants, it will have me. I'll take the puppy no one else chooses.", "story": "That’s the puppy I want.", "problem": "Different speech."}, {"kind": "speech", "image": "That's a kind heart. You're not just buying a puppy. You're giving it a life.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "I want to give it a chance. It deserves love too.", "story": "I don’t want him for free. He’s worth just as much as the others.", "problem": "Omits refusing a free puppy and the payment plan."}, {"kind": "speech", "image": "We'll be best friends. I'll understand you, care for you, and always be here for you.", "story": "I can’t run and play either. We both need a friend who understands.", "problem": "Omits the shared disability."}, {"kind": "moral", "image": "Every living thing needs a friend who will understand and support it. The one who is different is just as valuable.", "story": "Every living thing needs a friend who will understand and support it. The one who is different is just as valuable as the others; we need to give him a chance.", "problem": "Drops as the others and the chance."}], "preview": "../../en/wisdom-stories/illustrations/puppies-for-sale.webp"}, {"stem": "ramadan-prayer", "title": "Ramadan Prayer", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Ramadan Prayer", "story": "Ramadan Prayer", "problem": ""}, {"kind": "speech", "image": "May the Almighty Allah accept our prayers, bless our sustenance, heal our sick, forgive our sins, open doors of goodness for us, and fill our hearts with love and mercy!", "story": "May Almighty Allah accept our prayers, bless our sustenance, heal the sick, forgive our sins, open doors of goodness, and fill our hearts with love and mercy.", "problem": "Extra “the”; “our sick” for “the sick”; extra “for us”; extra exclamation mark."}, {"kind": "speech", "image": "May you have a blessed Ramadan!", "story": "May you have a blessed Ramadan!", "problem": ""}, {"kind": "other", "image": "Blessed Eid!", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Blessing", "story": "", "problem": "Label is not a story sentence."}, {"kind": "other", "image": "Healing", "story": "", "problem": "Label is not a story sentence."}, {"kind": "other", "image": "Forgiveness", "story": "", "problem": "Label is not a story sentence."}, {"kind": "other", "image": "Good doors", "story": "open doors of goodness", "problem": "“Good doors” is not “doors of goodness.”"}, {"kind": "moral", "image": "Moral: Sincere prayer fills the heart with hope and mercy. The wish for blessings, healing, and forgiveness brings a person closer to the Creator.", "story": "Sincere prayer fills the heart with hope and mercy. The wish for blessings, healing, and forgiveness brings a person closer to the Creator.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/ramadan-prayer.webp"}, {"stem": "how-to-ward-off-insults", "title": "Refusing an Insult", "category": "Friendship and human relations", "status": "Needs correction", "items": [{"kind": "title", "image": "How to overcome insults", "story": "Refusing an Insult", "problem": "Different title."}, {"kind": "caption", "image": "(A lesson from the life of the samurai)", "story": "(An instructive story from the life of the samurai)", "problem": "Missing instructive story."}, {"kind": "other", "image": "BUDO", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Once, a samurai master had students. He always taught that the heart should be calm and the mind should be clear.", "story": "A wise samurai taught his students both wisdom and martial arts.", "problem": "Different wording."}, {"kind": "caption", "image": "One day, a rude warrior burst into the dojo and began hurling insults at the master. He spoke harsh and disrespectful words, but the master remained calm and silent.", "story": "One day, a warrior known for cruelty and rudeness interrupted a lesson.", "problem": "Different wording."}, {"kind": "caption", "image": "After insulting the master as much as he could, the warrior got no response and, in anger, left the dojo.", "story": "After several unsuccessful attempts to provoke him, the warrior left in a rage.", "problem": "Different wording."}, {"kind": "speech", "image": "Master, why didn't you answer him? Didn't you hear his insults?", "story": "Master, why did you let him insult you? Why didn't you fight?", "problem": "Different questions."}, {"kind": "speech", "image": "If someone offers you a gift but you do not accept it, to whom does it belong?", "story": "If someone offers you a gift and you refuse it, who owns it?", "problem": "to whom does it belong instead of who owns it."}, {"kind": "speech", "image": "To the owner.", "story": "The person who offered it", "problem": "Different answer."}, {"kind": "speech", "image": "In the same way, when someone insults you and you do not accept it, those words remain with them themselves and cause them harm.", "story": "The same is true of envy, hatred, and insults. If you refuse to accept them, they remain with the person who brought them.", "problem": "Adds cause them harm; drops envy and hatred."}, {"kind": "moral", "image": "Moral: An insult that you do not accept returns to its owner — just like a gift that is returned. Do not return evil for evil, but with moderation.", "story": "You need not take another person's malice into your heart. Meet an insult with composure rather than more hostility.", "problem": "Different moral."}], "preview": "../../en/wisdom-stories/illustrations/how-to-ward-off-insults.webp"}, {"stem": "pay-rent-for-the-water", "title": "Rent for the Water", "category": "Work, livelihood, and wealth", "status": "Needs correction", "items": [{"kind": "title", "image": "Pay rent for water", "story": "Rent for the Water", "problem": "Title is a command, not the story title."}, {"kind": "caption", "image": "A man bought a well, but not the water.", "story": "A man bought a well from a villager.", "problem": "States the seller’s claim as fact in the caption."}, {"kind": "caption", "image": "The next day, when the buyer tried to draw water from the well... The seller objected: \"You did not buy the water.\"", "story": "But when he tried to draw water, the seller stopped him. “I sold you the well, not the water.”", "problem": "Adds “the next day” and changes the objection."}, {"kind": "speech", "image": "I did not sell you the water.", "story": "I sold you the well, not the water.", "problem": "Drops “the well.”"}, {"kind": "caption", "image": "The buyer went to the judge.", "story": "they went before a judge", "problem": "Only the buyer goes."}, {"kind": "speech", "image": "Either remove the water from the well, or pay rent to the well owner.", "story": "If the water is yours, you cannot store it in another man’s well. Take it away or pay him rent.", "problem": "Drops the condition and “another man’s well.”"}, {"kind": "moral", "image": "He who wants to take his rights by crooked means falls into his own trap. Justice weighs the rights of both parties.", "story": "Dishonesty can trap the person who practices it. Fair judgment considers both sides of a claim.", "problem": "Moral wording differs."}], "preview": "../../en/wisdom-stories/illustrations/pay-rent-for-the-water.webp"}, {"stem": "no-need-to-be-sane-when-everyone-is-mad", "title": "Sane in a World Gone Mad", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "There is no need to be smart when everyone is crazy", "story": "Sane in a World Gone Mad", "problem": "Different title; smart/crazy replace sane/mad."}, {"kind": "caption", "image": "Our wise man received a message: Save clean water today, or the people will suffer tomorrow.", "story": "Tomorrow the water will change, and everyone who drinks it will lose their reason.", "problem": "The warning is about clean water, not water that takes away reason."}, {"kind": "caption", "image": "He cleaned the wells, fixed the pipes, and brought clean water to the village, one drop at a time.", "story": "He hurried home and filled every jug and bowl he owned.", "problem": "He repairs the village water instead of storing his own."}, {"kind": "caption", "image": "At first, people laughed at him; they called him crazy.", "story": "But everyone he spoke to mocked him. \"Are you mad? You belong in an asylum!\"", "problem": "Drops the asylum line and says this happened at first."}, {"kind": "speech", "image": "A man who saved water? Are you mad? Drink with the rest!", "story": "Are you mad? You belong in an asylum!", "problem": "Different mockery."}, {"kind": "caption", "image": "Day by day, to fit in, he started drinking the same water as everyone else.", "story": "Despairing, he returned home, smashed his containers, drank from the same fountain as everyone else, and went to bed.", "problem": "Says he drank to fit in, and drops smashing the containers."}, {"kind": "moral", "image": "Moral: The crowd may condemn you for knowing the truth. Protect your mind, but don't tire yourself proving worth to the public every moment.", "story": "Moral: The crowd may condemn you for knowing the truth. Protect your mind, but don't tire yourself out by trying to prove your worth to the public every moment.", "problem": "Drops \"out by trying to\" and \"your\" before worth."}], "preview": "../../en/wisdom-stories/illustrations/no-need-to-be-sane-when-everyone-is-mad.webp"}, {"stem": "searching", "title": "Searching in the Wrong Place", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "To seek", "story": "Searching in the Wrong Place", "problem": "Different title."}, {"kind": "caption", "image": "To seek what is not there is to deceive oneself.", "story": "To search for something where it cannot be found is to deceive yourself", "problem": "\"what is not there\" and \"oneself\" replace the story wording."}, {"kind": "other", "image": "NOT HERE", "story": "", "problem": "Sign is not in the story."}, {"kind": "caption", "image": "Expecting loyalty from someone who cannot give it.", "story": "looking for loyalty in betrayal", "problem": "Different wording."}, {"kind": "caption", "image": "Expecting honesty from someone who cannot give it.", "story": "mercy in dishonesty", "problem": "Honesty replaces mercy in dishonesty."}, {"kind": "other", "image": "LIES", "story": "dishonesty", "problem": "Book title is not the story word."}, {"kind": "caption", "image": "Expecting kindness from someone who cannot give it.", "story": "decency in shamelessness", "problem": "Kindness replaces decency in shamelessness."}, {"kind": "other", "image": "Every heart has its capacity, everyone has their true gift.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Know a person as much as they can give.", "story": "Do not expect everyone to offer what they do not possess. See people clearly, rather than through your hopes for them.", "problem": "Different moral sentence."}, {"kind": "other", "image": "KNOW ACCEPT APPRECIATE SEE THEIR TRUE GIFT", "story": "", "problem": "Checklist is not in the story."}], "preview": "../../en/wisdom-stories/illustrations/searching.webp"}, {"stem": "to-be-full-or-to-be-gone", "title": "Sharing and Division", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "To be full or to be lost", "story": "Sharing and Division", "problem": "Different title; lost replaces gone."}, {"kind": "caption", "image": "Unity fills us...", "story": "By sharing, we are nourished.", "problem": "Unity instead of sharing."}, {"kind": "caption", "image": "...division leaves us lost.", "story": "By division, we are lost.", "problem": "Adds \"leaves us.\""}, {"kind": "moral", "image": "Moral: We become stronger when we are united, but we are lost when we are divided. To preserve unity, we must keep our knowledge and spirituality healthy.", "story": "Moral: Sharing strengthens us; division weakens us. Unity needs care and a shared sense of purpose.", "problem": "United/lost replaces sharing/weakens, and knowledge and spirituality replace a shared sense of purpose. Yunus Emre is missing."}], "preview": "../../en/wisdom-stories/illustrations/to-be-full-or-to-be-gone.webp"}, {"stem": "sharing-justice", "title": "Sharing Fairly", "category": "Justice and society", "status": "Needs correction", "items": [{"kind": "title", "image": "Sharing justice", "story": "Sharing Fairly", "problem": "Title words differ."}, {"kind": "speech", "image": "Some laugh while others cry.", "story": "Let no one weep alone while others laugh without a care.", "problem": "Different wording."}, {"kind": "other", "image": "UNFAIR SHARE OF BREAD AND JOY.", "story": "", "problem": "Sign is not in the story."}, {"kind": "speech", "image": "When someone has a lot, but shares very little.", "story": "Let wealth cease to be an affliction, or let the wealthy learn to share.", "problem": "Different wording."}, {"kind": "speech", "image": "When someone says “I love you,” and shares it with their words and actions.", "story": "Let no one merely speak of love without showing what that love means.", "problem": "Different wording; the story forbids love that is only spoken."}, {"kind": "other", "image": "LOVE", "story": "", "problem": "Book label is not in the story."}, {"kind": "speech", "image": "When holidays are not just lived, but experienced through sharing.", "story": "Let us not call a day a feast while others have no meat to eat.", "problem": "Different wording; the feast-without-meat contrast is missing."}, {"kind": "other", "image": "HOLIDAY OF SHARING BRINGS HAPPINESS TO ALL!", "story": "", "problem": "Sign is not in the story."}, {"kind": "moral", "image": "Humanity is created when joy, bread, and love are shared. If one laughs and another cries, there is no justice.", "story": "Moral: Humanity is created when joy, bread, and love are shared. If one side laughs and the other side cries, there is no justice there.", "problem": "Second sentence drops \"side\", \"the other side\", and \"there\"."}], "preview": "../../en/wisdom-stories/illustrations/sharing-justice.webp"}, {"stem": "silence", "title": "Silence", "category": "Word, silence, and communication", "status": "Needs correction", "items": [{"kind": "title", "image": "Silence", "story": "Silence", "problem": ""}, {"kind": "caption", "image": "A hard question is asked.", "story": "The answer to some questions is silence.", "problem": "Not the story wording."}, {"kind": "caption", "image": "It is not the time to answer, or the listener is not ready to hear!", "story": "Either it's not the time for an answer, or the person asking has not earned a reply.", "problem": "Says the listener is not ready, not that the person asking has not earned a reply."}, {"kind": "speech", "image": "It is not the time to answer.", "story": "Either it's not the time for an answer,", "problem": "Wording differs."}, {"kind": "speech", "image": "The listener is not ready to hear.", "story": "or the person asking has not earned a reply.", "problem": "Different meaning."}, {"kind": "caption", "image": "The most correct answer to some questions is silence — either it is not the time, or it does not deserve an answer.", "story": "The answer to some questions is silence. Either it's not the time for an answer, or the person asking has not earned a reply.", "problem": "Adds “most correct” and “does not deserve an answer”; misses the person who has not earned a reply."}], "preview": "../../en/wisdom-stories/illustrations/silence.webp"}, {"stem": "architect-sinan-dies-in-a-house-without-water", "title": "Sinan Brought Water to Istanbul but Died in a House Without It", "category": "History and notable figures", "status": "Needs correction", "items": [{"kind": "title", "image": "Sinan Brought Water to Istanbul but Died in a House Without It", "story": "Sinan Brought Water to Istanbul but Died in a House Without It", "problem": ""}, {"kind": "caption", "image": "Suleiman the Magnificent summons the architect Sinan to the palace.", "story": "One day, the sultan summoned him and asked", "problem": "Paraphrase."}, {"kind": "speech", "image": "Sinan Agha, Istanbul is growing every day. Build us a water system that will bring water from distant springs to our city.", "story": "Chief architect, people pay dearly even for a packhorse’s load of water. Can Istanbul be supplied with enough water?", "problem": "Different request; \"Sinan Agha\" and \"distant springs\" are not the sultan’s question."}, {"kind": "speech", "image": "As you command, my Sultan. I
