em": ""}, {"kind": "caption", "image": "I broke the chains of fear — they couldn't hold me anymore.", "story": "The fears were hardest to remove. They were tangled together like chains. Still, I let them go without reproaching myself for keeping them so long.", "problem": "Says the chains were broken and could not hold her; the story says she let the fears go."}, {"kind": "caption", "image": "Nerves that were once captive in fear began to breathe and find peace.", "story": "in my muscles, my nerves, my veins—right down to my blood.", "problem": "Nerves are named, but this sentence is not in the story."}, {"kind": "other", "image": "love, trust, love, forgiveness, joy, joy, hope", "story": "In the space I cleared, I planted joy, trust, and love.", "problem": "Repeats love and joy and adds forgiveness and hope on the same signs."}, {"kind": "caption", "image": "Love, trust, love, forgiveness, joy, and hope were planted.", "story": "In the space I cleared, I planted joy, trust, and love.", "problem": "Extra forgiveness and hope, and love is repeated."}, {"kind": "other", "image": "HEART ROOM GRATEFUL AND AT PEACE", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Moral: True cleanliness is in the heart: throwing away disappointment, fear, and resentment and planting love, forgiveness, and hope.", "story": "Moral: True cleanliness is in the heart: throwing away disappointment, fear, and resentment and planting love, forgiveness, and hope in their place. The one who cleans his inner world finds peace.", "problem": "Drops 'in their place' and the second sentence."}], "preview": "../../en/wisdom-stories/illustrations/i-got-busy-with-cleaning.webp"}, {"stem": "magnificent-lesson", "title": "A Magnificent Lesson", "category": "History and notable figures", "status": "Needs correction", "items": [{"kind": "title", "image": "A Magnificent Lesson", "story": "A Magnificent Lesson", "problem": ""}, {"kind": "speech", "image": "I’ll tell you something, but you won’t believe it, teacher!", "story": "You cannot tell me what to do. I am the sultan’s son!", "problem": "Different speech."}, {"kind": "speech", "image": "Young master! The lesson is not a place for mischief! First, learn to show respect!", "story": "", "problem": "Not in the story. The teacher reprimands the sultan, not the boy with these words."}, {"kind": "caption", "image": "Set a good example first.", "story": "In education, personal example is stronger than any lecture.", "problem": "Different wording."}, {"kind": "thought", "image": "He is absolutely right. I was wrong!", "story": "", "problem": "Not in the story."}, {"kind": "thought", "image": "Knowledge without good character is of no use, my son.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Discipline, respect, and humility elevate a person in the eyes of Allah and people.", "story": "", "problem": "Not in the story."}, {"kind": "thought", "image": "One day, I will conquer the mountains.", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "In education, personal example is stronger than any lecture.", "story": "Moral: In education, personal example is stronger than any lecture. A responsible parent may even set aside personal pride to help a child find the right path.", "problem": "The second sentence is missing."}], "preview": "../../en/wisdom-stories/illustrations/magnificent-lesson.webp"}, {"stem": "mature-person", "title": "A Mature Person", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "A Mature Person", "story": "A Mature Person", "problem": ""}, {"kind": "caption", "image": "The more you value sincere friends, the more you’ll naturally let go of harmful relationships...", "story": "There comes a time when you value old friends’ sincerity more than passing acquaintances. You step away from ignorance and relationships that disturb your peace.", "problem": "Paraphrase; drops old friends, acquaintances, and ignorance."}, {"kind": "caption", "image": "...and keep your distance from people who drain your energy or bring negativity into your life.", "story": "You step away from ignorance and relationships that disturb your peace.", "problem": "Different wording."}, {"kind": "other", "image": "PEACE GROWTH MEANING CALM", "story": "", "problem": "Signpost words are not in the story."}, {"kind": "caption", "image": "...so you can focus on what truly matters and live with clarity and inner peace.", "story": "That is one sign of growing maturity.", "problem": "Different wording."}, {"kind": "moral", "image": "Maturity is the ability to step away from harmful relationships and protect one’s inner peace.", "story": "Maturity is the ability to step away from harmful relationships and protect one’s inner peace. Knowing whom—and what—to keep at a distance is also a form of wisdom.", "problem": "Visible sentence matches; the story’s second moral sentence is absent from the image."}], "preview": "../../en/wisdom-stories/illustrations/mature-person.webp"}, {"stem": "meaningless-question", "title": "A Meaningless Question", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "A Meaningless Question", "story": "A Meaningless Question", "problem": ""}, {"kind": "speech", "image": "I’m a recent graduate from New York University, and I want to study the Talmud, but I don’t know Hebrew or Torah.", "story": "One day, a graduate of the University of California, Berkeley, visited a rabbi in New York and asked for help studying the Talmud.", "problem": "Wrong university and different speech."}, {"kind": "speech", "image": "Can you read Aramaic?", "story": "“Do you know Aramaic?", "problem": "“read” instead of “know.”"}, {"kind": "speech", "image": "If so, why do you want to study the Talmud?", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "No. I don’t even know the Hebrew alphabet. I’m not familiar with any of the Mishna or Talmud either.", "story": "The young man answered no to every question.", "problem": "Adds Mishna and the Hebrew alphabet."}, {"kind": "speech", "image": "I heard that the Talmud contains great wisdom. I want to understand it... But my friends told me: first learn Hebrew, then study Torah and get a teacher. Only then should you begin...", "story": "“But I defended a dissertation on Socratic logic! I would like to study the Talmud to fill some gaps in my education.”", "problem": "Different speech; chimney logic puzzle is missing."}, {"kind": "speech", "image": "Do you want a taste without eating? My son, if you don’t know the language...", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "...— How can you drink from a clear spring if you don’t even know how to draw water? If you haven’t built the vessel, how will the water rest in it?", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "But I want it so much. I’m really eager to understand!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Eagerness is good, but without the foundation it won’t work...", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "But I want to learn even more. What should I do then?", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "First learn the language. Then you will be able to drink.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Who will lead me to the spring then?!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Your desire is good, my son, but first learn the tools, then hold the cup, then drink. Meaningless questions bring confusion. A well-formed question opens the path to wisdom. Until then, you will remain thirsty, no matter how near the spring.", "story": "“Wrong again,” the rabbi said calmly. “You studied Socratic logic. Ask yourself: how could two people climb down the same chimney together and only one get soot on his face? The question itself makes no sense.", "problem": "Replaces the chimney riddle with a spring lesson."}, {"kind": "moral", "image": "An answer to a meaningless question cannot lead to truth. A well-formed question is already half the answer.", "story": "An answer to a meaningless question cannot lead to truth. A well-formed question is already half the answer.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/meaningless-question.webp"}, {"stem": "more-effective-way", "title": "A More Effective Way", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "A More Effective Way", "story": "A More Effective Way", "problem": ""}, {"kind": "caption", "image": "A hunter came across a woodcutter struggling with a dull axe.", "story": "A hunter walking through a forest came upon an unusual scene. A woodcutter had been hacking at a fallen tree for a long time with enormous effort.", "problem": "Shortened."}, {"kind": "speech", "image": "Your axe is very blunt. Why not take a break and sharpen it?", "story": "“Why struggle like that? Your axe is blunt. Why don’t you sharpen it?”", "problem": "Adds “take a break.”"}, {"kind": "speech", "image": "Sharpen it? I don't have time for that. I have a lot of work to do. I need to cut 20 logs today.", "story": "“What are you talking about? Where would I find time to sharpen my axe? I still have twenty more trees to cut!”", "problem": "“20 logs” instead of “twenty more trees.”"}, {"kind": "caption", "image": "Without pausing — much effort.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "With a break — much more effective.", "story": "Sometimes a short pause to sharpen the tool makes all the work that follows faster and easier.", "problem": "Different wording."}, {"kind": "moral", "image": "Hard work is valuable, but unexamined effort can be wasteful. Sometimes pause to sharpen the tool.", "story": "Hard work is valuable, but unexamined effort can be wasteful. Sometimes a short pause to sharpen the tool makes all the work that follows faster and easier.", "problem": "Second sentence drops “a short” and “makes all the work that follows faster and easier.”"}], "preview": "../../en/wisdom-stories/illustrations/more-effective-way.webp"}, {"stem": "mothers-love", "title": "A Mother’s Love", "category": "Family and upbringing", "status": "Needs correction", "items": [{"kind": "title", "image": "A Mother's Love", "story": "A Mother’s Love", "problem": ""}, {"kind": "other", "image": "Erich Fromm", "story": "Erich Fromm", "problem": ""}, {"kind": "caption", "image": "1 year old — I am one with mother, completely.", "story": "I am one year old—completely happy, because my mother is always beside me.", "problem": "Wording differs."}, {"kind": "caption", "image": "2 years old — Mother is my world (good or bad).", "story": "I am two—my mother is with me only sometimes. I wonder what is happening.", "problem": "Different meaning."}, {"kind": "caption", "image": "3 years old — Mother is my model, my guide.", "story": "I am three—my mother is at work, and my nanny is with me.", "problem": "Different meaning."}, {"kind": "caption", "image": "5 years old — I can read by myself, but I still need mother.", "story": "I am five—my mother is in a meeting, and my grandmother is with me.", "problem": "Different meaning."}, {"kind": "caption", "image": "7 years old — Mother is behind me, believing in me, encouraging me.", "story": "I am seven—my mother is at a seminar; I am at school with my teacher.", "problem": "Different meaning."}, {"kind": "caption", "image": "13 years old — Independence matters. I seek friends, not mother.", "story": "I am thirteen—a teenager. My mother still has to work, and my friends are beside me.", "problem": "Different meaning."}, {"kind": "caption", "image": "17 years old — I find myself. Mother gives advice. I listen when I want to.", "story": "I am seventeen—my mother comes home exhausted. I am at school, in class, or at a café with friends.", "problem": "Different meaning."}, {"kind": "caption", "image": "20 years old — A little less need for mother — more need for friends.", "story": "I am twenty—young and confident. My mother is not at home, but my friends are with me.", "problem": "Different wording."}, {"kind": "caption", "image": "23 years old — I'm on my own, but for every step, there is mother. I miss her.", "story": "I am twenty-three—I have started working. My mother is home now, while I am at work.", "problem": "Different meaning."}, {"kind": "caption", "image": "30 years old — Between happiness and worries... in every success, there is mother's silent prayer. She is with me always!", "story": "I am thirty—and I wonder: when did my mother and I last spend real time together? Something is wrong.", "problem": "Different meaning."}, {"kind": "caption", "image": "35+ years old — I have a family, but in my heart, there is mother.", "story": "I am thirty-five—married. My mother lives in her home, and I in mine.", "problem": "Different wording."}, {"kind": "caption", "image": "40+ years old — Mother becomes the way I walk, the voice I use, the decisions I make.", "story": "I am forty—my mother waits for me just as I once waited for her as a child.", "problem": "Different meaning."}, {"kind": "caption", "image": "50+ years old — Life slows down, but mother worries about everyone. Her heart remains full of love.", "story": "I am fifty—I am older now, but one wish remains unchanged: to hold my mother close and rest my head in her lap.", "problem": "Different meaning."}, {"kind": "caption", "image": "55+ years old — Mother remembers the childhood days, the smiles, the tears, and the sacrifices.", "story": "I am fifty-five—another mother is always beside me now, the mother of my children. My own mother has passed away, and I live with the ache of missing her.", "problem": "Omits the mother's death asked her pupils to write a story on any subject and promised a pair of boots to the author of the best one.", "problem": "Adds a fixed topic and a contest."}, {"kind": "other", "image": "Write your story", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Over the next few days, everyone worked really hard and wrote wonderful stories. Our teacher carefully read each one and chose the best stories to enter the contest.", "story": "The teacher read each piece and liked them all. Unable to choose the best, she decided to draw the winner by lot.", "problem": "Says she chose the best stories."}, {"kind": "caption", "image": "On the day of the contest, our teacher brought a pretty box. She put all the selected stories inside. Then each of us came up one by one and drew a slip of paper. The one whose name came out would win the boots.", "story": "Each pupil wrote a name on a slip of paper, folded it, and placed it in a box on the teacher's desk.", "problem": "Pupils draw story slips instead of the teacher drawing name slips."}, {"kind": "other", "image": "Amina", "story": "Amina!", "problem": ""}, {"kind": "caption", "image": "When the winner's name was called, it was Amina! She came forward, took the beautiful pink boots, and her eyes filled with happy tears.", "story": "The classroom erupted in applause. Amina pressed the boots to her chest and could not hold back tears of joy.", "problem": "Different wording; adds pink."}, {"kind": "caption", "image": "In the evening, Amina was still thinking about how she had won. She told her parents that many of her friends had written such wonderful stories.", "story": "That evening, the teacher returned home and tearfully told her husband what had happened.", "problem": "Amina tells her parents; the story is the teacher telling her husband."}, {"kind": "speech", "image": "Sweetheart, don't be sad.", "story": "You found a wonderful solution. Why are you crying?", "problem": "Wrong speaker and words."}, {"kind": "speech", "image": "Why don't we take the boots to your friends?", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "That's a great idea!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "From now on, let's be happy for others, not just for ourselves, said Amina. Because the boots brought me the greatest joy when I shared them.", "story": "Because every slip said Amina. Not one child wrote their own name. They all wanted the girl from the poorest family to have those boots.", "problem": "Replaces the name-slip reveal with Amina sharing the boots."}, {"kind": "moral", "image": "The finest victory is to value another person's joy above one's own.", "story": "The finest victory is to value another person's joy above one's own.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/pair-of-boots.webp"}, {"stem": "windmill-turning-in-still-air", "title": "A Windmill Turning in Still Air", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "A Windmill Turning in Still Air", "story": "A Windmill Turning in Still Air", "problem": ""}, {"kind": "speech", "image": "A windmill turning in still air has a hidden force behind it.", "story": "If a windmill turns when the air is still, someone must be blowing on its sails.", "problem": "“hidden force” instead of someone blowing on the sails."}, {"kind": "caption", "image": "An Eskimo proverb — there is a reason unseen.", "story": "Eskimo proverb", "problem": "Adds “there is a reason unseen.”"}, {"kind": "moral", "image": "No outcome arises without a cause. The force behind an event may be invisible, yet clear in the result.", "story": "Results have causes, even when we cannot see them. Look beyond the obvious for the forces at work.", "problem": "Different wording."}], "preview": "../../en/wisdom-stories/illustrations/windmill-turning-in-still-air.webp"}, {"stem": "from-a-wise-fathers-advice-to-his-son", "title": "A Wise Father’s Advice to His Son", "category": "Family and upbringing", "status": "Needs correction", "items": [{"kind": "title", "image": "From the wise father's advice to his son", "story": "A Wise Father’s Advice to His Son", "problem": "Title wording differs."}, {"kind": "caption", "image": "Listen to your father: painful advice is not pleasant to hear, but is for your good.", "story": "If you belong to the second, listen to good advice.", "problem": "Not the story sentence."}, {"kind": "caption", "image": "A young man who heeds advice early avoids regret later and walks the right path.", "story": "Those who follow an honest path in youth earn respect in old age.", "problem": "Different wording."}, {"kind": "caption", "image": "Strength is not in muscles alone, but in a sound mind.", "story": "Strength is a good thing, but it must be guided by reason.", "problem": "Wording differs."}, {"kind": "caption", "image": "Your father's love is like food and water—it nourishes and protects.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "A father teaches his son three things:", "story": "I also want you to understand that there are three kinds of people.", "problem": "The story's three things are kinds of people, not these lessons."}, {"kind": "caption", "image": "1. Put your trust in God.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "He who trusts God is never lost.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "2. Be honest in word and deed.", "story": "", "problem": "Not this list item."}, {"kind": "caption", "image": "Truthful words and actions bring peace.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "3. Gain knowledge continually.", "story": "", "problem": "Not this list item."}, {"kind": "speech", "image": "The more I know, the more I must learn.", "story": "The third know little, yet believe they know everything and refuse all advice.", "problem": "Opposite of the third kind of person."}, {"kind": "caption", "image": "Knowledge elevates in this world and the Hereafter.", "story": "He who listens to advice will be exalted", "problem": "Different claim."}, {"kind": "caption", "image": "My son, be among those who listen to advice.", "story": "Do not become one of the third.", "problem": "Related but not the story sentence."}, {"kind": "moral", "image": "Wisdom is the source of happiness. He who listens to advice will be exalted.", "story": "Wisdom is the source of happiness, and strength is the servant of wisdom. He who listens to advice will be exalted; but he who thinks he knows everything will perish.", "problem": "Drops the strength clause and the warning about perishing."}], "preview": "../../en/wisdom-stories/illustrations/from-a-wise-fathers-advice-to-his-son.webp"}, {"stem": "calamity-and-blessing", "title": "Adversity and Blessing", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Adversity and Blessing", "story": "Adversity and Blessing", "problem": ""}, {"kind": "speech", "image": "If adversity brings you closer to God, it is a blessing.", "story": "If adversity brings you closer to Allah, it is a blessing.", "problem": "“God” instead of “Allah”."}, {"kind": "other", "image": "THE QURAN", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "If blessing takes you away from God, it is adversity.", "story": "If a blessing draws you away from Allah, it is a hardship.", "problem": "Missing “a”; “takes” for “draws”; “God” for “Allah”; “adversity” for “hardship”."}, {"kind": "other", "image": "Closer to God", "story": "", "problem": "Not story wording; uses “God” rather than “Allah”."}, {"kind": "other", "image": "Away from God", "story": "", "problem": "Not story wording; uses “God” rather than “Allah”."}, {"kind": "moral", "image": "A hardship that brings you closer to God is a blessing; a blessing that takes you away is adversity.", "story": "A hardship that brings you closer to Allah is a blessing, while a blessing that draws you away from Him becomes a hardship.", "problem": "“God” for “Allah”; “takes you away is adversity” for “draws you away from Him becomes a hardship”; the closing sentence about where it leads you is missing."}], "preview": "../../en/wisdom-stories/illustrations/calamity-and-blessing.webp"}, {"stem": "advice-for-those-who-marry", "title": "Advice for Newlyweds", "category": "Love and marriage", "status": "Needs correction", "items": [{"kind": "title", "image": "Advice for Those Who Marry", "story": "Advice for Newlyweds", "problem": "Title does not match."}, {"kind": "caption", "image": "Wise words from elders for those beginning their journey together:", "story": "Wise elders offered the following counsel to a young couple beginning married life:", "problem": "Different wording."}, {"kind": "caption", "image": "Choose your life partner with wisdom and not just emotion. Look at their character, values, and how they treat others, not just their words.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Be supportive and understanding. No one is perfect. Learn each other's strengths and weaknesses, and build your bond on patience and forgiveness.", "story": "Do not expect perfection; none of us is flawless.", "problem": "Adds strengths, weaknesses, patience, and forgiveness."}, {"kind": "caption", "image": "Don't expect perfection from your partner. Accept them as they are. Your happiness lies in accepting each other's flaws and supporting each other through them.", "story": "Do not expect perfection; none of us is flawless.", "problem": "Extra claims about happiness and flaws."}, {"kind": "caption", "image": "Just like hedgehogs stay close while keeping their spines, in a relationship everyone has their own unique world. Don't try to change each other. Respect each other's personal space, and your bond will grow stronger.", "story": "Hedgehogs draw only as close as their spines allow; if they move too near, they hurt one another. Respect each other’s personal boundaries.", "problem": "“Don’t try to change each other” and “bond will grow stronger” are not in the story."}, {"kind": "caption", "image": "Be each other's best friend and loyal companion. Talk openly, listen honestly, and grow together.", "story": "In marriage, be neither owner nor servant, but companions on the same road.", "problem": "Different counsel."}, {"kind": "caption", "image": "A kind word can heal any wound. Be gentle in your speech, because words spoken in anger can leave lasting scars.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "At the end of each day, let go of anger. Sleep with a heart at peace. A new day is a fresh start—begin it with forgiveness and love.", "story": "Even if you have been upset with each other during the day, remember to say good night before going to sleep. Let tomorrow begin with reconciliation.", "problem": "Omits saying good night; adds letting go of anger and forgiveness."}, {"kind": "moral", "image": "A happy marriage rests on open communication, mutual respect, and care for each other’s boundaries.", "story": "A happy marriage rests not on comparison or the pursuit of perfection, but on open communication, mutual respect, and care for each other’s personal boundaries.", "problem": "Drops the comparison and perfection clause, and “personal.”"}], "preview": "../../en/wisdom-stories/illustrations/advice-for-those-who-marry.webp"}, {"stem": "aging", "title": "Aging", "category": "Aging and time", "status": "Needs correction", "items": [{"kind": "title", "image": "Aging", "story": "Aging", "problem": ""}, {"kind": "caption", "image": "Aging is like climbing a mountain...", "story": "Aging is like climbing a mountain: the higher you rise, the more tired you become and the shorter your breath, yet the wider your view of the world grows.", "problem": "The rest of the sentence is cut off."}, {"kind": "caption", "image": "...it may leave you more tired, but it also gives you a wider view of the world.", "story": "the higher you rise, the more tired you become and the shorter your breath, yet the wider your view of the world grows.", "problem": "\"it may leave you more tired\" and \"gives you\" differ; \"the shorter your breath\" is missing."}, {"kind": "moral", "image": "Growing older is not merely a loss of strength; through experience and wisdom, it is also the ability to see a broader landscape.", "story": "Moral: Growing older brings more than a loss of strength. Experience and wisdom can also give us a broader view of life.", "problem": "\"not merely\" and \"broader landscape\" differ from \"brings more than\" and \"broader view of life\"."}], "preview": "../../en/wisdom-stories/illustrations/aging.webp"}, {"stem": "albrecht-durer", "title": "Albrecht Dürer", "category": "History and notable figures", "status": "Needs correction", "items": [{"kind": "title", "image": "Albrecht Dürer", "story": "Albrecht Dürer", "problem": ""}, {"kind": "caption", "image": "In Nuremberg, Germany, in the early 15th century, a poor goldsmith named Albrecht Dürer lived with his wife Barbara and their 18 children. Although life was difficult, Albrecht loved to draw. His dream was to become a great artist, but his family’s situation made that seem impossible.", "story": "In a small village near Nuremberg lived a family with ten children.", "problem": "\"in Nuremberg\", \"early 15th century\", \"18 children\", a goldsmith father named Albrecht, and \"wife Barbara\" are not the story."}, {"kind": "caption", "image": "One day, Albrecht and his older brother Albert sat together and spoke about their future. They both dreamed of studying art, but their family could afford it for only one of them. So they decided to draw lots.", "story": "the two eldest sons, Albrecht and Albert, dreamed of becoming renowned artists. They knew their father could not afford to educate them both at once.", "problem": "Calls Albert the older brother; the story does not."}, {"kind": "caption", "image": "The lot fell to Albrecht Dürer. He would get to study art at the academy in Nuremberg, while Albert would have to work in the mine.", "story": "Albrecht won the draw. He left for the academy, and Albert began working in the mine.", "problem": "\"The lot fell to\" instead of \"won the draw\"."}, {"kind": "other", "image": "MINE", "story": "", "problem": "Sign is not in the story."}, {"kind": "caption", "image": "Albert went to work in the mine to support his family. Albrecht, with a heavy heart but deep gratitude, began his studies. He drew whenever he could, determined to make the most of this chance.", "story": "Albert began working in the mine.", "problem": "Adds motives and feelings not in the story."}, {"kind": "caption", "image": "Years passed, and Albrecht became a famous artist. His works were admired far and wide. Yet he never forgot his brother’s sacrifice.", "story": "Albrecht’s work soon attracted wide attention", "problem": "\"Years passed\" replaces the four-year exchange, and the offer to switch places is missing."}, {"kind": "speech", "image": "All that I have achieved, my dear brother, I owe to your sacrifice.", "story": "Dear brother, now it is your turn. Go and pursue your dream; this time I will support you.", "problem": "Different speech; Albrecht does not offer Albert his turn."}, {"kind": "caption", "image": "When Albrecht returned home, he saw how hard Albert had worked in the mine.", "story": "He returned home joyfully and told his brother", "problem": "Different wording."}, {"kind": "speech", "image": "Dear brother, I never regretted it. Seeing your dream come true has been worth more than any riches.", "story": "No, brother. It is too late. Four years in the mine have damaged my hands and every one of my fingers. I can no longer draw.", "problem": "Albert’s damaged hands are replaced by a different speech."}, {"kind": "caption", "image": "Albrecht embraced his brother with love and gratitude. Their bond was stronger than any treasure.", "story": "Albrecht took his brother’s hands in his own and wept.", "problem": "Different action."}, {"kind": "caption", "image": "On April 21, 1528, Albrecht Dürer (1471–1528) passed away in Nuremberg. He left behind immortal works of art, and his world remembered him. On his tombstone, he had these words inscribed:", "story": "Centuries later, the works of Albrecht Dürer (1471–1528) continue to be displayed in leading galleries around the world. The famous drawing associated with his brother’s sacrifice is known as Praying Hands.", "problem": "Death date, tombstone, and missing \"Praying Hands\" differ from the story."}, {"kind": "other", "image": "ALBERTINA VIENNA", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Albrecht Dürer This is my body.", "story": "The famous drawing associated with his brother’s sacrifice is known as Praying Hands.", "problem": "Inscription is not in the story; \"Praying Hands\" is missing."}, {"kind": "moral", "image": "Behind success there often stands an unseen sacrifice. To honor that sacrifice is one of the finest expressions of humanity.", "story": "Moral: Behind success there often stands an unseen sacrifice. To recognize and honor that sacrifice is one of the finest expressions of humanity.", "problem": "Missing \"recognize and\"."}], "preview": "../../en/wisdom-stories/illustrations/albrecht-durer.webp"}, {"stem": "what-breaks-a-marriage", "title": "An Eraser for Marriage", "category": "Love and marriage", "status": "Needs correction", "items": [{"kind": "title", "image": "The eraser in marriage", "story": "An Eraser for Marriage", "problem": "Title does not match."}, {"kind": "speech", "image": "Between newlyweds, a small eraser should be at all times.", "story": "A marriage needs an eraser too, son.", "problem": "Said at the start, and “at all times” is extra."}, {"kind": "speech", "image": "An eraser? Why?", "story": "Why?", "problem": ""}, {"kind": "speech", "image": "Why?", "story": "Why?", "problem": ""}, {"kind": "speech", "image": "Get an eraser and bring it.", "story": "Then go and buy one.", "problem": "He is told to get one before they find he has no eraser."}, {"kind": "speech", "image": "Here it is.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Why?", "story": "Why?", "problem": ""}, {"kind": "speech", "image": "To erase my mistakes.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Use it.", "story": "Now erase it.", "problem": "He has not been told to write first."}, {"kind": "speech", "image": "First, erase my flaws.", "story": "Now erase it.", "problem": "Different wording."}, {"kind": "speech", "image": "God willing, father, what are they?", "story": "Father, please tell me what this is about.", "problem": "Not the son’s line."}, {"kind": "speech", "image": "Many things.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "What flaws do I have?", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Well, father, you can be a bit stubborn sometimes.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "My son, even if I have many flaws, I will never speak harshly to you or your mother. For the sake of maintaining our home, I will use this eraser to erase those flaws. You, my son, should do the same with your wife, even before she asks you to.", "story": "A marriage needs an eraser too, son. You will both make mistakes and do things the other dislikes. Each of you must be willing to erase some of those marks.", "problem": "Adds the mother, harsh speech, and erasing before she asks."}, {"kind": "speech", "image": "If I live by this wisdom and treat my wife with love and respect, our home will be full of happiness. I will never forget this, father!", "story": "If you want love and respect, offer them to each other. And remember the eraser.", "problem": "The son’s vow is not in the story."}, {"kind": "moral", "image": "Moral: Marriage is the art of forgiveness. For love and respect to continue, both parties must be able to “erase” each other’s flaws.", "story": "Marriage is the art of forgiveness. For love and respect to continue, both parties must be able to \"erase\" each other's flaws.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/what-breaks-a-marriage.webp"}, {"stem": "from-the-memoirs-of-a-lady-from-istanbul", "title": "An Istanbul Woman Remembers", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "From the memories of a woman from Istanbul", "story": "An Istanbul Woman Remembers", "problem": "Different title."}, {"kind": "caption", "image": "It was 1919. Istanbul was under the occupation of the entente powers. Life was hard. There was poverty, uncertainty and fear everywhere. Yet in our home, my mother kept hope alive with her embroidery.", "story": "It was 1919. Istanbul was completely under British occupation. I had just finished high school.", "problem": "“entente powers” instead of British occupation; adds the mother and embroidery."}, {"kind": "speech", "image": "Girls, a thread of patience today will weave tomorrow's opportunities.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "One day, a proposal came for my father. They said the young man was educated, well-mannered, and from a respectable family. We were happy, and prayers were said for his acceptance.", "story": "One day, a handsome, tall young man came with his representatives. He introduced himself as a lawyer.", "problem": "Different proposal scene."}, {"kind": "caption", "image": "We went to the Uskudar mosque. My mother was praying when a coffin was carried by. People said it belonged to a man who had died without anyone beside him. It saddened us deeply.", "story": "“They say Ayesha’s fiancé isn’t a lawyer at all. He spends his days carrying coffins outside the mosque.”", "problem": "Different coffin scene."}, {"kind": "caption", "image": "A few days later, my father's friend came to our home. He had seen that young man. He said, “His clothes are worn out, his shoes are old, and he takes the tram like the rest of the people. He works at a small office. He seems humble, and he treats people kindly.” We began to wonder. Could appearances be deceiving?", "story": "My father and I went to the mosque, watched from a distance, and saw that he was really carrying a coffin.", "problem": "Different events."}, {"kind": "other", "image": "AHMET BEY LAW OFFICE", "story": "It was a law firm; his name was written on the sign on the door.", "problem": "The story does not give the name Ahmet Bey."}, {"kind": "speech", "image": "What do you think of him?", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Well...", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "If he is kind and sincere, a simple life is of more value than wealth.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "That is what my heart says.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "I learned that day in Istanbul: We should not judge people by their appearance, their clothes, or their status. True worth comes from the heart. Some of the fairest souls wear the simplest lives. Since that day, I have tried not to judge too quickly. Perhaps there is a story behind every behavior that we do not know.", "story": "“Istanbul was under occupation. British soldiers were everywhere, searching people and inspecting everything. We disguised arms shipments as funerals, sending coffins full of weapons to the National Forces in Anatolia.”", "problem": "Omits the arms-shipment explanation."}, {"kind": "moral", "image": "Don't judge by appearance; behind every behavior there may be a truth you don't know.", "story": "Don’t judge by appearance; behind every behavior there may be a truth that you don’t know.", "problem": "Missing “that” before “you don’t know.”"}], "preview": "../../en/wisdom-stories/illustrations/from-the-memoirs-of-a-lady-from-istanbul.webp"}, {"stem": "organization-without-an-action-plan", "title": "An Organization Without an Action Plan", "category": "Work, livelihood, and wealth", "status": "Needs correction", "items": [{"kind": "title", "image": "An Organization Without an Action Plan", "story": "An Organization Without an Action Plan", "problem": ""}, {"kind": "caption", "image": "An organization without a plan is like a ship without a chart, aimless and directionless.", "story": "An organization without an action plan is like a ship that knows its destination but has no chart, no chosen route, and no assigned duties for its crew.", "problem": "Says the ship is aimless; the story says it knows its destination but has no chart."}, {"kind": "other", "image": "DESTINATION: SUCCESSFUL ORGANIZATION", "story": "", "problem": "Sign is not story wording."}, {"kind": "other", "image": "THE ORGANIZATION", "story": "", "problem": "Label is not story wording."}, {"kind": "speech", "image": "Where are we going?", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "What should we do?", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "What's our goal?", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Do we even have an objective?", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Even with good people on board, without a plan, a system doesn't exist—it's just chance.", "story": "It may reach port through luck, a skillful captain, or favorable weather.", "problem": "Says a system doesn’t exist; the story allows luck, a captain, or weather."}, {"kind": "speech", "image": "Nice weather!", "story": "favorable weather", "problem": "Not the story sentence."}, {"kind": "speech", "image": "Smooth sailing!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "We're doing great!", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "DESTINATION: SUCCESS", "story": "", "problem": "Sign is not story wording."}, {"kind": "caption", "image": "Over time, confusion turns into frustration; the organization loses momentum.", "story": "an organization without a plan also begins to lose its members", "problem": "Says lost momentum instead of lost members."}, {"kind": "speech", "image": "I'm leaving.", "story": "When hope fades, people leave", "problem": "Not the story sentence."}, {"kind": "speech", "image": "I can't do this anymore.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "I didn't join for this...", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "No enthusiasm, no plan—just going nowhere...", "story": "the organization gradually weakens and eventually ceases to function", "problem": "Different wording."}, {"kind": "other", "image": "WHAT DID WE GET? No clear direction. No measurable goals. No defined roles. No action plan. No lasting success.", "story": "lasting success needs more than fortunate circumstances: it requires careful planning and consistent action", "problem": "Checklist is not story wording."}, {"kind": "moral", "image": "A goal provides direction; a plan defines the path. Lasting success requires deliberate and consistent action.", "story": "A goal provides direction; a plan defines the path toward it. An organization may advance by chance without a plan, but lasting success requires deliberate and consistent action.", "problem": "Drops “toward it” and the sentence about advancing by chance."}], "preview": "../../en/wisdom-stories/illustrations/organization-without-an-action-plan.webp"}, {"stem": "his-hand-is-at-work", "title": "At Least I Look Busy", "category": "Work, livelihood, and wealth", "status": "Needs correction", "items": [{"kind": "title", "image": "His Hand Is at Work", "story": "At Least I Look Busy", "problem": "Title does not match the story title."}, {"kind": "speech", "image": "I will buy ten eggs from you for ten kopecks.", "story": "A man bought ten eggs for ten kopecks and sold them for nine.", "problem": "Puts the purchase in dialogue and drops the sale price."}, {"kind": "other", "image": "I BUY 10 eggs for 10 kopecks", "story": "bought ten eggs for ten kopecks", "problem": ""}, {"kind": "other", "image": "I SELL 9 eggs for 9 kopecks", "story": "sold them for nine", "problem": "Sign can be read as nine eggs for nine kopecks, not ten eggs sold for nine."}, {"kind": "speech", "image": "What is the purpose of this, friend?", "story": "When acquaintances asked the purpose of this strange trade", "problem": "Not the story sentence."}, {"kind": "speech", "image": "Never mind the loss; everyone sees that my hand is at work.", "story": "Never mind the loss. As long as people see me trading, they think I’m a merchant. At least everyone can see that I’m working.", "problem": "Drops the merchant line and changes the last sentence."}, {"kind": "other", "image": "I SELL 9 eggs for 10 kopecks", "story": "sold them for nine", "problem": "One stall sign reads nine eggs for ten kopecks."}, {"kind": "moral", "image": "Wasting time on empty work for appearances is the real loss. Looking busy does not bring real benefit.", "story": "Wasting time on empty work for the sake of appearances is the real loss. Looking busy does not bring real benefit.", "problem": "Drops “the sake of.”"}], "preview": "../../en/wisdom-stories/illustrations/his-hand-is-at-work.webp"}, {"stem": "bookstore", "title": "At the Bookstore", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "At the Bookstore", "story": "At the Bookstore", "problem": ""}, {"kind": "other", "image": "Bilge Bookstore BURSA", "story": "the Bilge bookstore in Bursa", "problem": ""}, {"kind": "caption", "image": "A medical student in Bursa named Talha walked into “Bilge Bookstore,” known for its wide selection of academic books. As he browsed, he found a book that caught his eye and his heart.", "story": "After a long search, a medical student found the book he needed at the Bilge bookstore in Bursa.", "problem": "Adds the name Talha and that the book caught his heart."}, {"kind": "caption", "image": "He carefully examined the large book— a two-volume medical reference—and lost himself in its pages.", "story": "Hiding his disappointment, he leafed through the pages, found the section assigned by his professor,", "problem": "Different details."}, {"kind": "other", "image": "OUT OF STOCK CANNOT BE ORDERED", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "FOR SALE", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "He wanted it so badly... But when he asked the price, the book was far beyond what he could afford.", "story": "When he saw the price on the back, his smile vanished: he could not afford it.", "problem": "Says he asked the price."}, {"kind": "speech", "image": "I see.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Don't worry, there's a solution.", "story": "“Please sit down. We have something to tell you.”", "problem": "Different speech."}, {"kind": "speech", "image": "Consider this a gift. A book like this is meant for someone who seeks knowledge with such dedication. Study well and one day, help others as you have been helped.", "story": "“A customer asked the price recently and seemed ready to buy it. I took it off the shelf and set it aside for you. You can keep reading it here.”", "problem": "They give the book as a gift; the story only sets it aside to read in the shop."}, {"kind": "other", "image": "THANK YOU, TEACHER.", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "A GOOD DOCTOR TREATS THE BODY BUT ALSO THE SOUL", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Years later, Talha became a doctor. He always remembered Vural and Mustafa bey—and the book that changed his life.", "story": "After completing his studies and becoming a doctor, the young man never forgot the two booksellers. He never charged patients who could not afford treatment.", "problem": "Names the booksellers and omits that he never charged patients who could not pay."}, {"kind": "moral", "image": "A small act of kindness can leave a lifelong mark on the heart.", "story": "A small act of kindness can leave a lifelong mark on the heart.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/bookstore.webp"}, {"stem": "doctors-appointment", "title": "At the Doctor’s Office", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "At the Doctor's Appointment", "story": "At the Doctor’s Office", "problem": "“Appointment” instead of “Office.”"}, {"kind": "caption", "image": "Hakim came to the doctor's office. He bought a sandwich and juice, but saw a boy sitting alone. He didn't know if the boy was hungry or not. But seeing how thin he was and his worried look, Hakim felt sorry for him and decided to go and talk to him.", "story": "I was waiting for my turn at a doctor’s office. Having missed breakfast at home, I bought a sandwich and apple juice from the café and began to eat.", "problem": "Names him Hakim and changes the scene."}, {"kind": "speech", "image": "I have a sandwich and some juice. Would you like some?", "story": "A boy sitting near the window was watching me closely. His expression seemed to say, “I am hungry too.”", "problem": "He offers food aloud; the story does not."}, {"kind": "speech", "image": "Thank you. I didn't have a sandwich or juice. I'm very hungry.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "No problem. I'm glad to share.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Are you crazy?! Hakim asked. “No, no!” the boy's mother said. “We haven't eaten since yesterday. I was trying not to worry him. Thank you so much for being kind.”", "story": "“What have you done? He wasn’t supposed to eat before his appointment. I took time off work, and we’ve come such a long way. Now we’ll have to do it all again tomorrow.”", "problem": "The mother thanks him; in the story she is upset because the boy was not supposed to eat."}, {"kind": "caption", "image": "Hakim realized the boy's eyes weren't just sad.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "He felt ashamed that he had judged without knowing the truth. From that day on, Hakim promised to look beyond appearances and never judge based only on what he sees.", "story": "I stood frozen: while believing I was helping, I had undone an entire family’s effort.", "problem": "Opposite outcome."}, {"kind": "moral", "image": "Judgment based only on emotion and assumption can lead us to the wrong decision.", "story": "Judgment based only on emotion and assumption can lead us to the wrong decision.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/doctors-appointment.webp"}, {"stem": "fish-shop", "title": "At the Fish Shop", "category": "Work, livelihood, and wealth", "status": "Needs correction", "items": [{"kind": "title", "image": "At the Fish Shop", "story": "At the Fish Shop", "problem": ""}, {"kind": "other", "image": "FISH SHOP", "story": "a fish shop", "problem": ""}, {"kind": "other", "image": "BUS", "story": "the bus stop", "problem": ""}, {"kind": "caption", "image": "A man was thinking as he walked down the street. Oh, if there was just a bus or a small bus stop here! How convenient it would be for people to shop at the fish shop. — he said to himself.", "story": "After work, a man was walking toward the bus stop when he passed a fish shop.", "problem": "He is already going to a bus stop in the story, not wishing one existed."}, {"kind": "thought", "image": "If only there were a bus stop nearby; it would be so easy for people—just step off the bus and shop here.", "story": "walking toward the bus stop", "problem": "Invented thought."}, {"kind": "other", "image": "FRESH FISH EVERY DAY", "story": "", "problem": "Sign is not in the story."}, {"kind": "caption", "image": "He approached the shop and asked the fishmonger how much the fish cost. Then he thought:", "story": "He asked the seller for one kilogram, then changed the order to two.", "problem": "Story has him order by weight, not ask the price."}, {"kind": "thought", "image": "Sea bass, whiting, hake, mullet... Let's take some mullet.", "story": "", "problem": "Fish names are not in the story."}, {"kind": "speech", "image": "My son, would you buy some fish for me too?", "story": "Son, would you buy some fish for me too?", "problem": "Adds “My.”"}, {"kind": "speech", "image": "Of course, ma'am.", "story": "Without hesitation, the man told the seller", "problem": "Reply is not in the story."}, {"kind": "speech", "image": "Four kilos then: two for me, and two for you.", "story": "Make it four kilograms—two for me and two for her.", "problem": "Says kilos and “for you” instead of kilograms and “for her.”"}, {"kind": "caption", "image": "The man took a bag from his shoulder and bought the fish she asked for. He paid and handed it to her.", "story": "he hurried to the shop across the street, bought four loaves, and gave her a share.", "problem": "Panel mixes the fish purchase with bread and skips the unpaid fish."}, {"kind": "speech", "image": "May God bless you, my son. May He reward you for your generosity.", "story": "Blessing him, she made her way home.", "problem": "Not the story’s wording."}, {"kind": "speech", "image": "You're welcome.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "You have been so kind.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Yes, my son.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "I was going to buy medicine. But thanks to you, I'll have both the medicine and some fish to cook. May God reward you again.", "story": "They were eye drops she had last been able to buy two months earlier", "problem": "Drops the eye drops and two months."}, {"kind": "speech", "image": "God willing, may you have good health and a long life.", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "EYE MEDICINE", "story": "eye drops", "problem": "Label says medicine rather than eye drops."}, {"kind": "caption", "image": "The man also gave her some money for medicine, so she wouldn't have any trouble. Then he said goodbye and left.", "story": "He gave the woman the medicine and then all the money left in his pocket.", "problem": "Says money for medicine after he already bought it, and skips the empty pockets."}, {"kind": "speech", "image": "May God be pleased with you, ma'am.", "story": "he thanked Allah for the chance to help", "problem": "Addressed to the woman, not the story’s thanks."}, {"kind": "speech", "image": "May God reward you. Thank you so much.", "story": "", "problem": "Not the story sentence."}, {"kind": "caption", "image": "The man returned to the fishmonger, paid for the fish he bought, and left.", "story": "he remembered that he had not paid for the fish. His pockets were empty.", "problem": "The story says he had not paid and his pockets were empty."}, {"kind": "speech", "image": "God bless you for your kindness.", "story": "Go on, brother. The fish is my gift.", "problem": "Missing the seller’s gift line."}, {"kind": "thought", "image": "Good deeds aren't about having plenty; they come from a heart that feels for others and wants to help.", "story": "he thanked Allah for the chance to help", "problem": "Thought is not the story wording."}, {"kind": "thought", "image": "How happy she'll be. How much she'll cook and feed her family; that fish will bring joy and good to her.", "story": "He called his daughter, told her he had bought fish, and promised to arrive soon.", "problem": "He calls his daughter in the story, not this thought about the woman."}, {"kind": "speech", "image": "Thank God for giving us the chance to do good and make someone smile.", "story": "he thanked Allah for the chance to help; the tears on his cheeks mingled with the rainwater.", "problem": "Different thanks, and the rain tears are missing."}, {"kind": "moral", "image": "Do not wait for great means before doing good; kindness depends on a generous heart.", "story": "Do not wait for great means before doing good; kindness depends not on wealth, but on a generous heart. A person rich in spirit finds a way to help even while possessing little.", "problem": "Drops “not on wealth” and the second sentence."}], "preview": "../../en/wisdom-stories/illustrations/fish-shop.webp"}, {"stem": "avoid-these-questions", "title": "Avoid These Questions", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "Avoid These Questions", "story": "Avoid These Questions", "problem": ""}, {"kind": "speech", "image": "Why don’t you have a job?", "story": "“Are you still out of work?”", "problem": "Different question."}, {"kind": "speech", "image": "When are you going to find a job?", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Why don’t you have children?", "story": "“Don’t you have children yet?”", "problem": "Different question."}, {"kind": "speech", "image": "When are you going to get married?", "story": "“When are you getting married?”", "problem": "Extra “going to.”"}, {"kind": "caption", "image": "These questions belong nowhere. Choose kindness over curiosity.", "story": "What seems like ordinary curiosity to us may touch another person’s deepest wound.", "problem": "Different wording."}, {"kind": "speech", "image": "How much money do you make?", "story": "“How much do you earn?”", "problem": "Different wording."}, {"kind": "moral", "image": "Some questions wound the heart. Every painful question left unasked may lift a burden.", "story": "Some questions wound the heart. Every painful question left unasked may lift a burden from someone’s shoulders.", "problem": "Missing “from someone’s shoulders.”"}], "preview": "../../en/wisdom-stories/illustrations/avoid-these-questions.webp"}, {"stem": "baklava", "title": "Baklava", "category": "Work, livelihood, and wealth", "status": "Needs correction", "items": [{"kind": "title", "image": "Baklava", "story": "Baklava", "problem": ""}, {"kind": "speech", "image": "We didn't have much money, not even enough for sweets...", "story": "When I was a child, our family had very little money.", "problem": "Adds “not even enough for sweets.”"}, {"kind": "caption", "image": "But my mother made baklava. That evening, we packed the baklava together.", "story": "One day, my father brought home some baklava, and we enjoyed it with tea that evening.", "problem": "Says the mother made it and they packed it that evening; the father brought it home."}, {"kind": "caption", "image": "It was the day of the holiday. My mother packed some baklava so I could share it at school with an olive and a slice of bread.", "story": "My mother packed one piece of baklava, a few olives, and some bread for me to take to school.", "problem": "One olive and one slice, and “share,” instead of one piece, a few olives, and some bread."}, {"kind": "speech", "image": "Wow, you brought baklava to school just to show off?!", "story": "Did you bring that baklava for the mice?", "problem": "The mockery line is different."}, {"kind": "caption", "image": "Then I went home and told my mother:", "story": "I ran home in tears and shouted at my mother", "problem": "Drops the tears and the shout."}, {"kind": "other", "image": "Mocking another person's poverty is among the gravest wrongs.", "story": "Mocking another person's poverty is among the gravest wrongs.", "problem": ""}, {"kind": "speech", "image": "My child, remember: what comes from the heart is worth more than what comes from wealth.", "story": "My child, that was my own piece.", "problem": "The mother’s line is replaced."}, {"kind": "speech", "image": "Whoever humiliates another because they are poor will be held accountable before God one day. I won't forget that lesson.", "story": "Ever since, I have asked for forgiveness whenever I remember how I behaved.", "problem": "Different reflection, and the moral’s second sentence is missing."}], "preview": "../../en/wisdom-stories/illustrations/baklava.webp"}, {"stem": "do-not-do-these-things", "title": "Be Mindful of What You Say", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "Don’t do these", "story": "Be Mindful of What You Say", "problem": "Title does not match."}, {"kind": "caption", "image": "Don’t boast about your wealth in front of someone who is struggling...", "story": "Do not dwell on your wealth in front of someone who is poor", "problem": "“boast” and “struggling” instead of “dwell” and “poor.”"}, {"kind": "caption", "image": "Don’t talk about your health in front of someone who is sick...", "story": "your health in front of someone who is ill", "problem": "“Don’t talk” and “sick” instead of “dwell” and “ill.”"}, {"kind": "caption", "image": "Don’t talk about your children in front of someone who is childless...", "story": "children to someone who has none", "problem": "Different wording."}, {"kind": "caption", "image": "Instead, understand, be kind and supportive.", "story": "They need understanding, not reminders of what they lack.", "problem": "Different wording."}, {"kind": "caption", "image": "Show empathy and understanding.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Be a good friend and support them.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Give them hope, not reminders.", "story": "They need understanding, not reminders of what they lack.", "problem": "“hope” instead of “understanding,” and “what they lack” is missing."}, {"kind": "caption", "image": "Say kind words, not things that hurt.", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Don’t remind the other person of something they don’t have. They need understanding.", "story": "Be careful not to deepen another person’s sense of loss. They need understanding, not reminders of what they lack.", "problem": "Different first sentence; second sentence is shortened."}], "preview": "../../en/wisdom-stories/illustrations/do-not-do-these-things.webp"}, {"stem": "be-sure-of-your-purpose", "title": "Be Sure of Your Purpose", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "Be Sure of Your Purpose", "story": "Be Sure of Your Purpose", "problem": ""}, {"kind": "caption", "image": "Two men are trying to move a heavy chest through a doorway, not sure whether to push in or out.", "story": "Two men were struggling to move a heavy chest through a doorway.", "problem": "Adds that they were unsure; the story has them aiming inside."}, {"kind": "speech", "image": "We’re not sure whether it’s meant to go inside or out.", "story": "“What a heavy chest! We still haven’t managed to get it inside.”", "problem": "Different speech."}, {"kind": "speech", "image": "Maybe we should first find out where it actually belongs!", "story": "“Weren’t we supposed to take it outside?”", "problem": "Different speech."}, {"kind": "caption", "image": "Do not begin any work without first clarifying the purpose. Otherwise you may labor in the wrong direction.", "story": "Clarify the goal before beginning the work. Otherwise, you may labor for hours while directing all your strength the wrong way.", "problem": "Reworded."}, {"kind": "moral", "image": "Clarify the goal before beginning the work. Otherwise you may labor the wrong way.", "story": "Clarify the goal before beginning the work. Otherwise, you may labor for hours while directing all your strength the wrong way.", "problem": "Missing “for hours while directing all your strength.”"}], "preview": "../../en/wisdom-stories/illustrations/be-sure-of-your-purpose.webp"}, {"stem": "what-it-means-to-be-late", "title": "Before It Is Too Late", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "What does it mean to be late?", "story": "Before It Is Too Late", "problem": "Title does not match the story title."}, {"kind": "thought", "image": "Shall I say?", "story": "not delaying the words that need to be said", "problem": "Thought is not story wording."}, {"kind": "thought", "image": "I'll say it later...", "story": "let us not postpone the affairs of the heart", "problem": "Paraphrase, not the story sentence."}, {"kind": "caption", "image": "Being late — whether in expressing something or in understanding — is still being late.", "story": "Sometimes being late means more than missing an appointment. It means missing a chance to do what matters in a relationship.", "problem": "Caption changes the meaning of being late."}, {"kind": "speech", "image": "I love you so much!", "story": "Expressing love", "problem": "Spoken line is not in the story."}, {"kind": "speech", "image": "I forgive you.", "story": "forgiving someone", "problem": "Spoken line is not in the story."}, {"kind": "speech", "image": "I'm sorry.", "story": "offering an apology", "problem": "Spoken line is not in the story."}, {"kind": "caption", "image": "Expressing love, forgiving, and apologizing — when it is time — is beautiful.", "story": "Expressing love, forgiving, and apologizing on time is beautiful.", "problem": "“when it is time” replaces “on time.”"}, {"kind": "speech", "image": "I was wrong.", "story": "acknowledging them, making amends", "problem": "Spoken line is not in the story."}, {"kind": "speech", "image": "I understand.", "story": "", "problem": "No matching story sentence."}, {"kind": "speech", "image": "Let's fix it together.", "story": "making amends", "problem": "Spoken line is not in the story."}, {"kind": "caption", "image": "When we correct our mistake, hearts connect again. Life is precious.", "story": "Life is short.", "problem": "Says life is precious instead of short, and adds hearts connecting."}, {"kind": "moral", "image": "Expressing love, forgiving, and apologizing on time is beautiful. Life is short — let us not postpone the affairs of the heart.", "story": "Expressing love, forgiving, and apologizing on time is beautiful. Life is short - let us not postpone the affairs of the heart.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/what-it-means-to-be-late.webp"}, {"stem": "being-human", "title": "Being Human", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "Being Human", "story": "Being Human", "problem": ""}, {"kind": "caption", "image": "It is easy to gain knowledge, but hard to become a true human.", "story": "“It is easy to become a scholar, but difficult to become a true human being,”", "problem": "“gain knowledge” / “hard” instead of “become a scholar” / “difficult,” and “human” instead of “human being.”"}, {"kind": "other", "image": "SCIENCE HISTORY PHILOSOPHY", "story": "", "problem": "Book labels are not in the story."}, {"kind": "caption", "image": "Being human means compassion, humility, kindness, justice, and respect...", "story": "It means living with virtue, wisdom, civility, justice, honor, and dignity.", "problem": "Different virtues."}, {"kind": "other", "image": "COMPASSION HUMILITY KINDNESS JUSTICE RESPECT", "story": "", "problem": "Labels do not match the story’s list."}, {"kind": "caption", "image": "Words without roots; advice without practice; selfish deeds...", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "I speak for my own gain, not for the common good!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "I give advice, but do not follow it myself!", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Those who do not show kindness, cannot earn true love...", "story": "knowing how to love.", "problem": "Different wording."}, {"kind": "moral", "image": "True worth lies not in knowledge alone, but in humanity.", "story": "True worth lies not in knowledge alone, but in humanity. A heart capable of respect also makes room for love and justice.", "problem": "Second moral sentence is missing from the image."}], "preview": "../../en/wisdom-stories/illustrations/being-human.webp"}, {"stem": "to-be-self-confident", "title": "Believe in Yourself", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "Being self-confident", "story": "Believe in Yourself", "problem": "Title does not match."}, {"kind": "speech", "image": "Believe in yourself!", "story": "Value yourself!", "problem": "Different line."}, {"kind": "speech", "image": "Do not give up!", "story": "Do not give in to weakness.", "problem": "Different wording."}, {"kind": "speech", "image": "You have inner strength!", "story": "Build on your strengths.", "problem": "Different wording."}, {"kind": "speech", "image": "Don’t lose hope!", "story": "Do not lose hope!", "problem": "“Don’t” instead of “Do not.”"}, {"kind": "speech", "image": "You can do it!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Stay strong!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Feel proud of yourself!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Protect your dignity!", "story": "Protect your dignity!", "problem": ""}, {"kind": "speech", "image": "Have faith!", "story": "Be faithful!", "problem": "Different wording."}, {"kind": "moral", "image": "Moral: Value yourself, do not lose hope, protect your dignity. Self-confidence is a person’s strongest support.", "story": "Value yourself, do not lose hope, protect your dignity. Self-confidence is a person's strongest support.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/to-be-self-confident.webp"}, {"stem": "bell-to-hang-on-the-cats-neck", "title": "Belling the Cat", "category": "Justice and society", "status": "Needs correction", "items": [{"kind": "title", "image": "A bell to hang from the cat’s neck", "story": "Belling the Cat", "problem": "Title wording differs."}, {"kind": "caption", "image": "The mice gathered in a meeting because a cat had been causing them a lot of trouble. They struggled to find a way to escape from him.", "story": "A group of mice gathered to discuss how to protect themselves from a cat that had been terrorizing them.", "problem": "“a lot of trouble” and “escape” replace “terrorizing” and “protect themselves.”"}, {"kind": "speech", "image": "If we hang a bell around the cat’s neck, we will be warned whenever he comes.", "story": "a young mouse suggested fastening a bell around the cat’s neck. Whenever the cat approached, they would hear the bell and have time to escape.", "problem": "Drops time to escape."}, {"kind": "caption", "image": "Everyone thought it was a great idea and applauded.", "story": "The mice greeted the plan with enthusiastic applause.", "problem": "Close, but “Everyone thought it was a great idea” is extra."}, {"kind": "speech", "image": "That's well and good. But who will hang the bell around the cat’s neck?", "story": "That is a clever idea, and I’m sure it would work. But there is one thing I’d like to know: who is going to put the bell on the cat?", "problem": "Drops “clever idea” and “I’m sure it would work,” and uses hang instead of put."}, {"kind": "moral", "image": "It is easy to make a plan, but difficult to carry it out. Even the brightest idea unused is worthless.", "story": "Making a plan is easier than carrying it out. Even the cleverest idea is of little use unless someone can put it into practice.", "problem": "“brightest” and “unused is worthless” differ from “cleverest” and “of little use unless someone can put it into practice.”"}], "preview": "../../en/wisdom-stories/illustrations/bell-to-hang-on-the-cats-neck.webp"}, {"stem": "shepherd-must-be-called", "title": "Call the Shepherd", "category": "Word, silence, and communication", "status": "Needs correction", "items": [{"kind": "title", "image": "You need to call the shepherd", "story": "Call the Shepherd", "problem": "Different title."}, {"kind": "caption", "image": "A student who had finished his studies went to his master to ask for his blessing before embarking on a journey.", "story": "After years of study, a student asked his master for a final blessing before leaving.", "problem": "Adds a journey."}, {"kind": "speech", "image": "Master, I have a question. I see many people around me struggling and feeling trapped in difficult situations. No matter what they do, they can't seem to escape. What should I do?", "story": "“Ask me, Master.”", "problem": "The student does not ask this in the story."}, {"kind": "speech", "image": "Alright then, I will ask you a question.", "story": "“First, answer one question. Then I’ll know whether you’ve understood what I’ve taught you.”", "problem": "Shorter and different."}, {"kind": "speech", "image": "Suppose you are walking down the road and you see a pack of wild dogs blocking your way. No matter how hard you try, you can't get through. What would you do?", "story": "“Imagine you are returning to your village when a shepherd’s fierce dogs attack. How will you protect yourself?”", "problem": "Wild dogs blocking a road, not a shepherd’s dogs attacking."}, {"kind": "speech", "image": "I would try to find another way, wait until they move, or maybe throw something to scare them away.", "story": "“I’ll throw stones to drive them away.”", "problem": "Different reply."}, {"kind": "speech", "image": "Good, that's one way. But listen to another option — what if nothing works and they still don't let you pass?", "story": "“You might stop one or two, but you can’t fight the whole pack.”", "problem": "Different reply."}, {"kind": "speech", "image": "Then... then I don't know.", "story": "The student realizes that he is helpless and asks his master for help.", "problem": "Wording differs."}, {"kind": "speech", "image": "Think carefully. Is there a wiser, more effective way in such a situation? What would you do then?", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Ah, I see! When nothing works and I can't beat the dogs or get past them, the best solution is to call the shepherd. He is the one who can control them and help me get through.", "story": "“Call the shepherd and ask him to call off his dogs. They will stop at the sound of his voice.”", "problem": "The student says this; in the story the master does."}, {"kind": "moral", "image": "Moral: Not every problem can be solved by force. Sometimes taking a step back and looking at it differently is the shortest way out.", "story": "Not every problem can be solved by force. Sometimes taking a step back and looking at it differently is the shortest way out.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/shepherd-must-be-called.webp"}, {"stem": "can-a-broken-heart-love-again", "title": "Can a Broken Heart Love Again?", "category": "Love and marriage", "status": "Needs correction", "items": [{"kind": "title", "image": "Will a broken heart love again?", "story": "Can a Broken Heart Love Again?", "problem": "“Will” instead of “Can.”"}, {"kind": "speech", "image": "Will a broken heart love again?", "story": "Can a broken heart love again?", "problem": "“Will” instead of “Can.”"}, {"kind": "speech", "image": "Yes, it will.", "story": "Yes, it can", "problem": "“Will” instead of “can.”"}, {"kind": "speech", "image": "How can water flow from a broken jug?", "story": "But have you ever drunk water from a broken vessel?", "problem": "Asks whether water can flow from a jug, not whether one has drunk from a broken vessel."}, {"kind": "speech", "image": "Do you think the heart stops loving just because it has been broken?", "story": "have you ever given up drinking water because a vessel broke?", "problem": "Different question."}, {"kind": "other", "image": "Even if the heart is broken, it does not stop loving. A heart that has loved once is never taken away from the ability to love.", "story": "Even if the heart is broken, it does not stop loving.", "problem": "The second sentence is not in the moral."}, {"kind": "moral", "image": "Even if the heart is broken, it does not stop loving.", "story": "Even if the heart is broken, it does not stop loving. Just as one does not stop drinking water because a vessel is broken, so too does a person continue to love.", "problem": "The vessel comparison is missing."}], "preview": "../../en/wisdom-stories/illustrations/can-a-broken-heart-love-again.webp"}, {"stem": "not-every-sorrow-is-told-to-people", "title": "Choose Your Confidants Carefully", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "«Not every pain is told to people»", "story": "Not every sorrow should be shared with everyone.", "problem": "'pain is told to people' replaces 'sorrow should be shared with everyone'."}, {"kind": "caption", "image": "Not every pain is told to people.", "story": "Not every sorrow should be shared with everyone.", "problem": "'pain is told' replaces 'sorrow should be shared'."}, {"kind": "other", "image": "MY PAIN", "story": "Trust your pain to people who will treat it with care.", "problem": ""}, {"kind": "caption", "image": "The day will come, they will hit you with that pain.", "story": "Some people may one day use it to hurt you.", "problem": "'hit you with that pain' replaces 'use it to hurt you'."}, {"kind": "thought", "image": "CHOOSE HOW AND TO WHOM", "story": "Choose Your Confidants Carefully", "problem": "Not the story's wording."}, {"kind": "other", "image": "MORAL LESSONS", "story": "", "problem": ""}, {"kind": "moral", "image": "Moral: Don't tell every secret to everyone. One day they may hit you with that pain - choose who you tell.", "story": "Moral: Trust your pain to people who will treat it with care.", "problem": "Secrets and 'hit you with that pain' replace trusting pain to people who will treat it with care."}, {"kind": "other", "image": "THINK", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "CHOOSE", "story": "Choose Your Confidants Carefully", "problem": ""}, {"kind": "other", "image": "THEN TELL", "story": "", "problem": "Not in the story."}], "preview": "../../en/wisdom-stories/illustrations/not-every-sorrow-is-told-to-people.webp"}, {"stem": "those-you-should-not-befriend", "title": "Choose Your Friends Wisely", "category": "Friendship and human relations", "status": "Needs correction", "items": [{"kind": "title", "image": "Those who will not be friends", "story": "Choose Your Friends Wisely", "problem": "Title does not match."}, {"kind": "speech", "image": "Do not befriend an arrogant person! You may not know the value of yourself; do not tolerate insult.", "story": "Be wary of an arrogant friend who has no understanding of your feelings.", "problem": "Different wording and meaning."}, {"kind": "speech", "image": "Do not befriend a self-satisfied person! Such a person boasts, brags and cannot accept advice.", "story": "Be wary of someone convinced of their own brilliance, who talks endlessly but listens little.", "problem": "Different wording."}, {"kind": "speech", "image": "Do not befriend a cowardly person! Such a person does not stand for the truth; do not tolerate insult.", "story": "Be wary of a coward who will not stand by you when courage is needed.", "problem": "“does not stand for the truth” and “do not tolerate insult” differ from the story."}, {"kind": "moral", "image": "Moral: Only regret remains from friendship with an arrogant, self-satisfied and cowardly person. Choose your friend accordingly.", "story": "Arrogance, conceit, and cowardice can make friendship painful. Look for kindness, humility, and loyalty.", "problem": "Different moral wording and meaning."}], "preview": "../../en/wisdom-stories/illustrations/those-you-should-not-befriend.webp"}, {"stem": "go-but-come-again", "title": "Come Again Soon", "category": "Friendship and human relations", "status": "Needs correction", "items": [{"kind": "title", "image": "Go away, but come again", "story": "Come Again Soon", "problem": "Different title."}, {"kind": "caption", "image": "In Ottoman custom, guest's shoes were placed pointing toward the house as a subtle message.", "story": "a host placed a departing guest's shoes at the door with their toes pointing into the house.", "problem": "toward the house instead of toes pointing into the house."}, {"kind": "caption", "image": "It meant: \"Go away, but come again\" — a wish for the guest to return.", "story": "The gesture meant, \"Go safely, and come again.\"", "problem": "Go away instead of Go safely."}, {"kind": "moral", "image": "Moral: A subtle gesture can convey great kindness. The value given to a person is often seen in small moments.", "story": "A subtle gesture can convey great kindness. The value given to a person is often seen in small moments.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/go-but-come-again.webp"}, {"stem": "communication", "title": "Communication", "category": "Word, silence, and communication", "status": "Needs correction", "items": [{"kind": "title", "image": "Communication", "story": "Communication", "problem": ""}, {"kind": "caption", "image": "Communicate with the elderly to see experience.", "story": "Spend time with older people and children, and you will find experience in one and innocence in the other.", "problem":
