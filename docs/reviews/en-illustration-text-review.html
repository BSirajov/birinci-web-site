oblem": "Not in the story."}, {"kind": "caption", "image": "The son grew up, became a young man, and instead of his father, went to serve his homeland. His mother said, “Go, my son. May God protect you. I will wait for you.”", "story": "I grew up and opened a shop.", "problem": "Different life events and speech."}, {"kind": "caption", "image": "Years passed. The years brought gray hair to her head, but she never lost hope. She kept waiting for her son, saying, “Maybe he will come.”", "story": "Years passed, and she grew old. Leaning on her cane, she still came to remind me, “Call me if your father returns.”", "problem": "Image has her waiting for her son; story has her waiting for the father."}, {"kind": "caption", "image": "One day, her son fell as a martyr on the battlefield. The news came. The mother did not cry out. She said, “I am proud of my son. He has become a martyr for his homeland.”", "story": "One day, she became ill and fell into bed.", "problem": "Different events and speech."}, {"kind": "caption", "image": "No matter how much time passed, her heart and prayers remained the same.", "story": "She was always watching the road, waiting for him.", "problem": "Different wording."}, {"kind": "speech", "image": "Welcome, sir, my son, welcome.", "story": "“Welcome home, my bey. Welcome.”", "problem": "“sir, my son” is not the story greeting."}, {"kind": "caption", "image": "She whispered these words to her heart.", "story": "Then she died.", "problem": "Different ending detail."}, {"kind": "caption", "image": "In the heart of Baku stands the Alley of Martyrs.", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "The Alley of Martyrs. This is the Alley of Martyrs, where brave men sacrificed their lives for our homeland. We bow our heads in deep respect and gratitude for their souls.", "story": "May all who fell at Çanakkale, including the Azerbaijani soldiers, rest in peace.", "problem": "Different place and wording."}, {"kind": "moral", "image": "Moral: A mother’s lifelong loyalty and longing are the purest expression of love. The memory of those who died for the homeland is sacred.", "story": "A lifetime of waiting bears witness to love and loss. Remember both those who died for their homeland and the families who waited for them.", "problem": "Different moral wording."}], "preview": "../../en/wisdom-stories/illustrations/welcome-my-bey.webp"}, {"stem": "what-changed-after-sixty", "title": "What Changed After Sixty", "category": "Aging and time", "status": "Needs correction", "items": [{"kind": "title", "image": "What has changed after sixty", "story": "What Changed After Sixty", "problem": "Extra word \"has\"."}, {"kind": "caption", "image": "At sixty, I let go of chasing others’ approval. I live for myself now. Peace matters more than praising.", "story": "I no longer tell older people, ‘You’ve already told me that story.’", "problem": "Not the story’s list of changes."}, {"kind": "caption", "image": "I no longer try to prove myself right in every conversation. I’ve learned that sometimes it’s wiser to listen than to argue.", "story": "I no longer feel I must correct every mistake.", "problem": "Different wording."}, {"kind": "caption", "image": "I value people who truly understand me, not those who always agree with me. Quality matters more than quantity.", "story": "I have learned to step away from relationships in which we cannot understand or treat each other well.", "problem": "Different wording."}, {"kind": "caption", "image": "I let go of what I can’t change. There’s no point worrying about things beyond my control.", "story": "And I ask the Lord for strength to change what I can, patience to accept what I cannot, and wisdom to know the difference.", "problem": "Shortened and different wording."}, {"kind": "caption", "image": "I’ve learned to love myself as I am now. I no longer compare myself to others. I accept, and that brings peace.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "In my world now, I surround myself with those who bring me peace. I have no time or energy for drama or negativity.", "story": "Spend less time with people who leave you feeling discouraged and more with those whose company brings you joy.", "problem": "That line is in another story, not this one; the wording still differs from the nearest change in this story."}, {"kind": "caption", "image": "I no longer take things to heart like I used to. What others say about me is their business, not mine.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "True friendship is rare, and I value it deeply. A few honest friends are worth more than a crowd of shallow connections.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "I’ve stopped trying to change others. Everyone has their own path, and I respect that.", "story": "I have stopped saying, ‘When I was your age,’ or ‘I gave you my best years.’ Each generation faces its own circumstances.", "problem": "Different point."}, {"kind": "caption", "image": "I focus on what truly matters—spending time with loved ones and finding joy in the simple things in life.", "story": "I make time for things that bring me joy.", "problem": "Different wording."}, {"kind": "caption", "image": "I’ve learned that happiness is not found in things or status, but in gratitude for every small blessing every day.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "I now give advice only when asked. I’ve learned that experience is a good teacher, but everyone must live their own lessons.", "story": "I have learned to ask before helping.", "problem": "Different wording."}, {"kind": "caption", "image": "I forgive more easily now. Holding grudges only hurts me. Letting go brings lightness to my heart and peace to my soul.", "story": "", "problem": "Not in this story."}, {"kind": "caption", "image": "I’m proud of how far I’ve come. I don’t chase more—I cherish what I have and the people in my life.", "story": "I no longer blame myself for everything. I have done what I could for myself and my children.", "problem": "Different wording."}, {"kind": "caption", "image": "At sixty, I see life with clearer eyes. I’ve learned that peace is better than perfection, and understanding is better than being right.", "story": "Moral: Age teaches a person the greatest wisdom: peace is better than perfection, and understanding is better than being right.", "problem": "The moral sentence is moved into a panel and given a different opening."}, {"kind": "moral", "image": "Moral: Age teaches a person the greatest wisdom: peace is better than perfection, and understanding is better than being right.", "story": "Moral: Age teaches a person the greatest wisdom: peace is better than perfection, and understanding is better than being right.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/what-changed-after-sixty.webp"}, {"stem": "i-am-aware-now", "title": "What I Know Now", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "I am now aware", "story": "What I Know Now", "problem": "Title wording differs."}, {"kind": "caption", "image": "I used to try so hard to make everyone like me; I thought it meant I was worthy.", "story": "I no longer try to make people love me. Those who do not want to will always find a reason.", "problem": "Past habit and 'worthy' replace the story's present decision and the point that unwilling people always find a reason."}, {"kind": "caption", "image": "I realized I can't make everyone happy, and that's okay.", "story": "I no longer try to make people love me.", "problem": "Says making everyone happy is okay; the story is about no longer trying to make people love him."}, {"kind": "speech", "image": "TOO MUCH", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "SENSITIVE", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "OVERTHINKING", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "DISTANT", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "I stopped seeking approval from people who don't value me; I walk away in peace.", "story": "I no longer want to spend my life among the arrogant and self-satisfied.", "problem": "Different people and a different response than the story."}, {"kind": "thought", "image": "SELF-RESPECT FIRST", "story": "I know my worth now. I do not have to prove it to everyone.", "problem": "Not the story's wording."}, {"kind": "caption", "image": "Now I choose to surround myself with people who respect and appreciate me.", "story": "I know I am happiest with people around whom I can be myself.", "problem": "Respect and appreciation replace being oneself."}, {"kind": "other", "image": "I CHOOSE PEACE AND GROWTH", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Moral: True maturity is not about changing others, but about knowing who to let into your life and who to stay away from.", "story": "Moral: True maturity is not about changing others, but about knowing who to let into your life and who to stay away from.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/i-am-aware-now.webp"}, {"stem": "what-is-a-word", "title": "What Is a Word?", "category": "Word, silence, and communication", "status": "Needs correction", "items": [{"kind": "title", "image": "What is a word?", "story": "What Is a Word?", "problem": ""}, {"kind": "caption", "image": "Words can hurt.", "story": "A word can wound;", "problem": "Plural “words” instead of “a word.”"}, {"kind": "speech", "image": "You're so dumb!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Nobody likes you!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "You're useless!", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Harsh words are like thorns that wound the heart and leave scars.", "story": "A word can be both a wounding thorn and a precious pearl.", "problem": "Adds scars; not the story sentence."}, {"kind": "caption", "image": "Words can heal.", "story": "a word can be a pearl.", "problem": "“heal” is not “pearl.”"}, {"kind": "caption", "image": "Kind, loving words are like pearls that bring joy, love, and warmth to the heart.", "story": "a word can be a pearl.", "problem": "Extra wording."}, {"kind": "speech", "image": "You did a great job!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "I'm proud of you!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "You're awesome!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Thank you for helping me!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "You're my friend!", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Kind words build friendship, bring people closer, and make the world a better place.", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "A word can be both a wounding thorn and a precious pearl. What makes the difference is how you use it.", "story": "A word can be both a wounding thorn and a precious pearl. What makes the difference is how you use it.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/what-is-a-word.webp"}, {"stem": "what-do-i-need-it-for", "title": "What Is It to Me?", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "What do I need?", "story": "What Is It to Me?", "problem": "Title asks what is needed, not the story’s “What is it to me?”"}, {"kind": "caption", "image": "Sultan Suleman is thinking to himself while his subjects are being oppressed.", "story": "Suleiman the Magnificent (1494–1566), who ruled from 1520 until his death, brought the Ottoman state to great power.", "problem": "Name spelled Suleman; scene and wording are not in the story."}, {"kind": "thought", "image": "I see, oppression and injustice are growing... What do I need to do?", "story": "Yet he sometimes wondered whether the dynasty might one day decline and fall.", "problem": "Thought bubble changes the sultan’s question into what he should do."}, {"kind": "caption", "image": "Grand Vizier Yahya Efendi presents a report.", "story": "He wrote to his foster brother, the scholar Yahya Efendi", "problem": "Calls him Grand Vizier and shows a report, not a letter to a foster brother."}, {"kind": "caption", "image": "A peasant's house collapsed. What became of the Ottoman subjects?", "story": "Under what circumstances does a state collapse? Could such a fate await the house of Osman?", "problem": "Replaces the dynasty question with a collapsed house and Ottoman subjects."}, {"kind": "caption", "image": "Yahya Efendi answers briefly.", "story": "The reply was brief: “What is it to me, my Sultan?”", "problem": "Caption matches the idea of a brief reply, but the letter does not."}, {"kind": "speech", "image": "What do I need to do, Sultan?", "story": "What is it to me, my Sultan?", "problem": "The reply is rewritten as a question about what to do."}, {"kind": "caption", "image": "Sultan Suleiman goes to the Beşiktaş dervish lodge.", "story": "He went to see him in Beşiktaş.", "problem": "Adds a dervish lodge the story does not name."}, {"kind": "speech", "image": "What do you say, master? What should we do? How shall we relieve their suffering?", "story": "Brother, please take my letter seriously and give me an answer.", "problem": "The sultan’s words are not the story dialogue."}, {"kind": "speech", "image": "Sultan, if you do not feel the pain of your subjects, how shall We feel it? If the sufferings of your people do not disturb you, then there is no justice in your rule.", "story": "I have, my Sultan. I considered it carefully and gave you my answer.", "problem": "This speech is not Yahya Efendi’s reply in the story."}, {"kind": "caption", "image": "Yahya Efendi tries to defend himself.", "story": "Yahya Efendi explained:", "problem": "The story has him explain, not defend himself."}, {"kind": "speech", "image": "Sultan, if decadence spreads in the state and injustice grows, such states become corrupt. And that's how societies that say, “What do I need to do?” come to ruin.", "story": "When oppression spreads and injustice takes the throne, people ask, ‘What is it to me?’", "problem": "Keeps the wrong phrase “What do I need to do?” and drops the story’s explanation."}, {"kind": "caption", "image": "The wise dervish prays for the Sultan and the Ummah.", "story": "Moved to tears, the sultan bowed his head.", "problem": "Prayer scene is not in the story."}, {"kind": "moral", "image": "A society that sees oppression and says, “What do I need?” falls into decline. Turning a blind eye to injustice is also complicity in injustice.", "story": "A society weakens when people see injustice and say, “What is it to me?” Indifference allows oppression to grow.", "problem": "Moral uses “What do I need?” and adds complicity wording the story does not use."}], "preview": "../../en/wisdom-stories/illustrations/what-do-i-need-it-for.webp"}, {"stem": "what-is-loyalty", "title": "What Is Loyalty?", "category": "Love and marriage", "status": "Needs correction", "items": [{"kind": "title", "image": "What is loyalty?", "story": "What Is Loyalty?", "problem": ""}, {"kind": "other", "image": "Welcome Home", "story": "", "problem": "Sign is not in the story."}, {"kind": "caption", "image": "Loyalty is not abandoning on a difficult day, not turning your back when things get hard...", "story": "Not turning your back on a difficult day,", "problem": "“Abandoning” and “when things get hard” are extra."}, {"kind": "caption", "image": "Comfort a friend while he's hurting, and stand by his side like a rock — that is loyalty...", "story": "Loyalty means being with your friend, Balm for the wounded,", "problem": "“Like a rock” is not in the story."}, {"kind": "caption", "image": "Loyalty is not throwing away a rose because of its thorn.", "story": "not discarding a rose because it has thorns.", "problem": "“Throwing away” and “its thorn” instead of “discarding” and “thorns.”"}, {"kind": "moral", "image": "Moral: Loyalty is not abandoning on a difficult day, not throwing away a rose because of its thorn. It is not a word, but a deed.", "story": "Loyalty means staying present in hard times. It is shown through actions, not declarations.", "problem": "Different wording."}], "preview": "../../en/wisdom-stories/illustrations/what-is-loyalty.webp"}, {"stem": "what-we-learn-in-life", "title": "What Life Teaches Us", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "What we learn in life", "story": "What Life Teaches Us", "problem": "Title wording differs from the story title."}, {"kind": "caption", "image": "From the wise: loyalty.", "story": "some teach us patience, love, loyalty, and integrity", "problem": "Assigns loyalty only to the wise and drops patience and integrity."}, {"kind": "caption", "image": "From parents: love.", "story": "some teach us patience, love, loyalty, and integrity", "problem": "Narrows the lesson to one label."}, {"kind": "caption", "image": "From friends: loyalty.", "story": "some teach us patience, love, loyalty, and integrity", "problem": "Not the story’s wording."}, {"kind": "caption", "image": "From teachers: knowledge.", "story": "Throughout life, we keep learning from others", "problem": "Knowledge is not named in the story."}, {"kind": "caption", "image": "From books: understanding.", "story": "", "problem": "Books are not in the story."}, {"kind": "caption", "image": "In life, we learn constantly: from the wise, from parents, from friends, from teachers, from books.", "story": "Throughout life, we keep learning from others", "problem": "Adds sources the story does not list."}, {"kind": "caption", "image": "From the insincere: duplicity.", "story": "others show us what deceit, malice, and betrayal look like", "problem": "Duplicity is not the story’s word."}, {"kind": "caption", "image": "From hypocrites: false faces.", "story": "deceit, malice, and betrayal", "problem": "Not the story’s wording."}, {"kind": "caption", "image": "From the boastful: selfishness.", "story": "", "problem": "Boastfulness and selfishness are not in the story."}, {"kind": "caption", "image": "From backbiters: betrayal.", "story": "betrayal", "problem": "Adds backbiters."}, {"kind": "caption", "image": "From traitors: abandonment.", "story": "betrayal", "problem": "Abandonment is not in the story."}, {"kind": "other", "image": "PAIN", "story": "", "problem": "Sign is not in the story."}, {"kind": "other", "image": "REGRET", "story": "", "problem": "Sign is not in the story."}, {"kind": "caption", "image": "From the insincere, from the boastful, from hypocrites, from backbiters, from traitors: we learn duplicity, selfishness, betrayal, abandonment.", "story": "others show us what deceit, malice, and betrayal look like", "problem": "Replaces deceit and malice with a different list."}, {"kind": "caption", "image": "Every person is a teacher, every event is a lesson, every experience is a treasure. Some lead us to good, some show us what to avoid.", "story": "Every encounter can teach us something—either how to behave or how not to.", "problem": "Paraphrase with extra claims."}, {"kind": "moral", "image": "Life teaches us something from every person: from whom to be loyal, from whom to be treason. Both are lessons.", "story": "Every encounter can teach us something—either how to behave or how not to.", "problem": "“to be treason” is ungrammatical and not the story moral."}], "preview": "../../en/wisdom-stories/illustrations/what-we-learn-in-life.webp"}, {"stem": "what-matters-in-life", "title": "What Matters Most", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "What is important in life?", "story": "What Matters Most", "problem": "Title wording differs from the story title."}, {"kind": "speech", "image": "Imagine this jar is your life. It has time, energy, and opportunities. What you put in it today will decide how full your life is.", "story": "Think of this jar as your life.", "problem": "Adds time, energy, and opportunities the story does not say."}, {"kind": "speech", "image": "So, what will you put in it first?", "story": "Is it full?", "problem": "Question is not in the story."}, {"kind": "speech", "image": "Family!", "story": "The golf balls are what you value most: your family, friends, and loved ones.", "problem": "Short reply is not the students’ “Yes.”"}, {"kind": "speech", "image": "What about love? Will you put that in?", "story": "", "problem": "Love is in the moral, not asked this way in the story."}, {"kind": "speech", "image": "Yes!", "story": "Yes", "problem": ""}, {"kind": "speech", "image": "And health? Will you add that too?", "story": "family, love, and health", "problem": "Health is in the moral, not a classroom question in the story."}, {"kind": "speech", "image": "That's right! If you fill your jar with tiny things — like worries, small tasks, gossip, or distractions — there won't be any room left for the things that truly matter.", "story": "If I put the sand in first, there would be no room for the balls or pebbles.", "problem": "Lists worries, gossip, and distractions the story does not."}, {"kind": "speech", "image": "If you fill your jar with sand first, there's no room for the golf balls or the rocks. Choose carefully what goes in your life.", "story": "If I put the sand in first, there would be no room for the balls or pebbles.", "problem": "Says rocks instead of pebbles and adds a choice line."}, {"kind": "speech", "image": "If you focus on the little things, they will fill your jar with sand and pebbles, leaving no space for what truly matters.", "story": "Fill your life with small matters, and you may leave no time or energy for what matters most.", "problem": "Puts pebbles with the sand, which reverses the story’s order."}, {"kind": "moral", "image": "Fill the jar of life with the most valuable things first — family, love, and health. If you get caught up in the little things, there will be no room for the important things.", "story": "Fill the jar of life with the most valuable things first—family, love, and health. If you get caught up in the little things, there will be no room for the important things.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/what-matters-in-life.webp"}, {"stem": "turtles-wrong-calculation", "title": "What the Tortoise Forgot", "category": "Parables and fables", "status": "Needs correction", "items": [{"kind": "title", "image": "The tortoise’s wrong calculation", "story": "What the Tortoise Forgot", "problem": "Title wording differs."}, {"kind": "speech", "image": "So, where are you headed to, and how long will it take you?", "story": "How long will it take you to reach the next village?", "problem": "Adds \"where are you headed to\"."}, {"kind": "speech", "image": "I’m thinking of going to Yadish, a nearby village. It’s a distance of six days’ walk, so I’ll plan to complete it in six days...", "story": "It’s a three-day journey, allowing for rain, mud, wind, and hills. I’ll give myself six.", "problem": "The village name \"Yadish\" is not in the story, and a six-day walk planned in six days drops the three-day journey doubled to six."}, {"kind": "caption", "image": "After six days...", "story": "Six days later, the tortoise was still missing.", "problem": "Shortened."}, {"kind": "other", "image": "Yadish still six days away", "story": "", "problem": "\"Yadish\" is not in the story."}, {"kind": "speech", "image": "What’s wrong? You said you would reach in six days. Didn’t you know?", "story": "Why haven’t you arrived?", "problem": "Different wording."}, {"kind": "speech", "image": "I... calculated everything except one thing. I didn’t know that people would stand in the way and block my journey.", "story": "I allowed for the weather and the road, but I forgot to allow for unkind people. As soon as I set off, someone picked me up and turned me upside down.", "problem": "Drops the weather, the road, and being turned upside down."}, {"kind": "moral", "image": "Moral: You can calculate every difficulty in life, but not people with bad intentions. May God not let you face those who prevent you from moving forward.", "story": "Moral: You can calculate every difficulty in life, but not people with bad intentions. May Allah not let you face those who prevent you from moving forward, but those who support you.", "problem": "\"God\" instead of \"Allah\"; missing \"but those who support you\"."}], "preview": "../../en/wisdom-stories/illustrations/turtles-wrong-calculation.webp"}, {"stem": "properties-of-water", "title": "What Water Teaches Us", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "Properties of water", "story": "What Water Teaches Us", "problem": "Different title."}, {"kind": "caption", "image": "When water is kind to a tree, it keeps it alive.", "story": "It nourishes a tree.", "problem": "Different wording."}, {"kind": "caption", "image": "When water is poured on fire, it cools it down.", "story": "It puts out a fire.", "problem": "Cools instead of puts out."}, {"kind": "caption", "image": "When water meets soap, it becomes clean.", "story": "It washes away dirt.", "problem": "Soap is not in the story."}, {"kind": "caption", "image": "When water meets flour, it turns into dough, ready to become bread.", "story": "Mixed with flour, it makes dough.", "problem": "Adds \"ready to become bread.\""}, {"kind": "caption", "image": "When water rises to the sky, it brings rain.", "story": "Meeting sunlight, it forms a rainbow.", "problem": "Rain instead of a rainbow."}, {"kind": "caption", "image": "When water flows, it gives life.", "story": "Flowing, it brings life.", "problem": "gives instead of brings."}, {"kind": "caption", "image": "But when water stays still, it becomes stagnant.", "story": "Standing still, it can grow stagnant.", "problem": "Drops \"can grow\" and says \"becomes.\""}, {"kind": "caption", "image": "In solitude it stagnates — the heart needs connection like water needs flow.", "story": "The heart is like water: it is renewed through connection, but can grow stagnant in isolation.", "problem": "Different wording."}, {"kind": "moral", "image": "The human heart is like water: it comes alive in communication and withers in solitude. Other people keep a person alive.", "story": "Moral: Human connection keeps the heart alive, just as movement keeps water fresh.", "problem": "Adds \"withers\" and \"Other people keep a person alive,\" and drops fresh water."}], "preview": "../../en/wisdom-stories/illustrations/properties-of-water.webp"}, {"stem": "what-women-have-endured-in-this-world", "title": "What Women Have Endured", "category": "Love and marriage", "status": "Needs correction", "items": [{"kind": "title", "image": "What did a woman suffer in this world...", "story": "What Women Have Endured", "problem": "Title does not match."}, {"kind": "caption", "image": "From childhood she was belittled, criticized, and treated as though she knew nothing.", "story": "They told her that her hair was long and her mind was short.", "problem": "Different wording."}, {"kind": "speech", "image": "Silent, unseen, she worked endlessly.", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "FLOUR", "story": "Your hands are covered in flour.", "problem": "Only the word flour is shown."}, {"kind": "caption", "image": "She made all the meals and kept the home running.", "story": "Your hands are covered in flour. Stay in the kitchen. Don’t interfere.", "problem": "Different wording."}, {"kind": "other", "image": "No one appreciated her efforts.", "story": "Few people knew your worth.", "problem": "Different wording."}, {"kind": "caption", "image": "When she gave, she gave without expecting thanks. Her patience and kindness were taken for granted.", "story": "Yet you wanted only to help, to care, and to make life better.", "problem": "Different wording."}, {"kind": "other", "image": "Thank you for everything, dear mom!", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Yet in all this, she gave her love; her heart was always full.", "story": "You loved being a mother, looking into your child’s eyes.", "problem": "“Heart was always full” is not the story line."}, {"kind": "speech", "image": "A woman's worth brings beauty to the world.", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "THANK YOU, MOM! WE LOVE YOU!", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Moral: There can be no peace or love where a woman is not valued. It is the duty of society to see her work and heart.", "story": "There can be no peace or love where a woman is not valued. It is the duty of society to see her work and heart.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/what-women-have-endured-in-this-world.webp"}, {"stem": "if-the-door-before-you-wont-open-it-is-not-your-door", "title": "When One Door Closes", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "If the door in front of you doesn't open, it's not your door", "story": "When One Door Closes", "problem": "Title is a different sentence from the story title and from Jamal's dialogue."}, {"kind": "caption", "image": "This is a reputable company. I've been working here for years. Salim, I'm asking for a raise. I believe I deserve it considering my dedication and results.", "story": "Jamal heard that a promotion might be available and went to speak to his manager, Salim Bey. He hoped he would be considered.", "problem": "Asks for a raise instead of a promotion, and the dialogue is not in the story."}, {"kind": "caption", "image": "Salim thought for a while and then said firmly, \"I'm sorry, Jamal, but we can't give you a raise.\" Those were the words that changed Jamal's life. He was fired from the company.", "story": "Salim Bey said he was satisfied with Jamal's work, but then unexpectedly dismissed him. \"You're not the right fit for us,\" he said.", "problem": "Firing is about a raise, not \"You're not the right fit for us.\""}, {"kind": "speech", "image": "I'm sorry, but we can't.", "story": "You're not the right fit for us", "problem": "Different refusal."}, {"kind": "caption", "image": "Two years passed. They met again by chance. Salim was surprised. Jamal was now running his own successful company. He thanked Salim for not giving him that raise. Salim was deeply moved.", "story": "Two years later, they met again and exchanged friendly greetings. Jamal said he had started his own company and that business was going well. Salim Bey was delighted.", "problem": "Adds surprise, a raise, and being deeply moved."}, {"kind": "speech", "image": "If you had given me that raise, I wouldn't have left the company and wouldn't have started my own. If I hadn't started my own, I wouldn't be where I am today. Thank you so much. The closed door back then led me to a much better path.", "story": "You let me go instead of keeping me somewhere I didn't belong. That gave me the push to do work I truly enjoy. I'm very happy now.", "problem": "Thanks Salim for refusing a raise rather than for letting him go."}, {"kind": "moral", "image": "Moral: Every closed door can be a sign of a better path. Sometimes deprivation of good leads to better.", "story": "Moral: A closed door can lead to a better path. Losing one opportunity sometimes creates room for another.", "problem": "Second sentence changes the moral."}], "preview": "../../en/wisdom-stories/illustrations/if-the-door-before-you-wont-open-it-is-not-your-door.webp"}, {"stem": "our-qualities-can-become-our-enemies", "title": "When Strengths Become Weaknesses", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "«Our qualities can be our enemies»", "story": "When Strengths Become Weaknesses", "problem": "Title wording differs."}, {"kind": "caption", "image": "The peacock is trapped by its own tail...", "story": "A peacock’s splendid tail can make it a target.", "problem": "'trapped by its own tail' replaces 'make it a target'."}, {"kind": "caption", "image": "The nightingale is trapped by its sweet tongue...", "story": "A nightingale’s beautiful song can lead it into a cage.", "problem": "'sweet tongue' and 'trapped' replace 'beautiful song' and 'a cage'."}, {"kind": "caption", "image": "The fox is trapped by its fancy fur...", "story": "A fox’s fine fur can draw a hunter’s attention.", "problem": "'fancy' and 'trapped' replace 'fine' and 'a hunter’s attention'."}, {"kind": "caption", "image": "We often admire ourselves and forget our weaknesses...", "story": "The qualities we prize most in ourselves can also make us vulnerable.", "problem": "Different sentence."}, {"kind": "moral", "image": "MORAL: Sometimes the trait we boast about is our weak point. Do not rely too much on your superiority.", "story": "Moral: What gives us pride can also become a weakness. Recognize the risks that accompany your gifts.", "problem": "'superiority' replaces recognizing the risks that accompany your gifts."}], "preview": "../../en/wisdom-stories/illustrations/our-qualities-can-become-our-enemies.webp"}, {"stem": "where-does-calamity-come-from", "title": "Where Does Misfortune Begin?", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Where does misfortune come from?", "story": "Where Does Misfortune Begin?", "problem": "Title says come from instead of Begin."}, {"kind": "caption", "image": "The teacher asks:", "story": "Someone asked a dervish:", "problem": "Speaker is a teacher, not someone asking a dervish."}, {"kind": "speech", "image": "Where does misfortune come from?", "story": "Where does misfortune come from?", "problem": ""}, {"kind": "speech", "image": "Have you checked your eyes to see what they look at?", "story": "Examine your eyes. Have you looked where you should not?", "problem": "Wording differs."}, {"kind": "speech", "image": "Have you checked your tongue to see what you say and what you keep silent?", "story": "Examine your tongue and ears. Have you spread or listened to gossip?", "problem": "Omits ears and gossip; adds silence."}, {"kind": "speech", "image": "Have you checked your hands to see what you do and take?", "story": "Examine your hands. Have you taken what is forbidden or earned your living dishonestly?", "problem": "Wording differs."}, {"kind": "speech", "image": "Have you checked your steps to see where they carry you?", "story": "Examine your feet. Have they carried you where you should not go?", "problem": "Wording differs."}, {"kind": "moral", "image": "The root of what happens to us can often be found in our own actions. Check your eyes, your tongue, your hands, and your steps.", "story": "The root of what happens to us can often be found in our own actions. Check your eyes, your tongue, your hands, and your steps.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/where-does-calamity-come-from.webp"}, {"stem": "where-does-this-road-go", "title": "Where Does This Road Go?", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "Where does this road lead?", "story": "Where Does This Road Go?", "problem": "“lead” replaces “go.”"}, {"kind": "speech", "image": "Sir, where does this road lead?", "story": "Where does this road go?", "problem": "Adds Sir and uses lead."}, {"kind": "speech", "image": "Nowhere in particular, my son.", "story": "Nowhere, my son.", "problem": "Adds “in particular.”"}, {"kind": "speech", "image": "So then? Anyone who doesn't have a particular place to go?", "story": "How can a road go nowhere?", "problem": "Different question."}, {"kind": "speech", "image": "Well, my friend, it is people who come and go; but the road stays where it is.", "story": "I've lived here fifty years, and it hasn't moved. It's the people who come and go.", "problem": "Drops the fifty years and “it hasn’t moved.”"}, {"kind": "moral", "image": "The road is still where it is, the people who come and go. Know not where the road leads, but where you are going.", "story": "The road stays where it is. The important thing is knowing where you want to go.", "problem": "Moral wording and the “know not” clause differ."}], "preview": "../../en/wisdom-stories/illustrations/where-does-this-road-go.webp"}, {"stem": "who-handles-honey-licks-his-finger", "title": "Who Handles Honey Licks His Finger", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "«The beekeeper licks his finger to collect honey»", "story": "Who Handles Honey Licks His Finger", "problem": "The title makes the beekeeper the one who licks; in the story the grocer does."}, {"kind": "other", "image": "NATURAL HONEY", "story": "", "problem": ""}, {"kind": "caption", "image": "The beekeeper brought fresh, natural honey to the shopkeeper. The shopkeeper bought the honey to sell.", "story": "A beekeeper filled containers with the honey he had collected and brought them to a grocer to sell. They struck a bargain on the price and began to weigh the honey.", "problem": "'shopkeeper bought the honey to sell' replaces the bargain and weighing."}, {"kind": "caption", "image": "For every kilo he sold, he licked his finger and collected honey that way.", "story": "But before placing each piece on the scale, he never failed to lick his honey-smeared fingers.", "problem": "Says he collected honey by licking what he sold; the story is licking before the honey is weighed."}, {"kind": "other", "image": "1.000 kg", "story": "Because the grocer had only a one-kilo weight, he broke off pieces of honeycomb by hand and weighed the honey kilo by kilo.", "problem": ""}, {"kind": "speech", "image": "The beekeeper watched this, but said nothing, knowing he was also benefiting in his own way.", "story": "He frowned and showed his displeasure.", "problem": "The beekeeper is silent and benefiting; in the story he shows displeasure."}, {"kind": "speech", "image": "My friend, there is no harm in licking a little honey, benefiting from your work!", "story": "“You’ve licked away half my honey!”", "problem": "Opposite of the beekeeper's complaint."}, {"kind": "speech", "image": "My dear friend, whoever gets involved in something from every angle benefits from the work they do.", "story": "“Don’t take offense, brother. Whoever handles honey is bound to lick a finger.”", "problem": "Drops the honey-and-finger proverb and changes the wording."}, {"kind": "caption", "image": "Even if a person gets involved in something from every angle, he still benefits more or less from the work he does.", "story": "Moral: Even a small share in a job usually brings some gain from it.", "problem": "Different wording."}, {"kind": "moral", "image": "Moral: Even if a person gets involved in something from every angle, he still benefits more or less from the work he does.", "story": "Moral: Even a small share in a job usually brings some gain from it.", "problem": "Different wording."}], "preview": "../../en/wisdom-stories/illustrations/who-handles-honey-licks-his-finger.webp"}, {"stem": "why-am-i-poor", "title": "Why Am I Poor?", "category": "Work, livelihood, and wealth", "status": "Needs correction", "items": [{"kind": "title", "image": "Why am I poor?", "story": "Why Am I Poor?", "problem": ""}, {"kind": "caption", "image": "One day a man went to the Buddha and asked:", "story": "Once a poor man met Buddha and asked him:", "problem": "“went to” replaces “met,” and “poor” is dropped."}, {"kind": "speech", "image": "Buddha, why am I poor?", "story": "Buddha, why am I poor?", "problem": ""}, {"kind": "speech", "image": "Look around you, there is always something to give.", "story": "Because you share none of your wealth.", "problem": "The first answer is replaced."}, {"kind": "speech", "image": "Even what you think you don't have, you can still give.", "story": "But I have nothing to give.", "problem": "This is spoken as Buddha’s line, not the man’s objection."}, {"kind": "speech", "image": "You have five treasures that you can always give to others.", "story": "You have five kinds of wealth that you could share.", "problem": "“treasures” and “always give to others” differ."}, {"kind": "speech", "image": "Master, please teach me those five treasures.", "story": "What are they?", "problem": "Different question."}, {"kind": "speech", "image": "Gladly.", "story": "The Buddha explained:", "problem": "Not in the story."}, {"kind": "caption", "image": "1. With your smile, you can make others happy.", "story": "You can offer a smile.", "problem": "Adds making others happy."}, {"kind": "caption", "image": "2. With your kind words, you can comfort the hearts of others.", "story": "You can speak a kind word.", "problem": "Adds comforting hearts."}, {"kind": "caption", "image": "3. With your compassionate look, you can bring hope to others.", "story": "You can look at someone with compassion.", "problem": "Adds bringing hope."}, {"kind": "caption", "image": "4. With your helping hand, you can ease the burdens of others.", "story": "And you can lend a helping hand.", "problem": "Adds easing burdens, and the wish for happiness is missing."}, {"kind": "caption", "image": "5. You can always find good ways to help others.", "story": "You can wish someone happiness.", "problem": "The fifth gift is a wish for happiness, not finding ways to help."}, {"kind": "moral", "image": "There is always something to give: a smile, a kind word, a compassionate look, a helping hand. A person is as rich as they share.", "story": "There is always something to give: a smile, a kind word, a compassionate look, a helping hand. A person is as rich as they share.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/why-am-i-poor.webp"}, {"stem": "why-injustice-when-there-is-justice", "title": "Why Choose Injustice?", "category": "Justice and society", "status": "Needs correction", "items": [{"kind": "title", "image": "Why injustice when there is justice?", "story": "Why injustice when there is justice?", "problem": ""}, {"kind": "speech", "image": "When love is possible, why choose hatred? When peace is possible, why choose strife?", "story": "Why hatred when there is love? Why war when there is peace?", "problem": "\"strife\" replaces \"war\", and the questions are reworded."}, {"kind": "speech", "image": "When friendship is possible, why choose enmity? When justice is possible, why choose oppression?", "story": "Why enmity when there is friendship? Why injustice when there is justice?", "problem": "\"oppression\" is not in the story; brotherhood, tolerance, and freedom lines are missing."}, {"kind": "speech", "image": "Why choose injustice when there is justice possible?", "story": "Why injustice when there is justice?", "problem": "Extra words \"choose\" and \"possible\"."}, {"kind": "other", "image": "JUSTICE", "story": "", "problem": "Scale label is not a story sentence."}, {"kind": "other", "image": "INJUSTICE", "story": "", "problem": "Scale label is not a story sentence."}, {"kind": "moral", "image": "Moral: It is man’s own fault to choose hatred, strife and injustice when love, peace, brotherhood and justice are possible.", "story": "Moral: When love, peace, friendship, and justice are possible, we are responsible for choosing them.", "problem": "Different wording; \"friendship\" becomes \"brotherhood\", and \"man’s own fault\" replaces \"we are responsible\"."}], "preview": "../../en/wisdom-stories/illustrations/why-injustice-when-there-is-justice.webp"}, {"stem": "why-people-shout-when-they-argue", "title": "Why Do We Shout?", "category": "Friendship and human relations", "status": "Needs correction", "items": [{"kind": "title", "image": "Why do people shout when they argue?", "story": "Why Do We Shout?", "problem": "Title does not match."}, {"kind": "speech", "image": "Why do people shout when they argue?", "story": "“Why do people shout when they argue?”", "problem": ""}, {"kind": "speech", "image": "I think it’s because they want to prove they’re right.", "story": "“Because they lose their temper,” a student replied.", "problem": "Different student answer."}, {"kind": "speech", "image": "And do you think the person shouting is right? Does shouting make them more right? Or do they just want to be heard, not understood?", "story": "“But the other person is right beside them. Why raise their voices instead of speaking calmly?”", "problem": "Different follow-up."}, {"kind": "speech", "image": "When people want to prove they’re right to each other, they distance themselves from each other. In that distance, hearts begin to drift apart. No matter how high your voice is, the farther you shout, the farther the hearts drift apart.", "story": "“When people quarrel, their hearts seem to move apart. They shout as though trying to make themselves heard across that distance.”", "problem": "Extra and different wording."}, {"kind": "speech", "image": "It’s the opposite with people who love each other. They don’t shout, they whisper. Because love is about listening to each other. The closer they are, the less they need to speak — a look, a word is enough to understand each other.", "story": "“When people love each other, they speak softly. As they grow closer, they may need only a whisper. Sometimes a look is enough.", "problem": "Adds “love is about listening” and “a word is enough.”"}, {"kind": "speech", "image": "My dears, if you can manage to get farther from each other when you argue, try to get closer when you’re hurt. Remember, the longer the distance, the harder the return journey becomes.", "story": "So when you argue, do not use words that drive your hearts farther apart. “One day, the distance may become too great to find your way back.”", "problem": "Different advice."}, {"kind": "other", "image": "LISTEN APPLAUSE RESPECT", "story": "", "problem": "Poster text is not in the story."}, {"kind": "moral", "image": "Moral: Screaming is the sound of hearts drifting apart. A whisper is enough in love — don’t increase the distance between you.", "story": "Screaming is the sound of hearts drifting apart. A whisper is enough in love — don't increase the distance between you.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/why-people-shout-when-they-argue.webp"}, {"stem": "why-are-you-waiting-for-the-last-day-of-the-world", "title": "Why Wait for the End of the World?", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Why are you waiting for the end of the world?", "story": "Why Wait for the End of the World?", "problem": "Title wording differs."}, {"kind": "speech", "image": "Let me ask you, why are you waiting for the end of the world to do good deeds? Won't you do them today?", "story": "Imagine the world will end tomorrow. There is nothing you can do to prevent it. How would you spend today?", "problem": "Different question."}, {"kind": "speech", "image": "Help the needy; sharing is pleasing to Allah.", "story": "", "problem": "Student answers in the story are different."}, {"kind": "speech", "image": "Cheer up the sad; your words can heal.", "story": "", "problem": "Not a story answer."}, {"kind": "speech", "image": "Visit the sick; they need your care.", "story": "", "problem": "Not a story answer."}, {"kind": "speech", "image": "Call to what is good and forbid what is wrong.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Guide someone to goodness; it's an ongoing charity.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Forgive others; your forgiveness frees hearts.", "story": "I’d find the people I’ve hurt and ask their forgiveness.", "problem": "Different wording."}, {"kind": "speech", "image": "Plant a tree; you'll be rewarded.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Give in charity; it can change someone's life.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Greet others with peace; it spreads love.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Love your family; be kind, caring, and patient.", "story": "I would spend the day with my family.", "problem": "Different wording."}, {"kind": "speech", "image": "Help travelers; make their journey easier, earn reward.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Invite others to good; you'll get the same reward.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Dear students, will you promise to do good deeds today, without waiting for the end of the world?", "story": "Why wait for the end of the world to do these things?", "problem": "Wording differs."}, {"kind": "speech", "image": "To gain the pleasure of Allah, don't wait for the end of the world. Do good deeds, spread love, and value today, right now.", "story": "Why wait for the end of the world to do these things?", "problem": "Adds Allah's pleasure and different deeds."}, {"kind": "moral", "image": "Don't wait for the end of the world to do good deeds. Do loving, forgiving, and valuing today, right now.", "story": "Make time now to love, forgive, and appreciate life.", "problem": "Moral is reworded."}], "preview": "../../en/wisdom-stories/illustrations/why-are-you-waiting-for-the-last-day-of-the-world.webp"}, {"stem": "word-and-silence", "title": "Words and Silence", "category": "Word, silence, and communication", "status": "Needs correction", "items": [{"kind": "title", "image": "Words and silence", "story": "Words and Silence", "problem": ""}, {"kind": "other", "image": "Kindness", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Friendship", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Courage", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Respect", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Love", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Understanding", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Every word is a mirror of our heart.", "story": "Because words are not just sounds — they are a mirror of intention.", "problem": "“our heart” instead of “intention.”"}, {"kind": "caption", "image": "A person thinks a lot before speaking. Because a word is not just sound — it is a reflection of our heart.", "story": "Sometimes a person says more by keeping quiet. Because words are not just sounds — they are a mirror of intention.", "problem": "Different meaning."}, {"kind": "caption", "image": "If a word is spoken in anger, it may live forever — and may not be taken back. A spoken word cannot be erased — it can only be apologized for.", "story": "If a word will break a heart, if a sentence will extinguish hope — it is not worth saying.", "problem": "Different meaning."}, {"kind": "caption", "image": "We forget... but every word remains. Some words are like thorns — they hurt the heart.", "story": "Remember... not every word blooms. Some are like thorns — they hurt the one who touches them.", "problem": "“every word remains” and “the heart” differ from the story."}, {"kind": "other", "image": "From a kind word comes joy.", "story": "If the words you are going to say will not warm a heart, if they will not cause a smile — be silent.", "problem": "Not the story sentence."}, {"kind": "other", "image": "From a harsh word comes wound.", "story": "Words spoken without thought can wound.", "problem": "Wording differs."}, {"kind": "caption", "image": "If words are like seeds, wisdom is the gardener; thoughtlessness is the wind that breaks them, and harm is the wound they leave. So, silence is also a kind of speech.", "story": "Silence. Because silence also speaks — sometimes more deeply, sometimes more honestly.", "problem": "Different wording."}, {"kind": "thought", "image": "Silence", "story": "Silence is wisdom.", "problem": ""}, {"kind": "moral", "image": "Moral: Not every word blooms; some hurt like thorns. Silence is wiser than words that will not bring good.", "story": "Not every word blooms; some hurt like thorns. Silence is wiser than words that will not bring good.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/word-and-silence.webp"}, {"stem": "expressions-you-should-stay-away-from", "title": "Words to Avoid", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "Phrases to avoid", "story": "Words to Avoid", "problem": "'Phrases' replaces 'Words'."}, {"kind": "caption", "image": "Instead of these harmful phrases, use kind words that support a healthy and respectful family life:", "story": "Avoid these phrases, especially in the family, and never use them against your spouse:", "problem": "Drops the spouse and changes the instruction."}, {"kind": "speech", "image": "Don't talk nonsense!", "story": "“Don’t talk nonsense!”", "problem": ""}, {"kind": "caption", "image": "This phrase makes the other person feel worthless and shuts down their thoughts and feelings. Instead, try: “I'd like to understand your thoughts. Please share. We're here to listen.”", "story": "This dismisses your spouse’s thoughts and feelings. Instead, try saying gently, “I see it differently” or “I don’t entirely agree.”", "problem": "Different explanation and a different suggested reply."}, {"kind": "speech", "image": "Just listen!", "story": "“Don’t exaggerate!”", "problem": "This phrase is not in the story. The story's second phrase is “Don’t exaggerate!”"}, {"kind": "caption", "image": "This phrase ignores the other person's right to express themselves and makes them feel unseen. Instead, try: “I'm listening. Please share your thoughts. I'm here to understand.”", "story": "This can make your spouse feel that their concerns are being dismissed. Instead, ask, “Can you tell me more about what’s worrying you and how you feel?”", "problem": "Explains the wrong phrase and gives a different reply."}, {"kind": "speech", "image": "Why can't you be like your brother/sister?", "story": "“Why can’t you be more like their husband or wife?”", "problem": "Compares a brother or sister instead of a husband or wife."}, {"kind": "caption", "image": "Comparing one child to another lowers self-esteem and creates jealousy and resentment. Instead, try: “You are unique and special in your own way. I appreciate you just the way you are.”", "story": "Comparing your spouse with someone else brings an outsider into your relationship and can leave your partner feeling hurt, unloved, and unable to trust you.", "problem": "Makes it about children, not a spouse."}, {"kind": "speech", "image": "You never do anything right!", "story": "“You don’t understand!”", "problem": "Different phrase."}, {"kind": "caption", "image": "This phrase is discouraging and makes the other person feel hopeless and unworthy. Instead, try: “I see you're struggling with this. Let's work on it together. I believe in you.”", "story": "This can sound insulting and dismissive. If you do not want to discuss a subject, say so respectfully: “Please don’t be hurt, but I’d rather not talk about this now. Could we talk about something else?”", "problem": "Different phrase, explanation, and reply."}, {"kind": "speech", "image": "Do this, do that, go there!", "story": "“Don’t go there, don’t talk to her, don’t do this, don’t wear that, don’t talk like that, bring this, take that!”", "problem": "Shortened and reworded orders."}, {"kind": "caption", "image": "Life is not just about giving orders. Instead, try: “What do you think we should do? Let's decide together.” Sharing decisions builds trust and responsibility.", "story": "Your spouse is your partner, not your subordinate. Discuss your concerns respectfully. Make requests rather than issuing orders, and remember to say “please.”", "problem": "Different advice; 'please' is missing."}, {"kind": "moral", "image": "Words can hurt those we love most. In the family use respect and requests, not orders.", "story": "Moral: Words can hurt the person we love the most. In the family, we should use the language of respect and requests, not orders and insults.", "problem": "'those' replaces 'the person'; drops 'the language of' and 'and insults'."}], "preview": "../../en/wisdom-stories/illustrations/expressions-you-should-stay-away-from.webp"}, {"stem": "your-hand-at-work-your-hope-in-god", "title": "Work with Your Hands and Trust in Allah", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Work with your hands, hope in God", "story": "Work with Your Hands and Trust in Allah", "problem": "“hope in God” instead of “Trust in Allah.”"}, {"kind": "caption", "image": "In former times, there lived a devout but lazy man. He would always say, “I place my hope in God,” yet never worked with his hands. He spent his days in worship, doing nothing to earn for his family.", "story": "A dervish spent much of his time in prayer and solitude. He did not want to depend on others, so he also worked each day, buying bread with his earnings and sharing what remained with the poor.", "problem": "Calls him lazy and says he never worked; the story says he worked each day and shared with the poor."}, {"kind": "caption", "image": "One day, he saw a fox near his home stealing a piece of flatbread. Thinking from it, he began to reflect.", "story": "One day in the desert, he saw a fox whose injured legs could barely carry it.", "problem": "A fox stealing flatbread near home is not the injured fox in the desert."}, {"kind": "thought", "image": "This fox, though it has no religion, goes out into the desert, works hard, and finds its food. But I have faith, yet sit idle. Am I not worse than this creature?", "story": "How does it survive? It cannot hunt. How does Allah provide for it?", "problem": "Opposite thought: the story wonders how an injured fox is provided for without hunting."}, {"kind": "caption", "image": "He then saw a lion in the wild. Despite its strength and might, it goes out to hunt for its food. If such a powerful creature strives for its sustenance, should not I, with my faith and reason, make an effort?", "story": "Just then, a lion appeared with a gazelle in its jaws. It ate its fill and walked away. The fox crawled over and fed on what remained.", "problem": "Omits the gazelle and the fox eating the remains; the lesson is reversed."}, {"kind": "thought", "image": "I have no excuse. If even an animal works for its sustenance, how can I, who have faith and reason, sit idle? From today on, I will work with my hands and bring food to my family.", "story": "If the fox receives food without working, why shouldn’t I? I could spend all my time in worship. Surely Allah will provide.", "problem": "He resolves to work; in the story he stops working and expects provision."}, {"kind": "caption", "image": "From that day on, he worked with his hands and earned his livelihood. He no longer covered his laziness with faith. He provided for his family, and his home was filled with blessings.", "story": "He stopped working and prayed day and night. But no one brought food, and he grew weak and thin.", "problem": "Skips the failure of not working and shows only the later return to work."}, {"kind": "thought", "image": "A healthy body, strength, and opportunity are great blessings. If I do not use them, it is ingratitude. Why should I not work while I can? Rather, I must be thankful and use these blessings in the right way.", "story": "I gave you health and strength. Why choose the fox as your example instead of the lion? Rise and work. Earn your living, and let those who cannot help themselves find support in you. Feed yourself and others.", "problem": "Paraphrase spoken as his own thought; the story is a voice from the unseen."}, {"kind": "caption", "image": "He worked diligently, earned honest food, and fed his family. His earnings were blessed.", "story": "Once more, he earned his bread and shared it, abandoning the wish to live at others’ expense.", "problem": "Omits sharing with others and abandoning living at their expense."}, {"kind": "moral", "image": "Moral: A person who looks at the share of the needy despite having the strength is not trusting in Allah — he is simply covering up his laziness with faith.", "story": "A person who looks at the share of the needy despite having the strength is not trusting in Allah - he is simply covering up his laziness with faith.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/your-hand-at-work-your-hope-in-god.webp"}, {"stem": "you-cannot-descend-a-well-on-his-rope", "title": "Would You Trust His Rope?", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "You can't go down a well with his rope", "story": "Would You Trust His Rope?", "problem": "Title wording differs. The story line is 'You can’t go down a well on one of his ropes.'"}, {"kind": "caption", "image": "Long ago, there was a man named Master Ali who made ropes from old, rotten fibers. He looked strong from the outside, but was rotten inside.", "story": "A ropemaker named Ali worked carelessly, producing weak ropes that often snapped and caused accidents. People began calling him “Ali of the rotten ropes.”", "problem": "'Master Ali', rotten fibers, and strong outside replace careless work and the nickname."}, {"kind": "speech", "image": "I am Master Ali, the rope maker.", "story": "A ropemaker named Ali", "problem": "Adds 'Master' and is spoken as dialogue."}, {"kind": "caption", "image": "Master Ali's ropes looked thick and strong, which fooled many people.", "story": "producing weak ropes that often snapped and caused accidents.", "problem": "Says the ropes looked thick and strong and fooled people; the story says they were weak and snapped."}, {"kind": "caption", "image": "One day, someone went deep down a well with his rope.", "story": "One day, a sheep fell into a well. A neighbor offered to climb down, but hesitated when he saw the rope the owner handed him.", "problem": "Someone goes down; in the story a sheep has fallen in and the neighbor hesitates."}, {"kind": "speech", "image": "When I realized the rope wasn't trustworthy, I said, “You can't go down a well with his rope.”", "story": "“I know this rope. Ali made it. You can’t go down a well on one of his ropes.”", "problem": "'with his rope' replaces 'on one of his ropes', and the 'I know this rope' line is missing."}, {"kind": "speech", "image": "Don't use it,” they advised. “Master Ali's rope may look strong, but it breaks at the wrong time and leaves you in trouble.", "story": "“Oh, you can go down,” the owner replied with a smile. “Getting back up is what I can’t promise.”", "problem": "Drops the owner's reply that going down is possible and coming up is not."}, {"kind": "caption", "image": "A person gains or loses trust by the quality of his work. Once trust is shaken, it is hard to restore.", "story": "Moral: A person gains or loses trust in his name by the quality of his work. Once trust is shaken, it is very difficult to restore it.", "problem": "Drops 'in his name' and 'very'."}], "preview": "../../en/wisdom-stories/illustrations/you-cannot-descend-a-well-on-his-rope.webp"}, {"stem": "yellow-and-red-flowers", "title": "Yellow and Red Flowers", "category": "Love and marriage", "status": "Needs correction", "items": [{"kind": "title", "image": "Yellow and Red Flowers", "story": "Yellow and Red Flowers", "problem": ""}, {"kind": "caption", "image": "1. A yellow flower sign is placed in front of a home.", "story": "yellow flowers placed in a house window meant, \"Someone in this home is ill; please do not make noise as you pass.\"", "problem": "Says in front of a home, not in a window, and drops the illness meaning."}, {"kind": "other", "image": "This home prefers peace, please keep noise low. Thank you.", "story": "Someone in this home is ill; please do not make noise as you pass.", "problem": "Different message; illness is missing."}, {"kind": "caption", "image": "2. When a red flower sign is seen at another home...", "story": "Red flowers conveyed a different message: \"A young woman who has come of age lives here; please mind your words.\"", "problem": "Red flowers are given the quiet message, not the coming-of-age message."}, {"kind": "other", "image": "This home needs quiet, please be considerate and keep noise to a minimum.", "story": "A young woman who has come of age lives here; please mind your words.", "problem": "Wrong meaning for red flowers."}, {"kind": "caption", "image": "3. Subtle signs build a culture where people act with consideration.", "story": "A small, thoughtful signal can express care and invite respect.", "problem": "Different wording."}, {"kind": "caption", "image": "A warning does not always have to be loud.", "story": "Consideration does not need a raised voice.", "problem": "Different wording."}, {"kind": "caption", "image": "Subtle signs make consideration possible.", "story": "A small, thoughtful signal can express care and invite respect.", "problem": "Different wording."}, {"kind": "moral", "image": "Moral: A culture of considerate communication, expressed through subtle signs, teaches people to show respect without unnecessary words. A warning does not always have to be loud.", "story": "A small, thoughtful signal can express care and invite respect. Consideration does not need a raised voice.", "problem": "Different moral."}], "preview": "../../en/wisdom-stories/illustrations/yellow-and-red-flowers.webp"}, {"stem": "your-friends", "title": "Your True Friends", "category": "Friendship and human relations", "status": "Needs correction", "items": [{"kind": "title", "image": "Your friends", "story": "Your True Friends", "problem": "Missing “True.”"}, {"kind": "caption", "image": "One day, a son asked his father to invite his friends to the wedding preparations. The son listed many names: “This one helped me with homework, that one with a project. We play games together. Lots of good friends!”", "story": "A young man preparing for his wedding asked his father for help. “I can’t manage everything. Would you call the friends on this list and invite them?”", "problem": "Different request and added list comments."}, {"kind": "caption", "image": "On the wedding day, only a few friends showed up when his father asked: “Of all those you called your friends, who came today?” — Only the ones who truly valued your friendship.", "story": "On the wedding day, the young man approached him anxiously. “Did you call everyone?”", "problem": "Different question and answer."}, {"kind": "speech", "image": "My son, I invited 50 of your friends, but only 15 came — making all sorts of excuses. That hurt me more than you know.", "story": "“There were fifty names. Only fifteen are here.” “I called all fifty. I told them you were in trouble and needed their help at this place and time.", "problem": "Adds excuses and the father’s hurt; story says he told them the son was in trouble."}, {"kind": "speech", "image": "My son, only 50 of them mean nothing. In times of trouble, the help of a real friend is priceless. That’s why I say, cherish those few true friends you have!", "story": "Don’t worry, son. Your true friends are here.", "problem": "“only 50 of them mean nothing” contradicts the story, and the rest is reworded."}, {"kind": "moral", "image": "A true friend stands by you in trouble. Few tested friends matter more than many acquaintances.", "story": "A true friend is one who is there for you when you are in trouble. It is not the many acquaintances that are valuable, but the few friends who stand the test.", "problem": "Shortened and reworded."}], "preview": "../../en/wisdom-stories/illustrations/your-friends.webp"}]</script>
<script>
const rows = JSON.parse(document.getElementById("data").textContent);
const counts = {all: rows.length, "Needs correction": 0, "Requires manual review": 0, Matches: 0};
rows.forEach(r => { counts[r.status] = (counts[r.status] || 0) + 1; });
const summary = document.getElementById("summary");
summary.innerHTML = Object.entries(counts).map(([k, n]) =>
  `<button type="button" data-status="${k}" aria-pressed="${k === "all"}">${k === "all" ? "All illustrations" : k}: ${n}</button>`
).join("");
let status = "all";
const q = document.getElementById("q");
function esc(s) {
  return String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function badge(st) {
  const cls = st === "Matches" ? "match" : st === "Needs correction" ? "fix" : "review";
  return `<span class="badge ${cls}">${esc(st)}</span>`;
}
function render() {
  const query = q.value.trim().toLowerCase();
  const shown = rows.filter(r => (status === "all" || r.status === status) &&
    (!query || (r.title + " " + r.stem + " " + r.category).toLowerCase().includes(query)));
  document.querySelectorAll("[data-status]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.status === status)));
  const list = document.getElementById("list");
  if (!shown.length) { list.innerHTML = '<p class="empty">No illustrations in this view.</p>'; return; }
  list.innerHTML = shown.map(r => {
    const items = (r.items || []).map(it => {
      const bad = String(it.problem || "").trim();
      return `<tr class="${bad ? "bad" : ""}">
        <td class="kind">${esc(it.kind)}</td>
        <td>${esc(it.image)}</td>
        <td>${esc(it.story)}</td>
        <td class="problem">${bad ? esc(it.problem) + (it.story ? "<br><strong>Use: </strong>" + esc(it.story) : "") : ""}</td>
      </tr>`;
    }).join("");
    return `<article>
      <div class="head">
        <div><h2>${esc(r.title || "(no story title)")}</h2><div class="stem">${esc(r.stem)}${r.category ? " · " + esc(r.category) : ""}</div></div>
        ${badge(r.status)}
      </div>
      <div class="layout">
        <img class="preview" src="${esc(r.preview)}" alt="" />
        <table>
          <thead><tr><th>Where</th><th>On the image</th><th>Story text</th><th>Discrepancy and correction</th></tr></thead>
          <tbody>${items || "<tr><td colspan='4'>No readable text was recorded.</td></tr>"}</tbody>
        </table>
      </div>
    </article>`;
  }).join("");
}
document.body.addEventListener("click", (e) => {
  const b = e.target.closest("[data-status]");
  if (!b) return;
  status = b.dataset.status;
  render();
});
q.addEventListener("input", render);
render();
</script>
