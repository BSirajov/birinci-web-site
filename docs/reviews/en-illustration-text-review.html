y expression there is a history, a sacrifice” and “carry the memory” differ from the story’s wording."}], "preview": "../../en/wisdom-stories/illustrations/drinking-the-sherbet-of-martyrdom.webp"}, {"stem": "silent-corridor", "title": "The Silent Corridor", "category": "Word, silence, and communication", "status": "Needs correction", "items": [{"kind": "title", "image": "Silent corridor", "story": "The Silent Corridor", "problem": "Missing “The”."}, {"kind": "caption", "image": "A project team works hard, prepares documents, does research, and creates materials to submit to the sponsor organization.", "story": "The project team worked tirelessly for months, carefully polishing the documents, and one day, when everything was ready, they sent the materials to the sponsor and began to wait for a response.", "problem": "Different wording and details."}, {"kind": "other", "image": "PLAN RESEARCH CREATE SUBMIT", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Days pass, weeks pass — no response. The team waits in silence, uncertain.", "story": "Days passed, weeks passed. The result — silence.", "problem": "Adds that the team waits uncertain."}, {"kind": "thought", "image": "Did they receive it?", "story": "“Have the documents arrived? Have they been reviewed?”", "problem": "Different question."}, {"kind": "thought", "image": "Will they respond?", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "The team reaches out to the sponsor for an update, but the response is unclear.", "story": "Each inquiry brought only another vague response.", "problem": "Different wording."}, {"kind": "speech", "image": "Hello team, We have received your submission. We are currently reviewing it and will get back to you in due time. Best regards, Sponsor Team", "story": "“Yes, we received the documents, but we couldn’t accept them. The submission format was wrong, and the required procedure hadn’t been followed.”", "problem": "Email says the submission is under review, not that it was rejected for the wrong format."}, {"kind": "caption", "image": "The team discusses the response from the sponsor. The uncertainty grows.", "story": "The uncertainty within the team grew, spreading like a shadow along the corridor:", "problem": "Wording differs."}, {"kind": "speech", "image": "Maybe they received it. Maybe they liked it. Or maybe something is missing...", "story": "“Have the documents arrived? Have they been reviewed?”", "problem": "Different speculation."}, {"kind": "other", "image": "SPONSOR ORGANIZATION", "story": "", "problem": "Label only; not story wording."}, {"kind": "caption", "image": "The team asks:", "story": "“Why didn’t you tell us that?” they asked.", "problem": "Introduces different questions."}, {"kind": "speech", "image": "What else can we do? What is expected from us? Should we make changes?", "story": "“We could have corrected it right away.”", "problem": "Different questions."}, {"kind": "caption", "image": "The team receives general feedback instead of clear guidance. The message is broad and does not explain what needs to be improved.", "story": "“Yes, we received the documents, but we couldn’t accept them. The submission format was wrong, and the required procedure hadn’t been followed.”", "problem": "Says the feedback was vague, not that the format and procedure were wrong."}, {"kind": "other", "image": "Risk — Unclear", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Sustainability", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Moral: When communication is unclear, even the best work can go unnoticed. When there is no consistent follow-up, even the strongest partnership can falter.", "story": "When communication is unclear, even the best work can go unnoticed. When there is no consistent follow-up, even the strongest partnership can falter.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/silent-corridor.webp"}, {"stem": "skins-of-the-lambs", "title": "The Skins of the Lambs", "category": "Justice and society", "status": "Needs correction", "items": [{"kind": "title", "image": "Lamb Skin", "story": "The Skins of the Lambs", "problem": "Title is singular and drops \"The\" and \"of the\"."}, {"kind": "caption", "image": "Once, Asad Pasha’s tax collectors returned empty-handed.", "story": "One day, faced with an empty treasury, Asad Pasha asked his advisers what to do.", "problem": "Different opening: tax collectors return empty-handed rather than an empty treasury and advisers."}, {"kind": "speech", "image": "Why did you come back empty? Where is the tax you collected?", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "We couldn’t find anyone who could pay.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Did you take it from the weak people? There is hardly anything left for them to survive.", "story": "These people are already struggling to make ends meet. How will they pay this tax?", "problem": "Different wording."}, {"kind": "speech", "image": "If we had taken from the weak, we would have gained little, my Pasha.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Then bring me the wealthy—take more from them.", "story": "I can raise it another way", "problem": "Different wording."}, {"kind": "speech", "image": "Do not skit the lambs while the rams have thick wool on them. Leave the small ones alone.", "story": "It is better to shear the wool of rams than to skin lambs.", "problem": "\"skit\" is a spelling error, and the sentence is not the story saying."}, {"kind": "speech", "image": "Indeed, my Pasha! It is wise to take from those who can bear it.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "That is the shepherd’s way, not the butcher’s.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Go to the wealthy merchants, landowners, and moneylenders. Take the fair share from those who have much.", "story": "", "problem": "The story collects from the mufti, judge, treasurer, security chief, merchants, and the wealthy, not by this order."}, {"kind": "speech", "image": "As you command, my Pasha. We will take from those who can afford it.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "The tax collectors went and collected from the wealthy officials, merchants, and landowners. They brought 200 bags of gold to Asad Pasha.", "story": "By the end, he had collected two hundred bags of gold.", "problem": "The story has the pasha collect the gold himself through private accusations, not tax collectors."}, {"kind": "speech", "image": "Did you collect 200 or 50 thousand dirhams from the wealthy?", "story": "Fifty or sixty bags of gold.", "problem": "\"dirhams\" and \"50 thousand\" are not in the story."}, {"kind": "speech", "image": "We collected 200 thousand, my Pasha.", "story": "Yet I have raised two hundred bags, not fifty.", "problem": "\"200 thousand\" instead of two hundred bags of gold."}, {"kind": "speech", "image": "Do not skit the lambs while the rams have thick wool on them.", "story": "It is better to shear the wool of rams than to skin lambs.", "problem": "\"skit\" is a spelling error, and the saying is reworded."}, {"kind": "moral", "image": "Moral: It is more just to take the unjust profit of the wealthy than to rob the poor. The burden should be placed on the strong, not the poor.", "story": "Moral: It is more just to take the unjust profit of the wealthy than to rob the poor. The burden should be placed on the strong, not the poor.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/skins-of-the-lambs.webp"}, {"stem": "sound-of-the-doorbell", "title": "The Sound of the Doorbell", "category": "Friendship and human relations", "status": "Needs correction", "items": [{"kind": "title", "image": "The sound of the doorbell...", "story": "The Sound of the Doorbell", "problem": "Extra ellipsis."}, {"kind": "speech", "image": "Today was the first day of my route. I was excited to deliver newspapers to all the subscribers.", "story": "I was laid off last winter. To make ends meet, I had to work as a newspaper carrier temporarily.", "problem": "Different speaker situation and wording."}, {"kind": "other", "image": "DAILY NEWS", "story": "", "problem": "Newspaper masthead is not in the story."}, {"kind": "speech", "image": "No papers today. Why is the mailbox sealed?", "story": "“Why have you sealed your mailbox?” I asked.", "problem": "Adds “No papers today” and changes the question."}, {"kind": "speech", "image": "I sealed it myself.", "story": "“I did it deliberately.”", "problem": "Different wording."}, {"kind": "speech", "image": "No one visits me anyway, no package comes, and no one calls. I thought it better this way.", "story": "“Please knock or ring each day and give me the paper in person.”", "problem": "Different reason and request."}, {"kind": "speech", "image": "Besides, for me, there’s no one left to open it for.", "story": "“My wife has died, my son lives abroad, and I’m alone.", "problem": "Omits wife and son; different wording."}, {"kind": "speech", "image": "There’s no problem, my boy. Just go on your way.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "I lost my wife long ago, my son moved away for work. Who am I living for now?", "story": "“My wife has died, my son lives abroad, and I’m alone. Who knows how much time I have left?”", "problem": "Son “moved away for work” and “Who am I living for now?” differ from the story."}, {"kind": "speech", "image": "Don’t you ever feel lonely? Don’t you miss anyone?", "story": "“Do you read the paper?” I asked.", "problem": "Different question."}, {"kind": "speech", "image": "Sometimes I do feel lonely... But I’ve gotten used to it now.", "story": "“Never. What I subscribed to was the sound of the doorbell.”", "problem": "Replaces the doorbell answer."}, {"kind": "speech", "image": "There was a boy, very bright and kind! But he grew up, got a job in another city. He calls sometimes, but he’s so busy. I understand—he has his own life now.", "story": "“Please do one more thing for me. Here is my son’s number. If I ever fail to answer when you knock, call him.”", "problem": "Different speech; story asks the carrier to call the son."}, {"kind": "other", "image": "Telephone Directory", "story": "", "problem": "Label is not in the story."}, {"kind": "moral", "image": "Moral: For some people, one ring of the doorbell, one greeting, is worth the whole world. Let’s not forget to knock on the door of the lonely.", "story": "For some people, one ring of the doorbell, one greeting, is worth the whole world. Let's not forget to knock on the door of the lonely.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/sound-of-the-doorbell.webp"}, {"stem": "with-this-nation-the-world-can-be-conquered", "title": "The Strength of a Generous People", "category": "Justice and society", "status": "Needs correction", "items": [{"kind": "title", "image": "The world can be conquered with this nation", "story": "The Strength of a Generous People", "problem": "Title does not match the story title or \"With people of such character, one could conquer the world.\""}, {"kind": "caption", "image": "One day, a king disguised himself and walked through the marketplace to test the honesty of his people.", "story": "A king went into the city in disguise to see how his people lived.", "problem": "Says he went to test honesty, not to see how his people lived."}, {"kind": "speech", "image": "My friend, give me a little butter, a little honey, and a little cheese for one silver coin.", "story": "Half a batman of butter, half a batman of honey, and some cheese, please.", "problem": "\"a little\" and \"one silver coin\" replace the batman measures."}, {"kind": "speech", "image": "Sir, the honey is liquid and may leak, so I will give you a little extra. And this cheese is a bit salty, so I will give you a little more to make up for it.", "story": "I can sell you the honey and cheese too, but this is my first sale today. My neighbor has not yet had one. Would you buy the rest from him?", "problem": "The shopkeeper gives extra goods; the story has him send the king to a neighbor who has not yet made a sale."}, {"kind": "speech", "image": "Thank you, son. Not every shopkeeper is honest these days. Take this extra honey as a gift. May God bless you and keep you honest always.", "story": "Thank Allah, I’ve made my first sale. Would you buy your cheese next door?", "problem": "Different speech and a different shopkeeper’s action."}, {"kind": "speech", "image": "In a nation like this, even if I march with an army, victory will surely be mine.", "story": "With people of such character, one could conquer the world", "problem": "Different wording; adds an army."}, {"kind": "moral", "image": "Real power lies not in weapons, but in honesty. Conquering hearts is the real victory.", "story": "Moral: A people’s strength rests in honesty and generosity. Winning hearts is a greater victory than winning territory.", "problem": "Drops generosity and \"winning territory\"; \"weapons\" is not in the moral."}], "preview": "../../en/wisdom-stories/illustrations/with-this-nation-the-world-can-be-conquered.webp"}, {"stem": "power-of-truth", "title": "The Strength of Truth", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "The power of truth", "story": "The Strength of Truth", "problem": "Title says power instead of Strength."}, {"kind": "other", "image": "TRUTH", "story": "", "problem": "Label on the sword is not in the story."}, {"kind": "caption", "image": "Truth stands firm like an unbending sword.", "story": "Truth’s sword does not bend, and the hand that holds it does not yield.", "problem": "Paraphrase."}, {"kind": "other", "image": "POWER", "story": "", "problem": "Repeated label is not in the story."}, {"kind": "other", "image": "TRUTH", "story": "", "problem": "Shield label is not in the story."}, {"kind": "caption", "image": "Time and power change.", "story": "Even though time passes and power changes", "problem": "Fragment, not the story sentence."}, {"kind": "caption", "image": "The righteous one remains.", "story": "in the end, the righteous one stands firm.", "problem": "Says remains instead of stands firm."}, {"kind": "moral", "image": "Truth is unbending and unyielding. Even as time and power change, the righteous one stands firm.", "story": "Truth is unbending and unyielding. Even though time passes and power changes, in the end, the righteous one stands firm.", "problem": "Second sentence drops time passes and in the end, and uses Even as."}], "preview": "../../en/wisdom-stories/illustrations/power-of-truth.webp"}, {"stem": "strongest-shield", "title": "The Strongest Shield", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "The strongest shield", "story": "The Strongest Shield", "problem": ""}, {"kind": "caption", "image": "The strongest shield in life is distance.", "story": "The strongest shield in life is distance.", "problem": ""}, {"kind": "caption", "image": "When you protect your own path, you maintain a healthy distance.", "story": "Healthy distance can protect your peace.", "problem": "Different sentence."}, {"kind": "other", "image": "Peace", "story": "Healthy distance can protect your peace.", "problem": ""}, {"kind": "other", "image": "Respect", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Self-care", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Inner harmony", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Moral: Sometimes the strongest way to protect yourself is to keep a healthy distance. Too much closeness to everything and everyone burns you.", "story": "Moral: Healthy distance can protect your peace. You need not remain close to everything or everyone that hurts you.", "problem": "'burns you' replaces 'hurts you', and the first sentence is not the story's."}, {"kind": "other", "image": "Take care of yourself first.", "story": "", "problem": "Not in the story."}], "preview": "../../en/wisdom-stories/illustrations/strongest-shield.webp"}, {"stem": "three-best-things", "title": "The Three Best Things", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "The three best things", "story": "The Three Best Things", "problem": ""}, {"kind": "speech", "image": "My son, in life, there are three things you should seek: the best food, the best bed, and the best home.", "story": "“In life, aim for the finest food, the finest bed, and the finest home.”", "problem": "'best' and 'seek' replace 'finest' and 'aim for'."}, {"kind": "speech", "image": "Father, how can we find them?", "story": "“But we’re poor. How can we have those?”", "problem": "Drops being poor and changes 'have those' to 'find them'."}, {"kind": "speech", "image": "The best food is found in hunger. When you are truly hungry, even simple food tastes wonderful.", "story": "When you’re hungry, simple food tastes wonderful.", "problem": "Extra 'truly' and 'even'. The hunger sentence matches the moral, not this story line."}, {"kind": "speech", "image": "The best sleep comes after hard work, and the best home is found in hearts.", "story": "After honest work, any bed gives sweet rest. And when you make room for others in your heart, you have the finest home of all.", "problem": "Drops honest work, sweet rest, and making room for others."}, {"kind": "moral", "image": "Moral: The best food is found in hunger, the best sleep after hard work, and the best home is found in hearts.", "story": "Moral: The best food is found in hunger, the best sleep after hard work, and the best home is found in hearts. Happiness is not in opportunity, but in perspective.", "problem": "Drops the second sentence."}], "preview": "../../en/wisdom-stories/illustrations/three-best-things.webp"}, {"stem": "three-statues", "title": "The Three Statues", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "Three statues", "story": "The Three Statues", "problem": "Missing \"The.\""}, {"kind": "caption", "image": "Two princes ordered a craftsman to make three statues as symbols of their close friendship.", "story": "Two neighboring rulers were close friends. For one ruler's birthday, the other commissioned three identical gold statues, each an inch high.", "problem": "Two princes order statues together; the story is one ruler's birthday gift."}, {"kind": "caption", "image": "On the day of their birth, he made three beautiful statues and gave each one a secret. He decided to test their wisdom and gave each of them a task. He said, \"Keep what I tell you in your heart and give me news later.\"", "story": "The letter accompanying the gift said: \"I congratulate you on your birthday with these three golden statues. At first glance, the statues may seem exactly the same. But one of them is more valuable than the other two.\"", "problem": "A shared birthday and a whispered task replace the gift letter."}, {"kind": "caption", "image": "The craftsman called them separately and whispered a secret into each one's ear. He gave each a different message.", "story": "A hidden difference between them was known only to him and the sculptor.", "problem": "He tells the princes secrets; in the story the difference is inside the statues."}, {"kind": "caption", "image": "After some time, he asked the first prince what the craftsman had told him. \"I cannot reveal the secret he told me.\"", "story": "those who let what they hear go in one ear and out the other", "problem": "The test is whether princes repeat a secret, not the wire through the statues."}, {"kind": "caption", "image": "The craftsman received the first statue back without asking what was said.", "story": "He passed it into the first statue's ear; it emerged from the other ear.", "problem": "A returned statue replaces the wire test."}, {"kind": "caption", "image": "The craftsman received the second statue back as well. He was pleased with the second prince too.", "story": "In the second, it came out through the mouth.", "problem": "The second prince is also praised; in the story only the third statue keeps the wire."}, {"kind": "caption", "image": "Then he wrote a letter to the third prince.", "story": "The ruler writes a reply to his neighbor who sent the statues and sends it", "problem": "The craftsman writes to a third prince."}, {"kind": "caption", "image": "You are the most wise of the three. You kept my secret and did not reveal it to anyone. I am pleased with you and send you this as a token of my appreciation.", "story": "The third is the most valuable: a person who keeps a confidence and knows when it is right to speak. Thank you for this thoughtful gift.", "problem": "Praise of a prince, not a description of the third statue."}, {"kind": "caption", "image": "The third prince read the letter. A wise person guards what he hears in his heart and speaks only when it is needed. He is the most trusted person anyone can have.", "story": "The third is the most valuable: a person who keeps a confidence and knows when it is right to speak.", "problem": "Adds \"most trusted person.\""}, {"kind": "moral", "image": "Moral: The most valuable person is the one who can keep what he hears as a secret in his heart and only speaks when it is needed.", "story": "Moral: The most valuable person is the one who can keep what he hears as a secret in his heart and only speaks when it is appropriate. Keeping your word is also a form of wisdom.", "problem": "\"needed\" instead of \"appropriate,\" and the second sentence is missing."}], "preview": "../../en/wisdom-stories/illustrations/three-statues.webp"}, {"stem": "two-donkeys", "title": "The Two Donkeys", "category": "Parables and fables", "status": "Needs correction", "items": [{"kind": "title", "image": "Two donkeys", "story": "The Two Donkeys", "problem": "Missing \"The\"."}, {"kind": "caption", "image": "Two donkeys were walking down the road. A monkey up in the tree was thinking of a way to humiliate them, so he said, “Do you have a friend, donkeys, or do you only talk to each other? If you have a friend, why don’t you introduce him to each other?”", "story": "Two donkeys saw a monkey in a tree and decided to tease him.", "problem": "The monkey tries to humiliate the donkeys; in the story the donkeys tease the monkey."}, {"kind": "speech", "image": "Hey, do you have a friend?", "story": "Monkey, do you have a friend?", "problem": "Drops \"Monkey\"."}, {"kind": "speech", "image": "Oh, surely! We’re very close friends; let me introduce you.", "story": "All I can see are donkeys. Who would you suggest?", "problem": "The monkey’s reply is different."}, {"kind": "moral", "image": "Moral: A trap set to humiliate someone often explodes on the head of the one who sets the trap. The one who wants to tease himself becomes ridiculous.", "story": "Moral: An attempt to make someone else look foolish can expose your own foolishness instead.", "problem": "Different wording; \"tease himself\" is not the story moral."}], "preview": "../../en/wisdom-stories/illustrations/two-donkeys.webp"}, {"stem": "value-of-your-family", "title": "The Value of Your Family", "category": "Family and upbringing", "status": "Needs correction", "items": [{"kind": "title", "image": "The Value of Your Family", "story": "The Value of Your Family", "problem": ""}, {"kind": "speech", "image": "Dad, can I ask you a question?", "story": "One evening, a little boy asked his father, “How much do you earn in an hour?”", "problem": "Opening question is not in the story."}, {"kind": "speech", "image": "Sure, son.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Dad, how much do you make per hour?", "story": "How much do you earn in an hour?", "problem": "“Make per hour” instead of “earn in an hour.”"}, {"kind": "speech", "image": "Well, son, that's not something you need to know.", "story": "The father wanted to know why.", "problem": "Father refuses to say, instead of asking why."}, {"kind": "speech", "image": "Please tell me. I really want to know.", "story": "I’m just curious", "problem": "Different wording."}, {"kind": "speech", "image": "If you must know, I earn one hundred dollars per hour.", "story": "A hundred dollars.", "problem": "Adds “If you must know” and “per hour.”"}, {"kind": "speech", "image": "Dad, may I borrow fifty dollars?", "story": "Could you lend me fifty?", "problem": "“Borrow fifty dollars” instead of “lend me fifty.”"}, {"kind": "speech", "image": "If all you want is money, why ask? Go to your room and think about why you're so interested in money.", "story": "His father grew angry, assuming he wanted a pointless toy. He refused and sent the boy to bed.", "problem": "Accuses the boy of wanting money and sends him to think, not to bed over a toy."}, {"kind": "thought", "image": "He must think I only care about money. It really hurts me.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Son, come here a moment.", "story": "Feeling guilty, he knocked on his son’s door. “Are you awake?”", "problem": "Different wording."}, {"kind": "speech", "image": "Yes, Dad?", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "I was wrong earlier. Here's fifty dollars. I just want you to understand the value of time.", "story": "I had a difficult day and took it out on you. Here’s the fifty dollars.", "problem": "Adds a lecture on the value of time."}, {"kind": "speech", "image": "Thank you, Dad!", "story": "", "problem": "Not in the story."}, {"kind": "thought", "image": "He must have worked so hard to earn this money. I'll spend it carefully.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Every dollar I earn represents an hour of my time.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "If I gave you fifty dollars, that means I gave up an hour of my time. An hour away from you. I could have spent that hour with you.", "story": "Can I buy an hour of your time? Could you come home early tomorrow and have lunch with me?", "problem": "The father explains lost time; in the story the son asks to buy an hour for lunch."}, {"kind": "caption", "image": "Dad was right. The most valuable thing of all is time spent with family.", "story": "These words deeply moved the father, and his eyes filled with tears. He hugged his little son and apologized to him.", "problem": "The son concludes the father was right; the story has the father moved and apologizing."}, {"kind": "moral", "image": "Moral: The greatest need of children is the attention, love, and time spent with them by their parents.", "story": "The greatest need of children is the attention, love, and time spent with them by their parents.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/value-of-your-family.webp"}, {"stem": "weight-of-the-oil", "title": "The Weight of Butter", "category": "Work, livelihood, and wealth", "status": "Needs correction", "items": [{"kind": "title", "image": "The Weight of Butter", "story": "The Weight of Butter", "problem": ""}, {"kind": "other", "image": "1st day", "story": "decreasing day by day", "problem": ""}, {"kind": "other", "image": "5th day", "story": "decreasing day by day", "problem": ""}, {"kind": "other", "image": "10th day", "story": "decreasing day by day", "problem": ""}, {"kind": "caption", "image": "The baker didn't give the peasant the full measure of butter; he gave less each day.", "story": "the weight of the butter he received was decreasing day by day. He accused the peasant of cheating him", "problem": "The caption blames the baker for short butter; the story blames the peasant, who matched the baker’s short loaf."}, {"kind": "caption", "image": "The baker filed a complaint and said: \"He took my butter, but he doesn't give full measure!\"", "story": "He accused the peasant of cheating him and complained to the judge.", "problem": "Says the peasant took the baker’s butter."}, {"kind": "speech", "image": "My lord, I have nothing to hide. If a man sells me butter, and gives less... I give him bread of the same measure.", "story": "I have no scales. I hold the butter in one hand and the baker’s one-kilogram loaf in the other. I give him the same weight of butter as he gives me in bread.", "problem": "The speaker seems to be the baker, and the one-kilogram loaf and scales are missing."}, {"kind": "caption", "image": "The judge thought for a while and said: \"What you gave him in butter, he returned to you in bread – less each day, of the same measure.\"", "story": "I give him the same weight of butter as he gives me in bread.", "problem": "Reverses who gave butter and who gave bread."}, {"kind": "caption", "image": "The judge ruled – justice is justice. Take back your place, each one, as you gave.", "story": "As you treat others, you often receive the same measure in return.", "problem": "Not the story sentence."}, {"kind": "moral", "image": "The way a person treats another person, he often gets the same measure in return. The bread you give him comes back to you as butter.", "story": "As you treat others, you often receive the same measure in return. The bread you give comes back to you as butter.", "problem": "Adds “another person” and “him.”"}], "preview": "../../en/wisdom-stories/illustrations/weight-of-the-oil.webp"}, {"stem": "woman-and-the-mirror", "title": "The Woman and the Mirror", "category": "Love and marriage", "status": "Needs correction", "items": [{"kind": "title", "image": "Woman and the mirror", "story": "The Woman and the Mirror", "problem": "Missing The."}, {"kind": "speech", "image": "Hmm... Three strands of hair today! Lovely.", "story": "I'll braid my hair today", "problem": "Different words and meaning."}, {"kind": "caption", "image": "Each strand of hair today is like a step toward happiness.", "story": "A woman wakes up in the morning and looks in the mirror. She sees that she has three strands of hair left on her head.", "problem": "Not story wording."}, {"kind": "speech", "image": "Hmm... Two strands of hair today!", "story": "I'll part it down the middle.", "problem": "Different words."}, {"kind": "speech", "image": "Oh well, so what... Two strands are still beautiful!", "story": "The next day she wakes up and looks in the mirror again... She sees that she has two strands of hair left on her head.", "problem": "Puts the two-strand line on a later day and changes the words."}, {"kind": "speech", "image": "Oh great! No strands of hair today, but my heart is full of joy!", "story": "Wonderful! Today I won't have to do my hair at all.", "problem": "Different words."}, {"kind": "caption", "image": "Look at everything from the right perspective; then choose happiness in every situation.", "story": "We cannot control every change, but our outlook can help us meet it with good humor.", "problem": "Different wording."}, {"kind": "other", "image": "LOVE YOURSELF", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "I CHOOSE MY OWN HAPPINESS", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "BE KIND TO YOURSELF", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "I am enough. I am grateful. I choose happiness every day.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Life is beautiful, no matter what hair you have!", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Moral: Everything depends on the perspective. Those who cannot create happiness within themselves cannot take it from others.", "story": "We cannot control every change, but our outlook can help us meet it with good humor.", "problem": "Different moral."}], "preview": "../../en/wisdom-stories/illustrations/woman-and-the-mirror.webp"}, {"stem": "woman-whose-house-was-robbed", "title": "The Woman Whose House Was Robbed", "category": "Justice and society", "status": "Needs correction", "items": [{"kind": "title", "image": "A woman whose house was robbed", "story": "The Woman Whose House Was Robbed", "problem": "Title uses \"A\" instead of \"The\"."}, {"kind": "caption", "image": "Your Majesty, while you were keeping watch over the city, my house was robbed.", "story": "We thought you were awake and watching over us, Your Majesty. That is why we felt safe enough to sleep.", "problem": "Wording and meaning differ: she reports the robbery during the king's watch, not that she slept because she trusted him."}, {"kind": "caption", "image": "Your Majesty, as I trusted that you were awake, I slept in peace.", "story": "We thought you were awake and watching over us, Your Majesty. That is why we felt safe enough to sleep.", "problem": "Paraphrase; missing \"watching over us\" and \"felt safe enough to sleep\"."}, {"kind": "speech", "image": "If I were asleep and the city was unprotected, who would be at fault for this?", "story": "How could you sleep so soundly that you didn’t notice a thief?", "problem": "The king asks who is at fault if he slept; the story has him blaming the woman for sleeping through the theft."}, {"kind": "speech", "image": "My Lord, it would be my own fault. I fell asleep believing that you were awake for us.", "story": "We thought you were awake and watching over us, Your Majesty. That is why we felt safe enough to sleep.", "problem": "Adds an admission of fault that is not in the story."}, {"kind": "moral", "image": "Moral: The peace of the people comes from the trust they have in the state. If the people know that their leader is awake, they will sleep peacefully.", "story": "Moral: People’s sense of security grows from trust in those responsible for protecting them. When people know their ruler is keeping watch, they can sleep peacefully in their own homes.", "problem": "\"state\" and \"leader\" replace \"those responsible for protecting them\" and \"ruler\"; \"in their own homes\" is missing."}], "preview": "../../en/wisdom-stories/illustrations/woman-whose-house-was-robbed.webp"}, {"stem": "if-i-dont-do-it-these-days-the-world-wont-collapse", "title": "The World Will Not Fall Apart", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "If I don't do it these days, the world won't fall apart", "story": "The World Will Not Fall Apart", "problem": "Different title."}, {"kind": "speech", "image": "Why aren't you focused on the task?", "story": "When I asked an employee how he was progressing with a task I had assigned him,", "problem": "Different question."}, {"kind": "speech", "image": "If I don't do it these days, the world won't fall apart.", "story": "“The world won’t fall apart if I don’t do it this week.”", "problem": "“these days” instead of “this week,” and the clause order differs."}, {"kind": "thought", "image": "If the world won't fall apart, why should we rush?", "story": "True, I thought, the world would not fall apart. But what about our trust?", "problem": "Different thought."}, {"kind": "caption", "image": "The issue isn't delay; it's the way we perceive our work and its value.", "story": "A delay of a few days was not the real issue. It was his attitude toward a commitment.", "problem": "“perceive our work” instead of attitude toward a commitment."}, {"kind": "caption", "image": "A delayed answer; a late report; a postponed commitment—trust lost often cannot be restored.", "story": "It can take years to build and a single sentence to damage.", "problem": "Different wording."}, {"kind": "caption", "image": "Excuses, oversights, or negligence— all of these damage trust; it's not easily rebuilt.", "story": "Most disappointing of all, he seemed to recognize that his response was wrong, yet neither apologized nor completed the task.", "problem": "Different point."}, {"kind": "other", "image": "PLAN DO IT RIGHT NOTICE IT.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Trust is not a resource you spend; it's a value you earn with consistency.", "story": "Trust is built by keeping commitments.", "problem": "Different wording."}, {"kind": "other", "image": "TRUST", "story": "Trust", "problem": ""}, {"kind": "other", "image": "EARNED OVER TIME", "story": "What takes years to earn", "problem": "Wording differs."}, {"kind": "other", "image": "LOST WITH A SINGLE BROKEN PROMISE.", "story": "can be lost in a moment of carelessness.", "problem": "“broken promise” instead of “carelessness.”"}, {"kind": "other", "image": "STRONG TEAMS GROW TOGETHER", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Moral: Trust is the most valuable asset of organizations. It takes years to earn it; those who keep their word protect this wealth.", "story": "Trust is built by keeping commitments. What takes years to earn can be lost in a moment of carelessness.", "problem": "Different moral."}], "preview": "../../en/wisdom-stories/illustrations/if-i-dont-do-it-these-days-the-world-wont-collapse.webp"}, {"stem": "think-speak-and-act-positively", "title": "Think, Speak, Act Positively", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "Think, Speak, Act Positively", "story": "Think, Speak, Act Positively", "problem": ""}, {"kind": "caption", "image": "Think positively, so think positive thoughts.", "story": "Think positively, because your thoughts become your words.", "problem": "Drops thoughts becoming words."}, {"kind": "thought", "image": "I will succeed!", "story": "", "problem": "Not in the story."}, {"kind": "thought", "image": "It will be a beautiful day!", "story": "", "problem": "Not in the story."}, {"kind": "thought", "image": "I am capable!", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Speak positively, so speak positive words.", "story": "Speak positively, because your words become your actions.", "problem": "Drops words becoming actions."}, {"kind": "speech", "image": "You're doing a great job!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Keep it up!", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Act positively, so words become actions.", "story": "Act positively, because your actions become your habits.", "problem": "Puts 'words become actions' under acting; the story's result is habits."}, {"kind": "other", "image": "Help others", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Care for nature", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Always act with kindness.", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Be thankful", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Be honest", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "These actions become our habits!", "story": "Act positively, because your actions become your habits.", "problem": "Close, but not the story sentence."}, {"kind": "caption", "image": "Act positively every day, so actions become habits.", "story": "Develop positive habits, because your habits become your values.", "problem": "Repeats actions becoming habits and skips values."}, {"kind": "other", "image": "Kindness", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Respect", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Responsibility", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Learning", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Trust", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Your positive actions create a bright future and open the door to success!", "story": "Develop positive values, because your values become your destiny.", "problem": "Success and a bright future replace values becoming destiny."}, {"kind": "other", "image": "Your bright future starts with you!", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Moral: Thoughts become words, words become actions, actions become habits, and habits become destiny. The beginning of a positive destiny is positive thinking.", "story": "Moral: Thoughts shape words, words shape actions, and repeated actions become habits and values. A change in outlook can begin a change in life.", "problem": "'become' replaces 'shape'; habits become destiny, skipping values; the second sentence is not the story's."}], "preview": "../../en/wisdom-stories/illustrations/think-speak-and-act-positively.webp"}, {"stem": "this-boat-is-empty-too", "title": "This Boat Is Empty Too", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "This boat is also empty", "story": "This boat is empty too.", "problem": "also instead of too."}, {"kind": "caption", "image": "Once, a young man was rowing his boat on the lake.", "story": "When I was young, I often went to the lake to think in solitude. I had a little boat and would spend hours on the water, letting my thoughts settle.", "problem": "A young man rowing replaces the master's solitude."}, {"kind": "caption", "image": "One day, a strong wind arose; his hat fell into the water.", "story": "Suddenly, another boat struck mine.", "problem": "A lost hat replaces the empty boat striking his."}, {"kind": "caption", "image": "He looked around and saw an empty boat; no one was there.", "story": "But the boat was empty. With no one to blame, my anger faded.", "problem": "He is not angry in the picture text."}, {"kind": "thought", "image": "This person must have done this on purpose.", "story": "Furious at the interruption, I opened my eyes, ready to shout at whoever was responsible.", "problem": "Different thought, and the picture has already said no one was there."}, {"kind": "caption", "image": "Later, the owner of the boat came and explained, \"I didn't mean to; I was trying to save you.\"", "story": "But the boat was empty.", "problem": "Adds an owner who explains, which the story does not."}, {"kind": "thought", "image": "This boat is also empty.", "story": "This boat is empty too.", "problem": "also instead of too."}, {"kind": "moral", "image": "Moral: If a person wants to maintain his peace, he should not look for evil intentions behind every incident.", "story": "Moral: If a person wants to maintain his peace, he should not look for evil intentions behind every incident. Sometimes what worries us is just a coincidence; it is our choice whether to magnify it and turn it into anger.", "problem": "The second story sentence is missing."}], "preview": "../../en/wisdom-stories/illustrations/this-boat-is-empty-too.webp"}, {"stem": "beloved-is-one-who-gives-love-to-people", "title": "Those Who Give Love Receive Love", "category": "Love and marriage", "status": "Needs correction", "items": [{"kind": "title", "image": "A loved one gives love to others", "story": "Those Who Give Love Receive Love", "problem": "Title does not match."}, {"kind": "caption", "image": "In China, a young wife quarreled with her mother-in-law over small things every day.", "story": "Many years ago in China, a young woman named Li-Li married and moved in with her husband and mother-in-law. She soon found it difficult to get along with her mother-in-law.", "problem": "Omits Li-Li and changes the setup."}, {"kind": "speech", "image": "You always do everything wrong!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "You don't work properly. You're always wrong!", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "One day, the young wife went to a wise old man known for his kindness and wisdom.", "story": "she went to an old friend of her father’s, a spice merchant, and told him her troubles.", "problem": "A wise old man, not her father’s spice-merchant friend."}, {"kind": "speech", "image": "Please help me. I can't get along with my mother-in-law. What should I do?", "story": "", "problem": "Not the story’s wording."}, {"kind": "caption", "image": "The wise elder said, “Cook delicious meals from your heart and treat her with kindness. Love has great power.”", "story": "He prepared an herbal mixture and told her to add a little to her mother-in-law’s food each day for three months. He said the poison would act so gradually that no one would suspect her.", "problem": "Omits the supposed poison."}, {"kind": "speech", "image": "If you cook with love and treat her with respect, her heart will soften.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Kindness is the key, my child.", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Sincere Heart", "story": "", "problem": "Label is not in the story."}, {"kind": "other", "image": "Kindness in Words", "story": "", "problem": "Label is not in the story."}, {"kind": "other", "image": "Patience in Action", "story": "", "problem": "Label is not in the story."}, {"kind": "caption", "image": "The young wife returned home, cooked delicious meals, and treated her mother-in-law with a warm heart and a smile.", "story": "Delighted, Li-Li went home and followed his instructions.", "problem": "Different wording."}, {"kind": "speech", "image": "Dear Mother, please enjoy these meals I've made for you.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Little by little, her mother-in-law's heart softened, and she started to speak kindly and cheerfully.", "story": "In time, her mother-in-law’s attitude changed, and she began treating Li-Li like her own daughter.", "problem": "Different wording."}, {"kind": "speech", "image": "You're such a good girl! Thank you for thinking of me.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "The young wife kept cooking delicious meals and treating her with respect and care.", "story": "Each day she prepared delicious meals and added a little of the supposed poison.", "problem": "Omits the supposed poison."}, {"kind": "speech", "image": "Thank you so much, Grandpa! My mother-in-law now loves me so much! We live together happily.", "story": "Overcome with remorse, Li-Li returned to the spice merchant and begged him for an antidote.", "problem": "She thanks him; in the story she begs for an antidote."}, {"kind": "speech", "image": "Love is like medicine for the heart. Where there is love, there is no room for hatred.", "story": "Dear Li-Li, all I gave you was vitamins. The real poison was in your mind. As you treated her with kindness, that poison gave way to love. Now you have become like mother and daughter.", "problem": "Does not say the mixture was vitamins or that the poison was in her mind."}, {"kind": "other", "image": "VITAMIN For the Heart and Soul", "story": "all I gave you was vitamins", "problem": "“For the Heart and Soul” is extra."}, {"kind": "caption", "image": "The young wife and her mother-in-law became like real family. They loved each other like mother and daughter.", "story": "Now you have become like mother and daughter.", "problem": "Close, but “real family” is extra."}, {"kind": "speech", "image": "We're like mother and daughter now. Our hearts are one.", "story": "Now you have become like mother and daughter.", "problem": "“Our hearts are one” is extra."}, {"kind": "moral", "image": "The real poison is often in our own minds. Treat others with love and hatred melts; enemies become friends.", "story": "The real poison often lies in our own thoughts. When we treat others with love, hatred can fade and enemies can become friends.", "problem": "“Minds” and “hatred melts” are not “thoughts” and “hatred can fade.”"}], "preview": "../../en/wisdom-stories/illustrations/beloved-is-one-who-gives-love-to-people.webp"}, {"stem": "three-questions", "title": "Three Questions", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "Three Questions", "story": "Three Questions", "problem": ""}, {"kind": "speech", "image": "You have come with three questions. Ask whatever is in your mind, and I shall answer them. Which one would you like to ask first?", "story": "Answer three questions by tomorrow or leave the palace. What does Allah patiently bear? What does He conceal? And what does He bring about through His wisdom and power?", "problem": "The king does not ask the three questions."}, {"kind": "speech", "image": "A vizier who holds high office today may become a servant tomorrow. This world is unpredictable.", "story": "Haven't you seen? In a moment, He can make a vizier a servant and a servant a vizier.", "problem": "Said before the exchange of roles, and \"unpredictable\" is extra."}, {"kind": "speech", "image": "Wise men say that the vizier's position today may be taken by someone else tomorrow.", "story": "Position is never permanent.", "problem": "Different wording, and it is spoken by the servant as advice rather than the third answer."}, {"kind": "speech", "image": "I understand, Your Highness. But who knows? Maybe the one sitting in my place now was once a servant too.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Well said. So, answer me: who is most in need of you today?", "story": "What does Allah patiently bear? What does He conceal?", "problem": "Different question."}, {"kind": "speech", "image": "The person who needs me today is my master.", "story": "Allah bears His servants' sorrows and conceals their faults.", "problem": "Different answer."}, {"kind": "speech", "image": "And your third answer? Tell me.", "story": "And the third answer? What does Allah bring about through His wisdom and power?", "problem": "The question is not named."}, {"kind": "speech", "image": "How could I not know? In a moment, the vizier today may become a servant tomorrow.", "story": "Haven't you seen? In a moment, He can make a vizier a servant and a servant a vizier.", "problem": "Drops the servant becoming a vizier, and does not name Allah."}, {"kind": "moral", "image": "Moral: A vizier today can become a servant tomorrow, so no one should be confident in his seat!", "story": "Moral: Position is never permanent. Remember that circumstances can change, and remain humble.", "problem": "Different moral."}], "preview": "../../en/wisdom-stories/illustrations/three-questions.webp"}, {"stem": "three-landscapes", "title": "Three Scenes", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "Three Scenes", "story": "Three Scenes", "problem": ""}, {"kind": "caption", "image": "The first scene: A young man goes out in search of goodness.", "story": "On a journey, a young man witnessed three puzzling scenes.", "problem": "He searches for goodness instead of witnessing scenes."}, {"kind": "caption", "image": "The first scene: People burn fields and harvest the labor of others, but call it their own.", "story": "First, he saw people sowing wheat that sprang up and ripened as soon as it touched the soil. Yet instead of harvesting it, the farmers burned the field.", "problem": "They harvest others' labor; in the story they burn their own instantly ripe wheat."}, {"kind": "caption", "image": "The second scene: One pushes stones all day, but after all his effort, others enjoy the results.", "story": "Next, he saw a man struggling to lift a stone. Only after adding a second stone could he raise it. With a third, it became easier still.", "problem": "Others enjoy the results; the story is that more stones make the load easier."}, {"kind": "caption", "image": "The third scene: People place their trust in others. The leaders ride, and the people walk.", "story": "Finally, he saw a man riding a sheep, with others clinging to his shoulders.", "problem": "Leaders ride and people walk; the story is a sheep carrying riders who cannot be caught."}, {"kind": "caption", "image": "Under the shade of a tree, the young man asks a wise man and explains what he has seen.", "story": "At a city gate, he met a radiant old man and told him what he had seen.", "problem": "A tree instead of a city gate."}, {"kind": "speech", "image": "Whatever you see, if you understand its meaning, that is the beginning of wisdom.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "If goodness is only talked about, it loses its value. If sin goes unrepented, it only grows. And if people follow the wrong leaders, they lose their way.", "story": "The farmers represent people who do good, then destroy its value by constantly boasting about it.", "problem": "\"Wrong leaders\" is not the elder's explanation."}, {"kind": "speech", "image": "Follow the true leader and the righteous path. Learn from the three scenes and choose your way wisely.", "story": "The first rider represents scholars, and those holding on are believers from every walk of life. Those left chasing behind are people without faith.", "problem": "Different explanation."}, {"kind": "moral", "image": "Moral: Goodness that is talked about loses its value, sin without repentance, and following a true leader — three lessons from three scenes.", "story": "Moral: The three scenes warn against boasting of good deeds and growing accustomed to wrongdoing, while honoring the value of wise spiritual guidance.", "problem": "Different moral."}], "preview": "../../en/wisdom-stories/illustrations/three-landscapes.webp"}, {"stem": "three-essential-things-for-a-city", "title": "Three Things a City Needs", "category": "History and notable figures", "status": "Needs correction", "items": [{"kind": "title", "image": "Three important things for a city", "story": "Three Things a City Needs", "problem": "Extra word \"important\"; \"for a city\" instead of \"a City Needs\"."}, {"kind": "caption", "image": "A city has three essentials: sewage, bath, and library.", "story": "Every city needs sewers, bathhouses, and libraries.", "problem": "\"sewage\", \"bath\", and \"library\" instead of \"sewers\", \"bathhouses\", and \"libraries\"."}, {"kind": "caption", "image": "A city needs a bath to cleanse the body, to refresh the soul and to maintain cleanliness.", "story": "Sewers cleanse the city, bathhouses cleanse the body, and libraries cleanse the soul.", "problem": "Gives the bath the soul-cleansing role the story gives to libraries."}, {"kind": "other", "image": "Sewage", "story": "sewers", "problem": "Singular \"Sewage\" instead of \"sewers\"."}, {"kind": "other", "image": "Bath", "story": "bathhouses", "problem": "\"Bath\" instead of \"bathhouses\"."}, {"kind": "other", "image": "Library", "story": "libraries", "problem": "\"Library\" instead of \"libraries\"."}, {"kind": "moral", "image": "Moral: A city must keep both the body and the soul clean. The library cleans the soul, bath cleans the body, and sewage cleans the city.", "story": "Moral: A city must care for the inner life of its people as well as their physical surroundings.", "problem": "The moral sentence is different. The second sentence uses \"library\", \"bath\", and \"sewage\" instead of \"libraries\", \"bathhouses\", and \"sewers\". \"Fatih Sultan Mehmet\" is not on the image."}], "preview": "../../en/wisdom-stories/illustrations/three-essential-things-for-a-city.webp"}, {"stem": "dont-say-i-couldnt-deliver-or-i-couldnt-manage", "title": "Tomorrow Is Another Chance", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "Don’t say “I didn’t deliver, I couldn’t do it”", "story": "Tomorrow Is Another Chance", "problem": "Title does not match. Story phrase is “I failed” or “I couldn’t do it.”"}, {"kind": "caption", "image": "Days count one another; some days bring happiness, some bring sorrow.", "story": "One day follows another. Some end happily; others bring disappointment.", "problem": "Different wording."}, {"kind": "caption", "image": "Don’t despair over yesterday; you don’t know what today may bring.", "story": "Whatever remains unfinished today, do not dwell on “I failed” or “I couldn’t do it.” Above all, do not lose hope.", "problem": "Different wording."}, {"kind": "thought", "image": "Maybe today the sun will rise for someone, because of you.", "story": "When the sun rises tomorrow, a whole new day will be yours.", "problem": "Different meaning."}, {"kind": "other", "image": "New day, new page, new beginnings!", "story": "Every day is a new page.", "problem": "Extra “new beginnings.”"}, {"kind": "other", "image": "Today, I write my best day!", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Every day is a new page. You can’t change yesterday, but how you write today is in your hands.", "story": "Every day is a new page. You can't change yesterday, but how you write today is in your hands.", "problem": ""}, {"kind": "other", "image": "Plan Learn Work Believe Grow", "story": "", "problem": "Book labels are not in the story."}, {"kind": "other", "image": "Small steps create big changes!", "story": "", "problem": "Not in the story."}], "preview": "../../en/wisdom-stories/illustrations/dont-say-i-couldnt-deliver-or-i-couldnt-manage.webp"}, {"stem": "education-or-character", "title": "Training or Nature?", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "Education or character", "story": "Training or Nature?", "problem": "Title uses “Education” and “character” instead of “Training” and “Nature.”"}, {"kind": "speech", "image": "Minister, which is more important — education or character?", "story": "“Which matters more: training or nature?”", "problem": "Different terms."}, {"kind": "speech", "image": "Your Majesty, character.", "story": "“Nature, Your Majesty.”", "problem": "“character” instead of “Nature.”"}, {"kind": "speech", "image": "Your Majesty, education can make a person skilled and knowledgeable, but character is revealed in difficult times. That is the truth.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "If an uneducated person gets power and authority, what will happen?", "story": "“How long would it take you to teach a cat to serve guests with a bowl in its paw?”", "problem": "Different question; cat-and-mouse scene is missing."}, {"kind": "speech", "image": "He will abuse it, Your Majesty.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "And why is that?", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Because his nature remains unchanged, Your Majesty.", "story": "“Nature, Your Majesty.”", "problem": "Different wording."}, {"kind": "caption", "image": "Once, Your Majesty, at a feast, an uneducated man was given the responsibility of serving the king.", "story": "The court gathered, and the cat began serving the guests.", "problem": "Man serving tea replaces the trained cat."}, {"kind": "caption", "image": "He tripped over a small toy on the floor and nearly spilled the tea. Seeing it, the uneducated man’s true nature came out — he angrily kicked the toy aside.", "story": "Before answering, the minister took a mouse from his pocket and released it. The cat immediately dropped the bowl and chased it.", "problem": "Different event."}, {"kind": "speech", "image": "Exactly, Your Majesty.", "story": "“Nature, Your Majesty.”", "problem": "Different reply."}, {"kind": "moral", "image": "Education does not change character; when opportunity arises, true nature is revealed.", "story": "Training may shape behavior, but an opportunity can reveal the nature beneath it. Learning matters, but character matters too.", "problem": "Different wording and meaning."}], "preview": "../../en/wisdom-stories/illustrations/education-or-character.webp"}, {"stem": "true-love", "title": "True Love", "category": "Love and marriage", "status": "Needs correction", "items": [{"kind": "title", "image": "True love", "story": "True Love", "problem": ""}, {"kind": "other", "image": "Ada", "story": "", "problem": "Name on the dress is not in the story."}, {"kind": "caption", "image": "All the village folks had love in their hearts. But one girl's heart was filled with deep love. Her heart's love was true and pure, and she began to wait for it.", "story": "There was an island where all the feelings lived.", "problem": "A village girl replaces the feelings on the island."}, {"kind": "caption", "image": "The girl kept waiting for her true love to return. Though many ships came and went, none brought the one she loved. And so, she kept waiting – year after year.", "story": "Love was in no hurry to leave.", "problem": "Not the story."}, {"kind": "speech", "image": "Wise man, how can I know the value of true love?", "story": "Who was it that helped me?", "problem": "Different question."}, {"kind": "speech", "image": "My child, only time knows how valuable true love is. Time keeps sincere love alive.", "story": "Because only Time knows how important and precious Love is.", "problem": "Said before the journey, and wording differs."}, {"kind": "speech", "image": "Captain, take me with you, please.", "story": "Wealth, can you take me with you?", "problem": "She asks a captain, not Wealth."}, {"kind": "speech", "image": "I can help you, but, girl, I have my true love waiting for me elsewhere.", "story": "No, I can’t. My boat is full of gold and silver — there is no room for you.", "problem": "Different refusal."}, {"kind": "speech", "image": "Lady, can you tell me about my love?", "story": "Sadness, may I come with you?", "problem": "Different question."}, {"kind": "speech", "image": "My child, the one you love is unfaithful. He no longer thinks of you.", "story": "Oh, Love, I am so sad that I need to be alone.", "problem": "Says the beloved is unfaithful."}, {"kind": "caption", "image": "Happiness came into Esma's life, but the one she loved did not return.", "story": "Happiness was not far from Love, yet so excited that she did not hear Love’s call.", "problem": "Names Esma and a lover who does not return."}, {"kind": "speech", "image": "My love, please accept me.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Seagulls flew, ships sailed, and years passed, but the girl kept on waiting.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Grandfather, when will I know my true love?", "story": "Time? But why did Time help me?", "problem": "Different question."}, {"kind": "speech", "image": "Be patient.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "My child, only time knows the value of true love.", "story": "Because only Time knows how important and precious Love is.", "problem": "“Value” instead of “important and precious.”"}, {"kind": "moral", "image": "Moral: Only time knows the value of true love. Time keeps sincere love alive, but it extinguishes and forgets fake love.", "story": "Only time knows the worth of true love. Time keeps sincere love alive and lets the false fade into forgetfulness.", "problem": "“Value” and “extinguishes and forgets” differ from “worth” and “lets the false fade.”"}], "preview": "../../en/wisdom-stories/illustrations/true-love.webp"}, {"stem": "try-to-think-this-way", "title": "Try Another Way of Thinking", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "Try to think like this", "story": "Try Another Way of Thinking", "problem": "Title wording differs."}, {"kind": "caption", "image": "I can't do this job because I can't read well.", "story": "Instead of “I’m no good at this,” try “What do I still need to learn? With practice, I can improve.”", "problem": "A job and reading replace the story's first pair."}, {"kind": "caption", "image": "Maybe I don't know yet, but if I practice regularly, I can improve my reading skills.", "story": "What do I still need to learn? With practice, I can improve.", "problem": "Adds reading skills and 'I don't know yet'."}, {"kind": "other", "image": "EXIT CLOSED", "story": "", "problem": ""}, {"kind": "caption", "image": "I can't get this job because I have no experience.", "story": "Instead of “I give up,” try “Could I approach this another way?”", "problem": "A job and experience replace 'I give up'."}, {"kind": "caption", "image": "Maybe there's another way I can start. I'll try, I'll see, and I can learn as I go.", "story": "Could I approach this another way?", "problem": "Extra sentences beyond the story's question."}, {"kind": "caption", "image": "This job is too hard; I can't do it.", "story": "Instead of “This is too hard,” try “It’s difficult, but more time and effort may help.”", "problem": "Adds 'this job' and 'I can't do it'."}, {"kind": "caption", "image": "It's difficult, but if I keep trying and stay patient, I can overcome it.", "story": "It’s difficult, but more time and effort may help.", "problem": "'trying and stay patient' and 'overcome it' replace 'more time and effort may help'."}, {"kind": "caption", "image": "Others are better than me, so I can't do this job.", "story": "Instead of “I’ll never be as capable as them,” try “What can I learn from how they did it?”", "problem": "Different negative thought."}, {"kind": "caption", "image": "If I keep learning and working harder, I can improve and achieve results.", "story": "There may be a way to do better.", "problem": "Different positive thought."}, {"kind": "caption", "image": "I failed, so I can't do it.", "story": "Instead of “I wish I hadn’t made that mistake,” try “What can it teach me?”", "problem": "Failure replaces wishing he had not made a mistake."}, {"kind": "caption", "image": "It's not the end; it means I need to learn differently.", "story": "What can it teach me?", "problem": "Different reply."}, {"kind": "caption", "image": "I'm not smart, so I can't do it.", "story": "Instead of “I’ll never be as capable as them,” try “What can I learn from how they did it?”", "problem": "Different negative thought."}, {"kind": "caption", "image": "No one is born smart. If I learn and practice every day, I can achieve my goals.", "story": "What can I learn from how they did it?", "problem": "Different reply."}, {"kind": "moral", "image": "Moral: Changing your mindset is the first step to changing your life. Saying “I can't” closes the door, saying “I can learn” opens up new possibilities.", "story": "Moral: Changing your mindset is the first step to changing your life. Saying “I can't” closes the door, saying “I can learn” opens up new possibilities. Failure is not the end, it is an opportunity for growth.", "problem": "Drops the last sentence about failure."}], "preview": "../../en/wisdom-stories/illustrations/try-to-think-this-way.webp"}, {"stem": "turning-hardship-into-opportunity", "title": "Turning Hardship into Opportunity", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "Turning difficulties into opportunities", "story": "Turning Hardship into Opportunity", "problem": "'difficulties' and 'opportunities' replace 'Hardship' and 'Opportunity'."}, {"kind": "caption", "image": "Hardships come to everyone in life, but we don't all see them the same way.", "story": "Sometimes in life, things go very smoothly, and sometimes we face unexpected difficulties. The important thing is to be able to turn the difficulties we encounter into opportunities.", "problem": "Different sentence; drops turning difficulties into opportunities."}, {"kind": "other", "image": "DETOUR", "story": "", "problem": ""}, {"kind": "caption", "image": "How we respond to hardships determines whether we are defeated or empowered.", "story": "How we respond helps shape what comes of it.", "problem": "'defeated or empowered' replaces 'helps shape what comes of it'."}, {"kind": "other", "image": "CHALLENGE", "story": "", "problem": ""}, {"kind": "other", "image": "GROWTH", "story": "A difficulty can become a chance to learn or grow.", "problem": ""}, {"kind": "other", "image": "PURPOSE", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Moral: The same difficulty breaks one and strengthens another. It is up to a person to turn difficulties into tools, not weapons.", "story": "Moral: A difficulty can become a chance to learn or grow. How we respond helps shape what comes of it.", "problem": "'tools, not weapons' replaces learning, growing, and how a response shapes what comes of it."}], "preview": "../../en/wisdom-stories/illustrations/turning-hardship-into-opportunity.webp"}, {"stem": "two-bowls-of-water", "title": "Two Cups of Water", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "Two Cups of Water", "story": "Two Cups of Water", "problem": ""}, {"kind": "speech", "image": "I am the richest man in this realm. I have so much wealth that none of it can be compared. No one in my kingdom can match my fortune.", "story": "What do you think of my power and riches?", "problem": "The ruler boasts in different words."}, {"kind": "speech", "image": "Have you ever been to the desert? There, tell me, how much is all your wealth worth?", "story": "Imagine you are dying of thirst in a desert. Would you give half your wealth for a cup of water?", "problem": "Asks the total worth instead of half his wealth for one cup."}, {"kind": "speech", "image": "In the desert, my king, everything you mentioned is worth only two pots of water for keeping you alive.", "story": "All your wealth is worth just two cups of water.", "problem": "pots instead of cups, and the second question is skipped."}, {"kind": "speech", "image": "I understand, truly.", "story": "Of course.", "problem": "Different reply."}, {"kind": "speech", "image": "Keep this in mind: after a while, all your wealth will be forgotten. In the desert, the value of all your wealth is only two pots of water.", "story": "Then do not boast too much. All your wealth is worth just two cups of water.", "problem": "Adds that wealth will be forgotten, and says pots."}, {"kind": "speech", "image": "May it be so. You are right.", "story": "To stay alive, yes.", "problem": "Different reply."}, {"kind": "speech", "image": "My king, remember this and act accordingly. Let humility and wisdom guide your heart always.", "story": "Then do not boast too much", "problem": "Extra advice."}, {"kind": "moral", "image": "Moral: The value of wealth depends on the circumstances: in the desert, all your wealth is worth only two pots of water. Do not boast about your wealth.", "story": "Moral: The value of riches depends on what we need. In a desert, water can be worth more than a treasury.", "problem": "Circumstances and two pots replace need and a treasury."}], "preview": "../../en/wisdom-stories/illustrations/two-bowls-of-water.webp"}, {"stem": "i-am-waiting-for-the-teeth", "title": "Waiting for the Teeth", "category": "Family and upbringing", "status": "Needs correction", "items": [{"kind": "title", "image": "Waiting for the teeth", "story": "Waiting for the Teeth", "problem": ""}, {"kind": "other", "image": "I'm lovin' it", "story": "", "problem": "Slogan is not in the story."}, {"kind": "caption", "image": "An elderly couple came to McDonald's one cold winter evening. They ordered a simple meal: one hamburger, one large fries, and one large Coca-Cola.", "story": "On a cold winter evening, an elderly couple entered McDonald’s. The husband bought one hamburger, a large portion of fries, and a large Coke.", "problem": "“Came” and “ordered” and “Coca-Cola” instead of the husband buying a large Coke."}, {"kind": "caption", "image": "He cut the burger into small pieces, soaked each one in ketchup, and ate it with enjoyment. The Coca-Cola is his favorite.", "story": "At their table, he cut the burger in half and divided the fries equally. Then he took a sip of Coke and passed it to his wife.", "problem": "Ketchup and eating with enjoyment replace cutting the burger in half and sharing."}, {"kind": "caption", "image": "The people nearby watched them in silence, touched by their love and patience.", "story": "Other customers watched sympathetically. “Poor things. They’re sharing one meal.”", "problem": "Different reaction."}, {"kind": "caption", "image": "He ate most of the burger and then saw his wife still waiting. He brought the rest of the burger to her and said, “Eat too. This belongs to us both.”", "story": "But while the man ate eagerly, his wife left her food untouched, taking only an occasional sip of Coke.", "problem": "He offers her the rest; in the story her food stays untouched."}, {"kind": "speech", "image": "Sir, may I ask something? Why is your wife not eating? May I bring her something easier to eat?", "story": "Excuse me, sir. Your wife hasn’t touched her food. If she doesn’t like it, could I bring her something else?", "problem": "Different wording."}, {"kind": "speech", "image": "She has no teeth, son. We're waiting for her new teeth to be ready so she can eat properly.", "story": "Thank you, but we’re quite happy. We’ve been married for sixty years. We share everything.", "problem": "Says they are waiting for new teeth; the story is that they share one set."}, {"kind": "speech", "image": "Don't worry, ma'am. We'll prepare something soft and easy for you.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Thank you, son... You have a kind heart.", "story": "The teeth, dear. I’m waiting for the teeth.", "problem": "The punchline is missing."}, {"kind": "moral", "image": "Moral: No one should be left in need of the one they love. May God not leave anyone helpless, even in their own family.", "story": "No one should be left in need of the one they love. May Allah not leave anyone helpless, even in their own family.", "problem": "“God” instead of “Allah.”"}], "preview": "../../en/wisdom-stories/illustrations/i-am-waiting-for-the-teeth.webp"}, {"stem": "it-is-in-vain", "title": "Wasted Effort", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "It is futile", "story": "It is futile to advise a fool, to argue with an ignorant person, to befriend a hypocrite.", "problem": ""}, {"kind": "speech", "image": "It is futile to advise a fool.", "story": "It is futile to advise a fool", "problem": ""}, {"kind": "speech", "image": "It is futile to befriend a hypocrite.", "story": "to befriend a hypocrite", "problem": ""}, {"kind": "other", "image": "ADVICE", "story": "", "problem": "Sign is not in the story."}, {"kind": "other", "image": "LEARNING", "story": "", "problem": "Sign is not in the story."}, {"kind": "moral", "image": "Moral: Choosing who you spend time with is choosing how you will live. Arguing with an ignorant person is a wasted life.", "story": "Moral: Choosing your company helps shape your life. Do not waste it arguing with people unwilling to learn or trusting those who are insincere.", "problem": "Reworded, and it drops the warning about trusting insincere people."}], "preview": "../../en/wisdom-stories/illustrations/it-is-in-vain.webp"}, {"stem": "we-are-rich", "title": "We Are Rich", "category": "Work, livelihood, and wealth", "status": "Needs correction", "items": [{"kind": "title", "image": "We are rich", "story": "We Are Rich", "problem": ""}, {"kind": "caption", "image": "When the king of Nintoku heard that the people of his country lived in poverty and hardship, and that many could not even afford enough food, he was deeply saddened. He decided to see for himself how his people truly lived.", "story": "Emperor Nintoku of Japan climbed a high tower one day and surveyed his country. Seeing not even a wisp of smoke rising, he realized his people were in poverty and that no one could cook at home.", "problem": "He hears a report instead of seeing no smoke from the tower."}, {"kind": "caption", "image": "He left the palace in disguise and traveled through the villages and fields. He spoke with farmers and workers, listened to their stories and hardships, and saw their daily struggles with his own eyes.", "story": "He suspended taxes for three years and ordered that people work for their own households.", "problem": "The disguise journey is not in the story."}, {"kind": "caption", "image": "After seeing this, the king returned to the palace and called his ministers together to share what he had seen and to speak about what must be done.", "story": "Three years later Nintoku climbed the tower again, saw smoke rising on every side", "problem": "The ministers’ meeting replaces the second climb."}, {"kind": "speech", "image": "This is not true wealth.", "story": "You call this wealth?", "problem": "Spoken by the king in the picture; the empress asks the question in the story."}, {"kind": "caption", "image": "The empress, known for her wisdom and compassion, agreed with him and spoke gently.", "story": "the empress pointed to the palace, neglected for three years — roof leaking, flowers withered — and asked", "problem": "She agrees instead of questioning him, and the leaking roof is missing."}, {"kind": "speech", "image": "Your Majesty, true wealth lies in the well-being of the people.", "story": "You call this wealth?", "problem": "Gives the emperor’s lesson to the empress."}, {"kind": "caption", "image": "The king thoughtfully replied to his ministers:", "story": "Nintoku’s answer has been remembered by the Japanese for centuries", "problem": "He replies to ministers, not the empress."}, {"kind": "speech", "image": "If our people are happy, our country is truly rich. Let us lead in a way that brings meaning to their lives.", "story": "When our people are poor, we are poor. When they prosper, so do we.", "problem": "The remembered answer is missing."}, {"kind": "moral", "image": "True wealth is not in the treasury, but in the well-being of the people. The greatness of a leader is not in his position, but in the meaning he brings to his position.", "story": "True wealth is not in the treasury, but in the people’s well-being. A leader’s greatness lies not in the post, but in the meaning given to that post.", "problem": "“he brings to his position” differs from “the meaning given to that post.”"}], "preview": "../../en/wisdom-stories/illustrations/we-are-rich.webp"}, {"stem": "welcome-my-bey", "title": "Welcome Home", "category": "Friendship and human relations", "status": "Needs correction", "items": [{"kind": "title", "image": "Welcome, sir", "story": "Welcome Home", "problem": "Title does not match. Story greeting is “Welcome home, my bey.”"}, {"kind": "caption", "image": "Rahmat was expecting a baby. Hafiz Ali, who was called up for military service, came to say goodbye to his pregnant wife. He told her, “Be strong. Take care of yourself. Safarbarlik is a sacred duty. I will return, God willing.”", "story": "When my father, Hafiz Ali, went to Çanakkale, my mother was seven months pregnant with me. I never met him.", "problem": "Adds a farewell scene and wording not in the story."}, {"kind": "caption", "image": "The son watched his father leave from the yard.", "story": "", "problem": "Not in the story; the narrator never met his father."}, {"kind": "speech", "image": "Take care of yourself, father. May God protect you and bring you back safely.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Don’t worry. Take care of yourself and the baby. I will return.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "I will return. May God protect you and the baby.", "story": "", "pr
