lind."}, {"kind": "other", "image": "Peace and kindness live here.", "story": "", "problem": "Sign text is not in the story."}, {"kind": "caption", "image": "The healthy horse wore a bell around its neck so that its blind friend could follow the sound.", "story": "As you approach, you hear a bell attached to the smaller horse’s bridle. The blind horse follows the sound.", "problem": "Bell is on the smaller horse’s bridle in the story, not described as a healthy horse’s neck bell."}, {"kind": "caption", "image": "The healthy horse led its blind friend with care, helping it move safely everywhere.", "story": "Watch closely, and you will see that the horse with the bell keeps checking on its companion, while the blind horse listens and follows at its own pace.", "problem": "Different wording and action."}, {"kind": "caption", "image": "As the days went by, the blind horse learned to trust and follow its friend with confidence.", "story": "Each evening on the way back to the stable, the smaller horse stops and looks around, making sure its friend is close enough to hear the bell.", "problem": "Image replaces the evening bell-check with a trust lesson."}, {"kind": "caption", "image": "Together, they became more than friends; their bond inspired all who saw them.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Their friendship showed that kindness and compassion make the world a better place.", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Friendship, Kindness, Compassion", "story": "", "problem": "Sign text is not in the story."}, {"kind": "moral", "image": "We are not left alone in hard times; help often comes through another person. Sometimes we must be that helper.", "story": "The Lord does not abandon us in difficult times. Help often reaches us through other people, and sometimes we are called to be that help.", "problem": "Drops “The Lord,” and changes “does not abandon,” “reaches us,” and “called to be that help.”"}], "preview": "../../en/wisdom-stories/illustrations/friendship-of-horses.webp"}, {"stem": "garden-and-the-gardener", "title": "The Garden and the Gardener", "category": "Work, livelihood, and wealth", "status": "Needs correction", "items": [{"kind": "title", "image": "Garden and gardener", "story": "The Garden and the Gardener", "problem": "Drops “The” and lowercases gardener."}, {"kind": "caption", "image": "The teacher asks the students to imagine a gardener tending a garden.", "story": "Picture a gardener tending a garden. Can you see it?", "problem": "Drops “Can you see it?”"}, {"kind": "other", "image": "THINK GOOD THOUGHTS", "story": "", "problem": "Poster is not in the story."}, {"kind": "speech", "image": "Can you imagine a gardener tending a garden? Imagine it.", "story": "Picture a gardener tending a garden. Can you see it?", "problem": "“imagine” and “Imagine it” replace “Picture” and “Can you see it?”"}, {"kind": "speech", "image": "We did. — They answer the teacher.", "story": "Yes, they replied.", "problem": "“We did” is not “Yes.”"}, {"kind": "other", "image": "THINK KIND THOUGHTS", "story": "", "problem": "Poster is not in the story."}, {"kind": "caption", "image": "The teacher speaks seriously:", "story": "The teacher says in a serious voice:", "problem": ""}, {"kind": "speech", "image": "Do not deny others' hard work or belittle your own growth. A person grows neither entirely alone nor entirely thanks to someone else.", "story": "it would be wrong to say the garden grew entirely because of the gardener. But it would be just as wrong to say it grew entirely by itself.", "problem": "Rewrites the garden lesson as advice about denying hard work."}, {"kind": "caption", "image": "Growth is a shared effort, not only yours alone. A person grows neither entirely alone nor entirely thanks to someone else.", "story": "Recognize both your own efforts and the help you receive.", "problem": "Different wording."}, {"kind": "moral", "image": "Do not deny others' hard work or belittle your own. A person grows neither entirely alone nor entirely thanks to someone else.", "story": "Recognize both your own efforts and the help you receive. No one grows entirely alone or entirely through the work of others.", "problem": "Moral is reworded and “thanks to someone else” is not the story phrase."}], "preview": "../../en/wisdom-stories/illustrations/garden-and-the-gardener.webp"}, {"stem": "blessings-god-has-given", "title": "The Gifts of Allah", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Blessings given by God", "story": "The Gifts of Allah", "problem": "“Blessings given by God” is not “The Gifts of Allah.”"}, {"kind": "speech", "image": "God gives a blessing to someone so that He may test how they will use that blessing.", "story": "Every gift from Allah is not only a blessing but also a responsibility. Allah will surely ask how you used what was entrusted to you", "problem": "“God” and a test of use replace Allah’s gifts as both blessing and responsibility."}, {"kind": "other", "image": "Strength → test of justice", "story": "If He granted you authority, were you just?", "problem": "“Strength” is not “authority.”"}, {"kind": "other", "image": "Wealth → test of mercy", "story": "If He gave you wealth, did you remain honest?", "problem": "Pairs wealth with mercy; the story pairs wealth with honesty and high status with compassion."}, {"kind": "other", "image": "Provision → test of gratitude", "story": "If He gave you a peaceful life, were you grateful?", "problem": "“Provision” is not “a peaceful life.”"}, {"kind": "other", "image": "Family → test of love", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Spouse → test of loyalty", "story": "If He gave you a life partner, were you faithful?", "problem": "“loyalty” for “faithful.”"}, {"kind": "other", "image": "Children → test of responsibility", "story": "If He gave you children, how did you raise them?", "problem": "“test of responsibility” is not “how did you raise them?”"}, {"kind": "caption", "image": "Every blessing is also a test. It is not what you have, but how you deal with it.", "story": "Every blessing from Allah carries a responsibility; we honor His gifts by using them with justice, compassion, gratitude, and faithfulness.", "problem": "Drops Allah and the list of justice, compassion, gratitude, and faithfulness."}, {"kind": "moral", "image": "Every blessing is also a test. It is not what you have, but how you deal with it.", "story": "Every blessing from Allah carries a responsibility; we honor His gifts by using them with justice, compassion, gratitude, and faithfulness.", "problem": "Same discrepancy as the caption; it is not the story moral."}], "preview": "../../en/wisdom-stories/illustrations/blessings-god-has-given.webp"}, {"stem": "goose-to-be-plucked", "title": "The Goose to Be Plucked", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "The Goose to Be Plucked", "story": "The Goose to Be Plucked", "problem": ""}, {"kind": "caption", "image": "One winter day, the king and his vizier went out in disguise to see how people were living in the kingdom. As they walked by a river, they saw an old wise man sitting by the bank, washing something in a wicker basket.", "story": "On a bitter winter day, a king went out in disguise with his chief vizier. Beside a stream they met an old tanner dipping hides into the icy water and beating them.", "problem": "A wise man washing a basket replaces the tanner dipping and beating hides."}, {"kind": "speech", "image": "King: — Peace be upon you, old man.", "story": "“Peace be upon you, venerable elder.”", "problem": "'old man' replaces 'venerable elder'."}, {"kind": "speech", "image": "Wise Man: — And upon you be peace and mercy.", "story": "“And upon you, ruler of the world,” the old man replied.", "problem": "Drops 'ruler of the world' and adds 'mercy'."}, {"kind": "speech", "image": "King: — What are you doing here?", "story": "“What did you do during the six?” the king asked.", "problem": "Different question."}, {"kind": "speech", "image": "Wise Man: — What does the goose to be plucked mean?", "story": "“If I send you a goose, will you pluck it?”", "problem": "The wise man asks the riddle; in the story the king asks it."}, {"kind": "speech", "image": "King: — Its meaning is for those who understand.", "story": "“Certainly—and without making it cry out.”", "problem": "Different reply."}, {"kind": "speech", "image": "Wise Man: — Tell us, old man, explain it.", "story": "“Did you understand our conversation?”", "problem": "Different request."}, {"kind": "speech", "image": "King: — Whoever understands it, let him understand.", "story": "“Find out what it meant by this evening, or you will lose your head.”", "problem": "Different line."}, {"kind": "speech", "image": "King: — Don't you understand our question?", "story": "“Did you understand our conversation?”", "problem": "Close, but not the same words, and it is aimed at the wise man rather than the vizier."}, {"kind": "speech", "image": "Vizier: — Perhaps he is taking us for fools.", "story": "“No, Your Majesty,” the vizier admitted.", "problem": "Not in the story."}, {"kind": "speech", "image": "Wise Man: — I'm not taking you for fools. I say only what I see.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Vizier: — Please explain it to us.", "story": "“What were you and the king talking about?” he asked.", "problem": "Different question."}, {"kind": "speech", "image": "Wise Man: — A fly sits on honey, the bee on poison. Your taste is your understanding.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "King: — Many a thing a man sees with his eyes, but the meaning is beyond his grasp.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "The elder explains after much gold: — The goose that is to be plucked must first be caught, then held, then carried, then slaughtered, then plucked, then cooked, then eaten— all by the one who understands. Seeing is one thing, knowing how it is meant — another.", "story": "“That one you can work out for yourself.”", "problem": "A slaughter-and-cooking explanation replaces the tanner's refusal to explain the goose."}, {"kind": "speech", "image": "Elder: — My son, words have layers, each with its own meaning. Not everyone can reach the heart of a saying.", "story": "Moral: A wise word is revealed to those who understand it. Not everyone understands what they hear — some answers a person must find for themselves.", "problem": "Different wording, spoken in the scene rather than as the story's riddle answers."}, {"kind": "speech", "image": "Vizier: — So the meaning of “the goose to be plucked” depends on the one who understands it?", "story": "“And the goose he said he would send?”", "problem": "Different question."}, {"kind": "speech", "image": "Elder (smiling): — Guess it yourself.", "story": "“That one you can work out for yourself.”", "problem": "'Guess it yourself' is not the same wording."}, {"kind": "moral", "image": "A wise word is revealed to those who understand it. Some answers a person must find for themselves.", "story": "Moral: A wise word is revealed to those who understand it. Not everyone understands what they hear — some answers a person must find for themselves.", "problem": "Drops 'Not everyone understands what they hear'."}], "preview": "../../en/wisdom-stories/illustrations/goose-to-be-plucked.webp"}, {"stem": "hajj-pilgrimage", "title": "The Hajj Pilgrimage", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Hajj pilgrimage", "story": "The Hajj Pilgrimage", "problem": "Missing “The”; “pilgrimage” is not capitalized."}, {"kind": "caption", "image": "One of the pilgrim’s acts during Hajj is to throw stones at the devil, symbolizing the rejection of evil within.", "story": "During the Hajj, when the time came to cast stones at the devil, one pilgrim began striking himself with the stones instead.", "problem": "General explanation; the story is one pilgrim striking himself."}, {"kind": "speech", "image": "Grandfather, when you throw those stones, what are you rejecting?", "story": "Uncle, why are you hitting yourself?", "problem": "Different speaker and question."}, {"kind": "speech", "image": "My son, we reject the evil within us—pride, anger, selfishness. These stones remind us to cleanse our hearts and protect our souls.", "story": "My son, why should we concern ourselves only with the devil outside us? We must also confront the devil within, curb our selfish desires, and purify our hearts.", "problem": "Adds pride and anger and “protect our souls”; drops the devil outside us."}, {"kind": "caption", "image": "The true struggle is not against others, nor against the world, but against the ego within. Whoever conquers their own self has achieved the greatest victory.", "story": "The heat belongs to fire, not to the griddle; true worth lies in the mind, not in a crown. Whatever you seek, first seek it within yourself — not only in Jerusalem, Mecca, or the Hajj.", "problem": "A different verse; the story’s lines about fire, the crown, Jerusalem, Mecca, and the Hajj are missing."}, {"kind": "caption", "image": "The real struggle is not outside, but with one’s own soul. The miracle is within.", "story": "The deepest struggle is not against an enemy outside us, but against our own uncontrolled desires. True spiritual worth is not found in outward symbols; it begins within.", "problem": "“one’s own soul” and “The miracle is within” differ from uncontrolled desires and outward symbols."}], "preview": "../../en/wisdom-stories/illustrations/hajj-pilgrimage.webp"}, {"stem": "hunters-description", "title": "The Hunter's Tale", "category": "Parables and fables", "status": "Needs correction", "items": [{"kind": "title", "image": "The Hunter’s Tale", "story": "The Hunter's Tale", "problem": ""}, {"kind": "caption", "image": "As long as the lion cannot write, every story will glorify the hunter.", "story": "Until the lion learns to write, every storyteller will write the hunter's tale.", "problem": "\"cannot write\" and \"glorify the hunter\" differ from \"learns to write\" and \"write the hunter's tale\"."}, {"kind": "other", "image": "THE HUNTER'S VERSION", "story": "", "problem": "Book title is not in the story."}, {"kind": "other", "image": "African proverb", "story": "African Proverb", "problem": ""}, {"kind": "caption", "image": "He who tells the story becomes the hero.", "story": "The storyteller decides whose courage is remembered.", "problem": "Different wording."}, {"kind": "other", "image": "MY STORY", "story": "", "problem": "Book title is not in the story."}, {"kind": "other", "image": "UNTIL THE LION LEARNS TO WRITE, STORYTELLERS PRAISE THE HUNTER.", "story": "Until the lion learns to write, every storyteller will write the hunter's tale.", "problem": "\"PRAISE THE HUNTER\" replaces \"write the hunter's tale\"."}, {"kind": "moral", "image": "He who tells the story becomes the hero. If you do not write your own truth, others will tell it for you.", "story": "Moral: The storyteller decides whose courage is remembered. If you cannot tell your own story, others will tell it for you.", "problem": "\"do not write your own truth\" differs from \"cannot tell your own story\"."}], "preview": "../../en/wisdom-stories/illustrations/hunters-description.webp"}, {"stem": "idle-devil", "title": "The Idle Devil", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "The Idle Devil", "story": "The Idle Devil", "problem": ""}, {"kind": "caption", "image": "A thoughtful dervish was sitting in the garden when he saw a weary figure beside him.", "story": "A dervish lost in thought suddenly noticed the devil sitting beside him.", "problem": "Says a weary figure in a garden, not the devil."}, {"kind": "speech", "image": "Why are you sitting here so idle?", "story": "Why are you sitting there doing nothing?", "problem": "Wording differs."}, {"kind": "caption", "image": "— asked the dervish.", "story": "", "problem": "Narration tag is not in the story."}, {"kind": "speech", "image": "People cause each other so much harm that there is little left to do.", "story": "You people cause one another so much suffering that there’s no work left for me.", "problem": "Wording differs."}, {"kind": "moral", "image": "People harm each other so much that evil needs no help. Most harm comes from within us, not from outside.", "story": "People oppress each other so much that the devil has no work to do. Most evil comes not from outside, but from within us.", "problem": "Moral is reworded."}], "preview": "../../en/wisdom-stories/illustrations/idle-devil.webp"}, {"stem": "just-verdict-of-the-frankfurt-judge", "title": "The Judge of Frankfurt", "category": "Justice and society", "status": "Needs correction", "items": [{"kind": "title", "image": "The just verdict of the Frankfurt judge", "story": "The Judge of Frankfurt", "problem": "Title wording differs."}, {"kind": "caption", "image": "In 1506, in Frankfurt, a merchant lost 800 guilders; inside the bag were 800 guilders.", "story": "According to a story set in Frankfurt in 1506, a merchant lost a purse containing 800 guilders.", "problem": "Adds \"inside the bag were 800 guilders\" and says \"bag\" instead of \"purse\"."}, {"kind": "speech", "image": "Whoever finds it, let him bring it here; a reward of 100 guilders will be given.", "story": "a visiting merchant had lost 800 guilders and offered a reward of 100 for their return.", "problem": "Paraphrase; the announcement does not say the purse held 800."}, {"kind": "speech", "image": "You honest man! Here is your reward: 100 guilders as I promised.", "story": "When the merchant collected it, however, he offered only five guilders.", "problem": "The merchant pays 100 guilders; in the story he offers only five."}, {"kind": "speech", "image": "This is my money! There were 900 guilders in the bag; he must have taken some out!", "story": "the merchant claimed the purse had contained 900 guilders and accused the carpenter of taking 100.", "problem": "Does not say he accused the carpenter of taking 100."}, {"kind": "speech", "image": "Let the judge hear both sides. The one who claims 900 guilders must prove it; the one who found 800 must confirm it.", "story": "The judge asked the merchant to swear on the Bible that he had lost 900 guilders.", "problem": "The story has both men swear on the Bible, not a demand to prove and confirm."}, {"kind": "caption", "image": "The judge thinks carefully.", "story": "", "problem": "Caption is not in the story."}, {"kind": "speech", "image": "The bag had 800 guilders; the man claims it had 900. Since he cannot prove it, his claim is false.", "story": "The carpenter found 800 guilders. The merchant lost 900. Clearly, this cannot be the merchant’s purse.", "problem": "The judge calls the claim false; the story says the purse cannot be the merchant’s."}, {"kind": "speech", "image": "Therefore, the honest man shall have his reward: 100 guilders. The one who accuses without proof will pay the costs.", "story": "Since its owner has not been found, the carpenter may keep the 800 guilders. The merchant is free to continue searching for his 900.", "problem": "Verdict gives a 100-guilder reward; the story lets the carpenter keep the 800."}, {"kind": "moral", "image": "Greed traps a person. The one who denies the truth becomes a victim of his own lies; justice sides with the righteous.", "story": "Moral: Greed traps a person. The stingy person who denies the truth eventually becomes a victim of his own lies; justice is on the side of the righteous.", "problem": "\"The one\" instead of \"The stingy person\"; \"eventually\" is missing; \"justice sides with\" instead of \"justice is on the side of\"."}], "preview": "../../en/wisdom-stories/illustrations/just-verdict-of-the-frankfurt-judge.webp"}, {"stem": "he-would-not-have-given-so-little", "title": "The King Would Not Give So Little", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "He wouldn’t give so little", "story": "The King Would Not Give So Little", "problem": "Title drops “The King” and uses “wouldn’t.”"}, {"kind": "caption", "image": "I have a gold coin for you, but I will not give you so little.", "story": "A king offered a gold coin to a child he had taken a liking to, but the child refused.", "problem": "Image has the king refusing a small gift; the story has the child refuse the coin."}, {"kind": "speech", "image": "If I take it, my parents will ask where I got it from.", "story": "“My parents will ask where I stole it.”", "problem": "“where I got it from” instead of “where I stole it.”"}, {"kind": "speech", "image": "They will give it to you, won’t they?", "story": "“Tell them the king gave it to you.”", "problem": "Different speech."}, {"kind": "speech", "image": "No, my parents will never approve of such money. So I won’t take it.", "story": "“Then they really won’t believe me. They’ll say, ‘If the king had given you money, he wouldn’t have given so little.’”", "problem": "Different reason; the “so little” line is missing from the child’s speech."}, {"kind": "moral", "image": "Moral: Great things begin in the family, in proper upbringing. A child who grows up honestly becomes an honest person tomorrow.", "story": "Great things begin in the family, in proper upbringing. A child who grows up honestly becomes an honest person tomorrow.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/he-would-not-have-given-so-little.webp"}, {"stem": "fallen-teeth", "title": "The King’s Missing Teeth", "category": "Family and upbringing", "status": "Needs correction", "items": [{"kind": "title", "image": "Teeth falling out", "story": "The King’s Missing Teeth", "problem": "Title does not match."}, {"kind": "speech", "image": "I had a dream last night. All my teeth were falling out!", "story": "A king once dreamed that all his teeth had fallen out.", "problem": "Adds “last night” and “were falling out” instead of “had fallen out”."}, {"kind": "speech", "image": "If you dream this, it means all your family and loved ones will die, one by one.", "story": "Your Majesty, all your relatives will die before you.", "problem": "“Loved ones will die, one by one” is not “relatives will die before you.”"}, {"kind": "speech", "image": "Get out! How dare you! Leave at once!", "story": "The king was angered by the answer and sent him away.", "problem": "Those words are not in the story."}, {"kind": "speech", "image": "Bring me another interpreter!", "story": "Then he called another interpreter and asked the same question.", "problem": "Extra dialogue."}, {"kind": "speech", "image": "If you dream this, your worries and sorrows will fall away from you.", "story": "Your Majesty, you will outlive everyone else in your family.", "problem": "The second interpreter’s meaning is different."}, {"kind": "speech", "image": "Your words bring me joy and relief! Take this gift!", "story": "Pleased by the answer, the king rewarded him generously.", "problem": "Extra dialogue."}, {"kind": "moral", "image": "The same truth can be said harshly or delicately. Words can both hurt and heal.", "story": "The same truth can be spoken harshly or with tact. Words can wound or heal; wisdom lies in knowing how to speak them.", "problem": "“Delicately” for “with tact,” and the wisdom clause is missing."}], "preview": "../../en/wisdom-stories/illustrations/fallen-teeth.webp"}, {"stem": "lecturer-and-the-groom", "title": "The Lecturer and the Stablehand", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "Lecturer and groom", "story": "The Lecturer and the Stablehand", "problem": "Says groom instead of stablehand."}, {"kind": "speech", "image": "When I came here to give a talk, I found only one listener. Should I still go on?", "story": "No one else has come. Should I give the talk anyway?", "problem": "Different question."}, {"kind": "speech", "image": "Sir, I still feed one remaining horse. I put in the same care, give the same hay and water, and keep it as well as before.", "story": "Sir, I look after twenty horses. If nineteen wandered off and only one remained, I would still feed and water that one.", "problem": "Drops the nineteen-horses contrast."}, {"kind": "caption", "image": "A good lecturer speaks to one as he would to many.", "story": "Moral: Good speaking is not measured by length. What matters is whether your listener can understand and absorb what you say.", "problem": "Opposite of the stablehand's point about not giving one horse the feed for twenty."}, {"kind": "speech", "image": "So, should I speak to one listener the same way?", "story": "Well, how did you like it?", "problem": "The lecturer's question in the story is whether the listener liked the talk."}, {"kind": "speech", "image": "Yes. If you believe in what you're saying, speak as if many are listening. Even if only one person is there, they deserve your full attention.", "story": "I wouldn't give one horse enough feed and water for twenty.", "problem": "The stablehand's reply is reversed."}, {"kind": "moral", "image": "Speaking well is not talking too much, but making the idea understood and absorbed by the listener.", "story": "Moral: Good speaking is not measured by length. What matters is whether your listener can understand and absorb what you say.", "problem": "Close in meaning, but the words are not the story moral, and the panels contradict it."}], "preview": "../../en/wisdom-stories/illustrations/lecturer-and-the-groom.webp"}, {"stem": "lions-footprint", "title": "The Lion's Track", "category": "Parables and fables", "status": "Needs correction", "items": [{"kind": "title", "image": "The Lion’s Track", "story": "The Lion's Track", "problem": ""}, {"kind": "speech", "image": "Friend, in these woods, have you seen where a lion has passed?", "story": "Have you seen a lion or any lion tracks nearby?", "problem": "Asks where a lion has passed, not whether the woodcutter has seen the lion or its tracks."}, {"kind": "speech", "image": "I have seen the lion itself—let me show you where it is.", "story": "I’ve seen the lion itself. Come with me, and I’ll show you where it is.", "problem": "\"let me show you\" drops \"Come with me\"."}, {"kind": "speech", "image": "No, friend, never mind. I was just asking. I’m not going there.", "story": "No, thank you. It’s only the tracks I’m looking for, not the lion.", "problem": "The hunter does not say he wants only the tracks, not the lion."}, {"kind": "moral", "image": "A person is known not by pretensions, but by behavior in the moment of trial. Many seek a lion from afar, then retreat.", "story": "Moral: A person is known not by his pretensions, but by his behavior in the moment of trial. Many people \"look for a lion\" from afar, but when they come face to face, most of them retreat.", "problem": "Drops both \"his\"; the second sentence drops \"when they come face to face, most of them\"."}], "preview": "../../en/wisdom-stories/illustrations/lions-footprint.webp"}, {"stem": "grocery-shop-and-the-supermarket", "title": "The Little Shop and the Supermarket", "category": "Work, livelihood, and wealth", "status": "Needs correction", "items": [{"kind": "title", "image": "Grocery store and supermarket", "story": "The Little Shop and the Supermarket", "problem": "Title does not match."}, {"kind": "other", "image": "GREEN GARDEN GROCERY", "story": "a small grocery store", "problem": "Shop name is not in the story."}, {"kind": "other", "image": "We have butter – 60 dollars", "story": "Butter: 60 dollars.", "problem": "Adds “We have.”"}, {"kind": "other", "image": "SUPER MARKET", "story": "a supermarket", "problem": ""}, {"kind": "other", "image": "Butter – 70 dollars", "story": "Butter: 70 dollars.", "problem": ""}, {"kind": "other", "image": "FRESH QUALITY LOW PRICE BEST CHOICE SELECT", "story": "", "problem": "Signs are not in the story."}, {"kind": "caption", "image": "In our neighborhood, there was an elderly woman who ran a small grocery store. One day, a supermarket opened across the street from her shop. Both stores put a sign in front of their butter. The supermarket wrote «Butter — 70 dollars». The woman wrote «We have butter — 60 dollars». When the supermarket wrote «Butter — 50 dollars», she wrote «We have butter — 40 dollars».", "story": "The supermarket put up a sign: “Butter: 70 dollars.” The woman’s sign read “Butter: 60 dollars.” The next day, the supermarket lowered its price to 50. She promptly advertised 40.", "problem": "Woman’s signs add “We have,” and “the next day” is dropped."}, {"kind": "caption", "image": "The people of the neighborhood noticed this and asked the woman.", "story": "One of the residents of the neighborhood, concerned about this situation, turned to the woman", "problem": "Plural “people” and “asked” instead of one concerned resident."}, {"kind": "speech", "image": "Look, the supermarket sells its butter to make more profit. They think about money. Why do you keep making your butter cheaper and cheaper instead of thinking about profit?", "story": "Auntie, you shouldn’t compete with them. They can afford these price cuts. You’ll go out of business.", "problem": "The warning is rewritten."}, {"kind": "caption", "image": "The woman smiled gently and answered:", "story": "The woman replied without losing her composure", "problem": ""}, {"kind": "speech", "image": "I don't compete with anyone. My goal is simple. May my customers leave with a happy heart.", "story": "I don’t sell butter. I just want people to be able to buy it cheaply.", "problem": "She does not say she doesn’t sell butter."}, {"kind": "other", "image": "We have butter – 40 dollars", "story": "She promptly advertised 40.", "problem": "Adds “We have butter.”"}, {"kind": "moral", "image": "A person who lives asking who they helped, not what they gained, is different. The one who gives without expecting return gains the most.", "story": "A person who lives by the question “Whom did I help?” rather than “What did I gain?” is different. The one who gives without expecting anything in return is actually the one who gains the most.", "problem": "“who they helped” and “return” differ from the story’s questions and “anything in return.”"}], "preview": "../../en/wisdom-stories/illustrations/grocery-shop-and-the-supermarket.webp"}, {"stem": "liver", "title": "The Liver in Language", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "Liver", "story": "The Liver in Language", "problem": "Title drops \"in Language.\""}, {"kind": "caption", "image": "In our language, the word \"liver\" expresses deep love and attachment to people.", "story": "Why does the word for \"liver\" appear in expressions such as \"jan-jiyar,\" for a close and trusted friend; \"jiyarguşam,\" for a beloved child; \"agqıyar,\" for a coward; and \"jiyarparam,\" for someone dearly loved?", "problem": "States a general claim and does not ask the story's question."}, {"kind": "other", "image": "can-ciyer (close friend)", "story": "\"jan-jiyar,\" for a close and trusted friend", "problem": "Spelling can-ciyer instead of jan-jiyar, and \"trusted\" is missing."}, {"kind": "other", "image": "ciyarguşam (beloved, dear)", "story": "\"jiyarguşam,\" for a beloved child", "problem": "Spelling ciyarguşam, and the gloss is not \"a beloved child.\""}, {"kind": "other", "image": "agciyar (innocent person)", "story": "\"agqıyar,\" for a coward", "problem": "Gloss says innocent person instead of coward."}, {"kind": "other", "image": "ciyarparam (dear person)", "story": "\"jiyarparam,\" for someone dearly loved", "problem": "Spelling ciyarparam."}, {"kind": "caption", "image": "For our ancestors, the liver was considered the center of life; its spirit was known.", "story": "They associated warm blood with life and its absence with death, and came to regard the liver as a center of life.", "problem": "Adds \"its spirit was known\" and drops the blood explanation."}, {"kind": "caption", "image": "In ancient beliefs, it was thought that courage and life force came from the liver.", "story": "In ancient Greece, virtue and related qualities such as courage and determination were attributed to the liver.", "problem": "Says life force instead of virtue and determination, and does not name Greece."}, {"kind": "other", "image": "COURAGE STRENGTH SOURCE OF LIFE", "story": "courage and determination", "problem": "\"Strength\" and \"source of life\" are not the Greek attribution in the story."}, {"kind": "caption", "image": "Our ancestors honored the liver as the source of life, courage, and deep emotions.", "story": "In some cultures, the liver represented emotion before the heart took that role in expressions and literature.", "problem": "Combines claims the story keeps separate."}, {"kind": "other", "image": "CENTER OF LIFE", "story": "a center of life", "problem": ""}, {"kind": "other", "image": "SEAT OF EMOTIONS", "story": "the liver represented emotion", "problem": "\"Seat of emotions\" is not the story wording."}, {"kind": "other", "image": "COURAGE AND STRENGTH", "story": "courage and determination", "problem": "Strength replaces determination."}, {"kind": "other", "image": "SPIRITUAL ESSENCE", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Moral: Language does not arise by chance; behind every word there is a history, a belief. Our words are the memory of our people.", "story": "Moral: Language does not arise by chance; behind every word there is a history, a belief. Our words are the memory of our past.", "problem": "Last word is people instead of past."}], "preview": "../../en/wisdom-stories/illustrations/liver.webp"}, {"stem": "most-beautiful-places-in-the-world", "title": "The Most Beautiful Places", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "The most beautiful places in the world", "story": "The Most Beautiful Places", "problem": "Adds \"in the world.\""}, {"kind": "thought", "image": "Where are the most beautiful places in the world?", "story": "The most beautiful places to be are in the thoughts, prayers, and hearts of those you love.", "problem": "Turns the statement into a question."}, {"kind": "caption", "image": "They are in the thoughts of loved ones, in prayers and in warm hearts.", "story": "The most beautiful places to be are in the thoughts, prayers, and hearts of those you love.", "problem": "\"warm hearts\" and \"loved ones\" change the wording."}, {"kind": "moral", "image": "The most beautiful place is in the hearts and prayers of your loved ones. The true place is not an address, but love.", "story": "Moral: Our dearest place is not always somewhere on a map. It may be in a loved one's heart.", "problem": "Singular \"place,\" and \"not an address, but love\" is not the story moral."}], "preview": "../../en/wisdom-stories/illustrations/most-beautiful-places-in-the-world.webp"}, {"stem": "mother-of-pearl-flower", "title": "The Mother-of-Pearl Flower", "category": "Love and marriage", "status": "Needs correction", "items": [{"kind": "title", "image": "Mother-of-pearl Flower", "story": "The Mother-of-Pearl Flower", "problem": "Missing “The.”"}, {"kind": "caption", "image": "At the courtroom, an old couple is facing a lawsuit filed by their daughter-in-law whom they once raised with love.", "story": "An elderly couple, both in their eighties, stood before a divorce court after fifty years of marriage.", "problem": "A daughter-in-law’s lawsuit, not the couple’s own divorce."}, {"kind": "speech", "image": "Tell me, why do you want to evict your in-laws?", "story": "Why do you want a divorce?", "problem": "Eviction of in-laws, not divorce."}, {"kind": "speech", "image": "This man raised me, fed me, and educated me as a daughter...", "story": "He has worn me down", "problem": "Not the wife’s testimony."}, {"kind": "speech", "image": "He never said a harsh word, never raised his voice... He protected my heart instead of breaking it. I owe him everything.", "story": "For fifty years, he has made me weary of life.", "problem": "Opposite of the wife’s complaint."}, {"kind": "caption", "image": "After a while, the daughter-in-law realized her mistake. She saw that the most precious hearts are not those that break us, but those that protect us in silence.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "I never sought for wealth or luxury, I only wanted the happiness of my children... But they no longer see me.", "story": "We never had children, so I cared for it like a child.", "problem": "She speaks of children; the couple had none."}, {"kind": "speech", "image": "Do you have anything to say, sir?", "story": "Would you like to say anything?", "problem": "Close, but “sir” and the setting differ."}, {"kind": "speech", "image": "I only wish to return the kindness we once received. That's all I have.", "story": "Every night, I woke her and watched her tend the plant she loved like a child.", "problem": "Not the husband’s account."}, {"kind": "caption", "image": "The judge saw the truth behind their words and understood that their love was not for wealth, but for hearts. He dismissed the lawsuit.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Mom and Dad, you've always sheltered me with your love. Now it's my turn to care for you.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "One day, when I'm gone, don't cry for me — water the mother-of-pearl flower we once planted together... It will keep me alive in your hearts.", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Sometimes love is hidden not in words, but in care silently endured for years. Protect those you love.", "story": "Love is sometimes expressed through years of quiet care. Recognize that care, and remember to speak gently to those you love.", "problem": "“Protect those you love” replaces speaking gently."}], "preview": "../../en/wisdom-stories/illustrations/mother-of-pearl-flower.webp"}, {"stem": "mullah-and-the-scholar", "title": "The Mullah and the Scholar", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Mullah and the scholar", "story": "The Mullah and the Scholar", "problem": "Drops The and changes capitalization."}, {"kind": "caption", "image": "A foreign scholar came to the town and challenged the mullah. \"I have come from far away to test your wisdom,\" he said. The mullah smiled and agreed.", "story": "A visiting scholar came to Tamerlane’s court and asked, through an interpreter, to meet the country’s learned men.", "problem": "Different setting and challenge; no Tamerlane or interpreter."}, {"kind": "caption", "image": "The scholar drew a circle on the ground and said, \"Mullah, divide this into three parts, so that each part is equal to the others.\"", "story": "At the gathering, the scholar drew a circle on the ground. The Mullah divided it in half, then into quarters", "problem": "The scholar does not speak this instruction in the story, and the division is into quarters, not three equal parts."}, {"kind": "caption", "image": "Instead of using a rope or measuring tool, the mullah answered with clever gestures. He divided the circle with his finger, making three equal parts.", "story": "The Mullah divided it in half, then into quarters, claiming three for himself and offering one to the visitor.", "problem": "Wrong division and explanation."}, {"kind": "caption", "image": "The scholar took an egg from his pocket and handed it to the mullah.", "story": "The Mullah took an egg from his pocket and flapped his arms.", "problem": "In the story the Mullah produces the egg, not the scholar."}, {"kind": "speech", "image": "Place this egg so it stands upright without any support.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "The mullah sat the egg on the salt, and it stood up perfectly.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "I accept that your wit is great. But tell me—how did you know to use salt for the egg, and how did you know to divide the circle with signs and not with tools?", "story": "What did those gestures mean? We understood none of them.", "problem": "Different question and meaning."}, {"kind": "speech", "image": "How did you see it? I saw with my heart.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "How did you know it? I knew from experience.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "How did you think of it? I thought with my mind.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "How did you do it? I did with my wit.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "How did you make it stand? I made it stand with humility.", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Wisdom is not only in grand words. Clever signs and humble wit can answer even a proud scholar.", "story": "The same sign is read differently in each person’s world. We often see the other in the mirror of our own thoughts.", "problem": "Moral does not match."}], "preview": "../../en/wisdom-stories/illustrations/mullah-and-the-scholar.webp"}, {"stem": "builder-of-the-nest", "title": "The Nest Builder", "category": "Family and upbringing", "status": "Needs correction", "items": [{"kind": "title", "image": "The nest builder", "story": "The Nest Builder", "problem": ""}, {"kind": "caption", "image": "The female bird carefully builds the nest.", "story": "The female bird builds the nest.", "problem": "Extra word “carefully.”"}, {"kind": "caption", "image": "Tending the home and young.", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "It is the woman who builds the nest and keeps the family afloat. Her hard work should be seen and appreciated.", "story": "A woman’s work builds a home and holds a family together. That work deserves recognition and appreciation.", "problem": "Wording and meaning differ: “keeps the family afloat” and “seen” are not the moral."}], "preview": "../../en/wisdom-stories/illustrations/builder-of-the-nest.webp"}, {"stem": "dead-remain-in-life", "title": "The One Left Behind", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "The dead are the survivors", "story": "The One Left Behind", "problem": "Different title."}, {"kind": "caption", "image": "Two people who love with all their heart...", "story": "When two people love each other wholeheartedly", "problem": "\"with all their heart\" replaces \"wholeheartedly.\""}, {"kind": "caption", "image": "...one of them passes away, leaving this world.", "story": "and one dies", "problem": "Adds \"leaving this world.\""}, {"kind": "caption", "image": "When one of two who love with all their heart leaves, the real loss is the one who remains and yearns.", "story": "the survivor may feel that they, too, have ceased to live.", "problem": "Says the real loss is the one who remains, which is a different claim."}], "preview": "../../en/wisdom-stories/illustrations/dead-remain-in-life.webp"}, {"stem": "pawn-and-the-king", "title": "The Pawn and the King", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "Pawn and king", "story": "The Pawn and the King", "problem": "Missing \"The\" before Pawn and King."}, {"kind": "caption", "image": "Do not look down on a pawn.", "story": "Do not look down on a pawn.", "problem": ""}, {"kind": "caption", "image": "One day it may become a king.", "story": "One day, it may become a queen.", "problem": "King instead of queen."}, {"kind": "moral", "image": "Do not look down on the small, do not brag about rank. A pawn can become a king, and a king can be checkmated.", "story": "Moral: Do not underestimate the humble or place too much faith in rank. A pawn can rise, and a king can fall.", "problem": "\"brag\" and \"become a king\" replace the story wording; the story's queen line is missing."}], "preview": "../../en/wisdom-stories/illustrations/pawn-and-the-king.webp"}, {"stem": "gods-pleasure", "title": "The Pleasure of Allah", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "The Pleasure of Allah", "story": "The Pleasure of Allah", "problem": ""}, {"kind": "caption", "image": "Haja Ubaydullah Ahrar says:", "story": "Haja Ubaydullah Ahrar says:", "problem": ""}, {"kind": "caption", "image": "I explored every path that leads to Allah's pleasure and found the shortest to be bringing joy to others.", "story": "I have explored every path that leads to Allah’s pleasure. The shortest I have found is bringing joy to others.", "problem": "Tense and sentence structure differ."}, {"kind": "caption", "image": "I explored every path that leads away from Him and found the most dangerous to be breaking someone's heart.", "story": "I have explored every path that leads away from Him. The most dangerous I have found is breaking someone’s heart.", "problem": "Tense and sentence structure differ."}, {"kind": "speech", "image": "Don't break hearts!", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "Let your words be beautiful, your deeds kind, and hearts rejoice.", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "Bringing joy to others draws us closer to Allah, while breaking someone’s heart leads us away from Him.", "story": "Bringing joy to others draws us closer to Allah, while breaking someone’s heart leads us away from Him.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/gods-pleasure.webp"}, {"stem": "price-of-a-miracle", "title": "The Price of a Miracle", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "The Price of a Miracle", "story": "The Price of a Miracle", "problem": ""}, {"kind": "caption", "image": "One evening, eight-year-old Lisa hears her parents whispering about her little brother Oliver. The doctor says Oliver needs a very expensive operation abroad. Her parents are worried because they don't have enough money to save him.", "story": "Lisa was eight years old when she heard her parents talking about her younger brother, Oliver. All the little girl knew was that her brother was very sick and that her parents had no money for his treatment.", "problem": "Adds a doctor and an operation abroad."}, {"kind": "caption", "image": "Lisa decides to do something. She takes out her savings, counts every coin carefully, and puts each one into a jar. With pure faith, she prays that her little brother will get better and that a miracle will happen.", "story": "The girl went into her room and took out a glass jar that she had kept in a secret place in the closet.", "problem": "She already has the jar; she does not put coins into it in this scene, and she goes to the pharmacy."}, {"kind": "speech", "image": "Yes, what can I do for you?", "story": "What do you need, little girl? I’m talking to my brother.", "problem": "Different greeting."}, {"kind": "speech", "image": "This medicine is very expensive. I'm afraid we can't afford it.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "My dad is sick, and my brother needs an operation. An operation? How much does it cost?", "story": "He’s ill, and I need a miracle to make him better.", "problem": "She asks for a miracle, not the price of an operation, and her father is not the patient."}, {"kind": "speech", "image": "For Oliver? It's beyond our means. Unfortunately, we can't afford the operation abroad. It's far too expensive for us.", "story": "I’m sorry, but we don’t sell miracles here", "problem": "Different reply."}, {"kind": "speech", "image": "I have been saving for a long time. Please, take my savings and help my brother so he can get better.", "story": "I have money. If it isn’t enough, I’ll find more. Please just tell me the price.", "problem": "Wording differs."}, {"kind": "speech", "image": "Well, let me see… Yes, it's a lot. But your faith is so pure. I will do everything I can to help your brother get his operation.", "story": "One dollar and eleven cents. What a coincidence. That’s exactly the price of the miracle your brother needs.", "problem": "Omits the price and changes the reply."}, {"kind": "speech", "image": "How did you gather so much money? I saved every little coin I had, sir. It was small, but I saved it all with all my heart and faith for my little brother.", "story": "One dollar and eleven cents. That’s all, but I can try to get more.", "problem": "Amount and wording differ."}, {"kind": "speech", "image": "How much do you have? Please count it, sir. It may not be much, but I saved it with so much love. Let me count… Oh, my goodness! It's a large amount. But even if it isn't enough, your faith means so much. I will do everything I can. Have faith, and your brother will get the operation.", "story": "How much do you have?", "problem": "The man's replies do not match the story."}, {"kind": "caption", "image": "The kind doctor, moved by Lisa's faith, talks with people who can help. Together, they raise enough money, and Oliver is able to have his operation.", "story": "He performed the operation without charge", "problem": "Story is one surgeon operating free of charge, not a fundraising drive."}, {"kind": "caption", "image": "A short time later, Oliver is healthy and full of energy again. The whole family thanks God, the kind doctor, and everyone who helped. Lisa's pure faith and a child's heart filled with love made a miracle come true. This shows that when a child's faith meets human kindness, miracles can happen.", "story": "Lisa smiled. She knew the price: one dollar and eleven cents, and a little girl’s faith that her brother could be helped.", "problem": "Omits the price and changes the ending."}, {"kind": "moral", "image": "Faith is a powerful force. When a child's pure faith meets human kindness, a miracle can be born.", "story": "Faith is a powerful force. Sometimes, when a child’s pure faith meets the kindness of a human being, a miracle is born.", "problem": "Drops Sometimes, shortens the kindness phrase, and says can be born."}], "preview": "../../en/wisdom-stories/illustrations/price-of-a-miracle.webp"}, {"stem": "purple-jacket", "title": "The Purple Chepken", "category": "Love and marriage", "status": "Needs correction", "items": [{"kind": "title", "image": "Purple jacket", "story": "The Purple Chepken", "problem": "Title drops “chepken.”"}, {"kind": "caption", "image": "In ancient times, among Turks, a purple ceremonial jacket was placed in a girl's dowry chest as a sign of honor and respect.", "story": "According to an old account from Turkish villages, a bride’s dowry included a purple chepken, a traditional jacket. It lay at the bottom of her chest, with the hope that she would never need to wear it.", "problem": "Calls it a sign of honor; the story hopes she will never need to wear it."}, {"kind": "caption", "image": "That jacket is a symbol. It calls the community to protect and respect every woman.", "story": "If a woman put on the jacket and stood on a roof or in the village square, it was a public appeal for help.", "problem": "General symbol, not the public appeal for help."}, {"kind": "caption", "image": "When problems arise, people solve them with love, dignity, and respect.", "story": "The custom encouraged husbands to settle disagreements respectfully rather than through violence.", "problem": "Different wording."}, {"kind": "caption", "image": "In the community, the custom is clear: a woman's honor is not to be compromised.", "story": "", "problem": "Not that sentence in the story."}, {"kind": "caption", "image": "Daughters find support, their voices are heard, and together they stand strong.", "story": "Mothers and grandmothers gathered to defend her.", "problem": "Different wording."}, {"kind": "caption", "image": "Quarrels fade away, harmony remains.", "story": "Music and celebrations fell silent. Her distress was treated with the gravity of a death in the community.", "problem": "Says quarrels fade and harmony remains."}, {"kind": "caption", "image": "That person goes home with ease, knowing peace lives in their heart.", "story": "Her husband faced such disgrace that he could scarcely leave the house or show his face at the teahouse.", "problem": "The husband is at ease; the story says he is disgraced."}, {"kind": "moral", "image": "Protecting women is a duty of conscience. When society stands for dignity and respect, oppression finds no room.", "story": "Violence against women is unacceptable. When society considers it a duty of conscience to protect women, there is no room for oppression.", "problem": "Drops that violence is unacceptable; “dignity and respect” replaces the duty to protect women."}], "preview": "../../en/wisdom-stories/illustrations/purple-jacket.webp"}, {"stem": "red-dress", "title": "The Red Dress", "category": "Love and marriage", "status": "Needs correction", "items": [{"kind": "title", "image": "The red dress", "story": "The Red Dress", "problem": ""}, {"kind": "caption", "image": "A bright red dress hangs unused in Mother's wardrobe among faded clothes.", "story": "The red dress was hanging in my mother's wardrobe. It seemed to shine next to the worn, faded clothes she had worn all her life.", "problem": "“Bright” and “unused” are extra."}, {"kind": "speech", "image": "Mom, why did you never wear this dress? It's so beautiful.", "story": "What a beautiful dress, Mom. I’ve never seen you wear it.", "problem": "Different wording."}, {"kind": "speech", "image": "I never got the chance, dear.", "story": "I never have", "problem": "“Never got the chance” is extra."}, {"kind": "speech", "image": "You always thought of everyone else in the world, but never of yourself.", "story": "I believed a good woman should always put everyone else first.", "problem": "The daughter says this; in the story the mother does."}, {"kind": "speech", "image": "I thought my children, my husband, my family came first.", "story": "Their wishes mattered; mine could wait.", "problem": "Different wording."}, {"kind": "speech", "image": "Yes, Mom, you gave so much to all of us and never asked for anything.", "story": "But you did everything for us.", "problem": "Different wording."}, {"kind": "speech", "image": "You never tired, and never thought about yourself? Not once?", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "How many times did you put your own happiness aside?", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Oh, my dear, I never thought of that. In this world, I was always thinking of your father, of you, of the family. That's just who I am.", "story": "I used to think that denying myself everything here would bring happiness in the next world. Now I believe Allah wants us to enjoy life here too.", "problem": "She accepts the sacrifice; the story says she would live differently."}, {"kind": "speech", "image": "Mom, let me promise you something. This time, for you.", "story": "Promise me you won’t do what I did.", "problem": "The daughter offers a promise; the mother asks for one."}, {"kind": "moral", "image": "One who always forgets oneself may one day find nothing left to live for. Love others, but give yourself the right to live too.", "story": "Loving others should not mean abandoning your own life. Leave room for your needs and hopes too.", "problem": "Different wording."}], "preview": "../../en/wisdom-stories/illustrations/red-dress.webp"}, {"stem": "saying-the-word-in-its-place", "title": "The Right Words at the Right Time", "category": "Word, silence, and communication", "status": "Needs correction", "items": [{"kind": "title", "image": "Speaking the right words", "story": "The Right Words at the Right Time", "problem": "Different title."}, {"kind": "caption", "image": "Think carefully before you speak.", "story": "Choose your words well, and you will have less cause to apologize.", "problem": "Different wording."}, {"kind": "speech", "image": "I don't know anything about that!", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "I spoke without thinking.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "Speak at the right moment — with the right intention.", "story": "The right words at the right moment are precious.", "problem": "Adds “intention”; drops “precious.”"}, {"kind": "speech", "image": "You look so beautiful today! I'm glad you came.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "True kind words build friendship and bring joy!", "story": "", "problem": "Not in the story."}, {"kind": "moral", "image": "He who speaks the right words never needs to apologize.", "story": "Choose your words well, and you will have less cause to apologize.", "problem": "Says never apologize, not less cause to apologize."}, {"kind": "moral", "image": "The right word at the right time is precious.", "story": "The right words at the right moment are precious.", "problem": "“word”/“time” instead of “words”/“moment.”"}], "preview": "../../en/wisdom-stories/illustrations/saying-the-word-in-its-place.webp"}, {"stem": "road-to-the-cotton-field", "title": "The Road Beyond the Cotton Fields", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "The road to the cotton field", "story": "The Road Beyond the Cotton Fields", "problem": "Says the road to the field, not beyond the fields."}, {"kind": "caption", "image": "A new teacher arrives in a small village. He comes to teach the children.", "story": "We could barely read or write when a new teacher came to our village.", "problem": "Drops that the children could barely read or write, and does not name Aydin."}, {"kind": "other", "image": "School", "story": "", "problem": "Sign is not in the story."}, {"kind": "speech", "image": "In our village, there is only one road. It leads to the cotton field.", "story": "He asked where one village road led. \"To the cotton fields,\" we answered.", "problem": "The teacher states it; in the story the children answer."}, {"kind": "other", "image": "Cotton Field", "story": "To the cotton fields", "problem": "Singular Field."}, {"kind": "speech", "image": "That's the only road we know.", "story": "We had believed there was only one road open to us: the road to the fields.", "problem": "Different wording, and it is spoken before the letters."}, {"kind": "caption", "image": "The teacher opens their minds to many paths and future possibilities beyond just one field.", "story": "The letters changed that. We began to see where the other road might lead.", "problem": "The story's change comes from pen-pal letters, which are not shown."}, {"kind": "caption", "image": "He teaches them to read, write, and think.", "story": "He soon taught us to read and write.", "problem": "Adds \"think.\""}, {"kind": "other", "image": "Aa Bb Cc dog cat sun", "story": "", "problem": "Chalkboard words are not in the story."}, {"kind": "speech", "image": "One day, the teacher says, \"Your dreams are bigger than any field.\"", "story": "My children, never stop dreaming.", "problem": "Different sentence."}, {"kind": "caption", "image": "With education and skills, they can become doctors, engineers, teachers, and many more.", "story": "Some of us trained as doctors, others as engineers or teachers.", "problem": "Says they can become those jobs, and adds \"skills\" and \"many more.\""}, {"kind": "caption", "image": "That night, the teacher writes in his journal.", "story": "Years later, another letter came to us", "problem": "A private journal replaces the letters signed \"Your pen pal, Aydin.\""}, {"kind": "caption", "image": "Tomorrow... There will be different lives. Some will build, Some will heal, Some will teach, Some will invent, Every path is valuable in its own way. This is the true purpose of a teacher.", "story": "My children, never stop dreaming. Work hard and keep moving toward your goals. I congratulate you with all my heart. I always knew you could succeed.", "problem": "Different letter."}, {"kind": "moral", "image": "A teacher not only shows the way, but creates new paths. For one who can dream, the world is more than a single road.", "story": "Moral: A teacher not only showed the way to children, but also created new paths for them. For a person who can dream, the world no longer consists of just one path.", "problem": "Present tense, and \"more than a single road\" replaces \"no longer consists of just one path.\""}], "preview": "../../en/wisdom-stories/illustrations/road-to-the-cotton-field.webp"}, {"stem": "rose", "title": "The Rose", "category": "Love and marriage", "status": "Needs correction", "items": [{"kind": "title", "image": "Rose", "story": "The Rose", "problem": "Missing “The.”"}, {"kind": "other", "image": "TOO MUCH WATER", "story": "If you water a rose too much", "problem": ""}, {"kind": "other", "image": "TOO LITTLE WATER", "story": "if you water it too little", "problem": ""}, {"kind": "other", "image": "JUST THE RIGHT AMOUNT", "story": "if you water it right", "problem": "“Just the right amount” is not “right.”"}, {"kind": "other", "image": "WILTING", "story": "it will rot", "problem": "Too much water is labeled wilting; the story says it will rot."}, {"kind": "other", "image": "DRYING OUT", "story": "it will wither", "problem": "“Drying out” instead of “wither.”"}, {"kind": "other", "image": "THRIVING", "story": "it will live", "problem": "“Thriving” instead of “live.”"}, {"kind": "caption", "image": "Too much water causes wilting; too little water causes drying out; just the right amount helps it thrive.", "story": "If you water a rose too much, it will rot; if you water it too little, it will wither; if you water it right, it will live.", "problem": "Wilting, drying out, and thrive replace rot, wither, and live."}, {"kind": "caption", "image": "Love and upbringing require moderation.", "story": "Love and care need balance.", "problem": "Adds upbringing; “moderation” instead of “balance.”"}, {"kind": "speech", "image": "Love: It gives warmth, it connects.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Upbringing: It shows the way, it strengthens.", "story": "", "problem": "Not in the story."}, {"kind": "speech", "image": "Moderation: When the two come together, they create harmony.", "story": "", "problem": "Not in the story."}, {"kind": "other", "image": "MORAL", "story": "Moral:", "problem": ""}, {"kind": "moral", "image": "Moral: In love and in upbringing, moderation is key. Neither excessive pressure nor indifference — moderate care keeps it alive.", "story": "Love and care need balance. Too much control can harm, just as neglect can; attentive care helps life flourish.", "problem": "Upbringing, moderation, pressure, and indifference are not the moral."}], "preview": "../../en/wisdom-stories/illustrations/rose.webp"}, {"stem": "no-one-listens-to-constant-complainers", "title": "The Same Complaint", "category": "Morals and character", "status": "Needs correction", "items": [{"kind": "title", "image": "No one listens to a person who complains constantly.", "story": "The Same Complaint", "problem": "Title wording differs. The story says people stop listening, not this sentence."}, {"kind": "caption", "image": "A wise man told the same joke three times to the same people.", "story": "A wise man met a group who kept complaining about the same problems. He told them a joke, and everyone laughed.", "problem": "Drops the complaints and compresses three tellings into one line."}, {"kind": "caption", "image": "He told it the first time. Everyone laughed a lot.", "story": "He told them a joke, and everyone laughed.", "problem": "Extra 'a lot'."}, {"kind": "caption", "image": "He told it the second time. Some people smiled.", "story": "He repeated it, and only a few smiled.", "problem": "'Some people' replaces 'only a few'."}, {"kind": "caption", "image": "He told it the third time. No one laughed anymore.", "story": "The third time, no one reacted.", "problem": "'laughed anymore' replaces 'reacted'."}, {"kind": "caption", "image": "Just like jokes, complaints become boring too.", "story": "Repeating a complaint without seeking a solution can have the same effect. Eventually, people stop listening.", "problem": "Says complaints become boring; the story says people stop listening."}, {"kind": "moral", "image": "Moral: Repeated complaints, like repeated jokes, quickly become boring. Find a solution; no one listens to constant whining.", "story": "Moral: Repetition alone changes nothing. Give your energy to finding a way forward.", "problem": "Different moral: boring and whining, instead of repetition changing nothing."}], "preview": "../../en/wisdom-stories/illustrations/no-one-listens-to-constant-complainers.webp"}, {"stem": "sowing-millet-at-the-bottom", "title": "The Saplings That Bore Gold", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "Planting millet in the bottom", "story": "The Saplings That Bore Gold", "problem": "Different title; the story is about saplings and bags of gold."}, {"kind": "speech", "image": "Look, an old man is planting millet seedlings in the bottom (low-lying field). Why is he planting what he may not eat? What benefit is there in this?", "story": "Old father, why plant saplings at your age? You may never taste their fruit.", "problem": "Says millet in a low field instead of saplings the elder may never taste."}, {"kind": "speech", "image": "Your Majesty, we eat what our predecessors planted; the seedlings we plant today will be eaten by those who come after us. It is our duty to plant for those who will follow us.", "story": "That doesn't matter, my son. We ate the fruit of trees planted before our time. Those who come after us will eat from these.", "problem": "Address and wording differ."}, {"kind": "speech", "image": "A wise answer. Reward this man.", "story": "This answer pleased the king and he ordered the elder to be given a bag of gold.", "problem": "Does not mention the bag of gold."}, {"kind": "speech", "image": "Thank you, Your Majesty. What we plant today, Your Majesty, will be eaten by those who come after us.", "story": "You see? My trees have already borne fruit.", "problem": "Repeats the planting answer instead of the gold-as-fruit reply."}, {"kind": "speech", "image": "Indeed, it is our duty to plant for those who come after us. May God bless you, wise man!", "story": "Most trees bear fruit once a year. Mine have already borne fruit twice.", "problem": "The second bag of gold and the twice-a-year reply are missing."}, {"kind": "speech", "image": "Indeed, Your Majesty! A person does not live only for himself. We ate what those before us planted; we must plant for those who come after.", "story": "Your Majesty, we should leave. At this rate, he'll empty the treasury and plant millet on its floor!", "problem": "Gives the moral to the vizier and drops the treasury warning."}, {"kind": "moral", "image": "A person does not live only for himself. We ate what those before us planted; we must plant for those who come after.", "story": "Moral: A person does not live only for himself. We ate what those who came before us planted; we must plant for those who come after us.", "problem": "Drops \"who came\" and the final \"us.\""}], "preview": "../../en/wisdom-stories/illustrations/sowing-millet-at-the-bottom.webp"}, {"stem": "scarf-seller", "title": "The Scarf Seller", "category": "Work, livelihood, and wealth", "status": "Needs correction", "items": [{"kind": "title", "image": "Scarf seller", "story": "The Scarf Seller", "problem": "Drops “The.”"}, {"kind": "caption", "image": "It was a freezing night. The city was wrapped in cold and silence.", "story": "The city was bitterly cold that night.", "problem": "Adds silence and “freezing.”"}, {"kind": "speech", "image": "Ma'am, would you like to buy a scarf?", "story": "Would you buy one, sister?", "problem": "Ma'am replaces sister."}, {"kind": "speech", "image": "No, thank you.", "story": "No, thank you.", "problem": ""}, {"kind": "speech", "image": "Please, ma'am, it's very warm.", "story": "Please take one. You’ll need it.", "problem": "Different plea."}, {"kind": "speech", "image": "Please, ma'am, buy one. It will help me.", "story": "Please take one. You’ll need it.", "problem": "Different plea."}, {"kind": "speech", "image": "No, I don't need one, thank you.", "story": "No, I already have a scarf.", "problem": "She says she does not need one, not that she already has one."}, {"kind": "caption", "image": "The boy watched as she boarded the bus without buying a scarf. But he kept following the bus, hoping she might change her mind.", "story": "So the child had slipped the package into my pocket without my noticing.", "problem": "He follows the bus instead of slipping the scarf into her pocket."}, {"kind": "speech", "image": "What is it?", "story": "What’s this?", "problem": "“it” replaces “this.”"}, {"kind": "speech", "image": "It's nothing, ma'am. Just... please buy one. It will help me.", "story": "A gift, sister. You might need it.", "problem": "He denies the gift and asks her to buy."}, {"kind": "speech", "image": "How much is a scarf?", "story": "But how will you earn anything?", "problem": "She asks the price, which the story does not."}, {"kind": "speech", "image": "It's not about the price, ma'am. If you don't need it, that's okay.", "story": "Then take it as a gift.", "problem": "Different reply."}, {"kind": "speech", "image": "It's okay if you don't buy one, ma'am.", "story": "It’s all right", "problem": "He tells her not buying is fine; in the story she insists he take the money."}, {"kind": "speech", "image": "No, here. Take it. You deserve it.", "story": "Please take it", "problem": "She says he deserves it; the story is her paying for the gift."}, {"kind": "speech", "image": "Oh, thank you, ma'am!", "story": "Thank you, sister. May Allah be pleased with you.", "problem": "Drops the blessing and uses ma'am."}, {"kind": "speech", "image": "Wait, I can't accept this.", "story": "No, please. It’s my gift.", "problem": "Different refusal."}, {"kind": "speech", "image": "Please, ma'am. Take it, please. It'll keep you warm.", "story": "A gift, sister. You might need it.", "problem": "Different wording."}, {"kind": "speech", "image": "Be safe, ma'am. May God protect you.", "story": "", "problem": "Not in the story."}, {"kind": "caption", "image": "On the bus, she reached into her pocket and found the scarf she had refused between her things.", "story": "Before sitting down, I put my hand into my coat pocket to take out my phone. My hand touched a package.", "problem": "She finds it after the street scene; in the story she finds it before going back out."}, {"kind": "speech", "image": "May God bless you! May God bless you, you little one. You have given me more than gold.", "story": "You have so little, yet such a generous heart.", "problem": "Different thought, and “more than gold” is not in the story."}, {"kind": "moral", "image": "Sometimes the most helpless person shows the greatest generosity. The pure heart of a child turns material poverty into wealth.", "story": "Sometimes the most helpless person shows the greatest generosity. The pure heart of a child turns material poverty into wealth.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/scarf-seller.webp"}, {"stem": "secret-of-living-well-and-longevity", "title": "The Secret of a Long and Happy Life", "category": "Wisdom and life lessons", "status": "Needs correction", "items": [{"kind": "title", "image": "The secret to living well and living long", "story": "The Secret of a Long and Happy Life", "problem": "Different title."}, {"kind": "caption", "image": "Eat half of what you normally eat...", "story": "Halve your portions", "problem": "Adds \"of what you normally eat.\""}, {"kind": "caption", "image": "Walk twice as much as you normally do...", "story": "double your walks", "problem": "Adds \"as you normally do.\""}, {"kind": "caption", "image": "Laugh three times more than you normally do...", "story": "triple your laughter", "problem": "\"three times more\" is not \"triple,\" and it adds \"than you normally do.\""}, {"kind": "caption", "image": "Give unlimited love to everyone.", "story": "place no limit on your love", "problem": "Different wording, and \"Tibetan proverb\" is missing."}, {"kind": "moral", "image": "Moral: Eat little, walk a lot, laugh a lot, love endlessly. The secret to a long and happy life lies in simplicity and love.", "story": "Moral: Eat little, walk a lot, laugh a lot, love endlessly. The secret to a long and happy life lies in simplicity and love.", "problem": ""}], "preview": "../../en/wisdom-stories/illustrations/secret-of-living-well-and-longevity.webp"}, {"stem": "rotten-seed", "title": "The Seed That Grew", "category": "Family and upbringing", "status": "Needs correction", "items": [{"kind": "title", "image": "Rotten Seed", "story": "The Seed That Grew", "problem": "Title does not match."}, {"kind": "caption", "image": "A man despised his sickly son, called him a \"rotten seed,\" and sent him away to an orphanage, thinking he had no worth. He left him there.", "story": "After his wife died, a man sent his often-ill young son to an orphanage, dismissing him as hopeless.", "problem": "Omits the wife's death and adds despised and no worth."}, {"kind": "other", "image": "ORPHANAGE", "story": "", "problem": "Sign word is not a story sentence."}, {"kind": "caption", "image": "Years pass.", "story": "Years passed.", "problem": "Tense differs."}, {"kind": "speech", "image": "Is that my son? He looks so healthy, so confident. He's become such a fine young man. How did these words, \"rotten seed,\" ruin him?", "story": "I never thought you would recover like this. How did it happen?", "problem": "The father asks how the words ruined him, which reverses the recovery."}, {"kind": "other", "image": "SCHOOL", "story": "", "problem": "Sign is not a story sentence."}, {"kind": "speech", "image": "I was once called a \"rotten seed\" and sent away. But love and kind words here nurtured me and helped me grow. Now I want to return that love and kindness.", "story": "When you sent me away, you said a rotten seed could never grow. She adopted me and never stopped caring for me. She told me, ‘Every seed watered with love can grow.’", "problem": "Omits the woman's words and says he wants to return the love."}, {"kind": "moral", "image": "Words either build or destroy. Every seed watered with love will germinate.", "story": "Words either build or destroy. It is possible to elevate or destroy someone with a single word—every seed watered with love will germinate.", "problem": "Drops the single-word sentence."}], "preview": "../../en/wisdom-stories/illustrations/rotten-seed.webp"}, {"stem": "shepherds-word", "title": "The Shepherd's Word", "category": "Word, silence, and communication", "status": "Needs correction", "items": [{"kind": "title", "image": "The Shepherd's Word", "story": "The Shepherd's Word", "problem": ""}, {"kind": "caption", "image": "There was a time when the village chief entrusted his flock to a young man named Hasan, for he was an honest and trustworthy shepherd.", "story": "Once upon a time, in a village, there lived a poor but honest shepherd named Hasan.", "problem": "Says the chief already entrusted the flock; omits that Hasan was poor."}, {"kind": "speech", "image": "Hasan, listen to me. I'm entrusting this flock to you. Guard them well night and day all summer. If even one sheep is lost, I will consider it a breach of trust.", "story": "“Hasan, I hear you know the mountain pastures well. Look after my herd this summer. If the animals come back healthy and well fed, I’ll give you a cow.”", "problem": "No promised cow; threat about a lost sheep instead."}, {"kind": "caption", "image": "Hasan accepted the task. He spent the entire summer in rain and shine, from dawn till dusk, guarding the flock with care. He never left them alone, not even for a moment.", "story": "Hasan agreed. All summer, through rain and sunshine, he tended the herd and kept watch at night.", "problem": "Extra claim that he never left them."}, {"kind": "speech", "image": "Give the flock back to me. I want to see if you were truly honest and careful with it. Let's see if my trust in you was well placed.", "story": "“I never meant to give you a cow. I only said that to make you work harder. Besides, what would a poor man like you do with one?”", "problem": "Different speech; the broken promise is missing."}, {"kind": "speech", "image": "You are right, sir. Here is your flock. And I have one more request: you have my word and my conscience. A person without his word is not a person.", "story": "“You’re right that I’m poor. But I have a conscience, and I keep my word. You may have money, but if your word has no value, you are poorer than I am.”", "problem": "Different reply."}, {"kind": "caption", "image": "The words of the young man pleased the chief greatly. He called the villagers, praised Hasan's honesty and faithfulness, and said: A man who keeps his word and has a clear conscience is the true wealth of our village.", "story": "The story spread through the village. People lost respect for the chief and avoided doing business with him.", "problem": "The image has the chief praised; the story has the village lose respect for him."}, {"kind": "moral", "image": "A person's true wealth is not riches, but word, conscience, and trust.", "story": "Our true wealth lies in an honest conscience and a word others can trust.", "problem": "Different wording."}], "preview": "../../en/wisdom-stories/illustrations/shepherds-word.webp"}, {"stem": "drinking-the-sherbet-of-martyrdom", "title": "The Sherbet of Martyrdom", "category": "Faith and spirituality", "status": "Needs correction", "items": [{"kind": "title", "image": "Drinking the syrup of martyrdom", "story": "The Sherbet of Martyrdom", "problem": "“Drinking the syrup” instead of “The Sherbet”; “syrup” is not “sherbet.”"}, {"kind": "caption", "image": "In Ottoman times, before brave warriors set out for battle, they would drink Zamzam syrup and say prayers, asking Allah for strength and hoping for martyrdom.", "story": "According to this account, mortally wounded soldiers in Ottoman times were given sherbet made with Zamzam water, carried in small barrels, to sweeten their mouths before death.", "problem": "Shows warriors drinking before battle for strength; the story is sherbet given to the mortally wounded before death."}, {"kind": "caption", "image": "Drinking the syrup of martyrdom has come to mean this here.", "story": "This is said to be the origin of the expression “drinking the sherbet of martyrdom.”", "problem": "“syrup” for “sherbet,” and “has come to mean this here” is not the origin sentence."}, {"kind": "moral", "image": "Behind every expression there is a history, a sacrifice. Our words carry the memory of the past.", "story": "An expression can carry a history of sacrifice. The words we use preserve memories of the past.", "problem": "“Behind ever
