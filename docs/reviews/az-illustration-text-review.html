ın əllərini ovuclarına aldı və göz yaşlarına boğuldu.", "problem": "Artıq «sevimli» və «arasına»."}, {"kind": "caption", "image": "«Əsrlər ötsə də, Albrecht Dürerin (21.05.1471 – 06.04.1528) əsərləri bu gün də dünyanın ən nüfuzlu rəsm qalereyalarında nümayiş olunur. Onun qardaşına həsr etdiyi məşhur əsər dünyada «Dua edən əllər» adı ilə tanınır və hazırda Vyanadakı «Albertina» qalereyasında saxlanılır.»", "story": "Əsrlər keçsə də, Albrecht Dürerin (1471–1528) əsərləri dünyanın nüfuzlu qalereyalarında nümayiş olunur. Qardaşının fədakarlığı ilə əlaqələndirilən məşhur rəsmi “Dua edən əllər” adı ilə tanınır.", "problem": "Tarix tam günlə yazılıb; «fədakarlığı ilə əlaqələndirilən» yoxdur; Albertina əlavədir."}, {"kind": "other", "image": "ALBERTİNA WIEN", "story": "", "problem": "Hekayədə bu yazı yoxdur."}, {"kind": "other", "image": "Albrecht Dürer Dua edən əllər", "story": "“Dua edən əllər”", "problem": ""}, {"kind": "moral", "image": "Hər uğurun arxasında görünməyən bir fədakarlıq dayanır. O fədakarlığı görüb qiymətləndirmək insanlığın ən gözəl əlamətidir.", "story": "Hər uğurun arxasında çox vaxt görünməyən bir fədakarlıq dayanır. O fədakarlığı görmək və qiymətləndirmək insanlığın ən gözəl əlamətlərindəndir.", "problem": "«çox vaxt» yoxdur; «görmək və» əvəzinə «görüb»; «əlamətlərindəndir» əvəzinə «əlamətidir»."}], "preview": "../../az/wisdom-stories/illustrations/albrecht-durer.webp"}, {"stem": "friend-of-god", "title": "Allahın dostu", "category": "İman və mənəviyyat", "status": "Needs correction", "items": [{"kind": "title", "image": "Allahın dostu", "story": "Allahın dostu", "problem": ""}, {"kind": "caption", "image": "Yaşlı bir adam ayaqqabısı olmayan bir uşaq görür, ona rəhmi gəlir və uşağa bir cüt ayaqqabı alır.", "story": "Yaşlı bir adam ayaqqabısı olmayan bir uşaq görür, ona rəhmi gəlir və uşağa bir cüt ayaqqabı alır.", "problem": ""}, {"kind": "speech", "image": "Sən Allahsan?", "story": "Sən Allahsan?", "problem": ""}, {"kind": "speech", "image": "Yox, ay əvəzinə «yetkinlik çağındayam»."}, {"kind": "caption", "image": "17 yaşım tamam oldu — anam işdən yorğun gəlir. Sinif otağındayam, məktəbdəyəm, kafedəyəm; müəllimim yanımdadır.", "story": "On yeddi yaşım var — anam işdən yorğun qayıdır. Mən sinifdə, məktəbdə və ya kafedəyəm; dostlarım yanımdadır.", "problem": "«dostlarım» əvəzinə «müəllimim»."}, {"kind": "caption", "image": "20 yaşımda parlaq bir gəncəm — anam evdə yoxdur. Dostlarım yanımdadır.", "story": "İyirmi yaşım var — gəncəm. Anam evdə deyil, dostlarım yanımdadır.", "problem": "«parlaq bir gəncəm» hekayədə yoxdur."}, {"kind": "caption", "image": "23 yaşım tamam oldu, bir iş girdim — anam artıq evdədir. Mənsə işdəyəm.", "story": "İyirmi üç yaşım var — işə başlamışam. Anam artıq evdədir, mən isə işdəyəm.", "problem": "«işə başlamışam» əvəzinə «bir iş girdim»."}, {"kind": "caption", "image": "30 yaşa çatdım — düşünürəm... anamla ən son nə vaxt birlikdə gözəl vaxt keçirmişik? Bu işdə bir qəribəlik var!", "story": "Otuz yaşım var — düşünürəm: anamla son dəfə nə vaxt birlikdə gözəl vaxt keçirmişik? Burada bir qəribəlik var.", "problem": "«Burada» əvəzinə «Bu işdə»."}, {"kind": "caption", "image": "35-i haqladım, evliyəm — anam öz evində, mən öz evimdə.", "story": "Otuz beş yaşım var — evliyəm. Anam öz evindədir, mən öz evimdə.", "problem": "«Otuz beş yaşım var» əvəzinə «35-i haqladım»."}, {"kind": "caption", "image": "40 oldum artıq... — anam yolumu gözləyir. Eynilə mən uşaq olarkən onun yolunu gözlədiyim kimi...", "story": "Qırx yaşım var — anam yolumu gözləyir; mən uşaq olanda onun yolunu gözlədiyim kimi.", "problem": "«Qırx yaşım var» əvəzinə «40 oldum artıq»."}, {"kind": "caption", "image": "50-yə çatdım — özüm yaşlandım, amma heç yaşlanmayan bircə arzum qaldı: «Qəlbimi qəlbinə qovuşdurub ona sarılmaq, başımı dizləri üstünə qoymaq; yaşlanmış o yorğun dizləri üstünə...»", "story": "Əlli yaşım var — özüm yaşlanmışam, amma heç yaşlanmayan bir arzum qalıb: qəlbimi onun qəlbinə qovuşdurmaq, ona sarılmaq və başımı yorğun dizləri üstünə qoymaq.", "problem": "Söz sırası və «50-yə çatdım» dəyişib."}, {"kind": "caption", "image": "55 yaşımda bir ananın yanındayam, artıq daimi olaraq — övladlarımın anasının! Anam isə... dünyasını dəyişib, mən onun həsrətiylə yaşayıram...", "story": "Əlli beş yaşım var — artıq daim bir ananın, övladlarımın anasının yanındayam. Mənim anam isə dünyasını dəyişib; onun həsrəti ilə yaşayıram.", "problem": "Yaxın mətn; «Əlli beş yaşım var» əvəzinə «55 yaşımda»."}, {"kind": "caption", "image": "Adət etdiyimiz həyat axışında ən ciddi laqeydliyimiz övladlarımıza kifayət qədər vaxt ayıra bilməməyimizdir...", "story": "Həyatın gündəlik axarında ən ciddi laqeydliyimiz bəzən övladlarımıza və sevdiklərimizə kifayət qədər vaxt ayırmamağımızdır.", "problem": "«gündəlik axarında» və «sevdiklərimizə» düşüb; «ayırmamağımız» əvəzinə «ayıra bilməməyimizdir»."}, {"kind": "caption", "image": "Uşaqlar doymadan seyr edə biləcəyimiz möhtəşəm bir həyat filminin ən mühüm iştirakçılarıdır. Haldan-hala, rəngdən-rəngə, şəkildən-şəklə düşərək dəyişirlər. Onları izləməyə laqeyd yanaşdıqda, həyat filminin sürətlə dəyişən kadrları arasında ötüb-keçən anları heç vaxt geri bilməyəcəyik.", "story": "Uşaqlar gözümüzün önündə sürətlə dəyişən möhtəşəm həyat filminin ən qiymətli qəhrəmanlarıdır. Onların böyüməsini izləməsək, ötüb-keçən anları bir daha geri qaytara bilmərik.", "problem": "«ən qiymətli qəhrəmanlarıdır» əvəzinə «ən mühüm iştirakçılarıdır»; əlavə cümlələr var."}, {"kind": "caption", "image": "Həyatın ötüb keçmiş bütün anlarını yenidən seyr etmək üçün «stop», «start», «irəli», «geri» düymələri olan bir alətin mövcud olmadığını dərk edəndə, inşallah, gec olmasın!", "story": "Həyatda keçmiş səhnələri yenidən göstərən “dayan”, “başla”, “irəli” və “geri” düymələri yoxdur. Bunu anladığımız gün gec olmasın.", "problem": "«dayan», «başla» əvəzinə «stop», «start»; «inşallah» əlavədir."}, {"kind": "caption", "image": "Övladını bu gün sev, bu gün öp, qoxusunu çək. Bu gün tut əllərindən. Bu gün onunla ol. Onu bu gün seyr et. Bugünkü bölümünü qaçırsan, sabaha izləmədiyin bölümlərlə çəxməyəsən, ey sevimli ana... Ey gözəl ana...", "story": "Övladını bu gün sev, bu gün qucaqla, əlindən tut, yanında ol. Uşaqlığının bu gününü qaçırma: sabah artıq başqa bir gün olacaq.", "problem": "«qucaqla» və «Uşaqlığının bu gününü qaçırma» əvəzinə başqa cümlələr; «çəxməyəsən» oxunuşu şübhəlidir."}, {"kind": "caption", "image": "«Ana sevgisi təmənnasız, qoruyucu və isti bir sığınacaqdır. Təmənnasız olduğu üçün heç bir təsirə məruz qalmaz, əldə də edilə bilməz.»", "story": "“Ana sevgisi təmənnasız, qoruyucu və isti bir sığınacaqdır. Təmənnasız olduğu üçün onu məcburiyyətlə əldə etmək mümkün deyil.”", "problem": "İkinci cümlə dəyişib."}, {"kind": "moral", "image": "Ana sevgisi təmənnasız və əvəzsizdir. Sevdiklərinə bu gün vaxt ayır, çünki geri qaytara bilməyəcəyin yeganə şey vaxtdır.", "story": "İbrət: Ana sevgisi təmənnasız və əvəzsizdir. Sevdiklərinə bu gün vaxt ayır; çünki geri qaytara bilməyəcəyin ən qiymətli sərvət zamandır.", "problem": "«ən qiymətli sərvət zamandır» əvəzinə «yeganə şey vaxtdır»."}], "preview": "../../az/wisdom-stories/illustrations/mothers-love.webp"}, {"stem": "mother-and-son", "title": "Ana və oğul", "category": "Ailə və tərbiyə", "status": "Needs correction", "items": [{"kind": "title", "image": "«Ana və oğul»", "story": "Ana və oğul", "problem": ""}, {"kind": "caption", "image": "Adam əlindəki çamadanları divarın dibinə qoydu. Sonra dikəlib dərindən nəfəs aldı və anasına:", "story": "Adam əlindəki çamadanları divarın dibinə qoydu. Sonra dikəlib dərindən nəfəs aldı və anasına:", "problem": ""}, {"kind": "speech", "image": "Ana, bura çox gözəl yer imiş", "story": "«Ana, bura çox gözəl yer imiş»", "problem": ""}, {"kind": "speech", "image": "«Əlbəttə, gözəldir, oğlum»", "story": "«Əlbəttə, gözəldir, oğlum»", "problem": ""}, {"kind": "caption", "image": "Bir müddət hər ikisi susdu, otağı diqqətlə nəzərdən keçirdilər.", "story": "Bir müddət hər ikisi nmağa gedəcək. Üzü hisə bulaşmış adam isə qarşısındakının təmiz üzünü görüb özünün də təmiz qaldığını zənn edəcək.", "problem": "Səhv cavabdır and Hisə bulaşan instead of Səhvdir and Üzü hisə bulaşmış adam."}, {"kind": "speech", "image": "— Axı bunu artıq müzakirə etdik. Üzü təmiz olan gedəcək!", "story": "— Axı bunu indicə müzakirə etdik. Üzü təmiz olan gedəcək!", "problem": "artıq instead of indicə."}, {"kind": "speech", "image": "— Səhv cavabdır. İkisi də üzünü yumağa gedəcək...", "story": "— Yenə səhvdir. Hər ikisi gedib üzünü yuyacaq.", "problem": "Səhv cavabdır and İkisi də instead of Yenə səhvdir and Hər ikisi."}, {"kind": "speech", "image": "— Bu artıq aydındır. İkisi də üzünü yumağa gedəcək!", "story": "— İndi aydındır: hər ikisi gedəcək!", "problem": "Bu artıq aydındır and İkisi də üzünü yumağa gedəcək instead of İndi aydındır: hər ikisi gedəcək."}, {"kind": "speech", "image": "— Yanlış cavabdır. Heç kim üzünü yumağa getməyəcək...", "story": "— Xeyr. Heç biri getməyəcək.", "problem": "Yanlış cavabdır and Heç kim üzünü yumağa getməyəcək instead of Xeyr. Heç biri getməyəcək."}, {"kind": "speech", "image": "— Heç kim üzünü yumağa getməyəcək!", "story": "— Heç biri üzünü yumağa getməyəcək!", "problem": "Heç kim instead of Heç biri."}, {"kind": "speech", "image": "— Səhvdir... bir bacadan eyni vaxtda enən iki nəfər necə ola bilər ki, biri təmiz, biri çirkli üzlə çıxsın? Anlamırsanmı? Bu sualın əsasında mənasızlıq dayanır. Əgər həyatını mənasız suallara cavab axtarmağa sərf etsən, nə cavabların, nə də həyatın bir mənaya sahib olacaq...", "story": "— Yenə səhvdir, — ravvin sakitcə deyir. — Sokrat məntiqi üzrə mütəxəssis kimi özün düşün: eyni bacadan birlikdə enən iki nəfərdən necə ola bilər ki, yalnız birinin üzü hisə bulaşsın? Görmürsənmi, sualın özü mənasızdır? Həyatını mənasız suallara cavab axtarmağa sərf etsən, nə cavabların, nə də ömrün məna qazanar.", "problem": "Anlamırsanmı and bir mənaya sahib olacaq instead of Görmürsənmi and ömrün məna qazanar; Sokrat ": "«Mərhəmət»", "story": "Mərhəmət", "problem": ""}, {"kind": "caption", "image": "Soyuq bir qış gecəsi idi. İşdən evə qayıdırdım. Öndə sərxoş kimi görünən bir adam gördüm... Yaxınlaşdım. Yaşı otuzdan çox olardı. Çox təmiz, səliqəli geyinmişdi. Yoldan keçənlərin bəziləri ucadan içkinin zərərindən danışır, bəziləri isə istehza edib gülürdü.", "story": "Soyuq bir qış gecəsi idi. İşdən evə qayıdırdım. Öndə sərxoş kimi görünən bir adam gördüm. Sağa-sola əyilə-əyilə, taqətsiz halda yanındakı dirəyə sarılmışdı. Yaxınlaşdım. Yaşı otuzdan çox olardı. Çox təmiz, səliqəli geyinmişdi. Yoldan keçənlərin bəziləri ucadan içkinin zərərindən danışır, bəziləri isə istehza edib gülürdü.", "problem": ""}, {"kind": "speech", "image": "— Yaxşısınız mı, bir şeyə ehtiyacınız varmı?", "story": "— Özünüzü necə hiss edirsiniz? Köməyə ehtiyacınız varmı?", "problem": "Özünüzü necə hiss edirsiniz? Köməyə ehtiyacınız varmı əvəzinə Yaxşısınız mı, bir şeyə ehtiyacınız varmı."}, {"kind": "speech", "image": "— Xəstəyəm!.", "story": "— Xəstəyəm!…", "problem": ""}, {"kind": "caption", "image": "Yıxılmasın deyə qolumla belindən tutub taksi dayanacağına gətirdim... Axşam kəsilən qar yenidən yağırdı... Taksi tapmaqdan ümidimi üzmüşdüm ki, yanımızda bir taksi dayandı.", "story": "Yıxılmasın deyə qolumla belindən tutub taksi dayanacağına gətirdim. Taksi gözləməyə başladıq. Axşam kəsilən qar yenidən yağırdı; yavaş-yavaş buz bağlayan yollarda bir-biri ilə yarışan sahibsiz itlərdən başqa heç bir həyat əlaməti qalmamışdı. Taksi tapmaqdan ümidimi üzmüşdüm ki, yanımızda bir taksi dayandı.", "problem": "sahibsiz itlər cümləsi düşüb."}, {"kind": "other", "image": "TAKSİ DAYANACAĞI", "story": "taksi dayanacağına", "problem": ""}, {"kind": "caption", "image": "Xəstəni arxa oturacağa oturdub xəstəxanaya yollandıq. Həkimlər... dərhal lazım olan hər şeyi etdilər... Növbətçi həkim bildirdi ki, biz xəstəni ən azı donmaqdan xilas etmişik. Gənc isə... sadəcə bizə baxıb gülümsəyirdi.", "story": "Xəstəni arxa oturacaqda əyl tel ağzından çıxır. Nəhayət, teli üçüncü heykəlin qulağına salır, amma tel içəridə ilişib qalır.", "problem": "Third statue says the wire stayed in the heart; the story says it stuck inside."}, {"kind": "caption", "image": "Müdrik hökmdara bir məktub yazdı.", "story": "Hökmdar heykəlləri göndərən qonşusuna belə cavab yazdırıb göndərir:", "problem": "The wise man writing the letter is not the story."}, {"kind": "caption", "image": "Bu üç heykəl üç fərqli insan tipinin rəmzidir. Eşitdiyini: bir qulağından alıb o birindən verən; dərhal ağzından qaçıran; ürəyində saxlamağı bacaran.", "story": "Bu üç heykəl üç fərqli insan tipinin rəmzidir. Eşitdiyini: bir qulağından alıb o birindən verən; dərhal ağzından qaçıran; ürəyində saxlamağı bacaran.", "problem": ""}, {"kind": "caption", "image": "Müdrik məktubuna belə davam etdi.", "story": "", "problem": "This lead-in is not in the story."}, {"kind": "caption", "image": "Ən dəyərli insan eşitdiyini ürəyində bir sirr kimi saxlaya bilən və yalnız yeri gələndə, zamanında söyləyən insandır.", "story": "Ən dəyərli insan eşitdiyini ürəyində bir sirr kimi saxlaya bilən və yalnız yeri gələndə, zamanında söyləyən insandır.", "problem": ""}, {"kind": "moral", "image": "Ən dəyərli insan eşitdiyini ürəyində sirr kimi saxlaya bilən və sözü yalnız yerində deyəndir. Söz tutmaq da bir hikmətdir.", "story": "Eşitdiyini sirr kimi saxlamaq, lazım olanda da yerində söyləmək insana dəyər qazandırır. Dilini saxlamağı bacarmaq da müdriklikdir.", "problem": "Moral wording differs, including “Söz tutmaq da bir hikmətdir.”"}], "preview": "../../az/wisdom-stories/illustrations/three-statues.webp"}, {"stem": "three-landscapes", "title": "Üç mənzərə", "category": "Hikmət və həyat dərsləri", "status": "Needs correction", "items": [{"kind": "title", "image": "«Üç mənzərə»", "story": "Üç mənzərə", "problem": ""}, {"kind": "caption", "image": "Səfərə çıxan bir gənc yolda üç qəribə mənzərə ilə üzləşir.", "story": "Səfərə çıxan bir gənc yolda üç qəribə mənzərə ilə üzləşir.", "problem": ""}, {"kind": "caption", "image": "Birinci mənzərə: əkinçilər buğda səpir, buğda dərhal boy verir, amma əkinçilər tarlanı yandırırlar.", "story": "Əvvəl görür ki, bir neçə adam tarlaya buğda səpir. Dənlər torpağa düşən kimi cücərib boy atır, sünbül verir. Amma əkinçilər məhsulu yığmaq əvəzinə tarlanı yandırırlar.", "problem": "Condensed paraphrase."}, {"kind": "caption", "image": "İkinci mənzərə: bir adam iri bir daşı qaldıra bilmir. Daha bir neçə daş qoyduqdan sonra onu daha asan qaldırır.", "story": "Sonra bir adamın böyük bir daşı qaldırmağa çalışdığını görür. Adam daşı qaldıra bilmir. Üstünə ikinci daşı qoyanda qaldırır, üçüncünü qoyanda isə yükünü daha asan götürür.", "problem": "Paraphrase; second and third stones are not stated."}, {"kind": "caption", "image": "Üçüncü mənzərə: ağ bir qoyun üzərinə minən insanları daşıyır. Başqaları isə arxalarından qaçır, amma onlara çata bilmirlər.", "story": "bir adam qoyunun belinə minib, bir neçə adam da onun çiyninə dırmaşıb. Qoyun sürətlə qaçır; bir neçə adam da onların dalınca nə qədər yüyürsə də, çata bilmir.", "problem": "Adds a white sheep and drops the shoulder-climbing detail."}, {"kind": "caption", "image": "Gənc şəhərin qapısında nurani bir alimlə qarşılaşır və gördüklərini ona danışır.", "story": "Giriş qapısının yanında nurani bir qoca görüb salam verir.", "problem": "Says alim; the story says nurani bir qoca."}, {"kind": "speech", "image": "Əvvəlcə yaxşılıq edən, sonra da etdiyi yaxşılığı ora-bura danışıb dəyərini heçə endirənlər.", "story": "Əvvəlcə yaxşılıq edən, sonra da etdiyi yaxşılığı ora-bura danışıb dəyərini heçə endirənlər.", "problem": ""}, {"kind": "speech", "image": "İlk dəfə günah işləmək insan üçün çox ağırdır. Amma insan günah işləyəndən sonra tövbə etməsə, sonrakı günahlar ona çox yüngül gəlir.", "story": "ilk dəfə günah işləmək insan üçün çox ağırdır. Amma insan günah işləyəndən sonra tövbə etməsə, sonrakı günahlar ona çox yüngül gəlir. Tövbəsi olmayan bir günah başqa bir günah üçün açılmış qapıdır.", "problem": "Last story sentence is missing."}, {"kind": "speech", "image": "Qoyun cənnət heyvanıdır və belinə minənləri cənnətə daşıyır. Qoyuna ilk minənlər alimlərdir... Onların dalınca qaçanlar isə inancsızlar, dinsizlərdir.", "story": "qoyun cənnət heyvanıdır və belinə minənləri cənnətə daşıyır. Qoyuna ilk minənlər alimlərdir. Alimlərin çiynindən asılanlar hər təbəqədən olan möminlərdir. Onların dalınca qaçanlar isə inancsızlar, dinsizlərdir.", "problem": "Ellipsis drops the sentence about believers hanging from the scholars’ shoulders."}, {"kind": "moral", "image": "Danışıb dəyəri heçə endirilən yaxşılıq, tövbəsiz günah və doğru rəhbərin ardınca getmək — hər biri həyatın gizli bir dərsidir.", "story": "Danışıb dəyəri heçə endirilən yaxşılıq, tövbəsiz günah və doğru rəhbərin ardınca getmək — hər biri həyatın gizli bir dərsidir.", "problem": ""}], "preview": "../../az/wisdom-stories/illustrations/three-landscapes.webp"}, {"stem": "three-questions", "title": "Üç sual", "category": "Hikmət və həyat dərsləri", "status": "Needs correction", "items": [{"kind": "title", "image": "Üç sual", "story": "Üç sual", "problem": ""}, {"kind": "speech", "image": "Səndən üç sual soruşuram. Sabah cavab verə bilməsən, səni cəzalandıracağam. Sualım budur: Allah nəyə dözür? İkincisi: Allah nəyi gizlədir? Üçüncüsü: Allah haqqı bilənləri nəyə görə vəzir edir?", "story": "Sənə üç sual verirəm. Sabaha kimi cavabını tapmasan, saraydan qovulacaqsan. Birincisi: Allah nəyə təhəmmül edir? İkincisi: Allah hansı həqiqətləri gizli saxlayır? Üçüncüsü: Allah Öz hikməti və qüdrəti ilə hansı işləri gerçəkləşdirir?", "problem": "Questions and the punishment differ from the story."}, {"kind": "speech", "image": "Eybi yoxdur, cahan mənim bu suallara cavabım yoxdur. Sabah cavab verə bilməsəm, sarayı tərk edəcəyəm.", "story": "Vəzir nə qədər baş sındırsa da, suallara cavab tapa bilmir.", "problem": "This speech is not in the story."}, {"kind": "speech", "image": "Hökmdar <script>
const rows = JSON.parse(document.getElementById("data").textContent);
const counts = {all: rows.length, "Needs correction": 0, "Requires manual review": 0, Matches: 0};
rows.forEach(r => { counts[r.status] = (counts[r.status] || 0) + 1; });
const summary = document.getElementById("summary");
summary.innerHTML = Object.entries(counts).map(([k, n]) =>
  `<button type="button" data-status="${k}" aria-pressed="${k === "all"}">${k === "all" ? "All illustrations" : k}: ${n}</button>`
).join("");
let status = "all";
const q = document.getElementById("q");
function esc(s) {
  return String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function badge(st) {
  const cls = st === "Matches" ? "match" : st === "Needs correction" ? "fix" : "review";
  return `<span class="badge ${cls}">${esc(st)}</span>`;
}
function render() {
  const query = q.value.trim().toLowerCase();
  const shown = rows.filter(r => (status === "all" || r.status === status) &&
    (!query || (r.title + " " + r.stem + " " + r.category).toLowerCase().includes(query)));
  document.querySelectorAll("[data-status]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.status === status)));
  const list = document.getElementById("list");
  if (!shown.length) { list.innerHTML = '<p class="empty">No illustrations in this view.</p>'; return; }
  list.innerHTML = shown.map(r => {
    const items = (r.items || []).map(it => {
      const bad = String(it.problem || "").trim();
      return `<tr class="${bad ? "bad" : ""}">
        <td class="kind">${esc(it.kind)}</td>
        <td>${esc(it.image)}</td>
        <td>${esc(it.story)}</td>
        <td class="problem">${bad ? esc(it.problem) + (it.story ? "<br><strong>Use: </strong>" + esc(it.story) : "") : ""}</td>
      </tr>`;
    }).join("");
    return `<article>
      <div class="head">
        <div><h2>${esc(r.title || "(no story title)")}</h2><div class="stem">${esc(r.stem)}${r.category ? " · " + esc(r.category) : ""}</div></div>
        ${badge(r.status)}
      </div>
      <div class="layout">
        <img class="preview" src="${esc(r.preview)}" alt="" />
        <table>
          <thead><tr><th>Where</th><th>On the image</th><th>Story text</th><th>Discrepancy and correction</th></tr></thead>
          <tbody>${items || "<tr><td colspan='4'>No readable text was recorded.</td></tr>"}</tbody>
        </table>
      </div>
    </article>`;
  }).join("");
}
document.body.addEventListener("click", (e) => {
  const b = e.target.closest("[data-status]");
  if (!b) return;
  status = b.dataset.status;
  render();
});
q.addEventListener("input", render);
render();
</script>
