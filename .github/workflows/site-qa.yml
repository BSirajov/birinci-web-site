name: Site QA

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: site-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    name: Structural QA + API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/requirements.txt
            api/requirements.txt

      - name: Install tool + API deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
          pip install -r api/requirements.txt

      - name: Site tooling regression tests
        run: |
          php -v
          php -r "exit(extension_loaded('fileinfo') ? 0 : 1);"
          PHP_BIN="$(command -v php)" python -m pytest tools -q

      - name: Verify all reviewed story sources
        run: python tools/audit_story_sync.py --output docs/reviews/ci-story-sync.json

      - name: German integration and preservation
        run: python tools/test_german_wisdom.py

      - name: API auth + config-guard tests
        working-directory: api
        run: python -m pytest app -q

      - name: Build local deployment tree
        run: python tools/build_deployment.py

      - name: Structural full-site QA
        run: python tools/full_site_qa.py --structural

      - name: Crawl publish links and check authoring-file exclusions
        run: python tools/audit_publish_tree.py --output docs/reviews/ci-publish-tree.json
