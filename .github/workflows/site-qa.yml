name: Site QA

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: site-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    name: Structural QA + API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/requirements.txt
            api/requirements.txt

      - name: Install tool + API deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
          pip install -r api/requirements.txt

      - name: Publish-policy unit tests
        run: python -m pytest tools/test_publish_policy.py -q

      - name: API auth + config-guard tests
        working-directory: api
        run: python -m pytest app/test_auth.py app/test_config_guard.py -q

      - name: Build local deployment tree
        run: python tools/build_deployment.py

      - name: Structural full-site QA
        run: python tools/full_site_qa.py --structural
